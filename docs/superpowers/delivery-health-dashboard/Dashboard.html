      var ov = m.gateOverride;
      return "<tr><td>" + esc_(m.name) +
        '<div class="cellSub">' + esc_(m.coverageOf || "") + "</div></td>" +
        '<td><input type="number" min="0" max="100" step="1" id="gate_' + id +
          '" value="' + cur + '" style="width:70px"> %</td>' +
        "<td>" + def + "%" + (ov
          ? '<div class="cellSub" title="' + esc_("Overridden by " + (ov.by || "an admin") +
              " on " + (ov.at || "an earlier date") + ". Restore returns the agreed value.") +
            '">✎ changed ' + esc_(ov.at || "") + "</div>"
          : "") + "</td>" +
        '<td><button class="btn" onclick="restoreGate_(\'' + id + '\')"' +
          (ov ? "" : " disabled") + ' title="put the agreed registry value back">Restore</button></td></tr>';
    }).join("");

  return '<details class="gedit"><summary>⚙ Coverage gates (admin)</summary>' +
    '<p class="cellSub">The attribution a metric needs before it is treated as reliable. ' +
    "Raising a gate makes the dashboard stricter; lowering one makes a weak number look " +
    "settled — the agreed value stays on screen so the difference is never invisible. " +
    "Saving rebuilds the model for everyone.</p>" +
    '<div class="gwrap"><table class="hyg"><tr><th>Metric</th><th>Gate</th>' +
    "<th>Agreed default</th><th></th></tr>" + rows + "</table></div>" +
    '<div style="margin-top:8px"><button class="btn" onclick="saveGates_()">Save gates</button> ' +
    '<span id="gateMsg" class="cellSub"></span></div></details>';
}

/** Resets one input to its registry default, then saves. */
function restoreGate_(id) {
  var el = document.getElementById("gate_" + id);
  if (el) el.value = "";           // empty = clear the override server-side
  saveGates_();
}

function saveGates_() {
  var msg = document.getElementById("gateMsg");
  var ms = (MODEL.meta.registry || {}).metrics || {};
  var payload = {};
  var bad = null;
  Object.keys(ms).forEach(function (id) {
    var el = document.getElementById("gate_" + id);
    if (!el) return;
    var v = String(el.value).trim();
    if (v === "") { payload[id] = null; return; }   // clear → registry default
    var n = Number(v);
    if (!(n >= 0 && n <= 100)) bad = ms[id].name;
    payload[id] = n;
  });
  if (bad) { msg.textContent = "⚠️ " + bad + ": gate must be between 0 and 100."; return; }
  msg.textContent = "Saving…";
  google.script.run
    .withSuccessHandler(function () {
      // The gates decide what every tile publishes, so nothing on screen is
      // trustworthy until the model is rebuilt against the new numbers.
      msg.textContent = "✅ Saved — reloading with the new gates…";
      loadData(true);
    })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveGateOverrides(payload);
}

/** The gap definitions, extracted so the gaps queue and the Executive
    data-trust strip render from ONE list (spec §4.4/§5.4). `key` marks the
    four the strip shows. */
/** A row measured at 100% is not a gap. `retireWhenFull` opts a row into being
    hidden while that holds — see the block above typeFieldRetired_ for why the
    rule is data-driven rather than a deletion. A null value (nothing measured,
    or a feed that is not connected) is NOT solved and always stays. */
function gapRetired_(g) {
  return !!g.retireWhenFull && g.value !== null && g.value >= 1;
}

/** One line under the queue naming every check that is passing at 100% and has
    therefore left the table. Renders nothing when none have. */
function gapsSolvedHtml_(h, pp) {
  var done = gapsRetired_(h, pp);
  if (!done.length) return "";
  return '<div class="cellSub" style="margin-top:8px">✔ <b>Solved and retired from the queue:</b> ' +
    done.map(function (g) { return esc_(g.name.replace(/^…and\s+/, "")); }).join("; ") +
    ' — 100% across this window. <span title="Still measured on every rebuild. Each of these ' +
    'returns to the queue on its own, with no deploy, the moment one record fails.">' +
    "Still measured ⓘ</span></div>";
}

/** Live gaps — what the queue and the trust strip render. */
function gapsRows_(h, pp) {
  return gapsRowsAll_(h, pp).filter(function (g) { return !gapRetired_(g); });
}

/** Rows retired at 100%, so the queue can name them instead of silently
    dropping them. A check that disappears without a word reads as a check
    somebody removed. */
function gapsRetired_(h, pp) {
  return gapsRowsAll_(h, pp).filter(gapRetired_);
}

function gapsRowsAll_(h, pp) {
  return [
    // The row NAMES the population it measures. Under the Dictionary scope this
    // is epics / milestones / Client-Commitment-labelled work — not "delivery
    // work" — and the distinction is the whole finding: Stories and Tasks carry
    // due dates at ~73%, epics at ~11%, so a label saying "delivery work" sent
    // people looking for a problem that isn't where the number says it is.
    { key: "due", name: "Due date on the work On-Time measures",
      value: h.res > 0 ? h.resDue / h.res : null, gate: 0.80,
      detail: h.resDue + " of " + h.res + " " + onTimeScopeWord_(),
      blocks: "On-Time Delivery — the metric cannot publish without it",
      note: "Measured against the mutable Jira Due Date — a baselined committed date does not exist yet. " +
            "Under the Metrics Dictionary scope this counts epics and milestones, which carry due dates far " +
            "less often than the Stories and Tasks the previous scope measured." },
    // SPLIT IN TWO (2026-08-03). Reported as one number, ~46% \"unattributed\"
    // read as a Jira hygiene failure and was routed to the Jira admin queue,
    // where there was nothing to fix: the assignee is nearly always THERE, it
    // just doesn't match a roster name. Two gaps, two owners, two fixes.
    { name: "Resolved work carries a Jira assignee",
      value: h.res > 0 ? h.resAssigned / h.res : null, gate: 0.95,
      detail: (h.res - h.resAssigned) + " of " + h.res + " have no assignee at all",
      blocks: "all four delivery cards",
      note: "This one is a Jira discipline gap — an issue closed with nobody on it." },
    // RETIRES ITSELF AT 100% (user decision 2026-08-06 — "we have solved all
    // discrepancies"). Same rule and same reasoning as the 🧬 matrix's
    // retireWhenFull column: off screen while it is clean, back the moment one
    // record fails, and measured on every rebuild either way. This row is the
    // dashboard's only view of a loss that was 49% of all records two days ago,
    // so it is hidden, never deleted.
    // ⚠ THE NOTE ON THIS ROW USED TO SAY "leavers" AND THAT WAS WRONG — it
    // survived from before the 2026-08-04 attrition decision and contradicted
    // the policy that had already removed them. A director read "N named
    // assignees do not match the roster" next to it and concluded the residue
    // was attrition records (user, 2026-08-07). It cannot be: a proven former
    // employee is removed TWICE before this row is counted — their issues never
    // enter the leaver-scoped feed hygieneBuckets_ reads, and they are held out
    // of attribIdx as belt-and-braces. The row now says so on its face and
    // prints the attrition count beside it, because a reader who has to scroll
    // back to the 👥 line to learn that is a reader who guesses instead.
    { key: "attr", name: "…and that assignee resolves to a roster person", retireWhenFull: true,
      value: h.resAssigned > 0 ? h.resAttr / h.resAssigned : null, gate: 0.95,
      // Plain text only — hygieneRow_ runs `detail` through esc_(), so markup
      // here would render as literal tags.
      detail: (h.resAssigned - h.resAttr) + " of " + h.resAssigned +
              " named assignees match no roster row — these are NOT former employees" +
              (leaverIssues_() ? "; attrition is excluded separately (" + leaverIssues_() + " issues)" : ""),
      blocks: "all four delivery cards",
      note: "Attrition is NOT what this counts. Former employees are identified from the roster and " +
            "dropped from the whole feed before this row is measured, so no leaver the roster can " +
            "recognise is in this number. What is left is a name the roster has never seen under any " +
            "alias: a contractor or vendor account, an automation account, or a display name spelled " +
            "differently from the roster (nickname, married name, given-name order). One attrition case " +
            "CAN hide here — a former employee whose Jira display name never matched their roster row — " +
            "because the attrition test resolves names through the same index that is failing. " +
            "Fixed in the name index, not by Jira admin. Unmatched items are excluded from every card " +
            "under every filter." },
    { name: "Region tagged on delivery work",
      value: h.res > 0 ? h.resRegion / h.res : null, gate: 1.00,
      detail: (h.res - h.resRegion) + " of " + h.res + " land in Unassigned",
      blocks: "Region × Team comparison — the executive layer's whole premise",
      note: "Blank ≠ Other. Unassigned is a tagging gap tracked under PR-01; Other is a value we haven't mapped yet." },
    { name: "Team tagged on delivery work",
      value: h.res > 0 ? h.resTeam / h.res : null, gate: 1.00,
      detail: (h.res - h.resTeam) + " of " + h.res + " untagged",
      blocks: "Region × Team comparison",
      note: "Open decision #1: is the Jira Team picker the same vocabulary as Tempo team names?" },
    { key: "est", name: "Estimate on closed epics",
      value: h.epics > 0 ? h.epicsEst / h.epics : null, gate: 0.70,
      detail: h.epicsEst + " of " + h.epics + " closed epics estimated",
      blocks: "Forecast Accuracy",
      note: "The estimate is mutable — one revised mid-flight scores as accurate." },
    { key: "logged", name: "Logged time on estimated epics",
      value: h.epicsEst > 0 ? h.epicsTime / h.epicsEst : null, gate: 0.70,
      detail: (h.epicsEst - h.epicsTime) + " estimated epics carry no worklog at all",
      blocks: "Forecast Accuracy",
      note: "Counted toward coverage only — a hygiene failure must not score as a forecasting miss." },
    { name: "Billable / non-billable classification on tracked hours",
      value: pp.tracked > 0 ? pp.trackedCov / pp.tracked : null, gate: 0.90,
      detail: r1_(pp.tracked - pp.trackedCov) + "h of " + r1_(pp.tracked) + "h unclassified",
      blocks: "Billable Utilization",
      note: "Unclassified hours leave BOTH sides of the rate — they are never counted as 0% billable." },
    { name: "Capacity from the Tempo feed (not estimated)",
      value: pp.weeks > 0 ? (pp.weeks - pp.capEst) / pp.weeks : null, gate: 0.95,
      detail: pp.capEst + " of " + pp.weeks + " person-weeks fell back to a default",
      blocks: "the utilization denominator" },
    // ── SRSO BINDING (2026-08-07) ──────────────────────────────────────────
    // NOT a Jira-hygiene gap and not a PM failure: this row measures OUR reader
    // against the documented process. The services runbook (BL02 step B2.6)
    // tells the PM to bind delivery work to the sales order with a Jira
    // COMPONENT named for the SRSO; "Jira Backlog.js" derives Billing Type from
    // FIX VERSIONS alone. Work bound exactly as instructed therefore exports as
    // "Untagged" — by our own reckoning, delivered work that cannot be
    // recognised against a milestone. If this row is red, the fix is a reader
    // change on our side, not a campaign to make PMs tag differently, and the
    // note says so — an owner sent to the wrong team is worse than no owner.
    //
    // retireWhenFull: at 100% every sales-order-bound item is visible to the
    // billing reader and there is nothing to look at.
    { key: "srso", name: "Sales-order binding our billing reader can see", retireWhenFull: true,
      // srsoMeasurable === 0 → null → "not connected", NEVER a clean 100%: a
      // cached v28 payload and an export without the Components column both
      // land here, and neither is evidence that the binding is fine.
      value: h.srsoMeasurable > 0 && h.srsoAny > 0 ? h.srsoSeen / h.srsoAny : null, gate: 0.95,
      // THREE reasons this can be blank, and they are different findings:
      //   column absent  → we did not look
      //   nothing bound  → we looked and NO delivered work is tied to a sales
      //                    order by either route, which is itself the finding
      //                    (and must not be reported as "not connected", or
      //                    someone goes hunting for a column that is there)
      //   otherwise      → the ratio, which is the actual measurement
      detail: h.srsoMeasurable === 0
        ? "Components column not in this export — the runbook binding cannot be checked"
        : h.srsoAny === 0
        ? "none of the " + h.srsoMeasurable + " delivered items in this window is bound to a " +
          "sales order by EITHER route — the column is present, the bindings are not"
        : h.srsoCompOnly + " of " + h.srsoAny +
          " sales-order-bound items are bound by COMPONENT only and read as untagged",
      blocks: "Billing Type — untagged delivered work cannot be recognised against a milestone",
      note: "Two bindings exist and they disagree. The runbook (BL02 B2.6) tells the PM to name a " +
            "Jira COMPONENT after the sales order; the exporter classifies Billing Type from FIX " +
            "VERSIONS (fixVersion ~ SRSO*). Work bound the documented way is invisible to the " +
            "classifier. If this is red the fix is in the exporter, not with the PMs — they " +
            "followed the process. Same SRSO token rule on both sides, so a mismatch here is " +
            "about the FIELD, never about two regexes disagreeing." },
    { name: "Reopen events + CSAT feed",
      value: null, gate: 1.00,
      blocks: "Quality / Rework — the tile stays suppressed until both are live",
      note: "The Jira changelog is not exported, no Rework link type is defined, and the CSAT API is not connected." },
    { name: "Engagement key + rate card (Jira ↔ NetSuite ↔ contract)",
      value: null, gate: 0.80,
      blocks: "every dollar translation — no cost rate means no margin",
      note: "Open decision #3: cost rate basis — individual actual, role blended, or region blended?" },
  ];
}

/**
 * The Actions tab's field/requirements half (spec §5.3/§5.4): the 🧬 by-type
 * matrix FIRST (which issue type to go fix), the gaps queue SECOND (whether a
 * metric can publish at all). Both are deliberately whole-population — the
 * dashboard filters never apply here, which is why the scope chip stays off
 * for this half and the caption below says so explicitly instead.
 */
function renderHygPanel_() {
  var panel = document.getElementById("hygPanel");
  var A = analysisHead_();
  var done = A.done;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  // Window = the GLOBAL analysis-period picker (user decision 2026-08-04: the
  // main filters are universal — one selection drives every surface, so this
  // view's own date stepper is gone).
  //
  // A PLANNING window falls back to the last complete period and says so
  // (2026-08-06). Field fill is counted over work that has been RESOLVED, so a
  // week that has not happened has a zero denominator everywhere — and this
  // view rendering 0% across the board would be read as the feed collapsing,
  // which is the exact misreading the complete-periods-only rule was written
  // to prevent. The IN-FLIGHT window is allowed through: a partly-filled month
  // is a real, actionable fill rate, and it is the one a manager can still
  // improve before the month closes.
  var head = A.phase === "plan" ? (done[done.length - 1] || { label: "—", isos: [] }) : A.head;
  var fellBack = A.phase === "plan";
  var isos = head.isos;
  var winLabel = head.label;
  var h = hygieneFor_(isos), pp = hygienePeopleFor_(isos);

  // Window banner. The header's Week/Month/Quarter chips choose the UNIT and
  // the period picker beside them chooses the WINDOW — one selection drives
  // this view like every other surface (the view's own stepper is gone).
  var nav =
    '<div class="hnav"><span class="hper">' + esc_(winLabel) +
    (A.phase === "now" ? " ◐" : "") + "</span>" +
    '<span class="cellSub" title="One selection drives every view: the header chips choose the unit, the period picker chooses the window.">' +
      (fellBack
        ? "planning window selected — field fill needs resolved work, so this is the last complete " + unit
        : A.phase === "now"
        ? "the current " + unit + " so far — fill can still be improved before it closes"
        : "window follows the header period picker") + "</span></div>";

  var gaps = gapsRows_(h, pp);

  panel.innerHTML =
    '<p class="cellSub">Whole-population view — the dashboard filters deliberately do not apply. ' +
    "A well-tagged region does not make the feed publishable.</p>" + nav +
    leaverNoteHtml_() +
    // 🧬 matrix FIRST (spec §5.3): which issue TYPE to go fix — its own <h4>.
    typeMatrixHtml_(isos, winLabel) +
    // Gaps queue SECOND (spec §5.4): whether each metric can publish at all —
    // the metric owner's view, one level up from "which type".
    '<div style="margin-top:14px">' +
    '<h4>🧪 Gaps queue</h4>' +
    // Coverage-colour key (user request 2026-08-04). "Its gate, never 100%"
    // is the caption's whole job: a 90% gate met at 91% is green, and a reader
    // grading rows against 100% would escalate rows that are already done.
    '<div class="cellSub" style="margin:10px 0 4px">Coverage colour — each row is graded against its <b>own gate</b>, never against 100%: ' +
    keySwatch_("var(--pos)", "✔ green = at or above the gate") + " · " +
    keySwatch_("var(--amber)", "▲ amber = under 10 pts below it") + " · " +
    keySwatch_("var(--warn)", "✖ red = 10+ pts below, or the feed is not connected") + "</div>" +
    '<div class="gwrap"><table class="hyg"><tr><th>Gap</th><th>Coverage</th><th>Gate</th>' +
    "<th>Blocks</th></tr>" +
    gaps.map(hygieneRow_).join("") + "</table></div>" +
    gapsSolvedHtml_(h, pp) +
    gateEditorHtml_() +
    '<p class="cellSub">Every figure above covers <b>' + esc_(winLabel) + "</b>" +
      " — pick another period in the header to walk the history. " +
      "Gates come from the metric registry (v" +
      esc_((MODEL.meta.registry || {}).version || "—") + "). " +
      (MODEL.meta.suppressBelowGate === true
        ? "A metric more than 10 points below its gate is suppressed rather than published (FR-2.2)."
        : "A metric below its gate is published with a low-confidence chip rather than suppressed.") + "</p>" +
    "</div>";
}

// ══════════════════════════════════════════════════════════════════════════
// 🧬 FIELD FILL BY ISSUE TYPE (spec 2026-08-04-hygiene-by-issue-type-design.md)
//
// The gaps table above says HOW MUCH is missing, org-wide, pooled. This says
// WHICH TYPE to go and fix — a different question with a different reader: the
// gaps table belongs to whoever owns the metric, this belongs to whoever owns
// the tickets. Hence all-roles by design: fixing a ticket's fields is a task
// for anyone who touches that issue type, not a privileged action.
//
// Two populations behind one toggle, and OPEN is the default: a due date added
// to an open ticket moves next quarter's number, one added to a closed ticket
// is archaeology. Resolved explains today's cards; open is the work queue.
// ══════════════════════════════════════════════════════════════════════════

/** Column set, in display order. `gate` is null where the registry has no gate
    for that field — those cells report fill without grading it. */
var TYPE_FIELDS_ = [
  // `denom: "dueN"` — the managers' three rules (2026-08-10, Code.js dueExpected_).
  // Note this is NOT the same shape as `time` below: logged time drops every
  // unstarted ticket, while the due date drops only the unstarted AND UNDATED ones,
  // because a date somebody has set is a commitment whatever the status column says.
  { k: "due",      label: "Due date",   gateOf: "onTime", denom: "dueN",
    feeds: "On-Time",  needs: "gatesOnTime",
    note: "On the open backlog, measured over work that has STARTED (status category In Progress) or already carries a date. An undated To Do ticket is ignored — not delayed, not missing; a dated one is tracked whatever its status. Resolved work is always expected to carry a date. Epics are audited separately at 100% (🚩 panel above)." },
  { k: "assigned", label: "Assignee",   gate: 0.95,
    feeds: "all four cards", needs: null },
  // `denom: "attrN"` — graded over records that HAVE an assignee only. Without
  // it, an unassigned record reads as a roster-join failure, which un-retires
  // this column the moment unassigned work enters the export (spec §4.6, D12).
  { k: "attr",     label: "→ roster",   gate: 0.95, denom: "attrN",
    feeds: "all four cards", needs: null, retireWhenFull: true },
  { k: "est",      label: "Estimate",   gateOf: "forecast",
    feeds: "Forecast", needs: "gatesForecast" },
  // `denom` — the Logged column grades over STARTED work only (Code.js
  // timeExpected_). On the open backlog a To Do ticket is outside the question:
  // time is logged as work is done, so an untouched ticket carrying no worklog
  // is the process working. Dividing by n instead put 782 unstartable rows in a
  // 1,116-row queue and reported 23% where the started population reads 45%.
  { k: "time",     label: "Logged",     gateOf: "forecast", denom: "timeN",
    feeds: "Forecast", needs: "gatesForecast",
    note: "Measured over work that has STARTED (status category In Progress) plus all resolved work. Unstarted tickets are excluded from both halves — not counted as gaps." },
  // Region and Team READ near-0% until the exporter's multi-select fix ("Jira
  // Backlog.js" v3.7.0, 2026-08-04) — the field was populated, the export was
  // dropping it. They are still footnoted, because a uniform column reads as one
  // field gap with one owner rather than as seven separate per-type failures, and
  // the uniformity test below is computed from the data either way.
  // The prereq ID is named; the PERSON is not. Same rule as the gaps table and
  // the suppressed tiles (2026-08-03): accountability lives in the requirements
  // doc, because a standing table of names against failures in a widely-read
  // view reads as a blame board rather than a work queue.
  { k: "region",   label: "Region",     gate: 1.00, feeds: "Region compare", needs: null, pr01: true },
  { k: "team",     label: "Team",       gate: 1.00, feeds: "Team compare",   needs: null, pr01: true },
];

/** Gate for a field, from the registry when it owns one. Never re-typed here —
    an admin gate override has to reach this table like it reaches the tiles. */
function typeFieldGate_(f) {
  if (f.gateOf) {
    var m = (MODEL.meta.registry || {}).metrics || {};
    return m[f.gateOf] ? m[f.gateOf].coverageGate : null;
  }
  return f.gate === undefined ? null : f.gate;
}

// ── 👥 PEOPLE SIGNALS (Actions roster, spec 2026-08-05 §5.2) ─────────────────
// Person grain. The three METRIC-GATING fields (due / est / logged) share their
// predicates and gates with the 🧬 matrix — one truth, so the two surfaces can
// never disagree about a record. From 2026-08-06 the roster carries three MORE
// fields that the matrix does not: they are per-person commercial obligations,
// not per-type field fill, and the block below says why they are graded here and
// why they stay out of both `overall` and the matrix's impact sort.

// ── WHY THREE MORE FIELDS, AND WHY THEY ARE GRADED (2026-08-06) ──────────────
// The first three fields gate a PUBLISHED metric, which is what earns them a
// colour. The three added below gate none — so grading them looks like the
// mistake typeImpact_ documents at length about Region and Team, and it is worth
// saying exactly why it is not.
//
// Region and Team are ROLLUP DIMENSIONS. No individual's job is to fill them,
// they are owned centrally under PR-01, and grading them painted an identical
// red on every row — one org-wide gap wearing 40 costumes.
//
// Epic link, Billing Type and Start Date are PER-TICKET ACTS BY THE ASSIGNEE,
// and each one gates money rather than a tile:
//   link  — hours that cannot be rolled to an engagement cannot price the next
//           one. This is the pricing input, and it is the reason the audit
//           (2026-08-05) called out ~1,023 delivered sub-tasks parented to a
//           Story instead of an epic.
//   bill  — untagged delivered work cannot be recognised against a milestone.
//           Graded over its OWN denominator (billN): tristate, so an export
//           without the column is ungraded, never 0%.
//   start — a missed due date with no start date cannot be diagnosed. "Started
//           late" and "ran long" need opposite conversations, and only this
//           field tells them apart.
// They are deliberately NOT added to the 🧬 matrix's typeImpact_ sort, which
// must keep ranking by fixable gaps on metric-gating fields only.
//
// One gate for all three, because none of them has a registry gate to inherit.
// 80% matches the coverage gate the registry uses for the metrics that DO
// publish, so the roster grades on one consistent bar.
var SIGNAL_OPS_GATE_ = 0.80;

var SIGNAL_FIELDS_ = [
  // `denom: "dueN"` — graded over STARTED work on the open backlog (Code.js
  // dueExpected_), managers' feedback 2026-08-10. A ticket nobody has picked up
  // is not a commitment yet, and dating it to satisfy a dashboard is how due
  // dates stop meaning anything. Falls back to n on a pre-v32 bucket, which is
  // also exactly right for the resolved half, where dueN === n by construction.
  { k: "due",    label: "Due date", gateOf: "onTime", denom: "dueN", denomFallbackN: true,
    tip: "Share carrying a due date. On the open backlog this is measured over work that has STARTED (status category In Progress) OR already carries a date, plus all resolved work. An undated To Do ticket is ignored entirely — not delayed, not missing — while a dated ticket is tracked whatever its status. Same predicate and gate as the 🧬 matrix, so the two surfaces can never disagree about a record. Epics are audited separately (🚩): every epic is expected to carry a date, To Do included." },
  { k: "est",    label: "Estimate", gateOf: "forecast",
    tip: "Share carrying an original estimate." },
  // `denomFallbackN` — a bucket from before v24 has no loggedN. Fall back to n,
  // which reproduces exactly what that payload measured, rather than reading 0
  // and blanking the column. Deliberately NOT set on `bill`: billN absent means
  // the export never carried a Billing Type, and falling back there would grade
  // a column nobody measured — the fabricated-finding failure billN exists to
  // prevent. One flag, two opposite right answers.
  { k: "logged", label: "Logged",   gateOf: "forecast", denom: "loggedN", denomFallbackN: true,
    tip: "Share carrying logged time (Jira Time Spent > 0), measured over work that has STARTED — status category In Progress — plus all resolved work. A ticket nobody has picked up yet is expected to carry no worklog, so it counts in neither half rather than as a gap against this person." },
  { k: "link",   label: "Epic link", gate: SIGNAL_OPS_GATE_, ops: true,
    tip: "Share whose hours can be rolled up to a programme — an Epic Key, or a parent that chains to one. Unlinked work is invisible to engagement costing, so it cannot inform the next quote. Epics count as linked by definition: they are the container. Graded, but does not move the Overall column." },
  { k: "bill",   label: "Billable tag", gate: SIGNAL_OPS_GATE_, denom: "billN", ops: true,
    tip: "Share tagged Billable (SRSO) or Internal rather than Untagged. Untagged delivered work cannot be recognised against a revenue milestone. Measured only over rows where the export carried a Billing Type — an older export shows this ungraded, not 0%. Graded, but does not move the Overall column." },
  { k: "start",  label: "Start date", gate: SIGNAL_OPS_GATE_, ops: true,
    tip: "Share carrying a start date. Without it a late delivery cannot be diagnosed — 'started late' and 'ran long' are different problems with different fixes, and the due date alone cannot tell them apart. Graded, but does not move the Overall column." },
];

// ── WHY `ops` FIELDS ARE GRADED BUT DO NOT MOVE `overall` ────────────────────
// `overall` is not just a row's own summary: it drives the Executive pulse's
// 🟢/🟡🔴 counts and the default biggest-opportunity sort. Letting a field that
// gates no published metric into it means one org-wide fill gap turns every
// person red at once — and then the pulse reports a data-collection habit as if
// it were delivery performance, which is the precise failure the Region/Team
// exclusion in typeImpact_ exists to prevent.
//
// So the three commercial-readiness columns carry their own RAG cell — visible,
// sortable, exportable, which is what makes them manageable per person — while
// `overall` stays a verdict about the metrics the dashboard actually publishes.
// Fold them in later if it turns out fill is high enough that the reds are
// individual rather than universal; that is a one-word change (drop `ops`).
function sigGradesOverall_(f) { return !f.ops; }

function signalMinN_() { return (MODEL.meta && MODEL.meta.signalMinN) || 4; }

/**
 * Grade one signal. Below signalMinN_ the cell is "small": grey, ungraded,
 * % still shown — one missing due date on one ticket must never render the
 * same red as fifteen on forty (review 2026-08-05 #1; the roster's
 * STD_MIN_PERIODS). "na" = nothing to grade at all.
 */
function gradeSignal_(hit, n, gate) {
  if (!n) return { cls: "na", pct: null, miss: 0 };
  var pct = hit / n;
  var out = { pct: pct, miss: n - hit };
  if (n < signalMinN_()) { out.cls = "small"; return out; }
  if (gate === null)      { out.cls = "na";    return out; }
  out.cls = pct >= gate ? "good" : pct >= gate - 0.10 ? "warn" : "bad";
  return out;
}

var SIGNAL_RANK_ = { bad: 3, warn: 2, good: 1 };

/**
 * One row per person in the filtered population. Returns null on a pre-v22
 * payload (renderers show the same "Not in this payload" state as the matrix).
 * Population follows the 🧬 matrix's Open ↔ Resolved toggle (STATE.typePop);
 * isos scope the resolved half only — a backlog has no history to walk.
 * Interns excluded like every ranking surface (oppRows_ precedent).
 */
function personSignalRows_(isos) {
  var ph = MODEL.personHygiene;
  if (!ph) return null;
  // Every counter personHygieneBuckets_ emits, summed the same way. Listed once
  // so a new bucket field cannot be added to the payload and silently dropped
  // here — the previous form named due/est/logged inline in three places.
  var SUM_KEYS = ["n", "due", "dueN", "est", "logged", "loggedN", "link", "start", "bill", "billN",
                  "estSec", "spentSec", "wip"];
  function blank_() {
    var o = {};
    SUM_KEYS.forEach(function (k) { o[k] = 0; });
    return o;
  }
  // Per-field denominators that stand in for n on a bucket that predates them.
  // Resolved BEFORE summing, because the substitution is per BUCKET: a window
  // spanning a schema change must add each week's own denominator.
  var FALLBACK_N_ = SIGNAL_FIELDS_.filter(function (f) { return f.denomFallbackN; })
                                  .map(function (f) { return f.denom; });
  function val_(b, k) {
    if (b[k] === undefined && FALLBACK_N_.indexOf(k) !== -1) return Number(b.n) || 0;
    return Number(b[k]) || 0;
  }
  var byName = {};
  if (STATE.typePop === "resolved") {
    (ph.resolved || []).forEach(function (b) {
      if (isos.indexOf(b.iso) === -1) return;
      var t = byName[b.person] || (byName[b.person] = blank_());
      SUM_KEYS.forEach(function (k) { t[k] += val_(b, k); });
    });
  } else {
    (ph.open || []).forEach(function (b) {
      var t = byName[b.person] = blank_();
      SUM_KEYS.forEach(function (k) { t[k] = val_(b, k); });
    });
  }
  var m = (MODEL.meta.registry || {}).metrics || {};
  // Interns are IN this list (user 2026-08-06 — they were filtered out entirely,
  // while the Utilization card told readers their profiles stayed here). What
  // they do not get is a grade: see the "learn" downgrade below.
  return filteredPeople_().map(function (p) {
    var t = byName[p.name] || blank_();
    var sig = {}, worst = 0, miss = 0;
    SIGNAL_FIELDS_.forEach(function (f) {
      // Registry gate when the field has one, else the field's literal gate —
      // routed through typeFieldGate_ so the roster and the 🧬 matrix resolve
      // gates through ONE function. A field with neither reads ungraded.
      var gate = f.gateOf ? (m[f.gateOf] ? m[f.gateOf].coverageGate : null)
                          : typeFieldGate_(f);
      // `denom` lets a tristate field grade over the rows that were actually
      // measured (bill → billN). Without it an absent export column reports 0%
      // for everyone, which is a fabricated finding rather than a missing one.
      var n = f.denom ? (t[f.denom] || 0) : t.n;
      var g = gradeSignal_(t[f.k], n, gate);
      sig[f.k] = g;
      if (SIGNAL_RANK_[g.cls] && sigGradesOverall_(f)) {
        worst = Math.max(worst, SIGNAL_RANK_[g.cls]);
        miss += g.miss;
      }
    });
    var overall = worst === 3 ? "bad" : worst === 2 ? "warn" : worst === 1 ? "good" : "na";
    if (p.isIntern) {
      // 🎓 SHOWN, NEVER GRADED. The percentages stay — that is the whole point,
      // an intern should be able to read their own record and learn the standard
      // — but the RAG verdict, the missing-count and the overall grade all go.
      // miss:0 is load-bearing: it feeds the opportunity sort's tie-break, so a
      // graded intern would otherwise rank as the org's biggest problem on day
      // one. Grading someone against a bar they were never set is how a metric
      // imposes a change on the one person who is here to be taught.
      SIGNAL_FIELDS_.forEach(function (f) { if (sig[f.k].cls !== "na") sig[f.k].cls = "learn"; });
      return { p: p, n: t.n, sig: sig, overall: "learn", miss: 0, t: t };
    }
    return { p: p, n: t.n, sig: sig, overall: overall, miss: miss, t: t };
  });
}

/** 🟢/🟡/🔴 counts for the Executive pulse. Small-n rows are counted apart —
    NEVER in bad (they would inflate the reds with statistical noise). */
function signalSummary_(isos) {
  var rows = personSignalRows_(isos);
  var out = { good: 0, warn: 0, bad: 0, small: 0, learn: 0, na: 0, available: rows !== null };
  (rows || []).forEach(function (r) {
    // Interns get their own bucket, not "small n" — both are ungraded, but one
    // is a sample-size fact and the other is a policy. Pooling them would put a
    // policy decision behind a tooltip about statistics.
    if (r.overall === "learn") out.learn++;
    else if (r.overall === "na") {
      // A row is "small" for the summary when it HAS issues but none graded.
      out[r.n > 0 ? "small" : "na"]++;
    } else out[r.overall]++;
  });
  return out;
}

/** Does this field gate a PUBLISHED metric for this row's type? A Story's due
    date does not, under dictionary scope — grading it red would send someone to
    fix records that move no number. */
function typeFieldLive_(f, row) {
  if (!f.needs) return true;
  return row[f.needs] === true;
}

/**
 * Is this column IDENTICAL across every type? Then it carries no per-type
 * information — which is the only thing this table exists to show.
 *
 * Region and Team read uniformly low (they were blank org-wide before the
 * v3.7.0 exporter fix), so grading them paints two red cells on every single
 * row and the genuine per-type findings drown in them.
 * A uniform column is one org-wide gap with one owner, and it is rendered as
 * one: muted, with the real percentage still on screen and the severity carried
 * by the footnote instead of by colour.
 *
 * Computed from the DATA, not hardcoded, so the day PR-01 lands and Region
 * starts varying by type, this column starts grading itself again with no code
 * change — and if it varies from the first row, it was never muted at all.
 */
// ── RETIRING A SOLVED FIELD (user decision 2026-08-06) ───────────────────────
// "we do not need 'assignee resolves to a roster person' as metric, we have
// solved all discrepancies so always 100%."
//
// A column reading 100% on every row teaches nothing. It costs width on three
// surfaces and trains the reader to skim past the columns that DO vary, which
// is the same failure the uniform-column muting above exists to prevent.
//
// So the field retires — but, exactly like typeColUniform_, the rule is
// COMPUTED FROM THE DATA rather than deleted from the code, and for a sharper
// reason here. The roster join is this dashboard's historically dominant data
// loss: it was silently dropping 173 of 351 records (49%) as recently as the
// 2026-08-04 profile. Deleting the only instrument that can see it, on the
// strength of it being fixed today, is precisely how it comes back unnoticed —
// and it would come back as four wrong cards, not as a missing column.
//
// Hidden while it is clean, back on screen the moment one record fails. Neither
// direction needs a deploy, and the measurement never stops running: Code.js
// still counts `attr` / `resAttr` on every pass.
//
// To delete it outright instead, drop `retireWhenFull` and the field entry —
// but then nothing is watching.
function typeFieldRetired_(f, rows) {
  if (!f.retireWhenFull || !rows.length) return false;
  return rows.every(function (r) {
    var n = typeFieldN_(f, r);
    return n === 0 || (r[f.k] || 0) >= n;
  });
}

/** The columns actually rendered for this population. Aggregation and the
    impact sort still walk the FULL list — a retired field contributes 0 misses
    by definition, so nothing downstream needs to know it is off screen. */
function typeFieldsShown_(rows) {
  return TYPE_FIELDS_.filter(function (f) { return !typeFieldRetired_(f, rows); });
}

function typeColUniform_(f, rows) {
  if (!f.pr01 || rows.length < 2) return false;
  var first = null;
  return rows.every(function (r) {
    var pct = r.n > 0 ? Math.round((r[f.k] || 0) / r.n * 100) : null;
    if (first === null) { first = pct; return true; }
    return pct === first;
  });
}

/** Rows for the active population, summed over the window (resolved) or taken
    whole (open — a backlog has no history to walk). */
function typeHygRows_(isos) {
  var th = MODEL.typeHygiene || { resolved: [], open: [] };
  if (STATE.typePop === "resolved") {
    var by = {};
    (th.resolved || []).forEach(function (r) {
      if (isos.indexOf(r.iso) === -1) return;
      var t = by[r.type];
      if (!t) {
        t = by[r.type] = { type: r.type, isEpic: r.isEpic, gatesOnTime: r.gatesOnTime,
                           gatesForecast: r.gatesForecast, n: 0,
                           keys: {}, keysCapped: {} };
        TYPE_FIELDS_.forEach(function (f) {
          t[f.k] = 0;
          // A per-field denominator has to be summed across the window like the
          // numerator it divides, or a multi-week selection grades one week's
          // hits against another week's population.
          if (f.denom) t[f.denom] = 0;
        });
      }
      t.n += r.n;
      TYPE_FIELDS_.forEach(function (f) {
        t[f.k] += r[f.k] || 0;
        // undefined on a pre-v24 cached row — fall back to that row's n so the
        // rollup stays the honest old denominator instead of collapsing to 0.
        if (f.denom) t[f.denom] += (r[f.denom] === undefined ? r.n : r[f.denom]) || 0;
        var ks = (r.keys || {})[f.k];
        if (ks && ks.length) t.keys[f.k] = (t.keys[f.k] || []).concat(ks);
        if ((r.keysCapped || {})[f.k]) t.keysCapped[f.k] = true;
      });
    });
    return Object.keys(by).map(function (k) { return by[k]; });
  }
  return (th.open || []).slice();
}

/**
 * Recoverable impact: records missing the field, counted ONLY where that field
 * gates a published metric for that type.
 *
 * This is the sort key, and it is the whole reason the table is useful. Sorting
 * by worst percentage puts a 21%-filled Sub-task column on top, where fixing all
 * of it moves nothing; sorting alphabetically buries the four Go-live epics whose
 * missing due dates are the entire On-Time gap.
 *
 * Region and Team (pr01) are excluded even now that Region VARIES by type
 * (v3.7.0 exporter fix, 2026-08-04). Tried counting them here and reverted:
 * they gate no PUBLISHED metric — they are rollup dimensions — so 300 sub-tasks
 * missing a region would outrank the 12 Go-live epics whose missing due dates
 * are the entire On-Time gap, which is the precise failure this sort exists to
 * prevent. Their per-type gaps are not hidden: the columns un-mute and show
 * graded fill % plus miss counts as soon as they stop being uniform.
 */
function typeImpact_(row) {
  return TYPE_FIELDS_.reduce(function (t, f) {
    if (f.pr01 || !typeFieldLive_(f, row)) return t;
    // Per-field denominator, so "fixable" counts only records the field is
    // actually expected on. Counting unstarted tickets here would sort the
    // matrix by backlog size rather than by recoverable gaps.
    return t + Math.max(0, typeFieldN_(f, row) - (row[f.k] || 0));
  }, 0);
}

// One toggle drives two surfaces (spec §5.4, Task 5): the 🧬 matrix's own
// Open/Resolved chips stay INSIDE typeMatrixHtml_ (its PNG capture deliberately
// includes them — comment above), but the 👥 roster reads the same STATE.typePop,
// so flipping the chip has to re-render both rather than leaving the roster
// showing the population the header no longer names.
function setTypePop_(v) { STATE.typePop = v; renderHygPanel_(); renderRoster_(); }

/** The rows this field is measured over. `denom` names a per-field denominator
    (time → timeN) for a field that is not expected on every record in the row;
    everything else divides by n. Falls back to n on a pre-v24 payload so an old
    cached model reads as it always did rather than as a division by zero. */
function typeFieldN_(f, row) {
  if (!f.denom) return row.n;
  return row[f.denom] === undefined ? row.n : row[f.denom];
}

/** One cell: fill %, grade against the field's own gate, and the miss count. */
function typeCellHtml_(f, row, uniform) {
  var n = typeFieldN_(f, row);
  var have = row[f.k] || 0, miss = Math.max(0, n - have);
  var pct = n > 0 ? Math.round(have / n * 100) : null;
  var live = typeFieldLive_(f, row) && !uniform;
  var gate = typeFieldGate_(f);
  var rag, mark;
  if (!live || pct === null || gate === null) {
    // Informational, not a gap. "—" is doing real work here: it separates
    // "this is fine" from "this does not apply to this type".
    rag = "n"; mark = "—";
  } else {
    var g = Math.round(gate * 100);
    rag = pct >= g ? "g" : (pct >= g - 10 ? "a" : "r");
    mark = { g: "✔", a: "▲", r: "✖" }[rag];
  }
  var why = (f.note ? " " + f.note : "") + (live
    // n === 0 on a scoped field means nothing in this row is even in the
    // question (a type with no started work). Saying "gates no metric" there
    // would be a different, wrong answer.
    ? (n === 0 ? ". Nothing in this row is in scope for this field yet."
               : ". This gates " + f.feeds + " — fixing these moves the number.")
    : (uniform
        // Two different reasons a cell isn't graded, and conflating them would
        // send the reader to the wrong fix: one is "not your problem", the
        // other is "everyone's problem, and not a per-type one".
        ? ". Identical across every issue type, so this is one org-wide field " +
          "gap (PR-01), not something to fix type by type."
        : ". Gates no published metric for this type today."));
  var missHtml = miss > 0
    ? ' <span class="tmiss"' + (live ? "" : ' style="opacity:.55"') +
      ' title="' + esc_(miss + " " + row.type + (miss === 1 ? " record is" : " records are") +
        " missing " + f.label.toLowerCase() + why) + '">' + miss + "</span>"
    : "";
  // A fill bar under every cell. Nine columns of bare percentages force the
  // reader to compare numbers digit by digit; the bars make a row's shape
  // readable at a glance, and this view's established idiom is labelled bars
  // (the funnels and the gaps table) rather than bare figures.
  var bar = pct === null ? "" :
    '<div class="tbar"><i class="' + rag + '" style="width:' + Math.max(0, Math.min(100, pct)) +
    '%"></i></div>';
  return '<td class="tnum tcell ' + rag + '">' +
    '<div class="tval">' + mark + " " + (pct === null ? "—" : pct + "%") + missHtml + "</div>" +
    bar + "</td>";
}

function typeMatrixHtml_(isos, winLabel) {
  var th = MODEL.typeHygiene;
  if (!th) {
    // Pre-v17 cached payload. Say so — an empty matrix reads as "no gaps",
    // which is the exact opposite of what an absent payload means.
    return '<div class="profPanel"><h4>🧬 Field fill by issue type</h4>' +
      '<div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the ' +
      "current schema.</div></div>";
  }
  var open = STATE.typePop !== "resolved";
  var rows = typeHygRows_(isos);
  rows.sort(function (a, b) { return typeImpact_(b) - typeImpact_(a) || b.n - a.n; });
  var total = rows.reduce(function (t, r) { return t + r.n; }, 0);

  var chips =
    '<span class="chip' + (open ? " on" : "") + '" onclick="setTypePop_(\'open\')"' +
      ' title="Unresolved work, as at the last export. THIS is the actionable half — a due date ' +
      'added here moves next period\'s number.">Open backlog</span>' +
    '<span class="chip' + (open ? "" : " on") + '" onclick="setTypePop_(\'resolved\')"' +
      ' title="Work resolved in the selected window. Explains the numbers on the cards today; ' +
      'fixing these records changes history, not the next report.">Resolved · ' + esc_(winLabel) + "</span>";

  var lead = open
    ? "Snapshot at the last export — <b>" + total + "</b> open issue" + (total === 1 ? "" : "s") +
      ". Fix these and the next period's numbers move. " +
      '<span title="A backlog has no history to walk: an open issue has no date that would make ' +
      'a time series honest, so this half ignores the period picker by design.">Not affected by ' +
      "the period picker ⓘ</span>"
    : "Resolved in <b>" + esc_(winLabel) + "</b> — <b>" + total + "</b> issue" +
      (total === 1 ? "" : "s") + ". This is where the cards' numbers come from.";

  if (!rows.length) {
    return '<div class="profPanel" id="typeMatrix"><h4>🧬 Field fill by issue type</h4>' +
      '<div class="chips seg" style="margin-bottom:8px">' + chips + "</div>" +
      '<div class="emptyState">' + (open ? "No open work in the feed."
        : "No work resolved in " + esc_(winLabel) + ".") + "</div></div>";
  }

  // Computed once over the whole table, not per row — "is this column constant?"
  // is a question about the column.
  var uniform = {};
  TYPE_FIELDS_.forEach(function (f) { uniform[f.k] = typeColUniform_(f, rows); });
  var anyUniform = TYPE_FIELDS_.some(function (f) { return uniform[f.k]; });
  // Fields at 100% across the whole population retire from the table entirely
  // (typeFieldRetired_). Distinct from muting: a uniform column still carries a
  // real gap everyone owns, a retired one has nothing left to show.
  var shown = typeFieldsShown_(rows);
  var retired = TYPE_FIELDS_.filter(function (f) { return shown.indexOf(f) === -1; });

  // Every column right of the type name is numeric, so its HEADER is
  // right-aligned to sit over its own values. Left-aligned headers over
  // right-aligned numbers is what made the first cut unreadable: each label
  // pointed at the gap between two columns rather than at its data.
  var head = '<tr><th class="tname">Issue type</th><th class="tnum">n</th>' +
    shown.map(function (f) {
      return '<th class="tnum" title="' + esc_(f.label + " — feeds " + f.feeds +
        (f.note ? ". " + f.note : "") +
        (uniform[f.k] ? ". Identical for every issue type here, so it is shown ungraded: " +
          "one org-wide field gap (PR-01), not a per-type one."
          : f.pr01 ? ". Region and Team come from Jira custom fields — tagging is owned " +
            "upstream, but the gaps ARE counted per type here."
          : "")) + '">' +
        esc_(f.label) + (uniform[f.k] ? " *" : "") + "</th>";
    }).join("") + "</tr>";

  var body = rows.map(function (r) {
    var impact = typeImpact_(r);
    return "<tr>" +
      '<td class="tname"><b>' + esc_(r.type) + "</b>" +
      (r.isEpic ? ' <span class="tepic" title="Counted as an epic by the export\'s substring ' +
        'rule, so this type is already inside the On-Time dictionary scope and the Forecast ' +
        'denominator — pooled with every other epic type.">epic</span>' : "") +
      // Shortened from a full sentence per row: repeated six times it was noise,
      // and the explanation belongs in one tooltip rather than in every row.
      (impact > 0 ? '<div class="cellSub" title="Records missing a field that gates a published ' +
        'metric for this issue type. Fixing these moves a number; the other gaps on this row do ' +
        'not.">' + impact + " fixable</div>" : "") + "</td>" +
      '<td class="tnum tn">' + r.n + "</td>" +
      shown.map(function (f) { return typeCellHtml_(f, r, uniform[f.k]); }).join("") +
      "</tr>";
  }).join("");

  return '<div class="profPanel" id="typeMatrix">' +
    // Title row carries the PNG button, so a screenshot of this table lands in a
    // deck at full width instead of being cropped out of a whole-page capture.
    // The population chips ride inside the shot — a matrix with no population
    // label is unreadable out of context, since Open and Resolved look alike.
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<h4 style="flex:1;margin:0">🧬 Field fill by issue type</h4>' +
      '<button class="iconbtn" onclick="savePng_(\'typeMatrix\',\'field-fill-by-type\')"' +
        ' title="Save this table as a PNG image">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
      '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      "PNG</button></div>" +
    '<div class="chips seg" style="margin:8px 0">' + chips + "</div>" +
    '<p class="cellSub">' + lead + "</p>" +
    '<div class="cellSub" style="margin:8px 0 4px">Each cell is graded against ' +
      "<b>that field's own gate</b>: " +
      keySwatch_("var(--pos)", "✔ at or above") + " · " +
      keySwatch_("var(--amber)", "▲ under 10 pts below") + " · " +
      keySwatch_("var(--warn)", "✖ 10+ pts below") + " · " +
      '<b>—</b> = gates no published metric for this type today ' +
      '<span title="Under the current On-Time scope only epic-grain work carries a due-date ' +
      'obligation, and estimates only matter at epic grain. Grading a Sub-task red for a missing ' +
      'due date would send someone to fix records that move no number.">ⓘ</span>. ' +
      "The small number after each percentage is the record count missing that field.</div>" +
    '<div class="gwrap"><table class="hyg tmx">' + head + body + "</table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      (anyUniform ? "* This column reads the same for every issue type, so it is shown " +
        "ungraded — it is <b>one org-wide field gap</b> tracked under PR-01, not something " +
        "to chase type by type. It starts grading itself again the moment it varies. " : "") +
      // Named, not silently dropped. A column that vanishes with no explanation
      // is indistinguishable from one that was never built, and the reader needs
      // to know the check is still running before they stop looking for it.
      (retired.length ? "<b>" + retired.map(function (f) { return esc_(f.label); }).join(", ") +
        "</b> " + (retired.length === 1 ? "is" : "are") + " at <b>100%</b> across this " +
        "population and " + (retired.length === 1 ? "has" : "have") + " been retired from the " +
        'table <span title="Still measured on every rebuild — the column returns on its own, ' +
        'with no deploy, the moment a single record fails. Nothing here is switched off.">ⓘ</span>. ' : "") +
      "Rows are ordered by fixable gaps on metric-gating fields, not by worst percentage: " +
      "four missing due dates on epics outrank four hundred on sub-tasks." +
      '</div>' +
    "</div>";
}

/** Legacy entry point — the suppressed KPI cards link to the hygiene queue by
    name, so it stays as a thin alias over the router rather than a second path. */

/** Access Control is a role-gated VIEW; switchView_ enforces the gate, so this
    is only the pane's renderer. */
function renderAccess_() {
  var panel = document.getElementById("viewAccess");
  panel.innerHTML = "Loading access settings…";
  google.script.run.withSuccessHandler(function (s) {
    panel.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
      "<h3 style=\"flex:1\">🔒 Access Control</h3></div>" +
      '<p class="cellSub">Bootstrap admin: ' + esc_(s.bootstrapAdmin) + " (not removable)</p>" +
      '<div class="blbl">ADMINS (comma-separated)</div>' +
      '<input id="accAdmins" style="width:100%" value="' + esc_(s.admins.join(", ")) + '">' +
      '<div class="blbl">VIEWERS (directs and above — comma-separated)</div>' +
      '<input id="accViewers" style="width:100%" value="' + esc_(s.viewers.join(", ")) + '">' +
      '<label style="display:block;margin:10px 0"><input type="checkbox" id="accOpen"' +
        (s.openAccess ? " checked" : "") + "> Open access (demo only)</label>" +
      '<button class="btn" onclick="saveAccess_()">Save</button> <span id="accMsg"></span>';
  }).withFailureHandler(function (e) { panel.innerHTML = "⚠️ " + esc_(e.message); })
    .getDeliveryAccessSettings();
}

function saveAccess_() {
  var msg = document.getElementById("accMsg");
  msg.textContent = "Saving…";
  google.script.run.withSuccessHandler(function () { msg.textContent = "✅ Saved"; })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveDeliveryAccessSettings({
      admins: document.getElementById("accAdmins").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      viewers: document.getElementById("accViewers").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      openAccess: document.getElementById("accOpen").checked,
    });
}

/** One CSV field, quoted only when it needs to be (comma, quote or newline).
    Extracted from the old saveCsv_ body so every CSV export shares one
    quoting rule instead of re-deriving it. */
function csvCell_(v) {
  v = String(v == null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/** Pure builder for the signals-roster CSV: one row per person, signal
    values + offending counts + the hours split (spec §5). Extracted from
    saveCsv_ (review finding, 2026-08-05) so the row grammar — small-n rows
    keep their REAL percentages (small-n suppresses grading, not
    measurement), a zero-issue person's percentages are blank, and an
    ineligible (ramping/on-leave) row blanks Idle and carries the Note
    instead — is testable without a DOM/Blob download round-trip.
    @returns {?Array<string>} CSV lines (header first), or null on a
    pre-v22 payload (no personHygiene to grade). */
function rosterCsvLines_() {
  var head = analysisHead_().head;
  var rows = personSignalRows_(head.isos);
  if (rows === null) return null;
  // The export follows the signal chip, like every other CSV here follows the
  // filters on screen: someone who narrowed to "need action" wants to send THAT
  // list, and a download that quietly contained the whole org would be worse
  // than useless — it would be wrong in a way nobody checks before forwarding.
  rows = rows.filter(sigFilterMatch_);
  // "Non-billable work h" and "Time off h" split what used to be one
  // "Non-billable h" column — a spreadsheet reader summing the old column was
  // adding holidays to unbilled project work. The two still sum to the payload's
  // nonBillable, so a saved workbook can be reconciled against it.
  // Signal columns are GENERATED from SIGNAL_FIELDS_ rather than typed out, so a
  // field added to the roster reaches the export automatically. The hand-listed
  // form would have silently shipped a CSV missing the three commercial-readiness
  // columns while the screen showed them — the worst kind of drift, because the
  // spreadsheet is what gets mailed to the person being asked to fix the gap.
  var sigHead = SIGNAL_FIELDS_.map(function (f) {
    return csvCell_(f.label + " %") + "," + csvCell_(f.label + " missing");
  }).join(",");
  // Planned h / Capacity h ship ALWAYS, not only while the Plan column is on
  // screen: a fixed header is what makes two exports comparable, and a
  // spreadsheet whose columns move with a dropdown cannot be appended to.
  // "n" became "Issues (all incl. epics)" and grew its three parts (2026-08-10).
  // The spreadsheet is what gets mailed to the person being asked to fix a gap,
  // and a bare "n" there was the same unexplained number as on screen — with no
  // tooltip to rescue it and no drill-down to expand.
  var lines = ["Person,Job title,Region,Issues (all incl. epics)," +
               "Listed,Ignored (unstarted no due date),Epics," + sigHead +
               ",Overall,Est h,Logged h,Progress %,In progress," +
               "Billable h,Non-billable work h,Time off h,Idle h,Planned h,Capacity h,State"];
  rows.forEach(function (r) {
    var w = aggWeeks_(r.p, head.isos) || { billable: 0, nonBillable: 0, trackedOff: 0, tracked: 0, avail: 0 };
    var inel = r.p.newHire === true || r.p.onLeave === true || r.p.isIntern === true;
    var off = Math.min(Math.max(0, w.trackedOff || 0), w.nonBillable);
    function pc(g) { return g.pct === null ? "" : Math.round(g.pct * 100); }
    var t = r.t || {};
    var pl = planFor1_(r.p, head.isos);
    var estH = (Number(t.estSec) || 0) / 3600, spentH = (Number(t.spentSec) || 0) / 3600;
    // The three parts of the count, blank rather than 0 on a payload that predates
    // them — a fabricated 0 in a saved workbook outlives every caveat on screen.
    var bl = r.p.backlog || {};
    var blank_ = function (v) { return v === undefined || v === null ? "" : v; };
    lines.push([csvCell_(r.p.name), csvCell_(r.p.jobTitle), csvCell_(r.p.region), r.n,
                blank_(bl.listed), blank_(bl.ignoredN), blank_(bl.epicsN)]
      .concat(SIGNAL_FIELDS_.map(function (f) { return pc(r.sig[f.k]) + "," + r.sig[f.k].miss; }))
      .concat([r.overall,
        r1_(estH), r1_(spentH),
        // BLANK, never 0, with no estimate to divide by. A fabricated 0% in a
        // saved workbook outlives every caveat on the screen it came from.
        estH > 0 ? Math.round(spentH / estH * 100) : "",
        Number(t.wip) || 0,
        r1_(w.billable), r1_(w.nonBillable - off), r1_(off),
        inel ? "" : r1_(Math.max(0, w.avail - w.tracked)),
        r1_(pl.planned), r1_(pl.cap),
        r.p.onLeave ? "on leave" : r.p.isIntern ? "intern (in training, ungraded)"
                    : r.p.newHire === true ? "ramping new hire" : ""]).join(","));
  });
  return lines;
}

/** CSV = the signals roster (spec §5). Replaces the Task-3 interim, which
    exported the opportunity table instead. */
function saveCsv_() {
  var lines = rosterCsvLines_();
  if (lines === null) return;
  // CRLF line endings + .csv extension are this function's job — downloadCsv_
  // does neither, it writes the filename and content verbatim.
  downloadCsv_(lines.join("\r\n"), "delivery-people-signals.csv");
}

/** A CSV string → a downloaded file. Shared by every CSV export. */
function downloadCsv_(csv, filename) {
  var a = document.createElement("a");
  a.download = filename;
  // Blob URLs are the right default (no size ceiling — a full roster × 6 periods
  // export runs past what a data: URI reliably carries), but some managed
  // browsers block blob: in a sandboxed iframe, which is exactly what an
  // HtmlService web app is. Fall back to a data: URI rather than failing silently.
  try {
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/csv;charset=utf-8,%EF%BB%BF" + encodeURIComponent(csv);
  }
  a.click();
  if (a.href.indexOf("blob:") === 0) {
    // Release the object URL once the download has been handed off — the blob
    // otherwise pins the whole CSV in memory until the tab closes.
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }
}

var H2C_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
/** The headline period, filename-safe — "Jul 2026" → "Jul-2026", "FY27 Q1" →
    "FY27-Q1". Falls back to the model's ISO week if no period resolves. */
function pngPeriodStamp_() {
  var done = allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
  var lbl = done.length ? done[done.length - 1].label : (MODEL.meta.headlineIso || "");
  return String(lbl).replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "export";
}

function savePng_(elId, name) {
  function shoot() {
    var el = document.getElementById(elId);
    // Uncap the grid's internal scroller for the shot — otherwise the PNG
    // captures only the visible viewport of rows, not the whole roster.
    el.classList.add("shooting");
    html2canvas(el, { backgroundColor: getComputedStyle(document.body).backgroundColor })
      .then(function (canvas) {
        var a = document.createElement("a");
        // Stamp the filename with the period the shot actually SHOWS, not the
        // model's ISO week. A board-pack PNG of July 2026 saved as
        // "…-2026.W31.png" is a figure filed under the wrong period, and nobody
        // opens the file again to check.
        a.download = "delivery-health-" + name + "-" + pngPeriodStamp_() + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      })
      .finally(function () { el.classList.remove("shooting"); });
  }
  if (window.html2canvas) return shoot();
  var s = document.createElement("script");
  s.src = H2C_URL;
  s.onload = shoot;
  s.onerror = function () { alert("PNG export unavailable (script blocked)"); };
  document.head.appendChild(s);
}

loadData(false);
</script>
