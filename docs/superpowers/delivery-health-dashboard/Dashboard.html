function toggleDetail_(el) {
  var key = decodeURIComponent(el.getAttribute("data-p")) + "" + el.getAttribute("data-w");
  STATE.openDetail[key] = !STATE.openDetail[key];
  renderGrid_();
}

function pctStr_(num, den) {
  return den > 0 ? Math.round(num / den * 100) + "%" : "—";
}

/**
 * Compact per-week detail card, sized to sit in the cell DIRECTLY BELOW its
 * week column (user feedback 2026-07-31: details deploy under the week they
 * belong to, not as a full-width blob). Bars use % widths (cell-fluid).
 */
function detailCellHtml_(w, status, frac) {
  if (!w) return '<span class="cellSub">no data</span>';
  var isFuture = status === "plan";
  // Pro-rate the current period: mid-week always looks bad against a full-week
  // denominator (director feedback — same fairness rule as PTO-adjusted pacing).
  var f = (status === "now" && frac !== undefined) ? Math.max(frac, 0) : 1;
  var proAvail = w.avail * f;
  // Billable util has its own denominator — the availability of NS-classified
  // weeks only. In a single week it equals proAvail when covered and 0 when not.
  var proAvailCov = (w.availCov || 0) * f;
  var oooH = w.pto + w.hol;
  // Effective planned = min(planned, AVAILABLE): Tempo repeats the weekly plan
  // per project assignment, and PTO/holidays kill capacity — planning pairs
  // with the actual net capacity, never the gross schedule.
  var effPlanned = w.effPlanned !== undefined ? w.effPlanned
    : (w.cap > 0 ? Math.min(w.planned, w.avail) : w.planned);
  var planCapped = w.planned > effPlanned;
  function pw(h) { return w.cap > 0 ? Math.min(100, h / w.cap * 100) : 0; }
  // ONE headline number + a compact context line (director feedback: seven
  // numbers per cell is a lot); the bars underneath carry the shape.
  var headVal, headLbl;
  if (isFuture) { headVal = r1_(effPlanned) + "h"; headLbl = "planned"; }
  else if (nsLive_() && proAvailCov > 0) {
    headVal = pctStr_(w.billable, proAvailCov); headLbl = "billable util";
  } else if (nsLive_()) {
    // Classified nothing here — fall back to tracked rather than printing a 0%
    // billable rate that is really an absent classification.
    headVal = pctStr_(w.tracked, proAvail); headLbl = "tracked/capacity · unclassified";
  } else { headVal = pctStr_(w.tracked, proAvail); headLbl = "tracked/capacity"; }
  return '' +
    '<div class="mstat"><b>' + headVal + '</b> <span class="cellSub">' + headLbl + '</span></div>' +
    (isFuture ? "" :
      '<div class="cellSub">tracked ' + r1_(w.tracked) + "h (" + pctStr_(w.tracked, proAvail) +
        " of avail · " + pctStr_(w.tracked, effPlanned * f) + " of plan) · OOO " + r1_(oooH) +
        "h (PTO " + r1_(w.pto) + " / Hol " + r1_(w.hol) + ")</div>") +
    (f < 1 ? '<div class="cellSub">⏳ pro-rated — ' + Math.round(f * 100) + "% of period elapsed</div>" : "") +
    (w.capEst ? '<div class="cellSub">⚠ capacity estimated</div>' : "") +
    (planCapped ? '<div class="cellSub" title="Tempo repeats plans per project assignment, and PTO/holidays reduce capacity — ratios use the plan capped at ACTUAL availability">ⓘ plan ' +
      r1_(w.planned) + "h → capped " + r1_(effPlanned) + "h (net capacity)</div>" : "") +
    // Feed reconciliation (audit 2026-08-03). NetSuite and Tempo are independent,
    // so their totals disagree. Tempo decides HOW MANY hours; NS only decides the
    // billable/non-billable MIX. That means the NS mix is extrapolated across the
    // whole tracked total, which is the intended model but IS an assumption — so
    // whenever the two totals differ materially the drill-down says so out loud
    // instead of letting the split look directly measured.
    (!isFuture && nsRawTot_(w) > 0 && Math.abs(nsRawTot_(w) - w.tracked) > 0.5
      ? '<div class="cellSub" title="NetSuite classifies the billable/non-billable MIX; Tempo is the source of truth for how many hours were worked. The mix is applied to the tracked total, so these hours are classified by proportion, not measured one-for-one. A large difference between the two totals means the extrapolation is carrying more weight — worth a look at the NetSuite export for this person-week.">ⓘ NS totals ' +
        r1_(nsRawTot_(w)) + "h vs tracked " + r1_(w.tracked) + "h — mix (" +
        Math.round(nsShare_(w) * 100) + "% billable) applied by proportion</div>"
      : "") +
    (!isFuture && unclassifiedH_(w) > 0.5
      ? '<div class="cellSub" title="These tracked hours fall in weeks with no NetSuite billable/non-billable signal at all, so they are counted in neither bucket and are excluded from the billable-utilization denominator rather than reported as 0% billable.">ⓘ ' +
        r1_(unclassifiedH_(w)) + "h tracked unclassified (no NS signal)</div>"
      : "") +
    '<div class="blbl">CAP ' + r1_(w.cap) + "h − OOO = " + r1_(w.avail) + "h avail</div>" +
    '<div class="btrack" style="max-width:none"><div class="ooo" style="width:' + pw(oooH) + '%"></div></div>' +
    '<div class="blbl">PLANNED ' + r1_(effPlanned) + "h</div>" +
    '<div class="bplanned" style="max-width:none;width:' + pw(effPlanned) + '%"></div>' +
    (isFuture ? "" :
      // b + nb + unclassified === tracked by construction, so this line now
      // actually adds up (it previously printed NS absolutes under a Tempo total).
      '<div class="blbl">TRACKED ' + r1_(w.tracked) + "h — b " + r1_(w.billable) +
        " / nb " + r1_(w.nonBillable) +
        (unclassifiedH_(w) > 0.05 ? " / unclassified " + r1_(unclassifiedH_(w)) : "") + "</div>" +
      '<div class="bline" style="max-width:none;width:' + pw(w.tracked) + '%">' +
        '<div class="b" style="width:' + (w.tracked > 0 ? Math.min(100, w.billable / w.tracked * 100) : 0) + '%"></div>' +
        '<div class="u" style="width:' + (w.tracked > 0 ? Math.min(100, unclassifiedH_(w) / w.tracked * 100) : 0) + '%"></div>' +
        '<div class="n" style="flex:1"></div></div>');
}

/**
 * The detail rows for one person: a single tr whose cells align 1:1 under the
 * week columns (open weeks get a card, closed weeks stay empty), plus one
 * full-width backlog row. Opening every week (name click) = the person's
 * whole story in one shot.
 */
function personDetailRows_(p, periods) {
  var key = p.name + "";
  var anyOpen = periods.some(function (pr) { return STATE.openDetail[key + pr.key]; });
  if (!anyOpen) return "";
  var html = '<tr class="detail"><td class="dctx"><b>' + esc_(p.name) + '</b>' +
    (p.isManager ? " 👔" : "") + "<br>" +
    '<span class="cellSub">' +
    (p.jobTitle ? esc_(p.jobTitle) + "<br>" : "") +
    esc_(p.region) + (p.regionSource === "roster" ? " (roster)" : "") +
    " · " + esc_(famName_(p)) +
    (p.teams.length ? "<br>" + esc_(p.teams.join(", ")) : "") +
    (p.newHire ? "<br>🌱 new hire — joined " + esc_(p.hired || "recently") : "") +
    (p.onLeave ? "<br>🏖 " + esc_(p.leaveStatus || "on leave") + " — hours hidden, excluded from utilization" : "") +
    "</span></td>";
  periods.forEach(function (pr) {
    if (STATE.openDetail[key + pr.key]) {
      var agg = aggWeeks_(p, pr.isos);
      // Long leave: the expandable stays (context + why), but every hour
      // metric is blanked — leave is an absence, not a set of numbers.
      var card = !agg && p.hired ? preHireMark_(p)
        : p.onLeave
          ? absenceMark_(p, agg || { pto: 0, hol: 0 })
          : fullyOoo_(agg)
            ? absenceMark_(p, agg || { pto: 0, hol: 0 }) +
              (agg ? detailCellHtml_(agg, pr.status, pr._frac) : "")
            : detailCellHtml_(agg, pr.status, pr._frac);
      html += '<td class="dcell">' + card + "</td>";
    } else {
      html += '<td class="dcell"></td>';
    }
  });
  html += "</tr>";
  // Records stay blank while on leave too — no hour stats, no backlog table;
  // the open row carries only who they are and the leave note.
  var backlog = p.onLeave ? "" : backlogHtml_(p);
  if (backlog) {
    html += '<tr class="detail"><td colspan="' + (periods.length + 1) + '" class="dback">' + backlog + "</td></tr>";
  }
  return html;
}

/** Name click: open (or close) every period's detail for one person — the
    full-window story in a single shot. */
function togglePersonStory_(el) {
  var name = decodeURIComponent(el.getAttribute("data-p"));
  var key = name + "";
  var periods = activePeriods_();
  var allOpen = periods.every(function (pr) { return STATE.openDetail[key + pr.key]; });
  periods.forEach(function (pr) { STATE.openDetail[key + pr.key] = !allOpen; });
  renderGrid_();
}

/** Open-Jira-backlog block for the drill-down: per-assignee issue table
    (count + estimate remaining; the swarm/headroom verdict was removed
    2026-07-31 per user feedback). */
function backlogHtml_(p) {
  if (!MODEL.meta.jiraAvailable) return "";
  var b = p.backlog;
  if (!b || !b.count) {
    return '<div class="blbl" style="margin-top:12px">OPEN JIRA BACKLOG</div>' +
      '<div class="cellSub">No open issues assigned</div>';
  }
  var rows = b.items.map(function (it) {
    return "<tr><td>" + esc_(it.key) + "</td><td>" + esc_(it.summary) + "</td><td>" +
      esc_(it.status) + "</td><td>" + esc_(it.priority || "—") + "</td><td>" +
      esc_(it.due || "—") + "</td><td style=\"text-align:right\">" +
      (it.remHrs > 0 ? r1_(it.remHrs) + "h" : "—") + "</td></tr>";
  }).join("");
  var more = b.count > b.items.length
    ? '<div class="cellSub">… and ' + (b.count - b.items.length) + " more (totals include them)</div>" : "";
  return '<div class="blbl" style="margin-top:12px">OPEN JIRA BACKLOG — ' + b.count +
    " issue" + (b.count === 1 ? "" : "s") + ' · <span title="Est. remaining = Jira Original Estimate − Jira Time Spent, both read from Jira Raw. Tempo is the authoritative time source, so an issue whose hours were logged in Tempo but never mirrored into Jira reads as more remaining work than there is. Treat this as a planning signal, not a committed number.">~' +
    r1_(b.remHrs) + "h est. remaining ⓘ</span></div>" +
    '<div class="gwrap"><table class="bklog"><tr><th>Key</th><th>Summary</th><th>Status</th>' +
    "<th>Priority</th><th>Due</th><th>Est. left</th></tr>" + rows + "</table></div>" + more;
}

function r1_(v) { return Math.round((Number(v) || 0) * 10) / 10; }

// ══════════════════════════════════════════════════════════════════════════
// TRENDS VIEW — the history, and the people inside it
//
// Two halves, in the order the questions get asked:
//   1. Is this metric moving, and how does the latest period compare with the
//      rate we actually run at? (chart + operating band + values table)
//   2. Where is the headroom? (one row per person, ranked by the hours that
//      separate them from that operating rate)
//
// The second half is the part a manager can act on, so it is a table of named
// people — but the chart's verdict above it stays counts-only, because a
// judgement rendered inside a chart is read as a verdict on the individual
// rather than a starting point for a conversation.
// ══════════════════════════════════════════════════════════════════════════

function setMetric_(id) {
  STATE.metric = id;
  renderAll_();      // the comparison chart follows the same metric
}



// ── OPPORTUNITY TABLE ────────────────────────────────────────
//
// "Areas of opportunity" made arithmetic. For each person, the gap between the
// rate they ran at last period and the rate the filtered cohort normally runs
// at, converted to HOURS — because a percentage point is not something anyone
// can reassign, and hours are.
//
//   opportunity = max(0, norm% × their available hours − their delivered hours)
//
// Only ever a positive number: someone above the norm has no "negative
// opportunity", they are carrying the norm. Excluded from the ranking, and from
// the headline total, are the cases where a gap is not an opportunity at all:
//   · people on long leave (no availability is expected)
//   · periods before someone's hire date (they did not exist yet)
//   · new hires inside the ramp window — flagged, and kept OUT of the total,
//     because "ramping" is the explanation and the total is a call to act
//   · anyone with no availability in the period (fully OOO)
// Whichever denominator the metric uses is the one used here, so the column can
// be reconciled against the KPI card rather than being a second opinion.

var OPP_COLS = {
  name:  { label: "Person",      sort: function (a, b) { return a.name.localeCompare(b.name); } },
  rate:  { label: "Their rate",  sort: function (a, b) { return (b.rate === null ? -1 : b.rate) - (a.rate === null ? -1 : a.rate); } },
  gap:   { label: "vs norm",     sort: function (a, b) { return (a.gap === null ? 1e9 : a.gap) - (b.gap === null ? 1e9 : b.gap); } },
  opp:   { label: "Opportunity", sort: function (a, b) { return b.opp - a.opp; } },
};

function setOppSort_(col) {
  if (STATE.oppSort === col) STATE.oppDesc = !STATE.oppDesc;
  else { STATE.oppSort = col; STATE.oppDesc = true; }
  renderOpportunity_();
}

/**
 * Per-person rate + headroom for the last complete period, plus their own
 * six-period sparkline. Utilization only: On-Time and Forecast are attributed
 * per issue, and an individual's on-time rate over three closed stories is not
 * a number anybody should act on.
 */
function oppRows_(head, trendPer, norm) {
  var live = nsLive_();
  return filteredPeople_().map(function (p) {
    if (p.onLeave) return null;
    var w = aggWeeks_(p, head.isos);
    if (!w) return null;                       // pre-hire: the period predates them
    var den = live ? (w.availCov || 0) : w.avail;
    if (den <= 0) return null;                 // fully OOO, or nothing NS classified
    var num = live ? w.billable : w.tracked;
    var rate = num / den * 100;
    var gap = norm === null ? null : rate - norm;
    // Hours, not points: the unit a manager can actually move.
    var opp = norm === null ? 0 : Math.max(0, den * (norm / 100) - num);
    var spark = trendPer.map(function (pr) {
      var aw = aggWeeks_(p, pr.isos);
      if (!aw) return null;
      var d = live ? (aw.availCov || 0) : aw.avail;
      return d > 0 ? (live ? aw.billable : aw.tracked) / d * 100 : null;
    });
    return { name: p.name, region: p.region, teams: p.teams, rate: rate, gap: gap,
             opp: opp, den: den, num: num, spark: spark, p: p,
             ramping: p.newHire === true, flags: exceptionsOf_(p) };
  }).filter(Boolean);
}

function renderOpportunity_() {
  var panel = document.getElementById("oppPanel");
  if (!panel) return;
  var done = donePeriods_();
  var head = done.length ? done[done.length - 1] : null;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var live = nsLive_();
  var m = METRICS_.util;
  if (!head) {
    panel.innerHTML = '<div class="emptyState">No complete ' + unit +
      " in the window yet — nothing to rank.</div>";
    return;
  }
  var ser = metricSeries_(m, done);
  // The reference is the COHORT's operating rate under the active filters: an
  // AMER consultant is compared with how AMER consultants normally run, not with
  // a company-wide figure that no one in the slice has ever hit.
  var norm = ser.std && ser.std.ok ? ser.std.baseline : null;
  var trendPer = done.slice(-6);
  var rows = oppRows_(head, trendPer, norm);

  if (!rows.length) {
    panel.innerHTML = '<div class="oppHead"><h3>Where the headroom is</h3></div>' +
      '<div class="emptyState">Nobody in this slice has measurable ' +
      (live ? "billable" : "tracked") + " availability in " + esc_(head.label) +
      ".</div>";
    return;
  }

  // Ramping new hires are shown but never counted: a total that a manager is
  // meant to act on must not be inflated by people who are ramping by design.
  var actionable = rows.filter(function (r) { return !r.ramping && r.opp > 0.5; });
  var totalOpp = actionable.reduce(function (s, r) { return s + r.opp; }, 0);
  var rampN = rows.filter(function (r) { return r.ramping && r.opp > 0.5; }).length;

  var col = OPP_COLS[STATE.oppSort] || OPP_COLS.opp;
  rows.sort(col.sort);
  if (!STATE.oppDesc) rows.reverse();
  var maxOpp = Math.max.apply(null, rows.map(function (r) { return r.opp; }).concat([1]));

  var headline = norm === null
    ? '<div class="norm">No operating rate yet (' + ser.points.filter(function (p) {
        return p.value !== null; }).length + " of " + STD_MIN_PERIODS +
      " complete " + unit + "s) — the table below ranks by rate only, with no headroom figure. " +
      "Ranking against a norm built on three points would invent the very benchmark it claims to measure.</div>"
    : '<div class="oppHead"><span class="big">' + Math.round(totalOpp) + "h</span>" +
      '<span class="sub">recoverable in ' + esc_(head.label) + " across <b>" +
      actionable.length + "</b> of " + rows.length + " people, measured against the " +
      Math.round(norm) + "% operating rate" +
      (rampN ? " · " + rampN + " ramping new hire" + (rampN === 1 ? "" : "s") +
        " excluded from the total" : "") + "</span></div>" +
      '<div class="norm">Opportunity = ' + Math.round(norm) + "% × their available hours − their " +
      (live ? "billable" : "tracked") + " hours, floored at zero. It is the hours that would " +
      "close the gap to how this cohort normally runs — not a target, and not a performance " +
      "rating. Change any filter and the norm re-bases on that cohort.</div>";

  function th(key, title) {
    return '<th class="' + (STATE.oppSort === key ? "sorted" : "") +
      '" onclick="setOppSort_(\'' + key + '\')" title="' + esc_(title) +
      ' — click to sort">' + OPP_COLS[key].label + (STATE.oppSort === key ? (STATE.oppDesc ? " ▾" : " ▴") : "") + "</th>";
  }

  var body = rows.map(function (r) {
    var rag = r.gap === null ? "" : (r.gap >= 0 ? "g" : (r.gap > -10 ? "a" : "r"));
    var flagIcons = r.flags.map(function (x) {
      return ' <span class="exBadge" title="' + esc_(x.label + " — " + x.why) + '">' + x.icon + "</span>";
    }).join("");
    return "<tr><td class=\"who\">" + esc_(r.name) +
      (r.ramping ? ' <span title="new hire, ramping — shown for context but excluded from the recoverable total">🌱</span>' : "") +
      (r.p.isManager ? ' <span title="Manager — plans without tracking much is normal here; use the Role lens">👔</span>' : "") +
      flagIcons + "</td>" +
      '<td class="where">' + esc_(r.region) +
        (r.teams && r.teams.length ? " · " + esc_(trunc_(r.teams.join(", "), 26)) : "") + "</td>" +
      "<td>" + Math.round(r.rate) + '%<span class="cellSub"> of ' + r1_(r.den) + "h</span></td>" +
      '<td class="gap ' + rag + '">' + (r.gap === null ? "—" :
        (r.gap >= 0 ? "+" : "−") + Math.abs(Math.round(r.gap))) + "</td>" +
      "<td>" + (r.opp > 0.5
        ? '<span class="oppbar" style="width:' + Math.max(2, Math.round(r.opp / maxOpp * 54)) +
          'px"></span>' + Math.round(r.opp) + "h"
        : '<span class="cellSub">—</span>') + "</td>" +
      '<td style="width:170px">' +
        sparkHtml_(r.spark, { labels: trendPer.map(function (p) { return p.label; }), bare: true }) +
        "</td></tr>";
  }).join("");

  panel.innerHTML =
    '<div class="chartHead"><h3>Where the headroom is</h3>' +
      '<span class="sub">' + esc_(m.label()) + " · " + esc_(head.label) +
      " · one row per person</span><span style=\"flex:1\"></span>" +
      // The metric chips used to live on the history chart. With that gone they
      // move here, or this tab would be stuck on whatever metric was last picked
      // on the Executive tab with no way to change it.
      '<span class="chips seg">' + metricChips_() + "</span>" +
      '<button class="iconbtn" onclick="saveOppCsv_()" title="Download this table as CSV">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>' +
      "</div>" +
    headline +
    '<div class="gwrap"><table class="opp"><tr>' +
      th("name", "Name. Ramping new hires are marked and excluded from the total") +
      "<th>Where</th>" +
      th("rate", (live ? "Billable" : "Tracked") + " hours ÷ their available hours in " + head.label) +
      th("gap", "Percentage points between their rate and the " +
         (norm === null ? "cohort norm (not established yet)" : Math.round(norm) + "% cohort operating rate")) +
      th("opp", "Hours that would close their gap to the cohort operating rate") +
      // The header carries the span for every row, because the in-cell chart is
      // too small to label its own axis legibly.
      '<th style="text-align:left" title="Their own rate over the last ' + trendPer.length +
        " complete " + unit + "s — hover any point for its period and value\">" +
        (trendPer.length
          ? esc_(trendPer[0].label) + " → " + esc_(trendPer[trendPer.length - 1].label)
          : "Trend") + "</th></tr>" +
      body + "</table></div>" +
    '<div class="cellSub" style="margin-top:8px">People on long leave, periods before ' +
      "someone's hire date, and anyone fully out on PTO are absent from this table by " +
      "construction — an absence is not headroom. Open the 👥 People tab for the full " +
      "roster with per-period drill-downs.</div>";
}

/** CSV of the opportunity table as it stands, sort and filters included. */
function saveOppCsv_() {
  var done = donePeriods_();
  var head = done.length ? done[done.length - 1] : null;
  if (!head) return;
  var live = nsLive_();
  var ser = metricSeries_(METRICS_.util, done);
  var norm = ser.std && ser.std.ok ? ser.std.baseline : null;
  var rows = oppRows_(head, done.slice(-6), norm);
  var col = OPP_COLS[STATE.oppSort] || OPP_COLS.opp;
  rows.sort(col.sort);
  if (!STATE.oppDesc) rows.reverse();
  var out = [["Person", "Region", "Teams", "Ramping", "Period",
              (live ? "Billable" : "Tracked") + " h", "Available h", "Their rate %",
              "Cohort operating rate %", "Gap pts", "Opportunity h", "Flags"]];
  rows.forEach(function (r) {
    out.push([r.name, r.region, (r.teams || []).join(" | "), r.ramping ? "yes" : "",
      head.label, r1_(r.num), r1_(r.den), Math.round(r.rate),
      norm === null ? "" : Math.round(norm),
      r.gap === null ? "" : Math.round(r.gap), r1_(r.opp),
      r.flags.map(function (x) { return x.label; }).join(" | ")]);
  });
  downloadCsv_(out, "delivery-health-opportunity-" + pngPeriodStamp_() + ".csv");
}

// ── DATA HYGIENE VIEW (FR-2.3/FR-2.4) ────────────────────────────────────────
//
// The raw attribution counts used to sit on the KPI cards in small grey type —
// "404 of 615 resolved had a due date" — which framed an organisational work
// queue as a caveat on a number. They live here instead, each with an owner, a
// prerequisite ID and a committed week, because closing these gaps is an
// instruction to the delivery org, not a technical chore for analytics.
//
// Deliberately UNFILTERED: hygiene is a whole-population question. A region
// slice that looks well-tagged doesn't make the feed publishable.

/** Sums the server's per-week attribution counts over a set of ISO weeks. */
function hygieneFor_(isos) {
  var s = { res: 0, resDue: 0, resAttr: 0, resRegion: 0, resTeam: 0, resReady: 0,
            resFull: 0, epics: 0, epicsEst: 0, epicsTime: 0 };
  (MODEL.hygieneBuckets || []).forEach(function (h) {
    if (isos.indexOf(h.iso) === -1) return;
    Object.keys(s).forEach(function (k) { s[k] += (h[k] || 0); });
  });
  return s;
}

/** Person-week counts the Jira feed can't see: NS classification + capacity. */
function hygienePeopleFor_(isos) {
  var s = { tracked: 0, trackedCov: 0, weeks: 0, capEst: 0 };
  MODEL.people.forEach(function (p) {
    isos.forEach(function (iso) {
      var w = p.weeks[iso];
      if (!w) return;
      s.weeks++;
      s.tracked += w.tracked || 0;
      s.trackedCov += w.trackedCov || 0;
      if (w.capEst) s.capEst++;
    });
  });
  return s;
}

/** One gap row: coloured against its gate, never against 100% — a 90% gate met
    at 91% is green, and pretending otherwise trains people to ignore the view.

    No Owner column (user decision 2026-08-03). The prerequisite ID still points
    at who owns each gap in the requirements doc, where the accountability is
    tracked and reviewed; a standing table of names against failures in a
    widely-read view reads as a blame board rather than a work queue, which is
    not what gets tagging fixed. */
function hygieneRow_(g) {
  var pct = g.value === null ? null : Math.round(g.value * 100);
  var gate = Math.round(g.gate * 100);
  var rag = pct === null ? "r" : (pct >= gate ? "g" : (pct >= gate - 10 ? "a" : "r"));
  var mark = { g: "✔", a: "▲", r: "✖" }[rag];  // FR-4.4: readable without colour
  return "<tr><td>" + esc_(g.name) +
    (g.note ? '<div class="cellSub">' + esc_(g.note) + "</div>" : "") + "</td>" +
    '<td class="hnum ' + rag + '">' + mark + " " + (pct === null ? "not connected" : pct + "%") +
      '<div class="hbar"><i class="' + rag + '" style="width:' + (pct === null ? 0 : pct) + '%"></i></div>' +
      (g.detail ? '<div class="cellSub">' + esc_(g.detail) + "</div>" : "") + "</td>" +
    "<td>" + gate + "%</td>" +
    "<td>" + esc_(g.prereq || "—") + "</td>" +
    "<td>" + esc_(g.week || "—") + "</td>" +
    "<td>" + esc_(g.blocks) + "</td></tr>";
}

/** Complete periods of the ACTIVE period type, oldest first. */
function hygPeriods_() {
  return allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
}

/** Step the hygiene view through history. `v` is an index, or "all" for the
    whole export window, or null for the most recent complete period. */
function setHygIdx_(v) {
  var per = hygPeriods_();
  if (v !== "all" && v !== null) v = Math.max(0, Math.min(per.length - 1, v));
  STATE.hygIdx = v;
  renderHygiene_();
}

/**
 * Admin-only coverage-gate editor (user request 2026-08-03).
 *
 * "How much coverage is enough" is a judgement the Services Director owns and
 * revisits at period close. Keeping it in code meant it could only change in a
 * deploy window rather than in the review where the decision is actually made.
 *
 * Three things keep this from becoming a way to make problems disappear:
 * the agreed registry default is always shown next to the current value, an
 * override records who set it and when, and Restore puts the agreed number back
 * exactly. Moving a gate is a visible decision, not a quiet one.
 */
function gateEditorHtml_() {
  if (MODEL.viewerRole !== "admin") return "";
  var reg = MODEL.meta.registry || {};
  var ms = reg.metrics || {};
  var rows = ["onTime", "forecast", "util", "quality"].filter(function (id) { return ms[id]; })
    .map(function (id) {
      var m = ms[id];
      var cur = Math.round((m.coverageGate || 0) * 100);
      var def = m.gateDefault === undefined ? cur : Math.round(m.gateDefault * 100);
      var ov = m.gateOverride;
      return "<tr><td>" + esc_(m.name) +
        '<div class="cellSub">' + esc_(m.coverageOf || "") + "</div></td>" +
        '<td><input type="number" min="0" max="100" step="1" id="gate_' + id +
          '" value="' + cur + '" style="width:70px"> %</td>' +
        "<td>" + def + "%" + (ov
          ? '<div class="cellSub" title="' + esc_("Overridden by " + (ov.by || "an admin") +
              " on " + (ov.at || "an earlier date") + ". Restore returns the agreed value.") +
            '">✎ changed ' + esc_(ov.at || "") + "</div>"
          : "") + "</td>" +
        '<td><button class="btn" onclick="restoreGate_(\'' + id + '\')"' +
          (ov ? "" : " disabled") + ' title="put the agreed registry value back">Restore</button></td></tr>';
    }).join("");

  return '<details class="gedit"><summary>⚙ Coverage gates (admin)</summary>' +
    '<p class="cellSub">The attribution a metric needs before it is treated as reliable. ' +
    "Raising a gate makes the dashboard stricter; lowering one makes a weak number look " +
    "settled — the agreed value stays on screen so the difference is never invisible. " +
    "Saving rebuilds the model for everyone.</p>" +
    '<div class="gwrap"><table class="hyg"><tr><th>Metric</th><th>Gate</th>' +
    "<th>Agreed default</th><th></th></tr>" + rows + "</table></div>" +
    '<div style="margin-top:8px"><button class="btn" onclick="saveGates_()">Save gates</button> ' +
    '<span id="gateMsg" class="cellSub"></span></div></details>';
}

/** Resets one input to its registry default, then saves. */
function restoreGate_(id) {
  var el = document.getElementById("gate_" + id);
  if (el) el.value = "";           // empty = clear the override server-side
  saveGates_();
}

function saveGates_() {
  var msg = document.getElementById("gateMsg");
  var ms = (MODEL.meta.registry || {}).metrics || {};
  var payload = {};
  var bad = null;
  Object.keys(ms).forEach(function (id) {
    var el = document.getElementById("gate_" + id);
    if (!el) return;
    var v = String(el.value).trim();
    if (v === "") { payload[id] = null; return; }   // clear → registry default
    var n = Number(v);
    if (!(n >= 0 && n <= 100)) bad = ms[id].name;
    payload[id] = n;
  });
  if (bad) { msg.textContent = "⚠️ " + bad + ": gate must be between 0 and 100."; return; }
  msg.textContent = "Saving…";
  google.script.run
    .withSuccessHandler(function () {
      // The gates decide what every tile publishes, so nothing on screen is
      // trustworthy until the model is rebuilt against the new numbers.
      msg.textContent = "✅ Saved — reloading with the new gates…";
      loadData(true);
    })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveGateOverrides(payload);
}

    '<p class="cellSub">Every figure above covers <b>' + esc_(winLabel) + "</b>" +
      (isAll ? "" : " — use ◀ ▶ to walk the history, or Σ for the whole export window") + ". " +
      "Gates come from the metric registry (v" +
      esc_((MODEL.meta.registry || {}).version || "—") + "). " +
      (MODEL.meta.suppressBelowGate === true
        ? "A metric more than 10 points below its gate is suppressed rather than published (FR-2.2). "
        : "A metric below its gate is published with a low-confidence chip rather than suppressed. ") +
      "Prerequisites not confirmed by their target week escalate to the Services Director in that week's steering review.</p>";
}

/** Legacy entry point — the suppressed KPI cards link to the hygiene queue by
    name, so it stays as a thin alias over the router rather than a second path. */
function showHygiene_() { switchView_("hygiene"); }

/** Access Control is a role-gated VIEW; switchView_ enforces the gate, so this
    is only the pane's renderer. */
function renderAccess_() {
  var panel = document.getElementById("viewAccess");
  panel.innerHTML = "Loading access settings…";
  google.script.run.withSuccessHandler(function (s) {
    panel.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
      "<h3 style=\"flex:1\">🔒 Access Control</h3></div>" +
      '<p class="cellSub">Bootstrap admin: ' + esc_(s.bootstrapAdmin) + " (not removable)</p>" +
      '<div class="blbl">ADMINS (comma-separated)</div>' +
      '<input id="accAdmins" style="width:100%" value="' + esc_(s.admins.join(", ")) + '">' +
      '<div class="blbl">VIEWERS (directs and above — comma-separated)</div>' +
      '<input id="accViewers" style="width:100%" value="' + esc_(s.viewers.join(", ")) + '">' +
      '<label style="display:block;margin:10px 0"><input type="checkbox" id="accOpen"' +
        (s.openAccess ? " checked" : "") + "> Open access (demo only)</label>" +
      '<button class="btn" onclick="saveAccess_()">Save</button> <span id="accMsg"></span>';
  }).withFailureHandler(function (e) { panel.innerHTML = "⚠️ " + esc_(e.message); })
    .getDeliveryAccessSettings();
}

function saveAccess_() {
  var msg = document.getElementById("accMsg");
  msg.textContent = "Saving…";
  google.script.run.withSuccessHandler(function () { msg.textContent = "✅ Saved"; })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveDeliveryAccessSettings({
      admins: document.getElementById("accAdmins").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      viewers: document.getElementById("accViewers").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      openAccess: document.getElementById("accOpen").checked,
    });
}

/** CSV export of the current filtered view — one row per person per visible
    period, tidy-format (director feedback: PNG-only export). */
function saveCsv_() {
  var periods = activePeriods_();
  // Billable/Non-billable h are the NS mix applied to Tracked h (they sum to
  // Tracked, minus Unclassified). The NS raw columns are what NetSuite exported —
  // kept so finance can reconcile the two feeds from the same file.
  var rows = [["Person", "Region", "Job family", "Teams", "New hire", "On leave", "Period", "Status",
               "Capacity h", "PTO h", "Holiday h", "Available h", "Planned h (raw)",
               "Planned h (capped)", "Tracked h", "Billable h", "Non-billable h",
               "Unclassified h", "Available h (NS-classified)", "NS billable h (raw)",
               "NS non-billable h (raw)", "NS billable share %", "Weeks NS-classified"]];
  filteredPeople_().forEach(function (p) {
    periods.forEach(function (pr) {
      var w = aggWeeks_(p, pr.isos);
      // On-leave rows keep the person but blank every hour column — same rule
      // as the grid: hours are hidden and excluded while on leave.
      rows.push([p.name, p.region, famName_(p), p.teams.join(" | "), p.newHire ? "yes" : "",
        p.onLeave ? (p.leaveStatus || "yes") : "",
        pr.label, pr.status].concat(w && !p.onLeave
          ? [r1_(w.cap), r1_(w.pto), r1_(w.hol), r1_(w.avail), r1_(w.planned),
             r1_(w.effPlanned), r1_(w.tracked), r1_(w.billable), r1_(w.nonBillable),
             r1_(unclassifiedH_(w)), r1_(w.availCov || 0), r1_(w.nsBillRaw || 0),
             r1_(w.nsNonBillRaw || 0),
             nsRawTot_(w) > 0 ? Math.round(nsShare_(w) * 1000) / 10 : "",
             (w.covWeeks || 0) + " of " + (w.nWeeks || 0)]
          : ["", "", "", "", "", "", "", "", "", "", "", "", "", "", ""]));
    });
  });
  downloadCsv_(rows, "delivery-health-" + MODEL.meta.headlineIso + ".csv");
}

/** Rows → a downloaded CSV file. Shared by the grid and opportunity exports. */
function downloadCsv_(rows, filename) {
  var csv = rows.map(function (r) {
    return r.map(function (c) {
      c = String(c == null ? "" : c);
      return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
    }).join(",");
  }).join("\r\n");
  var a = document.createElement("a");
  a.download = filename;
  // Blob URLs are the right default (no size ceiling — a full roster × 6 periods
  // export runs past what a data: URI reliably carries), but some managed
  // browsers block blob: in a sandboxed iframe, which is exactly what an
  // HtmlService web app is. Fall back to a data: URI rather than failing silently.
  try {
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/csv;charset=utf-8,%EF%BB%BF" + encodeURIComponent(csv);
  }
  a.click();
  if (a.href.indexOf("blob:") === 0) {
    // Release the object URL once the download has been handed off — the blob
    // otherwise pins the whole CSV in memory until the tab closes.
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }
}

var H2C_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
/** The headline period, filename-safe — "Jul 2026" → "Jul-2026", "FY27 Q1" →
    "FY27-Q1". Falls back to the model's ISO week if no period resolves. */
function pngPeriodStamp_() {
  var done = allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
  var lbl = done.length ? done[done.length - 1].label : (MODEL.meta.headlineIso || "");
  return String(lbl).replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "export";
}

function savePng_(elId, name) {
  function shoot() {
    var el = document.getElementById(elId);
    // Uncap the grid's internal scroller for the shot — otherwise the PNG
    // captures only the visible viewport of rows, not the whole roster.
    el.classList.add("shooting");
    html2canvas(el, { backgroundColor: getComputedStyle(document.body).backgroundColor })
      .then(function (canvas) {
        var a = document.createElement("a");
        // Stamp the filename with the period the shot actually SHOWS, not the
        // model's ISO week. A board-pack PNG of July 2026 saved as
        // "…-2026.W31.png" is a figure filed under the wrong period, and nobody
        // opens the file again to check.
        a.download = "delivery-health-" + name + "-" + pngPeriodStamp_() + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      })
      .finally(function () { el.classList.remove("shooting"); });
  }
  if (window.html2canvas) return shoot();
  var s = document.createElement("script");
  s.src = H2C_URL;
  s.onload = shoot;
  s.onerror = function () { alert("PNG export unavailable (script blocked)"); };
  document.head.appendChild(s);
}

loadData(false);
</script>
