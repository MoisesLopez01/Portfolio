        Math.round(PLAN_CLIFF_ * 100) + '% of it.">● all ' + pl.people + " covered</span>"
      : '<span class="dDown" title="Under ' + Math.round(PLAN_CLIFF_ * 100) +
        "% of their scheduled capacity planned — the coverage cliff the roster flags " +
        'per person. Open 🎯 Actions to see who.">▽ ' + unplanned + " of " + pl.people +
        " under " + Math.round(PLAN_CLIFF_ * 100) + "% planned</span>" +
        (pl.none ? ' · <span class="dDown" title="No planned hours at all in this window.">' +
          pl.none + " with no plan</span>" : ""));
  return tileHtml_("Planned Coverage", pl.pct,
    r1_(pl.planned) + "h planned of " + r1_(pl.cap) + "h scheduled capacity",
    [], {
      headlineLabel: headlineLabel, target: null, phase: phase, note: note,
      phaseWhy: "Planned hours against scheduled capacity for a window that has not " +
        "started. It is a plan, not a result — and it carries no RAG colour because no " +
        "planned-coverage target has been agreed.",
      detail: ["Planned hours are capped at capacity per week before summing: Tempo " +
        "records a weekly plan PER project assignment, so someone on two projects " +
        "reads as twice their week. Long leave and interns are excluded — the same " +
        "population as the utilization rate.",
        "Under-planned is under " + Math.round(PLAN_CLIFF_ * 100) + "% of scheduled " +
        "capacity, the same coverage-cliff line the signals roster flags per person."] });
}

// ══════════════════════════════════════════════════════════════════════════
// §1 THE MASTHEAD — the lede (spec 2026-08-06)
// ══════════════════════════════════════════════════════════════════════════

/** Thousands-grouped integer — "3,279", never a bare run of digits a reader
    has to count by eye. Scoped to the masthead/verdict on purpose: every
    other tile already has its own display convention (r1_ for hours, a bare
    number for small counts) and nothing here forces a second one on them. */
function nfDh_(v) {
  var n = Math.round(Number(v) || 0);
  var s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (n < 0 ? "-" : "") + s;
}

/** One-decimal string — "11.0", not the bare float r1_ rounds to. Guards NaN
    the same way r1_ guards it; toFixed alone on a non-number prints "NaN". */
function n1Dh_(v) {
  var n = Number(v);
  return isNaN(n) ? "0.0" : n.toFixed(1);
}

/**
 * MODEL.inventoryHistory (queue size per week, oldest first) ÷ TODAY's clear
 * rate → a weeks-to-clear series stdFor_ can judge the CURRENT cover
 * against. One rate applied to every point, deliberately: the question this
 * answers is "how unusual is carrying today's queue at the rate we clear
 * today", the same question stdFor_ answers for every other metric on the
 * page — a rate that varied per historical week would be a different
 * question with a different answer.
 */
function coverSeries_() {
  var rate = MODEL.meta.clearRateMedian;
  if (!rate) return [];
  return (MODEL.inventoryHistory || []).map(function (h) {
    return (h && typeof h.items === "number") ? h.items / rate : null;
  });
}

/**
 * Average (created − resolved) per week over the TRAILING meta.clearRateWeeks
 * of MODEL.arrivalWeeks (oldest first) — the same window clearRateMedian_
 * uses server-side (spec D3/D4), so the verdict and the rate it is judged
 * against can never describe different spans of history. A week the arrivals
 * tab could not parse is skipped, never treated as zero flow.
 */
function netFlowPerWeek_() {
  var weeks = MODEL.arrivalWeeks || [];
  var win = MODEL.meta.clearRateWeeks || 8;
  var trailing = weeks.slice(Math.max(0, weeks.length - win));
  var sum = 0, cnt = 0;
  trailing.forEach(function (w) {
    if (w && typeof w.created === "number" && typeof w.resolved === "number") {
      sum += w.created - w.resolved;
      cnt++;
    }
  });
  return cnt > 0 ? sum / cnt : null;
}

// ══════════════════════════════════════════════════════════════════════════
// §2 BACKLOG BAND — the page's hero (spec 2026-08-06 §2)
//
// The dashboard could only ever see ASSIGNED open work. Measured live
// 2026-08-06: 1,440 assigned vs 1,839 unassigned — 56% of the queue invisible.
// Assigned-only, weeks-to-clear reads 4.9w (at target); the true queue reads
// 11.0w, 2.75x over. So this band ships two tiers on purpose:
//   · a hero triplet, ORG-tagged, that ignores every filter — the true state,
//     seen first;
//   · a filterable assigned sub-row, SNAP-tagged, labelled "the work that has
//     an owner" — for the reader who wants to slice by Region/Team/PM/Family.
// NO TARGET RULE ANYWhERE IN THIS BAND (D11): queueCover and netFlow ship
// target: null deliberately. Nobody owns a <=4w or <=0 bar, and an unratified
// target on a C-suite headline reads as agreed the moment it appears. The
// operating band (stdFor_) is shaded instead; when the norm is unpublishable,
// no reference mark is drawn at all.
// ══════════════════════════════════════════════════════════════════════════

/** Minimum trailing weeks the ASSIGNED clear rate needs before it publishes —
    the same bar clearRateMedian_ (Code.js) applies to the ORG rate, so the two
    denominators the backlog band divides by are equally conservative. */
var CLEAR_RATE_MIN_N_ = 5;

/**
 * Every ISO week the payload knows about, restricted to COMPLETE ("done")
 * weeks, oldest first — period-picker-independent (spec D3: the queue/flow
 * band is fixed to a trailing-weeks basis, the same way netFlowPerWeek_ and
 * the masthead already are; a Month/Quarter picker selection must not change
 * what "the last 8 weeks" means here). Mirrors allPeriods_'s own
 * gridWeeks-status lookup rather than depending on donePeriods_(), which is
 * shaped by STATE.period.
 */
function trailingCompleteWeeks_(n) {
  var st = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) { if (wk && wk.iso) st[wk.iso] = wk.status; });
  var isos = allIsoWeeks_().filter(function (iso) { return (st[iso] || "done") === "done"; });
  return isos.slice(Math.max(0, isos.length - n));
}

/**
 * How far the ORG clear rate is from publishing, mirrored client-side from
 * MODEL.arrivalWeeks — the same trailing window and the same "a null week is
 * a gap, a zero week is data" rule clearRateMedian_ (Code.js) applies, so the
 * client can state "needs N more weeks" without duplicating the rate itself.
 * @returns {{n:number, minN:number, need:number}}
 */
function orgClearRateGap_() {
  var weeks = MODEL.arrivalWeeks || [];
  var win = MODEL.meta.clearRateWeeks || 8;
  var trailing = weeks.slice(Math.max(0, weeks.length - win));
  var n = trailing.filter(function (w) { return w && typeof w.resolved === "number"; }).length;
  return { n: n, minN: CLEAR_RATE_MIN_N_, need: Math.max(0, CLEAR_RATE_MIN_N_ - n) };
}

/**
 * The ASSIGNED clear rate — median of the last CLEAR_RATE_WEEKS complete
 * weeks of throughputBuckets_ CLEARED COUNTS (nAll, not estHrs), under the
 * ACTIVE FILTERS. This is the second of the band's two denominators (D-two-
 * denominators): the sub-row divides its filtered numerator by this, never by
 * the ORG rate — a filtered numerator over an org-wide denominator would
 * belong to neither population.
 * @returns {number|null} null under CLEAR_RATE_MIN_N_ usable weeks
 */
function assignedClearRate_() {
  var win = MODEL.meta.clearRateWeeks || 8;
  var isos = trailingCompleteWeeks_(win);
  if (isos.length < CLEAR_RATE_MIN_N_) return null;
  var vals = isos.map(function (iso) {
    return bucketsFor_(MODEL.throughputBuckets || [], [iso]).nAll;
  });
  return medianOf_(vals);
}

/**
 * Three-segment queue ruler, hand-rolled SVG (no CDN, no library — a blocked
 * external request inside the HtmlService iframe means an empty chart, the
 * same reason every chart in the CHART KIT above is a string of inline SVG
 * rather than a call into a library). Scaled in WEEKS at the ORG clear rate,
 * because the ruler's total — assigned + unowned — IS the ORG total, the same
 * population the hero triplet describes.
 *
 * NO target line (D11) — the operating band (o.std, from stdFor_(coverSeries_(),
 * …), the SAME series the masthead's depth finding judges) shades instead, and
 * is omitted outright while the norm is unpublishable.
 *
 * @param {{wipN:number, todoN:number, unItems:?number, rate:?number,
 *           std:?Object, onDrill:?string}} o
 */
function queueRulerSvg_(o) {
  var rate = o.rate;
  // rate === null → genuinely unmeasured (not enough clearing history) — the
  // ruler can't be scaled in weeks at all. rate === 0 is a DIFFERENT, REAL
  // state (an all-zero clearing week is a measured zero, per
  // clearRateMedian_'s contract) — dividing by it here would produce Infinity
  // rather than the "needs N more weeks" message a falsy check used to give
  // it, so it gets its own honest message instead of either (Task 16B review
  // finding: rate === 0 was being collapsed into rate === null).
  if (rate === null || rate === undefined) {
    var gap = orgClearRateGap_();
    return '<div class="emptyState">Can\'t scale the ruler in weeks yet — needs ' + gap.need +
      ' more week' + (gap.need === 1 ? "" : "s") + ' of clearing history (' + gap.n + ' of ' +
      gap.minN + ' so far).</div>';
  }
  if (rate === 0) {
    return '<div class="emptyState">Clearing rate is 0/wk this window — the queue isn\'t draining ' +
      'at all, so it can\'t be scaled in weeks.</div>';
  }
  var hasUnowned = o.unItems !== null && o.unItems !== undefined;
  var wipW = o.wipN / rate, todoW = o.todoN / rate;
  var unW = hasUnowned ? o.unItems / rate : 0;
  var totalW = wipW + todoW + unW;
  var domainMax = Math.max(8, Math.ceil(totalW) + 1);
  // Geometry trimmed 2026-08-07 (92 → 68 tall, 34 → 24 bar): paired with the
  // .backlogRuler width cap in CSS, the ruler went from ~236px of Executive-tab
  // height to ~68px. The bar stays thick enough to carry its in-segment counts
  // and its click target (the unowned segment drills to Actions) — the fat came
  // from the empty margin above the bar, not from the bar.
  var W = 760, H = 68, L = 8, R = 8, barH = 24, barY = 16;
  var pw = W - L - R;
  function x(wk) { return L + Math.max(0, Math.min(domainMax, wk)) / domainMax * pw; }
  var s = '<svg class="chart backlogRuler" viewBox="0 0 ' + W + ' ' + H +
    '" role="img" aria-label="queue depth in weeks, three segments: in progress, queued, unowned">' +
    '<defs><pattern id="unownedHatch" width="6" height="6" patternTransform="rotate(45)" ' +
    'patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--ivory)"/>' +
    '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--c-bad)" stroke-width="2"/></pattern></defs>';
  for (var g = 0; g <= domainMax; g += 2) {
    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (barY - 6) + '" y2="' +
      (barY + barH + 6) + '"/><text class="axis" x="' + x(g) + '" y="' + (barY + barH + 20) +
      '" text-anchor="middle">' + g + 'w</text>';
  }
  // Operating band — no invented reference. Drawn ONLY when the norm publishes.
  if (o.std && o.std.ok) {
    s += '<rect x="' + x(o.std.lo) + '" y="' + (barY - 6) + '" width="' +
      Math.max(1, x(o.std.hi) - x(o.std.lo)) + '" height="' + (barH + 12) +
      '" fill="var(--c-ref)" opacity="0.16"><title>operating band ' + n1Dh_(o.std.lo) + "–" +
      n1Dh_(o.std.hi) + "w — where this queue normally sits</title></rect>";
  }
  var x0 = x(0), x1 = x(wipW), x2 = x(wipW + todoW), x3 = x(totalW);
  function segLabel(a, b, text) {
    return (b - a > 24)
      ? '<text class="val" x="' + ((a + b) / 2) + '" y="' + (barY + barH / 2 + 4) +
        '" text-anchor="middle">' + text + "</text>" : "";
  }
  s += '<rect x="' + x0 + '" y="' + barY + '" width="' + Math.max(0, x1 - x0) + '" height="' + barH +
    '" fill="var(--seg-bill)"><title>In progress (assigned WIP) — ' + nfDh_(o.wipN) + ' items, ' +
    n1Dh_(wipW) + 'w</title></rect>' + segLabel(x0, x1, nfDh_(o.wipN));
  s += '<rect x="' + x1 + '" y="' + barY + '" width="' + Math.max(0, x2 - x1) + '" height="' + barH +
    '" fill="var(--ivory)"><title>Queued (assigned To Do) — ' + nfDh_(o.todoN) + ' items, ' +
    n1Dh_(todoW) + 'w</title></rect>' + segLabel(x1, x2, nfDh_(o.todoN));
  if (hasUnowned && o.unItems > 0) {
    var drillable = !!o.onDrill;
    s += '<rect x="' + x2 + '" y="' + barY + '" width="' + Math.max(0, x3 - x2) + '" height="' + barH +
      '" fill="url(#unownedHatch)"' + (drillable ? ' style="cursor:pointer" onclick="' + o.onDrill + '"' : "") +
      '><title>Unowned — ' + nfDh_(o.unItems) + ' items nobody has picked up, ' + n1Dh_(unW) + "w" +
      (drillable ? " — click to open" : "") + '</title></rect>' + segLabel(x2, x3, nfDh_(o.unItems));
  }
  s += "</svg>";
  var caption = '<div class="cellSub" style="margin-top:2px">In progress ' + nfDh_(o.wipN) +
    " · Queued " + nfDh_(o.todoN) + " · Unowned " +
    (hasUnowned ? nfDh_(o.unItems) : "not measured this refresh") +
    " · scaled in weeks at " + nfDh_(Math.round(rate)) + "/wk.</div>";
  return s + caption;
}

/** One backlog-band tile: label + scope tag, a hero VALUE (already formatted —
    never a bare percentage, since inventory/net-flow/weeks-to-clear are not
    percentages), and one context line. Deliberately NOT tileHtml_: that
    grammar hardcodes `Math.round(headlinePct) + "%"` and a RAG verdict against
    a target, neither of which this band's numbers carry (D11 — no target rule
    anywhere in this band) — the same reason flowTileHtml_ was written apart
    from tileHtml_ for the other unit-bearing metrics. */
function backlogTileHtml_(label, big, context, scope, trendHtml) {
  // House "unavailable" convention (tileHtml_/flowTileHtml_ both apply it):
  // a "—" state gets the dashed placeholder shell, not a fully-formed tile —
  // otherwise a Net-flow or Weeks-to-clear tile with nothing to show looks
  // like a real measurement on a projector (Task 16B review finding).
  var ph = big === "—" ? " ph" : "";
  return '<div class="tile' + ph + '"><div class="lbl">' + esc_(label) + scopeTag_(scope) + '</div>' +
    '<div class="big">' + big + '</div>' +
    (context ? '<div class="cmp">' + context + '</div>' : "") +
    // `trendHtml` (Task 17): the Inventory tile's only caller, so a Net-flow
    // or Weeks-to-clear tile gets no extra slot — those two are already
    // derived FROM the same history, and a second trend line under each
    // would restate the first rather than add information.
    (trendHtml ? trendHtml : "") + '</div>';
}

/**
 * The hero's inventory-history sparkline (Task 17 — regression fix). Tasks
 * 5/7 built MODEL.inventoryHistory (a 26-week reconstructed walkback,
 * inventoryWalkback_ in Code.js) explicitly so the hero would ship WITH a
 * trend; Task 16B's retirement of the Backlog/WIP flow tiles removed the only
 * place a queue-depth history was ever drawn and nothing replaced it — a
 * headline with no context is a headline nobody can act on.
 *
 * Only the newest point in the walkback is a measured snapshot; every other
 * point is inferred backwards from the arrivals feed (created − resolved per
 * week). "An unlabelled change of basis in a chart is worse than no chart" —
 * the same rule the ✎ definition-changed marker applies to a formula change —
 * so sparkHtml_'s `flags` option draws the reconstructed run dashed/hollow and
 * the measured point solid, and every point's tooltip says which it is in
 * words, not just pixels.
 *
 * Draws NOTHING (with a stated reason) when the walkback is unanchorable —
 * inventoryWalkback_ returns [] with no measurable anchor or no arrivals
 * history at all (Code.js `_test_modelAssembly_`, part 3) — never a flat line
 * at zero, which would read as a measured, stable queue instead of an absent
 * one.
 * @returns {string} an empty string is never returned FOR NO REASON — the
 *   no-history branch always renders its own explanation instead.
 */
function inventoryHistoryTrendHtml_() {
  var hist = MODEL.inventoryHistory || [];
  if (!hist.length) {
    return '<div class="cmp" style="margin-top:2px">no history — ' +
      (MODEL.meta.arrivalsAvailable === false
        ? "the Jira Arrivals tab isn't in this export yet, so there is no created/resolved " +
          "series to walk the queue back from"
        : "not enough arrivals history to reconstruct a trend yet") + '</div>';
  }
  var vals = hist.map(function (h) { return (h && typeof h.items === "number") ? h.items : null; });
  var flags = hist.map(function (h) { return !!(h && h.measured); });
  var labels = hist.map(function (h) { return (h && h.iso) || ""; });
  // Shared with the flow tiles (numDomain_) — a queue depth and an arrival
  // count need the same frame-from-the-data treatment, and two hand-written
  // copies of it are two chances for one of them to go back to a percentage.
  var domain = numDomain_(vals);
  var nMeasured = flags.filter(function (f) { return f; }).length;
  var nRecon = hist.length - nMeasured;
  // .sparkWrap — the basis caption ("Nw reconstructed → N measured") is a
  // caption OF this chart, so the pair moves as one when the tile pins its
  // chart to the bottom edge.
  return '<div class="sparkWrap"><div class="cmp" style="margin-top:2px">' +
    nRecon + "w reconstructed (○, dashed) → " + nMeasured + " measured (●)</div>" +
    sparkHtml_(vals, { labels: labels, flags: flags, fmt: nfDh_, domain: domain }) + "</div>";
}

/**
 * "Weeks to clear" at a given clearing rate — shared by the hero and the
 * assigned sub-row so the null-vs-zero distinction is fixed in exactly one
 * place (Task 16B review finding).
 *
 * `rate === null` means "not enough clearing history yet" — genuinely
 * unmeasured, renders "—". `rate === 0` is a REAL measured rate:
 * clearRateMedian_'s contract (Code.js, unit-tested) is explicit that an
 * all-zero series is a measured zero, not missing history. Nothing clears at
 * a rate of zero, so the queue is UNBOUNDED, not unmeasured — collapsing the
 * two under a falsy check produced self-contradictory copy ("—" beside "needs
 * 0 more weeks"). Returns null (not "—") for the null-rate case so callers can
 * tell "no string" apart from "the string IS the em-dash" and write their own
 * reason alongside it.
 * @returns {?string} "∞w" / "0w" / "N.Nw", or null when rate itself is unmeasured
 */
function weeksToClearStr_(total, rate) {
  if (rate === null || rate === undefined) return null;
  if (rate === 0) return total > 0 ? "∞w" : "0w";
  return n1Dh_(total / rate) + "w";
}

/**
 * §2 BACKLOG BAND renderer — hero triplet (ORG), assigned sub-row (SNAP),
 * queue ruler. See the section banner above for the two-tier rationale.
 */
function renderBacklogBand_() {
  var el = document.getElementById("backlogBand");
  if (!el) return;
  var q = MODEL.queue || { assigned: {}, unassigned: {} };
  var asg = q.assigned || {};
  var unAsg = q.unassigned || {};
  var rate = MODEL.meta.clearRateMedian;
  var unItems = (unAsg.items === null || unAsg.items === undefined) ? null : unAsg.items;
  var asgItems = asg.items || 0;
  // Null unassigned must NEVER become 0 (D-null-guard): falling back to
  // assigned-only is a stated choice, not a silent coercion.
  var total = unItems === null ? null : asgItems + unItems;
  var heroTotal = total === null ? asgItems : total;
  var fallbackNote = unItems === null
    ? "assigned only — the unassigned count isn't available this refresh, so this is a floor, not the whole queue"
    : "";

  var netFlow = netFlowPerWeek_();
  var gap = orgClearRateGap_();

  var invCtx = total === null
    ? fallbackNote
    : nfDh_(asgItems) + " assigned + " + nfDh_(unItems) + " unowned";
  var heroHtml =
    backlogTileHtml_("Inventory", nfDh_(heroTotal) + " items", invCtx, "org",
      inventoryHistoryTrendHtml_()) +
    backlogTileHtml_("Net flow",
      netFlow === null ? "—" : (netFlow > 0 ? "+" : "") + nfDh_(Math.round(netFlow)) + "/wk",
      netFlow === null ? "needs an 8-week arrivals history"
        : (netFlow > 0.0001 ? "growing" : netFlow < -0.0001 ? "draining" : "flat") + " · 8-week basis",
      "org") +
    backlogTileHtml_("Weeks to clear",
      weeksToClearStr_(heroTotal, rate) || "—",
      (rate === null || rate === undefined)
        ? "needs " + gap.need + " more week" + (gap.need === 1 ? "" : "s") +
          " of clearing history (" + gap.n + " of " + gap.minN + " so far)"
        : rate === 0
        ? "clearing rate is 0/wk this window — the queue isn't draining, so this has no ceiling"
        : "at " + nfDh_(Math.round(rate)) + "/wk clearing rate — no target (D11), graded against the operating band only",
      "org");

  var open = flowOpenFor_();
  var asgInv = open.wipN + open.todoN;
  var asgRate = assignedClearRate_();
  var subHtml =
    backlogTileHtml_("Assigned inventory", nfDh_(asgInv) + " items",
      nfDh_(open.wipN) + " in progress · " + nfDh_(open.todoN) + " queued", "snap") +
    backlogTileHtml_("Assigned weeks to clear",
      weeksToClearStr_(asgInv, asgRate) || "—",
      (asgRate === null || asgRate === undefined)
        ? "needs a longer assigned clearing history under this filter"
        : asgRate === 0
        ? "assigned clearing rate is 0/wk this window — filtered, never the ORG rate"
        : "at " + nfDh_(Math.round(asgRate)) + "/wk assigned clearing rate — filtered, never the ORG rate",
      "snap");

  var std = stdFor_(coverSeries_(), { publish: true });
  var ruler = queueRulerSvg_({
    wipN: asg.wipN || 0, todoN: asg.todoN || 0, unItems: unItems, rate: rate, std: std,
    onDrill: (unItems !== null && unItems > 0) ? "switchView_('actions')" : null,
  });

  el.innerHTML =
    // Title, 2026-08-07. "the queue nobody has finished" imputed neglect to a
    // state the delivery process CREATES ON PURPOSE — unassigned work is the
    // designed output of generic allocation, not abandonment — and framed depth
    // as debt when it is cover: too LITTLE backlog is the failure mode that
    // starves the P&L. Naming it for what it is leaves both directions of the
    // read open. (Spec 2026-08-10-dh-backlog-truth-design.md §A2/D4; the
    // matching re-grade of dir:"down" and the ruler's own "nobody has picked
    // up" tooltip are W33 work and are NOT done here.)
    "<h3>📥 Backlog — the work we're holding, and how long it covers us</h3>" +
    // No literal figures here (Task 16B CRITICAL fix, review of Tasks 12–14):
    // this sentence used to quote "4.9w"/"11.0w" — illustrative numbers
    // copied from the spec, wired to nothing, sitting directly above the
    // tiles that compute those exact figures live. It states the SHAPE of
    // the band instead; the tiles beside it already carry the numbers, and
    // a smoke check (render-smoke.js) asserts no bare "N.Nw"/"Nw" literal
    // ever appears in this prose again.
    //
    // Two sentences of it, wrapped across the full page width, cost more
    // vertical space than the tiles they introduce. The full text is intact in
    // the tooltip (.why) — the visible line keeps the one distinction a reader
    // MUST have before comparing the two rows: they are different populations
    // on purpose.
    '<p class="cellSub"><span class="why" title="The hero below is the WHOLE queue, ' +
    "ignoring every filter; the sub-row beneath applies your active filters to the assigned-only " +
    "slice of that same queue — the two read different numbers on purpose. No target rule " +
    'anywhere in this band (D11) — both are graded against the operating band instead.">' +
    "Hero = the whole queue, unfiltered · sub-row = your filters on the assigned slice · " +
    "no targets here, only the operating band ⓘ</span></p>" +
    '<div class="tiles">' + heroHtml + '</div>' +
    // THE SUPPLY SIDE, directly under the queue it explains (2026-08-07). Every
    // other number on this page describes the people who are here now; a
    // departure removes someone from the population and takes their capacity out
    // of the denominators with them, so utilization holds steady while the team's
    // ability to deliver falls. Placed here, not in the Capacity band, because
    // "the queue is growing" and "the team got smaller" are one sentence — and
    // because the Capacity band is margin-gated while this was asked for as an
    // everyone card.
    '<p class="cellSub" style="margin-top:6px"><span class="why" title="Capacity that joined ' +
    "and left in this period. Counts and hours only; who moved is not published. Org-wide like " +
    "the two tiles above: a person who has left has no Region or Team row to filter on.\">" +
    "The team behind the queue — capacity that joined and left ⓘ</span></p>" +
    '<div class="tiles tilesCompact">' + workforceTileHtml_() + '</div>' +
    '<p class="cellSub" style="margin-top:6px"><span class="why" title="Assigned — the work ' +
    "that has an owner. Follows Region / Team / PM / Family like every other filterable " +
    'surface.">Assigned — the work that has an owner, and follows every filter ⓘ</span></p>' +
    '<div class="tiles tilesCompact">' + subHtml + '</div>' +
    '<div style="margin-top:6px">' + ruler + '</div>';
}

/**
 * Sums the server's per-week joiner/leaver rows over a set of ISO weeks.
 * @returns {?Object} null when the payload predates workforceWeeks (v28) —
 *   an UNKNOWN, which must not render as "nobody joined or left".
 */
function workforceFor_(isos) {
  var rows = MODEL.workforceWeeks;
  if (!rows) return null;
  var s = { joiners: 0, leavers: 0, hoursGained: 0, hoursLost: 0,
            joinersNoCap: 0, leaversNoCap: 0 };
  rows.forEach(function (r) {
    if (isos.indexOf(r.iso) === -1) return;
    Object.keys(s).forEach(function (k) { s[k] += (r[k] || 0); });
  });
  return s;
}

/**
 * WORKFORCE CHANGE card (user request 2026-08-07).
 *
 * Lives in the Backlog band rather than the Capacity band for two reasons: the
 * Capacity band is canSeeMargin_-gated and this was asked for as an
 * everyone card, and this number only means anything set against the queue
 * growth printed two tiles to its left. "The queue is growing 75 items a week"
 * and "the team lost 32 hours a week of capacity" are one sentence.
 *
 * ORG-scoped like Inventory and Net flow beside it: roster movements are not
 * filterable here (a leaver has no Region/Team/PM row left to filter on), and
 * a card that silently ignored the active filters without saying so would be
 * read as a filtered number. The scope tag says which it is.
 *
 * COUNTS AND HOURS ONLY — never who. See the registry deviation.
 */
function workforceTileHtml_() {
  var w = workforceFor_(analysisHead_().head.isos);
  if (!w) {
    return backlogTileHtml_("Workforce change", "—",
      "arrives after the next refresh — this payload predates the measure", "org");
  }
  var known = w.joiners + w.leavers;
  if (!known) {
    // A REAL zero: the roster was read and nobody moved. Distinct from the
    // null above, and it must not be dressed as a placeholder.
    return backlogTileHtml_("Workforce change", "0h/wk",
      "nobody joined or left this period", "org");
  }
  var net = w.hoursGained - w.hoursLost;
  var big = (net > 0 ? "+" : net < 0 ? "−" : "") + nfDh_(Math.round(Math.abs(net))) + "h/wk";
  var parts = [
    w.joiners + " joined" + (w.hoursGained ? " (+" + nfDh_(Math.round(w.hoursGained)) + "h)" : ""),
    w.leavers + " left" + (w.hoursLost ? " (−" + nfDh_(Math.round(w.hoursLost)) + "h)" : ""),
  ];
  // The unknown-capacity disclosure. Without it the hours read as the whole
  // story while a departure sits inside the count contributing nothing —
  // exactly the direction of error that flatters us.
  var noCap = w.joinersNoCap + w.leaversNoCap;
  if (noCap) {
    parts.push(noCap + " with no scheduled hours on record — counted as " +
      (noCap === 1 ? "a person" : "people") + ", not as hours");
  }
  // Set against the demand side, which is the only reason this card is here.
  var nf = netFlowPerWeek_();
  if (nf !== null && nf > 0.0001 && net < 0) {
    parts.push("queue growing " + nfDh_(Math.round(nf)) + "/wk while capacity fell");
  }
  // Ramp-up is a real qualifier on the gain and is NOT discounted from it —
  // any discount would be a guess. Stated, and left to the reader.
  var ramping = (MODEL.people || []).filter(function (p) { return p.newHire; }).length;
  if (ramping && w.joiners) {
    parts.push(ramping + " of the current team still in ramp-up");
  }
  return backlogTileHtml_("Workforce change", big, parts.join(" · "), "org");
}

/**
 * The sample size behind one metric's current value, or `null` when the
 * metric has no sample notion at all (no METRICS_ accessor — a registry-only
 * count like `inventory`/`arrived`/`cleared`/`netFlow`, or an absent-status
 * metric with no accessor to ask). Reads the SAME METRICS_[id].n(isos) every
 * other surface on this page already computes from, over the current
 * filtered scope — coverage and sample size are both filter-dependent here
 * for the same reason metricConfidence_ already is (a region slice can be
 * thinly sampled while the whole population isn't).
 */
function metricSampleN_(id) {
  var mm = METRICS_[id];
  if (!mm || !mm.n) return null;
  var isos = analysisHead_().head.isos;
  var n = mm.n(isos);
  return (n === null || n === undefined || isNaN(n)) ? null : n;
}

/**
 * The CLIENT twin of `sampleFloorFor_` (Code.js) — same contract, same
 * fail-closed-on-unknown-id rule, read from the registry the client already
 * has rather than re-declaring the floors a second time. `_test_clientParity_`
 * (Task 17) is expected to extract and diff this against the server copy the
 * same way it already does for `metricConfidence_`.
 * @returns {{ok:boolean, need:number|null, n:number}}
 */
function sampleFloorClient_(id, n) {
  var m = reg_(id);
  if (!m.id) return { ok: false, need: null, n: n };
  if (m.sampleFloor === null || m.sampleFloor === undefined) return { ok: true, need: null, n: n };
  var need = m.sampleFloor;
  return { ok: (Number(n) || 0) >= need, need: need, n: Number(n) || 0 };
}

/** This metric's current coverage (0–1), or null when it has no accessor or
    no measurable coverage — used ONLY to add context to an already-shelved
    (below-floor) entry (see shelfRows_ below); gate alone never shelves a
    metric on its own (below-gate still publishes, D5/2026-08-03). */
function metricCoverageNow_(id) {
  var mm = METRICS_[id];
  if (!mm || !mm.coverage) return null;
  var c = mm.coverage(analysisHead_().head.isos);
  return (c === null || c === undefined || isNaN(c)) ? null : c;
}

/** True when a metric that DOES have an accessor cannot currently compute at
    all — the export ran but this metric's own feed did not come back this
    refresh (distinct from registry status "absent", which is "no feed exists
    at all" — a permanent, structural gap rather than a this-run outage). */
function metricFeedDown_(id) {
  var mm = METRICS_[id];
  return !!mm && !mm.available();
}

/** The one-line "what would clear this" — derived from the registry entry
    itself, never hand-typed per metric, so a metric added to the registry
    tomorrow gets a sensible line for free. */
function shelfClears_(id, m) {
  if (m.status === "absent") return m.absentReason || "connect the feed this metric reads from";
  if (m.sampleFloor) return "collect " + m.sampleFloor + " or more measurable records in this window";
  return "reconnect the feed this metric reads from";
}

/**
 * ── §7 THE SHELF ─────────────────────────────────────────────────────────────
 * "Not measured this week", built from data rather than curated by hand — a
 * hand-written list cannot notice that a metric quietly dropped to two
 * samples and is still sitting on a card looking authoritative.
 *
 * Three sources, in this order, and a metric appears ONCE however many apply:
 *  · registry status "absent"  — no feed exists at all (Cycle Time, CSAT, rework)
 *  · below its sample floor    — nothing to average (spec D5)
 *  · its feed is unavailable   — the tab could not be read this run
 *
 * A metric below its COVERAGE GATE is deliberately NOT here — this function
 * never checks the gate on its own account, only as CONTEXT once a metric is
 * already shelved for being below its sample floor (the two-reasons case:
 * one shelf entry naming both, never two entries). Below-gate alone still
 * publishes (CONFIG_DH.SUPPRESS_BELOW_GATE = false, user decision
 * 2026-08-03); the gates band carries that read. Conflating the two would
 * reopen a settled decision by accident.
 *
 * NO OWNER on any row (D9). A standing table of names against failures in the
 * most-read view on the dashboard reads as a blame board, and that is not
 * what gets Jira tagging fixed.
 *
 * @returns {Array<{id, name, why:Array<string>, clears:string}>}
 */
function shelfRows_() {
  var reg = (MODEL.meta.registry || {}).metrics || {};
  var rows = [];
  Object.keys(reg).forEach(function (id) {
    var m = reg[id], why = [];
    if (m.status === "absent") why.push(m.absentReason || "no feed connected");
    var n = metricSampleN_(id);
    if (n !== null) {
      var fl = sampleFloorClient_(id, n);
      if (!fl.ok && fl.need !== null) {
        var reason = "resting on " + n + " measurable record" + (n === 1 ? "" : "s") +
                     " — needs " + fl.need;
        var cov = metricCoverageNow_(id);
        if (cov !== null && m.coverageGate && cov < m.coverageGate) {
          reason += "; also below its " + Math.round(m.coverageGate * 100) +
                    "% coverage gate (" + Math.round(cov * 100) + "%) — that alone would " +
                    "still publish, the sample size is what shelves it here";
        }
        why.push(reason);
      }
    }
    if (metricFeedDown_(id)) why.push("its feed could not be read this run");
    if (!why.length) return;
    rows.push({ id: id, name: m.name || id, why: why, clears: shelfClears_(id, m) });
  });
  return rows;
}

/**
 * ── THE VERDICT ────────────────────────────────────────────────────────────
 * Composed from ranked findings, never a sentence template.
 *
 * The prototype hardcoded "…and it grew by N items last week". On the real
 * feed net flow is +14/wk against a clearing rate of ~297 — the queue is
 * stable, and that clause would have been simply false. A template cannot
 * decline to make a claim; a findings list can.
 *
 * Rank order is FIXED and each finding carries its own materiality
 * threshold, because not every finding has a target to be distant from
 * (unowned share has none). A finding whose threshold is not met returns
 * nothing and never renders.

 * @returns {Array<{key:string, text:string, sev:string}>} worst first
 */
function verdictFindings_() {
  var out = [];
  var q = MODEL.queue || { assigned: {}, unassigned: {} };
  var rate = MODEL.meta.clearRateMedian;
  var un = q.unassigned ? q.unassigned.items : null;
  var total = (un === null || un === undefined) ? null : (q.assigned.items || 0) + un;

  // 1 — QUEUE DEPTH. Against the operating band, NOT a target: D11 ships
  // queueCover with target: null. Suppressed outright while the norm is
  // unpublishable, because "deep" is meaningless without a normal to be deep
  // against, and inventing one here would put a verdict on screen no owner
  // holds. `std.ok` (not `std.baseline !== null`) is the correct guard —
  // standardRate_ returns {ok:false} with baseline left `undefined`, not
  // `null`, under 5 periods, and `undefined !== null` is true in JS, so a
  // null-check here would silently let an unpublishable norm through.
  if (total !== null && rate) {
    var cover = total / rate;
    var std = stdFor_(coverSeries_(), { publish: true });
    if (std && std.ok && cover > std.hi) {
      out.push({ key: "depth", sev: "bad",
        text: "We are holding " + nfDh_(total) + " items and clearing about " +
              nfDh_(Math.round(rate)) + " a week — roughly " + n1Dh_(cover) +
              " weeks of work, against a normal of " + n1Dh_(std.baseline) + "." });
    }
  }

  // 2 — UNOWNED SHARE. Threshold 20%: below that it is housekeeping, above it
  // the queue has no owner and that is the finding.
  if (total !== null && total > 0 && un !== null) {
    var share = un / total;
    if (share >= 0.20) {
      out.push({ key: "unowned", sev: "bad",
        text: Math.round(share * 100) + "% of it has no owner — " + nfDh_(un) +
              " items nobody has picked up." });
    }
  }

  // 3 — NET FLOW. Threshold: 5% of the clearing rate. Below that the queue is
  // stable, and calling a stable queue "growing" is noise dressed as a finding.
  if (rate && MODEL.arrivalWeeks && MODEL.arrivalWeeks.length) {
    var nf = netFlowPerWeek_();
    if (nf !== null && Math.abs(nf) >= rate * 0.05) {
      out.push({ key: "flow", sev: nf > 0 ? "bad" : "good",
        text: nf > 0
          ? "It is growing by about " + nfDh_(Math.round(nf)) + " items a week."
          : "It is draining by about " + nfDh_(Math.abs(Math.round(nf))) + " items a week." });
    }
  }

  // 4 — GATES. Same last-complete-period head, and the same gapsRows_ call,
  // renderTrust_ already uses — one list of definitions, so the masthead and
  // the gates band can never disagree about which checks are failing.
  var gA = analysisHead_();
  var gHead = gA.done[gA.done.length - 1] || { label: "—", isos: [] };
  var gapsAll = gapsRows_(hygieneFor_(gHead.isos), hygienePeopleFor_(gHead.isos)) || [];
  var failing = gapsAll.filter(function (g) {
    return g.value !== null && g.gate !== null && g.value < g.gate;
  });
  if (failing.length) {
    out.push({ key: "gates", sev: "warn",
      text: failing.length + " of " + gapsAll.length +
            " evidence gates are below their bar." });
  }

  // 5 — SHELVED. Says how much of the scorecard is not answerable at all.
  var shelved = shelfRows_() || [];
  if (shelved.length) {
    out.push({ key: "shelf", sev: "warn",
      text: shelved.length + " metric" + (shelved.length === 1 ? " is" : "s are") +
            " not measurable this period." });
  }
  return out;
}

function flowMedian_(arr) {
  if (!arr || !arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function flowP85_(arr) {
  if (!arr || !arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  return s[Math.min(s.length - 1, Math.max(0, Math.ceil(s.length * 0.85) - 1))];
}

function fmtFlowVal_(v, unit) {

}

/**
 * Grid/comparison-chart formatter for the two Task 15 columns (blocking fix).
 * NOT folded into fmtFlowVal_ itself, because "items" already means something
 * else there: reg.cleared/reg.arrived (flowTileHtml_, above) also carry unit
 * "items" as a WHOLE issue count, and Math.round is correct for those — a
 * shared "items" branch giving them a decimal too would print "18.0 items"
 * on the flow band. clearedPerHead/queueCover are different populations under
 * the same unit strings: clearedPerHead lives in 0–2 (Math.round collapsed

function fmtGridVal_(v, unit) {

    // the exact bug this exists to fix (AMER's 0.968 → "1", indistinguishable

    return v.toFixed(1) + (unit === "weeks" ? "w" : "");

    }
    var byIso = {};
    (MODEL.arrivalWeeks || []).forEach(function (w) { byIso[w.iso] = w; });
    // Coverage-aware sum: null (not 0) when NO iso in the set has an arrivals
    // row. A period with zero rows is "nobody looked", not "measured zero" —
    // conflating the two would plot a flat zero line asserting "no work
    // arrived" for a gap in the export. sparkHtml_ already breaks its
    // polyline on null, so this alone restores the correct gap rendering.
    function sumOver(isos, field) {
      var found = false, t = 0;
      isos.forEach(function (iso) {
        if (byIso[iso]) { found = true; t += byIso[iso][field] || 0; }
      });
      return found ? t : null;
    }
    var series = trendPer.map(function (p) { return sumOver(p.isos, "created"); });
    var created = sumOver(head.isos, "created");
    var resolvedCt = sumOver(head.isos, "resolved");
    var createdUnassigned = sumOver(head.isos, "createdUnassigned");
    html += flowTileHtml_(m, created, {
      scope: "org",
      conf: null,
      trend: series, trendLabels: labels,
      context: created === null ? "no arrivals data for this period" :
        resolvedCt + " resolved this period — book " +
        (created > resolvedCt ? "growing" : created < resolvedCt ? "shrinking" : "flat") +
        " · population-wide, filters don't apply",
      detail: [
        "Issues created in the period, whole population, no assignee clause — the raw arrival " +
          "side of the backlog band's net-flow figure.",
        createdUnassigned > 0
          ? createdUnassigned + " of " + created + " arrived still unassigned" : "",
      ],
    });
  })();

  // 3 · Lead Time — median days, p85 companion (raw day values travel per
  // bucket; the client medians whatever the filters select).
  (function () {
    var m = reg.leadTime || { unit: "days", coverageGate: 0.9, name: "Lead Time" };
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.leadTimeBuckets || [], p.isos);
      return b.days.length ? flowMedian_(b.days) : null;
    });
    var b = bucketsFor_(MODEL.leadTimeBuckets || [], head.isos);
    var periodsWithData = series.filter(function (v) { return v !== null; }).length;
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.n / b.nAll : null, periodsWithData);
    html += flowTileHtml_(m, b.days.length ? flowMedian_(b.days) : null, {
      scope: "period",
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.n > 0
        ? "p85 " + fmtFlowVal_(flowP85_(b.days), "days") + " · " + b.n + " issues measured" + smallN_(b.n)
        : "no issues resolved this period",
      detail: [
        "Calendar days from Created to Resolution Date, non-epic issues, median of the period.",
        b.nAll > b.n ? (b.nAll - b.n) + " resolved issues had no usable created date" : "",
        unattribNote_("leadTime"),
      ],
    });
  })();

  // 2/6 · Cycle Time and Flow Efficiency are declared ABSENT in the registry
  // (no in-progress timestamps / no queue-state instrumentation). They used to
  // render as "—" placeholder tiles; retired from the UI 2026-08-05 (spec
  // §4.1) — the registry + Data Reference remain the record of what is
  // deliberately not measured.

  // 4 · On-Time Delivery — outcome tile, moved from the retired #tiles strip
  // (Task 16B). gatedTile_'s coverage gate, the planning-window notYetTile_
  // swap and the stdFor_ operating-rate read all survive the move unchanged
  // — verified by name in task-16b-report.md.
  (function () {
    var ot = bucketsFor_(MODEL.onTimeBuckets, outHead.isos);
    var otSeries = done.map(function (p) {
      var b = bucketsFor_(MODEL.onTimeBuckets, p.isos);
      return b.n > 0 ? b.onTime / b.n * 100 : null;
    });
    var otTrend = otSeries.slice(Math.max(0, hi - 5), hi + 1);
    // Name the scope on the card: "85% on time" means something different over
    // Stories/Tasks than over epics, and the switch lives in CONFIG_DH.
    var OT_SCOPE = {
      dictionary: { word: "resolved epics / milestones / commitments",
        why: "The Metrics Dictionary scope: epics, Milestone-type issues and Client-Commitment-labelled work. Stories and Tasks are excluded — an epic's due date is the client-facing milestone." },
      delivery: { word: "resolved issues",
        why: "Stories and Tasks — the team's own delivery commitments. Epics are excluded: an epic's due date is a programme milestone set by the PM and its resolution trails its last child, so the two measure different lifecycles." },
      epic: { word: "resolved epics",
        why: "Epics only — milestone-level client commitments, per the Metrics Dictionary. Stories and Tasks are excluded." },
      all: { word: "resolved items (all types)",
        why: "Every resolved issue type in one rate, epics included. Mixes programme milestones with task-level commitments — kept only for comparison with the pre-2026-08-03 number." },
    };
    var otSc = OT_SCOPE[MODEL.meta.onTimeScope] || OT_SCOPE.delivery;
    var otCmp = ot.n + " of " + ot.nAll + " " + otSc.word +
      ' <span title="' + esc_(otSc.why) + '">had a due date ⓘ</span>' + smallN_(ot.n);
    var otDetail = regCaveats_("onTime");
    function stable_(vals) { return vals.filter(function (v) { return v !== null; }).length; }
    var regOt = reg_("onTime");
    var otCovTrend = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.onTimeBuckets, p.isos);
      return b.nAll > 0 ? b.n / b.nAll * 100 : null;
    });
    var otConf = applyGatePolicy_(
      metricConfidence_(regOt.coverageGate, ot.nAll > 0 ? ot.n / ot.nAll : null, stable_(otTrend)));
    var otStd = stdFor_(otSeries, otConf);
    html += planning
      ? notYetTile_("On-Time Delivery", outHead, outHeadlineLabel)
      : gatedTile_("On-Time Delivery", otConf, regOt,
          "no resolved delivery items in this period under the active filters",
          (ot.nAll - ot.n) + " of " + ot.nAll + " resolved items have no due date",
          function () {
            return tileHtml_("On-Time Delivery", ot.n > 0 ? ot.onTime / ot.n * 100 : null, otCmp, otTrend,
                             { headlineLabel: outHeadlineLabel, target: tg.onTime,
                               std: otStd, trendLabels: labels, phase: phase,
                               detail: otDetail });
          }, outHeadlineLabel, otCovTrend, labels);
  })();

  // 5 · Forecast Accuracy — margin-tier outcome tile, moved from the retired
  // #tiles strip. canSeeMargin_() gating survives unchanged: omitted from the
  // html string entirely for a non-margin role, never dimmed — verified in
  // task-16b-report.md.
  if (margin) (function () {
    var fc = bucketsFor_(MODEL.forecastBuckets, outHead.isos);
    var fcSeries = done.map(function (p) {
      var b = bucketsFor_(MODEL.forecastBuckets, p.isos);
      return forecastAccuracyPct_(b.absVars);   // Dictionary formula, same as the headline
    });
    var fcTrend = fcSeries.slice(Math.max(0, hi - 5), hi + 1);
    var band = Math.round((MODEL.meta.forecastBand || 0.10) * 100);
    var fcHeadline = forecastAccuracyPct_(fc.absVars);
    var fcDetail = [];
    var fcCmp = '<span title="' + esc_(reg_("forecast").formula || "") +
      ' Floored at zero per epic, so one runaway engagement cannot drag a good period negative.">' +
      "mean accuracy over " + fc.n + " measurable epic" + (fc.n === 1 ? "" : "s") + " ⓘ</span>" +
      smallN_(fc.n);
    fcDetail.push("How often we landed inside the band, as opposed to how close on average: " +
      fc.nWithin + " of " + fc.n + " inside ±" + band + "%.");
    if (fc.nAll > fc.n) {
      fcDetail.push((fc.nAll - fc.n) + " of " + fc.nAll + " closed epics not measurable — no estimate, " +
        "or an estimate with no logged time at all: nothing to compare, so they count toward coverage " +
        "only instead of scoring as misses.");
    }
    var med = medianOf_(fc.absVars);
    if (med !== null) {
      fcDetail.push("Median absolute variance " + Math.round(med * 100) + "% — median of " +
        "|actual − estimate| ÷ estimate across the measurable epics. A median, not a mean: one " +
        "runaway engagement should not define the team's forecasting.");
    }
    var misses = fc.nMissOver + fc.nMissUnder;
    if (misses > 0) {
      var overShare = Math.round(fc.nMissOver / misses * 100);
      fcDetail.push("Of " + misses + " miss" + (misses === 1 ? "" : "es") + ", " + overShare +
        "% over-run — over-runs burn margin, under-runs mean capacity was held that could have " +
        "been sold. Opposite conversations.");
    }
    fcDetail = fcDetail.concat(regCaveats_("forecast"));
    function stable_(vals) { return vals.filter(function (v) { return v !== null; }).length; }
    var regFc = reg_("forecast");
    var fcCovTrend = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.forecastBuckets, p.isos);
      return b.nAll > 0 ? b.n / b.nAll * 100 : null;
    });
    var fcConf = applyGatePolicy_(
      metricConfidence_(regFc.coverageGate, fc.nAll > 0 ? fc.n / fc.nAll : null, stable_(fcTrend)));
    var fcStd = stdFor_(fcSeries, fcConf);
    html += planning
      ? notYetTile_("Forecast Accuracy", outHead, outHeadlineLabel)
      : gatedTile_("Forecast Accuracy", fcConf, regFc,
          "no epics closed in this period under the active filters",
          (fc.nAll - fc.n) + " of " + fc.nAll + " closed epics have no estimate or no logged time",
          function () {
            return tileHtml_("Forecast Accuracy", fcHeadline, fcCmp, fcTrend,
                             { headlineLabel: outHeadlineLabel, target: tg.forecast,
                               std: fcStd, trendLabels: labels, phase: phase,
                               detail: fcDetail });
          }, outHeadlineLabel, fcCovTrend, labels);
  })();

  // 6 · Quality / Rework — outcome tile, moved from #tiles. qualityTile_
  // itself is unchanged (already its own function); only its caller moved.
  html += planning ? notYetTile_("Quality / Rework", outHead, outHeadlineLabel)
                   : qualityTile_(done, trendPer, labels, outHeadlineLabel, outHead, hi, phase);

  // 7 · Throughput — Σ estimate-hours delivered.
  (function () {
    var m = reg.throughput || { unit: "hrs", coverageGate: 0.6, name: "Throughput" };
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], p.isos);
      return b.nAll > 0 ? b.estHrs : null;
    });
    var b = bucketsFor_(MODEL.throughputBuckets || [], head.isos);
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.nEst / b.nAll : null,
      series.filter(function (v) { return v !== null; }).length);
    html += flowTileHtml_(m, b.nAll > 0 ? b.estHrs : null, {
      scope: "period",
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.nAll > 0
        ? b.nEst + " of " + b.nAll + " resolved issues carried an estimate" + smallN_(b.nEst)
        : "no issues resolved this period",
      detail: [
        "Sum of Original Estimate hours on non-epic issues resolved in the period. Unestimated work delivers invisibly here — the fix is estimate fill.",
        unattribNote_("throughput"),
      ],
    });
  })();

  // 8 · Bug Count — POPULATION-WIDE (registry deviation: bugs are routinely
  // unassigned at creation, so a roster join would silently drop most of them).
  (function () {
    var m = reg.bugCount || { unit: "bugs", coverageGate: 0, name: "Bug Count" };
    if (!MODEL.meta.bugsAvailable) {
      html += flowTileHtml_(m, null,
        { scope: "period", unavailable: "export predates Jira Backlog.js v3.9.0 — no Jira Bugs tab yet" });
      return;
    }
    var byIso = {};
    (MODEL.bugWeekly || []).forEach(function (w) { byIso[w.iso] = w; });
    function sumOver(isos, field) {
      var t = 0;
      isos.forEach(function (iso) { if (byIso[iso]) t += byIso[iso][field] || 0; });
      return t;
    }
    var series = trendPer.map(function (p) { return sumOver(p.isos, "nCreated"); });
    var created = sumOver(head.isos, "nCreated");
    var resolved = sumOver(head.isos, "nResolved");
    html += flowTileHtml_(m, created, {
      scope: "period",
      conf: null,
      trend: series, trendLabels: labels,
      context: resolved + " resolved this period — book " +
        (created > resolved ? "growing" : created < resolved ? "shrinking" : "flat") +
        " · population-wide, filters don't apply",
      detail: [
        "Bug issues created in the period, whole population. A zero here is a REAL zero — bugs are a countable absence.",
        "Noise-filtered at export: Won't Do / Duplicate / Canceled bugs were reports, not defects.",
        "Distinct from Quality/Rework — a bug feeds neither leg of the rework rate.",
      ],
    });
  })();

  el.innerHTML = html;
}

/** "N issues not attributable to a roster person" note, or "" when clean. */
function unattribNote_(key) {
  var u = (MODEL.meta.jiraUnattributed || {})[key] || 0;
  return u > 0 ? u + " issues excluded — assignee doesn't join the roster (window-wide count)" : "";
}

/**
 * Quality / Rework — the Metrics Dictionary's fourth metric, live since
 * schema v10 (was a "data pending" placeholder).
 *
 *   Rework Rate = (reopened OR Rework-linked) ÷ delivered in period × 100
 *
 * LOWER IS BETTER, which is why its target carries `invert` — without that a
 * 3% rework rate would paint red for being "below target".
 *
 * The card is explicit about which of the two signals it actually saw. Reopen
 * detection needs expand=changelog in the export and is off by default, so most
 * of the time this rate is LINK-ONLY and therefore an understatement. Saying so
 * on the card is the difference between a floor and a measurement.
 */
function qualityTile_(done, trendPer, trendLabels, headlineLabel, head, hi, phase) {
  var reg = reg_("quality");
  var tg = (MODEL.meta.targets || {}).quality ||
           (reg.target ? { green: reg.target.green, amber: reg.target.amber } : null);
  if (tg) tg = { green: tg.green, amber: tg.amber, invert: reg.invertTarget !== false };

  if (!MODEL.meta.jiraAvailable || !MODEL.reworkBuckets) {
    // No reworkBuckets at all = a pre-v10 cached payload, not an empty period.
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: MODEL.meta.jiraAvailable
        ? "rework feed not in this payload — refresh to rebuild on the current schema"
        : "Jira data unavailable",
    });
  }

  var q = bucketsFor_(MODEL.reworkBuckets, head.isos);
  var series = done.map(function (p) {
    var b = bucketsFor_(MODEL.reworkBuckets, p.isos);
    return b.nDelivered > 0 ? b.nRework / b.nDelivered * 100 : null;
  });
  var hIdx = hi === undefined ? done.length - 1 : hi;
  var trend = series.slice(Math.max(0, hIdx - 5), hIdx + 1);

  if (!q.nDelivered) {
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: "no delivered work in this period under the active filters",
    });
  }

  var pct = q.nRework / q.nDelivered * 100;
  // Reopens are one of the two signals in the Dictionary definition. When the
  // export never fetched the changelog (CONFIGJ.FETCH_CHANGELOG off) the
  // numerator CANNOT contain them, so the rate is a floor whatever its value.
  var isFloor = q.nReopenCov === 0;
  // Coverage = the share of delivered work whose rework signals were actually
  // measurable. The link signal exists on every v3.6.0 row; the reopen signal
  // only where the changelog was fetched. With reopens off, half the definition
  // is unmeasured and the confidence gate has to see that.
  var reopenCov = q.nDelivered > 0 ? q.nReopenCov / q.nDelivered : 0;
  var coverage = (1 + reopenCov) / 2;   // link signal always present, reopen maybe
  var conf = applyGatePolicy_(
    metricConfidence_(reg.coverageGate, coverage,
                      series.filter(function (v) { return v !== null; }).length));

  var qDetail = [];
  var cmp = q.nRework + " of " + q.nDelivered + " delivered items needed rework" +
    smallN_(q.nDelivered);
  qDetail.push("Signals: " + q.nLinked + " rework-linked" +
    (q.nReopenCov > 0
      ? ", " + q.nReopened + " reopened (of " + q.nReopenCov + " checked)."
      : ". Reopens NOT measured — the export did not fetch the Jira changelog."));

  // The single most important caveat on this card, stated in plain words rather
  // than buried in the ⓘ: a link-only rate is a FLOOR, not a measurement.
  // The floor caveat is NOT demoted: it is the difference between "we ship clean
  // work" and "we cannot see rework". It rides on the hero's own signal line now
  // (tileHtml_ opts.floor), which is MORE prominent than the fifth body line it
  // used to occupy, not less.
  if (q.nReopenCov === 0) {
    qDetail.push("Reopen detection needs expand=changelog on the Jira export " +
      "(CONFIGJ.FETCH_CHANGELOG), which is off by default because it is expensive. Until it is " +
      "on, an issue that was reopened but never link-tagged is invisible here.");
  }
  qDetail.push("CSAT companion not connected: the Metrics Dictionary pairs this rate with a CSAT " +
    "score (0–100). The survey API is not wired — PR-09, target 2026.W37.");
  qDetail = qDetail.concat(regCaveats_("quality"));

  return gatedTile_("Quality / Rework", conf, reg,
    "no delivered work in this period under the active filters",
    Math.round((1 - coverage) * 100) + "% of the rework definition is unmeasured",
    function () {
      return tileHtml_("Quality / Rework", pct, cmp, trend,
                       { headlineLabel: headlineLabel, target: tg, phase: phase,
                         floor: isFloor, detail: qDetail,
                         floorWhy: "Reopen detection is one of the two signals in this metric and " +
                           "the export did not fetch it (CONFIGJ.FETCH_CHANGELOG is off), so the " +
                           "numerator can only undercount. The true rate is this value or higher — " +
                           "which is why it carries no red/amber/green verdict.",
                         std: stdFor_(series, conf), trendLabels: trendLabels });
    }, headlineLabel, series.map(function () { return coverage * 100; }), trendLabels);
}

// ══════════════════════════════════════════════════════════════════════════
// METRIC ACCESSORS — one definition of "the number", reused by every view
//
// The KPI cards, the Executive comparison bars and the recoverable-hours pulse
// all have to compute the same rate over different slices. Routing them through
// one table is what keeps a region bar and the KPI card from quietly
// disagreeing: there is exactly one expression per metric, and it lives here.
// ══════════════════════════════════════════════════════════════════════════
var METRICS_ = {
  util: {
    id: "util", targetKey: "util",
    label: function () { return nsLive_() ? "Billable Utilization" : "Capacity Utilization (tracked)"; },
    axis: function () {
      return (nsLive_() ? "billable" : "tracked") +
        " hours ÷ scheduled capacity (headcount × standard hours)";
    },
    available: function () { return true; },
    value: function (isos) {
      var s = utilFor_(isos);
      // Gross scheduled capacity — the same denominator as the KPI headline.
      // One definition per metric; a chart that quietly used the net rate would
      // disagree with the card above it.
      return nsLive_() ? s.grossPct : s.grossTrackedPct;
    },
    // Coverage drives the confidence gate — same rule as the KPI card, so a
    // slice too thinly classified to publish on the card is not publishable in
    // a chart either.
    coverage: function (isos) {
      var s = utilFor_(isos);
      if (!nsLive_()) return s.avail > 0 ? 1 : null;
      var cov = s.tracked > 0 ? s.trackedCov / s.tracked : null;
      return cov;
    },
    n: function (isos) { return utilFor_(isos).avail; },
  },
  onTime: {
    id: "onTime", targetKey: "onTime",
    label: function () { return "On-Time Delivery"; },
    axis: function () { return "resolved delivery items on or before their due date"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.n > 0 ? b.onTime / b.n * 100 : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.onTimeBuckets, isos).n; },
  },
  quality: {
    id: "quality", targetKey: "quality",
    label: function () { return "Quality / Rework"; },
    axis: function () { return "delivered items needing rework (lower is better)"; },
    available: function () { return !!(MODEL.meta.jiraAvailable && MODEL.reworkBuckets); },
    value: function (isos) {
      var b = bucketsFor_(MODEL.reworkBuckets, isos);
      return b.nDelivered > 0 ? b.nRework / b.nDelivered * 100 : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.reworkBuckets, isos);
      // Link signal is always present on a v3.6.0 export; the reopen signal only
      // where the changelog was fetched. Half the definition unmeasured = 50%.
      return b.nDelivered > 0 ? (1 + b.nReopenCov / b.nDelivered) / 2 : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.reworkBuckets, isos).nDelivered; },
  },
  forecast: {
    id: "forecast", targetKey: "forecast",
    label: function () { return "Forecast Accuracy"; },
    axis: function () { return "closed epics inside the ±" +
      Math.round((MODEL.meta.forecastBand || 0.10) * 100) + "% estimate band"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      return forecastAccuracyPct_(bucketsFor_(MODEL.forecastBuckets, isos).absVars);
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.forecastBuckets, isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.forecastBuckets, isos).n; },
  },
  // 🌊 Flow additions (Task 10, 2026-08-05): Lead Time and Throughput join the
  // comparison chips. Both are person-joined and period-shaped — the same two
  // things every other METRICS_ entry already requires — via bucketsFor_, so
  // scopedMetric_'s one-accessor rule (see its own doc comment) holds for them
  // with no special case. targetKey: null on purpose: neither has a Metrics
  // Dictionary target today, and ragOf_/hbarChart_ are already null-safe on a
  // missing target, so the bars render neutral rather than inventing a verdict.
  leadTime: {
    id: "leadTime", targetKey: null, unit: "days",
    label: function () { return "Lead Time"; },
    axis: function () { return "median days created → resolved (lower is faster)"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      var b = bucketsFor_(MODEL.leadTimeBuckets || [], isos);
      return b.days && b.days.length ? flowMedian_(b.days) : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.leadTimeBuckets || [], isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.leadTimeBuckets || [], isos).n; },
  },
  throughput: {
    id: "throughput", targetKey: null, unit: "hrs",
    label: function () { return "Throughput"; },
    axis: function () { return "estimate-hours delivered in the period"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], isos);
      return b.nAll > 0 ? b.estHrs : null;
    },
    // Coverage: nEst/nAll — throughputBuckets_ (Code.js) never populates a `.n`
    // field on a throughput bucket (only nAll/nEst/estHrs), so `b.n` here reads
    // undefined and bucketsFor_'s `out.n += b.n` (no ||0 fallback) turns it
    // into NaN — metricConfidence_ then reads NaN as no-data and the operating
    // band/verdict silently never draw. Same formula renderFlow_'s throughput
    // tile already uses (Dashboard.html ~2513) — one definition, not two.
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], isos);
      return b.nAll > 0 ? b.nEst / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.throughputBuckets || [], isos).nEst; },
  },
  // ── Task 15 grid columns (spec 2026-08-06 §6) ──────────────────────────────
  // Both carry targetKey: null on purpose (D11): nobody owns a per-head or a
  // weeks-to-clear bar, and an unratified target on the C-suite grid reads as
  // agreed the moment it is on screen. Labels/axis read from reg_() rather
  // than a literal string — the registry is the one place the "no target,
  // norm-graded only" language already lives (both metrics' `deviations`).
  clearedPerHead: {
    id: "clearedPerHead", targetKey: null, unit: "items",
    label: function () { return reg_("clearedPerHead").name || "Cleared per Person"; },
    axis: function () {
      return reg_("clearedPerHead").formula || "items resolved ÷ people in the group ÷ weeks in period";
    },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    // Items cleared ÷ DISTINCT headcount ÷ weeks in the window — the fix for
    // the prototype's flat-target grading, which ranked a group by size: 8
    // people clearing 12 items scored a miss while 63 clearing 61 scored a
    // pass. Per head, per week, the smaller group is not automatically worse.
    value: function (isos) {
      if (!isos || !isos.length) return null;
      var head = filteredPeople_().filter(function (p) { return existsIn_(p, isos); }).length;
      if (head <= 0) return null;
      var b = bucketsFor_(MODEL.throughputBuckets || [], isos);
      return b.nAll / head / isos.length;
    },
    // coverageGate is 0 in the registry — this is a ratio of a count to a
    // headcount, never a per-record attribute gate (same reasoning as
    // planCov's coverage below). metricConfidence_ still needs a non-null
    // number to tell "measured" from "nothing in scope" apart.
    coverage: function (isos) {
      var head = filteredPeople_().filter(function (p) { return existsIn_(p, isos); }).length;
      return head > 0 ? 1 : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.throughputBuckets || [], isos).nAll; },
  },
  queueCover: {
    id: "queueCover", targetKey: null, unit: "weeks",
    // NOT reg_("queueCover") (blocking fix): the server registry entry of
    // that name describes the HERO's whole-population formula — "(assigned
    // open + unassigned open) ÷ median(resolved per week…)" — because
    // unassigned work belongs to no group and the hero is the only surface
    // that can report it. This grid column's own value() below divides the
    // ASSIGNED-ONLY snapshot by the ASSIGNED-ONLY clearing rate (same as the
    // backlog band's filterable sub-row) — a materially smaller number
    // (~4-5w here vs ~11w on the hero) under the SAME shared name/formula
    // read as one metric disagreeing with itself. Own literal strings, own
    // name, so hero and grid are visibly different measures.
    label: function () { return "Assigned wks to clear"; },
    axis: function () { return "open assigned inventory ÷ median assigned weekly clearing rate"; },
    // Overrides renderCompare_'s reg_(m.id).formula fallback for the same
    // reason label()/axis() above don't read reg_("queueCover") — the
    // registry's formula names the unassigned half this computation never
    // touches. Same text as axis() on purpose: there is no fuller server
    // definition to point to that wouldn't reintroduce the mismatch.
    detail: function () { return "open assigned inventory ÷ median assigned weekly clearing rate"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    // Snapshot ÷ trailing rate (grain: "snapshot ÷ trailing rate", same as the
    // backlog band's assigned sub-row) — flowOpenFor_ and assignedClearRate_
    // both read passesFilters_ with no skip, so SCOPE_NAMES_ (scopedMetric_)
    // already narrows both to one comparison bar's population; isos plays no
    // part, same as the ASSIGNED tile in the backlog band (D3: fixed to its
    // own trailing-weeks basis, not the period picker).
    value: function () {
      var open = flowOpenFor_();
      var rate = assignedClearRate_();
      return rate ? ((open.wipN || 0) + (open.todoN || 0)) / rate : null;
    },
    coverage: function () { return assignedClearRate_() ? 1 : null; },
    // n() is deliberately NOT group-specific: the floor this feeds is "is
    // there enough CALENDAR history for a trailing rate at all", the same
    // question assignedClearRate_'s own CLEAR_RATE_MIN_N_ guard asks, and that
    // question has one answer regardless of which bar is asking it.
    n: function () { return trailingCompleteWeeks_(MODEL.meta.clearRateWeeks || 8).length; },
  },
  // The only metric a window that has not happened yet can be compared on
  // (2026-08-06). targetKey null on purpose: no planned-coverage bar has been
  // agreed, so the bars carry no RAG and no reference line — the comparison is
  // "who is covered and who isn't", which the ranking already answers.
  planCov: {
    id: "planCov", targetKey: null,
    label: function () { return "Planned Coverage"; },
    axis: function () { return "planned hours ÷ scheduled capacity"; },
    available: function () { return planWeeks_().length > 0; },
    value: function (isos) { return planFor_(isos).pct; },
    coverage: function (isos) { return planFor_(isos).cap > 0 ? 1 : null; },
    n: function (isos) { return planFor_(isos).cap; },
  },
};

/** Metric ids the current payload can actually chart — in the SAME order as
    the KPI cards (On-Time, Forecast, Utilization, Quality; user 2026-08-04),
    with the two joinable 🌊 Flow metrics appended (Task 10, 2026-08-05).
    Backlog/WIP (snapshot — no period grain) and Bug Count (population-wide —
    no person join to dimension by) are NOT comparable metrics; see the tile
    scope tags. Deliberate narrowing of spec §4.2, flagged at review. */
var METRIC_ORDER_ = ["onTime", "forecast", "util", "quality", "leadTime", "throughput",
                     "clearedPerHead", "queueCover", "planCov"];
function liveMetrics_() {
  // A PLANNING window and a completed one are disjoint metric sets, not a
  // superset and a subset: everything except planCov needs work that already
  // happened, and planCov over a closed week is a plan nobody can act on any
  // more. Filtering here rather than in each available() means activeMetric_
  // re-points the comparison chart by itself when the reader moves the picker.
  var planning = planningPhase_();
  return METRIC_ORDER_.filter(function (k) {
    if (!METRICS_[k]) return false;
    if (MARGIN_METRICS_[k] && !canSeeMargin_()) return false;
    if (planning !== (k === "planCov")) return false;
    return METRICS_[k].available();
  });
}

/**
 * The five columns of the §6 comparison grid (spec 2026-08-06): the four
 * classic rates people already read the bullet chart on, plus the two D11
 * additions. Deliberately narrower than METRIC_ORDER_ — Lead Time and
 * Throughput stay reachable as bullet-chart-only metric chips (they already
 * had their own compact tiles in §4, Task 10) rather than doubling up as
 * grid columns too.
 *
 * Filtered through liveMetrics_() so the grid inherits its planning-phase
 * collapse for free: on a forward window liveMetrics_() already returns only
 * "planCov", so gridMetrics_() does too and the grid re-points itself with no
 * separate switch to keep in sync.
 */
var GRID_METRIC_IDS_ = ["onTime", "forecast", "util", "clearedPerHead", "queueCover", "planCov"];
function gridMetrics_() {
  return liveMetrics_().filter(function (id) { return GRID_METRIC_IDS_.indexOf(id) !== -1; });
}

/** The metric the Trends view is on, falling back if Jira went away. */
function activeMetric_() {
  var ids = liveMetrics_();
  if (ids.indexOf(STATE.metric) === -1) STATE.metric = ids[0] || "onTime";
  return METRICS_[STATE.metric];
}

/**
 * One metric's full series over the complete periods in the window, plus its
 * confidence and its operating rate. The single call every new view uses.
 *
 * The operating rate has a WEEKLY FALLBACK. The export window holds 52 weeks,
 * which is ~11 complete months but only 3 complete fiscal quarters — so on the
 * Quarter view a norm built from the displayed unit could never reach the
 * 5-period minimum, and the feature would simply be missing exactly where an
 * executive is most likely to look. Weeks are the grain the user framed this in
 * ("the historical trend found week over week") and the metric is a RATE, so a
 * weekly median is directly comparable to a quarterly value. When the fallback
 * is used it is labelled as such — an unlabelled change of basis would be worse
 * than no rate at all.
 */
function metricSeries_(m, periods) {
  var pts = periods.map(function (p) {
    var v = m.value(p.isos);
    return { label: p.label, value: v, isos: p.isos, note: null };
  });
  var vals = pts.map(function (p) { return p.value; });
  var last = periods.length ? periods[periods.length - 1] : { isos: [] };
  var stable = vals.filter(function (v) { return v !== null; }).length;
  // Same two-step as the KPI cards: metricConfidence_ says how good the
  // attribution is, applyGatePolicy_ says what to do about it. Routing the
  // charts through the SAME policy is what stops the Trends view from going dark
  // on a metric the Executive tab is publishing (CONFIG_DH.SUPPRESS_BELOW_GATE).
  var conf = applyGatePolicy_(
    metricConfidence_(reg_(m.id).coverageGate, m.coverage(last.isos), stable));
  var std = stdFor_(vals, conf);
  if (std && !std.ok && STATE.period !== "week") {
    var wStd = stdFor_(completeWeekSeries_(m), conf);
    if (wStd && wStd.ok) { wStd.basis = "week"; wStd.displayUnit = PERIOD_LABELS[STATE.period].toLowerCase(); std = wStd; }
  }
  var tgt = (MODEL.meta.targets || {})[m.targetKey] || null;
  // Carry the lower-is-better flag from the registry onto the target object the
  // charts colour by, so a bar chart of Rework Rate doesn't paint the best
  // teams red.
  if (tgt && reg_(m.id).invertTarget) tgt = { green: tgt.green, amber: tgt.amber, invert: true };
  return { points: pts, values: vals, conf: conf, std: std, target: tgt };
}

/** The metric per COMPLETE ISO week over the whole export window — the widest
    honest basis for an operating rate, and the one the user asked for. */
function completeWeekSeries_(m) {
  var plan = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) {
    if (wk && wk.iso && wk.status !== "done") plan[wk.iso] = 1;
  });
  return allIsoWeeks_().filter(function (iso) { return !plan[iso]; })
    .map(function (iso) { return m.value([iso]); });
}

// ══════════════════════════════════════════════════════════════════════════
// EXECUTIVE VIEW — the comparison chart
//
// The cards say how the whole slice is doing. The one question that always
// follows is "where?", and answering it used to mean changing the Region filter
// five times and remembering five numbers. One labelled chart, every category
// against the same 0–100 axis, and the target and operating band drawn in.
// The bars are a READ-ONLY comparison (user 2026-08-03): filtering stays in the
// header controls, so there is one way to change scope rather than two.
// ══════════════════════════════════════════════════════════════════════════
/** Metric selector chips for the Executive comparison — the one surface that
    reads STATE.metric. */
function metricChips_() {
  return liveMetrics_().map(function (id) {
    return '<span class="chip' + (STATE.metric === id ? " on" : "") +
      '" onclick="setMetric_(\'' + id + '\')" title="' + esc_(reg_(id).definition || "") + '">' +
      esc_(METRICS_[id].label()) + "</span>";
  }).join("");
}

var COMPARE_LABELS = { region: "Region", team: "Team", pm: "PM", family: "Job family" };
// Prose forms, declared rather than derived. `.toLowerCase()` on the chip label
// produced "4 pms measurable" and a naive + "s" would produce "job familys" —
// small, but this text sits under an executive chart.
var COMPARE_NOUN = {
  region: { one: "region", many: "regions" },
  team:   { one: "team",   many: "teams" },
  pm:     { one: "PM",     many: "PMs" },
  family: { one: "job family", many: "job families" },
};
function cmpNoun_(dim, n) {
  var w = COMPARE_NOUN[dim] || { one: dim, many: dim + "s" };
  return n === 1 ? w.one : w.many;
}
// Most bars a horizontal comparison chart draws BY DEFAULT. Above this it stops
// being a comparison and becomes a scrolling list nobody reads to the end of —
// but the cap is a default, not a wall: "Show all" lifts it (STATE.compareAll),
// because a team that isn't on the chart reads as a team that isn't in the data.
var HBAR_MAX_ROWS_ = 12;

/** Toggles between the top-N comparison and the full list. */
function toggleCompareAll_() {
  STATE.compareAll = !STATE.compareAll;
  renderCompare_();
}

function setCompare_(dim) {
  STATE.compare = dim;
  renderCompare_();
}

/**
 * ── §6 THE GRID — one cell of the metric × dimension table ─────────────────
 * Never a bare, uncoloured number that looks graded (brief D4): every branch
 * states WHY there is no colour, so "no verdict" reads differently from
 * "nothing here" and differently again from "not big enough to grade".
 *
 * Priority, checked in this order because each is a stronger reason than the
 * one below it: no data at all > too few people to grade > no target rule for
 * this metric at all (D11) > graded against a target.
 * @param {{value:?number, n:number, target:?Object, std:?Object, unit:?string}} o
 */
function gridCellHtml_(o) {
  var lbl = o.unit ? function (v) { return fmtGridVal_(v, o.unit); } : function (v) { return Math.round(v) + "%"; };
  if (o.value === null || o.value === undefined) {
    return '<td class="tnum gridCell" title="No measurable data in this slice.">—</td>';
  }
  var txt = lbl(o.value);
  // Sub-10 groups keep their value and lose ONLY the colour (§2.1) — the grey
  // dot sits BESIDE the number, never in place of it, checked before target
  // grading so a small group is never coloured by accident.
  if (o.n !== null && o.n !== undefined && o.n < 10) {
    return '<td class="tnum gridCell" title="Fewer than 10 people — the value is real, it is ' +
      'just never graded. A region moves on one person, and a red badge on six people reads ' +
      'as a systemic failure that is not there.">' +
      '<span class="sigDot sigSmall">●</span> ' + txt +
      ' <span class="cellSub">ungraded (small n)</span></td>';
  }
  if (!o.target) {
    // D11: no target has been agreed, so the cell never colours. When a norm
    // publishes, the operating band is what "graded" means for this column —
    // drawn on the bullet chart below, not as a per-cell verdict here. When it
    // does NOT publish either, the cell says so explicitly, so it can never be
    // mistaken for a plain number that simply wasn't coloured.
    if (o.std && o.std.ok) {
      return '<td class="tnum gridCell" title="No target has been agreed for this metric. ' +
        'Graded against the operating band (' + lbl(o.std.lo) + '–' + lbl(o.std.hi) +
        ') on the chart below.">' + txt + "</td>";
    }
    return '<td class="tnum gridCell" title="No target has been agreed, and there is not yet ' +
      'enough history for an operating norm either.">' + txt +
      ' <span class="cellSub">no reference</span></td>';
  }
  var rag = ragOf_(o.value, o.target);
  var cls = { g: "sigGood", a: "sigWarn", r: "sigBad" }[rag] || "";
  return '<td class="tnum gridCell"><span class="sigDot ' + cls + '">' + RAG_MARK[rag] +
    "</span> " + txt + "</td>";
}

/** Click-through from a bar to the matching filter (toggles off if re-clicked). */

function renderCompare_() {
  var panel = document.getElementById("comparePanel");
  if (!panel) return;
  var m = activeMetric_();
  var A = analysisHead_();
  var done = A.done, head = A.head;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var target = (MODEL.meta.targets || {})[m.targetKey] || null;

  // Compare-by chips, cascaded like every other control: a dimension with
  // nothing in it under the current filters is offered but marked.
