<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
:root{
  --void:#0F1941; --orbe:#058CDC; --ivory:#DCCDBE; --cream:#FFFAF5;
  --royal:#2864E6; --june:#FF9B87; --slate:#64748B;
  --bg:var(--cream); --surface:#ffffff; --surface-2:#FBF6F0;
  --border:#E7DDD2; --text:var(--void); --muted:#6B7280;
  --up:#1F8A57; --down:#C2410C; --neutral:#E7DDD2;
  --winner:#FF9B87; --pos:#1F8A57; --warn:#C2410C; --amber:#B45309;
  --shadow:0 1px 2px rgba(15,25,65,.06), 0 8px 24px rgba(15,25,65,.06);
  --scale:1;
  /* ── Chart marks ──
     Deliberately SEPARATE tokens from the text colours above, because marks and
     text have different jobs and different constraints. The text amber
     (--amber #B45309) and the text red (--warn #C2410C) are only ΔE 4.1 apart
     in normal vision and ΔE 0.1 under deuteranopia — as *text* that is fine
     (they are never adjacent and each carries a word), but as two fills side by
     side in a chart they are the same colour. The chart set below passes the
     lightness-band, chroma, CVD-separation (worst adjacent ΔE 8.7 protan),
     normal-vision (16.5) and contrast checks. --c-warn sits at 2.94:1 on white,
     just under the 3:1 mark, so every bar using it also carries a value label
     and a ✔/▲/✖ glyph and appears in a table view — status is never colour
     alone (FR-4.4). Verified with the dataviz palette validator, not by eye. */
  --c-good:#1F8A57; --c-warn:#CA8A04; --c-bad:#C2410C;
  --c-series:#058CDC; --c-ref:#64748B; --c-target:#2864E6;
  --grid:#EDE4DA; --plot:#ffffff;
  /* Workload-bar segments. Their own tokens because the light values could not
     be reused in dark: billable was --void (#0F1941) on a #141C3D surface —
     the most important segment in the grid was effectively invisible in dark
     mode, which is how a manager reads a full bar as an empty one. */
  /* Time off gets its OWN segment token (user 2026-08-06). Tracked time off is
     inside non-billable by rule, so without a separate mark a week of PTO and a
     week of unbilled project work draw the identical bar — and "why is your
     non-billable so high" gets asked of someone who was on holiday. Warm sand
     is a hue step away from the cool slate of real non-billable work, which is
     the distinction being drawn. */
  --seg-bill:#0F1941; --seg-nonbill:#64748B; --seg-idle:#E7DDD2; --seg-off:#C08B5C;
}
[data-theme="dark"]{
  --bg:#090F26; --surface:#141C3D; --surface-2:#0F1733;
  --border:#1E295A; --text:#FFFAF5; --muted:#94A3B8;
  --up:#34D399; --down:#FB7185; --neutral:#1E295A;
  --winner:#FF9B87; --pos:#34D399; --warn:#FDBA74; --amber:#FDBA74;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  /* Dark chart marks are SELECTED against the dark surface, not flipped from
     light. The light amber (#CA8A04) is invisible on #141C3D; #FBBF24 clears it
     and lifts CVD separation from the old --amber pairing (ΔE 4.4 protan, a
     fail) to 10.6. These sit slightly above the validator's 0.43–0.77 lightness
     band on purpose — that band is calibrated for a light surface, and marks on
     a near-black panel have to be lighter to hold 3:1 contrast, which they do. */
  --c-good:#34D399; --c-warn:#FBBF24; --c-bad:#FB7185;
  --c-series:#38BDF8; --c-ref:#94A3B8; --c-target:#7BA4FF;
  --grid:#1E295A; --plot:#141C3D;
  /* Billable takes the series blue so a filled bar reads as filled; non-billable
     stays a cool grey a clear step away from it; idle is a near-surface navy so
     empty capacity reads as absence rather than as another kind of work. */
  --seg-bill:#38BDF8; --seg-nonbill:#94A3B8; --seg-idle:#222D57; --seg-off:#E9A76B;
}
/* Fluid type/space scale — every font-size and several key dimensions below multiply
   this token, so laptop and (especially) ultrawide screens get visibly bigger text and
   controls instead of the same fixed-size column floating in empty margin. */
@media(max-width:420px){:root{--scale:.94}}
@media(min-width:1024px){:root{--scale:1.08}}
@media(min-width:1440px){:root{--scale:1.16}}
@media(min-width:1920px){:root{--scale:1.28}}
@media(min-width:2560px){:root{--scale:1.4}}
@media(min-width:3440px){:root{--scale:1.5}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto','Franklin Gothic Book',-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:calc(16px*var(--scale))}
/* Identity Lockdown typography: headings + hero numbers in the condensed face */
h1,h2,h3,.title,.tile .big{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
/* Sticky filter bar: KPIs scroll away, Region/Team/Family/search stay pinned
   (user feedback 2026-07-31: while scrolling, only filters + table header remain).
   Two intentional rows (feedback round 2 — the flat chip strip read as one messy
   row): identity + action buttons on top, labeled filter groups below. */
.hdr{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
     position:sticky;top:0;z-index:100;background:var(--bg);
     padding:calc(8px*var(--scale)) 0;border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Labeled segmented control per filter group — a group reads as ONE control:
   tiny uppercase name + joined pills sharing a border. */
.fgroup{display:flex;align-items:center;gap:7px}
.fgroup .flbl{font-size:calc(9px*var(--scale));color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.seg{gap:0;display:inline-flex;border:1px solid var(--border);border-radius:999px;
     overflow:hidden;background:var(--surface)}
.seg .chip{border:none;border-radius:0;background:transparent}
.seg .chip+.chip{border-left:1px solid var(--border)}
.seg .chip.on{background:var(--orbe);color:#fff}
.hdr h1{font-size:calc(19px*var(--scale));font-weight:800}
.hdr .sub{color:var(--muted);font-size:calc(12px*var(--scale))}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;
     padding:6px 12px;font-size:calc(12px*var(--scale));cursor:pointer;color:var(--text)}
.btn:hover{filter:brightness(.97)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;
      font-size:calc(11px*var(--scale));background:var(--surface)}
.chip.on{background:var(--orbe);border-color:var(--orbe);color:#fff}
select,input[type=search]{background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:6px 10px;font-size:calc(12px*var(--scale));color:var(--text)}
/* The filter row must NOT reflow when a cascade changes its text (user report
   2026-08-04: "filters move their position"). A select sizes itself to its
   longest option, so every cascade rebuild resized it — and in a wrapping flex
   row that moves every control after it, sometimes onto another line, right as
   the user reaches for it. Fixed widths pin the row: the closed control may
   clip a long selection, but the open list and the tooltip carry it in full. */
#teamSel,#pmSel{width:calc(150px*var(--scale))}
#famSel{width:calc(175px*var(--scale))}
#personSearch{width:calc(140px*var(--scale))}
#periodPick{width:calc(150px*var(--scale))}
/* Chips: tabular figures + a width floor so a live count changing from 140 to
   7 doesn't change the chip's size (the Region strip re-counts on every click). */
.chip{font-variant-numeric:tabular-nums}
#regionChips .chip{min-width:calc(78px*var(--scale));text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
       padding:14px;box-shadow:var(--shadow)}
.loading{padding:60px;text-align:center;color:var(--muted)}
/* Cold-start progress. The wait is real and can run into minutes, so the panel
   has to hold attention honestly rather than repeat one static sentence: a
   headline that changes as the stages pass, a live elapsed clock so the reader
   can see it is still moving, and the one instruction that actually matters. */
.loadWrap{max-width:520px;margin:0 auto;text-align:left}
.loadHead{font-size:calc(14px*var(--scale));font-weight:600;color:var(--fg);
          text-align:center;margin-bottom:4px}
.loadElapsed{text-align:center;font-variant-numeric:tabular-nums;font-size:calc(11px*var(--scale));
             color:var(--muted);margin-bottom:14px}
.loadBar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--muted) 20%,transparent);
         overflow:hidden;margin-bottom:14px}
/* Indeterminate — it must NOT imply a known percentage. We genuinely cannot
   measure progress server-side, and a bar that crept toward 100% would be
   inventing one, then stalling there for two minutes. */
.loadBar i{display:block;height:100%;width:38%;border-radius:2px;background:var(--muted);
           animation:loadSlide 1.5s ease-in-out infinite}
@keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){.loadBar i{animation:none;width:100%;opacity:.45}}
.loadNote{font-size:calc(11.5px*var(--scale));line-height:1.5;color:var(--muted)}
.loadNote b{color:var(--fg)}
/* Flex column, so the mini line chart can be pinned to the BOTTOM of the card
   (rule below). A tile row is a grid of stretched cards, but its content is
   top-aligned, so a card carrying three context lines pushed its sparkline
   ~40px lower than the card beside it carrying one — the flow band mixes three
   tile grammars (tileHtml_, flowTileHtml_, backlogTileHtml_) with 1–4 lines
   each in ONE grid, so the charts landed at four different heights and the row
   stopped reading as a comparable set (user 2026-08-07: "some KPI mini line
   charts are out of place"). Trimming lines was the 2026-08-05 fix and it does
   not hold: the line count is data-dependent. Aligning the baselines in CSS
   does, whatever each card happens to say. */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
      display:flex;flex-direction:column}
/* The spark (and, where a caption belongs to it, the caption+spark pair) is the
   only thing that moves — every text line stays stacked under the hero, and the
   slack collects between the last line and the chart. Scoped to .spark, not
   .chart: a full-size chart inside a tile is the tile's content, not its
   footer. flex:0 0 auto keeps the SVG at its aspect ratio instead of being
   shrunk by the flex algorithm. */
.tile>.spark,.tile>.sparkWrap{margin-top:auto;flex:0 0 auto}
.sparkWrap>.spark{margin-top:0}
.tile .lbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .big{font-size:calc(26px*var(--scale));font-weight:800;margin:2px 0}
.tile .big.g{color:var(--pos)} .tile .big.a{color:var(--amber)} .tile .big.r{color:var(--warn)}
.tile .cmp{font-size:calc(11px*var(--scale));color:var(--muted)}
/* Hero row = the number and the bar it is graded against, side by side.
   The target used to be restated inside the delta sentence on every card
   ("▼ 44 pts vs target ≥85%") — redundant beside a number already coloured
   against that same target (user 2026-08-06). It is now printed ONCE, quiet
   and baseline-aligned next to the hero, which frees the delta line to say
   only how far off we are and how it moved.
   .tgt is a SIBLING of .big, never a child: the count-up animation rewrites
   .big's textContent on load and would swallow a nested chip. */
.tile .heroRow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0}
.tile .heroRow .big{margin:0}
.tile .tgt{font-size:calc(10px*var(--scale));color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  border:1px solid var(--border);border-radius:999px;padding:1px 8px}
/* Window phase, worn by the hero (2026-08-06). An unfinished window has to be
   unmissable ON THE CARD, not only in the picker: cards get screenshotted into
   decks one at a time, and "41%" from a half-elapsed month pasted into a board
   pack is the failure this chip exists to prevent. Dashed for "not settled";
   amber for in-flight, plain for planning — a plan is not a warning. */
.tile .tgt.phase{border-style:dashed;border-color:var(--amber);color:var(--amber)}
.tile .tgt.phase.plan{border-color:var(--border);color:var(--muted)}
.tile.tPhase{border-style:dashed}
.tile.ph{opacity:.55;border-style:dashed}
/* Compact tier (spec 2026-08-05 §4.1): the flow tiles sit under the primary
   KPI cards in the Executive strip, so they read as a second, quieter row
   rather than five more headline numbers competing for the same weight. */
.tilesCompact .tile{padding:10px 12px}
.tilesCompact .big{font-size:calc(20px*var(--scale));line-height:1.2}
.tilesCompact .lbl{font-size:calc(10px*var(--scale))}
/* ── Backlog-band density (user 2026-08-07: the band took so much of the
   Executive tab that the masthead's own conclusion and the ruler could not be
   read in one screen) ──
   Nothing is removed and no row is demoted out of the band: three tile rows
   that each reserved headline padding and a two-sentence prose header are
   simply asked to cost what they are worth. The hero triplet keeps its 26px
   figure (it is the reason to look at the band at all) and gives up only the
   compact tier's padding; the workforce and assigned rows wear .tilesCompact,
   which already exists for exactly this "quieter second row" purpose. */
#backlogBand .tiles{margin-bottom:8px}
#backlogBand .tiles .tile{padding:10px 12px}
/* The long explanations did not get deleted — they moved into the native
   tooltip, which is how every other dense surface on this page carries its
   caveats (the filter bar, the utilization footnotes, the metric formulas).
   A dotted underline + the ⓘ says there is more to read, so a caveat that is
   one hover away never reads as a caveat that was dropped. */
.why{border-bottom:1px dotted var(--border);cursor:help}
/* ── Confidence + suppression (FR-2.1/2.2) ──
   A suppressed tile is styled as a distinct STATE, not a greyed-out number:
   dashed border, no hero figure, the coverage and the owner in its place. The
   glyphs (◆ ◈ ◇, ✔ ▲ ✖) carry the same information as the colour, so the read
   survives a monochrome board pack and a colour-vision difference (FR-4.4). */
.tile.sup{border-style:dashed;border-color:var(--amber)}
.tile .supbig{font-size:calc(15px*var(--scale));font-weight:700;color:var(--amber);
              margin:4px 0;cursor:help;font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
.conf{font-size:calc(10px*var(--scale));font-weight:700;cursor:help;letter-spacing:.02em}
.conf.chigh{color:var(--pos)} .conf.cmedium{color:var(--amber)} .conf.clow{color:var(--warn)}
.hyglink{color:var(--orbe);font-weight:700;text-decoration:none}
.hyglink:hover{text-decoration:underline}
.stalenote{color:var(--warn);font-weight:700}
/* .profPanel: shared panel chrome for the 🧬 field-fill-by-issue-type matrix
   (built to be SCREEN-SHARED live, user 2026-08-04 — bigger type so a room can
   read it). */
.profPanel { border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin: 10px 0; }
.profPanel h4 { margin: 0 0 4px; font-size: calc(17px*var(--scale)); }
/* ── Data Hygiene view ── */
.hnav{display:flex;align-items:center;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.hnav .btn[disabled]{opacity:.35;cursor:default}
.hnav .hper{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
            font-size:calc(14px*var(--scale));font-weight:700;min-width:120px;text-align:center}
.gedit{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.gedit summary{cursor:pointer;font-weight:700;font-size:calc(12px*var(--scale))}
.gedit input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--border);
                          border-radius:6px;background:var(--surface);color:var(--text)}
table.hyg{border-collapse:collapse;width:100%;font-size:calc(11px*var(--scale))}
table.hyg th{text-align:left;color:var(--muted);font-weight:700;text-transform:uppercase;
             font-size:calc(9px*var(--scale));letter-spacing:.05em;padding:6px 8px;
             border-bottom:1px solid var(--border);white-space:nowrap}
table.hyg td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
table.hyg td.hnum{white-space:nowrap;font-weight:700;min-width:150px}
table.hyg td.hnum.g{color:var(--pos)} table.hyg td.hnum.a{color:var(--amber)}
table.hyg td.hnum.r{color:var(--warn)}
/* ── 🧬 by-type matrix ──
   Nine columns of numbers, so the layout rules are stricter than the gaps table:
   EVERY column right of the type name is right-aligned, header included. The
   first cut left the headers default-left over right-aligned values, which put
   each label over the gap between two columns instead of over its own data —
   the table looked misaligned because it was. */
table.hyg.tmx{table-layout:fixed}
table.hyg.tmx td,table.hyg.tmx th{padding:7px 10px;white-space:nowrap;
                                  border-bottom:1px solid var(--border)}
table.hyg.tmx th{padding-bottom:6px}
table.hyg.tmx .tnum{text-align:right}
/* The type name is the row's identity — it stays left, wraps, and is the one
   column allowed to be wide. Sticky so a horizontal scroll on a narrow screen
   never leaves a row of numbers with nothing naming it. */
table.hyg.tmx .tname{text-align:left;white-space:normal;width:26%;min-width:150px;
                     position:sticky;left:0;background:var(--surface);z-index:1}
table.hyg.tmx td.tn{font-weight:700;color:var(--muted);width:52px}
/* Zebra banding: at nine columns the eye loses its row on the way across. */
table.hyg.tmx tr:nth-child(even) td{background:var(--surface-2)}
table.hyg.tmx tr:nth-child(even) td.tname{background:var(--surface-2)}
/* Theme-neutral hover: a translucent grey reads on both the cream and the navy
   surface, so no second token is needed and neither theme can be forgotten. */
table.hyg.tmx tr:hover td{background:rgba(127,127,127,.12)}
table.hyg.tmx td.tcell .tval{font-weight:700;font-variant-numeric:tabular-nums}
/* .n = "gates nothing published for this type" — muted, never a RAG colour. A
   grey em-dash must not compete with a real verdict for attention. */
table.hyg.tmx td.tcell.n .tval{color:var(--muted);font-weight:400}
table.hyg.tmx td.tcell.g .tval{color:var(--pos)}
table.hyg.tmx td.tcell.a .tval{color:var(--amber)}
table.hyg.tmx td.tcell.r .tval{color:var(--warn)}
/* Fill bar per cell. Nine columns of bare percentages have to be read digit by
   digit; the bars give the row a shape you can take in at a glance. Same idiom
   as the gaps table and the funnels — this view is built on labelled bars. */
/* Bars use the CHART tokens, not the text ones. In dark mode --warn and --amber
   are literally the same hex, which is survivable for words (the ✔ ▲ ✖ marks
   still separate them) but fatal for a bar, where colour is the only channel
   there is. --c-good/--c-warn/--c-bad are the palette-validated set that stays
   distinguishable in both themes — the same reason the charts use them. */
.tbar{height:3px;border-radius:2px;background:var(--border);margin-top:4px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:2px;background:var(--muted)}
.tbar i.g{background:var(--c-good)} .tbar i.a{background:var(--c-warn)}
.tbar i.r{background:var(--c-bad)}
.tbar i.n{background:var(--muted);opacity:.4}
/* The miss count rides inside the cell but must read as secondary to the % —
   it is the size of the job, not the verdict on it. */
.tmiss{display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;
       background:var(--surface);border:1px solid var(--border);
       color:var(--muted);font-weight:700;font-size:calc(9.5px*var(--scale));
       font-variant-numeric:tabular-nums}
table.hyg.tmx tr:nth-child(even) .tmiss{background:var(--surface-2)}
/* "epic" tag on the type name — states that this row is pooled into the
   epic-grain metrics, which is the finding the whole table exists to expose. */
.tepic{display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;
       background:var(--royal);color:#fff;font-size:calc(8.5px*var(--scale));
       font-weight:700;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
/* 👥 Signals roster (spec §5.2) — same RAG dot idiom as the fill bars above,
   but per-cell rather than per-column: a dot alone is never the whole story,
   so sigCellHtml_ always prints the % text right beside it (FR-4.4). */
.sigDot{font-size:12px}
.sigGood{color:var(--c-good)} .sigWarn{color:var(--c-warn)} .sigBad{color:var(--c-bad)}
.sigSmall{color:var(--muted)}
/* Intern cells: the SAME muted ink as an ungraded small-n cell, deliberately —
   both mean "shown, not judged", and inventing a second grey would suggest a
   second meaning. */
.sigLearn{color:var(--muted)}
/* Sticky column headers on the roster (user 2026-08-06). This is the ONE table
   with a row per active person, so it runs long enough that the header scrolls
   away and a bare "62%" stops saying WHICH field it grades — the same reason the
   retired People grid pinned its header.
   The header pins to the WRAPPER, not the page: .gwrap is already a scroll
   container (overflow-x:auto forces overflow-y to auto), so a page-level sticky
   top would resolve against a scrollport that never scrolls and never fire. Cap
   the wrapper and the header has a real edge to stick to; page scroll past the
   panel is untouched, and .shooting already uncaps this for the PNG export.
   box-shadow, not border-bottom: under border-collapse the border belongs to the
   collapsed grid rather than the cell, so it stays behind while the cell moves. */
.rosterWrap{max-height:70vh;overflow:auto}
/* The drill-down's reconciliation, collapsed (user 2026-08-10). Two jobs: keep
   the explanation available without spending five lines of every open row on it,
   and CAP ITS WIDTH — an uncapped sentence inside a colspan cell sets the whole
   roster table's width, and a roster you have to scroll sideways is unreadable.
   max-width in ch so it tracks the font rather than a guessed pixel count. */
.reconBox{margin-top:6px;max-width:96ch}
.reconBox>summary{cursor:pointer;font-size:calc(12px*var(--scale));color:var(--muted)}
.reconBox>summary:hover{color:var(--text)}
.reconBox>.cellSub{margin-top:4px;white-space:normal}
/* Same width cap on the detail row's own prose, for the same reason. */
tr.detailRow>td{white-space:normal}
tr.detailRow>td>.cellSub{max-width:96ch}
table.hyg.tmx.rosterTbl thead th{position:sticky;top:0;z-index:6;
  background:var(--surface);box-shadow:inset 0 -1px 0 var(--border)}
/* The corner cell is sticky on BOTH axes — it must outrank the body's sticky
   name column (z-index 1) and its own header row, or a horizontal scroll slides
   names over it. */
table.hyg.tmx.rosterTbl thead th.tname{left:0;z-index:7}
/* Scope tag chip — states which clock a column follows (SNAP / PERIOD / ORG)
   right on the header, so "why did this number not move when I picked another
   month" has its answer one glance away instead of in a tooltip nobody opens. */
.scopeTag{font-size:9px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;vertical-align:middle}
/* Section kicker — a small caps label ABOVE a band's own heading (newspaper
   sense: the line above the headline that names the section), distinct from
   a scopeTag (which names a COLUMN's clock, not a band's section). */
.kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
/* Executive data-trust strip (Task 8, spec §4.4) — four org-wide fill-vs-gate
   tiles, same trust-at-a-glance grammar as the KPI cards above them. */
.trustRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.trustItem{border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.trustVal{font-weight:700;font-size:calc(18px*var(--scale))}
.trustBar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0}
.trustBar i{display:block;height:100%}
.hbar{height:5px;border-radius:3px;background:var(--border);margin:4px 0 2px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.hbar i.g{background:var(--pos)} .hbar i.a{background:var(--amber)} .hbar i.r{background:var(--warn)}
.dUp{color:var(--pos);font-weight:700} .dDown{color:var(--warn);font-weight:700}
.lgd{font-size:calc(9px*var(--scale));color:var(--muted);margin-right:10px;white-space:nowrap}
.lgd i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:3px}
.attn{font-size:calc(11px*var(--scale));font-weight:700;margin-bottom:6px}
.gwrap{overflow-x:auto}
/* Descendant, not child: the roster's capped scroller is nested inside
   #rosterPanel, while savePng_ puts .shooting on the whole 🎯 view — a child
   selector would leave the roster capped and the PNG would show only the rows
   that happened to be scrolled into view. */
.shooting .gwrap{max-height:none;overflow:visible}
table.grid{width:100%;border-collapse:collapse;font-size:calc(12px*var(--scale))}
.grid th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:8px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:5}
.grid th.now{border-bottom:2px solid var(--orbe);color:var(--orbe)}
.grid th.plan,.grid td.plan{opacity:.75}
.grid td{padding:6px 8px;border-top:1px solid var(--border);text-align:center;white-space:nowrap}
.grid td.name{text-align:left;font-weight:600;min-width:150px}
.grid td.tG{background:rgba(31,138,87,.14)} .grid td.tA{background:rgba(180,83,9,.14)}
.grid td.tR{background:rgba(194,65,12,.16)}
.grid th.exp{background:var(--surface-2)}
.bar{position:relative;height:16px;min-width:160px;border:1px solid var(--border);
     border-radius:4px;overflow:hidden;display:flex;cursor:pointer}
.bar .sB{background:var(--seg-bill)} .bar .sN{background:var(--seg-nonbill)}
.bar .sI{background:var(--seg-idle)}
/* Unclassified: tracked in Tempo, no NetSuite split. Hatched slate so it reads
   as "real work, unknown kind" — distinct from solid-slate non-billable. */
.bar .sU{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
/* 👥 Signals roster Hours cell (Task 6, 2026-08-05) — a small billable/
   non-billable/idle bar, same segment vocabulary and tokens as the retired
   People-grid .bar above, scaled down to sit inline in a table cell. */
.hbarMini{display:inline-flex;width:110px;height:9px;border-radius:4px;overflow:hidden;background:var(--surface-2);vertical-align:middle}
.hbarMini i{display:block;height:100%}
.hbarMini .segBill{background:var(--seg-bill)} .hbarMini .segNonbill{background:var(--seg-nonbill)} .hbarMini .segIdle{background:var(--seg-idle)}
.hbarMini .segOff{background:var(--seg-off)}
/* Person-state badges on the roster name (🎓 intern / 🌱 new hire / 🏖 on leave).
   Each one is the reason a row's numbers should be read differently, so it sits
   ON the name — the one place a reader is already looking. */
.stateBadge{margin-left:5px;cursor:help;font-size:calc(11px*var(--scale))}
/* The whole roster row is the toggle, so the whole row shows it: one pointer
   cursor on the <tr> rather than one on a single word inside it. */
tr.rosterRow{cursor:pointer}
.rosterName{font-weight:600}
/* Signal chip strip — the Executive pulse's buckets, as filters on the roster.
   Same .chip vocabulary as the header filters so it reads as a control, not a
   legend; a zero bucket stays in place, greyed, because a strip that changes
   length as you click stops being a fixed picture of the slice. */
.sigChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.sigChips .chip{padding:3px 10px}
.sigChip.off{opacity:.45;cursor:default}
/* The pulse's counts are links into the filtered roster. Underlined on hover
   only — the row already reads as clickable, and five underlines in one
   sentence would look like an error state. */
.pulseLink{cursor:pointer;border-radius:6px;padding:0 3px}
.pulseLink:hover{background:rgba(127,127,127,.16);text-decoration:underline}
.planTick{position:absolute;top:-6px;font-size:9px;color:var(--royal);transform:translateX(-50%)}
.warnFlag{color:var(--warn);font-weight:700;margin-left:4px}
/* Small print must stay readable — was a raw 9px (unscaled), reported unreadable. */
.cellSub{font-size:calc(10.5px*var(--scale));color:var(--muted)}
tr.detail td{background:var(--surface-2);padding:12px 16px 14px;text-align:left}
.blbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;margin:6px 0 2px}
.btrack{position:relative;height:10px;background:var(--orbe);border-radius:3px;max-width:360px}
.bline{height:8px;border-radius:3px;max-width:360px;display:flex;overflow:hidden}
.bline .b{background:var(--seg-bill)} .bline .n{background:var(--seg-nonbill)}
.bline .u{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
.bplanned{height:8px;background:var(--royal);border-radius:3px;max-width:360px;opacity:.85}
table.bklog{border-collapse:collapse;font-size:calc(11px*var(--scale));margin-top:2px}
.bklog th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;text-align:left;padding:3px 10px 3px 0;border-bottom:1px solid var(--border)}
.bklog td{padding:3px 10px 3px 0;border-bottom:1px solid var(--border);max-width:420px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Soft vertical separators so week columns stay readable when fully expanded —
   applies to headers, cells, AND the aligned detail cards. */
.grid th+th,.grid td+td{border-left:1px solid var(--border)}
/* Export controls are utilities, not protagonists (user feedback 2026-07-31):
   borderless ghost icon-buttons in muted ink, tiny uppercase caption, only
   gaining presence on hover. */
.iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:6px;
  font-size:calc(9.5px*var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.iconbtn:hover{color:var(--text);background:var(--surface-2)}
.iconbtn svg{width:calc(13px*var(--scale));height:calc(13px*var(--scale))}
td.name.pname{cursor:pointer}
td.name.pname:hover{color:var(--orbe)}
tr.detail td.dctx{vertical-align:top;text-align:left;font-size:calc(11px*var(--scale));
  min-width:150px;padding:8px}
tr.detail td.dcell{vertical-align:top;text-align:left;padding:8px;min-width:170px}
tr.detail td.dback{padding:8px 16px 12px}
.mstat{font-size:calc(11px*var(--scale));margin:1px 0;white-space:nowrap}
.mstat b{font-size:calc(13px*var(--scale))}

/* ── TAB BAR ──
   One view per question. Everything used to stack into a single scroll — KPI
   cards, roster grid, drill-downs — which is exactly the "mixed signals" a
   manager has to untangle before reading anything. The tab bar is generated
   from the VIEWS array, so a view's label, pane and role gate are declared once. */
.tabs{display:flex;gap:2px;align-items:flex-end;border-bottom:1px solid var(--border);
      margin:0 0 14px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;
     border-radius:8px 8px 0 0;padding:7px 14px;cursor:pointer;color:var(--muted);
     font-size:calc(12.5px*var(--scale));font-weight:600;position:relative;top:1px}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.on{background:var(--surface);border-color:var(--border);color:var(--text);
        box-shadow:inset 0 2px 0 var(--orbe)}

/* ── CHARTS ──
   Inline SVG, no library. A CDN chart lib is one blocked request away from an
   empty executive dashboard inside the HtmlService iframe, and every label,
   reference line and hit target here is bespoke anyway. */
.chart{width:100%;height:auto;display:block;overflow:visible;
       font-family:'Roboto',-apple-system,"Segoe UI",sans-serif}
/* Horizontal bar charts grow DOWNWARD with the category count, and `height:auto`
   on a 100%-wide SVG scales that growth by the container width too. At 52 PMs on
   a wide monitor the viewBox was ~1600 units tall rendering at ~2× — a chart
   several screens high where one row was legible at a time. Capping the width
   caps the scale factor, so a row is always ~30px however many there are, and
   the row cap in hbarChart_ keeps the list itself readable. */
.chart.hbar{max-width:calc(760px*var(--scale))}
/* The queue ruler is the same SHAPE of object and had the same problem for the
   same reason (user 2026-08-07: "the KPIs and the stack chart take too much
   space"). Its viewBox is 760 units wide, so at ~1950px of Executive-tab width
   `height:auto` scaled it ~2.5×: a three-segment bar rendering ~190px tall,
   physically the largest thing in the band while carrying three numbers. Capped
   like .hbar, it draws at its designed size — the SVG's own 10–11px axis and
   segment text then render at 10–11px, which is what the rest of the page uses. */
.chart.backlogRuler{max-width:calc(760px*var(--scale))}
.chart text{fill:var(--muted);font-size:11px}
.chart text.val{fill:var(--text);font-weight:700}
.chart text.axis{font-size:10px;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .hit{fill:transparent;cursor:crosshair}
.chartHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chartHead h3{font-size:calc(14px*var(--scale));font-weight:800}
.chartHead .sub{color:var(--muted);font-size:calc(11px*var(--scale))}
/* A legend entry that FILTERS says so — it is a control, not a caption. Reaches
   the grid's attention strip and bar vocabulary (.lgd.act): a legend where some
   entries act and others don't must show which is which. */
.act{cursor:pointer;border-bottom:1px dotted var(--muted)}
.act:hover{color:var(--text);border-bottom-color:var(--text)}
.act.on{color:var(--orbe);font-weight:700;border-bottom-color:var(--orbe)}
/* ── Verdict strip — the "rapid answer" line above each chart ── */
.verdict{font-size:calc(12.5px*var(--scale));line-height:1.5;margin:2px 0 10px}
.verdict b{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
           font-size:calc(15px*var(--scale))}
.vg{color:var(--pos)} .va{color:var(--amber)} .vr{color:var(--warn)}
.norm{font-size:calc(11px*var(--scale));color:var(--muted);margin-top:2px}

.emptyState{padding:26px 16px;text-align:center;color:var(--muted);
            font-size:calc(12.5px*var(--scale))}

/* 🌊 Backlog health — two facing lists. Grid rather than flex so the two tables
   share a column width regardless of label length: a healthy column that is
   narrower than its neighbour reads as the less important one, which is the
   opposite of the point. Collapses to one column under 900px, where side-by-side
   would force each table into its own horizontal scroll. */
.bhCols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media (max-width:900px){.bhCols{grid-template-columns:1fr}}

/* ── 🧭 WORKFORCE HEALTH ─────────────────────────────────────────────────────
   The pool grid is the widest table in the app (ten numeric columns plus a
   wrapping sentence), so it scrolls INSIDE its own container rather than
   letting the page scroll sideways. */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wfGrid{min-width:760px}
/* Pool header row — a band across the table, so the eye groups by pool before
   it reads any band. Tinted, not bold-only: at 11px bold alone does not
   separate a header row from a data row. */
.wfPoolHdr td{background:color-mix(in srgb,var(--muted) 10%,transparent);
              border-bottom:1px solid var(--border);padding:7px 8px}
/* The Read row hangs under its own band row with no bottom rule, so the pair
   reads as one unit rather than two rows that happen to be adjacent. */
.wfReadRow td{border-bottom:1px solid var(--border);padding-top:0;padding-bottom:8px}
.wfReadRow td:first-child{border-bottom:none}
/* Action-state and structural-risk chips. Deliberately the same shape as the
   attention chips elsewhere — a reader should not have to learn a second
   vocabulary of pills. */
.wfChip{display:inline-block;font-size:calc(9.5px*var(--scale));font-weight:700;
        letter-spacing:.04em;border-radius:4px;padding:1px 6px;white-space:nowrap}
.wfsGood{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.wfsWarn{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.wfsBad{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.wfsNeutral{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
/* UNROUTED is the one row on the backlog table that is a finding rather than a
   measurement, so it is tinted — it must not read as just another pool. */
.wfUnrouted td{background:color-mix(in srgb,var(--warn) 8%,transparent);font-weight:600}
/* The readiness row is the panel's headline; a tint rather than a bigger font,
   so it leads without breaking the table's rhythm. */
.bhHero td{font-weight:600;background:color-mix(in srgb,var(--pos) 8%,transparent)}
/* Options that exist in the data but not in the current slice stay VISIBLE and
   disabled, so a filter list never silently loses a value someone is looking for. */
select option:disabled{color:var(--muted);font-style:italic}
.chip.off{opacity:.38;cursor:not-allowed}
/* §1 THE MASTHEAD (spec 2026-08-06) — the lede, first child of #viewExec.
   The evidence chip sits opposite the verdict so a reader weighs the sentence
   against how much of the page it is standing on before reading anything else. */
.mastRow{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.mastLede{flex:1;min-width:260px}
.mastHead{font-size:calc(13px*var(--scale));margin:2px 0}
.mastVerdict{font-size:calc(15px*var(--scale));line-height:1.5;margin:4px 0 0;font-weight:600}
.mastEvidence{font-size:calc(11px*var(--scale));color:var(--muted);text-align:right;
              white-space:nowrap;cursor:help;padding-top:2px}
/* ── Motion (spec §7) — portfolio language, ONCE per load. Every rule lives
   behind prefers-reduced-motion; re-renders from filter/sort changes never
   re-animate (body.loaded gates the entrance keyframes). ── */
@media (prefers-reduced-motion: no-preference){
  :root{--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
  body:not(.loaded) .tile{opacity:0;transform:translateY(14px)}
  body.entering .tile{animation:dhReveal .5s var(--ease) both}
  body.entering .tile:nth-child(2){animation-delay:.06s}
  body.entering .tile:nth-child(3){animation-delay:.12s}
  body.entering .tile:nth-child(4){animation-delay:.18s}
  body.entering .tile:nth-child(5){animation-delay:.24s}
  @keyframes dhReveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tile,.trustItem{transition:transform .25s var(--spring),box-shadow .25s var(--ease)}
  .tile:hover,.trustItem:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .viewPane.paneIn{animation:paneIn .15s var(--ease) both}
  @keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .trustBar i,.hbarMini i{transition:width .8s var(--spring)}
}
</style>
</head>
<body>
<div class="hdr">
  <div class="hrow">
    <h1>Delivery Health</h1>
    <span class="sub" id="asOf"></span>
    <span style="flex:1"></span>
    <button class="btn" id="btnReset" title="Back to the default view — clears every filter, the person search, and all expanded rows">⟲ Reset</button>
    <button class="btn" id="btnRefresh" title="Bypass the cache and reload live data">↻ Refresh</button>
    <button class="btn" id="btnTheme" title="Switch between light and dark theme">🌙 Dark</button>
  </div>
  <div class="hrow">
    <div class="fgroup" id="periodGroup" title="Aggregation period — months are calendar, quarters are fiscal (FY starts Jul 1, named for its end year)">
      <span class="flbl">Period</span><div class="chips seg" id="periodChips"></div>
    </div>
    <div class="fgroup" title="Population — FTEs are the primary focus (default); Crew shows contractors only; All combines them. Universal: scopes the KPI tiles and the grid.">
      <span class="flbl">People</span><div class="chips seg" id="popChips"></div>
    </div>
    <div class="fgroup" title="Role — split managers (M-level job codes) from individual contributors. Managers often plan without tracking much, which drags delivery rates; the IC view removes that effect. Universal: scopes the KPI tiles and the grid.">
      <span class="flbl">Role</span><div class="chips seg" id="roleChips"></div>
    </div>
    <div class="fgroup" title="Value focus — what the grid cells show and how people are ranked. Plan = planned hours, alphabetical. Billable = tracked hours falling on the billable side of the NetSuite split, most first. Non-bill = the non-billable side — real project work plus any time off tracked in Tempo (time off cannot be charged to a customer project, so it is non-billable by rule). Both are Tempo tracked hours apportioned by the NetSuite billable mix, so they always sum to tracked.">
      <span class="flbl">Focus</span><div class="chips seg" id="focusChips"></div>
    </div>
    <div class="fgroup" title="Region — universal: scopes the KPI tiles and the grid.">
      <span class="flbl">Region</span><div class="chips seg" id="regionChips"></div>
    </div>
    <select id="teamSel" title="Team filter — universal: scopes the KPI tiles and the grid."><option value="">All teams</option></select>
    <select id="pmSel" title="Worked with PM — universal: scopes the KPI tiles and the grid. Selects PEOPLE with planned or tracked hours on any project this PM leads (Tempo PM field); membership-based like Teams. NOT the same as the 🗓 PM tab, which reports the TICKETS a PM owns — this control sits above the tabs and stays visible there, so the two are deliberately named apart."><option value="">Worked with PM: all</option></select>
    <select id="famSel" title="Job-family filter — universal: scopes the KPI tiles and the grid. Options cover the tracking-mandated population (JF007 Managed Services &amp; Support, JF009 Service Delivery, uncatalogued/crew); non-tracking families are not in this dashboard at all."><option value="">All job families</option></select>
    <input type="search" id="personSearch" placeholder="Find person…">
    <span id="filterWarn" class="cellSub" style="color:var(--amber)"></span>
  </div>
</div>

<div id="loading" class="loading">Loading delivery health…</div>

<div id="app" style="display:none">
  <!-- Tab bar — generated from VIEWS in JS, so a view is declared in one place. -->
  <div class="tabs" id="tabBar"></div>

  <!-- Live scope chip: states exactly WHAT slice is on screen. Above the panes,
       because the filter row scopes every view (never per-chart filters). -->
  <div class="sub" id="scopeChip" style="margin:-6px 0 12px;color:var(--muted);font-size:11px;cursor:help"
    title="Every filter is universal — it scopes the KPI cards, the charts and the grid together. On-Time and Forecast issues join to people via the Jira Assignee, so population/role/PM/family/search apply to them too; items without a roster assignee are excluded (count in the card tooltip). Team and PM rates are membership-based, so slices don't sum to All; a PM slice shows the whole week of everyone on that PM's projects."></div>

  <!-- ── EXECUTIVE — the four cards and one comparison. The 30-second read. ── -->
  <div id="viewExec" class="viewPane">
    <!-- §1 THE MASTHEAD (spec 2026-08-06) — the lede. Always first: a reader
         gets the verdict in one sentence before a single chart. -->
    <div class="panel" id="masthead" style="margin-bottom:14px"></div>
    <!-- §2 BACKLOG BAND (spec 2026-08-06) — the page's hero: ORG triplet,
         filterable assigned sub-row, queue ruler. -->
    <div class="panel" id="backlogBand" style="margin-bottom:14px"></div>
    <!-- §4.4 DATA TRUST (Task 16B, spec 2026-08-06) — moved up from last: "can
         we publish these numbers?" belongs before the numbers, not after them. -->
    <div class="panel" id="trustPanel" style="margin-bottom:14px"></div>
    <!-- FLOW BAND (Task 16B) — Cleared · Arrived · Lead Time (p85 companion) ·
         On-Time · Forecast · Quality/Rework, plus Throughput and Bug Count.
         On-Time/Forecast/Quality used to be the standalone #tiles strip
         (retired Task 16B — see report); they are delivery-outcome measures,
         so they join the other flow reads rather than getting their own band
         (spec §3 omits Forecast/Quality from any band — resolved as a spec
         gap, not an instruction to drop them). -->
    <div style="text-align:right"><button class="iconbtn" onclick="savePng_('flowTiles','flow')" title="Save the flow cards as a PNG image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button></div>
    <div class="tiles tilesCompact" id="flowTiles"></div>
    <!-- COLOUR KEY (Task 17 — regression fix). Retiring #tileColorKey with the
         old #tiles strip (Task 16B) removed the legend with no successor —
         readers learn colours from a legend, not a tooltip, and every swatch
         here is an inert caption, never a filter. Populated by renderFlow_. -->
    <div class="cellSub" id="flowKey" style="margin:2px 0 12px"></div>
    <!-- CAPACITY BAND (Task 16B) — Utilisation/Planned Coverage tile (moved
         from the old #tiles strip) sits above the recoverable-hours/people-
         signals row #pulsePanel already renders; both share the SAME margin
         gate, so the whole band is omitted from the DOM together for a
         non-margin role rather than each half being gated separately. -->
    <div class="panel" id="pulsePanel" style="margin-bottom:14px"></div>
    <div class="panel" id="comparePanel" style="margin-bottom:14px"></div>
    <!-- §7 THE SHELF (spec 2026-08-06) — "not measured this week", data-driven. -->
    <div class="panel" id="shelfPanel" style="margin-bottom:14px"></div>
    <!-- §8 DATA TRUST DETAIL (spec 2026-08-06) — collapsed <details>, computed. -->
    <div class="panel" id="trustDetail"></div>
  </div>

  <!-- ── 🎯 ACTIONS — everything person- and field-level (spec 2026-08-05 §5).
       Admin + viewer only (inherits the old Headroom gate). Reading order:
       people signals roster → 🧬 by-type matrix → gaps queue. The standalone
       "Where the headroom is" table was retired 2026-08-05: the roster covers
       the same people with the same exclusions, and its recoverable-hours
       figure lives on in the Executive pulse. ── -->
  <div id="viewActions" class="viewPane" style="display:none">
    <div style="text-align:right;margin-bottom:6px">
      <button class="iconbtn" onclick="saveCsv_()" title="Download the signals roster (one row per person: signal values, offending counts, hours split) as CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>

         on purpose: the roster says WHO, this says WHAT STATE the work they carry

    <div class="panel" id="epicDuePanel" style="margin-top:14px"></div>

  <!-- ── 🧭 WORKFORCE HEALTH (spec v1.1, 2026-08-10) ────────────────────────
       Panel order is load-bearing (§6.1): the first thing on screen sets what
       the room argues about. Scope before numbers, pools before the summary,
       and the honest consumers-only denominator before anybody asks for "the"
       availability figure. ── -->
  <div id="viewWorkforce" class="viewPane" style="display:none">
    <div style="text-align:right;margin-bottom:6px">
      <button class="iconbtn" onclick="saveWorkforceCsv_()" title="Download the pool grid (one row per pool × band, every measure and its action state) as CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>
      <button class="iconbtn" onclick="savePng_('viewWorkforce','workforce')" title="Save this view as a PNG image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
    </div>
    <!-- 1 · Scope banner — population, unclassified (even at zero), drift. -->
    <div class="panel" id="wfScopePanel" style="margin-bottom:14px"></div>
    <!-- 2 · Pool grid — the main table, one row per pool × band. -->
    <div class="panel" id="wfGridPanel" style="margin-bottom:14px"></div>
    <!-- 3 · Consumers-only summary — the honest backlog-cover denominator. -->

    <div class="panel" id="wfDisciplinePanel"></div>
  </div>

  <!-- Access Control — admin only, gated in switchView_ as well as in the tab bar. -->
  <div id="viewAccess" class="viewPane panel" style="display:none"></div>

<script>
var MODEL = null;
// Count-up on the hero tiles runs ONCE per page load (Motion, spec §7) — set
// the instant it fires, never reset, so a later filter/sort re-render can't
// retrigger it.
var countedUp_ = false;
// period: "month" (default per user decision 2026-07-31) | "week" | "quarter"
// pop: population lens — "fte" (default: FTEs are the primary focus) | "crew" | "all"
// (hygIdx removed 2026-08-04 — the Data Hygiene window follows the global
// analysis-period picker like every other surface.)
// view:    which tab is open — see VIEWS below.
// flag:    triage filter driven by clicking the attention legend ("" = off).
// metric:  which metric the Trends view charts.
// compare: which dimension the Executive comparison chart breaks down by.
var STATE = { period: "month", pop: "fte", role: "all", focus: "plan", region: "", team: "", pm: "", family: "", search: "", expandedWeeks: {}, openDetail: {},
              // wfOpenCell: which 🧭 pool × band cells have their person list open
              // ("who has available hours", Billy 2026-08-10). Keyed by the cell's
              // own `pool|band` id, the same key the payload uses.
              wfOpenCell: {},
              // openDetailAll: which OPEN roster detail rows are showing every
              // carried backlog item rather than the first few (2026-08-10).
              // Separate from openDetail so the second level cannot survive a
              // collapse — see toggleRosterDetail_.
              openDetailAll: {},
              view: "exec", flag: "", metric: "onTime", compare: "region", compareAll: false,
              // rosterSort/rosterDesc: 👥 signals roster sort (spec §5.2). Default
              // is biggest opportunity first — most-red overall, then most
              // offending records — because the Executive pulse deep-links here
              // with this sort already applied.
              rosterSort: "opp", rosterDesc: false,
              // sigFilter: which signal verdict the 👥 roster is narrowed to
              // ("" = all). Set by the roster's own chips AND by clicking a
              // count on the Executive pulse, which is the whole point — the
              // pulse says "3 need action" and the click lands on those 3.
              sigFilter: "",
              // typePop: which population the 🧬 by-type matrix shows. OPEN is the
              // default because it is the half anyone can act on — fixing a
              // resolved ticket's due date changes history, not the next report.
              typePop: "open",
              // periodIdx: WHICH complete period the analysis surfaces render —
              // an index into donePeriods_(), or null for the latest (user
              // request 2026-08-04: the reader picks the month/quarter).
              periodIdx: null };
var PERIOD_LABELS = { week: "Week", month: "Month", quarter: "Quarter" };

/**
 * ── VIEWS: the single source of truth for navigation ─────────────────────────
 * Label, pane id and role gate are declared once; the tab bar, switchView_ and
 * renderAll_'s dispatch all derive from this array. Same pattern as the PS
 * dashboard's VIEWS — adding a tab must never mean editing four places.
 *
 * Why tabs at all: everything used to stack into one scroll, so a manager
 * looking for "who needs me this week" waded through executive KPIs, and an
 * executive looking for "are we on target" waded through a 200-row roster.
 * One view answers one question.
 */
var VIEWS = [
  { id: "exec",    label: "📊 Executive", pane: "viewExec",    roles: null,
    hint: "The KPI strip, one comparison, the people-signals pulse and the data-trust strip — the 30-second read." },
  // "Actions", not "Accountability" (review 2026-08-05): the matrix and gaps
  // queue are about fields and requirements, not people — a people-blame
  // banner over them framed the whole tab wrong.
  { id: "actions", label: "🎯 Actions",   pane: "viewActions", roles: ["admin", "viewer"],
    hint: "Who and what needs action: the compliance signals roster, field fill by issue type and the gaps queue." },
  // 🧭 Workforce — capacity read by DEPLOYMENT POOL, never blended. Gated to
  // admin + viewer like Actions: the grid carries per-pool capacity, headroom
  // and backlog cover, which is the same margin tier as the utilization detail.
  { id: "workforce", label: "🧭 Workforce", pane: "viewWorkforce", roles: ["admin", "viewer"],
    hint: "Capacity by pool and level band: headroom, plan-vs-logged, work outside the plan and backlog cover — signals, not verdicts, because capacity is not fungible." },
  { id: "access",  label: "🔒 Access",    pane: "viewAccess",  roles: ["admin"],
    hint: "Manage who can open this dashboard." },
];

function viewDef_(id) {
  for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i].id === id) return VIEWS[i];
  return VIEWS[0];
}

/**
 * ── MARGIN TIER ──
 * The Metrics Dictionary limits utilization and forecast-variance detail to
 * "directs and above". Admins and named viewers are that audience; an
 * open-access guest (the demo / all-hands switch) is not.
 *
 * HIDDEN, NOT DIMMED. A dimmed number is still a number on a projector, and
 * "greyed out" invites someone to ask what it says. Out-of-tier cards are not
 * rendered at all, the metric is removed from every chip strip and comparison
 * chart, and the Actions tab — whose roster carries per-person hours — is
 * gated in VIEWS like Access is.
 *
 * Server-side twin: dhMarginTier_() in Security.js. Change one, change both.
 */
// planCov joins the margin tier because it publishes the same capacity hours
// utilization does — a coverage percentage is a capacity disclosure read a
// different way, and the Dictionary's audience rule is about the data, not the
// arithmetic on top of it.
var MARGIN_METRICS_ = { util: 1, forecast: 1, planCov: 1 };
function canSeeMargin_() {
  var r = (MODEL && MODEL.viewerRole) || "";
  return r === "admin" || r === "viewer";
}

/** A view the current viewer is allowed to open. */
function viewAllowed_(v) {
  return !v.roles || v.roles.indexOf((MODEL && MODEL.viewerRole) || "") !== -1;
}

function buildTabs_() {
  var bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  VIEWS.forEach(function (v) {
    if (!viewAllowed_(v)) return;
    var b = document.createElement("button");
    b.className = "tab" + (STATE.view === v.id ? " on" : "");
    b.textContent = v.label;
    b.title = v.hint;
    b.onclick = function () { switchView_(v.id); };
    bar.appendChild(b);
  });
}

/**
 * Open a view. The role gate is enforced HERE, not just by hiding the tab, so
 * every other entry point — openRoster_() from the Executive pulse, and any
 * future deep link — routes through this one function.
 */
function switchView_(id) {
  var v = viewDef_(id);
  if (!viewAllowed_(v)) v = VIEWS[0];
  STATE.view = v.id;
  VIEWS.forEach(function (x) {
    var el = document.getElementById(x.pane);
    if (el) el.style.display = x.id === v.id ? "" : "none";
  });
  // Motion (spec §7): the shown pane cross-fades in; strip paneIn from every
  // pane first (including the one about to be shown) so re-entering a view
  // always restarts the animation rather than a no-op class re-add.
  VIEWS.forEach(function (x) {
    var pel = document.getElementById(x.pane);
    if (pel) pel.className = pel.className.replace(/ ?paneIn/, "");
  });
  var pane = document.getElementById(v.pane);
  if (pane) pane.className += " paneIn";
  // The scope chip describes the FILTERED population. Actions now mixes
  // filtered content (the signals roster) with the deliberately
  // whole-population gaps queue/matrix — the chip stays visible for the
  // filtered majority, and hygPanel states its own whole-population scope
  // inline (leaverNoteHtml_/the "Whole-population view" caption).
  document.getElementById("scopeChip").style.display =
    (v.id === "access") ? "none" : "";
  buildTabs_();
  renderAll_();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
var POP_LABELS = { fte: "FTE", crew: "Crew", all: "All" };
// focus: the value lens for the (Task 5) signals roster — "plan" (default,
// alphabetical) | "billable" | "nonbill" (both rank most-hours-first). The
// People grid that used to read this was removed in Task 3 (2026-08-05);
// the chip strip and STATE.focus stay for the roster that replaces it.
var FOCUS_LABELS = { plan: "Plan", billable: "Billable", nonbill: "Non-bill" };

/** Population lens — one of the universal filters (they ALL scope the
    utilization tiles and the grid together, via passesFilters_). */
function popMatch_(p) {
  if (STATE.pop === "all") return true;
  return STATE.pop === "crew" ? p.isCrew === true : p.isCrew !== true;
}

// role: "all" (default) | "ic" | "mgr" — managers = M-level job codes
// ("07.M5.1 - …"); managers often plan without tracking much, so the IC view
// removes that drag from delivery rates (user feedback 2026-07-31).
var ROLE_LABELS = { all: "All", ic: "IC", mgr: "Mgr" };
function roleMatch_(p) {
  if (STATE.role === "ic") return p.isManager !== true;
  if (STATE.role === "mgr") return p.isManager === true;
  return true;
}

function esc_(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/**
 * The header freshness line: what the DATA's age is, plus the model-staleness
 * warning when that also applies.
 *
 * Two clocks, and conflating them is the bug this function exists to prevent:
 *   · meta.dataAsOf.jira — when the Jira export last wrote Jira Raw. Moves daily.
 *     This is what a reader means by "how current is this?".
 *   · meta.generatedAt   — when this model was assembled. The warmer resets it
 *     every 30 min, so it is always fresh and always uninformative.
 *
 * AGE COMES FROM THE SERVER (`jiraAgeH`), never from a browser-clock diff: two
 * people in one review would otherwise read different staleness verdicts off the
 * same payload because one laptop's clock drifts. The wall-clock time IS
 * localised — same instant, the reader's own timezone — and always carries its
 * timezone name, because the exporter's "03:00" is meaningless to SEA without it.
 *
 * Three states: fresh (muted, informational), stale (warn — a scheduled export
 * was missed), unknown (muted — an older exporter or a cropped footer; NOT a
 * warning, because a reader can do nothing about it and a false alarm here
 * teaches them to ignore the real one).
 *
 * Pure over (meta, modelStale, builtAt) so render-smoke can pin every state.
 * @returns {{html:string, warn:boolean, title:string}}
 */
function dataAsOfView_(meta, modelStale, builtAt) {
  var d = (meta && meta.dataAsOf) || {};
  var parts = [], warn = false, tips = [];
  function localStamp_(iso) {
    return new Date(iso).toLocaleString([], {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
      timeZoneName: "short" });
  }
  function ageWords_(h) {
    if (h === null || h === undefined) return "";
    if (h < 1) return "under an hour ago";
    if (h < 48) return Math.round(h) + "h ago";
    return Math.round(h / 24) + " days ago";
  }
  if (d.jira) {
    warn = d.jiraStale === true;
    parts.push((warn ? "⚠ " : "📅 ") + "Data as of " + esc_(localStamp_(d.jira)) +
               " · " + esc_(ageWords_(d.jiraAgeH)));
    tips.push("Jira export last wrote the Jira Raw tab at " + localStamp_(d.jira) +
      " (" + d.jiraAgeH + "h ago). This is the age of the DATA — the four delivery " +
      "cards cannot be more current than this.");
    if (warn) {
      parts.push("export may have failed");
      tips.push("Older than " + (meta.jiraExportStaleH || 30) + "h, so a scheduled " +
        "export run was missed — check the Jira Backlog.js trigger. Every Jira-based " +
        "number on screen describes the world as it was at the stamp above.");
    }
  } else if (d.jiraUnknown) {
    parts.push("📅 Data refresh time unknown");
    tips.push("The Jira Raw tab carries no readable \"Generated:\" footer, so the age of " +
      "the data cannot be stated. Run probeDeliverySources for the diagnosis. Not a " +
      "staleness warning — the data may be current; we just cannot prove it.");
  }
  // The model-rebuild warning is a SEPARATE condition (NFR-7) and keeps its own
  // consequence: trend comparisons are suppressed while it holds. Shown alongside
  // the data age rather than instead of it — they fail independently.
  if (modelStale) {
    warn = true;
    parts.push("⚠ dashboard not rebuilt since " + esc_(localStamp_(builtAt.toISOString())));
    tips.push("The model itself has not been reassembled inside the stated refresh " +
      "cadence" + (meta.refreshEveryMin ? " (every " + meta.refreshEveryMin + " min)" : "") +
      ", so trend comparisons are suppressed until it refreshes.");
  }
  (meta.sources || []).forEach(function (s) { tips.push(s.system + " → " + s.feeds); });
  return { html: parts.join(' <span style="opacity:.5">·</span> '),
           warn: warn, title: tips.join("\n\n") };
}

/**
 * ── COLD-START PROGRESS ────────────────────────────────────────────────────
 *
 * A warm load returns in about a second. A COLD one rebuilds the whole model
 * server-side — reading two large Tempo grids, Jira Raw, NS Billable and the
 * roster, then joining them — and that has been measured in MINUTES, not the
 * "minute or two" this panel used to claim. Understating it was its own
 * problem: a reader told to expect two minutes starts refreshing at three.
 *
 * Three things this has to do, in order of how much they matter:
 *
 *   1. STOP THE REFRESHING. Every refresh abandons the in-flight rebuild and
 *      starts another one. It is not neutral — it is the single action that
 *      makes the wait longer, and it is what an unattended progress message
 *      provokes. That instruction leads, and it says WHY.
 *   2. PROVE IT IS STILL MOVING. A static sentence is indistinguishable from a
 *      hung tab after ninety seconds. A live elapsed clock and a moving bar
 *      cost nothing and are the difference between "working" and "broken".
 *   3. SAY WHAT IS HAPPENING, TRUTHFULLY. The stage text below is derived from
 *      the real build order, so it describes what the server is actually doing
 *      rather than inventing reassurance.
 *
 * What it deliberately does NOT do is show a percentage. There is no progress
 * signal to read — `google.script.run` is a single opaque round trip — so any
 * bar that filled toward 100% would be fabricating one and would then sit at
 * 95% for two minutes, which is worse than no bar at all.
 */
var LOAD_STAGES_ = [
  { at: 0,   head: "Loading delivery health…",
    note: "" },
  { at: 8,   head: "Building the data model",
    note: "Nothing is cached for this view yet, so the server is rebuilding it from source: " +
          "the Tempo tracked and planned grids, Jira Raw, NetSuite billable hours and the roster." },
  { at: 45,  head: "Still building — this is the slow path",
    note: "A cold rebuild reads several large sheets end to end and typically takes " +
          "<b>a few minutes</b>. <b>Do not refresh.</b> Refreshing abandons this rebuild and " +
          "starts a new one from scratch, which is the one thing that makes the wait longer." },
  { at: 150, head: "Still building — joining the sources",
    note: "<b>Do not refresh.</b> The page will fill in on its own the moment the model is ready. " +
          "Once it does, it is cached for about an hour and the next load takes a second or two — " +
          "for you and for everyone else." },
  { at: 330, head: "Taking longer than expected",
    note: "This is past a normal cold rebuild. Leave the tab open a little longer — it may still " +
          "land. If it does not, the model may be failing to build rather than running slowly: " +
          "tell Alex López, and mention roughly how long you waited." },
];

/** The in-flight cold-start clock, so a second load can cancel the first. */
var loadTick_ = null;

function loadData(force) {
  var loadEl = document.getElementById("loading");
  loadEl.style.display = "";
  document.getElementById("app").style.display = "none";
  // ↻ Refresh while a load is already in flight would otherwise leave the first
  // interval running: two clocks writing the same #loadElapsed and #loadHead,
  // the older one winning at random and reporting the WRONG elapsed time.
  if (loadTick_ !== null) clearInterval(loadTick_);
  var t0 = Date.now();
  var stageIdx = -1;
  loadEl.innerHTML =
    '<div class="loadWrap">' +
      '<div class="loadHead" id="loadHead">Loading delivery health…</div>' +
      '<div class="loadElapsed" id="loadElapsed"></div>' +
      '<div class="loadBar"><i></i></div>' +
      '<div class="loadNote" id="loadNote"></div>' +
    "</div>";

  // One timer drives both the clock and the stage text — a second interval for
  // the copy could drift out of step with the seconds the reader is watching.
  var tick = loadTick_ = setInterval(function () {
    if (loadEl.style.display === "none") { clearInterval(tick); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    var el = document.getElementById("loadElapsed");
    if (el) el.textContent = s < 60 ? s + "s elapsed"
      : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s elapsed";
    var next = stageIdx;
    for (var i = 0; i < LOAD_STAGES_.length; i++) if (s >= LOAD_STAGES_[i].at) next = i;
    if (next === stageIdx) return;
    stageIdx = next;
    var st = LOAD_STAGES_[stageIdx];
    var h = document.getElementById("loadHead"), n = document.getElementById("loadNote");
    if (h) h.textContent = st.head;
    if (n) n.innerHTML = st.note;
  }, 1000);

  google.script.run
    .withSuccessHandler(function (m) {
      clearInterval(tick);
      if (m.error) { document.getElementById("loading").textContent = "⚠️ " + m.error; return; }
      MODEL = m;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "";
      MODEL._exCache = {};   // per-person triage flags, recomputed per payload
      // Date + timezone matter on a dashboard with AMER/EMEA/SEA/ANZ filters;
      // seconds don't (director feedback).
      var builtAt = new Date(m.meta.generatedAt);
      // NFR-7: a figure older than 48h presented as current is worse than no
      // figure. Flag it, and suppress every trend comparison while it holds —
      // a delta measured across a gap in refreshes is a fiction.
      MODEL._stale = (Date.now() - builtAt.getTime()) > 48 * 3600 * 1000;
      var asOfEl = document.getElementById("asOf");
      // ── DATA FRESHNESS, ALWAYS ON (user request 2026-08-04) ──
      // A "Data as of" line WAS removed on 2026-08-04 for reading as noise — but
      // that line reported meta.generatedAt, the model rebuild, which the cache
      // warmer resets every 30 minutes and which therefore says nothing. This one
      // reports the Jira export's own "Generated:" stamp: it moves once a day, it
      // is the answer to "how current is this?", and it is the one clock that can
      // be days stale while the dashboard looks brand new. Different number,
      // different reason to be on screen.
      var af = dataAsOfView_(m.meta, MODEL._stale, builtAt);
      asOfEl.style.display = "";
      asOfEl.innerHTML = af.html;
      asOfEl.className = "sub" + (af.warn ? " stalenote" : "");
      asOfEl.title = af.title;
      // Stale cache from before the period toggle shipped → no meta.periods;
      // fall back to weekly until a refresh/warm rebuilds the model.
      if (!m.meta.periods) STATE.period = "week";
      buildFilters_();
      switchView_(STATE.view);   // paints the tab bar, the pane and everything in it
      // Motion (spec §7), ONCE per load: stagger-reveal the tiles, then settle.
      // classList (not className =) because body carries no other class today
      // (theme lives on <html data-theme>, not body) but might one day — this
      // way a future body class survives the entrance sequence instead of
      // being clobbered.
      document.body.classList.add("entering");
      setTimeout(function () {
        document.body.classList.remove("entering");
        document.body.classList.add("loaded");
      }, 900);
    })
    .withFailureHandler(function (e) {
      clearInterval(tick);
      // A real failure is the ONE case where refreshing is the right move, so
      // it says so plainly — the opposite of the in-flight advice above, and
      // the reason that advice is scoped to the waiting state rather than
      // being a standing rule.
      var waited = Math.round((Date.now() - t0) / 1000);
      document.getElementById("loading").innerHTML =
        '<div class="loadWrap"><div class="loadHead">⚠️ Load failed</div>' +
        '<div class="loadNote">' + esc_(e.message) + "<br><br>" +
        "It stopped after " + waited + "s. <b>Now</b> is the time to retry — use ↻ Refresh. " +
        "If it fails again the same way, the model is not building; tell Alex López and quote " +
        "that message.</div></div>";
    })
    .getDeliveryData(!!force);
}

// The old headPeriodIdx_(done) is GONE (2026-08-06). It indexed a complete-only
// list, so there was no index a forward window could be given. Every analysis
// surface now calls analysisHead_() — see the FORWARD WINDOWS block — which
// returns the selected window AND the trend anchor separately, because those
// stopped being the same thing the moment an unfinished window became pickable.

function setPeriodIdx_(v) {
  STATE.periodIdx = (v === "" || v === null) ? null : Number(v);
  renderAll_();
}

function buildPeriodChips_() {
  var pc = document.getElementById("periodChips");
  pc.innerHTML = "";
  var grp = document.getElementById("periodGroup");
  grp.style.display = "";
  // Unit chips need the periods payload (a stale pre-toggle cache is weekly
  // only); the analysis-period PICKER below works either way — weeks are
  // complete periods too, so the group is never an empty dangling label.
  if (MODEL.meta.periods) {
    ["week", "month", "quarter"].forEach(function (k) {
      var b = document.createElement("span");
      b.className = "chip" + ((STATE.period === k) ? " on" : "");
      b.textContent = PERIOD_LABELS[k];
      b.onclick = function () { setPeriod_(k); };
      pc.appendChild(b);
    });
  }
  // ── Analysis-period picker (user request 2026-08-04, forward windows
  //    2026-08-06) ────────────────────────────────────────────────────────────
  // The unit chips choose the GRANULARITY; this chooses the WINDOW that the KPI
  // cards, the comparison, the signals roster and the brief analyse.
  //
  // Three groups, because they are three different kinds of answer and a flat
  // list would let a reader quote a planning window as a result:
  //   Complete    — graded normally. "Latest complete" stays the default.
  //   In progress — the current week/month/quarter: what the team is on now.
  //   Planning    — the next ≤2 weeks: is the fortnight actually covered?
  var done = donePeriods_(), all = analysisPeriods_();
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var sel = document.createElement("select");
  sel.id = "periodPick";
  sel.title = "Which window every analysis surface reads. Complete " + unit +
    "s are graded against target; the current " + unit +
    " is published but never compared to the one before it; a planning week " +
    "measures the plan, not delivery.";
  var opt0 = document.createElement("option");
  opt0.value = ""; opt0.textContent = "Latest complete";
  sel.appendChild(opt0);
  function group_(label, from, to, decorate) {
    if (to < from) return;
    var g = document.createElement("optgroup");
    g.label = label;
    for (var i = to; i >= from; i--) {
      var op = document.createElement("option");
      op.value = String(i);
      op.textContent = decorate ? decorate(all[i]) : all[i].label;
      if (STATE.periodIdx === i) op.selected = true;
      g.appendChild(op);
    }
    sel.appendChild(g);
  }
  var nPlan = planWeeks_().length;
  var nowAt = all.length - nPlan - 1;          // −1 when there is no in-flight period
  group_("Planning · next " + (nPlan === 1 ? "week" : nPlan + " weeks"),
         all.length - nPlan, all.length - 1,
         function (p) { return "▸ " + p.label + " — plan"; });
  if (nowAt >= done.length) {
    group_("In progress", nowAt, nowAt, function (p) { return "◐ " + p.label + " — so far"; });
  }
  group_("Complete", 0, done.length - 1);
  sel.onchange = function () { setPeriodIdx_(this.value); };
  pc.appendChild(sel);
}

function setPeriod_(k) {
  if (STATE.period === k) return;
  STATE.period = k;
  STATE.expandedWeeks = {}; // period keys change — stale expansions/drills reset
  STATE.openDetail = {};
  STATE.openDetailAll = {};
  STATE.periodIdx = null;   // a picked index means a different window per unit — reset to latest
  buildPeriodChips_();
  renderAll_();
}

}

function buildPopChips_() {

/** Set the value-focus lens (header chip strip). The People grid's own
    clickable bar legend — the lens's other entry point — was removed with
    the grid (Task 3, 2026-08-05); STATE.focus and this setter stay for the
    roster that replaces it (Task 5). */
function setFocus_(k) {
  if (STATE.focus === k) return;
  STATE.focus = k;
  buildFocusChips_();
  renderScope_();
  renderAll_();
}

function buildFocusChips_() {
  var fc = document.getElementById("focusChips");
  fc.innerHTML = "";
  ["plan", "billable", "nonbill"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.focus === k) ? " on" : "");
    b.textContent = FOCUS_LABELS[k];
    b.onclick = function () { setFocus_(k); };
    fc.appendChild(b);
  });
}

/** Person's family label for the filter (blank roster family → Uncatalogued). */
function famName_(p) { return p.jobFamily || "Uncatalogued"; }

/** Roster job titles arrive as "07.M5.1 - Manager, Service Delivery" or
    "09.P3.Consultant" — the leading grade code is roster plumbing, not a
    title. Strip it for display; the full string stays in the tooltip and in
    the CSV. A title without the code prefix passes through untouched. */
function jobTitleDisp_(t) {
  t = String(t || "").trim();
  var clean = t.replace(/^\d{1,3}\.\s*(?:[A-Za-z]\d+(?:\.\d+)*)?[\s.\-–—]*/, "").trim();
  return clean || t;
}

// ── CASCADING FILTERS ────────────────────────────────────────
//
// Every audience dimension is declared once here. Each dropdown/chip strip is
// then populated from the people who pass every OTHER dimension — pick AMER and
// the Team, PM and Job-family lists collapse to the teams, PMs and families that
// actually exist in AMER. Clear it and the full lists return, so scenarios can be
// built up and unwound without ever landing on a combination that selects nobody
// by accident (user request 2026-08-03).
//
// Two rules make it safe rather than merely clever:
//   1. The ACTIVE value is always listed, even at zero — a selection may never
//      silently vanish from the control that set it.
//   2. Values with no one in the current slice are shown DISABLED under a
//      separate group, never deleted. A list that changes length under you is
//      how people lose trust in a filter.

/**
 * ── UNTAGGED BUCKETS — why every dimension needs one ──
 *
 * Region and Job family are single-valued and already have server-side
 * fallbacks ("Unassigned", "Uncatalogued"), so every person lands somewhere.
 * Team and PM are MEMBERSHIP LISTS and can be empty — and an empty list belongs
 * to no bucket at all.
 *
 * That silently broke the Executive comparison chart (user-reported 2026-08-03,
 * "charts do not show all records — we are missing PMs and Teams"): a person on
 * no team contributed to no bar, so the chart quietly described a subset of the
 * population with nothing on screen saying so. Ten untagged people out of forty
 * is a chart that is 25% wrong and looks complete.
 *
 * So an empty list resolves to an explicit bucket instead. It is a real,
 * selectable value everywhere — filter, dropdown, chart, drill-through — because
 * "who has no PM?" is a question worth being able to ask, and because the bars
 * must add up to the population or the chart is lying by omission.
 */
var UNTAGGED_ = { team: "(No team)", pm: "(No PM)" };

/** True when a value is one of the untagged sentinels (styled + sorted apart). */
function isUntagged_(val) {
  for (var k in UNTAGGED_) if (UNTAGGED_[k] === val) return true;
  return false;
}

var FILTER_DIMS = {
  region: { label: "region",     vals: function (p) { return [p.region]; },
            all: function () { return MODEL.meta.regions || []; } },
  team:   { label: "team",
            vals: function (p) {
              var t = p.teams || [];
              return t.length ? t : [UNTAGGED_.team];
            },
            all: function () { return MODEL.meta.teams || []; } },
  pm:     { label: "PM",
            vals: function (p) {
              var m = p.pms || [];
              return m.length ? m : [UNTAGGED_.pm];
            },
            all: function () { return MODEL.meta.pms || []; } },
  family: { label: "job family", vals: function (p) { return [famName_(p)]; },
            all: function () { return MODEL.meta.families || []; } },
};

/**
 * Does this person carry `val` on dimension `dim`?
 *
 * ONE membership test, used by the filter predicate, the option counts and the
 * comparison chart's row members alike. Before this each had its own inline
 * `p.teams.indexOf(...)`, which is exactly how the untagged bucket could exist
 * in the option list while matching nobody in the filter.
 */
function dimMatch_(p, dim, val) {
  return FILTER_DIMS[dim].vals(p).indexOf(val) !== -1;
}

/**
 * THE filter predicate — every filter is universal (user decision 2026-07-31):
 * population, role, region, team, PM, job family, triage flag and person search
 * scope the KPI cards, the charts and the grid identically.
 *
 * @param {Object} p     person record
