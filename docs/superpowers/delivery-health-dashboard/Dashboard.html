<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
:root{
  --void:#0F1941; --orbe:#058CDC; --ivory:#DCCDBE; --cream:#FFFAF5;
  --royal:#2864E6; --june:#FF9B87; --slate:#64748B;
  --bg:var(--cream); --surface:#ffffff; --surface-2:#FBF6F0;
  --border:#E7DDD2; --text:var(--void); --muted:#6B7280;
  --heat-lo:#FFFAF5; --heat-mid:#058CDC; --heat-hi:#0F1941;
  --heatf-lo:#FFFAF5; --heatf-mid:#DCCDBE; --heatf-hi:#FF9B87;
  --up:#1F8A57; --down:#C2410C; --neutral:#E7DDD2;
  --winner:#FF9B87; --pos:#1F8A57; --warn:#C2410C; --amber:#B45309;
  --shadow:0 1px 2px rgba(15,25,65,.06), 0 8px 24px rgba(15,25,65,.06);
  --scale:1;
  /* ── Chart marks ──
     Deliberately SEPARATE tokens from the text colours above, because marks and
     text have different jobs and different constraints. The text amber
     (--amber #B45309) and the text red (--warn #C2410C) are only ΔE 4.1 apart
     in normal vision and ΔE 0.1 under deuteranopia — as *text* that is fine
     (they are never adjacent and each carries a word), but as two fills side by
     side in a chart they are the same colour. The chart set below passes the
     lightness-band, chroma, CVD-separation (worst adjacent ΔE 8.7 protan),
     normal-vision (16.5) and contrast checks. --c-warn sits at 2.94:1 on white,
     just under the 3:1 mark, so every bar using it also carries a value label
     and a ✔/▲/✖ glyph and appears in a table view — status is never colour
     alone (FR-4.4). Verified with the dataviz palette validator, not by eye. */
  --c-good:#1F8A57; --c-warn:#CA8A04; --c-bad:#C2410C;
  --c-series:#058CDC; --c-ref:#64748B; --c-target:#2864E6;
  --grid:#EDE4DA; --plot:#ffffff;
  /* Workload-bar segments. Their own tokens because the light values could not
     be reused in dark: billable was --void (#0F1941) on a #141C3D surface —
     the most important segment in the grid was effectively invisible in dark
     mode, which is how a manager reads a full bar as an empty one. */
  --seg-bill:#0F1941; --seg-nonbill:#64748B; --seg-idle:#E7DDD2; --seg-ooo:#FF9B87;
}
[data-theme="dark"]{
  --bg:#090F26; --surface:#141C3D; --surface-2:#0F1733;
  --border:#1E295A; --text:#FFFAF5; --muted:#94A3B8;
  --heat-lo:#16203F; --heat-mid:#058CDC; --heat-hi:#FF9B87;
  --heatf-lo:#16203F; --heatf-mid:#DCCDBE; --heatf-hi:#FFFAF5;
  --up:#34D399; --down:#FB7185; --neutral:#1E295A;
  --winner:#FF9B87; --pos:#34D399; --warn:#FDBA74; --amber:#FDBA74;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  /* Dark chart marks are SELECTED against the dark surface, not flipped from
     light. The light amber (#CA8A04) is invisible on #141C3D; #FBBF24 clears it
     and lifts CVD separation from the old --amber pairing (ΔE 4.4 protan, a
     fail) to 10.6. These sit slightly above the validator's 0.43–0.77 lightness
     band on purpose — that band is calibrated for a light surface, and marks on
     a near-black panel have to be lighter to hold 3:1 contrast, which they do. */
  --c-good:#34D399; --c-warn:#FBBF24; --c-bad:#FB7185;
  --c-series:#38BDF8; --c-ref:#94A3B8; --c-target:#7BA4FF;
  --grid:#1E295A; --plot:#141C3D;
  /* Billable takes the series blue so a filled bar reads as filled; non-billable
     stays a cool grey a clear step away from it; idle is a near-surface navy so
     empty capacity reads as absence rather than as another kind of work. */
  --seg-bill:#38BDF8; --seg-nonbill:#94A3B8; --seg-idle:#222D57; --seg-ooo:#FF9B87;
}
/* Fluid type/space scale — every font-size and several key dimensions below multiply
   this token, so laptop and (especially) ultrawide screens get visibly bigger text and
   controls instead of the same fixed-size column floating in empty margin. */
@media(max-width:420px){:root{--scale:.94}}
@media(min-width:1024px){:root{--scale:1.08}}
@media(min-width:1440px){:root{--scale:1.16}}
@media(min-width:1920px){:root{--scale:1.28}}
@media(min-width:2560px){:root{--scale:1.4}}
@media(min-width:3440px){:root{--scale:1.5}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto','Franklin Gothic Book',-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:calc(16px*var(--scale))}
/* Identity Lockdown typography: headings + hero numbers in the condensed face */
h1,h2,h3,.title,.tile .big{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
/* Sticky filter bar: KPIs scroll away, Region/Team/Family/search stay pinned
   (user feedback 2026-07-31: while scrolling, only filters + table header remain).
   Two intentional rows (feedback round 2 — the flat chip strip read as one messy
   row): identity + action buttons on top, labeled filter groups below. */
.hdr{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
     position:sticky;top:0;z-index:100;background:var(--bg);
     padding:calc(8px*var(--scale)) 0;border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Labeled segmented control per filter group — a group reads as ONE control:
   tiny uppercase name + joined pills sharing a border. */
.fgroup{display:flex;align-items:center;gap:7px}
.fgroup .flbl{font-size:calc(9px*var(--scale));color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.seg{gap:0;display:inline-flex;border:1px solid var(--border);border-radius:999px;
     overflow:hidden;background:var(--surface)}
.seg .chip{border:none;border-radius:0;background:transparent}
.seg .chip+.chip{border-left:1px solid var(--border)}
.seg .chip.on{background:var(--orbe);color:#fff}
.hdr h1{font-size:calc(19px*var(--scale));font-weight:800}
.hdr .sub{color:var(--muted);font-size:calc(12px*var(--scale))}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;
     padding:6px 12px;font-size:calc(12px*var(--scale));cursor:pointer;color:var(--text)}
.btn:hover{filter:brightness(.97)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;
      font-size:calc(11px*var(--scale));background:var(--surface)}
.chip.on{background:var(--orbe);border-color:var(--orbe);color:#fff}
select,input[type=search]{background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:6px 10px;font-size:calc(12px*var(--scale));color:var(--text)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;
       padding:14px;box-shadow:var(--shadow)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
.tile .lbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .big{font-size:calc(26px*var(--scale));font-weight:800;margin:2px 0}
.tile .big.g{color:var(--pos)} .tile .big.a{color:var(--amber)} .tile .big.r{color:var(--warn)}
.tile .cmp{font-size:calc(11px*var(--scale));color:var(--muted)}
.tile.ph{opacity:.55;border-style:dashed}
/* ── Confidence + suppression (FR-2.1/2.2) ──
   A suppressed tile is styled as a distinct STATE, not a greyed-out number:
   dashed border, no hero figure, the coverage and the owner in its place. The
   glyphs (◆ ◈ ◇, ✔ ▲ ✖) carry the same information as the colour, so the read
   survives a monochrome board pack and a colour-vision difference (FR-4.4). */
.tile.sup{border-style:dashed;border-color:var(--amber)}
.tile .supbig{font-size:calc(15px*var(--scale));font-weight:700;color:var(--amber);
              margin:4px 0;cursor:help;font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
.conf{font-size:calc(10px*var(--scale));font-weight:700;cursor:help;letter-spacing:.02em}
.conf.chigh{color:var(--pos)} .conf.cmedium{color:var(--amber)} .conf.clow{color:var(--warn)}
.hyglink{color:var(--orbe);font-weight:700;text-decoration:none}
.hyglink:hover{text-decoration:underline}
.stalenote{color:var(--warn);font-weight:700}
/* ── Data Hygiene view ── */
.hnav{display:flex;align-items:center;gap:8px;margin:10px 0 12px;flex-wrap:wrap}
.hnav .btn[disabled]{opacity:.35;cursor:default}
.hnav .hper{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
            font-size:calc(14px*var(--scale));font-weight:700;min-width:120px;text-align:center}
.gedit{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.gedit summary{cursor:pointer;font-weight:700;font-size:calc(12px*var(--scale))}
.gedit input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--border);
                          border-radius:6px;background:var(--surface);color:var(--text)}
table.hyg{border-collapse:collapse;width:100%;font-size:calc(11px*var(--scale))}
table.hyg th{text-align:left;color:var(--muted);font-weight:700;text-transform:uppercase;
             font-size:calc(9px*var(--scale));letter-spacing:.05em;padding:6px 8px;
             border-bottom:1px solid var(--border);white-space:nowrap}
table.hyg td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
table.hyg td.hnum{white-space:nowrap;font-weight:700;min-width:150px}
table.hyg td.hnum.g{color:var(--pos)} table.hyg td.hnum.a{color:var(--amber)}
table.hyg td.hnum.r{color:var(--warn)}
.hbar{height:5px;border-radius:3px;background:var(--border);margin:4px 0 2px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.hbar i.g{background:var(--pos)} .hbar i.a{background:var(--amber)} .hbar i.r{background:var(--warn)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:6px}
.spark i{flex:1;background:var(--orbe);border-radius:2px 2px 0 0;min-height:2px}
.dUp{color:var(--pos);font-weight:700} .dDown{color:var(--warn);font-weight:700}
.lgd{font-size:calc(9px*var(--scale));color:var(--muted);margin-right:10px;white-space:nowrap}
.lgd i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:3px}
.attn{font-size:calc(11px*var(--scale));font-weight:700;margin-bottom:6px}
.exBadge{margin-left:4px;cursor:help}
.gwrap{overflow-x:auto}
/* The people grid scrolls inside its own viewport-capped box, so while scrolling
   the roster only the sticky filter bar + the sticky header row below stay in
   view (KPI tiles live at the top of the page only). Scoped to the OUTER wrap —
   backlog tables in the detail rows reuse .gwrap and must not get capped. */
#gridPanel>.gwrap{overflow:auto;max-height:calc(100vh - 150px*var(--scale))}
.shooting>.gwrap{max-height:none;overflow:visible}
table.grid{width:100%;border-collapse:collapse;font-size:calc(12px*var(--scale))}
.grid th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:8px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:5}
.grid th.now{border-bottom:2px solid var(--orbe);color:var(--orbe)}
.grid th.plan,.grid td.plan{opacity:.75}
.grid td{padding:6px 8px;border-top:1px solid var(--border);text-align:center;white-space:nowrap}
.grid td.name{text-align:left;font-weight:600;min-width:150px}
.grid td.tG{background:rgba(31,138,87,.14)} .grid td.tA{background:rgba(180,83,9,.14)}
.grid td.tR{background:rgba(194,65,12,.16)}
.grid th.exp{background:var(--surface-2)}
.bar{position:relative;height:16px;min-width:160px;border:1px solid var(--border);
     border-radius:4px;overflow:hidden;display:flex;cursor:pointer}
.bar .sB{background:var(--seg-bill)} .bar .sN{background:var(--seg-nonbill)}
.bar .sI{background:var(--seg-idle)}
/* Unclassified: tracked in Tempo, no NetSuite split. Hatched slate so it reads
   as "real work, unknown kind" — distinct from solid-slate non-billable. */
.bar .sU{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
.bar .sO{background:repeating-linear-gradient(45deg,var(--seg-ooo),var(--seg-ooo) 4px,transparent 4px,transparent 8px)}
.planTick{position:absolute;top:-6px;font-size:9px;color:var(--royal);transform:translateX(-50%)}
.warnFlag{color:var(--warn);font-weight:700;margin-left:4px}
/* Small print must stay readable — was a raw 9px (unscaled), reported unreadable. */
.cellSub{font-size:calc(10.5px*var(--scale));color:var(--muted)}
tr.detail td{background:var(--surface-2);padding:12px 16px 14px;text-align:left}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:calc(12px*var(--scale));margin-bottom:10px}
.stats b{font-size:calc(14px*var(--scale))}
.blbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;margin:6px 0 2px}
.btrack{position:relative;height:10px;background:var(--orbe);border-radius:3px;max-width:360px}
.btrack .ooo{position:absolute;right:0;top:0;height:100%;border-radius:0 3px 3px 0;
  background:repeating-linear-gradient(45deg,var(--june),var(--june) 4px,rgba(255,155,135,.35) 4px,rgba(255,155,135,.35) 8px)}
.bline{height:8px;border-radius:3px;max-width:360px;display:flex;overflow:hidden}
.bline .b{background:var(--seg-bill)} .bline .n{background:var(--seg-nonbill)}
.bline .u{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
.bplanned{height:8px;background:var(--royal);border-radius:3px;max-width:360px;opacity:.85}
table.bklog{border-collapse:collapse;font-size:calc(11px*var(--scale));margin-top:2px}
.bklog th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;text-align:left;padding:3px 10px 3px 0;border-bottom:1px solid var(--border)}
.bklog td{padding:3px 10px 3px 0;border-bottom:1px solid var(--border);max-width:420px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Soft vertical separators so week columns stay readable when fully expanded —
   applies to headers, cells, AND the aligned detail cards. */
.grid th+th,.grid td+td{border-left:1px solid var(--border)}
/* Export controls are utilities, not protagonists (user feedback 2026-07-31):
   borderless ghost icon-buttons in muted ink, tiny uppercase caption, only
   gaining presence on hover. */
.iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:6px;
  font-size:calc(9.5px*var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.iconbtn:hover{color:var(--text);background:var(--surface-2)}
.iconbtn svg{width:calc(13px*var(--scale));height:calc(13px*var(--scale))}
td.name.pname{cursor:pointer}
td.name.pname:hover{color:var(--orbe)}
tr.detail td.dctx{vertical-align:top;text-align:left;font-size:calc(11px*var(--scale));
  min-width:150px;padding:8px}
tr.detail td.dcell{vertical-align:top;text-align:left;padding:8px;min-width:170px}
tr.detail td.dback{padding:8px 16px 12px}
.mstat{font-size:calc(11px*var(--scale));margin:1px 0;white-space:nowrap}
.mstat b{font-size:calc(13px*var(--scale))}

/* ── TAB BAR ──
   One view per question. Everything used to stack into a single scroll — KPI
   cards, roster grid, drill-downs — which is exactly the "mixed signals" a
   manager has to untangle before reading anything. The tab bar is generated
   from the VIEWS array, so a view's label, pane and role gate are declared once. */
.tabs{display:flex;gap:2px;align-items:flex-end;border-bottom:1px solid var(--border);
      margin:0 0 14px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid transparent;border-bottom:none;
     border-radius:8px 8px 0 0;padding:7px 14px;cursor:pointer;color:var(--muted);
     font-size:calc(12.5px*var(--scale));font-weight:600;position:relative;top:1px}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab.on{background:var(--surface);border-color:var(--border);color:var(--text);
        box-shadow:inset 0 2px 0 var(--orbe)}

/* ── CHARTS ──
   Inline SVG, no library. A CDN chart lib is one blocked request away from an
   empty executive dashboard inside the HtmlService iframe, and every label,
   reference line and hit target here is bespoke anyway. */
.chart{width:100%;height:auto;display:block;overflow:visible;
       font-family:'Roboto',-apple-system,"Segoe UI",sans-serif}
/* Horizontal bar charts grow DOWNWARD with the category count, and `height:auto`
   on a 100%-wide SVG scales that growth by the container width too. At 52 PMs on
   a wide monitor the viewBox was ~1600 units tall rendering at ~2× — a chart
   several screens high where one row was legible at a time. Capping the width
   caps the scale factor, so a row is always ~30px however many there are, and
   the row cap in hbarChart_ keeps the list itself readable. */
.chart.hbar{max-width:calc(760px*var(--scale))}
.chart text{fill:var(--muted);font-size:11px}
.chart text.val{fill:var(--text);font-weight:700}
.chart text.axis{font-size:10px;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .clickable{cursor:pointer}
.chart .clickable:hover .barfill{opacity:.78}
.chartHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chartHead h3{font-size:calc(14px*var(--scale));font-weight:800}
.chartHead .sub{color:var(--muted);font-size:calc(11px*var(--scale))}
/* A legend entry that FILTERS says so — it is a control, not a caption. Reaches
   the grid's attention strip and bar vocabulary (.lgd.act): a legend where some
   entries act and others don't must show which is which. */
.act{cursor:pointer;border-bottom:1px dotted var(--muted)}
.act:hover{color:var(--text);border-bottom-color:var(--text)}
.act.on{color:var(--orbe);font-weight:700;border-bottom-color:var(--orbe)}
/* ── Verdict strip — the "rapid answer" line above each chart ── */
.verdict{font-size:calc(12.5px*var(--scale));line-height:1.5;margin:2px 0 10px}
.verdict b{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
           font-size:calc(15px*var(--scale))}
.vg{color:var(--pos)} .va{color:var(--amber)} .vr{color:var(--warn)}
.norm{font-size:calc(11px*var(--scale));color:var(--muted);margin-top:2px}

/* ── Opportunity table (Trends view) ──
   Minimalist on purpose: six columns, one accent, no zebra. The eye should land
   on the Opportunity column and nothing else. */
table.opp{border-collapse:collapse;width:100%;font-size:calc(12px*var(--scale))}
.opp th{text-align:right;color:var(--muted);text-transform:uppercase;
        font-size:calc(9.5px*var(--scale));letter-spacing:.05em;padding:6px 10px;
        border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.opp th:first-child,.opp th:nth-child(2){text-align:left}
.opp th.sorted{color:var(--orbe)}
.opp td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;
        white-space:nowrap;font-variant-numeric:tabular-nums}
.opp td:first-child,.opp td:nth-child(2){text-align:left;font-variant-numeric:normal}
.opp td.who{font-weight:600}
.opp td.where{color:var(--muted);font-size:calc(11px*var(--scale))}
.opp tr:hover td{background:var(--surface-2)}
.opp td.gap.r{color:var(--warn);font-weight:700}
.opp td.gap.a{color:var(--amber);font-weight:700}
.opp td.gap.g{color:var(--pos)}
.opp .oppbar{display:inline-block;vertical-align:middle;height:7px;border-radius:0 3px 3px 0;
             background:var(--c-bad);margin-right:6px;min-width:2px}
.oppHead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.oppHead .big{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
              font-size:calc(24px*var(--scale));font-weight:800}
.emptyState{padding:26px 16px;text-align:center;color:var(--muted);
            font-size:calc(12.5px*var(--scale))}
/* Options that exist in the data but not in the current slice stay VISIBLE and
   disabled, so a filter list never silently loses a value someone is looking for. */
select option:disabled{color:var(--muted);font-style:italic}
.chip.off{opacity:.38;cursor:not-allowed}
</style>
</head>
<body>
<div class="hdr">
  <div class="hrow">
    <h1>Delivery Health</h1>
    <span class="sub" id="asOf"></span>
    <span style="flex:1"></span>
    <button class="btn" id="btnReset" title="Back to the default view — clears every filter, the person search, and all expanded rows">⟲ Reset</button>
    <button class="btn" id="btnRefresh" title="Bypass the cache and reload live data">↻ Refresh</button>
    <button class="btn" id="btnTheme" title="Switch between light and dark theme">🌙 Dark</button>
  </div>
  <div class="hrow">
    <div class="fgroup" id="periodGroup" title="Aggregation period — months are calendar, quarters are fiscal (FY starts Jul 1, named for its end year)">
      <span class="flbl">Period</span><div class="chips seg" id="periodChips"></div>
    </div>
    <div class="fgroup" title="Population — FTEs are the primary focus (default); Crew shows contractors only; All combines them. Universal: scopes the KPI tiles and the grid.">
      <span class="flbl">People</span><div class="chips seg" id="popChips"></div>
    </div>
    <div class="fgroup" title="Role — split managers (M-level job codes) from individual contributors. Managers often plan without tracking much, which drags delivery rates; the IC view removes that effect. Universal: scopes the KPI tiles and the grid.">
      <span class="flbl">Role</span><div class="chips seg" id="roleChips"></div>
    </div>
    <div class="fgroup" title="Value focus — what the grid cells show and how people are ranked. Plan = planned hours, alphabetical. Billable = tracked hours falling on the billable side of the NetSuite split, most first. Non-bill = the non-billable side — real project work (PTO/holidays come from the Time off Report and are never in this bucket; absence only reduces availability). Both are Tempo tracked hours apportioned by the NetSuite billable mix, so they always sum to tracked.">
      <span class="flbl">Focus</span><div class="chips seg" id="focusChips"></div>
    </div>
    <div class="fgroup" title="Region — universal: scopes the KPI tiles and the grid.">
      <span class="flbl">Region</span><div class="chips seg" id="regionChips"></div>
    </div>
    <select id="teamSel" title="Team filter — universal: scopes the KPI tiles and the grid."><option value="">All teams</option></select>
    <select id="pmSel" title="Project Manager — universal: scopes the KPI tiles and the grid. Shows people with planned or tracked hours on any project this PM leads (Tempo PM field); membership-based like Teams."><option value="">All PMs</option></select>
    <select id="famSel" title="Job-family filter — universal: scopes the KPI tiles and the grid. Options cover the tracking-mandated population (JF007 Managed Services &amp; Support, JF009 Service Delivery, uncatalogued/crew); non-tracking families are not in this dashboard at all."><option value="">All job families</option></select>
    <input type="search" id="personSearch" placeholder="Find person…">
    <span id="filterWarn" class="cellSub" style="color:var(--amber)"></span>
  </div>
</div>

<div id="loading" class="loading">Loading delivery health…</div>

<div id="app" style="display:none">
  <!-- Tab bar — generated from VIEWS in JS, so a view is declared in one place. -->
  <div class="tabs" id="tabBar"></div>

  <!-- Live scope chip: states exactly WHAT slice is on screen. Above the panes,
       because the filter row scopes every view (never per-chart filters). -->
  <div class="sub" id="scopeChip" style="margin:-6px 0 12px;color:var(--muted);font-size:11px;cursor:help"
    title="Every filter is universal — it scopes the KPI cards, the charts and the grid together. On-Time and Forecast issues join to people via the Jira Assignee, so population/role/PM/family/search apply to them too; items without a roster assignee are excluded (count in the card tooltip). Team and PM rates are membership-based, so slices don't sum to All; a PM slice shows the whole week of everyone on that PM's projects."></div>

  <!-- ── EXECUTIVE — the four cards and one comparison. The 30-second read. ── -->
  <div id="viewExec" class="viewPane">
    <div style="text-align:right"><button class="iconbtn" onclick="savePng_('tiles','tiles')" title="Save the KPI cards as a PNG image">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button></div>
    <div class="tiles" id="tiles"></div>
    <div class="panel" id="comparePanel" style="margin-bottom:14px"></div>
  </div>

  <!-- ── TRENDS — one metric over its whole history, plus who moves it. ── -->
  <!-- Trends is the headroom table and nothing else (user 2026-08-03). The
       history line chart was removed: the tiles already carry a sparkline and a
       vs-target/vs-prior read, so a second, larger telling of the same series
       was page weight rather than a second answer. What this tab has that
       nothing else does is per-person headroom. -->
  <div id="viewTrend" class="viewPane" style="display:none">
    <div class="panel" id="oppPanel"></div>
  </div>

  <!-- ── PEOPLE — the operational roster + drill-downs. ── -->
  <div id="viewPeople" class="viewPane" style="display:none">
    <div style="text-align:right;margin-bottom:6px">
      <button class="btn" id="btnExpandAll" onclick="toggleAllWeeks_()">▸ Expand all weeks</button>
      <button class="iconbtn" onclick="saveCsv_()" title="Download the current filtered view (one row per person per period) as CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>
      <button class="iconbtn" onclick="savePng_('gridPanel','grid')" title="Save the grid as a PNG image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
    </div>
    <div class="panel" id="gridPanel"></div>
  </div>

  <!-- Data Hygiene (FR-2.3/2.4): the attribution work queue that used to live as
       grey caveat text on the KPI cards. Deliberately unfiltered. -->
  <div id="viewHygiene" class="viewPane panel" style="display:none"></div>

  <!-- Access Control — admin only, gated in switchView_ as well as in the tab bar. -->
  <div id="viewAccess" class="viewPane panel" style="display:none"></div>
</div>

<script>
var MODEL = null;
// period: "month" (default per user decision 2026-07-31) | "week" | "quarter"
// pop: population lens — "fte" (default: FTEs are the primary focus) | "crew" | "all"
// hygIdx: which complete period the Data Hygiene view is showing — an index into
// hygPeriods_(), "all" for the whole window, or null for the most recent.
// view:    which tab is open — see VIEWS below.
// flag:    triage filter driven by clicking the attention legend ("" = off).
// metric:  which metric the Trends view charts.
// compare: which dimension the Executive comparison chart breaks down by.
// oppSort: opportunity-table sort column.
var STATE = { period: "month", pop: "fte", role: "all", focus: "plan", region: "", team: "", pm: "", family: "", search: "", expandedWeeks: {}, openDetail: {}, hygIdx: null,
              view: "exec", flag: "", metric: "util", compare: "region", compareAll: false,
              oppSort: "opp", oppDesc: true };
var PERIOD_LABELS = { week: "Week", month: "Month", quarter: "Quarter" };

/**
 * ── VIEWS: the single source of truth for navigation ─────────────────────────
 * Label, pane id and role gate are declared once; the tab bar, switchView_ and
 * renderAll_'s dispatch all derive from this array. Same pattern as the PS
 * dashboard's VIEWS — adding a tab must never mean editing four places.
 *
 * Why tabs at all: everything used to stack into one scroll, so a manager
 * looking for "who needs me this week" waded through executive KPIs, and an
 * executive looking for "are we on target" waded through a 200-row roster.
 * One view answers one question.
 */
var VIEWS = [
  { id: "exec",    label: "📊 Executive", pane: "viewExec",    roles: null,
    hint: "The four cards and one comparison — the 30-second read." },
  { id: "trend",   label: "📈 Trends",    pane: "viewTrend",   roles: null,
    hint: "Where the headroom is — one row per person, ranked by the hours that could be recovered." },
  { id: "people",  label: "👥 People",    pane: "viewPeople",  roles: null,
    hint: "The operational roster: who needs attention this period, with per-person drill-downs." },
  { id: "hygiene", label: "🧪 Data Hygiene", pane: "viewHygiene", roles: null,
    hint: "What's missing from the data, who owns each gap, and the week it's committed for — the queue behind every suppressed metric." },
  { id: "access",  label: "🔒 Access",    pane: "viewAccess",  roles: ["admin"],
    hint: "Manage who can open this dashboard." },
];

function viewDef_(id) {
  for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i].id === id) return VIEWS[i];
  return VIEWS[0];
}

/** A view the current viewer is allowed to open. */
function viewAllowed_(v) {
  return !v.roles || v.roles.indexOf((MODEL && MODEL.viewerRole) || "") !== -1;
}

function buildTabs_() {
  var bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  VIEWS.forEach(function (v) {
    if (!viewAllowed_(v)) return;
    var b = document.createElement("button");
    b.className = "tab" + (STATE.view === v.id ? " on" : "");
    b.textContent = v.label;
    b.title = v.hint;
    b.onclick = function () { switchView_(v.id); };
    bar.appendChild(b);
  });
}

/**
 * Open a view. The role gate is enforced HERE, not just by hiding the tab, so
 * every other entry point is a thin alias over it: showHygiene_() (linked from
 * the suppressed KPI cards), the Trends view's "What's missing" link, and any
 * future deep link all route through this one function.
 */
function switchView_(id) {
  var v = viewDef_(id);
  if (!viewAllowed_(v)) v = VIEWS[0];
  STATE.view = v.id;
  VIEWS.forEach(function (x) {
    var el = document.getElementById(x.pane);
    if (el) el.style.display = x.id === v.id ? "" : "none";
  });
  // The scope chip describes the FILTERED population; Data Hygiene is
  // deliberately whole-population, so showing it there would be a lie.
  document.getElementById("scopeChip").style.display =
    (v.id === "hygiene" || v.id === "access") ? "none" : "";
  buildTabs_();
  renderAll_();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
var POP_LABELS = { fte: "FTE", crew: "Crew", all: "All" };
// focus: what the grid cells show + the roster ranking — "plan" (default,
// alphabetical) | "billable" | "nonbill" (both rank most-hours-first).
var FOCUS_LABELS = { plan: "Plan", billable: "Billable", nonbill: "Non-bill" };

/** The focused metric of one aggregated cell. */
function focusVal_(w) {
  if (!w) return null;
  return STATE.focus === "billable" ? w.billable
    : STATE.focus === "nonbill" ? w.nonBillable : w.effPlanned;
}

/** Window total of the focused metric for ranking + the name-cell badge
    (billable/non-bill only exist on past weeks, so summing the whole window
    is the completed-work total). */
function personFocusTotal_(p) {
  if (p.onLeave) return 0; // hours hidden while on leave — no badge, ranks last
  var t = 0;
  Object.keys(p.weeks).forEach(function (iso) {
    var w = p.weeks[iso];
    t += STATE.focus === "billable" ? (w.billable || 0) : (w.nonBillable || 0);
  });
  return t;
}

/** Population lens — one of the universal filters (they ALL scope the
    utilization tiles and the grid together, via passesFilters_). */
function popMatch_(p) {
  if (STATE.pop === "all") return true;
  return STATE.pop === "crew" ? p.isCrew === true : p.isCrew !== true;
}

/** Pre-hire cell marker (grid + detail): the period predates the person's
    hire date — deliberately not "—"/0, which reads as missing delivery. */
function preHireMark_(p) {
  return '<span class="cellSub" title="joined ' + esc_(p.hired) +
    ' — this period predates the hire; excluded from every metric">🌱 pre-hire</span>';
}

/**
 * Absence marker (user feedback 2026-07-31): PTO/holidays kill availability,
 * so a fully-absent period shows 🏖, never a 0 that reads as non-delivery.
 * Two flavors: long leave from roster Employee Status (maternity/parental/…)
 * covers the person's whole row; a fully-OOO period (avail 0, all hours PTO/
 * holiday) covers just that cell.
 */
function absenceMark_(p, w) {
  if (p.onLeave) {
    return '<span class="cellSub" title="' + esc_(p.leaveStatus || "On leave") +
      ' (roster Employee Status) — no availability expected">🏖 ' +
      esc_(p.leaveStatus || "on leave") + "</span>";
  }
  return '<span class="cellSub" title="entire period on PTO/holiday (' +
    r1_(w.pto + w.hol) + "h) — no availability, so nothing to plan or track\">🏖 PTO</span>";
}

/** True when the whole period's capacity is consumed by PTO/holidays. */
function fullyOoo_(w) { return !!w && w.avail <= 0 && (w.pto + w.hol) > 0; }

// role: "all" (default) | "ic" | "mgr" — managers = M-level job codes
// ("07.M5.1 - …"); managers often plan without tracking much, so the IC view
// removes that drag from delivery rates (user feedback 2026-07-31).
var ROLE_LABELS = { all: "All", ic: "IC", mgr: "Mgr" };
function roleMatch_(p) {
  if (STATE.role === "ic") return p.isManager !== true;
  if (STATE.role === "mgr") return p.isManager === true;
  return true;
}

function esc_(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function loadData(force) {
  var loadEl = document.getElementById("loading");
  loadEl.textContent = "Loading delivery health…";
  loadEl.style.display = "";
  document.getElementById("app").style.display = "none";
  // Cold cache (first hit after a deploy / warmer gap) rebuilds the whole
  // model server-side — tell the user waiting beats refreshing.
  var slowHint = setTimeout(function () {
    if (loadEl.style.display !== "none") {
      loadEl.textContent = "Still loading — rebuilding the data model (first load after a deploy " +
        "can take a minute or two). It will appear by itself; no need to refresh.";
    }
  }, 8000);
  google.script.run
    .withSuccessHandler(function (m) {
      clearTimeout(slowHint);
      if (m.error) { document.getElementById("loading").textContent = "⚠️ " + m.error; return; }
      MODEL = m;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "";
      MODEL._exCache = {};   // per-person triage flags, recomputed per payload
      // Date + timezone matter on a dashboard with AMER/EMEA/APAC/ANZ filters;
      // seconds don't (director feedback).
      var builtAt = new Date(m.meta.generatedAt);
      // NFR-7: a figure older than 48h presented as current is worse than no
      // figure. Flag it, and suppress every trend comparison while it holds —
      // a delta measured across a gap in refreshes is a fiction.
      MODEL._stale = (Date.now() - builtAt.getTime()) > 48 * 3600 * 1000;
      var asOfEl = document.getElementById("asOf");
      asOfEl.textContent = (MODEL._stale ? "⚠ Data stale — last refresh " : "Data as of ") +
        builtAt.toLocaleString([], {
          month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" }) +
        (m.meta.refreshEveryMin ? " · refreshes every " + m.meta.refreshEveryMin + " min" : "");
      asOfEl.className = "sub" + (MODEL._stale ? " stalenote" : "");
      asOfEl.title = (m.meta.sources || []).map(function (s) {
        return s.system + " → " + s.feeds;
      }).join("\n") || "";
      // Stale cache from before the period toggle shipped → no meta.periods;
      // fall back to weekly until a refresh/warm rebuilds the model.
      if (!m.meta.periods) STATE.period = "week";
      buildFilters_();
      switchView_(STATE.view);   // paints the tab bar, the pane and everything in it
    })
    .withFailureHandler(function (e) {
      clearTimeout(slowHint);
      document.getElementById("loading").textContent = "⚠️ Load failed: " + e.message +
        " — use ↻ Refresh to retry.";
    })
    .getDeliveryData(!!force);
}

function buildPeriodChips_() {
  var pc = document.getElementById("periodChips");
  pc.innerHTML = "";
  // Stale cache (pre-period-toggle model) — hide the whole labeled group, not
  // just its chips, so no empty "PERIOD" label dangles in the filter row.
  var grp = document.getElementById("periodGroup");
  grp.style.display = MODEL.meta.periods ? "" : "none";
  if (!MODEL.meta.periods) return; // weekly only
  ["week", "month", "quarter"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.period === k) ? " on" : "");
    b.textContent = PERIOD_LABELS[k];
    b.onclick = function () { setPeriod_(k); };
    pc.appendChild(b);
  });
}

function setPeriod_(k) {
  if (STATE.period === k) return;
  STATE.period = k;
  STATE.expandedWeeks = {}; // period keys change — stale expansions/drills reset
  STATE.openDetail = {};
  STATE.hygIdx = null;      // "3 back" means a different window per unit — reset to latest
  buildPeriodChips_();
  renderAll_();
}

function buildRoleChips_() {
  var rc = document.getElementById("roleChips");
  rc.innerHTML = "";
  ["all", "ic", "mgr"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.role === k) ? " on" : "");
    b.textContent = ROLE_LABELS[k];
    b.onclick = function () {
      if (STATE.role === k) return;
      STATE.role = k;
      buildRoleChips_();
      renderAll_();
    };
    rc.appendChild(b);
  });
}

function buildPopChips_() {
  var pc = document.getElementById("popChips");
  pc.innerHTML = "";
  ["fte", "crew", "all"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.pop === k) ? " on" : "");
    b.textContent = POP_LABELS[k];
    b.onclick = function () {
      if (STATE.pop === k) return;
      STATE.pop = k;
      buildPopChips_();
      renderAll_();
    };
    pc.appendChild(b);
  });
}

/** Set the value-focus lens. Shared by the chip strip and the clickable bar
    legend inside the grid, so both paths behave identically. */
function setFocus_(k) {
  if (STATE.focus === k) return;
  STATE.focus = k;
  buildFocusChips_();
  renderScope_();
  renderGrid_();   // grid lens only — the cards already carry both rates
}

function buildFocusChips_() {
  var fc = document.getElementById("focusChips");
  fc.innerHTML = "";
  ["plan", "billable", "nonbill"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.focus === k) ? " on" : "");
    b.textContent = FOCUS_LABELS[k];
    b.onclick = function () { setFocus_(k); };
    fc.appendChild(b);
  });
}

/** Person's family label for the filter (blank roster family → Uncatalogued). */
function famName_(p) { return p.jobFamily || "Uncatalogued"; }

// ── CASCADING FILTERS ────────────────────────────────────────
//
// Every audience dimension is declared once here. Each dropdown/chip strip is
// then populated from the people who pass every OTHER dimension — pick AMER and
// the Team, PM and Job-family lists collapse to the teams, PMs and families that
// actually exist in AMER. Clear it and the full lists return, so scenarios can be
// built up and unwound without ever landing on a combination that selects nobody
// by accident (user request 2026-08-03).
//
// Two rules make it safe rather than merely clever:
//   1. The ACTIVE value is always listed, even at zero — a selection may never
//      silently vanish from the control that set it.
//   2. Values with no one in the current slice are shown DISABLED under a
//      separate group, never deleted. A list that changes length under you is
//      how people lose trust in a filter.

/**
 * ── UNTAGGED BUCKETS — why every dimension needs one ──
 *
 * Region and Job family are single-valued and already have server-side
 * fallbacks ("Unassigned", "Uncatalogued"), so every person lands somewhere.
 * Team and PM are MEMBERSHIP LISTS and can be empty — and an empty list belongs
 * to no bucket at all.
 *
 * That silently broke the Executive comparison chart (user-reported 2026-08-03,
 * "charts do not show all records — we are missing PMs and Teams"): a person on
 * no team contributed to no bar, so the chart quietly described a subset of the
 * population with nothing on screen saying so. Ten untagged people out of forty
 * is a chart that is 25% wrong and looks complete.
 *
 * So an empty list resolves to an explicit bucket instead. It is a real,
 * selectable value everywhere — filter, dropdown, chart, drill-through — because
 * "who has no PM?" is a question worth being able to ask, and because the bars
 * must add up to the population or the chart is lying by omission.
 */
var UNTAGGED_ = { team: "(No team)", pm: "(No PM)" };

/** True when a value is one of the untagged sentinels (styled + sorted apart). */
function isUntagged_(val) {
  for (var k in UNTAGGED_) if (UNTAGGED_[k] === val) return true;
  return false;
}

var FILTER_DIMS = {
  region: { label: "region",     vals: function (p) { return [p.region]; },
            all: function () { return MODEL.meta.regions || []; } },
  team:   { label: "team",
            vals: function (p) {
              var t = p.teams || [];
              return t.length ? t : [UNTAGGED_.team];
            },
            all: function () { return MODEL.meta.teams || []; } },
  pm:     { label: "PM",
            vals: function (p) {
              var m = p.pms || [];
              return m.length ? m : [UNTAGGED_.pm];
            },
            all: function () { return MODEL.meta.pms || []; } },
  family: { label: "job family", vals: function (p) { return [famName_(p)]; },
            all: function () { return MODEL.meta.families || []; } },
};

/**
 * Does this person carry `val` on dimension `dim`?
 *
 * ONE membership test, used by the filter predicate, the option counts and the
 * comparison chart's row members alike. Before this each had its own inline
 * `p.teams.indexOf(...)`, which is exactly how the untagged bucket could exist
 * in the option list while matching nobody in the filter.
 */
function dimMatch_(p, dim, val) {
  return FILTER_DIMS[dim].vals(p).indexOf(val) !== -1;
}

/**
 * THE filter predicate — every filter is universal (user decision 2026-07-31):
 * population, role, region, team, PM, job family, triage flag and person search
 * scope the KPI cards, the charts and the grid identically.
 *
 * @param {Object} p     person record
 * @param {string=} skip dimension to ignore ("region"|"team"|"pm"|"family"|"flag"),
 *                       which is what makes the option lists cascade: the choices
 *                       for a dimension are computed with that dimension switched off.
 */
/**
 * Population override for scopedMetric_ — null in normal rendering.
 *
 * When set, only these people exist as far as every metric accessor is
 * concerned. This is how one comparison bar reuses the card's exact formula
 * instead of a hand-rolled copy of it.
 */
var SCOPE_NAMES_ = null;

function passesFilters_(p, skip) {
  if (SCOPE_NAMES_ && !SCOPE_NAMES_[p.name]) return false;
  if (!popMatch_(p)) return false;
  if (!roleMatch_(p)) return false;
  // Routed through dimMatch_ so the filter, the option counts and the chart rows
  // share one membership definition — including the untagged buckets.
  if (skip !== "region" && STATE.region && !dimMatch_(p, "region", STATE.region)) return false;
  if (skip !== "team" && STATE.team && !dimMatch_(p, "team", STATE.team)) return false;
  if (skip !== "pm" && STATE.pm && !dimMatch_(p, "pm", STATE.pm)) return false;
  if (skip !== "family" && STATE.family && !dimMatch_(p, "family", STATE.family)) return false;
  if (skip !== "flag" && STATE.flag && !hasFlag_(p, STATE.flag)) return false;
  if (STATE.search && p.name.toLowerCase().indexOf(STATE.search.toLowerCase()) === -1) return false;
  return true;
}

/** People passing every active filter. */
function filteredPeople_() {
  return MODEL.people.filter(function (p) { return passesFilters_(p); });
}

/**
 * Headcount per value of one dimension, over the people who pass every OTHER
 * filter. Returns { counts, order } where order lists every known value of the
 * dimension — in-scope ones first (by count, then name), out-of-scope after.
 */
function optionsFor_(dim) {
  var d = FILTER_DIMS[dim], counts = {};
  (d.all() || []).forEach(function (v) { counts[v] = 0; });
  MODEL.people.forEach(function (p) {
    if (!passesFilters_(p, dim)) return;
    d.vals(p).forEach(function (v) {
      if (v === undefined || v === null || v === "") return;
      counts[v] = (counts[v] || 0) + 1;
    });
  });
  var live = [], dead = [];
  Object.keys(counts).forEach(function (v) { (counts[v] > 0 ? live : dead).push(v); });
  // Untagged last regardless of size. It is a data-hygiene bucket, not a team,
  // and sorting a big one to the top of a dropdown pushes the real values out of
  // sight. It is never hidden — just never first.
  live.sort(function (a, b) {
    var ua = isUntagged_(a) ? 1 : 0, ub = isUntagged_(b) ? 1 : 0;
    return (ua - ub) || (counts[b] - counts[a]) || a.localeCompare(b);
  });
  dead.sort(function (a, b) { return a.localeCompare(b); });
  return { counts: counts, live: live, dead: dead };
}

/** Populate one <select> from its cascaded options. */
function fillSelect_(id, dim, allLabel) {
  var sel = document.getElementById(id);
  var o = optionsFor_(dim);
  var total = 0;
  o.live.forEach(function (v) { total += o.counts[v]; });
  sel.innerHTML = "";
  var head = document.createElement("option");
  head.value = ""; head.textContent = allLabel;
  sel.appendChild(head);
  o.live.forEach(function (v) {
    var op = document.createElement("option");
    op.value = v; op.textContent = v + " (" + o.counts[v] + ")";
    sel.appendChild(op);
  });
  // Out-of-scope values stay visible but unselectable, plus the active value if
  // the rest of the filter set has emptied it (rule 1 — never lose a selection).
  var rest = o.dead.slice();
  if (STATE[dim] && o.live.indexOf(STATE[dim]) === -1 && rest.indexOf(STATE[dim]) === -1) {
    rest.unshift(STATE[dim]);
  }
  if (rest.length) {
    var grp = document.createElement("optgroup");
    grp.label = "— none in this slice —";
    rest.forEach(function (v) {
      var op = document.createElement("option");
      op.value = v; op.textContent = v + " (0)";
      // The current selection must remain selectable so it can be cleared from
      // the same control; the others are disabled.
      if (v !== STATE[dim]) op.disabled = true;
      grp.appendChild(op);
    });
    sel.appendChild(grp);
  }
  sel.value = STATE[dim] || "";
  sel.title = FILTER_DIMS[dim].label.charAt(0).toUpperCase() + FILTER_DIMS[dim].label.slice(1) +
    " — universal: scopes the cards, the charts and the grid together. Options and " +
    "counts follow the other active filters, so this list only ever offers combinations " +
    "that select someone. Values with nobody in the current slice are greyed out rather " +
    "than removed. " + o.live.length + " of " + (o.live.length + o.dead.length) +
    " values are in scope (" + total + " memberships).";
}

function buildFilters_() {

    b.textContent = (r === "" ? "All" : r) + " " + n; // group label "REGION" carries the context
    b.title = empty

/**
 * Dead-end guard. A filter set that selects nobody is not an error state to be

function renderFilterWarn_() {
  var el = document.getElementById("filterWarn");
  if (!el) return;
  if (filteredPeople_().length > 0) { el.innerHTML = ""; return; }
  // Find the single filter whose removal brings back the MOST people — that's
  // the one to offer, rather than nuking every choice the user just made. Ties
  // resolve in declaration order, so the suggestion is stable across renders.
  var culprit = null;
  ["region", "team", "pm", "family", "flag"].forEach(function (dim) {
    if (!STATE[dim]) return;
    var n = MODEL.people.filter(function (p) { return passesFilters_(p, dim); }).length;
    if (n > 0 && (!culprit || n > culprit.n)) culprit = { dim: dim, n: n };
  });

    ? '⚠ No one matches — <a href="#" class="hyglink" onclick="clearFilter_(\'' +
      culprit.dim + '\');return false">clear ' +
      esc_(FILTER_DIMS[culprit.dim] ? FILTER_DIMS[culprit.dim].label : "the triage filter") +
      "</a> to see " + culprit.n + " people"
    : '⚠ No one matches this combination — <a href="#" class="hyglink" ' +
      'onclick="document.getElementById(\'btnReset\').click();return false">reset the filters</a>';
}

function clearFilter_(dim) {

// ── PERIODS (Week / Month / fiscal Quarter toggle) ───────────

/**
 * Every ISO week in the export window, oldest first.
 *
 * meta.trendWeeks carries only the 6 weeks the KPI sparkline needed, but
 * p.weeks holds the whole 52-week deep window (CONFIG_DH.WEEKS_PAST_DEEP), and
 * the month calendar is built over exactly that window — so flattening
 * meta.periods.month recovers the full weekly axis with no payload change and
 * no cache bust. That history is what makes an observed operating rate
 * meaningful: a "standard rate" derived from six points is an opinion.
 */
function allIsoWeeks_() {
  if (MODEL._allIsos) return MODEL._allIsos;
  var out = [];
  if (MODEL.meta.periods && MODEL.meta.periods.month) {
    MODEL.meta.periods.month.forEach(function (m) { out = out.concat(m.isos); });
  } else {
    var seen = {};
    (MODEL.meta.trendWeeks || []).forEach(function (iso) { seen[iso] = 1; out.push(iso); });
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      var iso = wk.iso || wk;
      if (!seen[iso]) { seen[iso] = 1; out.push(iso); }
    });
  }
  MODEL._allIsos = out;
  return out;
}

/** Every period of the active type, oldest first: {key,label,status,partial,isos[]}. */
function allPeriods_() {
  if (STATE.period === "week" || !MODEL.meta.periods) {
    if (MODEL._weekPeriods) return MODEL._weekPeriods;
    // Status comes from gridWeeks where it is known (done/now/plan); any week
    // older than the grid window is complete by construction.
    var st = {};
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      if (wk && wk.iso) st[wk.iso] = wk.status;
    });
    MODEL._weekPeriods = allIsoWeeks_().map(function (iso) {
      return { key: iso, label: iso, status: st[iso] || "done", partial: false, isos: [iso] };
    });
    return MODEL._weekPeriods;
  }
  return (STATE.period === "month" ? MODEL.meta.periods.month : MODEL.meta.periods.quarter) || [];
}

/** Complete, non-truncated periods of the active type, oldest first — the only
    periods a trend or an operating rate may be built from. */
function donePeriods_() {
  return allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
}

/** The periods shown as GRID columns — recent focus, like the weekly 2+1+3. */
function activePeriods_() {
  if (STATE.period === "week" || !MODEL.meta.periods) {
    return MODEL.meta.gridWeeks.map(function (wk) {
      return { key: wk.iso, label: wk.iso, status: wk.status, partial: false, isos: [wk.iso] };
    });
  }
  var all = allPeriods_();
  if (STATE.period === "quarter") return all; // few enough — show everything
  var done = all.filter(function (p) { return p.status === "done"; });
  return done.slice(-3).concat(all.filter(function (p) { return p.status !== "done"; }));
}

/**
 * Aggregates a person's weekly cells over a period. effPlanned caps planned at
 * capacity PER WEEK before summing (the Tempo per-project duplication rule).
 * Returns null when no member week has data.
 */
function aggWeeks_(p, isos) {
  var a = null;
  isos.forEach(function (iso) {
    var w = p.weeks[iso];
    if (!w) return;
    if (!a) a = { cap: 0, pto: 0, hol: 0, avail: 0, planned: 0, effPlanned: 0,
                  tracked: 0, billable: 0, nonBillable: 0, capEst: false,
                  availCov: 0, capCov: 0, trackedCov: 0, nsBillRaw: 0, nsNonBillRaw: 0,
                  covWeeks: 0, nWeeks: 0 };
    a.cap += w.cap; a.pto += w.pto; a.hol += w.hol; a.avail += w.avail;
    a.planned += w.planned;
    // Planning pairs with ACTUAL capacity (user feedback 2026-07-31): the cap
    // is net availability — PTO/holidays kill capacity, so a fully-planned
    // week with 8h PTO can only honestly plan 32h.
    a.effPlanned += w.cap > 0 ? Math.min(w.planned, w.avail) : w.planned;
    a.tracked += w.tracked; a.billable += w.billable; a.nonBillable += w.nonBillable;
    a.capEst = a.capEst || w.capEst;
    // NS-coverage companions: billable rates divide by availCov (classified weeks
    // only), so a period spanning covered and uncovered weeks reports the rate of
    // the part NS actually classified instead of diluting it with forced zeros.
    a.availCov += w.availCov || 0; a.trackedCov += w.trackedCov || 0;
    a.capCov += w.capCov || 0;
    a.nsBillRaw += w.nsBillRaw || 0; a.nsNonBillRaw += w.nsNonBillRaw || 0;
    a.nWeeks++; if (w.nsCov) a.covWeeks++;
  });
  return a;
}

/** Unclassified tracked hours in an aggregated cell — logged in Tempo but with
    no NS billable/non-billable signal, so they belong to neither bucket. */
function unclassifiedH_(w) {
  return w ? Math.max(0, (w.tracked || 0) - (w.trackedCov || 0)) : 0;
}

/** Raw NetSuite hours behind a cell (billable + non-billable, as exported).
    Diagnostic only — never a rate numerator; the rates use the ratio split. */
function nsRawTot_(w) {
  return w ? (w.nsBillRaw || 0) + (w.nsNonBillRaw || 0) : 0;
}

/** The NS billable share driving a cell's split (0–1), or 0 with no NS signal. */
function nsShare_(w) {
  var t = nsRawTot_(w);
  return t > 0 ? (w.nsBillRaw || 0) / t : 0;
}

/**
 * Renders only the pane that is on screen. Every view reads the same STATE, so
 * a filter change is a single re-render of the active pane rather than four
 * hidden ones — and the pane can never show a window that no longer matches the
 * header controls (the bug the old always-render-everything code had).
 */
function renderAll_() {
  renderScope_();
  renderFilterWarn_();
  switch (STATE.view) {
    case "exec":    renderTiles_(); renderCompare_(); break;
    case "trend":   renderOpportunity_(); break;
    case "people":  syncExpandAllBtn_(); renderGrid_(); break;
    case "hygiene": renderHygiene_(); break;
    case "access":  renderAccess_(); break;
  }
}

/** Live scope chip: states exactly what slice is on screen — replaces the old

function renderScope_() {
  var parts = [POP_LABELS[STATE.pop], FOCUS_LABELS[STATE.focus],
    STATE.region || "All regions", STATE.team || "All teams"];
  if (STATE.pm) parts.push("PM: " + STATE.pm);

  if (STATE.search) parts.push("“" + STATE.search + "”");
  document.getElementById("scopeChip").textContent =
    "Showing: " + parts.join(" · ") + " — " + filteredPeople_().length + " people";
}

function ragClass_(pct) {
  if (pct === null || pct === undefined) return "";
  var t = MODEL.meta.thresholds;
  return pct >= t.green ? "g" : (pct >= t.amber ? "a" : "r");
}

/** Utilization rollup over a period's weeks (mirrors server utilRollup_).
    Scopes on passesFilters_ — ALL filters are universal (user decision
    2026-07-31, superseded the finding-I2 grid-finder rule): a job-family or
    person selection re-bases the utilization tile too. The payload is already
    tracking-mandated families only. */
function utilFor_(isos) {
  var s = { avail: 0, availCov: 0, billable: 0, tracked: 0, trackedCov: 0, cap: 0, capCov: 0, ooo: 0 };
  MODEL.people.forEach(function (p) {
    // Long leave (maternity/paternity/parental/sabbatical) never moves the
    // rate: Tempo capacity can lag HR, so their avail would read as idle time.
    if (p.onLeave) return;
    if (!passesFilters_(p)) return;
    isos.forEach(function (iso) {
      var w = p.weeks[iso];
      if (!w) return;
      s.avail += w.avail; s.billable += w.billable; s.tracked += w.tracked;
      // availCov = availability of NS-CLASSIFIED person-weeks only. Billable %
      // divides by this, never by total avail: an unclassified week has a
      // forced-zero numerator, so leaving its avail in the denominator would
      // report the NS export's lag as a drop in billing (audit 2026-08-03).
      s.availCov += w.availCov || 0; s.trackedCov += w.trackedCov || 0;
      // capCov = GROSS scheduled capacity of NS-classified weeks — the Metrics
      // Dictionary's "headcount × standard hours" denominator, coverage-matched
      // the same way availCov is.
      s.capCov += w.capCov || 0;
      // cap/ooo aren't in the rate — they let the tile SAY how much the
      // denominator shrank, so a high % for a part-absent team is readable.
      s.cap += w.cap; s.ooo += w.pto + w.hol;
    });
  });
  // THREE readings of the same numerator, each answering a different question.
  //   grossPct    — ÷ scheduled capacity. The Dictionary's rate: "of the
  //                 capacity we PAY FOR, how much did we bill?" Absence is a
  //                 cost, so it stays in the denominator. THIS IS THE HEADLINE.
  //   billablePct — ÷ net available. "Of the capacity the team actually HAD,
  //                 how much did they bill?" The fair operational read.
  //   trackedPct  — ÷ net available, tracked hours. Used when NetSuite is
  //                 classifying nothing and no billable claim can be made.
  // Publishing gross alone would read as a team failing; publishing net alone
  // hides the cost of absence from the people who pay for it. Both ship.
  s.grossPct = s.capCov > 0 ? s.billable / s.capCov * 100 : null;
  s.billablePct = s.availCov > 0 ? s.billable / s.availCov * 100 : null;
  s.trackedPct = s.avail > 0 ? s.tracked / s.avail * 100 : null;
  s.grossTrackedPct = s.cap > 0 ? s.tracked / s.cap * 100 : null;
  return s;
}

/**
 * Filter-scoped sums over the person-attributed Jira buckets. Buckets carry
 * the roster person (Assignee join), so EVERY filter — population, role,
 * region, team, PM, family, search — drives On-Time and Forecast exactly like
 * Billable Utilization (user decision 2026-07-31). Buckets whose person fell
 * out of the roster (stale cache, renamed) are skipped.
 */
function bucketsFor_(buckets, isos) {
  if (!MODEL._pByName) {
    MODEL._pByName = {};
    MODEL.people.forEach(function (p) { MODEL._pByName[p.name] = p; });
  }
  var out = { n: 0, onTime: 0, nWithin: 0, nAll: 0, nNoTime: 0,
              nMissOver: 0, nMissUnder: 0, absVars: [],
              // Quality / Rework counters (schema v10). Absent on the other
              // bucket kinds, so they simply stay zero there.
              nDelivered: 0, nRework: 0, nLinked: 0, nReopened: 0, nReopenCov: 0 };
  buckets.forEach(function (b) {
    if (isos.indexOf(b.iso) === -1) return;
    var person = b.person ? MODEL._pByName[b.person] : null;
    if (!person || !passesFilters_(person)) return;
    out.n += b.n; out.onTime += (b.onTime || 0);
    out.nAll += (b.nAll || b.n || 0); // stale cache pre-nAll: coverage = n
    // Forecast-only fields (schema v8) — absent on an older bucket, so default
    // to 0/[]: the variance line just won't render rather than reading NaN.
    out.nNoTime += (b.nNoTime || 0);
    out.nWithin += (b.nWithin || 0);
    out.nMissOver += (b.nMissOver || 0); out.nMissUnder += (b.nMissUnder || 0);
    out.nDelivered += (b.nDelivered || 0); out.nRework += (b.nRework || 0);
    out.nLinked += (b.nLinked || 0); out.nReopened += (b.nReopened || 0);
    out.nReopenCov += (b.nReopenCov || 0);
    // Median is not additive — the per-epic variances have to travel and be
    // re-medianed over whatever this filter selected.
    if (b.absVars && b.absVars.length) out.absVars = out.absVars.concat(b.absVars);
  });
  return out;
}

/**
 * Forecast Accuracy, the Metrics Dictionary formula:
 *   mean of (1 − |Actual − Estimate| / Estimate) across engagements closed in
 *   the period, as a percentage.
 *
 * Computed from the per-epic absolute relative deviations the payload already
 * carries for the median, so the headline, the band and the median all come
 * from ONE array and cannot disagree.
 *
 * FLOORED AT ZERO per epic. The raw expression goes negative past a 2× over-run
 * (1 − 2.0 = −100%), and a "share of accuracy" below zero is not a quantity
 * anyone can act on — worse, a single runaway engagement would drag the mean
 * of a good period below zero. The floor is applied BEFORE averaging, which is
 * the difference between "this epic was completely wrong" and "this epic
 * cancels out three good ones".
 *
 * @param {number[]} absVars  |actual − estimate| ÷ estimate, one per measurable epic
 * @returns {?number} 0–100, or null when nothing was measurable
 */
function forecastAccuracyPct_(absVars) {
  if (!absVars || !absVars.length) return null;
  var sum = 0;
  for (var i = 0; i < absVars.length; i++) sum += Math.max(0, 1 - absVars[i]);
  return sum / absVars.length * 100;
}

/** Median of a numeric array; null when empty. Mirrors medianOf_ in Code.js. */
function medianOf_(vals) {
  if (!vals || !vals.length) return null;
  var s = vals.slice().sort(function (a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// ── STANDARD RATE — the level we actually run at ─────────────
//
// A target says what someone decided; a standard rate says what the
// organisation has demonstrably done, period after period. Both are needed, and
// they answer different questions: "are we hitting the plan?" versus "is this
// week different from how we normally operate?". A month at 64% against a 70%
// target is a miss; the same month against an observed norm of 63% is a
// completely ordinary month, and the two conversations should not be confused.
//
// Robust by construction. The baseline is a MEDIAN and the band is derived from
// the median absolute deviation, not a mean and a standard deviation, so one
// broken export week or one holiday-shortened month cannot move the norm it is
// being judged against. 1.4826 is the constant that makes MAD estimate σ for
// normally distributed data, so the ±1 MAD-σ band is the familiar "about two
// thirds of periods land in here" range.
//
// Deliberately conservative about publishing:
//   · fewer than MIN periods → no rate at all, and the UI says how many more
//     complete periods it needs. An "operating norm" from three points is noise
//     with a decimal point on it.
//   · the band never narrows below ±2 points, so a metric that happens to have
//     been flat for a stretch does not start flagging every 1-point wobble as
//     an exception.
//   · callers must not publish one for a suppressed metric or a stale model —
//     see stdFor_.
var STD_MIN_PERIODS = 5;

/**
 * @param {Array<?number>} vals  metric per period, oldest first; nulls skipped
 * @param {{minN:number, floor:number}=} opts
 * @returns {{ok:boolean, n:number, minN:number, baseline:number, lo:number,
 *            hi:number, sigma:number, last:number, verdict:string, run:number,
 *            slope:number, per:number}}
 */
function standardRate_(vals, opts) {
  opts = opts || {};
  var minN = opts.minN === undefined ? STD_MIN_PERIODS : opts.minN;
  var pts = (vals || []).filter(function (v) {
    return v !== null && v !== undefined && !isNaN(v);
  });
  if (pts.length < minN) return { ok: false, n: pts.length, minN: minN };
  var med = medianOf_(pts);
  var mad = medianOf_(pts.map(function (v) { return Math.abs(v - med); }));
  var sigma = Math.max(mad * 1.4826, opts.floor === undefined ? 2 : opts.floor);
  var lo = Math.max(0, med - sigma), hi = Math.min(100, med + sigma);
  var last = pts[pts.length - 1];
  // Run length: how many of the most recent periods sit on the same side of the
  // baseline. One period outside the band is an event; five consecutive periods
  // on one side of the median is a shift in the operating rate itself, and is
  // the thing worth escalating — the classic control-chart run rule.
  var side = last >= med ? 1 : -1, run = 0;
  for (var i = pts.length - 1; i >= 0; i--) {
    if ((pts[i] >= med ? 1 : -1) !== side) break;
    run++;
  }
  // Least-squares slope in points per period across the whole history.
  var n = pts.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (var j = 0; j < n; j++) { sx += j; sy += pts[j]; sxy += j * pts[j]; sxx += j * j; }
  var den = n * sxx - sx * sx;
  return {
    ok: true, n: n, baseline: med, lo: lo, hi: hi, sigma: sigma, last: last,
    verdict: last > hi ? "above" : (last < lo ? "below" : "normal"),
    run: run, side: side, slope: den ? (n * sxy - sx * sy) / den : 0,
  };
}

/**
 * The standard rate for a published metric, or null when it must not be shown.
 *
 * Three suppressions, all deliberate:
 *   · stale model — every point could predate the last refresh, so the "norm"
 *     would describe a window nobody can date (NFR-7, same rule that kills the
 *     vs-prior delta).
 *   · unpublishable metric — a norm computed from below-gate coverage is the
 *     average of a measurement error (FR-2.2).
 *   · too few complete periods — returned as {ok:false} so the UI can say what
 *     it is waiting for rather than rendering nothing.
 */
function stdFor_(vals, conf) {
  if (MODEL._stale) return null;
  if (conf && conf.publish === false) return null;
  return standardRate_(vals);
}


/**
 * Data-confidence verdict for one metric (FR-2.1/2.2/2.6).
 *
 * ⚠ VERBATIM COPY of metricConfidence_ in Code.js — the client needs it because
 * coverage is filter-dependent (a region slice can be well attributed while the
 * whole population isn't). _test_confidenceParity_ in node-tests.js extracts
 * this copy and diffs it against the server's across a matrix of inputs; if you
 * change one, change both.
 */
function metricConfidence_(gate, coverage, periods) {
  var g = Number(gate) || 0;
  if (coverage === null || coverage === undefined || isNaN(coverage)) {
    return { level: "none", publish: false, coverage: null };
  }
  var c = Math.max(0, Math.min(1, Number(coverage)));
  var p = Number(periods) || 0;
  if (g <= 0) return { level: "high", publish: true, coverage: c };  // ungated
  if (c >= g && p >= 2) return { level: "high", publish: true, coverage: c };
  if (c >= g - 0.10) return { level: "medium", publish: true, coverage: c };
  return { level: "low", publish: false, coverage: c };
}


/** Registry entry for a metric, with an empty-object fallback so a stale cache
    (pre-v8 payload, no meta.registry) degrades to "no gate" instead of throwing. */
function reg_(id) {
  var r = MODEL.meta.registry;
  return (r && r.metrics && r.metrics[id]) || {};
}


// ══════════════════════════════════════════════════════════════════════════
// CHART KIT — inline SVG, no library
//
// Every chart here is written by hand rather than pulled from a CDN. Two
// reasons: an HtmlService web app is a sandboxed iframe on a managed browser,
// so one blocked script request is an executive dashboard with no charts in it;
// and every reference line, direct label and hit target below is bespoke enough
// that a library would be configured into the same shape at twice the weight.
//
// The rules the kit enforces, because the previous sparklines broke all of them
// (user feedback 2026-08-03 — "charts with no labels tell nothing"):
//   · every chart states its own units, its axis, and its period range;
//   · values are labelled SELECTIVELY — endpoint, min and max — never on every
//     point, which is noise;
//   · reference lines (target, operating norm) are drawn AND labelled inline,
//     so a reader never has to remember what 70% was;
//   · nulls break the line instead of being interpolated across — a gap in the
//     data is drawn as a gap;
//   · every chart has a table-view twin, so no value is reachable only by hover;
//   · marks carry colour, text never does.
// ══════════════════════════════════════════════════════════════════════════

/**
 * RAG class for a value against a target, or "" when there is no target.
 *
 * `target.invert` flips the comparison for metrics where LOWER IS BETTER —
 * Rework Rate is the only one today. Without this a 3% rework rate would paint
 * red for being "below target", which is exactly backwards and is the kind of
 * error a reader trusts because the colour looks confident.
 */
function ragOf_(v, target) {
  if (v === null || v === undefined || !target) return "";
  if (target.invert) return v <= target.green ? "g" : (v <= target.amber ? "a" : "r");
  return v >= target.green ? "g" : (v >= target.amber ? "a" : "r");
}
var RAG_FILL = { g: "var(--c-good)", a: "var(--c-warn)", r: "var(--c-bad)", "": "var(--c-series)" };
// Status is never colour alone (FR-4.4) — the glyph survives a monochrome board
// pack, a photocopy and a colour-vision difference.
var RAG_MARK = { g: "✔", a: "▲", r: "✖", "": "•" };

/** A nice y-domain for a percentage series: padded, clamped to 0–100, snapped
    to 10s, and always wide enough to contain its own reference lines. */
function pctDomain_(vals, refs) {
  var all = (vals || []).filter(function (v) { return v !== null && v !== undefined && !isNaN(v); })
    .concat((refs || []).filter(function (v) { return v !== null && v !== undefined; }));
  if (!all.length) return { lo: 0, hi: 100 };
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  lo = Math.max(0, Math.floor((lo - 8) / 10) * 10);
  hi = Math.min(100, Math.ceil((hi + 8) / 10) * 10);
  if (hi - lo < 20) { hi = Math.min(100, lo + 20); lo = Math.max(0, hi - 20); }
  return { lo: lo, hi: hi };
}


/**
 * Signed whole-point delta. A sub-half-point move rounds to zero, and printing
 * that as "−0" reads as a decline that did not happen — so zero is zero, with
 * no sign and no direction colour.
 */
function deltaStr_(d) {
  if (d === null || d === undefined || isNaN(d)) return { txt: "—", cls: "" };
  var r = Math.round(d);
  if (r === 0) return { txt: "0", cls: "" };
  return { txt: (r > 0 ? "+" : "−") + Math.abs(r), cls: r > 0 ? "dUp" : "dDown" };
}


/**
 * Horizontal comparison bars. One row per category, value labelled at the tip
 * with its status glyph, target drawn as a vertical rule. Rows are clickable —
 * clicking a category filters the whole dashboard to it.
 *
 * @param {{rows:Array<{key:string,label:string,value:?number,n:number,sub:string}>,
 *          target:?Object, std:?Object, onclick:string, activeKey:string}} o
 */
function hbarChart_(o) {
  var all = o.rows || [];
  if (!all.length) return '<div class="emptyState">Nothing to compare in this slice.</div>';
  // Row cap (user report 2026-08-03: the PM breakdown rendered 52 bars and the
  // chart ran several screens deep). A comparison with 52 bars is not a
  // comparison, it is a list — nobody reads position 40. Rows arrive sorted
  // worst-first, so the head of the list is the part that carries the decision
  // (P2, management by exception); the tail is available in the Values table
  // and by filtering, and the count of what was cut is stated rather than the
  // chart quietly ending early.
  // Which rows survive the cap is chosen by NEED, not by list position: the ones
  // furthest below target. Taking the first N of a best-first list would have
  // shown the healthiest categories and hidden every problem — the exact
  // opposite of the question this chart exists to answer. Display order is left
  // as it arrives, so the longest bar still sits on top.
  var cap = o.expanded ? Infinity : (o.cap || HBAR_MAX_ROWS_);
  var rows = all, hidden = 0, hiddenNoData = 0;
  if (all.length > cap) {
    var ranked = all.filter(function (r) { return r.value !== null; })
                    .sort(function (a, b) { return a.value - b.value; })
                    .slice(0, cap);
    var keep = {};
    ranked.forEach(function (r) { keep[r.key] = 1; });
    rows = all.filter(function (r) { return keep[r.key]; });
    hidden = all.length - rows.length;
    hiddenNoData = all.filter(function (r) {
      return r.value === null && !keep[r.key];
    }).length;
  }
  var W = 760, RH = 30, TOP = 26, B = 22;
  var H = TOP + rows.length * RH + B;
  var L = 176, R = 62;                          // L = category gutter, R = value labels
  var pw = W - L - R;
  // Percentages run 0–100 always. A bar that does not start at zero is a lie,
  // and a rescaled x-axis would make 62% and 68% look like a chasm.
  function x(v) { return L + Math.max(0, Math.min(100, v)) / 100 * pw; }

  var s = '<svg class="chart hbar" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc_(o.title || "comparison") + '">';
  for (var g = 0; g <= 100; g += 25) {
    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (TOP - 6) +
      '" y2="' + (TOP + rows.length * RH) + '"/>' +
      '<text class="axis" x="' + x(g) + '" y="' + (H - 6) + '" text-anchor="middle">' + g + "%</text>";
  }
  if (o.std && o.std.ok) {
    s += '<rect x="' + x(o.std.lo) + '" y="' + (TOP - 6) + '" width="' +
      Math.max(1, x(o.std.hi) - x(o.std.lo)) + '" height="' + (rows.length * RH + 6) +
      '" fill="var(--c-ref)" opacity="0.10"><title>operating rate ' +
      Math.round(o.std.lo) + "–" + Math.round(o.std.hi) + "% — where this metric normally sits</title></rect>";
  }
  if (o.target) {
    s += '<line x1="' + x(o.target.green) + '" x2="' + x(o.target.green) + '" y1="' + (TOP - 12) +
      '" y2="' + (TOP + rows.length * RH) + '" stroke="var(--c-target)" stroke-width="1"/>' +
      '<text x="' + x(o.target.green) + '" y="' + (TOP - 16) + '" text-anchor="middle" ' +
      'fill="var(--c-target)">target ' + o.target.green + "%</text>";
  }
  rows.forEach(function (r, i) {
    var yTop = TOP + i * RH;
    var bh = 16;                                 // ≤24px: the band's leftover is air
    var by = yTop + (RH - bh) / 2;
    var rag = ragOf_(r.value, o.target);
    var active = o.activeKey && o.activeKey === r.key;
    s += '<g class="clickable"' + (o.onclick ? ' onclick="' + o.onclick + "('" +
      encodeURIComponent(r.key).replace(/'/g, "%27") + "')\"" : "") + ">" +
      "<title>" + esc_(r.label + " — " +
        (r.value === null ? "no measurable data" : Math.round(r.value) + "%") +
        " · " + r.n + (r.n === 1 ? " person" : " people") + (r.sub ? " · " + r.sub : "") +
        (o.onclick ? " · click to filter to " + r.label : "")) + "</title>" +
      '<rect x="0" y="' + yTop + '" width="' + W + '" height="' + RH + '" fill="transparent"/>' +
      '<text class="val" x="0" y="' + (by + 8) + '"' + (active ? ' fill="var(--orbe)"' : "") + ">" +
        esc_(trunc_(r.label, 22)) + "</text>" +
      '<text class="axis" x="' + (L - 8) + '" y="' + (by + 8) + '" text-anchor="end">' +
        r.n + "</text>";
    if (r.value === null) {
      s += '<text class="axis" x="' + (L + 4) + '" y="' + (by + 8) + '">no measurable data</text></g>';
      return;
    }
    // 4px rounded data-end, square at the baseline.
    var bw = Math.max(2, x(r.value) - L);
    s += '<path d="' + roundEndBar_(L, by, bw, bh, 4) + '" class="barfill" fill="' +
        RAG_FILL[rag] + '"/>' +
      '<text class="val" x="' + (L + bw + 7) + '" y="' + (by + 8) + '">' +
        RAG_MARK[rag] + " " + Math.round(r.value) + "%</text></g>";
  });
  s += "</svg>";
  // Say what was cut. A chart that silently stops at 12 of 52 reads as "there
  // are 12" — the same failure as a truncated table with no ellipsis.
  // Say what was cut, and make it reachable. A cap that can't be lifted turns
  // "too long to read" into "the data isn't there", which is a worse problem
  // than the one it solved — the default stays short, the whole list is one
  // click away.
  if (hidden > 0) {
    var ranked = hidden - hiddenNoData;
    s += '<div class="cellSub" style="margin-top:4px">Showing the ' + rows.length +
      " furthest from target · " +
      (ranked > 0 ? ranked + " nearer target" : "") +
      (ranked > 0 && hiddenNoData > 0 ? " and " : "") +
      (hiddenNoData > 0 ? hiddenNoData + " with no measurable data" : "") +
      " not shown. " +
      (o.onExpand
        ? '<button class="btn" onclick="' + o.onExpand + '" title="' +
          esc_("Draw every one of the " + all.length + " categories. The chart gets long — the " +
               "default keeps the ones carrying a decision at the top of the page.") +
          '">Show all ' + all.length + "</button>"
        : "") + "</div>";
  } else if (o.onExpand && o.expanded && all.length > (o.cap || HBAR_MAX_ROWS_)) {
    s += '<div class="cellSub" style="margin-top:4px">All ' + all.length +
      " shown. " + '<button class="btn" onclick="' + o.onExpand +
      '" title="back to the ' + (o.cap || HBAR_MAX_ROWS_) +
      ' furthest from target">Show top ' + (o.cap || HBAR_MAX_ROWS_) + "</button></div>";
  }
  return s;
}

/** Bar path: square at the baseline (left), radius r on the data end (right). */
function roundEndBar_(x, y, w, h, r) {
  r = Math.min(r, w, h / 2);
  return "M" + x + "," + y + "H" + (x + w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
    "V" + (y + h - r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r + "H" + x + "Z";
}

function trunc_(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/**
 * The KPI-tile micro chart, replacing a bare row of unlabelled bars.
 *
 * Same information density as before plus the three things that were missing:
 * which periods it spans, what the last value was, and where the operating norm
 * sits. Still small enough to live under a hero number.
 */
function sparkHtml_(vals, opts) {
  opts = opts || {};
  var labels = opts.labels || [];
  var W = 240, H = 54, L = 2, R = 30, T = 12, B = 13;
  var pw = W - L - R, ph = H - T - B;
  var std = opts.std && opts.std.ok ? opts.std : null;
  var dom = pctDomain_(vals, std ? [std.lo, std.hi] : []);
  var span = dom.hi - dom.lo || 1;
  function y(v) { return T + ph - (v - dom.lo) / span * ph; }
  function x(i) { return vals.length === 1 ? L + pw / 2 : L + (i / (vals.length - 1)) * pw; }
  var s = '<svg class="chart" style="max-width:240px" viewBox="0 0 ' + W + " " + H + '">';
  if (std) {
    s += '<rect x="' + L + '" y="' + y(std.hi) + '" width="' + pw + '" height="' +
      Math.max(1, y(std.lo) - y(std.hi)) + '" fill="var(--c-ref)" opacity="0.13"><title>' +
      "operating rate " + Math.round(std.lo) + "–" + Math.round(std.hi) +
      "% — where this metric normally sits</title></rect>";
  }
  var run = [], last = null, lastI = -1;
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) {
      if (run.length > 1) s += '<polyline points="' + run.join(" ") +
        '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"/>';
      run = [];
      return;
    }
    run.push(x(i) + "," + y(v));
    last = v; lastI = i;
  });
  if (run.length > 1) s += '<polyline points="' + run.join(" ") +
    '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"/>';
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) return;
    s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === lastI ? 3.6 : 2.2) +
      '" fill="var(--c-series)" stroke="var(--plot)" stroke-width="1.6"><title>' +
