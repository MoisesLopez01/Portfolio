      (target ? " · <b class=\"" + (below ? "vr" : "vg") + '">' + below + "</b> below the ≥" +
        target.green + "% target" : "") +
      (std && std.ok ? " · <b>" + rows.filter(function (r) {
        return r.value !== null && r.value < std.lo;
      }).length + "</b> below the normal operating range" : "") +
      (rows.length > withVal.length ? " · " + (rows.length - withVal.length) +
        " with no measurable data" : "") +
      // Say it even when it's complete. "Every person is in a bar" is exactly the
      // reassurance an executive needs before acting on a comparison, and the
      // day it stops being true the sentence changes by itself.
      ' · <span title="Distinct people represented by the bars above, against everyone the current filters select. Team and PM membership overlaps, so the per-bar counts add up past the headcount — this figure counts each person once.">' +
      (shown >= inScope
        ? "<b>all " + inScope + "</b> people represented"
        : '<b class="vr">' + shown + " of " + inScope + "</b> people represented — " +
          (inScope - shown) + " missing") + "</span>";

  panel.innerHTML =
    '<div class="chartHead"><h3>' + esc_(m.label()) + " by " +
      esc_(COMPARE_LABELS[STATE.compare]) + "</h3>" +
      '<span class="sub">' + esc_(head.label) + " · last complete " + unit + "</span>" +
      '<span style="flex:1"></span><span class="chips seg">' + chips + "</span></div>" +
    '<div class="chartHead" style="margin-bottom:6px"><span class="sub">Metric</span>' +
      '<span class="chips seg">' + mchips + "</span>" +
      '<span class="sub" title="' + esc_(reg_(m.id).formula || "") + '">' +
      esc_(m.axis()) + " ⓘ</span></div>" +
    '<div class="verdict">' + verdict + "</div>" +
    hbarChart_({ rows: rows, target: target, std: std, title: m.label(),
                 expanded: !!STATE.compareAll, onExpand: "toggleCompareAll_()" }) +
    '<div class="cellSub" style="margin-top:6px">' +
      "The number left of each bar is its headcount. " +
      (overlaps
        ? "Membership overlaps, so the bars sum to more than the headcount — " +
          "someone on two teams appears in both. "
        : "") +
      (untaggedRow
        ? '<b>' + esc_(untaggedRow.label) + "</b> is not a " +
          cmpNoun_(STATE.compare, 1) + " — it is the " + untaggedRow.n +
          " people carrying no " + cmpNoun_(STATE.compare, 1) +
          " at all. They are shown rather than dropped, because a breakdown that " +
          "quietly omits them describes a smaller org than the one you have. " +
          "Closing that tag gap is a Data Hygiene item. "
        : "") +
      "The shaded band is the operating range, the vertical rule is the target.</div>";
}

/** 👥 pulse — counts only, never names (standing rule: names live behind the
    Actions gate). Hidden, not dimmed, without margin tier — same doctrine as
    the Utilization card. */
function renderPulse_() {
  var el = document.getElementById("pulsePanel");
  if (!canSeeMargin_()) { el.innerHTML = ""; el.style.display = "none"; return; }
  el.style.display = "";
  var done = donePeriods_(), hi = headPeriodIdx_(done);
  var head = done[hi] || { label: "—", isos: [] };
  var s = signalSummary_(head.isos);
  if (!s.available) { el.innerHTML = '<div class="cellSub">People signals arrive after the next refresh (new payload).</div>'; return; }
  // Recoverable hours: the SAME number the headroom table headlines.
  var ser = metricSeries_(METRICS_.util, done);
  var norm = ser.std && ser.std.ok ? ser.std.baseline : null;
  var opp = 0;
  if (norm !== null) oppRows_(head, [head], norm).forEach(function (r) {
    if (!r.ramping && r.opp > 0.5) opp += r.opp;
  });
  el.innerHTML =
    '<h3>👥 People signals ' + scopeTag_(STATE.typePop === "resolved" ? "period" : "snap") + "</h3>" +
    '<div class="pulseRow" onclick="openRoster_()" style="cursor:pointer" title="Open the full roster on the Actions tab, sorted by biggest opportunity">' +
    '<span class="sigDot sigGood">●</span> ' + s.good + " on track · " +
    '<span class="sigDot sigWarn">●</span> ' + s.warn + " watch · " +
    '<span class="sigDot sigBad">●</span> ' + s.bad + " need action" +
    (s.small ? ' · <span class="sigDot sigSmall" title="Have issues but fewer than ' + signalMinN_() +
      ' — ungraded, never counted red.">●</span> ' + s.small + " ungraded (small n)" : "") +
    (norm !== null ? " · <b>" + Math.round(opp) + "h</b> recoverable" : "") +
    " → open the roster</div>";
}

function openRoster_() {
  STATE.rosterSort = "opp"; STATE.rosterDesc = false;
  switchView_("actions");
}

/**
 * A metric restricted to a named set of people.
 *
 * ⚠ THIS FUNCTION MUST NEVER CONTAIN A FORMULA. It used to, and every one of
 * them had drifted from the METRICS_ accessor it was shadowing:
 *   · quality fell through to forecastBuckets and published forecast-band
 *     numbers under a Quality/Rework label;
 *   · forecast returned nWithin/n (the ±10% band) while the card showed the
 *     Dictionary mean;
 *   · util divided by availCov (net) while the card divided by capCov (gross).
 * So a Region bar and the tile directly above it disagreed on three of four
 * metrics, each pair internally consistent and mutually contradictory.
 *
 * The fix is structural, not three patches: scope the POPULATION, then call the
 * one accessor. `SCOPE_NAMES_` is read by passesFilters_, which is what both
 * utilFor_ and bucketsFor_ already run every person through — so every metric,
 * including any added later, is scoped by construction and can only ever have
 * one definition.
 */
function scopedMetric_(m, isos, nameSet) {
  SCOPE_NAMES_ = nameSet;
  try {
    return m.value(isos);
  } finally {
    // finally, not a trailing assignment: an exception inside an accessor would
    // otherwise leave the whole dashboard scoped to one bar's population.
    SCOPE_NAMES_ = null;
  }
}

/**
 * Triage flags for one person (director feedback: the grid is a roster, the
 * manager's question is "who needs me this week"). Each flag states the
 * IMPLICATION, not just the number. New hires skip zero-tracked (ramping).
 */
function personExceptions_(p) {
  // On leave = no availability expected: zero-tracked / under-planned /
  // overloaded flags would all misread the absence as a delivery problem.
  if (p.onLeave) return [];
  // Interns carry no triage flags — "zero-tracked" or "under-planned" on
  // someone who is here to learn reads as a performance verdict it isn't.
  if (p.isIntern) return [];
  var ex = [];
  var hi = MODEL.meta.headlineIso;
  var w = p.weeks[hi];
  var futureAvail = 0, futurePlanned = 0;
  MODEL.meta.gridWeeks.forEach(function (g) {
    if (g.status !== "plan") return;
    var fw = p.weeks[g.iso];
    if (!fw) return;
    futureAvail += fw.avail;
    futurePlanned += fw.cap > 0 ? Math.min(fw.planned, fw.avail) : fw.planned;
  });
  var backlogOver = MODEL.meta.jiraAvailable && p.backlog &&
    (futureAvail - p.backlog.remHrs) < 0;
  if ((w && w.cap > 0 && w.tracked > w.cap) || backlogOver) {
    ex.push({ sev: 3, icon: "⚠", label: "overloaded",
      why: backlogOver
        ? "backlog ~" + r1_(p.backlog.remHrs) + "h vs " + r1_(futureAvail) +
          "h available over the next weeks — needs offloading or re-planning"
        : "tracked " + r1_(w.tracked) + "h against " + r1_(w.cap) + "h capacity in " +
          hi + " — real overtime" });
  }
  if (futureAvail > 0 && futurePlanned < futureAvail * 0.5) {
    ex.push({ sev: 2, icon: "▽", label: "under-planned",
      why: "only " + r1_(futurePlanned) + "h planned of " + r1_(futureAvail) +
        "h available over the next weeks — coverage cliff, needs planning" });
  }
  if (w && w.avail > 0 && w.tracked === 0 && !p.newHire) {
    ex.push({ sev: 1, icon: "○", label: "zero tracked",
      why: "no time tracked in " + hi + " with " + r1_(w.avail) +
        "h available — worth a check-in" });
  }
  return ex;
}

// ── TRIAGE FLAGS AS A FILTER ─────────────────────────────────
//
// The attention line ("18 of 64 people need attention — ⚠ 4 overloaded · …")
// used to be a read-only caption. Every one of those counts is a question a
// manager wants to act on, so each is now a filter: click "4 overloaded" and the
// whole dashboard — cards, charts and grid — narrows to those four. Clicking it
// again clears it. This is the legend-as-control rule the user asked for: if a
// label states a count, clicking it should show you that count.

var FLAG_LABELS = {
  over:  { icon: "⚠", label: "overloaded",    sev: 3, key: "overloaded" },
  under: { icon: "▽", label: "under-planned", sev: 2, key: "under-planned" },
  zero:  { icon: "○", label: "zero tracked",  sev: 1, key: "zero tracked" },
};

/**
 * personExceptions_ walks the forward grid weeks for every person, and
 * passesFilters_ can be called once per person PER PERIOD inside utilFor_ — so
 * an unmemoized call turns one render into tens of thousands of week loops.
 * Flags depend only on the payload, never on the filters, so one cache per load
 * is correct. Cleared in loadData.
 */
function exceptionsOf_(p) {
  if (!MODEL._exCache) MODEL._exCache = {};
  if (!MODEL._exCache[p.name]) MODEL._exCache[p.name] = personExceptions_(p);
  return MODEL._exCache[p.name];
}

function hasFlag_(p, flag) {
  var want = FLAG_LABELS[flag];
  if (!want) return true;
  return exceptionsOf_(p).some(function (x) { return x.label === want.key; });
}

/** Toggle a triage flag filter (clicking the active one clears it). */
function toggleFlag_(flag) {
  STATE.flag = STATE.flag === flag ? "" : flag;
  buildFilters_();   // the audience changed, so every other option list re-cascades
  renderAll_();
}

function r1_(v) { return Math.round((Number(v) || 0) * 10) / 10; }

// ══════════════════════════════════════════════════════════════════════════
// TRENDS VIEW — the history, and the people inside it
//
// Two halves, in the order the questions get asked:
//   1. Is this metric moving, and how does the latest period compare with the
//      rate we actually run at? (chart + operating band + values table)
//   2. Where is the headroom? (one row per person, ranked by the hours that
//      separate them from that operating rate)
//
// The second half is the part a manager can act on, so it is a table of named
// people — but the chart's verdict above it stays counts-only, because a
// judgement rendered inside a chart is read as a verdict on the individual
// rather than a starting point for a conversation.
// ══════════════════════════════════════════════════════════════════════════

function setMetric_(id) {
  STATE.metric = id;
  renderAll_();      // the comparison chart follows the same metric
}



// ── OPPORTUNITY TABLE ────────────────────────────────────────
//
// "Areas of opportunity" made arithmetic. For each person, the gap between the
// rate they ran at last period and the rate the filtered cohort normally runs
// at, converted to HOURS — because a percentage point is not something anyone
// can reassign, and hours are.
//
//   opportunity = max(0, norm% × their available hours − their delivered hours)
//
// Only ever a positive number: someone above the norm has no "negative
// opportunity", they are carrying the norm. Excluded from the ranking, and from
// the headline total, are the cases where a gap is not an opportunity at all:
//   · people on long leave (no availability is expected)
//   · periods before someone's hire date (they did not exist yet)
//   · new hires inside the ramp window — flagged, and kept OUT of the total,
//     because "ramping" is the explanation and the total is a call to act
//   · anyone with no scheduled capacity in the period
// Whichever denominator the metric uses is the one used here, so the column can
// be reconciled against the KPI card rather than being a second opinion.

var OPP_COLS = {
  name:  { label: "Person",      sort: function (a, b) { return a.name.localeCompare(b.name); } },
  rate:  { label: "Their rate",  sort: function (a, b) { return (b.rate === null ? -1 : b.rate) - (a.rate === null ? -1 : a.rate); } },
  gap:   { label: "vs norm",     sort: function (a, b) { return (a.gap === null ? 1e9 : a.gap) - (b.gap === null ? 1e9 : b.gap); } },
  opp:   { label: "Opportunity", sort: function (a, b) { return b.opp - a.opp; } },
};

function setOppSort_(col) {
  if (STATE.oppSort === col) STATE.oppDesc = !STATE.oppDesc;
  else { STATE.oppSort = col; STATE.oppDesc = true; }
  renderOpportunity_();
}

/**
 * Per-person rate + headroom for the last complete period, plus their own
 * six-period sparkline. Utilization only: On-Time and Forecast are attributed
 * per issue, and an individual's on-time rate over three closed stories is not
 * a number anybody should act on.
 */
function oppRows_(head, trendPer, norm) {
  var live = nsLive_();
  return filteredPeople_().map(function (p) {
    if (p.onLeave) return null;
    // No headroom row for an intern — ranking them by "hours that could be
    // recovered" is exactly the punishment this flag exists to prevent.
    if (p.isIntern) return null;
    var w = aggWeeks_(p, head.isos);
    if (!w) return null;                       // pre-hire: the period predates them
    var den = live ? (w.availCov || 0) : w.avail;
    if (den <= 0) return null;                 // no capacity, or nothing NS classified
    var num = live ? w.billable : w.tracked;
    var rate = num / den * 100;
    var gap = norm === null ? null : rate - norm;
    // Hours, not points: the unit a manager can actually move.
    var opp = norm === null ? 0 : Math.max(0, den * (norm / 100) - num);
    var spark = trendPer.map(function (pr) {
      var aw = aggWeeks_(p, pr.isos);
      if (!aw) return null;
      var d = live ? (aw.availCov || 0) : aw.avail;
      return d > 0 ? (live ? aw.billable : aw.tracked) / d * 100 : null;
    });
    return { name: p.name, region: p.region, teams: p.teams, rate: rate, gap: gap,
             opp: opp, den: den, num: num, spark: spark, p: p,
             ramping: p.newHire === true, flags: exceptionsOf_(p) };
  }).filter(Boolean);
}

function renderOpportunity_() {
  var panel = document.getElementById("oppPanel");
  if (!panel) return;
  var done = donePeriods_();
  var hi = headPeriodIdx_(done);
  var head = done.length ? done[hi] : null;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var live = nsLive_();
  var m = METRICS_.util;
  if (!head) {
    panel.innerHTML = '<div class="emptyState">No complete ' + unit +
      " in the window yet — nothing to rank.</div>";
    return;
  }
  var ser = metricSeries_(m, done);
  // The reference is the COHORT's operating rate under the active filters: an
  // AMER consultant is compared with how AMER consultants normally run, not with
  // a company-wide figure that no one in the slice has ever hit.
  var norm = ser.std && ser.std.ok ? ser.std.baseline : null;
  var trendPer = done.slice(Math.max(0, hi - 5), hi + 1);
  var rows = oppRows_(head, trendPer, norm);

  if (!rows.length) {
    panel.innerHTML = '<div class="oppHead"><h3>Where the headroom is</h3></div>' +
      '<div class="emptyState">Nobody in this slice has measurable ' +
      (live ? "billable" : "tracked") + " availability in " + esc_(head.label) +
      ".</div>";
    return;
  }

  // Ramping new hires are shown but never counted: a total that a manager is
  // meant to act on must not be inflated by people who are ramping by design.
  var actionable = rows.filter(function (r) { return !r.ramping && r.opp > 0.5; });
  var totalOpp = actionable.reduce(function (s, r) { return s + r.opp; }, 0);
  var rampN = rows.filter(function (r) { return r.ramping && r.opp > 0.5; }).length;

  var col = OPP_COLS[STATE.oppSort] || OPP_COLS.opp;
  rows.sort(col.sort);
  if (!STATE.oppDesc) rows.reverse();
  var maxOpp = Math.max.apply(null, rows.map(function (r) { return r.opp; }).concat([1]));

  var headline = norm === null
    ? '<div class="norm">No operating rate yet (' + ser.points.filter(function (p) {
        return p.value !== null; }).length + " of " + STD_MIN_PERIODS +
      " complete " + unit + "s) — the table below ranks by rate only, with no headroom figure. " +
      "Ranking against a norm built on three points would invent the very benchmark it claims to measure.</div>"
    : '<div class="oppHead"><span class="big">' + Math.round(totalOpp) + "h</span>" +
      '<span class="sub">recoverable in ' + esc_(head.label) + " across <b>" +
      actionable.length + "</b> of " + rows.length + " people, measured against the " +
      Math.round(norm) + "% operating rate" +
      (rampN ? " · " + rampN + " ramping new hire" + (rampN === 1 ? "" : "s") +
        " excluded from the total" : "") + "</span></div>" +
      '<div class="norm">Opportunity = ' + Math.round(norm) + "% × their available hours − their " +
      (live ? "billable" : "tracked") + " hours, floored at zero. It is the hours that would " +
      "close the gap to how this cohort normally runs — not a target, and not a performance " +
      "rating. Change any filter and the norm re-bases on that cohort.</div>";

  function th(key, title) {
    return '<th class="' + (STATE.oppSort === key ? "sorted" : "") +
      '" onclick="setOppSort_(\'' + key + '\')" title="' + esc_(title) +
      ' — click to sort">' + OPP_COLS[key].label + (STATE.oppSort === key ? (STATE.oppDesc ? " ▾" : " ▴") : "") + "</th>";
  }

  var body = rows.map(function (r) {
    var rag = r.gap === null ? "" : (r.gap >= 0 ? "g" : (r.gap > -10 ? "a" : "r"));
    var flagIcons = r.flags.map(function (x) {
      return ' <span class="exBadge" title="' + esc_(x.label + " — " + x.why) + '">' + x.icon + "</span>";
    }).join("");
    return "<tr><td class=\"who\">" + esc_(r.name) +
      (r.ramping ? ' <span title="new hire, ramping — shown for context but excluded from the recoverable total">🌱</span>' : "") +
      (r.p.isManager ? ' <span title="Manager — plans without tracking much is normal here; use the Role lens">👔</span>' : "") +
      flagIcons +
      (r.p.jobTitle ? '<div class="cellSub" title="' + esc_(r.p.jobTitle) + '">' +
        esc_(trunc_(jobTitleDisp_(r.p.jobTitle), 26)) + "</div>" : "") + "</td>" +
      '<td class="where">' + esc_(r.region) +
        (r.teams && r.teams.length ? " · " + esc_(trunc_(r.teams.join(", "), 26)) : "") + "</td>" +
      "<td>" + Math.round(r.rate) + '%<span class="cellSub"> of ' + r1_(r.den) + "h</span></td>" +
      '<td class="gap ' + rag + '">' + (r.gap === null ? "—" :
        (r.gap >= 0 ? "+" : "−") + Math.abs(Math.round(r.gap))) + "</td>" +
      "<td>" + (r.opp > 0.5
        ? '<span class="oppbar" style="width:' + Math.max(2, Math.round(r.opp / maxOpp * 54)) +
          'px"></span>' + Math.round(r.opp) + "h"
        : '<span class="cellSub">—</span>') + "</td>" +
      '<td style="width:170px">' +
        sparkHtml_(r.spark, { labels: trendPer.map(function (p) { return p.label; }), bare: true }) +
        "</td></tr>";
  }).join("");

  panel.innerHTML =
    '<div class="chartHead"><h3>Where the headroom is</h3>' +
      '<span class="sub">' + esc_(m.label()) + " · " + esc_(head.label) +
      " · one row per person</span><span style=\"flex:1\"></span>" +
      // NO metric chips here. They were moved onto this tab when the history
      // chart was removed, but renderOpportunity_ computes recoverable HOURS,
      // which only exist for utilization — so picking "On-Time Delivery" changed
      // the chip and nothing else. A control that visibly does nothing costs
      // more trust than the flexibility it pretends to offer. The heading below
      // names the metric instead.
      '<button class="iconbtn" onclick="saveOppCsv_()" title="Download this table as CSV">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>' +
      "</div>" +
    headline +
    '<div class="gwrap"><table class="opp"><tr>' +
      th("name", "Name. Ramping new hires are marked and excluded from the total") +
      "<th>Where</th>" +
      th("rate", (live ? "Billable" : "Tracked") + " hours ÷ their available hours in " + head.label) +
      th("gap", "Percentage points between their rate and the " +
         (norm === null ? "cohort norm (not established yet)" : Math.round(norm) + "% cohort operating rate")) +
      th("opp", "Hours that would close their gap to the cohort operating rate") +
      // The header carries the span for every row, because the in-cell chart is
      // too small to label its own axis legibly.
      '<th style="text-align:left" title="Their own rate over the last ' + trendPer.length +
        " complete " + unit + "s — hover any point for its period and value\">" +
        (trendPer.length
          ? esc_(trendPer[0].label) + " → " + esc_(trendPer[trendPer.length - 1].label)
          : "Trend") + "</th></tr>" +
      body + "</table></div>" +
    // Gap-colour key (user request 2026-08-04). Only when a norm exists —
    // without one the Gap column prints "—" and there is nothing to explain.
    (norm !== null
      ? '<div class="cellSub" style="margin-top:8px">Gap colour: ' +
        keySwatch_("var(--pos)", "green = at or above the " + Math.round(norm) + "% cohort operating rate") + " · " +
        keySwatch_("var(--amber)", "amber = under 10 pts below it") + " · " +
        keySwatch_("var(--warn)", "red = 10+ pts below") + "</div>"
      : "") +
    '<div class="cellSub" style="margin-top:8px">People on long leave (roster Employee ' +
      "Status) and periods before someone's hire date are absent from this table by " +
      "construction — neither is headroom. Open the 👥 People tab for the full " +
      "roster with per-period drill-downs.</div>";
}

/** CSV of the opportunity table as it stands, sort and filters included. */
function saveOppCsv_() {
  var done = donePeriods_();
  var hi = headPeriodIdx_(done);
  var head = done.length ? done[hi] : null;
  if (!head) return;
  var live = nsLive_();
  var ser = metricSeries_(METRICS_.util, done);
  var norm = ser.std && ser.std.ok ? ser.std.baseline : null;
  var rows = oppRows_(head, done.slice(Math.max(0, hi - 5), hi + 1), norm);
  var col = OPP_COLS[STATE.oppSort] || OPP_COLS.opp;
  rows.sort(col.sort);
  if (!STATE.oppDesc) rows.reverse();
  var out = [["Person", "Job title", "Region", "Teams", "Ramping", "Period",
              (live ? "Billable" : "Tracked") + " h", "Available h", "Their rate %",
              "Cohort operating rate %", "Gap pts", "Opportunity h", "Flags"]];
  rows.forEach(function (r) {
    out.push([r.name, r.p.jobTitle || "", r.region, (r.teams || []).join(" | "), r.ramping ? "yes" : "",
      head.label, r1_(r.num), r1_(r.den), Math.round(r.rate),
      norm === null ? "" : Math.round(norm),
      r.gap === null ? "" : Math.round(r.gap), r1_(r.opp),
      r.flags.map(function (x) { return x.label; }).join(" | ")]);
  });
  var csv = out.map(function (r) { return r.map(csvCell_).join(","); }).join("\r\n");
  downloadCsv_(csv, "delivery-health-opportunity-" + pngPeriodStamp_() + ".csv");
}

// ── 👥 SIGNALS ROSTER RENDER (spec §5.2, 2026-08-05) ─────────────────────────
// Default sort: biggest opportunity first — most-red overall, then most
// offending records. The Executive pulse deep-links here with this sort.
var ROSTER_RANK_ = { bad: 0, warn: 1, small: 2, good: 3, na: 4 };
/** The Hours column's sorter has no other way to know which period the roster
    is showing — renderRoster_ refreshes this to head.isos before every sort
    (Task 6, 2026-08-05). */
var ROSTER_ISOS_ = null;
var ROSTER_COLS_ = {
  person: { label: "Person", sort: function (a, b) { return a.p.name.localeCompare(b.p.name); } },
  n:      { label: "n",      sort: function (a, b) { return b.n - a.n; } },
  due:    { label: "Due date", sig: "due" },
  est:    { label: "Estimate", sig: "est" },
  logged: { label: "Logged",   sig: "logged" },
  // Hours: billable share, most first. Ramping new hires and on-leave people
  // (same exclusion as the headroom table) sort last regardless of direction —
  // their idle capacity is not a recoverable signal to rank on.
  hours:  { label: "Hours",  sort: function (a, b) {
    function share(r) {
      if (r.p.newHire === true || r.p.onLeave === true) return null;   // ineligible → last
      var w = aggWeeks_(r.p, ROSTER_ISOS_);
      return w && w.tracked > 0 ? w.billable / w.tracked : null;
    }
    var sa = share(a), sb = share(b);
    return (sb === null ? -1 : sb) - (sa === null ? -1 : sa);
  } },
  opp:    { label: "Overall", sort: function (a, b) {
    return (ROSTER_RANK_[a.overall] - ROSTER_RANK_[b.overall]) || (b.miss - a.miss);
  } },
};
// Signal columns share one sorter: worst grade first, most missing first.
Object.keys(ROSTER_COLS_).forEach(function (k) {
  var c = ROSTER_COLS_[k];
  if (c.sig) c.sort = function (a, b) {
    return (ROSTER_RANK_[a.sig[c.sig].cls] - ROSTER_RANK_[b.sig[c.sig].cls]) ||
           (b.sig[c.sig].miss - a.sig[c.sig].miss);
  };
});

function setRosterSort_(col) {
  // A column with no sorter (hours had none until Task 6 filled it in) is
  // click-inert rather than a crash: rows.sort(null) throws a TypeError, and
  // that rule has to hold for ANY future sorter-less column, not just the one
  // that used to be true of today (review finding 2026-08-05).
  if (!ROSTER_COLS_[col] || !ROSTER_COLS_[col].sort) return;
  if (STATE.rosterSort === col) STATE.rosterDesc = !STATE.rosterDesc;
  else { STATE.rosterSort = col; STATE.rosterDesc = false; }
  renderRoster_();
}

/** One signal cell: dot + % together (FR-4.4 — colour never carries the verdict
    alone), plus the miss count when there is one. "na" = nothing to grade.
    g.pct === null (the Overall column's synthetic grade) renders the dot with
    no percentage — `null * 100` JS-coerces to 0, and a fabricated "0%" would
    read as a real measurement, exactly the misleading-signal class this
    dashboard exists to stamp out (review finding 2026-08-05). */
function sigCellHtml_(g) {
  if (g.cls === "na") return '<td class="tnum">—</td>';
  var pct = g.pct === null ? "" : " " + Math.round(g.pct * 100) + "%";
  var body = g.cls === "small"
    ? '<span class="sigDot sigSmall" title="Fewer than ' + signalMinN_() +
      ' issues — shown ungraded: one missing field on one ticket is not a signal (SIGNAL_MIN_N).">●</span>' + pct
    : '<span class="sigDot sig' + g.cls.charAt(0).toUpperCase() + g.cls.slice(1) + '">●</span>' + pct;
  return '<td class="tnum">' + body +
    (g.miss ? ' <span class="cellSub">· ' + g.miss + " missing</span>" : "") + "</td>";
}

/** Every active person in the current population, RAG-graded on the same
    fields and gates as the 🧬 matrix. Population + sort both follow shared
    STATE, so the Open/Resolved chips on the matrix drive this table too. */
function renderRoster_() {
  var el = document.getElementById("rosterPanel");
  var done = donePeriods_(), hi = headPeriodIdx_(done);
  var head = done[hi] || { label: "—", isos: [] };
  var rows = personSignalRows_(head.isos);
  if (rows === null) {
    el.innerHTML = '<h3>👥 People signals</h3><div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
    return;
  }
  var open = STATE.typePop !== "resolved";
  var scopeTag = open ? scopeTag_("snap") : scopeTag_("period");
  // Fall back to opp whenever the resolved column has no sorter — not just
  // when the key is unrecognized. setRosterSort_'s click guard only protects
  // clicks; STATE.rosterSort can still be set directly (tests, a future
  // deep-link reader) to a RECOGNIZED key whose .sort is null (every column
  // has one today, "hours" included since Task 6 — but a future column may
  // not), and rows.sort(null) throws (review finding 2026-08-05).
  var col = ROSTER_COLS_[STATE.rosterSort];
  if (!col || !col.sort) col = ROSTER_COLS_.opp;
  ROSTER_ISOS_ = head.isos;   // the hours sorter's only way to know the period
  rows.sort(col.sort);
  if (STATE.rosterDesc) rows.reverse();

  var head_ = "<tr>" + Object.keys(ROSTER_COLS_).map(function (k) {
    var c = ROSTER_COLS_[k];
    var tag = (c.sig || k === "opp" || k === "n") ? " " + scopeTag
            : k === "hours" ? " " + scopeTag_("period") : "";
    return '<th class="' + (k === "person" ? "tname" : "tnum") + '" onclick="setRosterSort_(\'' + k + '\')" style="cursor:pointer"' +
      (c.sig ? ' title="' + esc_(sigFieldByKey_(c.sig).tip) + '"' : "") + ">" +
      esc_(c.label) + tag + (STATE.rosterSort === k ? (STATE.rosterDesc ? " ▾" : " ▴") : "") + "</th>";
  }).join("") + "</tr>";

  var body = rows.map(function (r) {
    return '<tr>' +
      '<td class="tname"><span class="rosterName" style="cursor:pointer" onclick="toggleRosterDetail_(\'' +
        esc_(r.p.name).replace(/'/g, "\\'") + '\')" title="' + esc_(r.p.jobTitle || "") + '">▸ ' +
        esc_(r.p.name) + "</span></td>" +
      '<td class="tnum">' + r.n + "</td>" +
      sigCellHtml_(r.sig.due) + sigCellHtml_(r.sig.est) + sigCellHtml_(r.sig.logged) +
      '<td class="tnum">' + hoursCellHtml_(r.p, head.isos) + "</td>" +
      sigCellHtml_({ cls: r.overall, pct: null, miss: r.miss }) +
      "</tr>" + rosterDetailRow_(r.p, head);
  }).join("");

  el.innerHTML =
    '<h3>👥 People signals — every active person in this slice</h3>' +
    '<p class="cellSub">' + (open ? "Open backlog — fix these and next period moves. "
                                   : "Resolved in " + esc_(head.label) + ". ") +
    "Each cell: the share of the person's issues carrying that field, graded against " +
    "the field's own gate — the same gates as the 🧬 matrix below. Grey = fewer than " + signalMinN_() +
    " issues (not graded). Click a header to sort; default is biggest opportunity first.</p>" +
    '<div class="gwrap"><table class="hyg tmx">' + head_ + body + "</table></div>";
}

/** SIGNAL_FIELDS_ lookup by key. */
function sigFieldByKey_(k) {
  for (var i = 0; i < SIGNAL_FIELDS_.length; i++) if (SIGNAL_FIELDS_[i].k === k) return SIGNAL_FIELDS_[i];
  return { tip: "" };
}

/**
 * Billable / non-billable / idle mini-bar for the analysis period — the same
 * per-person numbers the retired People-grid workload bars drew (aggWeeks_).
 * ALWAYS period-scoped (worklogs are period-shaped; a backlog snapshot has no
 * hours) — the header carries a PERIOD tag for exactly this reason.
 * ELIGIBILITY reuses the opportunity table's exclusions (review 2026-08-05
 * #2): ramping new hires and on-leave people get no idle segment — their
 * "idle" is the explanation, not a recoverable signal — and sort last.
 */
function hoursCellHtml_(p, isos) {
  var w = aggWeeks_(p, isos);
  if (!w || !(w.avail > 0)) return "—";
  var ineligible = p.newHire === true || p.onLeave === true;
  var idle = Math.max(0, w.avail - w.tracked);
  var total = Math.max(w.avail, w.tracked, 1);
  function seg(h, cls, label) {
    if (!(h > 0)) return "";
    return '<i class="' + cls + '" style="width:' + Math.round(h / total * 100) + '%" title="' +
      label + " " + r1_(h) + 'h"></i>';
  }
  return '<div class="hbarMini" title="billable ' + r1_(w.billable) + "h · non-billable " +
    r1_(w.nonBillable) + "h · idle " + r1_(idle) + 'h of ' + r1_(w.avail) + 'h scheduled">' +
    seg(w.billable, "segBill", "billable") +
    seg(w.nonBillable, "segNonbill", "non-billable") +
    (ineligible ? "" : seg(idle, "segIdle", "idle")) +
    "</div>" +
    (ineligible ? '<span class="cellSub" title="Ramping new hire / on leave — idle capacity is the explanation here, not a coaching signal (same exclusion as the headroom table).">' +

/** Sums the server's per-week attribution counts over a set of ISO weeks. */
function hygieneFor_(isos) {
  var s = { res: 0, resDue: 0, resAssigned: 0, resAttr: 0, resRegion: 0, resTeam: 0,
            resReady: 0, resFull: 0, epics: 0, epicsEst: 0, epicsTime: 0 };
  (MODEL.hygieneBuckets || []).forEach(function (h) {
    if (isos.indexOf(h.iso) === -1) return;
    Object.keys(s).forEach(function (k) { s[k] += (h[k] || 0); });
  });
  return s;
}

/** Person-week counts the Jira feed can't see: NS classification + capacity. */
function hygienePeopleFor_(isos) {
  var s = { tracked: 0, trackedCov: 0, weeks: 0, capEst: 0 };
  MODEL.people.forEach(function (p) {
    isos.forEach(function (iso) {
      var w = p.weeks[iso];

      s.weeks++;
      s.tracked += w.tracked || 0;
      s.trackedCov += w.trackedCov || 0;

/** One gap row: coloured against its gate, never against 100% — a 90% gate met
    at 91% is green, and pretending otherwise trains people to ignore the view.

    columns either (user decision 2026-08-04) — accountability and scheduling
    live in the requirements doc; this table is the work queue: what's
    missing, how much, and what it blocks. */
function hygieneRow_(g) {
  var pct = g.value === null ? null : Math.round(g.value * 100);
  var gate = Math.round(g.gate * 100);
  var rag = pct === null ? "r" : (pct >= gate ? "g" : (pct >= gate - 10 ? "a" : "r"));
  var mark = { g: "✔", a: "▲", r: "✖" }[rag];  // FR-4.4: readable without colour
  return "<tr><td>" + esc_(g.name) +
    (g.note ? '<div class="cellSub">' + esc_(g.note) + "</div>" : "") + "</td>" +
    '<td class="hnum ' + rag + '">' + mark + " " + (pct === null ? "not connected" : pct + "%") +
      '<div class="hbar"><i class="' + rag + '" style="width:' + (pct === null ? 0 : pct) + '%"></i></div>' +
      (g.detail ? '<div class="cellSub">' + esc_(g.detail) + "</div>" : "") + "</td>" +
    "<td>" + gate + "%</td>" +
    "<td>" + esc_(g.blocks) + "</td></tr>";
}

/**
 * Admin-only coverage-gate editor (user request 2026-08-03).
 *
 * "How much coverage is enough" is a judgement the Services Director owns and
 * revisits at period close. Keeping it in code meant it could only change in a
 * deploy window rather than in the review where the decision is actually made.
 *
 * Three things keep this from becoming a way to make problems disappear:
 * the agreed registry default is always shown next to the current value, an
 * override records who set it and when, and Restore puts the agreed number back
 * exactly. Moving a gate is a visible decision, not a quiet one.
 */
function gateEditorHtml_() {
  if (MODEL.viewerRole !== "admin") return "";
  var reg = MODEL.meta.registry || {};
  var ms = reg.metrics || {};
  var rows = ["onTime", "forecast", "util", "quality"].filter(function (id) { return ms[id]; })
    .map(function (id) {
      var m = ms[id];
      var cur = Math.round((m.coverageGate || 0) * 100);
      var def = m.gateDefault === undefined ? cur : Math.round(m.gateDefault * 100);
      var ov = m.gateOverride;
      return "<tr><td>" + esc_(m.name) +
        '<div class="cellSub">' + esc_(m.coverageOf || "") + "</div></td>" +
        '<td><input type="number" min="0" max="100" step="1" id="gate_' + id +
          '" value="' + cur + '" style="width:70px"> %</td>' +
        "<td>" + def + "%" + (ov
          ? '<div class="cellSub" title="' + esc_("Overridden by " + (ov.by || "an admin") +
              " on " + (ov.at || "an earlier date") + ". Restore returns the agreed value.") +
            '">✎ changed ' + esc_(ov.at || "") + "</div>"
          : "") + "</td>" +
        '<td><button class="btn" onclick="restoreGate_(\'' + id + '\')"' +
          (ov ? "" : " disabled") + ' title="put the agreed registry value back">Restore</button></td></tr>';
    }).join("");

  return '<details class="gedit"><summary>⚙ Coverage gates (admin)</summary>' +
    '<p class="cellSub">The attribution a metric needs before it is treated as reliable. ' +
    "Raising a gate makes the dashboard stricter; lowering one makes a weak number look " +
    "settled — the agreed value stays on screen so the difference is never invisible. " +
    "Saving rebuilds the model for everyone.</p>" +
    '<div class="gwrap"><table class="hyg"><tr><th>Metric</th><th>Gate</th>' +
    "<th>Agreed default</th><th></th></tr>" + rows + "</table></div>" +
    '<div style="margin-top:8px"><button class="btn" onclick="saveGates_()">Save gates</button> ' +
    '<span id="gateMsg" class="cellSub"></span></div></details>';
}

/** Resets one input to its registry default, then saves. */
function restoreGate_(id) {
  var el = document.getElementById("gate_" + id);
  if (el) el.value = "";           // empty = clear the override server-side
  saveGates_();
}

function saveGates_() {
  var msg = document.getElementById("gateMsg");
  var ms = (MODEL.meta.registry || {}).metrics || {};
  var payload = {};
  var bad = null;
  Object.keys(ms).forEach(function (id) {
    var el = document.getElementById("gate_" + id);
    if (!el) return;
    var v = String(el.value).trim();
    if (v === "") { payload[id] = null; return; }   // clear → registry default
    var n = Number(v);
    if (!(n >= 0 && n <= 100)) bad = ms[id].name;
    payload[id] = n;
  });
  if (bad) { msg.textContent = "⚠️ " + bad + ": gate must be between 0 and 100."; return; }
  msg.textContent = "Saving…";
  google.script.run
    .withSuccessHandler(function () {
      // The gates decide what every tile publishes, so nothing on screen is
      // trustworthy until the model is rebuilt against the new numbers.
      msg.textContent = "✅ Saved — reloading with the new gates…";
      loadData(true);
    })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveGateOverrides(payload);
}

/** The gap definitions, extracted so the gaps queue and the Executive

function gapsRows_(h, pp) {

    { key: "due", name: "Due date on the work On-Time measures",

// ══════════════════════════════════════════════════════════════════════════
// 🧬 FIELD FILL BY ISSUE TYPE (spec 2026-08-04-hygiene-by-issue-type-design.md)
//
// The gaps table above says HOW MUCH is missing, org-wide, pooled. This says
// WHICH TYPE to go and fix — a different question with a different reader: the
// gaps table belongs to whoever owns the metric, this belongs to whoever owns
// the tickets. Hence all-roles by design: fixing a ticket's fields is a task
// for anyone who touches that issue type, not a privileged action.
//
// Two populations behind one toggle, and OPEN is the default: a due date added
// to an open ticket moves next quarter's number, one added to a closed ticket
// is archaeology. Resolved explains today's cards; open is the work queue.
// ══════════════════════════════════════════════════════════════════════════

/** Column set, in display order. `gate` is null where the registry has no gate
    for that field — those cells report fill without grading it. */
var TYPE_FIELDS_ = [
  { k: "due",      label: "Due date",   gateOf: "onTime",
    feeds: "On-Time",  needs: "gatesOnTime" },
  { k: "assigned", label: "Assignee",   gate: 0.95,
    feeds: "all four cards", needs: null },
  { k: "attr",     label: "→ roster",   gate: 0.95,
    feeds: "all four cards", needs: null },
  { k: "est",      label: "Estimate",   gateOf: "forecast",
    feeds: "Forecast", needs: "gatesForecast" },
  { k: "time",     label: "Logged",     gateOf: "forecast",
    feeds: "Forecast", needs: "gatesForecast" },
  // Region and Team READ near-0% until the exporter's multi-select fix ("Jira
  // Backlog.js" v3.7.0, 2026-08-04) — the field was populated, the export was
  // dropping it. They are still footnoted, because a uniform column reads as one
  // field gap with one owner rather than as seven separate per-type failures, and
  // the uniformity test below is computed from the data either way.
  // The prereq ID is named; the PERSON is not. Same rule as the gaps table and
  // the suppressed tiles (2026-08-03): accountability lives in the requirements
  // doc, because a standing table of names against failures in a widely-read
  // view reads as a blame board rather than a work queue.
  { k: "region",   label: "Region",     gate: 1.00, feeds: "Region compare", needs: null, pr01: true },
  { k: "team",     label: "Team",       gate: 1.00, feeds: "Team compare",   needs: null, pr01: true },
];

/** Gate for a field, from the registry when it owns one. Never re-typed here —
    an admin gate override has to reach this table like it reaches the tiles. */
function typeFieldGate_(f) {
  if (f.gateOf) {
    var m = (MODEL.meta.registry || {}).metrics || {};
    return m[f.gateOf] ? m[f.gateOf].coverageGate : null;
  }
  return f.gate === undefined ? null : f.gate;
}

// ── 👥 PEOPLE SIGNALS (Actions roster, spec 2026-08-05 §5.2) ─────────────────
// Same fields, same gates as the 🧬 matrix — one truth. Person grain.

var SIGNAL_FIELDS_ = [
  { k: "due",    label: "Due date", gateOf: "onTime",
    tip: "Share of this person's issues carrying a due date. Same predicate and gate as the 🧬 matrix — the two surfaces can never disagree about a record." },
  { k: "est",    label: "Estimate", gateOf: "forecast",
    tip: "Share carrying an original estimate." },
  { k: "logged", label: "Logged",   gateOf: "forecast",
    tip: "Share carrying logged time (Jira Time Spent > 0)." },
];

function signalMinN_() { return (MODEL.meta && MODEL.meta.signalMinN) || 4; }

/**
 * Grade one signal. Below signalMinN_ the cell is "small": grey, ungraded,
 * % still shown — one missing due date on one ticket must never render the
 * same red as fifteen on forty (review 2026-08-05 #1; the roster's
 * STD_MIN_PERIODS). "na" = nothing to grade at all.
 */
function gradeSignal_(hit, n, gate) {
  if (!n) return { cls: "na", pct: null, miss: 0 };
  var pct = hit / n;
  var out = { pct: pct, miss: n - hit };
  if (n < signalMinN_()) { out.cls = "small"; return out; }
  if (gate === null)      { out.cls = "na";    return out; }
  out.cls = pct >= gate ? "good" : pct >= gate - 0.10 ? "warn" : "bad";
  return out;
}

var SIGNAL_RANK_ = { bad: 3, warn: 2, good: 1 };

/**
 * One row per person in the filtered population. Returns null on a pre-v22
 * payload (renderers show the same "Not in this payload" state as the matrix).
 * Population follows the 🧬 matrix's Open ↔ Resolved toggle (STATE.typePop);
 * isos scope the resolved half only — a backlog has no history to walk.
 * Interns excluded like every ranking surface (oppRows_ precedent).
 */
function personSignalRows_(isos) {
  var ph = MODEL.personHygiene;
  if (!ph) return null;
  var byName = {};
  if (STATE.typePop === "resolved") {
    (ph.resolved || []).forEach(function (b) {
      if (isos.indexOf(b.iso) === -1) return;
      var t = byName[b.person] || (byName[b.person] = { n: 0, due: 0, est: 0, logged: 0 });
      t.n += b.n; t.due += b.due; t.est += b.est; t.logged += b.logged;
    });
  } else {
    (ph.open || []).forEach(function (b) {
      byName[b.person] = { n: b.n, due: b.due, est: b.est, logged: b.logged };
    });
  }
  var m = (MODEL.meta.registry || {}).metrics || {};
  return filteredPeople_().filter(function (p) { return !p.isIntern; }).map(function (p) {
    var t = byName[p.name] || { n: 0, due: 0, est: 0, logged: 0 };
    var sig = {}, worst = 0, miss = 0;
    SIGNAL_FIELDS_.forEach(function (f) {
      var gate = m[f.gateOf] ? m[f.gateOf].coverageGate : null;
      var g = gradeSignal_(t[f.k], t.n, gate);
      sig[f.k] = g;
      if (SIGNAL_RANK_[g.cls]) { worst = Math.max(worst, SIGNAL_RANK_[g.cls]); miss += g.miss; }
    });
    var overall = worst === 3 ? "bad" : worst === 2 ? "warn" : worst === 1 ? "good" : "na";
    return { p: p, n: t.n, sig: sig, overall: overall, miss: miss };
  });
}

/** 🟢/🟡/🔴 counts for the Executive pulse. Small-n rows are counted apart —
    NEVER in bad (they would inflate the reds with statistical noise). */
function signalSummary_(isos) {
  var rows = personSignalRows_(isos);
  var out = { good: 0, warn: 0, bad: 0, small: 0, na: 0, available: rows !== null };
  (rows || []).forEach(function (r) {
    if (r.overall === "na") {
      // A row is "small" for the summary when it HAS issues but none graded.
      out[r.n > 0 ? "small" : "na"]++;
    } else out[r.overall]++;
  });
  return out;
}

/** Does this field gate a PUBLISHED metric for this row's type? A Story's due
    date does not, under dictionary scope — grading it red would send someone to
    fix records that move no number. */
function typeFieldLive_(f, row) {
  if (!f.needs) return true;
  return row[f.needs] === true;
}

/**
 * Is this column IDENTICAL across every type? Then it carries no per-type
 * information — which is the only thing this table exists to show.
 *
 * Region and Team read uniformly low (they were blank org-wide before the
 * v3.7.0 exporter fix), so grading them paints two red cells on every single
 * row and the genuine per-type findings drown in them.
 * A uniform column is one org-wide gap with one owner, and it is rendered as
 * one: muted, with the real percentage still on screen and the severity carried
 * by the footnote instead of by colour.
 *
 * Computed from the DATA, not hardcoded, so the day PR-01 lands and Region
 * starts varying by type, this column starts grading itself again with no code
 * change — and if it varies from the first row, it was never muted at all.
 */
function typeColUniform_(f, rows) {
  if (!f.pr01 || rows.length < 2) return false;
  var first = null;
  return rows.every(function (r) {
    var pct = r.n > 0 ? Math.round((r[f.k] || 0) / r.n * 100) : null;
    if (first === null) { first = pct; return true; }
    return pct === first;
  });
}

/** Rows for the active population, summed over the window (resolved) or taken
    whole (open — a backlog has no history to walk). */
function typeHygRows_(isos) {
  var th = MODEL.typeHygiene || { resolved: [], open: [] };
  if (STATE.typePop === "resolved") {
    var by = {};
    (th.resolved || []).forEach(function (r) {
      if (isos.indexOf(r.iso) === -1) return;
      var t = by[r.type];
      if (!t) {
        t = by[r.type] = { type: r.type, isEpic: r.isEpic, gatesOnTime: r.gatesOnTime,
                           gatesForecast: r.gatesForecast, n: 0,
                           keys: {}, keysCapped: {} };
        TYPE_FIELDS_.forEach(function (f) { t[f.k] = 0; });
      }
      t.n += r.n;
      TYPE_FIELDS_.forEach(function (f) {
        t[f.k] += r[f.k] || 0;
        var ks = (r.keys || {})[f.k];
        if (ks && ks.length) t.keys[f.k] = (t.keys[f.k] || []).concat(ks);
        if ((r.keysCapped || {})[f.k]) t.keysCapped[f.k] = true;
      });
    });
    return Object.keys(by).map(function (k) { return by[k]; });
  }
  return (th.open || []).slice();
}

/**
 * Recoverable impact: records missing the field, counted ONLY where that field
 * gates a published metric for that type.
 *
 * This is the sort key, and it is the whole reason the table is useful. Sorting
 * by worst percentage puts a 21%-filled Sub-task column on top, where fixing all
 * of it moves nothing; sorting alphabetically buries the four Go-live epics whose
 * missing due dates are the entire On-Time gap.
 *
 * Region and Team (pr01) are excluded even now that Region VARIES by type
 * (v3.7.0 exporter fix, 2026-08-04). Tried counting them here and reverted:
 * they gate no PUBLISHED metric — they are rollup dimensions — so 300 sub-tasks
 * missing a region would outrank the 12 Go-live epics whose missing due dates
 * are the entire On-Time gap, which is the precise failure this sort exists to
 * prevent. Their per-type gaps are not hidden: the columns un-mute and show
 * graded fill % plus miss counts as soon as they stop being uniform.
 */
function typeImpact_(row) {
  return TYPE_FIELDS_.reduce(function (t, f) {
    if (f.pr01 || !typeFieldLive_(f, row)) return t;
    return t + Math.max(0, row.n - (row[f.k] || 0));
  }, 0);
}

// One toggle drives two surfaces (spec §5.4, Task 5): the 🧬 matrix's own
// Open/Resolved chips stay INSIDE typeMatrixHtml_ (its PNG capture deliberately
// includes them — comment above), but the 👥 roster reads the same STATE.typePop,
// so flipping the chip has to re-render both rather than leaving the roster
// showing the population the header no longer names.
function setTypePop_(v) { STATE.typePop = v; renderHygPanel_(); renderRoster_(); }

/** One cell: fill %, grade against the field's own gate, and the miss count. */
function typeCellHtml_(f, row, uniform) {
  var have = row[f.k] || 0, miss = Math.max(0, row.n - have);
  var pct = row.n > 0 ? Math.round(have / row.n * 100) : null;
  var live = typeFieldLive_(f, row) && !uniform;
  var gate = typeFieldGate_(f);
  var rag, mark;
  if (!live || pct === null || gate === null) {
    // Informational, not a gap. "—" is doing real work here: it separates
    // "this is fine" from "this does not apply to this type".
    rag = "n"; mark = "—";
  } else {
    var g = Math.round(gate * 100);
    rag = pct >= g ? "g" : (pct >= g - 10 ? "a" : "r");
    mark = { g: "✔", a: "▲", r: "✖" }[rag];
  }
  var why = live
    ? ". This gates " + f.feeds + " — fixing these moves the number."
    : (uniform
        // Two different reasons a cell isn't graded, and conflating them would
        // send the reader to the wrong fix: one is "not your problem", the
        // other is "everyone's problem, and not a per-type one".
        ? ". Identical across every issue type, so this is one org-wide field " +
          "gap (PR-01), not something to fix type by type."
        : ". Gates no published metric for this type today.");
  var missHtml = miss > 0
    ? ' <span class="tmiss"' + (live ? "" : ' style="opacity:.55"') +
      ' title="' + esc_(miss + " " + row.type + (miss === 1 ? " record is" : " records are") +
        " missing " + f.label.toLowerCase() + why) + '">' + miss + "</span>"
    : "";
  // A fill bar under every cell. Nine columns of bare percentages force the
  // reader to compare numbers digit by digit; the bars make a row's shape
  // readable at a glance, and this view's established idiom is labelled bars
  // (the funnels and the gaps table) rather than bare figures.
  var bar = pct === null ? "" :
    '<div class="tbar"><i class="' + rag + '" style="width:' + Math.max(0, Math.min(100, pct)) +
    '%"></i></div>';
  return '<td class="tnum tcell ' + rag + '">' +
    '<div class="tval">' + mark + " " + (pct === null ? "—" : pct + "%") + missHtml + "</div>" +
    bar + "</td>";
}

function typeMatrixHtml_(isos, winLabel) {
  var th = MODEL.typeHygiene;
  if (!th) {
    // Pre-v17 cached payload. Say so — an empty matrix reads as "no gaps",
    // which is the exact opposite of what an absent payload means.
    return '<div class="profPanel"><h4>🧬 Field fill by issue type</h4>' +
      '<div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the ' +
      "current schema.</div></div>";
  }
  var open = STATE.typePop !== "resolved";
  var rows = typeHygRows_(isos);
  rows.sort(function (a, b) { return typeImpact_(b) - typeImpact_(a) || b.n - a.n; });
  var total = rows.reduce(function (t, r) { return t + r.n; }, 0);

  var chips =
    '<span class="chip' + (open ? " on" : "") + '" onclick="setTypePop_(\'open\')"' +
      ' title="Unresolved work, as at the last export. THIS is the actionable half — a due date ' +
      'added here moves next period\'s number.">Open backlog</span>' +
    '<span class="chip' + (open ? "" : " on") + '" onclick="setTypePop_(\'resolved\')"' +
      ' title="Work resolved in the selected window. Explains the numbers on the cards today; ' +
      'fixing these records changes history, not the next report.">Resolved · ' + esc_(winLabel) + "</span>";

  var lead = open
    ? "Snapshot at the last export — <b>" + total + "</b> open issue" + (total === 1 ? "" : "s") +
      ". Fix these and the next period's numbers move. " +
      '<span title="A backlog has no history to walk: an open issue has no date that would make ' +
      'a time series honest, so this half ignores the period picker by design.">Not affected by ' +
      "the period picker ⓘ</span>"
    : "Resolved in <b>" + esc_(winLabel) + "</b> — <b>" + total + "</b> issue" +
      (total === 1 ? "" : "s") + ". This is where the cards' numbers come from.";

  if (!rows.length) {
    return '<div class="profPanel" id="typeMatrix"><h4>🧬 Field fill by issue type</h4>' +
      '<div class="chips seg" style="margin-bottom:8px">' + chips + "</div>" +
      '<div class="emptyState">' + (open ? "No open work in the feed."
        : "No work resolved in " + esc_(winLabel) + ".") + "</div></div>";
  }

  // Computed once over the whole table, not per row — "is this column constant?"
  // is a question about the column.
  var uniform = {};
  TYPE_FIELDS_.forEach(function (f) { uniform[f.k] = typeColUniform_(f, rows); });
  var anyUniform = TYPE_FIELDS_.some(function (f) { return uniform[f.k]; });

  // Every column right of the type name is numeric, so its HEADER is
  // right-aligned to sit over its own values. Left-aligned headers over
  // right-aligned numbers is what made the first cut unreadable: each label
  // pointed at the gap between two columns rather than at its data.
  var head = '<tr><th class="tname">Issue type</th><th class="tnum">n</th>' +
    TYPE_FIELDS_.map(function (f) {
      return '<th class="tnum" title="' + esc_(f.label + " — feeds " + f.feeds +
        (uniform[f.k] ? ". Identical for every issue type here, so it is shown ungraded: " +
          "one org-wide field gap (PR-01), not a per-type one."
          : f.pr01 ? ". Region and Team come from Jira custom fields — tagging is owned " +
            "upstream, but the gaps ARE counted per type here."
          : "")) + '">' +
        esc_(f.label) + (uniform[f.k] ? " *" : "") + "</th>";
    }).join("") + "</tr>";

  var body = rows.map(function (r) {
    var impact = typeImpact_(r);
    return "<tr>" +
      '<td class="tname"><b>' + esc_(r.type) + "</b>" +
      (r.isEpic ? ' <span class="tepic" title="Counted as an epic by the export\'s substring ' +
        'rule, so this type is already inside the On-Time dictionary scope and the Forecast ' +
        'denominator — pooled with every other epic type.">epic</span>' : "") +
      // Shortened from a full sentence per row: repeated six times it was noise,
      // and the explanation belongs in one tooltip rather than in every row.
      (impact > 0 ? '<div class="cellSub" title="Records missing a field that gates a published ' +
        'metric for this issue type. Fixing these moves a number; the other gaps on this row do ' +
        'not.">' + impact + " fixable</div>" : "") + "</td>" +
      '<td class="tnum tn">' + r.n + "</td>" +
      TYPE_FIELDS_.map(function (f) { return typeCellHtml_(f, r, uniform[f.k]); }).join("") +
      "</tr>";
  }).join("");

  return '<div class="profPanel" id="typeMatrix">' +
    // Title row carries the PNG button, so a screenshot of this table lands in a
    // deck at full width instead of being cropped out of a whole-page capture.
    // The population chips ride inside the shot — a matrix with no population
    // label is unreadable out of context, since Open and Resolved look alike.
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<h4 style="flex:1;margin:0">🧬 Field fill by issue type</h4>' +
      '<button class="iconbtn" onclick="savePng_(\'typeMatrix\',\'field-fill-by-type\')"' +
        ' title="Save this table as a PNG image">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>' +
      '<polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      "PNG</button></div>" +
    '<div class="chips seg" style="margin:8px 0">' + chips + "</div>" +
    '<p class="cellSub">' + lead + "</p>" +
    '<div class="cellSub" style="margin:8px 0 4px">Each cell is graded against ' +
      "<b>that field's own gate</b>: " +
      keySwatch_("var(--pos)", "✔ at or above") + " · " +
      keySwatch_("var(--amber)", "▲ under 10 pts below") + " · " +
      keySwatch_("var(--warn)", "✖ 10+ pts below") + " · " +
      '<b>—</b> = gates no published metric for this type today ' +
      '<span title="Under the current On-Time scope only epic-grain work carries a due-date ' +
      'obligation, and estimates only matter at epic grain. Grading a Sub-task red for a missing ' +
      'due date would send someone to fix records that move no number.">ⓘ</span>. ' +
      "The small number after each percentage is the record count missing that field.</div>" +
    '<div class="gwrap"><table class="hyg tmx">' + head + body + "</table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      (anyUniform ? "* This column reads the same for every issue type, so it is shown " +
        "ungraded — it is <b>one org-wide field gap</b> tracked under PR-01, not something " +
        "to chase type by type. It starts grading itself again the moment it varies. " : "") +
      "Rows are ordered by fixable gaps on metric-gating fields, not by worst percentage: " +
      "four missing due dates on epics outrank four hundred on sub-tasks." +
      '</div>' +
    "</div>";
}

/** Legacy entry point — the suppressed KPI cards link to the hygiene queue by
    name, so it stays as a thin alias over the router rather than a second path. */
function showHygiene_() { switchView_("actions"); }

/** Access Control is a role-gated VIEW; switchView_ enforces the gate, so this
    is only the pane's renderer. */
function renderAccess_() {
  var panel = document.getElementById("viewAccess");
  panel.innerHTML = "Loading access settings…";
  google.script.run.withSuccessHandler(function (s) {
    panel.innerHTML =
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">' +
      "<h3 style=\"flex:1\">🔒 Access Control</h3></div>" +
      '<p class="cellSub">Bootstrap admin: ' + esc_(s.bootstrapAdmin) + " (not removable)</p>" +
      '<div class="blbl">ADMINS (comma-separated)</div>' +
      '<input id="accAdmins" style="width:100%" value="' + esc_(s.admins.join(", ")) + '">' +
      '<div class="blbl">VIEWERS (directs and above — comma-separated)</div>' +
      '<input id="accViewers" style="width:100%" value="' + esc_(s.viewers.join(", ")) + '">' +
      '<label style="display:block;margin:10px 0"><input type="checkbox" id="accOpen"' +
        (s.openAccess ? " checked" : "") + "> Open access (demo only)</label>" +
      '<button class="btn" onclick="saveAccess_()">Save</button> <span id="accMsg"></span>';
  }).withFailureHandler(function (e) { panel.innerHTML = "⚠️ " + esc_(e.message); })
    .getDeliveryAccessSettings();
}

function saveAccess_() {
  var msg = document.getElementById("accMsg");
  msg.textContent = "Saving…";
  google.script.run.withSuccessHandler(function () { msg.textContent = "✅ Saved"; })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveDeliveryAccessSettings({
      admins: document.getElementById("accAdmins").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      viewers: document.getElementById("accViewers").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
      openAccess: document.getElementById("accOpen").checked,
    });
}

/** One CSV field, quoted only when it needs to be (comma, quote or newline).
    Extracted from the old saveCsv_ body so every CSV export shares one
    quoting rule instead of re-deriving it. */
function csvCell_(v) {
  v = String(v == null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/** Pure builder for the signals-roster CSV: one row per person, signal
    values + offending counts + the hours split (spec §5). Extracted from
    saveCsv_ (review finding, 2026-08-05) so the row grammar — small-n rows
    keep their REAL percentages (small-n suppresses grading, not
    measurement), a zero-issue person's percentages are blank, and an
    ineligible (ramping/on-leave) row blanks Idle and carries the Note
    instead — is testable without a DOM/Blob download round-trip.
    @returns {?Array<string>} CSV lines (header first), or null on a
    pre-v22 payload (no personHygiene to grade). */
function rosterCsvLines_() {
  var done = donePeriods_(), hi = headPeriodIdx_(done);
  var head = done[hi] || { label: "", isos: [] };
  var rows = personSignalRows_(head.isos);
  if (rows === null) return null;
  var lines = ["Person,Job title,Region,n,Due %,Due missing,Estimate %,Estimate missing," +
               "Logged %,Logged missing,Overall,Billable h,Non-billable h,Idle h,Note"];
  rows.forEach(function (r) {
    var w = aggWeeks_(r.p, head.isos) || { billable: 0, nonBillable: 0, tracked: 0, avail: 0 };
    var inel = r.p.newHire === true || r.p.onLeave === true;
    function pc(g) { return g.pct === null ? "" : Math.round(g.pct * 100); }
    lines.push([csvCell_(r.p.name), csvCell_(r.p.jobTitle), csvCell_(r.p.region), r.n,
      pc(r.sig.due), r.sig.due.miss, pc(r.sig.est), r.sig.est.miss,
      pc(r.sig.logged), r.sig.logged.miss, r.overall,
      r1_(w.billable), r1_(w.nonBillable),
      inel ? "" : r1_(Math.max(0, w.avail - w.tracked)),
      inel ? (r.p.onLeave ? "on leave" : "ramping") : ""].join(","));
  });
  return lines;
}

/** CSV = the signals roster (spec §5). Replaces the Task-3 interim, which
    exported the opportunity table instead. */
function saveCsv_() {
  var lines = rosterCsvLines_();
  if (lines === null) return;
  // Line endings + extension: matches saveOppCsv_'s convention (downloadCsv_
  // itself does neither — it writes the filename and content verbatim).
  downloadCsv_(lines.join("\r\n"), "delivery-people-signals.csv");
}

/** A CSV string → a downloaded file. Shared by every CSV export. */
function downloadCsv_(csv, filename) {
  var a = document.createElement("a");
  a.download = filename;
  // Blob URLs are the right default (no size ceiling — a full roster × 6 periods
  // export runs past what a data: URI reliably carries), but some managed
  // browsers block blob: in a sandboxed iframe, which is exactly what an
  // HtmlService web app is. Fall back to a data: URI rather than failing silently.
  try {
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/csv;charset=utf-8,%EF%BB%BF" + encodeURIComponent(csv);
  }
  a.click();
  if (a.href.indexOf("blob:") === 0) {
    // Release the object URL once the download has been handed off — the blob
    // otherwise pins the whole CSV in memory until the tab closes.
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }
}

var H2C_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
/** The headline period, filename-safe — "Jul 2026" → "Jul-2026", "FY27 Q1" →
    "FY27-Q1". Falls back to the model's ISO week if no period resolves. */
function pngPeriodStamp_() {
  var done = allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
  var lbl = done.length ? done[done.length - 1].label : (MODEL.meta.headlineIso || "");
  return String(lbl).replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "export";
}

function savePng_(elId, name) {
  function shoot() {
    var el = document.getElementById(elId);
    // Uncap the grid's internal scroller for the shot — otherwise the PNG
    // captures only the visible viewport of rows, not the whole roster.
    el.classList.add("shooting");
    html2canvas(el, { backgroundColor: getComputedStyle(document.body).backgroundColor })
      .then(function (canvas) {
        var a = document.createElement("a");
        // Stamp the filename with the period the shot actually SHOWS, not the
        // model's ISO week. A board-pack PNG of July 2026 saved as
        // "…-2026.W31.png" is a figure filed under the wrong period, and nobody
        // opens the file again to check.
        a.download = "delivery-health-" + name + "-" + pngPeriodStamp_() + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      })
      .finally(function () { el.classList.remove("shooting"); });
  }
  if (window.html2canvas) return shoot();
  var s = document.createElement("script");
  s.src = H2C_URL;
  s.onload = shoot;
  s.onerror = function () { alert("PNG export unavailable (script blocked)"); };
  document.head.appendChild(s);
}

loadData(false);
</script>
