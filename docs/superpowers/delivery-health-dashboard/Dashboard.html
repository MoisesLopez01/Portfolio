  var chips = Object.keys(COMPARE_LABELS).map(function (d) {
    var o = optionsFor_(d);
    var dead = o.live.length === 0;
    return '<span class="chip' + (STATE.compare === d ? " on" : "") + (dead ? " off" : "") +
      '"' + (dead ? "" : ' onclick="setCompare_(\'' + d + '\')"') +
      ' title="' + (dead ? "no " + cmpNoun_(d, 2) + " in this slice"
                         : "break the metric down by " + cmpNoun_(d, 1) +
                           " — " + o.live.length + " in scope") + '">' +
      COMPARE_LABELS[d] + "</span>";
  }).join("");

  // Metric chips — the comparison charts whatever the Trends view is charting,
  // so switching metric in one place switches it everywhere (one lens, not two).
  var mchips = metricChips_();

  var o = optionsFor_(STATE.compare);
  var d = FILTER_DIMS[STATE.compare];
  // Each bar is that category measured on its own, so the active filter for THIS
  // dimension is switched off while the bars are built — otherwise picking AMER
  // would leave a chart with one bar in it.
  var rows = o.live.map(function (val) {
    var members = MODEL.people.filter(function (p) {
      return passesFilters_(p, STATE.compare) && dimMatch_(p, STATE.compare, val);
    });
    // attribOnly stubs STAY in the metric scope — bucketsFor_ joins a leaver's
    // or non-Services assignee's issues through their stub name, and dropping
    // them here would silently un-attribute that work from every issue-based
    // bar (v13 whole-roster attribution). They only leave the HEADCOUNT: the
    // number left of the bar counts people in the operational population —
    // and only people who EXISTED in the compared period (existsIn_), so an
    // older window shows that window's roster, not today's.
    var names = {};
    members.forEach(function (p) { names[p.name] = 1; });
    var v = scopedMetric_(m, head.isos, names);
    var realN = members.filter(function (p) {
      return !p.attribOnly && existsIn_(p, head.isos);
    }).length;
    // §6 THE GRID (Task 15) — every grid column's value for THIS same bar,
    // computed alongside the active metric's so the grid and the bullet chart
    // below it describe one row, not two independently-built lists that could
    // silently disagree on membership.
    var cells = {};
    gridMetrics_().forEach(function (id) { cells[id] = scopedMetric_(METRICS_[id], head.isos, names); });
    return { key: val, label: val, value: v, n: realN, cells: cells };
  }).filter(function (r) { return r.n > 0; })
    .sort(function (a, b) {
      // Nulls last: "no measurable data" is not a low score and must not sit at
      // the bottom of a ranked list as though it were one.
      if (a.value === null && b.value === null) return b.n - a.n;
      if (a.value === null) return 1;
      if (b.value === null) return -1;
      return b.value - a.value;
    });

  var std = metricSeries_(m, done).std;
  var withVal = rows.filter(function (r) { return r.value !== null; });

  // ── §6 THE GRID (Task 15, spec 2026-08-06 §6) ──
  // Rows are chosen by capRows_ against the ACTIVE metric's own value — the
  // SAME ranking hbarChart_ applies to `rows` below, so the grid and the
  // bullet chart can never disagree about which categories are "the ones that
  // matter" (distance below reference, never list position). Target/std are
  // computed per COLUMN (org-wide), never per row — grading is always a value
  // against ITS OWN metric's reference, not the active metric's.
  var gridIds = gridMetrics_();
  var gridTargets = {}, gridStds = {};
  gridIds.forEach(function (id) {
    var mm = METRICS_[id];
    var t = (MODEL.meta.targets || {})[mm.targetKey] || null;
    if (t && reg_(id).invertTarget) t = { green: t.green, amber: t.amber, invert: true };
    gridTargets[id] = t;
    gridStds[id] = metricSeries_(mm, done).std;
  });
  var gridSel = capRows_(rows, !!STATE.compareAll);
  var gridHtml = "";
  if (gridIds.length) {
    gridHtml = '<div class="gwrap" style="margin:8px 0"><table class="hyg gridTable">' +
      '<thead><tr><th class="tname">' + esc_(COMPARE_LABELS[STATE.compare]) + "</th>" +
      gridIds.map(function (id) {
        var mm = METRICS_[id];
        return '<th class="tnum' + (STATE.metric === id ? " on" : "") + '" role="button" tabindex="0" ' +
          'onclick="setMetric_(\'' + id + '\')" ' +
          'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
          'setMetric_(\'' + id + '\');}" style="cursor:pointer" title="' +
          esc_("Chart " + mm.label() + " in the bullet chart below.") + '">' +
          esc_(mm.label()) + (STATE.metric === id ? " ▾" : "") + "</th>";
      }).join("") + "</tr></thead><tbody>" +
      gridSel.rows.map(function (r) {
        return "<tr><td class=\"tname\">" + esc_(r.label) +
          ' <span class="cellSub">(' + r.n + ")</span></td>" +
          gridIds.map(function (id) {
            return gridCellHtml_({ value: r.cells[id], n: r.n, target: gridTargets[id],
                                   std: gridStds[id], unit: METRICS_[id].unit });
          }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
  }

  // ── Population accounting (user-reported 2026-08-03) ──
  // A breakdown must be able to prove it covers everybody. Distinct people, not
  // a sum of row counts: Team and PM membership OVERLAP, so someone on two teams
  // is in two bars and the counts add up past the headcount. Anyone missing here
  // is a person the chart is silently not describing — the failure this line
  // exists to make impossible.
  // attribOnly stubs are excluded from BOTH sides of "shown of inScope": this
  // sentence proves the chart covers the operational population, and stubs are
  // not in it (their issues still move the bar values via the scope names above).
  // Same period gate as the per-bar counts: "all N people represented" must
  // describe the compared period's roster, or the sentence contradicts the
  // scope chip whenever an older window is selected (2026-08-04).
  var seen = {};
  rows.forEach(function (r) {
    MODEL.people.forEach(function (p) {
      if (!p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare) &&
          dimMatch_(p, STATE.compare, r.key)) seen[p.name] = 1;
    });
  });
  var shown = Object.keys(seen).length;
  var inScope = MODEL.people.filter(function (p) {
    return !p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare);
  }).length;
  var untaggedRow = rows.filter(function (r) { return isUntagged_(r.key); })[0];
  var overlaps = rows.reduce(function (t, r) { return t + r.n; }, 0) > shown;
  var below = target ? withVal.filter(function (r) { return r.value < target.green; }).length : 0;
  // Chart-area verdict states COUNTS, never names (P6) — the People tab is
  // where an individual is named, deliberately.
  var verdict = !withVal.length
    ? "Nothing measurable to compare in this slice."
    : "<b>" + withVal.length + "</b> " + cmpNoun_(STATE.compare, withVal.length) +
      " measurable in " + esc_(head.label) +
      (target ? " · <b class=\"" + (below ? "vr" : "vg") + '">' + below + "</b> below the ≥" +
        target.green + "% target" : "") +
      (std && std.ok ? " · <b>" + rows.filter(function (r) {
        return r.value !== null && r.value < std.lo;
      }).length + "</b> below the normal operating range" : "") +
      (rows.length > withVal.length ? " · " + (rows.length - withVal.length) +
        " with no measurable data" : "") +
      // Say it even when it's complete. "Every person is in a bar" is exactly the
      // reassurance an executive needs before acting on a comparison, and the
      // day it stops being true the sentence changes by itself.
      ' · <span title="Distinct people represented by the bars above, against everyone the current filters select. Team and PM membership overlaps, so the per-bar counts add up past the headcount — this figure counts each person once.">' +
      (shown >= inScope
        ? "<b>all " + inScope + "</b> people represented"
        : '<b class="vr">' + shown + " of " + inScope + "</b> people represented — " +
          (inScope - shown) + " missing") + "</span>";

  panel.innerHTML =
    '<div class="chartHead"><h3>' + esc_(m.label()) + " by " +
      esc_(COMPARE_LABELS[STATE.compare]) + scopeTag_("period") + "</h3>" +
      '<span class="sub">' + esc_(head.label) + " · last complete " + unit + "</span>" +
      '<span style="flex:1"></span><span class="chips seg">' + chips + "</span></div>" +
    '<div class="chartHead" style="margin-bottom:6px"><span class="sub">Metric</span>' +
      '<span class="chips seg">' + mchips + "</span>" +
      // The hover-detail defaults to the SERVER registry's formula (a fuller
      // definition than the short axis() caption) — correct for every metric
      // whose client computation matches the population that formula
      // describes. queueCover is the one exception (blocking fix, D5): its
      // registry entry describes the HERO's whole-population formula, but
      // this grid/chart computes ASSIGNED-ONLY — reusing reg_() here would
      // print the hero's "unassigned open" text as the hover-detail on a
      // caption that no longer claims it. m.detail(), when a metric supplies
      // one, overrides the registry fallback for exactly that metric.
      '<span class="sub" title="' + esc_((m.detail ? m.detail() : reg_(m.id).formula) || "") + '">' +
      esc_(m.axis()) + " ⓘ</span></div>" +
    gridHtml +
    '<div class="verdict">' + verdict + "</div>" +
    hbarChart_({ rows: rows, target: target, std: std, title: m.label(), unit: m.unit,
                 expanded: !!STATE.compareAll, onExpand: "toggleCompareAll_()" }) +
    '<div class="cellSub" style="margin-top:6px">' +
      "The number left of each bar is its headcount. " +
      (overlaps
        ? "Membership overlaps, so the bars sum to more than the headcount — " +
          "someone on two teams appears in both. "
        : "") +
      (untaggedRow
        ? '<b>' + esc_(untaggedRow.label) + "</b> is not a " +
          cmpNoun_(STATE.compare, 1) + " — it is the " + untaggedRow.n +
          " people carrying no " + cmpNoun_(STATE.compare, 1) +
          " at all. They are shown rather than dropped, because a breakdown that " +
          "quietly omits them describes a smaller org than the one you have. " +
          "Closing that tag gap is a Data Hygiene item. "
        : "") +
      "The shaded band is the operating range, the vertical rule is the target.</div>";
}

/**
 * Per-person utilization opportunity for one period: the gap between the rate
 * someone ran at and the cohort operating rate, converted to HOURS — because a
 * percentage point is not something anyone can reassign, and hours are.
 *
 *   opportunity = max(0, norm% × their available hours − their delivered hours)
 *
 * Only ever positive: someone above the norm is carrying it, not owed a
 * negative. Excluded, because their gap is not an opportunity at all: people
 * on long leave (no availability is expected), interns (ranking them by
 * "hours that could be recovered" is exactly the punishment that flag exists
 * to prevent), pre-hire periods, and anyone with no measurable capacity.
 * Ramping new hires get a row but come back FLAGGED — the 👥 pulse leaves
 * them out of its recoverable total, because "ramping" is the explanation and
 * the total is a call to act.
 * Utilization only: On-Time and Forecast are attributed per issue, and an
 * individual's on-time rate over three closed stories is not a number anybody
 * should act on. Fed the roster's headline period; the roster itself carries
 * the per-person detail (the standalone headroom table was retired 2026-08-05).
 */
function oppRows_(head, norm) {
  var live = nsLive_();
  return filteredPeople_().map(function (p) {
    if (p.onLeave) return null;
    if (p.isIntern) return null;
    var w = aggWeeks_(p, head.isos);
    if (!w) return null;                       // pre-hire: the period predates them
    var den = live ? (w.availCov || 0) : w.avail;
    if (den <= 0) return null;                 // no capacity, or nothing NS classified
    var num = live ? w.billable : w.tracked;
    var rate = num / den * 100;
    // Hours, not points: the unit a manager can actually move.
    var opp = norm === null ? 0 : Math.max(0, den * (norm / 100) - num);
    return { name: p.name, rate: rate, opp: opp, den: den, num: num, p: p,
             ramping: p.newHire === true };
  }).filter(Boolean);
}

/** One clickable count on the 👥 pulse — opens the Actions roster narrowed to
    that bucket. `extraTip` is appended for the buckets whose meaning is not
    self-evident from the words alone. */
function pulseLink_(sig, inner, extraTip) {
  return '<span class="pulseLink" onclick="event.stopPropagation();openRoster_(\'' + sig + '\')"' +
    ' title="' + esc_((extraTip ? extraTip + " " : "") + "Click to open these on the Actions roster.") +
    '">' + inner + "</span>";
}

/** 👥 pulse — counts only, never names (standing rule: names live behind the
    Actions gate). Hidden, not dimmed, without margin tier — same doctrine as
    the Utilization card. */
function renderPulse_() {
  var el = document.getElementById("pulsePanel");
  if (!canSeeMargin_()) { el.innerHTML = ""; el.style.display = "none"; return; }
  el.style.display = "";
  var A = analysisHead_();
  var done = A.done, head = A.head;
  // CAPACITY BAND's own KPI tile (Task 16B: moved from the retired #tiles
  // strip). Built FIRST and independent of signalSummary_'s own availability
  // gate below — Utilisation/Planned Coverage rendered unconditionally
  // whenever margin is visible before this merge, and a pre-v22 payload with
  // no people signals must not silently drop it too.
  var capacityHtml = '<div class="tiles">' + capacityTileHtml_() + '</div>';
  var s = signalSummary_(head.isos);
  if (!s.available) {
    el.innerHTML = capacityHtml + '<div class="cellSub">People signals arrive after the next refresh (new payload).</div>';
    countUpTiles_();
    return;
  }
  // Recoverable hours: the norm-gap opportunity summed across the slice
  // (oppRows_) — the figure the retired headroom table used to headline; the
  // roster below the deep-link carries the per-person detail now.
  //
  // Suppressed on an unfinished window (2026-08-06): the gap is measured against
  // hours already DELIVERED, so a window mid-flight (or one that has not started)
  // reports the hours not yet worked as hours to recover. In a forward week that
  // is the whole week, for everybody — a headline number that is pure artefact.
  // What the same window CAN say is how much of it is planned, so it says that.
  var ser = metricSeries_(METRICS_.util, done);
  var norm = (A.phase === "done" && ser.std && ser.std.ok) ? ser.std.baseline : null;
  var opp = 0;
  if (norm !== null) oppRows_(head, norm).forEach(function (r) {
    if (!r.ramping && r.opp > 0.5) opp += r.opp;
  });
  var pl = A.phase === "done" ? null : planFor_(head.isos);
  // Reconciliation count (Task 14, spec §5) — replaces the prototype's
  // `[object Object]` people caveat (it collided `people` as both a number
  // and the signals object; this is a REAL computed count, not a stringified
  // object). personSignalRows_ is built as filteredPeople_().map(...), so
  // every bucket signalSummary_ returns sums to the SAME population by
  // construction — stating that sum against the independently-computed
  // filteredPeople_().length turns an implicit invariant into a checkable
  // fact on screen, the same way the comparison chart already proves its own
  // "all N people represented" line rather than assuming it.
  var pop = filteredPeople_().length;
  var acct = s.good + s.warn + s.bad + s.small + s.learn + (s.na || 0);
  var reconcile = '<div class="cellSub" style="margin-top:2px">' +
    (acct === pop
      ? "<b>" + acct + "</b> of " + pop + " people accounted for"
      : '<b class="vr">' + acct + " of " + pop + "</b> people accounted for — " + (pop - acct) + " missing") +
    "</div>";
  el.innerHTML = capacityHtml +
    '<div class="kicker">CAPACITY — what we have to throw at it</div>' +
    '<h3>👥 People signals ' + scopeTag_(STATE.typePop === "resolved" ? "period" : "snap") + "</h3>" +
    // EVERY COUNT IS ITS OWN DEEP LINK (user 2026-08-06). The pulse already
    // says "3 need action"; clicking that number now lands on exactly those 3
    // instead of on the whole roster with the reader left to re-find them.
    // stopPropagation keeps the count's own link from also firing the row's
    // "open everything" handler behind it.
    '<div class="pulseRow" onclick="openRoster_()" style="cursor:pointer" title="Open the full roster on the Actions tab, sorted by biggest opportunity">' +
    pulseLink_("good", '<span class="sigDot sigGood">●</span> ' + s.good + " on track") + " · " +
    pulseLink_("warn", '<span class="sigDot sigWarn">●</span> ' + s.warn + " watch") + " · " +
    pulseLink_("bad",  '<span class="sigDot sigBad">●</span> ' + s.bad + " need action") +
    (s.small ? " · " + pulseLink_("small", '<span class="sigDot sigSmall">●</span> ' + s.small +
      " ungraded (small n)", "Have issues but fewer than " + signalMinN_() +
      " — ungraded, never counted red.") : "") +
    (s.learn ? " · " + pulseLink_("learn", "🎓 " + s.learn + " in training",
      "Interns (level I1) — on the roster so they can see every signal and learn the " +
      "standard, deliberately never graded and never counted red.") : "") +
    (norm !== null ? " · <b>" + Math.round(opp) + "h</b> recoverable" : "") +
    (pl && pl.people
      ? ' · <span title="Planned hours against scheduled capacity for ' + esc_(head.label) +
        ". Recoverable hours are not shown for an unfinished window — they measure " +
        'hours already delivered.">planned <b>' + Math.round(pl.pct) + "%</b>" +
        (pl.none + pl.thin ? " · ▽ " + (pl.none + pl.thin) + " under-planned" : "") + "</span>"
      : "") +
    " → open the roster</div>" + reconcile;
  countUpTiles_();
}

/**
 * Count-up animation (Motion, spec §7) — runs ONCE per page load, only where
 * rAF exists (the render-smoke DOM stub has none — the whole feature is
 * invisible to it by design) and never under prefers-reduced-motion. Moved
 * here from the retired renderTiles_ (Task 16B) and generalised to scan BOTH
 * bands that now carry KPI tiles with a live count-up: the Flow band
 * (On-Time/Forecast/Quality/Cleared/Arrived/Lead Time/Throughput/Bug Count)
 * and the Capacity band's own Utilisation/Planned-Coverage tile. One shared
 * flag, not one per band, because the spec says "once per page load" — not
 * once per band. Both #flowTiles and #pulsePanel rewrite their innerHTML on
 * every render (renderFlow_/renderPulse_ above), so a count-up mid-flight
 * from a prior render can never corrupt a later one — the nodes it was
 * mutating are simply gone.
 */
function countUpTiles_() {
  if (countedUp_ || !window.requestAnimationFrame ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  countedUp_ = true;
  ["flowTiles", "pulsePanel"].forEach(function (id) {
    var bigs = document.getElementById(id).getElementsByClassName("big");
    Array.prototype.forEach.call(bigs, function (el) {
      var m = /^(\d+)(.*)$/.exec(el.textContent || "");
      if (!m) return;
      var target = +m[1], suffix = m[2], t0 = null;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / 700);
        el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + suffix;
        if (k < 1) window.requestAnimationFrame(step);
      }
      window.requestAnimationFrame(step);
    });
  });
}

/**
 * Deep-link from the Executive pulse into the Actions roster.
 *
 * `sig` carries the bucket that was clicked ("bad", "warn", …) so "3 need
 * action" lands on those 3 rather than on a 140-row table the reader then has
 * to re-find them in. No argument = the whole roster, and it CLEARS any
 * previous narrowing — otherwise the general entry point would silently inherit
 * a filter set minutes ago on another tab.
 */
function openRoster_(sig) {
  STATE.rosterSort = "opp"; STATE.rosterDesc = false;
  STATE.sigFilter = sig || "";
  switchView_("actions");
}

/** Data-trust strip (spec §4.4): four fill-vs-gate tiles picked BY KEY from
    gapsRows_ — one list of definitions for the queue and the strip.
    Deliberately org-wide + unfiltered like the old Hygiene view (ORG tag). */
function renderTrust_() {
  var el = document.getElementById("trustPanel");
  var A = analysisHead_();
  // Field fill is measured over work RESOLVED in the window, so a forward week
  // has nothing to grade. The strip falls back to the last COMPLETE period and
  // says which one — a data-trust panel reading 0% because the week has not
  // happened would be read as a collapse in data quality.
  var head = A.phase === "plan" ? (A.done[A.done.length - 1] || { label: "—", isos: [] }) : A.head;
  var fellBack = A.phase === "plan";
  var h = hygieneFor_(head.isos), pp = hygienePeopleFor_(head.isos);
  var byKey = {};
  gapsRows_(h, pp).forEach(function (g) { if (g.key) byKey[g.key] = g; });
  // "attr" drops out of this strip on its own once the roster join is clean:
  // gapsRows_ retires a 100% row, so byKey has no entry and the tile renders as
  // "". Listed here deliberately — the strip reinstates it the moment the gap
  // comes back, with no edit.
  var order = ["est", "due", "logged", "attr"];
  var titles = { est: "Estimate coverage", due: "Due-date fill", logged: "Logged fill", attr: "Roster join" };
  el.innerHTML = '<h3>Can we publish these numbers? ' + scopeTag_("org") + "</h3>" +
    '<p class="cellSub">Each metric needs its gate met before it goes on a slide.</p>' +
    '<div class="trustRow">' + order.map(function (k) {
      var g = byKey[k];
      if (!g) return "";
      var pct = g.value === null ? null : Math.round(g.value * 100);
      var col = pct === null ? "var(--muted)"
        : g.value >= g.gate ? "var(--c-good)"
        : g.value >= g.gate - 0.10 ? "var(--c-warn)" : "var(--c-bad)";
      return '<div class="trustItem" title="' + esc_((g.note || "") + " Blocks: " + g.blocks) + '">' +
        '<div class="cellSub">' + esc_(titles[k]) + "</div>" +
        '<div class="trustVal" style="color:' + col + '">' + (pct === null ? "—" : pct + "%") +
        ' <span class="cellSub">/ ' + Math.round(g.gate * 100) + "</span></div>" +
        '<div class="trustBar"><i style="width:' + (pct || 0) + "%;background:" + col + '"></i></div>' +
        '<div class="cellSub">' + esc_(g.detail || "") + "</div></div>";
    }).join("") + "</div>" +
    '<div class="cellSub">Gate = the coverage each published metric needs. The full queue — every gap, ' +
    "its owner requirement and committed week — lives on the 🎯 Actions tab." +
    (fellBack ? " Measured over <b>" + esc_(head.label) + "</b>, the last complete period: " +
      "field fill is counted on work that has been resolved, so a planning window has none." : "") +
    "</div>";
}

/**
 * ── §7 THE SHELF renderer ────────────────────────────────────────────────────
 * Dashed-border list, one row per shelfRows_() entry. NO owner column (D9) —
 * the object shelfRows_ returns doesn't even carry one to accidentally print.
 */
function renderShelf_() {
  var el = document.getElementById("shelfPanel");
  if (!el) return;
  var rows = shelfRows_();
  if (!rows.length) {
    el.innerHTML = '<h3>📭 Not measured this week ' + scopeTag_("org") + "</h3>" +
      '<div class="emptyState">Nothing on the shelf — every registered metric is publishing.</div>';
    return;
  }
  el.innerHTML = '<h3>📭 Not measured this week ' + scopeTag_("org") + "</h3>" +
    '<p class="cellSub">Built from the registry, the sample floor and feed availability — not a ' +
    "hand-written list, so a metric that quietly drops to a couple of samples cannot keep sitting " +
    "on a card looking authoritative.</p>" +
    '<ul style="list-style:none;padding:0;margin:0">' +
    rows.map(function (r) {
      return '<li style="border:1px dashed var(--border);border-radius:8px;padding:8px 10px;' +
        'margin-bottom:6px"><b>' + esc_(r.name) + "</b> — " + esc_(r.why.join("; ")) +
        '<div class="cellSub">Clears when: ' + esc_(r.clears) + "</div></li>";
    }).join("") + "</ul>";
}

/**
 * Little's Law (L = λW) sanity check on the queue: does the measured open
 * inventory roughly match what the measured clearing rate (λ) and the
 * measured median lead time (W) would predict? Every figure here is read off
 * MODEL — there is no hand-typed threshold, so a change to either buckets
 * feed changes what this prints on the next render, unlike the prototype's
 * literal "1 person on leave is not credible" line, which would have been
 * wrong the very next month with nothing to notice.
 * @returns {{measured:?number, rate:?number, leadWeeks:?number, predicted:?number}}
 */
function littlesLawCheck_() {
  var q = MODEL.queue || {};
  var asg = q.assigned || {}, un = q.unassigned || {};
  var unItems = (un.items === null || un.items === undefined) ? 0 : un.items;
  var measured = (asg.items || 0) + unItems;
  var rate = MODEL.meta.clearRateMedian || null;
  var isos = analysisHead_().head.isos;
  var b = bucketsFor_(MODEL.leadTimeBuckets || [], isos);
  var leadWeeks = (b.days && b.days.length) ? flowMedian_(b.days) / 7 : null;
  var predicted = (rate && leadWeeks !== null) ? rate * leadWeeks : null;
  return { measured: measured, rate: rate, leadWeeks: leadWeeks, predicted: predicted };
}

/** People-signals reconciliation sentence — the SAME two computed quantities
    the pulse panel's own reconcile line already proves against each other
    (signalSummary_'s bucket sum vs filteredPeople_().length), stated again
    here as a computed fact rather than the prototype's collided
    `[object Object]` "people" caveat. */
function signalsReconcileText_(isos) {
  var s = signalSummary_(isos);
  if (!s.available) return "People signals are not in this payload.";
  var pop = filteredPeople_().length;
  var acct = s.good + s.warn + s.bad + s.small + s.learn + (s.na || 0);
  return acct === pop
    ? acct + " of " + pop + " people accounted for across the signal buckets."
    : acct + " of " + pop + " people accounted for — " + (pop - acct) + " missing from every bucket.";
}

/** Every registry `deviations` entry, rendered from source (never re-typed) —
    the standing record of accepted gaps between a published number and the
    Metrics Dictionary definition. */
function registryDeviationsHtml_() {
  var reg = (MODEL.meta.registry || {}).metrics || {};
  var lines = [];
  Object.keys(reg).forEach(function (id) {
    var d = reg[id].deviations || [];
    if (d.length) lines.push({ name: reg[id].name || id, deviations: d });
  });
  if (!lines.length) return '<div class="cellSub">No accepted deviations recorded.</div>';
  return '<ul style="margin:4px 0 0;padding-left:18px">' + lines.map(function (l) {
    return "<li><b>" + esc_(l.name) + "</b>: " +
      l.deviations.map(function (d) { return esc_(d); }).join(" ") + "</li>";
  }).join("") + "</ul>";
}

/**
 * ── §8 DATA TRUST DETAIL ─────────────────────────────────────────────────────
 * Collapsed <details> — computed, not prose. Little's Law check, the
 * people-signals reconciliation, and every registry deviation, all read off
 * the model at render time.
 */
function renderTrustDetail_() {
  var el = document.getElementById("trustDetail");
  if (!el) return;
  var A = analysisHead_();
  var ll = littlesLawCheck_();
  var llText = (ll.predicted === null || ll.rate === null)
    ? "Not enough data yet for a Little's Law check — needs a published clearing rate and at " +
      "least one measurable lead time."
    : "L = λW: measured open inventory is " + nfDh_(ll.measured) + " items. λ (the " +
      "clearing rate) is " + nfDh_(Math.round(ll.rate)) + "/wk and W (median lead time) is " +
      n1Dh_(ll.leadWeeks) + " weeks, predicting ≈" + nfDh_(Math.round(ll.predicted)) +
      " items — " +
      (Math.abs(ll.measured - ll.predicted) <= ll.predicted * 0.5
        ? "broadly consistent with the measured queue."
        : "a material gap against the measured queue, worth a second look.");
  el.innerHTML =
    "<details><summary>Data trust detail " + scopeTag_("org") + "</summary>" +
    '<div class="cellSub" style="margin-top:8px"><b>Little’s Law check</b> — ' +
      esc_(llText) + "</div>" +
    '<div class="cellSub" style="margin-top:8px"><b>People-signals reconciliation</b> — ' +
      esc_(signalsReconcileText_(A.head.isos)) + "</div>" +
    '<div class="cellSub" style="margin-top:8px"><b>Registry deviations</b></div>' +
    registryDeviationsHtml_() +
    "</details>";
}

/**
 * A metric restricted to a named set of people.
 *
 * ⚠ THIS FUNCTION MUST NEVER CONTAIN A FORMULA. It used to, and every one of
 * them had drifted from the METRICS_ accessor it was shadowing:
 *   · quality fell through to forecastBuckets and published forecast-band
 *     numbers under a Quality/Rework label;
 *   · forecast returned nWithin/n (the ±10% band) while the card showed the
 *     Dictionary mean;
 *   · util divided by availCov (net) while the card divided by capCov (gross).
 * So a Region bar and the tile directly above it disagreed on three of four
 * metrics, each pair internally consistent and mutually contradictory.
 *
 * The fix is structural, not three patches: scope the POPULATION, then call the
 * one accessor. `SCOPE_NAMES_` is read by passesFilters_, which is what both
 * utilFor_ and bucketsFor_ already run every person through — so every metric,
 * including any added later, is scoped by construction and can only ever have
 * one definition.
 */
function scopedMetric_(m, isos, nameSet) {
  SCOPE_NAMES_ = nameSet;
  try {
    return m.value(isos);
  } finally {
    // finally, not a trailing assignment: an exception inside an accessor would
    // otherwise leave the whole dashboard scoped to one bar's population.
    SCOPE_NAMES_ = null;
  }
}

/**
 * Triage flags for one person (director feedback: the grid is a roster, the
 * manager's question is "who needs me this week"). Each flag states the
 * IMPLICATION, not just the number. New hires skip zero-tracked (ramping).
 */
function personExceptions_(p) {
  // On leave = no availability expected: zero-tracked / under-planned /
  // overloaded flags would all misread the absence as a delivery problem.
  if (p.onLeave) return [];
  // Interns carry no triage flags — "zero-tracked" or "under-planned" on
  // someone who is here to learn reads as a performance verdict it isn't.
  if (p.isIntern) return [];
  var ex = [];
  var hi = MODEL.meta.headlineIso;
  var w = p.weeks[hi];
  var futureAvail = 0, futurePlanned = 0;
  MODEL.meta.gridWeeks.forEach(function (g) {
    if (g.status !== "plan") return;
    var fw = p.weeks[g.iso];
    if (!fw) return;
    futureAvail += fw.avail;
    futurePlanned += fw.cap > 0 ? Math.min(fw.planned, fw.avail) : fw.planned;
  });
  var backlogOver = MODEL.meta.jiraAvailable && p.backlog &&
    (futureAvail - p.backlog.remHrs) < 0;
  if ((w && w.cap > 0 && w.tracked > w.cap) || backlogOver) {
    ex.push({ sev: 3, icon: "⚠", label: "overloaded",
      why: backlogOver
        ? "backlog ~" + r1_(p.backlog.remHrs) + "h vs " + r1_(futureAvail) +
          "h available over the next weeks — needs offloading or re-planning"
        : "tracked " + r1_(w.tracked) + "h against " + r1_(w.cap) + "h capacity in " +
          hi + " — real overtime" });
  }
  // PLAN_CLIFF_, not a second literal 0.5: the Planned Coverage card and the
  // roster's Plan column count "under-planned" people with this same line, and
  // three copies of a threshold is three places for it to drift.
  if (futureAvail > 0 && futurePlanned < futureAvail * PLAN_CLIFF_) {
    ex.push({ sev: 2, icon: "▽", label: "under-planned",
      why: "only " + r1_(futurePlanned) + "h planned of " + r1_(futureAvail) +
        "h available over the next weeks — coverage cliff, needs planning" });
  }
  if (w && w.avail > 0 && w.tracked === 0 && !p.newHire) {
    ex.push({ sev: 1, icon: "○", label: "zero tracked",
      why: "no time tracked in " + hi + " with " + r1_(w.avail) +
        "h available — worth a check-in" });
  }
  return ex;
}

// ── TRIAGE FLAGS AS A FILTER ─────────────────────────────────
//
// The attention line ("18 of 64 people need attention — ⚠ 4 overloaded · …")
// used to be a read-only caption. Every one of those counts is a question a
// manager wants to act on, so each is now a filter: click "4 overloaded" and the
// whole dashboard — cards, charts and grid — narrows to those four. Clicking it
// again clears it. This is the legend-as-control rule the user asked for: if a
// label states a count, clicking it should show you that count.

var FLAG_LABELS = {
  over:  { icon: "⚠", label: "overloaded",    sev: 3, key: "overloaded" },
  under: { icon: "▽", label: "under-planned", sev: 2, key: "under-planned" },
  zero:  { icon: "○", label: "zero tracked",  sev: 1, key: "zero tracked" },
};

/**
 * personExceptions_ walks the forward grid weeks for every person, and
 * passesFilters_ can be called once per person PER PERIOD inside utilFor_ — so
 * an unmemoized call turns one render into tens of thousands of week loops.
 * Flags depend only on the payload, never on the filters, so one cache per load
 * is correct. Cleared in loadData.
 */
function exceptionsOf_(p) {
  if (!MODEL._exCache) MODEL._exCache = {};
  if (!MODEL._exCache[p.name]) MODEL._exCache[p.name] = personExceptions_(p);
  return MODEL._exCache[p.name];
}

function hasFlag_(p, flag) {
  var want = FLAG_LABELS[flag];
  if (!want) return true;
  return exceptionsOf_(p).some(function (x) { return x.label === want.key; });
}

/** Toggle a triage flag filter (clicking the active one clears it). */
function toggleFlag_(flag) {
  STATE.flag = STATE.flag === flag ? "" : flag;
  buildFilters_();   // the audience changed, so every other option list re-cascades
  renderAll_();
}

function r1_(v) { return Math.round((Number(v) || 0) * 10) / 10; }

function setMetric_(id) {
  STATE.metric = id;
  renderAll_();      // the Executive comparison chart follows STATE.metric
}

// ── 👥 SIGNALS ROSTER RENDER (spec §5.2, 2026-08-05) ─────────────────────────
// Default sort: biggest opportunity first — most-red overall, then most
// offending records. The Executive pulse deep-links here with this sort.
// Sort order for the roster's "biggest opportunity first" default. `learn`
// (intern) sits BEYOND `na` on purpose: an ungraded row is not an opportunity,
// and a 🎓 row must never be able to surface at the top of an action queue.
var ROSTER_RANK_ = { bad: 0, warn: 1, small: 2, good: 3, na: 4, learn: 5 };
/** The Hours column's sorter has no other way to know which period the roster
    is showing — renderRoster_ refreshes this to head.isos before every sort
    (Task 6, 2026-08-05). */
var ROSTER_ISOS_ = null;
/** Which phase of window the roster is rendering — "done" | "now" | "plan".
    Set by renderRoster_ before the header and sorters run, for the same reason
    ROSTER_ISOS_ exists: a column's `when`/`sort` is called from a context that
    has no access to the head. */
var ROSTER_PHASE_ = "done";
var ROSTER_COLS_ = {
  person: { label: "Person", sort: function (a, b) { return a.p.name.localeCompare(b.p.name); } },
  // "n" told the reader nothing, and it is the one column on this row that is NOT
  // a grade — it is the widest population here, epics included, while every cell
  // beside it divides by something narrower. A reader comparing "89% · 2 missing"
  // against "79" concluded the dashboard had lost 77 tickets (user 2026-08-10),
  // which is a reasonable thing to conclude from a letter with no noun.
  // The name follows the population toggle, because the same number means two
  // different things on the two views.
  n:      { label: "Issues",
            labelOf: function (open) { return open ? "Open issues" : "Resolved"; },
            sort: function (a, b) { return b.n - a.n; } },
  due:    { label: "Due date", sig: "due" },
  est:    { label: "Estimate", sig: "est" },
  logged: { label: "Logged",   sig: "logged" },
  // Commercial-readiness signals (2026-08-06) — see SIGNAL_FIELDS_ for why these
  // three are graded despite gating no published metric.
  link:   { label: "Epic link",    sig: "link" },
  bill:   { label: "Billable tag", sig: "bill" },
  start:  { label: "Start date",   sig: "start" },
  // Progress: how far through the load, not whether its fields are filled. Sorts
  // LEAST-progressed first when descending is off, because the row that needs a
  // conversation is the one carrying 60 estimated hours with 2 logged.
  prog:   { label: "Progress", sort: function (a, b) {
    function frac(r) {
      var t = r.t || {};
      return (t.estSec > 0) ? t.spentSec / t.estSec : null;   // unestimated → last
    }
    var fa = frac(a), fb = frac(b);
    if (fa === null && fb === null) return 0;
    if (fa === null) return 1;
    if (fb === null) return -1;
    return fa - fb;
  } },
  // Hours: billable share, most first. Ramping new hires and on-leave people
  // (same exclusion as the recoverable-hours pulse) sort last regardless of
  // direction — their idle capacity is not a recoverable signal to rank on.
  hours:  { label: "Hours",  sort: function (a, b) {
    function share(r) {
      if (r.p.newHire === true || r.p.onLeave === true) return null;   // ineligible → last
      var w = aggWeeks_(r.p, ROSTER_ISOS_);
      return w && w.tracked > 0 ? w.billable / w.tracked : null;
    }
    var sa = share(a), sb = share(b);
    return (sb === null ? -1 : sb) - (sa === null ? -1 : sa);
  } },
  // PLAN — only on an unfinished window (user request 2026-08-06: "confirm
  // planning"). Deliberately conditional rather than always-on: over a closed
  // period the column would show a plan nobody can change any more, which is
  // history dressed as an action. Sorts LEAST-COVERED FIRST, because the whole
  // reason to open a forward week is to find the people with nothing on them.
  plan:   { label: "Plan", when: function () { return ROSTER_PHASE_ !== "done"; },
    sort: function (a, b) {
      function cov(r) {
        var s = planFor1_(r.p, ROSTER_ISOS_);
        return s.cap > 0 ? s.planned / s.cap : null;    // no capacity → last
      }
      var ca = cov(a), cb = cov(b);
      if (ca === null && cb === null) return 0;
      if (ca === null) return 1;
      if (cb === null) return -1;
      return ca - cb;
    } },
  opp:    { label: "Overall", sort: function (a, b) {
    return (ROSTER_RANK_[a.overall] - ROSTER_RANK_[b.overall]) || (b.miss - a.miss);
  } },
};
// Signal columns share one sorter: worst grade first, most missing first.
Object.keys(ROSTER_COLS_).forEach(function (k) {
  var c = ROSTER_COLS_[k];
  if (c.sig) c.sort = function (a, b) {
    return (ROSTER_RANK_[a.sig[c.sig].cls] - ROSTER_RANK_[b.sig[c.sig].cls]) ||
           (b.sig[c.sig].miss - a.sig[c.sig].miss);
  };
});

/**
 * The 👥 pulse's five buckets, as roster filters. ORDER IS THE READING ORDER of
 * the Executive pulse — the chip strip has to be recognisably the same list the
 * pulse just showed, or the deep-link lands somewhere that looks unrelated.
 *
 * `match` takes a roster row (personSignalRows_ output) so a bucket is defined
 * ONCE: signalSummary_'s counts and the chip's filter can never disagree about
 * what "ungraded (small n)" means, which is exactly the class of drift that
 * makes a count say 4 and its own filter show 3.
 */
var SIG_FILTERS_ = [
  { k: "bad",   label: "Need action", dot: '<span class="sigDot sigBad">●</span> ',
    tip: "At least one field graded red against its gate.",
    match: function (r) { return r.overall === "bad"; } },
  { k: "warn",  label: "Watch", dot: '<span class="sigDot sigWarn">●</span> ',
    tip: "Worst field is amber — inside 10 points of its gate.",
    match: function (r) { return r.overall === "warn"; } },
  { k: "good",  label: "On track", dot: '<span class="sigDot sigGood">●</span> ',
    tip: "Every graded field is at or above its gate.",
    match: function (r) { return r.overall === "good"; } },
  { k: "small", label: "Ungraded", dot: '<span class="sigDot sigSmall">●</span> ',
    tip: "Has issues but fewer than the minimum to grade — shown, never counted red.",
    match: function (r) { return r.overall === "na" && r.n > 0; } },
  { k: "learn", label: "In training", dot: "🎓 ",
    tip: "Interns (level I1) — shown so they can learn the standard, deliberately never graded.",
    match: function (r) { return r.overall === "learn"; } },
];

/** The filter predicate for the active chip — identity when nothing is set. */
function sigFilterMatch_(r) {
  if (!STATE.sigFilter) return true;
  for (var i = 0; i < SIG_FILTERS_.length; i++) {
    if (SIG_FILTERS_[i].k === STATE.sigFilter) return SIG_FILTERS_[i].match(r);
  }
  return true;   // unknown key behaves as "all" rather than emptying the table
}

/** Human label for the active chip — used in the "showing N of M" line and the
    empty state, so both name the filter rather than saying "a filter". */
function sigFilterLabel_() {
  for (var i = 0; i < SIG_FILTERS_.length; i++) {
    if (SIG_FILTERS_[i].k === STATE.sigFilter) return SIG_FILTERS_[i].label;
  }
  return "All";
}

/** Click a chip: same one again clears it, so the strip is never a trap. */
function setSigFilter_(k) {
  STATE.sigFilter = STATE.sigFilter === k ? "" : k;
  renderRoster_();
}

/**
 * The chip strip. Counts are computed over the roster BEFORE the signal filter
 * (the same rule the attention-flag legend follows): a chip that zeroed every
 * other chip on click would let you narrow but never switch, and the strip
 * would stop reading as a picture of the whole roster.
 */
function sigChipsHtml_(rows) {
  var chips = SIG_FILTERS_.map(function (f) {
    var n = rows.filter(f.match).length;
    // Zero buckets stay VISIBLE but disabled — a strip that changes length as
    // you click destroys the sense that it is one fixed picture (the same rule
    // the cascading dropdowns follow).
    var on = STATE.sigFilter === f.k;
    return '<button class="chip sigChip' + (on ? " on" : "") + (n ? "" : " off") + '"' +
      (n ? ' onclick="setSigFilter_(\'' + f.k + '\')"' : " disabled") +
      ' title="' + esc_(f.tip) + (n ? " Click to show only these." : " None in this slice.") + '">' +
      f.dot + esc_(f.label) + " " + n + "</button>";
  }).join("");
  var total = rows.length;
  return '<div class="sigChips">' +
    '<button class="chip sigChip' + (STATE.sigFilter ? "" : " on") + '"' +
      ' onclick="setSigFilter_(\'\')" title="Every person in this slice.">All ' + total + "</button>" +
    chips + "</div>";
}

function setRosterSort_(col) {
  // A column with no sorter (hours had none until Task 6 filled it in) is
  // click-inert rather than a crash: rows.sort(null) throws a TypeError, and
  // that rule has to hold for ANY future sorter-less column, not just the one
  // that used to be true of today (review finding 2026-08-05).
  if (!ROSTER_COLS_[col] || !ROSTER_COLS_[col].sort) return;
  if (STATE.rosterSort === col) STATE.rosterDesc = !STATE.rosterDesc;
  else { STATE.rosterSort = col; STATE.rosterDesc = false; }
  renderRoster_();
}

/** One signal cell: dot + % together (FR-4.4 — colour never carries the verdict
    alone), plus the miss count when there is one. "na" = nothing to grade.
    g.pct === null (the Overall column's synthetic grade) renders the dot with
    no percentage — `null * 100` JS-coerces to 0, and a fabricated "0%" would
    read as a real measurement, exactly the misleading-signal class this
    dashboard exists to stamp out (review finding 2026-08-05). */
function sigCellHtml_(g) {
  if (g.cls === "na") return '<td class="tnum">—</td>';
  var pct = g.pct === null ? "" : " " + Math.round(g.pct * 100) + "%";
  var body = g.cls === "small"
    ? '<span class="sigDot sigSmall" title="Fewer than ' + signalMinN_() +
      ' issues — shown ungraded: one missing field on one ticket is not a signal (SIGNAL_MIN_N).">●</span>' + pct
    : g.cls === "learn"
    ? '<span class="sigDot sigLearn" title="Intern (level I1) — the number is shown so they can see ' +
      'the standard and learn it; it is deliberately not graded and moves no published rate.">●</span>' + pct
    : '<span class="sigDot sig' + g.cls.charAt(0).toUpperCase() + g.cls.slice(1) + '">●</span>' + pct;
  return '<td class="tnum">' + body +
    (g.miss ? ' <span class="cellSub">· ' + g.miss + " missing</span>" : "") + "</td>";
}

/** Every active person in the current population, RAG-graded on the same
    fields and gates as the 🧬 matrix. Population + sort both follow shared
    STATE, so the Open/Resolved chips on the matrix drive this table too. */
function renderRoster_() {
  var el = document.getElementById("rosterPanel");
  // SCROLL PRESERVATION. Every toggle rebuilds the panel's innerHTML, which
  // resets the .rosterWrap scroller to the top — so opening a row two thirds of
  // the way down threw the reader back to the first name and the list read as
  // though it had reordered itself (user 2026-08-06). The retired People grid
  // carried this exact guard for this exact reason; adding the capped scroller
  // for the sticky header reintroduced the bug it was written for.
  var wrapWas = el.querySelector ? el.querySelector(".rosterWrap") : null;
  var scrollTop = wrapWas ? wrapWas.scrollTop : 0;
  var scrollLeft = wrapWas ? wrapWas.scrollLeft : 0;
  var A = analysisHead_();
  var head = A.head;
  ROSTER_PHASE_ = A.phase;   // drives the conditional Plan column (see ROSTER_COLS_)
  var rows = personSignalRows_(head.isos);
  if (rows === null) {
    el.innerHTML = '<h3>👥 People signals</h3><div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
    return;
  }
  var open = STATE.typePop !== "resolved";
  var scopeTag = open ? scopeTag_("snap") : scopeTag_("period");
  // Fall back to opp whenever the resolved column has no sorter — not just
  // when the key is unrecognized. setRosterSort_'s click guard only protects
  // clicks; STATE.rosterSort can still be set directly (tests, a future
  // deep-link reader) to a RECOGNIZED key whose .sort is null (every column
  // has one today, "hours" included since Task 6 — but a future column may
  // not), and rows.sort(null) throws (review finding 2026-08-05).
  var col = ROSTER_COLS_[STATE.rosterSort];
  if (!col || !col.sort) col = ROSTER_COLS_.opp;
  ROSTER_ISOS_ = head.isos;   // the hours sorter's only way to know the period
  rows.sort(col.sort);
  if (STATE.rosterDesc) rows.reverse();
  // The chip strip counts the WHOLE slice; only the table below it narrows. Sort
  // first, then filter, so a narrowed table keeps the ranking it had — the rows
  // that were adjacent are still adjacent.
  var chips = sigChipsHtml_(rows);
  var shown = rows.filter(sigFilterMatch_);

  // Conditional columns (Plan, 2026-08-06) are filtered out of the HEADER here
  // and out of each ROW below. The two lists must move together — a header
  // without its cell shifts every value one column left, which is the quiet
  // kind of wrong that gets screenshotted.
  var showPlan = !!(ROSTER_COLS_.plan.when && ROSTER_COLS_.plan.when());
  var head_ = "<tr>" + Object.keys(ROSTER_COLS_).filter(function (k) {
    var c = ROSTER_COLS_[k];
    return !c.when || c.when();
  }).map(function (k) {
    var c = ROSTER_COLS_[k];
    // Progress follows the population like the signal columns (SNAP on the open
    // backlog, PERIOD on resolved) — it is computed from the same buckets. Hours
    // is always PERIOD: worklogs are period-shaped, a backlog snapshot has none.
    var tag = (c.sig || k === "opp" || k === "n" || k === "prog") ? " " + scopeTag
            : (k === "hours" || k === "plan") ? " " + scopeTag_("period") : "";
    return '<th class="' + (k === "person" ? "tname" : "tnum") + '" onclick="setRosterSort_(\'' + k + '\')" style="cursor:pointer"' +
      (c.sig ? ' title="' + esc_(sigFieldByKey_(c.sig).tip) + '"'
             // `n` needed a tooltip of its own (user 2026-08-10: "n = 79 but the
             // drill-down shows 1 ticket"). It is the widest population on the
             // row — epics included, ignored tickets included — and every cell
             // beside it divides by something narrower.
             : k === "n" ? ' title="' + esc_(open
                 ? "Every OPEN issue attributed to this person, epics included — a snapshot that " +
                   "follows the filters but not the period picker. It is deliberately wider than " +
                   "the list in the drill-down, which excludes epics (they roll up their children) " +
                   "and unstarted tickets with no due date (ignored by rule). Expand the row for " +
                   "the full breakdown. The Due date and Logged cells divide by narrower " +
                   "populations again — see their own tooltips."
                 : "Issues RESOLVED by this person in the selected period, epics included. The " +
                   "drill-down below shows today's open backlog instead, which follows no period.") + '"'
             : k === "plan" ? ' title="' + esc_("Hours planned in Tempo against scheduled " +
                 "capacity for this window, capped per week. Shown only while the window is " +
                 "still open, because a plan you can no longer change is history, not an " +
                 "action. Sorts least-covered first.") + '"'
             : k === "prog" ? ' title="' + esc_(open
                 ? "Hours logged against hours estimated on this person's OPEN work — how far through the load they are, not whether its fields are filled. Over 100% means the estimate is spent and the ticket is still open."
                 : "Hours logged against hours estimated on work RESOLVED in this period — what it took against what was quoted.") + '"'
             : "") + ">" +
      esc_(c.labelOf ? c.labelOf(open) : c.label) + tag +
      (STATE.rosterSort === k ? (STATE.rosterDesc ? " ▾" : " ▴") : "") + "</th>";
  }).join("") + "</tr>";

  var body = shown.map(function (r) {
    // Job title as a visible tag under the name (user request 2026-08-05 —
    // the retired headroom table carried it, the roster inherits it): grade
    // code stripped for reading, the full roster string in the tooltip/CSV.
    // The WHOLE ROW is the control, not just the name (user 2026-08-06). A row
    // that only responds on one word reads as broken — you aim at the number you
    // want explained and nothing happens. The caret flips so the row also states
    // whether it is currently open.
    var nameArg = esc_(r.p.name).replace(/'/g, "\\'");
    return '<tr class="rosterRow" onclick="toggleRosterDetail_(\'' + nameArg + '\')">' +
      '<td class="tname"><span class="rosterName">' +
        (STATE.openDetail[r.p.name] ? "▾ " : "▸ ") +
        esc_(r.p.name) + "</span>" + personStateBadges_(r.p) +
        (r.p.jobTitle ? '<div class="cellSub" title="' + esc_(r.p.jobTitle) + '">' +
          esc_(trunc_(jobTitleDisp_(r.p.jobTitle), 26)) + "</div>" : "") + "</td>" +
      '<td class="tnum">' + r.n + "</td>" +
      sigCellHtml_(r.sig.due) + sigCellHtml_(r.sig.est) + sigCellHtml_(r.sig.logged) +
      sigCellHtml_(r.sig.link) + sigCellHtml_(r.sig.bill) + sigCellHtml_(r.sig.start) +
      '<td class="tnum">' + progCellHtml_(r, open) + "</td>" +
      '<td class="tnum">' + hoursCellHtml_(r.p, head.isos) + "</td>" +
      // Cell order must match ROSTER_COLS_ key order exactly — plan sits between
      // hours and Overall in both.
      (showPlan ? planCellHtml_(r.p, head.isos) : "") +
      sigCellHtml_({ cls: r.overall, pct: null, miss: r.miss }) +
      "</tr>" + rosterDetailRow_(r.p, head);
  }).join("");

  el.innerHTML =
    '<h3>👥 People signals — every active person in this slice</h3>' +
    '<p class="cellSub">' + (open ? "Open backlog — fix these and next period moves. "
                                   : "Resolved in " + esc_(head.label) + ". ") +
    "Each cell: the share of the person's issues carrying that field, graded against " +
    "the field's own gate — the same gates as the 🧬 matrix below. Grey = fewer than " + signalMinN_() +
    " issues (not graded). Click a header to sort; default is biggest opportunity first.</p>" +
    // The two columns that do NOT divide by n have to say so where the table is
    // read, not only in a hover tip: a reader comparing this cell against the n
    // beside it will otherwise conclude the percentage is wrong.
    // The column names and the denominators they do NOT share. Stated on the page
    // rather than in tooltips only: this table is usually read as a PNG, where
    // hover does not exist, and the mismatch between the count and the percentages
    // beside it is the single thing readers have got wrong about this panel.
    (open
      ? '<p class="cellSub"><b>Open issues</b> is a count, not a grade: every open ticket ' +
        "attributed to this person, <b>epics included</b>, as a snapshot that follows the filters " +
        "but not the period picker. Expand a row to see it broken down — what is listed, what is " +
        "ignored by rule, and how many are epics. " +
        "<b>Due date</b> and <b>Logged</b> deliberately divide by less than that count " +
        "(managers' feedback 2026-08-10). <b>Logged</b> is measured over work " +
        "that has STARTED — status category In Progress — because a ticket nobody has picked up is " +
        "expected to carry no worklog. <b>Due date</b> is measured over work that has started " +
        "<i>or already carries a date</i>: an undated To&nbsp;Do ticket is ignored entirely — not " +
        "delayed, not missing — while <b>anything with a date is tracked whatever its status</b>. " +
        "Epics are the exception to that first rule and are audited separately in 🚩 below: every " +
        "epic is expected to carry a date, To&nbsp;Do included.</p>"
      : "") +
    // The Plan column only exists on an open window, so it has to introduce
    // itself when it appears rather than sit there as an unexplained new column.
    (showPlan
      ? '<p class="cellSub"><b>Plan ' + esc_(head.label) + "</b>: hours planned in Tempo " +
        "against scheduled capacity for the selected window — the column to sort by when " +
        "the question is who is not covered yet. <span class=\"sigDot sigBad\">●</span> no plan · " +
        '<span class="sigDot sigWarn">●</span> under ' + Math.round(PLAN_CLIFF_ * 100) + "% · " +
        '<span class="sigDot sigGood">●</span> covered. It disappears once the window closes: ' +
        "a plan you can no longer change is history, not an action.</p>"
      : "") +
    // The Hours bar is four colours now, and colour must never be the only
    // channel that carries a meaning (tooltips are hover-only — they do not
    // exist on a PNG of this table, which is how it usually gets read).
    '<p class="cellSub">Hours: ' +
    '<span class="lgd"><i style="background:var(--seg-bill)"></i>billable</span>' +
    '<span class="lgd"><i style="background:var(--seg-nonbill)"></i>non-billable work</span>' +
    '<span class="lgd"><i style="background:var(--seg-off)"></i>time off</span>' +
    '<span class="lgd"><i style="background:var(--seg-idle)"></i>idle</span>' +
    ' — time off is tracked in Tempo and sits INSIDE non-billable by rule, so it is drawn ' +
    "apart: a high non-billable figure that is really a holiday is not a delivery signal. " +
    "🎓 intern (shown, never graded) · 🌱 ramping new hire · 🏖 on leave.</p>" +
    chips +
    // A filter that empties the table must say so and offer the way back —
    // an empty <tbody> under a full chip strip reads as a broken table.
    (shown.length === 0
      ? '<div class="emptyState">No one in this slice is <b>' + esc_(sigFilterLabel_()) +
        '</b>. <a href="#" onclick="setSigFilter_(\'\');return false">Show all ' + rows.length + "</a>.</div>"
      : // thead/tbody are load-bearing here, not tidiness: the sticky header rule is
        // scoped to `thead th` so the detail rows' nested tables can never inherit it.
        '<div class="gwrap rosterWrap"><table class="hyg tmx rosterTbl">' +
          "<thead>" + head_ + "</thead><tbody>" + body + "</tbody></table></div>") +
    // State the narrowing under the table too: the chip is at the top and a
    // filtered roster scrolled to the bottom otherwise looks like the whole org.
    (STATE.sigFilter && shown.length
      ? '<p class="cellSub">Showing ' + shown.length + " of " + rows.length +
        " — filtered to <b>" + esc_(sigFilterLabel_()) + "</b>. The ⬇ CSV exports this filtered view.</p>"
      : "");

  // Put the reader back where they were — see the note at the top of this
  // function. Restored on the NEW node, which only exists after the assignment
  // above; a scroll offset past the new content height is clamped by the
  // browser, so a re-render that shortens the table cannot strand the view.
  var wrapNow = el.querySelector ? el.querySelector(".rosterWrap") : null;
  if (wrapNow) { wrapNow.scrollTop = scrollTop; wrapNow.scrollLeft = scrollLeft; }
}

/**
 * How far through the load this person is — logged hours against estimated
 * hours, over the population the roster is showing.
 *
 * This is the question the field-fill columns cannot answer (user 2026-08-06:
 * "we can even know the amount of progress they have in all their in-progress
 * work"). "14 of 18 issues carry logged time" says nothing about whether the
 * work is nearly done or barely started.
 *
 * Read differently by population, and the header's scope tag says which:
 *   OPEN     — burn so far on work still in flight. Over 100% is the useful
 *              signal: the estimate is spent and the ticket is still open.
 *   RESOLVED — consumption on finished work: what it actually took against what
 *              was quoted. The same arithmetic, a retrospective question.
 *
 * Estimated hours are the DENOMINATOR, so a person carrying unestimated work
 * gets "—" rather than a fabricated ratio: the gap is the Estimate column's to
 * report, not this one's. Showing the two hour figures beside the percentage is
 * deliberate — 90% of 2h and 90% of 200h are not the same conversation.
 */
function progCellHtml_(r, open) {
  var t = r.t || {};
  var estH = (Number(t.estSec) || 0) / 3600, spentH = (Number(t.spentSec) || 0) / 3600;
  if (!(estH > 0)) {
    // No estimate anywhere in the slice: say why it is blank rather than print a
    // zero. Logged hours with no estimate is still worth stating — it is spend
    // with no baseline, which is exactly the pricing gap the Estimate column grades.
    return spentH > 0
      ? '<span class="cellSub" title="' + r1_(spentH) +
        'h logged against no estimate at all — spend with no baseline to compare it to. ' +
        'The Estimate column owns this gap.">' + r1_(spentH) + "h · no est</span>"
      : "—";
  }
  var pct = Math.round(spentH / estH * 100);
  // Over-burn is flagged, never coloured green-to-red on a scale: an estimate
  // exceeded on OPEN work is a live overrun, the same number on RESOLVED work is
  // a closed one. Only the open reading gets a warning class.
  var cls = (open && pct > 100) ? "dDown" : "";
  var tip = open
    ? r1_(spentH) + "h logged against " + r1_(estH) + "h estimated across " + t.n +
      " open item" + (t.n === 1 ? "" : "s") + " (" + t.wip + " in progress). " +
      (pct > 100 ? "Past estimate and still open — a live overrun."
                 : "Burn so far on work still in flight.")
    : r1_(spentH) + "h logged against " + r1_(estH) + "h estimated across " + t.n +
      " resolved item" + (t.n === 1 ? "" : "s") + ". What the work took against what was quoted.";
  return '<span class="' + cls + '" title="' + esc_(tip) + '">' + pct + "%</span>" +
    ' <span class="cellSub">· ' + r1_(spentH) + "/" + r1_(estH) + "h</span>";
}

// ── 🌊 BACKLOG HEALTH PANEL (2026-08-06) ─────────────────────────────────────
// Display metadata for the server's BACKLOG_SIGNALS_ table. Kept as a SEPARATE
// list from the predicates on purpose: the server owns what a signal MEANS, the
// client owns how it reads. A signal the server stops emitting simply vanishes
