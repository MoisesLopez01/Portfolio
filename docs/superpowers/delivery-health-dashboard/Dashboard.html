}

/** Set the value-focus lens (header chip strip). The People grid's own
    clickable bar legend — the lens's other entry point — was removed with
    the grid (Task 3, 2026-08-05); STATE.focus and this setter stay for the
    roster that replaces it (Task 5). */
function setFocus_(k) {
  if (STATE.focus === k) return;
  STATE.focus = k;
  buildFocusChips_();
  renderScope_();
  renderAll_();
}

function buildFocusChips_() {
  var fc = document.getElementById("focusChips");
  fc.innerHTML = "";
  ["plan", "billable", "nonbill"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.focus === k) ? " on" : "");
    b.textContent = FOCUS_LABELS[k];
    b.onclick = function () { setFocus_(k); };
    fc.appendChild(b);
  });
}

/** Person's family label for the filter (blank roster family → Uncatalogued). */
function famName_(p) { return p.jobFamily || "Uncatalogued"; }

/** Roster job titles arrive as "07.M5.1 - Manager, Service Delivery" or
    "09.P3.Consultant" — the leading grade code is roster plumbing, not a
    title. Strip it for display; the full string stays in the tooltip and in
    the CSV. A title without the code prefix passes through untouched. */
function jobTitleDisp_(t) {
  t = String(t || "").trim();
  var clean = t.replace(/^\d{1,3}\.\s*(?:[A-Za-z]\d+(?:\.\d+)*)?[\s.\-–—]*/, "").trim();
  return clean || t;
}

// ── CASCADING FILTERS ────────────────────────────────────────
//
// Every audience dimension is declared once here. Each dropdown/chip strip is
// then populated from the people who pass every OTHER dimension — pick AMER and
// the Team, PM and Job-family lists collapse to the teams, PMs and families that
// actually exist in AMER. Clear it and the full lists return, so scenarios can be
// built up and unwound without ever landing on a combination that selects nobody
// by accident (user request 2026-08-03).
//
// Two rules make it safe rather than merely clever:
//   1. The ACTIVE value is always listed, even at zero — a selection may never
//      silently vanish from the control that set it.
//   2. Values with no one in the current slice are shown DISABLED under a
//      separate group, never deleted. A list that changes length under you is
//      how people lose trust in a filter.

/**
 * ── UNTAGGED BUCKETS — why every dimension needs one ──
 *
 * Region and Job family are single-valued and already have server-side
 * fallbacks ("Unassigned", "Uncatalogued"), so every person lands somewhere.
 * Team and PM are MEMBERSHIP LISTS and can be empty — and an empty list belongs
 * to no bucket at all.
 *
 * That silently broke the Executive comparison chart (user-reported 2026-08-03,
 * "charts do not show all records — we are missing PMs and Teams"): a person on
 * no team contributed to no bar, so the chart quietly described a subset of the
 * population with nothing on screen saying so. Ten untagged people out of forty
 * is a chart that is 25% wrong and looks complete.
 *
 * So an empty list resolves to an explicit bucket instead. It is a real,
 * selectable value everywhere — filter, dropdown, chart, drill-through — because
 * "who has no PM?" is a question worth being able to ask, and because the bars
 * must add up to the population or the chart is lying by omission.
 */
var UNTAGGED_ = { team: "(No team)", pm: "(No PM)" };

/** True when a value is one of the untagged sentinels (styled + sorted apart). */
function isUntagged_(val) {
  for (var k in UNTAGGED_) if (UNTAGGED_[k] === val) return true;
  return false;
}

var FILTER_DIMS = {
  region: { label: "region",     vals: function (p) { return [p.region]; },
            all: function () { return MODEL.meta.regions || []; } },
  team:   { label: "team",
            vals: function (p) {
              var t = p.teams || [];
              return t.length ? t : [UNTAGGED_.team];
            },
            all: function () { return MODEL.meta.teams || []; } },
  pm:     { label: "PM",
            vals: function (p) {
              var m = p.pms || [];
              return m.length ? m : [UNTAGGED_.pm];
            },
            all: function () { return MODEL.meta.pms || []; } },
  family: { label: "job family", vals: function (p) { return [famName_(p)]; },
            all: function () { return MODEL.meta.families || []; } },
};

/**
 * Does this person carry `val` on dimension `dim`?
 *
 * ONE membership test, used by the filter predicate, the option counts and the
 * comparison chart's row members alike. Before this each had its own inline
 * `p.teams.indexOf(...)`, which is exactly how the untagged bucket could exist
 * in the option list while matching nobody in the filter.
 */
function dimMatch_(p, dim, val) {
  return FILTER_DIMS[dim].vals(p).indexOf(val) !== -1;
}

/**
 * THE filter predicate — every filter is universal (user decision 2026-07-31):
 * population, role, region, team, PM, job family, triage flag and person search
 * scope the KPI cards, the charts and the grid identically.
 *
 * @param {Object} p     person record
 * @param {string=} skip dimension to ignore ("region"|"team"|"pm"|"family"|"flag"),
 *                       which is what makes the option lists cascade: the choices
 *                       for a dimension are computed with that dimension switched off.
 */
/**
 * Population override for scopedMetric_ — null in normal rendering.
 *
 * When set, only these people exist as far as every metric accessor is
 * concerned. This is how one comparison bar reuses the card's exact formula
 * instead of a hand-rolled copy of it.
 */
var SCOPE_NAMES_ = null;

function passesFilters_(p, skip) {
  if (SCOPE_NAMES_ && !SCOPE_NAMES_[p.name]) return false;
  if (!popMatch_(p)) return false;
  if (!roleMatch_(p)) return false;
  // Routed through dimMatch_ so the filter, the option counts and the chart rows
  // share one membership definition — including the untagged buckets.
  if (skip !== "region" && STATE.region && !dimMatch_(p, "region", STATE.region)) return false;
  if (skip !== "team" && STATE.team && !dimMatch_(p, "team", STATE.team)) return false;
  if (skip !== "pm" && STATE.pm && !dimMatch_(p, "pm", STATE.pm)) return false;
  if (skip !== "family" && STATE.family && !dimMatch_(p, "family", STATE.family)) return false;
  if (skip !== "flag" && STATE.flag && !hasFlag_(p, STATE.flag)) return false;
  if (STATE.search && p.name.toLowerCase().indexOf(STATE.search.toLowerCase()) === -1) return false;
  return true;
}

/** People passing every active filter. attribOnly stubs (whole-roster issue
    attribution, schema v12) exist only so buckets can join a person record —
    they are not the operational population, so the grid, the scope headcount
    and the person CSV never see them. Their BUCKETS still count everywhere:
    bucketsFor_ runs passesFilters_ directly, on purpose. */
function filteredPeople_() {
  return MODEL.people.filter(function (p) { return !p.attribOnly && passesFilters_(p); });
}

/** True when the person EXISTED during the period. Pre-hire weeks are never
    emitted by the server (user decision 2026-07-31), so a person with no week
    cell in any of the period's isos was not yet hired then. Period-scoped
    headcounts use this (user report 2026-08-04: a June window counted July's
    two new hires — "140 people" regardless of the selected time). An empty
    isos list means no period is framing the count, so everyone counts. */
function existsIn_(p, isos) {
  if (!isos || !isos.length) return true;
  for (var i = 0; i < isos.length; i++) {
    if (p.weeks && p.weeks[isos[i]]) return true;
  }
  return false;
}

/**
 * Headcount per value of one dimension, over the people who pass every OTHER
 * filter. Returns { counts, order } where order lists every known value of the
 * dimension — in-scope ones first (by count, then name), out-of-scope after.
 */
function optionsFor_(dim) {
  var d = FILTER_DIMS[dim], counts = {};
  (d.all() || []).forEach(function (v) { counts[v] = 0; });
  MODEL.people.forEach(function (p) {
    if (p.attribOnly) return; // identity stubs must not inflate headcounts
    if (!passesFilters_(p, dim)) return;
    d.vals(p).forEach(function (v) {
      if (v === undefined || v === null || v === "") return;
      counts[v] = (counts[v] || 0) + 1;
    });
  });
  var live = [], dead = [];
  Object.keys(counts).forEach(function (v) { (counts[v] > 0 ? live : dead).push(v); });
  // Untagged last regardless of size. It is a data-hygiene bucket, not a team,
  // and sorting a big one to the top of a dropdown pushes the real values out of
  // sight. It is never hidden — just never first.
  live.sort(function (a, b) {
    var ua = isUntagged_(a) ? 1 : 0, ub = isUntagged_(b) ? 1 : 0;
    return (ua - ub) || (counts[b] - counts[a]) || a.localeCompare(b);
  });
  dead.sort(function (a, b) { return a.localeCompare(b); });
  return { counts: counts, live: live, dead: dead };
}

/** Populate one <select> from its cascaded options. */
function fillSelect_(id, dim, allLabel) {
  var sel = document.getElementById(id);
  var o = optionsFor_(dim);
  var total = 0;
  o.live.forEach(function (v) { total += o.counts[v]; });
  sel.innerHTML = "";
  var head = document.createElement("option");
  head.value = ""; head.textContent = allLabel;
  sel.appendChild(head);
  o.live.forEach(function (v) {
    var op = document.createElement("option");
    op.value = v; op.textContent = v + " (" + o.counts[v] + ")";
    sel.appendChild(op);
  });
  // Out-of-scope values stay visible but unselectable, plus the active value if
  // the rest of the filter set has emptied it (rule 1 — never lose a selection).
  var rest = o.dead.slice();
  if (STATE[dim] && o.live.indexOf(STATE[dim]) === -1 && rest.indexOf(STATE[dim]) === -1) {
    rest.unshift(STATE[dim]);
  }
  if (rest.length) {
    var grp = document.createElement("optgroup");
    grp.label = "— none in this slice —";
    rest.forEach(function (v) {
      var op = document.createElement("option");
      op.value = v; op.textContent = v + " (0)";
      // The current selection must remain selectable so it can be cleared from
      // the same control; the others are disabled.
      if (v !== STATE[dim]) op.disabled = true;
      grp.appendChild(op);
    });
    sel.appendChild(grp);
  }
  sel.value = STATE[dim] || "";
  sel.title = FILTER_DIMS[dim].label.charAt(0).toUpperCase() + FILTER_DIMS[dim].label.slice(1) +
    " — universal: scopes the cards, the charts and the grid together. Options and " +
    "counts follow the other active filters, so this list only ever offers combinations " +
    "that select someone. Values with nobody in the current slice are greyed out rather " +
    "than removed. " + o.live.length + " of " + (o.live.length + o.dead.length) +
    " values are in scope (" + total + " memberships).";
}

function buildFilters_() {
  buildPeriodChips_();
  buildPopChips_();
  buildRoleChips_();
  buildFocusChips_();
  var rc = document.getElementById("regionChips");
  var ro = optionsFor_("region");
  rc.innerHTML = "";
  var totalR = 0;
  ro.live.forEach(function (v) { totalR += ro.counts[v]; });
  [""].concat(MODEL.meta.regions).forEach(function (r) {
    var n = r === "" ? totalR : (ro.counts[r] || 0);
    var empty = r !== "" && n === 0 && STATE.region !== r;
    var b = document.createElement("span");
    b.className = "chip" + (STATE.region === r ? " on" : "") + (empty ? " off" : "");
    b.textContent = (r === "" ? "All" : r) + " " + n; // group label "REGION" carries the context
    b.title = empty
      ? r + " has nobody under the other active filters — clear one of them to reach it"
      : (r === "" ? "Every region in the current slice — " + n + " people"
                  : r + " — " + n + " people under the other active filters");
    if (!empty) b.onclick = function () { STATE.region = r; buildFilters_(); renderAll_(); };
    rc.appendChild(b);
  });
  fillSelect_("teamSel", "team", "All teams");
  fillSelect_("pmSel", "pm", "All PMs");
  // Tempo stamps whoever led a project at the time, so the raw PM list keeps
  // former employees indefinitely. Say how many were removed — a list that
  // quietly shrinks between deploys is its own small mystery.
  var pmDrop = MODEL.meta.pmsDropped || 0;
  if (pmDrop) {
    var pmEl = document.getElementById("pmSel");
    pmEl.title = pmEl.title.replace(/ Excludes \d+ former.*$/, "") +
      " Excludes " + pmDrop + " former employee" + (pmDrop === 1 ? "" : "s") +
      " the roster shows as no longer active.";
  }
  fillSelect_("famSel", "family", "All job families");
  renderFilterWarn_();
}

/**
 * Dead-end guard. A filter set that selects nobody is not an error state to be
 * discovered three panels down — say so in the filter row itself, name the
 * dimension that emptied it and offer the one click that reopens the view.
 */
function renderFilterWarn_() {
  var el = document.getElementById("filterWarn");
  if (!el) return;
  if (filteredPeople_().length > 0) { el.innerHTML = ""; return; }
  // Find the single filter whose removal brings back the MOST people — that's
  // the one to offer, rather than nuking every choice the user just made. Ties
  // resolve in declaration order, so the suggestion is stable across renders.
  var culprit = null;
  ["region", "team", "pm", "family", "flag"].forEach(function (dim) {
    if (!STATE[dim]) return;
    var n = MODEL.people.filter(function (p) { return !p.attribOnly && passesFilters_(p, dim); }).length;
    if (n > 0 && (!culprit || n > culprit.n)) culprit = { dim: dim, n: n };
  });
  el.innerHTML = culprit
    ? '⚠ No one matches — <a href="#" class="hyglink" onclick="clearFilter_(\'' +
      culprit.dim + '\');return false">clear ' +
      esc_(FILTER_DIMS[culprit.dim] ? FILTER_DIMS[culprit.dim].label : "the triage filter") +
      "</a> to see " + culprit.n + " people"
    : '⚠ No one matches this combination — <a href="#" class="hyglink" ' +
      'onclick="document.getElementById(\'btnReset\').click();return false">reset the filters</a>';
}

function clearFilter_(dim) {
  STATE[dim] = "";
  buildFilters_();
  renderAll_();
}

// ── PERIODS (Week / Month / fiscal Quarter toggle) ───────────

/**
 * Every ISO week in the export window, oldest first.
 *
 * meta.trendWeeks carries only the 6 weeks the KPI sparkline needed, but
 * p.weeks holds the whole 52-week deep window (CONFIG_DH.WEEKS_PAST_DEEP), and
 * the month calendar is built over exactly that window — so flattening
 * meta.periods.month recovers the full weekly axis with no payload change and
 * no cache bust. That history is what makes an observed operating rate
 * meaningful: a "standard rate" derived from six points is an opinion.
 */
function allIsoWeeks_() {
  if (MODEL._allIsos) return MODEL._allIsos;
  var out = [];
  if (MODEL.meta.periods && MODEL.meta.periods.month) {
    MODEL.meta.periods.month.forEach(function (m) { out = out.concat(m.isos); });
  } else {
    var seen = {};
    (MODEL.meta.trendWeeks || []).forEach(function (iso) { seen[iso] = 1; out.push(iso); });
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      var iso = wk.iso || wk;
      if (!seen[iso]) { seen[iso] = 1; out.push(iso); }
    });
  }
  MODEL._allIsos = out;
  return out;
}

/** Every period of the active type, oldest first: {key,label,status,partial,isos[]}. */
function allPeriods_() {
  if (STATE.period === "week" || !MODEL.meta.periods) {
    if (MODEL._weekPeriods) return MODEL._weekPeriods;
    // Status comes from gridWeeks where it is known (done/now/plan); any week
    // older than the grid window is complete by construction.
    var st = {};
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      if (wk && wk.iso) st[wk.iso] = wk.status;
    });
    MODEL._weekPeriods = allIsoWeeks_().map(function (iso) {
      return { key: iso, label: iso, status: st[iso] || "done", partial: false, isos: [iso] };
    });
    return MODEL._weekPeriods;
  }
  return (STATE.period === "month" ? MODEL.meta.periods.month : MODEL.meta.periods.quarter) || [];
}

/** Complete, non-truncated periods of the active type, oldest first — the only
    periods a trend or an operating rate may be built from. */
function donePeriods_() {
  return allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
}

// ══════════════════════════════════════════════════════════════════════════
// FORWARD WINDOWS — the in-flight period and the next two weeks
//
// Until 2026-08-06 the picker offered COMPLETE periods only, and that was
// right for a scorecard: an unfinished month graded against a full-month
// target reads as a collapse on the 1st. But the dashboard's job is to help a
// manager coach, and the two questions coaching starts from — "what is the
// team on right now?" and "is the next fortnight actually planned?" — are both
// about windows that have not closed (user request 2026-08-06).
//
// So the picker gains them, and the grammar changes with the window rather
// than the numbers being quietly published under the old rules:
//   done → graded exactly as before
//   now  → published, but never compared against the period before it
//   plan → outcome metrics say so and stay blank; PLAN is what is measured
//
// The one invariant: trends and operating rates are still built from
// donePeriods_() alone. A forward window trends the complete history up to
// today; it never trends itself.
// ══════════════════════════════════════════════════════════════════════════

/** How many future weeks the picker offers. The server ships
    CONFIG_DH.WEEKS_FUTURE (3) forward weeks, so two is inside what the payload
    can honestly answer — offering a week the export never reached would render
    an empty plan as "nobody has planned anything". */
var PLAN_WEEKS_AHEAD_ = 2;

/** The share of scheduled capacity below which a forward window counts as
    under-planned. Not a new target: this is the coverage-cliff line
    personExceptions_ has flagged people on since 2026-07-31, named once so the
    tile, the roster column and the triage flag cannot drift apart. */
var PLAN_CLIFF_ = 0.5;

/** Forward weeks the payload can actually speak to: gridWeeks entries with
    status "plan", nearest first, capped at PLAN_WEEKS_AHEAD_, and only while
    SOMEBODY has a cell there. A week with no cells at all is the export not
    reaching that far, which is a different fact from an unplanned week and
    must not be offered as one. */
function planWeeks_() {
  if (MODEL._planWeeks) return MODEL._planWeeks;
  var out = [];
  (MODEL.meta.gridWeeks || []).forEach(function (wk) {
    if (!wk || !wk.iso || wk.status !== "plan" || out.length >= PLAN_WEEKS_AHEAD_) return;
    var any = MODEL.people.some(function (p) {
      var w = p.weeks[wk.iso];
      return !!w && ((w.cap || 0) > 0 || (w.planned || 0) > 0);
    });
    if (any) out.push({ key: wk.iso, label: wk.iso, status: "plan", partial: false, isos: [wk.iso] });
  });
  MODEL._planWeeks = out;
  return out;
}

/** The in-flight period of the ACTIVE unit — this week, this month, this
    quarter. Never a trend input; offered because "what is the team on right
    now" is a different question from "how did last month close". */
function nowPeriod_() {
  var ps = allPeriods_();
  for (var i = ps.length - 1; i >= 0; i--) if (ps[i].status === "now") return ps[i];
  return null;
}

/**
 * Every window the picker offers, oldest first:
 *   [ …complete periods… , the in-flight one , …the next ≤2 weeks… ]
 *
 * Complete periods keep INDEX PARITY with donePeriods_() — for i < done.length,
 * all[i] IS done[i] — so the trend anchor is min(idx, done.length−1) and a
 * forward selection can never slide a partial period into a trend or a norm.
 *
 * The forward entries are always WEEKS even when the unit chip says Month or
 * Quarter: a future month is one planned fortnight and two empty ones, and
 * publishing that as a month's coverage would read as a planning collapse.
 * The unit chooses the granularity of HISTORY; planning is a weekly act.
 */
function analysisPeriods_() {
  var all = donePeriods_().slice();
  var now = nowPeriod_();
  if (now) all.push(now);
  return all.concat(planWeeks_());
}

/** Index into analysisPeriods_() of the selected window. Default = the last
    COMPLETE period, never the in-flight one: forward windows are something a
    reader opts into, and defaulting into one would make every KPI look like a
    collapse on the first of the month. */
function headPickIdx_(all, done) {
  if (STATE.periodIdx === null || STATE.periodIdx === undefined) {
    return Math.max(0, done.length - 1);
  }
  return Math.max(0, Math.min(all.length - 1, STATE.periodIdx));
}

/**
 * ONE resolution of "which window is on screen", used by every analysis
 * surface so they can never disagree about it.
 *   head  — the selected window (may be in-flight or forward)
 *   hi    — the trend anchor INTO donePeriods_(): the last complete period at
 *           or before the head
 *   phase — "done" | "now" | "plan", the grammar every renderer switches on
 */
function analysisHead_() {
  var done = donePeriods_(), all = analysisPeriods_();
  var pi = headPickIdx_(all, done);
  var head = all[pi] || { key: "", label: "—", isos: [], status: "done", partial: false };
  return { done: done, all: all, pi: pi,
           hi: Math.max(0, Math.min(pi, done.length - 1)),
           head: head,
           phase: head.status === "plan" ? "plan" : (head.status === "now" ? "now" : "done") };
}

/** True while the reader is looking at a window that has not happened yet. */
function planningPhase_() { return analysisHead_().phase === "plan"; }

/** How a non-complete window is described, in one place — the tiles, the scope
    chip and the roster all name it the same way or the reader gets three
    stories about one selection. */
function phaseWord_(phase, unit) {
  return phase === "plan" ? "planning window"
       : phase === "now"  ? "current " + unit + ", in progress"
       : "complete " + unit;
}

/**
 * Aggregates a person's weekly cells over a period. effPlanned caps planned at
 * capacity PER WEEK before summing (the Tempo per-project duplication rule).
 * Returns null when no member week has data.
 */
function aggWeeks_(p, isos) {
  var a = null;
  isos.forEach(function (iso) {
    var w = p.weeks[iso];
    if (!w) return;
    if (!a) a = { cap: 0, avail: 0, planned: 0, effPlanned: 0,
                  tracked: 0, trackedOff: 0, billable: 0, nonBillable: 0, capEst: false,
                  availCov: 0, capCov: 0, trackedCov: 0, nsBillRaw: 0, nsNonBillRaw: 0,
                  covWeeks: 0, nWeeks: 0 };
    a.cap += w.cap; a.avail += w.avail;
    a.planned += w.planned; a.trackedOff += w.trackedOff || 0;
    // Planning is capped at capacity: a 60h plan against a 40h schedule is an
    // over-plan, not extra deliverable capacity.
    a.effPlanned += w.cap > 0 ? Math.min(w.planned, w.avail) : w.planned;
    a.tracked += w.tracked; a.billable += w.billable; a.nonBillable += w.nonBillable;
    a.capEst = a.capEst || w.capEst;
    // NS-coverage companions: billable rates divide by availCov (classified weeks
    // only), so a period spanning covered and uncovered weeks reports the rate of
    // the part NS actually classified instead of diluting it with forced zeros.
    a.availCov += w.availCov || 0; a.trackedCov += w.trackedCov || 0;
    a.capCov += w.capCov || 0;
    a.nsBillRaw += w.nsBillRaw || 0; a.nsNonBillRaw += w.nsNonBillRaw || 0;
    a.nWeeks++; if (w.nsCov) a.covWeeks++;
  });
  return a;
}

/** Unclassified tracked hours in an aggregated cell — logged in Tempo but with
    no NS billable/non-billable signal, so they belong to neither bucket. */
function unclassifiedH_(w) {
  return w ? Math.max(0, (w.tracked || 0) - (w.trackedCov || 0)) : 0;
}

/** Raw NetSuite hours behind a cell (billable + non-billable, as exported).
    Diagnostic only — never a rate numerator; the rates use the ratio split. */
function nsRawTot_(w) {
  return w ? (w.nsBillRaw || 0) + (w.nsNonBillRaw || 0) : 0;
}

/** The NS billable share driving a cell's split (0–1), or 0 with no NS signal. */
function nsShare_(w) {
  var t = nsRawTot_(w);
  return t > 0 ? (w.nsBillRaw || 0) / t : 0;
}

/**
 * Renders only the pane that is on screen. Every view reads the same STATE, so
 * a filter change is a single re-render of the active pane rather than four
 * hidden ones — and the pane can never show a window that no longer matches the
 * header controls (the bug the old always-render-everything code had).
 */
function renderAll_() {
  renderScope_();
  renderFilterWarn_();
  switch (STATE.view) {
    case "exec":    renderMasthead_(); renderBacklogBand_(); renderTiles_(); renderFlow_(); renderCompare_(); renderPulse_(); renderTrust_(); break;
    case "actions": renderRoster_(); renderBacklogHealth_(); renderHygPanel_(); break;
    case "access":  renderAccess_(); break;
  }
}

/** Live scope chip: states exactly what slice is on screen — replaces the old
    explanatory footnote (fine print lives in the chip's tooltip). */
function renderScope_() {
  var parts = [POP_LABELS[STATE.pop], FOCUS_LABELS[STATE.focus],
    STATE.region || "All regions", STATE.team || "All teams"];
  if (STATE.pm) parts.push("PM: " + STATE.pm);
  if (STATE.family) parts.push(STATE.family);
  if (STATE.flag) parts.push(FLAG_LABELS[STATE.flag].icon + " " + FLAG_LABELS[STATE.flag].label);
  if (STATE.search) parts.push("“" + STATE.search + "”");
  // The period is stated HERE and nowhere else. It used to repeat in all four
  // card headers — one fact, four times, one stolen line per card.
  var A = analysisHead_();
  var head = A.all.length ? A.head : null;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  // Headcount is PERIOD-SCOPED (user report 2026-08-04): "Jun 2026 — N people"
  // must count June's roster, not today's — someone hired in July did not
  // exist in a June window. Only hires can be corrected for (the payload is
  // active-roster only, so leavers are invisible either way); the delta is
  // stated so 140 → 138 reads as a fact, not a glitch.
  var pool = filteredPeople_();
  var n = head ? pool.filter(function (p) { return existsIn_(p, head.isos); }).length : pool.length;
  var later = pool.length - n;
  document.getElementById("scopeChip").innerHTML =
    // The window's PHASE leads, because "58%" means three different things
    // across the three of them and the chip is the only place the reader is
    // told which one they are looking at.
    (head ? "<b>" + (A.phase === "plan" ? "Planning · " + esc_(head.label)
                   : A.phase === "now"  ? "Current " + unit + " so far · " + esc_(head.label)
                   : (STATE.periodIdx === null ? "Last complete " : "Selected ") +
                     unit + " · " + esc_(head.label)) + "</b> — " : "") +
    esc_(parts.join(" · ")) + " — " + n + " people" +
    (later > 0
      ? ' <span class="cellSub" title="On the roster today but hired after this ' + unit +
        " — they did not exist in this window, so they are not in its headcount or its rates.\">(+" +
        later + " hired later)</span>"
      : "");
}

document.getElementById("btnRefresh").onclick = function () { loadData(true); };
// Reset (user feedback 2026-07-31, tightened same day): EVERYTHING returns to
// the default view in one click — every filter and lens (population FTE, role
// All, focus Plan, period Monthly), all dropdowns, search, and every expanded
// column/detail row. No leftover state, period included (Monthly IS the default).
document.getElementById("btnReset").onclick = function () {
  STATE.period = MODEL && MODEL.meta.periods ? "month" : "week"; // stale-cache guard parity with loadData
  STATE.pop = "fte"; STATE.role = "all"; STATE.focus = "plan";
  STATE.region = ""; STATE.team = ""; STATE.pm = ""; STATE.family = ""; STATE.search = "";
  STATE.flag = ""; STATE.expandedWeeks = {}; STATE.openDetail = {};
  STATE.sigFilter = "";   // …including the roster's signal chip
  STATE.periodIdx = null; // …including the analysis-period picker
  buildPeriodChips_();    // reflect the reset in the picker's selection
  document.getElementById("personSearch").value = "";
  buildFilters_();   // rebuilds every dropdown from the now-unfiltered population
  renderAll_();
};
// A dropdown change re-cascades the OTHER dropdowns before re-rendering — that
// is what makes a Region pick collapse the Team/PM/Family lists.
function onFilterChange_(dim, value) {
  STATE[dim] = value;
  buildFilters_();
  renderAll_();
}
document.getElementById("teamSel").onchange = function () { onFilterChange_("team", this.value); };
document.getElementById("pmSel").onchange = function () { onFilterChange_("pm", this.value); };
document.getElementById("famSel").onchange = function () { onFilterChange_("family", this.value); };
document.getElementById("personSearch").oninput = function () { onFilterChange_("search", this.value); };
// Theme button says what it DOES (the mode you'd switch to), not a cryptic glyph.
document.getElementById("btnTheme").onclick = function () {
  var root = document.documentElement;
  var toDark = root.getAttribute("data-theme") !== "dark";
  root.setAttribute("data-theme", toDark ? "dark" : "");
  this.textContent = toDark ? "☀️ Light" : "🌙 Dark";
};

/** Utilization rollup over a period's weeks (mirrors server utilRollup_).
    Scopes on passesFilters_ — ALL filters are universal (user decision
    2026-07-31, superseded the finding-I2 grid-finder rule): a job-family or
    person selection re-bases the utilization tile too. The payload is already
    tracking-mandated families only. */
function utilFor_(isos) {
  var s = { avail: 0, availCov: 0, billable: 0, tracked: 0, trackedCov: 0, cap: 0, capCov: 0 };
  MODEL.people.forEach(function (p) {
    // Long leave (maternity/paternity/parental/sabbatical) never moves the
    // rate: Tempo capacity can lag HR, so their avail would read as idle time.
    if (p.onLeave) return;
    // Interns (I1) never move a rate — in training, not delivery capacity
    // (user decision 2026-08-04). Their grid hours stay visible, unlike leave.
    if (p.isIntern) return;
    if (!passesFilters_(p)) return;
    isos.forEach(function (iso) {
      var w = p.weeks[iso];
      if (!w) return;
      s.avail += w.avail; s.billable += w.billable; s.tracked += w.tracked;
      // availCov = availability of NS-CLASSIFIED person-weeks only. Billable %
      // divides by this, never by total avail: an unclassified week has a
      // forced-zero numerator, so leaving its avail in the denominator would
      // report the NS export's lag as a drop in billing (audit 2026-08-03).
      s.availCov += w.availCov || 0; s.trackedCov += w.trackedCov || 0;
      // capCov = GROSS scheduled capacity of NS-classified weeks — the Metrics
      // Dictionary's "headcount × standard hours" denominator, coverage-matched
      // the same way availCov is.
      s.capCov += w.capCov || 0;
      s.cap += w.cap;
    });
  });
  // grossPct is THE rate — the Dictionary's: billable ÷ gross scheduled
  // capacity (headcount × standard hours). No absenteeism is modelled (user
  // decision 2026-08-04), so avail === cap and billablePct is numerically the
  // same gross rate (the field survives for the shared accessors/tests).
  // trackedPct/grossTrackedPct are the fallback readings when NetSuite is
  // classifying nothing and no billable claim can be made.
  s.grossPct = s.capCov > 0 ? s.billable / s.capCov * 100 : null;
  s.billablePct = s.availCov > 0 ? s.billable / s.availCov * 100 : null;
  s.trackedPct = s.avail > 0 ? s.tracked / s.avail * 100 : null;
  s.grossTrackedPct = s.cap > 0 ? s.tracked / s.cap * 100 : null;
  return s;
}

/**
 * PLANNED COVERAGE over a window — the forward twin of utilFor_.
 *
 * Planned hours ÷ scheduled capacity, over the same population utilFor_ uses
 * (long leave and interns out: neither owes a plan). This is the only thing a
 * week that has not happened yet can honestly be measured on, and it is the
 * question a manager coaching a team actually asks — "is the next fortnight
 * covered, and who is not covered?"
 *
 * Planned is capped at capacity PER WEEK before summing. Tempo duplicates a
 * weekly plan per project assignment, so someone on two projects reads as 2×40h
 * planned and would push a team over 100% while a third of it sat unplanned.
 * The same cap the grid, the CSV and personExceptions_ have always applied.
 *
 * `none` / `thin` are headcounts, not hours, because the fix is a conversation
 * with a person: 58% coverage does not tell you whether nine people are half
 * planned or four are not planned at all, and those are different weeks.
 */
function planFor_(isos) {
  var s = { planned: 0, cap: 0, people: 0, none: 0, thin: 0 };
  MODEL.people.forEach(function (p) {
    if (p.onLeave || p.isIntern || p.attribOnly) return;
    if (!passesFilters_(p)) return;
    var one = planFor1_(p, isos);
    // No capacity in the window = not expected to be planned into it (pre-hire
    // weeks are not even emitted). Counting them would report a roster gap as a
    // planning gap.
    if (one.cap <= 0) return;
    s.people++; s.cap += one.cap; s.planned += one.planned;
    if (one.planned <= 0) s.none++;
    else if (one.planned < one.cap * PLAN_CLIFF_) s.thin++;
  });
  s.pct = s.cap > 0 ? s.planned / s.cap * 100 : null;
  return s;
}

/** One person's planned hours and capacity over a window — the per-row half of
    planFor_, kept as its own function so the tile total and the roster cell can
    never apply the per-week cap differently. */
function planFor1_(p, isos) {
  var cap = 0, pl = 0;
  (isos || []).forEach(function (iso) {
    var w = p.weeks[iso];
    if (!w) return;
    cap += w.cap || 0;
    pl += (w.cap || 0) > 0 ? Math.min(w.planned || 0, w.cap) : (w.planned || 0);
  });
  return { planned: pl, cap: cap, pct: cap > 0 ? pl / cap * 100 : null };
}

/**
 * The roster's Plan cell: hours planned against hours of capacity, with the
 * same three-way read the signal cells use.
 *
 * Colour is a DOT, never the text, and the hours are always printed — the
 * conversation this column exists to start is "you have 40 hours next week and
 * 6 of them are planned", and that sentence needs the numbers, not a verdict.
 * People with no capacity in the window (pre-hire, or simply not scheduled) get
 * an em-dash rather than 0%: nothing is owed, so nothing is graded.
 */
function planCellHtml_(p, isos) {
  if (p.onLeave) return '<td class="tnum"><span class="cellSub">on leave</span></td>';
  if (p.isIntern) return '<td class="tnum"><span class="cellSub">🎓</span></td>';
  var s = planFor1_(p, isos);
  if (s.cap <= 0) return '<td class="tnum">—</td>';
  var cls = s.planned <= 0 ? "sigBad" : s.pct < PLAN_CLIFF_ * 100 ? "sigWarn" : "sigGood";
  return '<td class="tnum" title="' + r1_(s.planned) + "h planned of " + r1_(s.cap) +
    "h scheduled capacity. Under " + Math.round(PLAN_CLIFF_ * 100) +
    '% is the coverage cliff — the line the triage flag uses.">' +
    '<span class="sigDot ' + cls + '">●</span> ' + r1_(s.planned) + "h" +
    ' <span class="cellSub">/ ' + r1_(s.cap) + "h</span></td>";
}

/**
 * Filter-scoped sums over the person-attributed Jira buckets. Buckets carry
 * the roster person (Assignee join), so EVERY filter — population, role,
 * region, team, PM, family, search — drives On-Time and Forecast exactly like
 * Billable Utilization (user decision 2026-07-31). Buckets whose person fell
 * out of the roster (stale cache, renamed) are skipped.
 */
function bucketsFor_(buckets, isos) {
  if (!MODEL._pByName) {
    MODEL._pByName = {};
    MODEL.people.forEach(function (p) { MODEL._pByName[p.name] = p; });
  }
  var out = { n: 0, onTime: 0, nWithin: 0, nAll: 0, nNoTime: 0,
              nMissOver: 0, nMissUnder: 0, absVars: [],
              // Quality / Rework counters (schema v10). Absent on the other
              // bucket kinds, so they simply stay zero there.
              nDelivered: 0, nRework: 0, nLinked: 0, nReopened: 0, nReopenCov: 0,
              // 🌊 Flow (schema v11). days concats like absVars — a median is
              // not additive, so the raw values travel.
              days: [], estHrs: 0, nEst: 0 };
  buckets.forEach(function (b) {
    if (isos.indexOf(b.iso) === -1) return;
    var person = b.person ? MODEL._pByName[b.person] : null;
    if (!person || !passesFilters_(person)) return;
    // Intern-assigned issues leave BOTH sides of every issue rate (n and
    // nAll) — an intern's late milestone or estimate miss must never move a
    // published number, in either direction (user decision 2026-08-04).
    if (person.isIntern) return;
    // ||0: a throughput bucket (Code.js throughputBuckets_) never carries a
    // `.n` field — only nAll/nEst/estHrs — so this was reading undefined and
    // turning the whole accumulator NaN for that metric, which
    // metricConfidence_ then silently read as no-data (Task 10 follow-up).
    // Every sibling field on this line already defaults to 0; this one didn't.
    out.n += (b.n || 0); out.onTime += (b.onTime || 0);
    out.nAll += (b.nAll || b.n || 0); // stale cache pre-nAll: coverage = n
    // Forecast-only fields (schema v8) — absent on an older bucket, so default
    // to 0/[]: the variance line just won't render rather than reading NaN.
    out.nNoTime += (b.nNoTime || 0);
    out.nWithin += (b.nWithin || 0);
    out.nMissOver += (b.nMissOver || 0); out.nMissUnder += (b.nMissUnder || 0);
    out.nDelivered += (b.nDelivered || 0); out.nRework += (b.nRework || 0);
    out.nLinked += (b.nLinked || 0); out.nReopened += (b.nReopened || 0);
    out.nReopenCov += (b.nReopenCov || 0);

}

/**
 * Forecast Accuracy, the Metrics Dictionary formula:
 *   mean of (1 − |Actual − Estimate| / Estimate) across engagements closed in
 *   the period, as a percentage.
 *
 * Computed from the per-epic absolute relative deviations the payload already
 * carries for the median, so the headline, the band and the median all come
 * from ONE array and cannot disagree.
 *
 * FLOORED AT ZERO per epic. The raw expression goes negative past a 2× over-run
 * (1 − 2.0 = −100%), and a "share of accuracy" below zero is not a quantity
 * anyone can act on — worse, a single runaway engagement would drag the mean
 * of a good period below zero. The floor is applied BEFORE averaging, which is
 * the difference between "this epic was completely wrong" and "this epic
 * cancels out three good ones".

 * @param {number[]} absVars  |actual − estimate| ÷ estimate, one per measurable epic
 * @returns {?number} 0–100, or null when nothing was measurable
 */
function forecastAccuracyPct_(absVars) {
  if (!absVars || !absVars.length) return null;
  var sum = 0;
  for (var i = 0; i < absVars.length; i++) sum += Math.max(0, 1 - absVars[i]);

/** Median of a numeric array; null when empty. Mirrors medianOf_ in Code.js. */
function medianOf_(vals) {
  if (!vals || !vals.length) return null;
  var s = vals.slice().sort(function (a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

// ── STANDARD RATE — the level we actually run at ─────────────
//
// A target says what someone decided; a standard rate says what the
// organisation has demonstrably done, period after period. Both are needed, and
// they answer different questions: "are we hitting the plan?" versus "is this
// week different from how we normally operate?". A month at 64% against a 70%
// target is a miss; the same month against an observed norm of 63% is a
// completely ordinary month, and the two conversations should not be confused.
//
// Robust by construction. The baseline is a MEDIAN and the band is derived from
// the median absolute deviation, not a mean and a standard deviation, so one
// broken export week or one holiday-shortened month cannot move the norm it is
// being judged against. 1.4826 is the constant that makes MAD estimate σ for
// normally distributed data, so the ±1 MAD-σ band is the familiar "about two
// thirds of periods land in here" range.
//
// Deliberately conservative about publishing:
//   · fewer than MIN periods → no rate at all, and the UI says how many more
//     complete periods it needs. An "operating norm" from three points is noise
//     with a decimal point on it.
//   · the band never narrows below ±2 points, so a metric that happens to have
//     been flat for a stretch does not start flagging every 1-point wobble as
//     an exception.
//   · callers must not publish one for a suppressed metric or a stale model —
//     see stdFor_.
var STD_MIN_PERIODS = 5;

/**
 * @param {Array<?number>} vals  metric per period, oldest first; nulls skipped
 * @param {{minN:number, floor:number}=} opts
 * @returns {{ok:boolean, n:number, minN:number, baseline:number, lo:number,
 *            hi:number, sigma:number, last:number, verdict:string, run:number,
 *            slope:number, per:number}}
 */
function standardRate_(vals, opts) {
  opts = opts || {};
  var minN = opts.minN === undefined ? STD_MIN_PERIODS : opts.minN;
  var pts = (vals || []).filter(function (v) {
    return v !== null && v !== undefined && !isNaN(v);
  });
  if (pts.length < minN) return { ok: false, n: pts.length, minN: minN };
  var med = medianOf_(pts);
  var mad = medianOf_(pts.map(function (v) { return Math.abs(v - med); }));
  var sigma = Math.max(mad * 1.4826, opts.floor === undefined ? 2 : opts.floor);
  var lo = Math.max(0, med - sigma), hi = Math.min(100, med + sigma);
  var last = pts[pts.length - 1];
  // Run length: how many of the most recent periods sit on the same side of the
  // baseline. One period outside the band is an event; five consecutive periods
  // on one side of the median is a shift in the operating rate itself, and is
  // the thing worth escalating — the classic control-chart run rule.
  var side = last >= med ? 1 : -1, run = 0;
  for (var i = pts.length - 1; i >= 0; i--) {
    if ((pts[i] >= med ? 1 : -1) !== side) break;
    run++;

  // Least-squares slope in points per period across the whole history.
  var n = pts.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (var j = 0; j < n; j++) { sx += j; sy += pts[j]; sxy += j * pts[j]; sxx += j * j; }
  var den = n * sxx - sx * sx;
  return {
    ok: true, n: n, baseline: med, lo: lo, hi: hi, sigma: sigma, last: last,
    verdict: last > hi ? "above" : (last < lo ? "below" : "normal"),
    run: run, side: side, slope: den ? (n * sxy - sx * sy) / den : 0,
  };
}

/**
 * The standard rate for a published metric, or null when it must not be shown.
 *
 * Three suppressions, all deliberate:
 *   · stale model — every point could predate the last refresh, so the "norm"
 *     would describe a window nobody can date (NFR-7, same rule that kills the
 *     vs-prior delta).
 *   · unpublishable metric — a norm computed from below-gate coverage is the
 *     average of a measurement error (FR-2.2).
 *   · too few complete periods — returned as {ok:false} so the UI can say what
 *     it is waiting for rather than rendering nothing.
 */
function stdFor_(vals, conf) {
  if (MODEL._stale) return null;
  if (conf && conf.publish === false) return null;
  return standardRate_(vals);
}


/**
 * Data-confidence verdict for one metric (FR-2.1/2.2/2.6).
 *
 * ⚠ VERBATIM COPY of metricConfidence_ in Code.js — the client needs it because
 * coverage is filter-dependent (a region slice can be well attributed while the
 * whole population isn't). _test_confidenceParity_ in node-tests.js extracts
 * this copy and diffs it against the server's across a matrix of inputs; if you
 * change one, change both.
 */
function metricConfidence_(gate, coverage, periods) {
  var g = Number(gate) || 0;
  if (coverage === null || coverage === undefined || isNaN(coverage)) {
    return { level: "none", publish: false, coverage: null };
  }
  var c = Math.max(0, Math.min(1, Number(coverage)));
  var p = Number(periods) || 0;
  if (g <= 0) return { level: "high", publish: true, coverage: c };  // ungated
  if (c >= g && p >= 2) return { level: "high", publish: true, coverage: c };
  if (c >= g - 0.10) return { level: "medium", publish: true, coverage: c };
  return { level: "low", publish: false, coverage: c };
}


/** Registry entry for a metric, with an empty-object fallback so a stale cache
    (pre-v8 payload, no meta.registry) degrades to "no gate" instead of throwing. */
function reg_(id) {
  var r = MODEL.meta.registry;
  return (r && r.metrics && r.metrics[id]) || {};
}

/**
 * The registry's ACCEPTED DEVIATIONS for a metric, as detail sentences.
 *
 * `deviations` is the registry's standing record of every known gap between the
 * number we publish and the Metrics Dictionary definition — "not decoration.
 * Every entry is a known, accepted gap" (Code.js §CANONICAL METRIC REGISTRY).
 * It has always shipped inside meta.registry and, until 2026-08-06, was
 * rendered NOWHERE. On-Time is the case that matters: it is measured against
 * the MUTABLE Jira due date, so a re-baselined milestone reads as on time and
 * the rate is optimistic by an unknown amount — and a reader had no way to know
 * that from the card.
 *
 * Returned as `detail` entries, deliberately NOT as a card line. The four-line
 * card grammar and the removal of data-quality lines were explicit decisions
 * (user 2026-08-05 / 2026-08-06), so these ride in the context line's ⓘ
 * tooltip — the channel the grammar already reserves for "real and stays
 * reachable, but not a fifth line". Sourced from the registry rather than
 * re-typed, so editing a deviation there changes what the card discloses.

function regCaveats_(id) {
  var d = reg_(id).deviations || [];
  if (!d.length) return [];
  return ["Known deviations from the Metrics Dictionary definition — " + d.join(" ")];
}


// ══════════════════════════════════════════════════════════════════════════
// CHART KIT — inline SVG, no library
//
// Every chart here is written by hand rather than pulled from a CDN. Two
// reasons: an HtmlService web app is a sandboxed iframe on a managed browser,
// so one blocked script request is an executive dashboard with no charts in it;
// and every reference line, direct label and hit target below is bespoke enough
// that a library would be configured into the same shape at twice the weight.
//
// The rules the kit enforces, because the previous sparklines broke all of them
// (user feedback 2026-08-03 — "charts with no labels tell nothing"):
//   · every chart states its own units, its axis, and its period range;
//   · values are labelled SELECTIVELY — endpoint, min and max — never on every
//     point, which is noise;
//   · reference lines (target, operating norm) are drawn AND labelled inline,
//     so a reader never has to remember what 70% was;
//   · nulls break the line instead of being interpolated across — a gap in the
//     data is drawn as a gap;
//   · every chart has a table-view twin, so no value is reachable only by hover;
//   · marks carry colour, text never does.
// ══════════════════════════════════════════════════════════════════════════

/**
 * RAG class for a value against a target, or "" when there is no target.
 *
 * `target.invert` flips the comparison for metrics where LOWER IS BETTER —
 * Rework Rate is the only one today. Without this a 3% rework rate would paint
 * red for being "below target", which is exactly backwards and is the kind of
 * error a reader trusts because the colour looks confident.
 */
function ragOf_(v, target) {
  if (v === null || v === undefined || !target) return "";
  if (target.invert) return v <= target.green ? "g" : (v <= target.amber ? "a" : "r");
  return v >= target.green ? "g" : (v >= target.amber ? "a" : "r");
}

// Status is never colour alone (FR-4.4) — the glyph survives a monochrome board
// pack, a photocopy and a colour-vision difference.
var RAG_MARK = { g: "✔", a: "▲", r: "✖", "": "•" };

/** One inert colour-key entry: a swatch beside the words it stands for.
    Inert on purpose — the clickable legends (.lgd.act) say so; a colour KEY
    is a caption, and making some captions buttons is how readers stop
    trusting either (user request 2026-08-04: every coloured surface carries
    a key, because readers learn colours from legends, not from tooltips). */
function keySwatch_(color, words, why) {
  return '<span class="lgd"' + (why ? ' title="' + esc_(why) + '"' : "") +
    '><i style="background:' + color + '"></i>' + words + "</span>";
}

/** The tile/bar RAG key, shared by every surface that colours a value against
    a target or gate. `scaleWord` names what the colour is judged against
    ("its own target", "its gate"), because the thresholds differ per metric
    and a key claiming one number for all of them would be wrong. */
function ragKeyHtml_(scaleWord, tail) {
  return '<div class="cellSub" style="margin:4px 0 8px">Colour key — each value is judged against ' +
    scaleWord + ": " +
    keySwatch_("var(--c-good)", "✔ green = at or better") + " · " +
    keySwatch_("var(--c-warn)", "▲ amber = below it, inside the watch band") + " · " +
    keySwatch_("var(--c-bad)", "✖ red = past the watch band") +
    " · no colour = no verdict (no target, or nothing measurable)." +
    (tail ? " " + tail : "") + "</div>";
}

/** A nice y-domain for a percentage series: padded, clamped to 0–100, snapped
    to 10s, and always wide enough to contain its own reference lines. */
function pctDomain_(vals, refs) {
  var all = (vals || []).filter(function (v) { return v !== null && v !== undefined && !isNaN(v); })
    .concat((refs || []).filter(function (v) { return v !== null && v !== undefined; }));
  if (!all.length) return { lo: 0, hi: 100 };
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  lo = Math.max(0, Math.floor((lo - 8) / 10) * 10);
  hi = Math.min(100, Math.ceil((hi + 8) / 10) * 10);
  if (hi - lo < 20) { hi = Math.min(100, lo + 20); lo = Math.max(0, hi - 20); }
  return { lo: lo, hi: hi };
}



/**
 * Horizontal comparison bars. One row per category, value labelled at the tip
 * with its status glyph, target drawn as a vertical rule. Read-only: the bars
 * report, they don't filter — scope changes belong to the header controls.
 *
 * @param {{rows:Array<{key:string,label:string,value:?number,n:number,sub:string}>,
 *          target:?Object, std:?Object, cap:?number, expanded:?boolean,
 *          onExpand:?string}} o
 */
function hbarChart_(o) {
  var all = o.rows || [];
  if (!all.length) return '<div class="emptyState">Nothing to compare in this slice.</div>';
  // Row cap (user report 2026-08-03: the PM breakdown rendered 52 bars and the
  // chart ran several screens deep). A comparison with 52 bars is not a
  // comparison, it is a list — nobody reads position 40. Rows arrive sorted
  // worst-first, so the head of the list is the part that carries the decision
  // (P2, management by exception); the tail is available in the Values table
  // and by filtering, and the count of what was cut is stated rather than the
  // chart quietly ending early.
  // Which rows survive the cap is chosen by NEED, not by list position: the ones
  // furthest below target. Taking the first N of a best-first list would have
  // shown the healthiest categories and hidden every problem — the exact
  // opposite of the question this chart exists to answer. Display order is left
  // as it arrives, so the longest bar still sits on top.
  var cap = o.expanded ? Infinity : (o.cap || HBAR_MAX_ROWS_);

  if (all.length > cap) {

                    .slice(0, cap);
    var keep = {};
    ranked.forEach(function (r) { keep[r.key] = 1; });
    rows = all.filter(function (r) { return keep[r.key]; });
    hidden = all.length - rows.length;
    hiddenNoData = all.filter(function (r) {
      return r.value === null && !keep[r.key];

  var H = TOP + rows.length * RH + B;

  var pw = W - L - R;
  // Percentages run 0–100 always. A bar that does not start at zero is a lie,
  // and a rescaled x-axis would make 62% and 68% look like a chasm.
  function x(v) { return L + Math.max(0, Math.min(100, v)) / 100 * pw; }

  // Unit-bearing metrics (Task 10: Lead Time in days, Throughput in hrs) have
  // no fixed 0–100 range — a "70%"-style axis on a value of 12.5 days would be
  // fabricated. o.unit (from METRICS_[id].unit) switches the axis to scale
  // against this chart's own max(values) instead, reusing the SAME x() pixel
  // mapping (0–100 = 0–domainMax) so every position/width formula below is
  // untouched — only what a value is converted to, and how it is LABELLED,
  // changes.

  }

  function lbl(v) { return unit ? fmtFlowVal_(v, unit) : Math.round(v) + "%"; }

  var s = '<svg class="chart hbar" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc_(o.title || "comparison") + '">';
  for (var g = 0; g <= 100; g += 25) {
    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (TOP - 6) +
      '" y2="' + (TOP + rows.length * RH) + '"/>' +
      '<text class="axis" x="' + x(g) + '" y="' + (H - 6) + '" text-anchor="middle">' +
      (unit ? lbl(g / 100 * domainMax) : g + "%") + "</text>";
  }
  if (o.std && o.std.ok) {
    s += '<rect x="' + xv(o.std.lo) + '" y="' + (TOP - 6) + '" width="' +
      Math.max(1, xv(o.std.hi) - xv(o.std.lo)) + '" height="' + (rows.length * RH + 6) +
      '" fill="var(--c-ref)" opacity="0.10"><title>operating rate ' +
      (unit ? lbl(o.std.lo) + "–" + lbl(o.std.hi) : Math.round(o.std.lo) + "–" + Math.round(o.std.hi) + "%") +
      " — where this metric normally sits</title></rect>";
  }
  if (o.target) {
    s += '<line x1="' + x(o.target.green) + '" x2="' + x(o.target.green) + '" y1="' + (TOP - 12) +
      '" y2="' + (TOP + rows.length * RH) + '" stroke="var(--c-target)" stroke-width="1"/>' +
      '<text x="' + x(o.target.green) + '" y="' + (TOP - 16) + '" text-anchor="middle" ' +
      'fill="var(--c-target)">target ' + o.target.green + "%</text>";
  }
  rows.forEach(function (r, i) {
    var yTop = TOP + i * RH;
    var bh = 16;                                 // ≤24px: the band's leftover is air
    var by = yTop + (RH - bh) / 2;
    var rag = ragOf_(r.value, o.target);
    s += "<g>" +
      "<title>" + esc_(r.label + " — " +
        (r.value === null ? "no measurable data" : lbl(r.value)) +
        " · " + r.n + (r.n === 1 ? " person" : " people") + (r.sub ? " · " + r.sub : "")) + "</title>" +
      '<rect x="0" y="' + yTop + '" width="' + W + '" height="' + RH + '" fill="transparent"/>' +
      '<text class="val" x="0" y="' + (by + 8) + '">' +
        esc_(trunc_(r.label, 22)) + "</text>" +
      '<text class="axis" x="' + (L - 8) + '" y="' + (by + 8) + '" text-anchor="end">' +
        r.n + "</text>";
    if (r.value === null) {
      s += '<text class="axis" x="' + (L + 4) + '" y="' + (by + 8) + '">no measurable data</text></g>';
      return;
    }
    // 4px rounded data-end, square at the baseline.
    var bw = Math.max(2, xv(r.value) - L);
    s += '<path d="' + roundEndBar_(L, by, bw, bh, 4) + '" class="barfill" fill="' +
        RAG_FILL[rag] + '"/>' +
      '<text class="val" x="' + (L + bw + 7) + '" y="' + (by + 8) + '">' +
        RAG_MARK[rag] + " " + lbl(r.value) + "</text></g>";
  });
  s += "</svg>";
  // Say what was cut. A chart that silently stops at 12 of 52 reads as "there
  // are 12" — the same failure as a truncated table with no ellipsis.
  // Say what was cut, and make it reachable. A cap that can't be lifted turns
  // "too long to read" into "the data isn't there", which is a worse problem
  // than the one it solved — the default stays short, the whole list is one
  // click away.
  if (hidden > 0) {
    var ranked = hidden - hiddenNoData;
    s += '<div class="cellSub" style="margin-top:4px">Showing the ' + rows.length +
      " furthest from target · " +
      (ranked > 0 ? ranked + " nearer target" : "") +
      (ranked > 0 && hiddenNoData > 0 ? " and " : "") +
      (hiddenNoData > 0 ? hiddenNoData + " with no measurable data" : "") +
      " not shown. " +
      (o.onExpand
        ? '<button class="btn" onclick="' + o.onExpand + '" title="' +
          esc_("Draw every one of the " + all.length + " categories. The chart gets long — the " +
               "default keeps the ones carrying a decision at the top of the page.") +
          '">Show all ' + all.length + "</button>"
        : "") + "</div>";
  } else if (o.onExpand && o.expanded && all.length > (o.cap || HBAR_MAX_ROWS_)) {
    s += '<div class="cellSub" style="margin-top:4px">All ' + all.length +
      " shown. " + '<button class="btn" onclick="' + o.onExpand +
      '" title="back to the ' + (o.cap || HBAR_MAX_ROWS_) +
      ' furthest from target">Show top ' + (o.cap || HBAR_MAX_ROWS_) + "</button></div>";
  }
  return s;
}

/** Bar path: square at the baseline (left), radius r on the data end (right). */
function roundEndBar_(x, y, w, h, r) {
  r = Math.min(r, w, h / 2);
  return "M" + x + "," + y + "H" + (x + w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
    "V" + (y + h - r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r + "H" + x + "Z";
}

function trunc_(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/**
 * The KPI-tile micro chart, replacing a bare row of unlabelled bars.
 *
 * Same information density as before plus the three things that were missing:
 * which periods it spans, what the last value was, and where the operating norm
 * sits. Still small enough to live under a hero number.
 */
function sparkHtml_(vals, opts) {
  opts = opts || {};

  var W = 240, H = 54, L = 2, R = 30, T = 12, B = 13;

    s += '<rect x="' + L + '" y="' + y(std.hi) + '" width="' + pw + '" height="' +
      Math.max(1, y(std.lo) - y(std.hi)) + '" fill="var(--c-ref)" opacity="0.13"><title>' +
      "operating rate " + Math.round(std.lo) + "–" + Math.round(std.hi) +
      "% — where this metric normally sits</title></rect>";

  vals.forEach(function (v, i) {

        '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"/>';
      run = [];
