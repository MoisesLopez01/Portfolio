  var med = medianOf_(pts);
  var mad = medianOf_(pts.map(function (v) { return Math.abs(v - med); }));
  var sigma = Math.max(mad * 1.4826, opts.floor === undefined ? 2 : opts.floor);
  var lo = Math.max(0, med - sigma), hi = Math.min(100, med + sigma);
  var last = pts[pts.length - 1];
  // Run length: how many of the most recent periods sit on the same side of the
  // baseline. One period outside the band is an event; five consecutive periods
  // on one side of the median is a shift in the operating rate itself, and is
  // the thing worth escalating — the classic control-chart run rule.
  var side = last >= med ? 1 : -1, run = 0;
  for (var i = pts.length - 1; i >= 0; i--) {
    if ((pts[i] >= med ? 1 : -1) !== side) break;
    run++;
  }
  // Least-squares slope in points per period across the whole history.
  var n = pts.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
  for (var j = 0; j < n; j++) { sx += j; sy += pts[j]; sxy += j * pts[j]; sxx += j * j; }
  var den = n * sxx - sx * sx;
  return {
    ok: true, n: n, baseline: med, lo: lo, hi: hi, sigma: sigma, last: last,
    verdict: last > hi ? "above" : (last < lo ? "below" : "normal"),
    run: run, side: side, slope: den ? (n * sxy - sx * sy) / den : 0,
  };
}

/**
 * The standard rate for a published metric, or null when it must not be shown.
 *
 * Three suppressions, all deliberate:
 *   · stale model — every point could predate the last refresh, so the "norm"
 *     would describe a window nobody can date (NFR-7, same rule that kills the
 *     vs-prior delta).
 *   · unpublishable metric — a norm computed from below-gate coverage is the
 *     average of a measurement error (FR-2.2).
 *   · too few complete periods — returned as {ok:false} so the UI can say what
 *     it is waiting for rather than rendering nothing.
 */
function stdFor_(vals, conf) {
  if (MODEL._stale) return null;
  if (conf && conf.publish === false) return null;
  return standardRate_(vals);
}


/**
 * Data-confidence verdict for one metric (FR-2.1/2.2/2.6).
 *
 * ⚠ VERBATIM COPY of metricConfidence_ in Code.js — the client needs it because
 * coverage is filter-dependent (a region slice can be well attributed while the
 * whole population isn't). _test_confidenceParity_ in node-tests.js extracts
 * this copy and diffs it against the server's across a matrix of inputs; if you
 * change one, change both.
 */
function metricConfidence_(gate, coverage, periods) {
  var g = Number(gate) || 0;
  if (coverage === null || coverage === undefined || isNaN(coverage)) {
    return { level: "none", publish: false, coverage: null };
  }
  var c = Math.max(0, Math.min(1, Number(coverage)));
  var p = Number(periods) || 0;
  if (g <= 0) return { level: "high", publish: true, coverage: c };  // ungated
  if (c >= g && p >= 2) return { level: "high", publish: true, coverage: c };
  if (c >= g - 0.10) return { level: "medium", publish: true, coverage: c };
  return { level: "low", publish: false, coverage: c };
}


/** Registry entry for a metric, with an empty-object fallback so a stale cache
    (pre-v8 payload, no meta.registry) degrades to "no gate" instead of throwing. */
function reg_(id) {
  var r = MODEL.meta.registry;
  return (r && r.metrics && r.metrics[id]) || {};
}


// ══════════════════════════════════════════════════════════════════════════
// CHART KIT — inline SVG, no library
//
// Every chart here is written by hand rather than pulled from a CDN. Two
// reasons: an HtmlService web app is a sandboxed iframe on a managed browser,
// so one blocked script request is an executive dashboard with no charts in it;
// and every reference line, direct label and hit target below is bespoke enough
// that a library would be configured into the same shape at twice the weight.
//
// The rules the kit enforces, because the previous sparklines broke all of them
// (user feedback 2026-08-03 — "charts with no labels tell nothing"):
//   · every chart states its own units, its axis, and its period range;
//   · values are labelled SELECTIVELY — endpoint, min and max — never on every
//     point, which is noise;
//   · reference lines (target, operating norm) are drawn AND labelled inline,
//     so a reader never has to remember what 70% was;
//   · nulls break the line instead of being interpolated across — a gap in the
//     data is drawn as a gap;
//   · every chart has a table-view twin, so no value is reachable only by hover;
//   · marks carry colour, text never does.
// ══════════════════════════════════════════════════════════════════════════

/**
 * RAG class for a value against a target, or "" when there is no target.
 *
 * `target.invert` flips the comparison for metrics where LOWER IS BETTER —
 * Rework Rate is the only one today. Without this a 3% rework rate would paint
 * red for being "below target", which is exactly backwards and is the kind of
 * error a reader trusts because the colour looks confident.
 */
function ragOf_(v, target) {
  if (v === null || v === undefined || !target) return "";
  if (target.invert) return v <= target.green ? "g" : (v <= target.amber ? "a" : "r");
  return v >= target.green ? "g" : (v >= target.amber ? "a" : "r");
}
var RAG_FILL = { g: "var(--c-good)", a: "var(--c-warn)", r: "var(--c-bad)", "": "var(--c-series)" };
// Status is never colour alone (FR-4.4) — the glyph survives a monochrome board
// pack, a photocopy and a colour-vision difference.
var RAG_MARK = { g: "✔", a: "▲", r: "✖", "": "•" };

/** One inert colour-key entry: a swatch beside the words it stands for.
    Inert on purpose — the clickable legends (.lgd.act) say so; a colour KEY
    is a caption, and making some captions buttons is how readers stop
    trusting either (user request 2026-08-04: every coloured surface carries
    a key, because readers learn colours from legends, not from tooltips). */
function keySwatch_(color, words, why) {
  return '<span class="lgd"' + (why ? ' title="' + esc_(why) + '"' : "") +
    '><i style="background:' + color + '"></i>' + words + "</span>";
}

/** The tile/bar RAG key, shared by every surface that colours a value against
    a target or gate. `scaleWord` names what the colour is judged against
    ("its own target", "its gate"), because the thresholds differ per metric
    and a key claiming one number for all of them would be wrong. */
function ragKeyHtml_(scaleWord, tail) {
  return '<div class="cellSub" style="margin:4px 0 8px">Colour key — each value is judged against ' +
    scaleWord + ": " +
    keySwatch_("var(--c-good)", "✔ green = at or better") + " · " +
    keySwatch_("var(--c-warn)", "▲ amber = below it, inside the watch band") + " · " +
    keySwatch_("var(--c-bad)", "✖ red = past the watch band") +
    " · no colour = no verdict (no target, or nothing measurable)." +
    (tail ? " " + tail : "") + "</div>";
}

/** A nice y-domain for a percentage series: padded, clamped to 0–100, snapped
    to 10s, and always wide enough to contain its own reference lines. */
function pctDomain_(vals, refs) {
  var all = (vals || []).filter(function (v) { return v !== null && v !== undefined && !isNaN(v); })
    .concat((refs || []).filter(function (v) { return v !== null && v !== undefined; }));
  if (!all.length) return { lo: 0, hi: 100 };
  var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  lo = Math.max(0, Math.floor((lo - 8) / 10) * 10);
  hi = Math.min(100, Math.ceil((hi + 8) / 10) * 10);
  if (hi - lo < 20) { hi = Math.min(100, lo + 20); lo = Math.max(0, hi - 20); }
  return { lo: lo, hi: hi };
}



/**
 * Horizontal comparison bars. One row per category, value labelled at the tip
 * with its status glyph, target drawn as a vertical rule. Read-only: the bars
 * report, they don't filter — scope changes belong to the header controls.
 *
 * @param {{rows:Array<{key:string,label:string,value:?number,n:number,sub:string}>,
 *          target:?Object, std:?Object, cap:?number, expanded:?boolean,
 *          onExpand:?string}} o
 */
function hbarChart_(o) {
  var all = o.rows || [];
  if (!all.length) return '<div class="emptyState">Nothing to compare in this slice.</div>';
  // Row cap (user report 2026-08-03: the PM breakdown rendered 52 bars and the
  // chart ran several screens deep). A comparison with 52 bars is not a
  // comparison, it is a list — nobody reads position 40. Rows arrive sorted
  // worst-first, so the head of the list is the part that carries the decision
  // (P2, management by exception); the tail is available in the Values table
  // and by filtering, and the count of what was cut is stated rather than the
  // chart quietly ending early.
  // Which rows survive the cap is chosen by NEED, not by list position: the ones
  // furthest below target. Taking the first N of a best-first list would have
  // shown the healthiest categories and hidden every problem — the exact
  // opposite of the question this chart exists to answer. Display order is left
  // as it arrives, so the longest bar still sits on top.
  var cap = o.expanded ? Infinity : (o.cap || HBAR_MAX_ROWS_);
  var rows = all, hidden = 0, hiddenNoData = 0;
  if (all.length > cap) {
    var ranked = all.filter(function (r) { return r.value !== null; })
                    .sort(function (a, b) { return a.value - b.value; })
                    .slice(0, cap);
    var keep = {};
    ranked.forEach(function (r) { keep[r.key] = 1; });
    rows = all.filter(function (r) { return keep[r.key]; });
    hidden = all.length - rows.length;
    hiddenNoData = all.filter(function (r) {
      return r.value === null && !keep[r.key];
    }).length;
  }
  var W = 760, RH = 30, TOP = 26, B = 22;
  var H = TOP + rows.length * RH + B;
  var L = 176, R = 62;                          // L = category gutter, R = value labels
  var pw = W - L - R;
  // Percentages run 0–100 always. A bar that does not start at zero is a lie,
  // and a rescaled x-axis would make 62% and 68% look like a chasm.
  function x(v) { return L + Math.max(0, Math.min(100, v)) / 100 * pw; }

  var s = '<svg class="chart hbar" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' +
    esc_(o.title || "comparison") + '">';
  for (var g = 0; g <= 100; g += 25) {
    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (TOP - 6) +
      '" y2="' + (TOP + rows.length * RH) + '"/>' +
      '<text class="axis" x="' + x(g) + '" y="' + (H - 6) + '" text-anchor="middle">' + g + "%</text>";
  }
  if (o.std && o.std.ok) {
    s += '<rect x="' + x(o.std.lo) + '" y="' + (TOP - 6) + '" width="' +
      Math.max(1, x(o.std.hi) - x(o.std.lo)) + '" height="' + (rows.length * RH + 6) +
      '" fill="var(--c-ref)" opacity="0.10"><title>operating rate ' +
      Math.round(o.std.lo) + "–" + Math.round(o.std.hi) + "% — where this metric normally sits</title></rect>";
  }
  if (o.target) {
    s += '<line x1="' + x(o.target.green) + '" x2="' + x(o.target.green) + '" y1="' + (TOP - 12) +
      '" y2="' + (TOP + rows.length * RH) + '" stroke="var(--c-target)" stroke-width="1"/>' +
      '<text x="' + x(o.target.green) + '" y="' + (TOP - 16) + '" text-anchor="middle" ' +
      'fill="var(--c-target)">target ' + o.target.green + "%</text>";
  }
  rows.forEach(function (r, i) {
    var yTop = TOP + i * RH;
    var bh = 16;                                 // ≤24px: the band's leftover is air
    var by = yTop + (RH - bh) / 2;
    var rag = ragOf_(r.value, o.target);
    s += "<g>" +
      "<title>" + esc_(r.label + " — " +
        (r.value === null ? "no measurable data" : Math.round(r.value) + "%") +
        " · " + r.n + (r.n === 1 ? " person" : " people") + (r.sub ? " · " + r.sub : "")) + "</title>" +
      '<rect x="0" y="' + yTop + '" width="' + W + '" height="' + RH + '" fill="transparent"/>' +
      '<text class="val" x="0" y="' + (by + 8) + '">' +
        esc_(trunc_(r.label, 22)) + "</text>" +
      '<text class="axis" x="' + (L - 8) + '" y="' + (by + 8) + '" text-anchor="end">' +
        r.n + "</text>";
    if (r.value === null) {
      s += '<text class="axis" x="' + (L + 4) + '" y="' + (by + 8) + '">no measurable data</text></g>';
      return;
    }
    // 4px rounded data-end, square at the baseline.
    var bw = Math.max(2, x(r.value) - L);
    s += '<path d="' + roundEndBar_(L, by, bw, bh, 4) + '" class="barfill" fill="' +
        RAG_FILL[rag] + '"/>' +
      '<text class="val" x="' + (L + bw + 7) + '" y="' + (by + 8) + '">' +
        RAG_MARK[rag] + " " + Math.round(r.value) + "%</text></g>";
  });
  s += "</svg>";
  // Say what was cut. A chart that silently stops at 12 of 52 reads as "there
  // are 12" — the same failure as a truncated table with no ellipsis.
  // Say what was cut, and make it reachable. A cap that can't be lifted turns
  // "too long to read" into "the data isn't there", which is a worse problem
  // than the one it solved — the default stays short, the whole list is one
  // click away.
  if (hidden > 0) {
    var ranked = hidden - hiddenNoData;
    s += '<div class="cellSub" style="margin-top:4px">Showing the ' + rows.length +
      " furthest from target · " +
      (ranked > 0 ? ranked + " nearer target" : "") +
      (ranked > 0 && hiddenNoData > 0 ? " and " : "") +
      (hiddenNoData > 0 ? hiddenNoData + " with no measurable data" : "") +
      " not shown. " +
      (o.onExpand
        ? '<button class="btn" onclick="' + o.onExpand + '" title="' +
          esc_("Draw every one of the " + all.length + " categories. The chart gets long — the " +
               "default keeps the ones carrying a decision at the top of the page.") +
          '">Show all ' + all.length + "</button>"
        : "") + "</div>";
  } else if (o.onExpand && o.expanded && all.length > (o.cap || HBAR_MAX_ROWS_)) {
    s += '<div class="cellSub" style="margin-top:4px">All ' + all.length +
      " shown. " + '<button class="btn" onclick="' + o.onExpand +
      '" title="back to the ' + (o.cap || HBAR_MAX_ROWS_) +
      ' furthest from target">Show top ' + (o.cap || HBAR_MAX_ROWS_) + "</button></div>";
  }
  return s;
}

/** Bar path: square at the baseline (left), radius r on the data end (right). */
function roundEndBar_(x, y, w, h, r) {
  r = Math.min(r, w, h / 2);
  return "M" + x + "," + y + "H" + (x + w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
    "V" + (y + h - r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r + "H" + x + "Z";
}

function trunc_(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/**
 * The KPI-tile micro chart, replacing a bare row of unlabelled bars.
 *
 * Same information density as before plus the three things that were missing:
 * which periods it spans, what the last value was, and where the operating norm
 * sits. Still small enough to live under a hero number.
 */
function sparkHtml_(vals, opts) {
  opts = opts || {};
  var labels = opts.labels || [];
  var W = 240, H = 54, L = 2, R = 30, T = 12, B = 13;
  var pw = W - L - R, ph = H - T - B;
  var std = opts.std && opts.std.ok ? opts.std : null;
  var dom = pctDomain_(vals, std ? [std.lo, std.hi] : []);
  var span = dom.hi - dom.lo || 1;
  function y(v) { return T + ph - (v - dom.lo) / span * ph; }
  function x(i) { return vals.length === 1 ? L + pw / 2 : L + (i / (vals.length - 1)) * pw; }
  var s = '<svg class="chart" style="max-width:240px" viewBox="0 0 ' + W + " " + H + '">';
  if (std) {
    s += '<rect x="' + L + '" y="' + y(std.hi) + '" width="' + pw + '" height="' +
      Math.max(1, y(std.lo) - y(std.hi)) + '" fill="var(--c-ref)" opacity="0.13"><title>' +
      "operating rate " + Math.round(std.lo) + "–" + Math.round(std.hi) +
      "% — where this metric normally sits</title></rect>";
  }
  var run = [], last = null, lastI = -1;
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) {
      if (run.length > 1) s += '<polyline points="' + run.join(" ") +
        '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"/>';
      run = [];
      return;
    }
    run.push(x(i) + "," + y(v));
    last = v; lastI = i;
  });
  if (run.length > 1) s += '<polyline points="' + run.join(" ") +
    '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"/>';
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) return;
    s += '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="' + (i === lastI ? 3.6 : 2.2) +
      '" fill="var(--c-series)" stroke="var(--plot)" stroke-width="1.6"><title>' +
      esc_((labels[i] || "period " + (i + 1)) + " · " + Math.round(v) + "%") + "</title></circle>";
  });
  if (last !== null) {
    s += '<text class="val" x="' + (L + pw + 4) + '" y="' + (y(last) + 4) + '">' +
      Math.round(last) + "%</text>";
  }
  // The two labels that turn a squiggle into a chart: what it starts at and
  // what it ends at, in time.
  //
  // `bare` omits them for the in-table variant. Not a relaxation of the rule —
  // in a 170px table cell the 10px axis text renders at about 6px, which is
  // worse than no label, and the column HEADER carries the span for every row at
  // a readable size. The per-point hover still names each period.
  if (labels.length && !opts.bare) {
    s += '<text class="axis" x="' + L + '" y="' + (H - 2) + '">' + esc_(labels[0]) + "</text>" +
      '<text class="axis" x="' + (L + pw) + '" y="' + (H - 2) + '" text-anchor="end">' +
      esc_(labels[labels.length - 1]) + "</text>";
  }
  return s + "</svg>";
}

/** Confidence chip (FR-2.1) — coverage is part of the number, not a footnote. */
function confChip_(conf, metric) {
  if (!conf || conf.level === "none") return "";
  var pct = conf.coverage === null ? "—" : Math.round(conf.coverage * 100) + "%";
  var gate = Math.round((metric.coverageGate || 0) * 100) + "%";
  var why = {
    high:   "Coverage is at or above the registry gate (" + gate + ") with at least two complete periods behind it.",
    medium: "Coverage is within 10 points of the registry gate (" + gate + "), or there aren't yet two complete periods. Directionally useful; not board-ready.",
    low:    "Coverage is more than 10 points below the registry gate (" + gate + "). The value is suppressed.",
  }[conf.level] || "";
  return '<span class="conf c' + conf.level + '" title="' + esc_(why + " Measured over: " +
    (metric.coverageOf || "attributed records") + ".") + '">' +
    { high: "◆", medium: "◈", low: "◇" }[conf.level] + " " + conf.level +
    " confidence · " + pct + " attributed</span>";
}

/**
 * Suppressed tile (FR-2.2). A metric whose inputs are mostly missing is not a
 * cautious number, it is a different number — so nothing numeric is rendered.
 * Publishing a low-confidence value is treated here as a defect, not a display
 * choice: the alternative is a CEO escalating on a tagging artifact, or writing
 * the tool off for good the first time one is caught.
 */
function suppressedTileHtml_(label, metric, conf, detail, headlineLabel, covTrend, covLabels) {
  var pct = conf.coverage === null ? "—" : Math.round(conf.coverage * 100) + "%";
  // The period used to be repeated here for the same reason it was on every
  // published card — now that it is stated once globally above the row, the
  // repetition is just a stolen line. (Kept as a tooltip: a suppressed card is
  // still a statement about a window.)
  return '<div class="tile sup"><div class="lbl"' +
    (headlineLabel ? ' title="' + esc_(headlineLabel) + '"' : "") + ">" + label + '</div>' +
    '<div class="supbig" title="' + esc_((metric.definition || "") + " Gate: " +
      Math.round((metric.coverageGate || 0) * 100) + "% of " + (metric.coverageOf || "records") +
      ".") + '">Not yet measurable</div>' +
    '<div class="cmp">' + pct + " attributed · gate " +
      Math.round((metric.coverageGate || 0) * 100) + "%</div>" +
    // No owner line (user decision 2026-08-03, same rule as the hygiene table).
    // The registry still carries `owner` and `paramOwner` for the definition
    // record; it just isn't rendered onto a card as a name beside a failure.
    (detail ? '<div class="cmp">' + detail + "</div>" : "") +
    // Trend the COVERAGE, not the metric. Publishing "is the gap closing?" is
    // not publishing the suppressed number — it's the one thing a suppressed
    // card can honestly say, and without it the state looks permanent.
    (covTrend && covTrend.filter(function (v) { return v !== null; }).length >= 2 && !MODEL._stale
      ? '<div class="cmp">attribution trend</div>' + sparkHtml_(covTrend, { labels: covLabels })
      : "") +
    '<div class="cmp"><a href="#" class="hyglink" onclick="showHygiene_();return false">' +
      "What's missing →</a></div></div>";
}

/**
 * Applies the coverage-gate POLICY on top of the band computation.
 *
 * metricConfidence_ decides how good the attribution is; this decides what to do
 * about it. The two are kept apart on purpose — the level, the coverage % and
 * the hygiene link are identical either way, so flipping
 * CONFIG_DH.SUPPRESS_BELOW_GATE changes exactly one thing: whether a weak number
 * is shown or withheld.
 *
 * Shipped setting is "show" (accepted deviation from FR-2.2 — see the config
 * note in Code.js). Only an explicit `true` suppresses, so a cached model
 * predating the flag publishes rather than going dark for the rest of its TTL.
 */
function applyGatePolicy_(conf) {
  if (MODEL.meta.suppressBelowGate === true) return conf;
  if (conf.level === "none") return conf;   // nothing in scope is still nothing
  return { level: conf.level, publish: true, coverage: conf.coverage };
}

/**
 * The three states a gated metric can be in, resolved in one place so they can
 * never be rendered as each other:
 *   nothing in scope   → "—" with the reason. NOT a coverage failure: a quiet
 *                        week with no closed epics is not a data-quality problem,
 *                        and showing it as one trains people to ignore the gate.
 *   below the gate     → published with a low-confidence chip, or suppressed
 *                        when CONFIG_DH.SUPPRESS_BELOW_GATE is on (FR-2.2)
 *   otherwise          → the metric, with its confidence chip
 */
function gatedTile_(label, conf, metric, emptyMsg, suppressDetail, publish, headlineLabel, covTrend, covLabels) {
  if (conf.level === "none") {
    return tileHtml_(label, null, "", [], { unavailable: emptyMsg, headlineLabel: headlineLabel });
  }
  if (!conf.publish) {
    return suppressedTileHtml_(label, metric, conf, suppressDetail, headlineLabel, covTrend, covLabels);
  }
  return publish();
}

function tileHtml_(label, headlinePct, cmpText, trendVals, opts) {
  opts = opts || {};
  if (opts.placeholder) {
    return '<div class="tile ph"><div class="lbl">' + label + '</div>' +
      '<div class="big">—</div><div class="cmp">data pending — reopen/CSAT feed not yet connected</div>' +
      '<div class="cmp"><a href="#" class="hyglink" onclick="showHygiene_();return false">' +
      "What's missing →</a></div></div>";
  }
  if (opts.unavailable) {
    return '<div class="tile ph"><div class="lbl"' +
      (opts.headlineLabel ? ' title="' + esc_(opts.headlineLabel) + '"' : "") + ">" + label + '</div>' +
      '<div class="big">—</div><div class="cmp">' + opts.unavailable + '</div></div>';
  }
  var big = headlinePct === null ? "—" : Math.round(headlinePct) + "%";
  // Per-metric RAG (director feedback: one shared orange made every number look
  // equally alarming) + delta vs the prior complete period + explicit target.
  var t = opts.target || null;
  // FLOOR: a rate whose numerator signal is structurally absent can only
  // undercount, so its value is a lower bound, not a measurement. It gets NO RAG
  // colour at all — not green, not amber. Colour is a verdict, and there is no
  // verdict to give: 0% detected is not 0% happened, and rendering it green made
  // the least-measured number the healthiest-looking card on the screen.
  // Distinct from low coverage (which the confidence chip already handles) —
  // this is about what the numerator can physically contain.
  var floor = !!opts.floor;
  var rag = floor ? "" : ragOf_(headlinePct, t);
  // Lower-is-better metrics (Rework Rate) invert both the colour AND the
  // direction words, or a falling rate would read as a decline.
  var inv = !!(t && t.invert);
  var signal = "";
  if (floor && headlinePct !== null) {
    signal = '<span title="' + esc_(opts.floorWhy || "") +
      '">▱ at least ' + Math.round(headlinePct) + "% — lower bound, not a measurement" +
      (t ? " (target " + (inv ? "≤" : "≥") + t.green + "%)" : "") + "</span>";
  } else if (t && headlinePct !== null) {
    // Variance to TARGET leads (P5/FR-4.1): "3 pts better than last month" is
    // not an answer to "will we make the year?". vs-prior comes second, and is
    // dropped entirely when the data is stale (NFR-7) — a delta computed across
    // a gap in refreshes is a fiction.
    var gap = Math.round(headlinePct - t.green);
    var good = inv ? gap <= 0 : gap >= 0;
    signal += '<span class="' + (good ? "dUp" : "dDown") + '" title="' +
      (good ? "at or better than" : "worse than") + ' the FY27 target of ' +
      (inv ? "≤" : "≥") + t.green + '%">' +
      (gap === 0 ? "on target" : (gap > 0 ? "▲ " : "▼ ") + Math.abs(gap)) +
      (gap === 0 ? "" : " pts") + " vs target " + (inv ? "≤" : "≥") + t.green + "%</span>";
    var vals = (trendVals || []).filter(function (v) { return v !== null; });
    if (vals.length >= 2 && !MODEL._stale) {
      // A sub-half-point move must not print as "▲ 0 pts" — an arrow next to a
      // zero claims a direction the data doesn't support.
      var d = Math.round(vals[vals.length - 1] - vals[vals.length - 2]);
      signal += d === 0
        ? ' · <span title="the change since the prior complete period is under half a point">' +
          "unchanged</span> vs prior"
        : ' · <span class="' + ((inv ? d < 0 : d > 0) ? "dUp" : "dDown") + '">' +
          (d > 0 ? "▲" : "▼") + " " + Math.abs(d) + " pts</span> vs prior";
    }
  }
  // Second reference: the rate we actually run at. "6 pts below target" and
  // "exactly where we always are" are both true of the same number, and an
  // executive needs both before deciding whether anything happened this period.
  var std = opts.std || null;
  var stdLine = "";
  if (std && std.ok && headlinePct !== null) {
    var vc = { above: "dUp", normal: "", below: "dDown" }[std.verdict];
    var vw = { above: "▲ above", normal: "● inside", below: "▼ below" }[std.verdict];
    stdLine = '<span class="' + vc + '" title="Operating rate = the median of the ' +
      std.n + " complete " + (std.basis === "week" ? "WEEKS" : "periods") +
      " in this window, with a ±1 MAD-σ normal range of " +
      Math.round(std.lo) + "–" + Math.round(std.hi) + "%. It is measured, not declared: " +
      "it says how this metric normally behaves, so an ordinary period is never escalated as a move." +
      (std.basis === "week"
        ? " Measured weekly because the window holds too few complete " +
          (std.displayUnit || "periods") + " for a stable rate."
        : "") + '">' +
      vw + " normal (" + Math.round(std.baseline) + "%" +
      (std.basis === "week" ? ", weekly basis" : "") + ")</span>" +
      (std.run >= 4 ? ' · <span class="' + vc + '" title="' + std.run +
        " consecutive periods on the same side of the norm — a sustained shift in the operating rate, " +
        'not a single bad period">' + std.run + " in a row</span>" : "");
  }
  // ── CARD GRAMMAR (fixed, four lines maximum) ────────────────────────────
  //   label → hero → coverage chip → delta-vs-target → ONE context line → sparkline
  //
  // The period is NOT in the label: it was repeating in all four headers,
  // stating one fact four times and stealing a line from each card. It is
  // printed once, globally, above the row.
  //
  // Everything else — unattributed counts, median variance, miss-direction
  // split, classification coverage, the CSAT note — is real and
  // stays reachable, but as the context line's tooltip, not as a fifth through
  // eighth line. Quality carried eight lines and Forecast seven, which put the
  // four sparkline baselines at four different heights: the row stopped reading
  // as a set of comparable cards and started reading as four unrelated blocks.
  // A director scanning for the worst number should not have to re-find the
  // baseline in each card.
  var detail = (opts.detail || []).filter(Boolean).join(" · ");
  var context = cmpText + (detail
    ? ' <span class="cellSub" title="' + esc_(detail) + '" style="cursor:help">ⓘ</span>' : "");
  return '<div class="tile"><div class="lbl">' + label + '</div>' +
    '<div class="big ' + rag + '">' + big + '</div>' +
    (opts.conf ? '<div class="cmp">' + confChip_(opts.conf, opts.metric || {}) + '</div>' : "") +
    (signal ? '<div class="cmp">' + signal + '</div>' : "") +
    (stdLine ? '<div class="cmp">' + stdLine + '</div>' : "") +
    '<div class="cmp">' + context + '</div>' +
    // A published-but-below-gate number keeps its route into the hygiene queue.
    // Suppression is off, so this line is the whole safeguard: the reader is
    // told the figure sits under its gate and where to go to see why, instead of
    // the tool deciding for them.
    (opts.conf && opts.conf.level === "low"
      ? '<div class="cmp"><span class="clow" title="' +
        esc_("Attribution is more than 10 points below this metric's registry gate of " +
             Math.round(((opts.metric || {}).coverageGate || 0) * 100) + "%. The figure is shown " +
             "rather than suppressed (an accepted deviation from FR-2.2), so read it as directional " +
             "and check what is missing before quoting it.") +
        '">below gate — directional only</span> · ' +
        '<a href="#" class="hyglink" onclick="showHygiene_();return false">What\'s missing →</a></div>'
      : "") +
    (MODEL._stale ? '<div class="cmp stalenote" title="the model has not been rebuilt inside the stated refresh cadence — trend comparisons are suppressed until it refreshes">trend suppressed — data stale</div>'
                  : sparkHtml_(trendVals, { labels: opts.trendLabels, std: std })) + '</div>';
}

/** True when the NS billable feed is actually delivering data — nsAvailable
    with ZERO classified person-weeks is a broken join/empty feed, not a
    measured 0% (director feedback: the hero read 0% next to tracked 71%).
    Keyed on nsCov rather than billable hours: under the ratio model a covered
    week with a 0% billable mix is a real measurement, not an empty feed. */
function nsLive_() {
  if (!MODEL.meta.nsAvailable) return false;
  if (MODEL._nsLive === undefined) {
    var cov = 0;
    MODEL.people.forEach(function (p) {
      Object.keys(p.weeks).forEach(function (iso) { if (p.weeks[iso].nsCov) cov++; });
    });
    MODEL._nsLive = cov > 0;
  }
  return MODEL._nsLive;
}

/** Small-sample flag for issue-based tiles (n=10 is a headline built on 10 epics). */
function smallN_(n) { return n > 0 && n < 15 ? " · ⚠ small sample" : ""; }

function renderTiles_() {
  // Headline = the ANALYSIS period (picker selection, or the last complete
  // period); trend = up to the 6 complete periods ENDING at it, so a reader
  // stepping back in time sees the history as it stood then.
  var per = allPeriods_();
  var done = per.filter(function (p) { return p.status === "done" && !p.partial; });
  var hi = headPeriodIdx_(done);
  var head = done.length ? done[hi] : { label: "—", isos: [] };
  var trendPer = done.slice(Math.max(0, hi - 5), hi + 1);
  var trendLabels = trendPer.map(function (p) { return p.label; });
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  // Explicit period framing: the tiles are the analysis period, the grid
  // highlights the current one — say so instead of two bare labels.
  var opts = { headlineLabel: (STATE.periodIdx === null ? "last complete " : "selected ") +
                              unit + " (" + head.label + ")" };
  var tg = MODEL.meta.targets || {};

  var live = nsLive_();
  var u = utilFor_(head.isos);
  // Metrics Dictionary: "Hours logged / total available capacity hours
  // (headcount × standard hours)". The headline divides by GROSS scheduled
  // capacity — the ONLY denominator: no absenteeism is modelled (user decision
  // 2026-08-04), so there is no net-of-absence companion rate any more.
  var utilHeadline = live ? u.grossPct : u.grossTrackedPct;
  var utilCmp = live
    ? 'of scheduled capacity · <span title="Tracked time is classified two ways only — billable and non-billable. Time off tracked in Tempo is non-billable (it cannot be charged to a customer project); capacity is never reduced for absence.">billable vs non-billable only</span>'
    : (MODEL.meta.nsAvailable
        ? "tracked ÷ scheduled capacity · the NetSuite billable feed is empty, so no billable claim is made here"
        : "tracked ÷ scheduled capacity · the NetSuite billable feed is unavailable, so no billable claim is made here");
  // Honesty note (same pattern as the Jira "unattributed" counts): say when
  // the rate excludes people on maternity/parental/long leave.
  var onLeaveN = MODEL.people.filter(function (p) {
    return p.onLeave && passesFilters_(p);
  }).length;
  if (onLeaveN) {
    utilCmp += ' · <span title="on maternity/parental/long leave (roster Employee Status) — capacity and hours excluded from this rate">' +
      onLeaveN + " on leave excluded</span>";
  }
  var internN = MODEL.people.filter(function (p) {
    return p.isIntern && !p.attribOnly && passesFilters_(p);
  }).length;
  if (internN) {
    utilCmp += ' · <span title="Interns (level I1) never move a published rate — in training, not delivery capacity. Their profiles and hours stay on the People roster, marked 🎓.">' +
      internN + " intern" + (internN === 1 ? "" : "s") + " excluded</span>";
  }
  // NS classification coverage (audit 2026-08-03). The rate only describes the
  // hours NetSuite actually classified; say what share that is, so a headline
  // built on a third of the tracked base is never read as the whole team's.
  if (live && u.tracked > 0) {
    var covPct = Math.round(u.trackedCov / u.tracked * 100);
    if (covPct < 99) {
      utilCmp += '<br><span title="Tempo says how many hours were worked; NetSuite says what share of them is billable. Person-weeks with no NetSuite signal are excluded from BOTH sides of this rate rather than counted as 0% billable — so this % describes the classified portion of the tracked base only.">⚠ classification covers ' +
        covPct + "% of tracked hours (" + r1_(u.trackedCov) + "h of " + r1_(u.tracked) + "h)</span>";
    }
  }
  // Series are built over EVERY complete period in the window, not just the six
  // the sparkline shows: the six drive the picture, the whole history drives the
  // operating rate. Sliced, never recomputed — one pass per metric.
  var utilSeries = done.map(function (p) {
    var s = utilFor_(p.isos);
    return live ? s.grossPct : s.grossTrackedPct;   // same definition as the headline
  });
  var utilTrendShown = utilSeries.slice(Math.max(0, hi - 5), hi + 1);

  var ot = bucketsFor_(MODEL.onTimeBuckets, head.isos);
  var otSeries = done.map(function (p) {
    var b = bucketsFor_(MODEL.onTimeBuckets, p.isos);
    return b.n > 0 ? b.onTime / b.n * 100 : null;
  });
  var otTrend = otSeries.slice(Math.max(0, hi - 5), hi + 1);
  var unatt = MODEL.meta.jiraUnattributed || { onTime: 0, forecast: 0 };
  // Name the scope on the card: "85% on time" means something different over
  // Stories/Tasks than over epics, and the switch lives in CONFIG_DH.
  var OT_SCOPE = {
    // The shipped scope. Missing from this map until 2026-08-04, so the card
    // fell back to "resolved issues" with a tooltip claiming epics were
    // excluded — the exact opposite of what the number measured.
    dictionary: { word: "resolved epics / milestones / commitments",
      why: "The Metrics Dictionary scope: epics, Milestone-type issues and Client-Commitment-labelled work. Stories and Tasks are excluded — an epic's due date is the client-facing milestone." },
    delivery: { word: "resolved issues",
      why: "Stories and Tasks — the team's own delivery commitments. Epics are excluded: an epic's due date is a programme milestone set by the PM and its resolution trails its last child, so the two measure different lifecycles." },
    epic: { word: "resolved epics",
      why: "Epics only — milestone-level client commitments, per the Metrics Dictionary. Stories and Tasks are excluded." },
    all: { word: "resolved items (all types)",
      why: "Every resolved issue type in one rate, epics included. Mixes programme milestones with task-level commitments — kept only for comparison with the pre-2026-08-03 number." },
  };
  var otSc = OT_SCOPE[MODEL.meta.onTimeScope] || OT_SCOPE.delivery;
  var otCmp = ot.n + " of " + ot.nAll + " " + otSc.word +
    ' <span title="' + esc_(otSc.why) + '">had a due date ⓘ</span>' + smallN_(ot.n) +
    (unatt.onTime
      ? ' <span title="resolved items whose Jira assignee does not resolve to any roster row — excluded from this card under every filter. Counted over the WHOLE 52-week export, not just the period on screen; the Data Hygiene gaps table shows the per-period join rate.">· ' +
        unatt.onTime + " unattributed (export window)</span>"
      : "");
  var fc = bucketsFor_(MODEL.forecastBuckets, head.isos);
  var fcSeries = done.map(function (p) {
    var b = bucketsFor_(MODEL.forecastBuckets, p.isos);
    return forecastAccuracyPct_(b.absVars);   // Dictionary formula, same as the headline
  });
  var fcTrend = fcSeries.slice(Math.max(0, hi - 5), hi + 1);
  var band = Math.round((MODEL.meta.forecastBand || 0.10) * 100);
  // Headline = the Dictionary mean. The band and the median ride underneath as
  // companions: the mean says how close on average, the band says how often we
  // actually hit, and the median says how big a typical miss is. Any one of the
  // three alone is quotable in a misleading direction.
  var fcHeadline = forecastAccuracyPct_(fc.absVars);
  var fcDetail = [];
  var fcCmp = '<span title="' + esc_(reg_("forecast").formula || "") +
    ' Floored at zero per epic, so one runaway engagement cannot drag a good period negative.">' +
    "mean accuracy over " + fc.n + " measurable epic" + (fc.n === 1 ? "" : "s") + " ⓘ</span>" +
    smallN_(fc.n);
  fcDetail.push("How often we landed inside the band, as opposed to how close on average: " +
    fc.nWithin + " of " + fc.n + " inside ±" + band + "%.");
  if (fc.nAll > fc.n) {
    fcDetail.push((fc.nAll - fc.n) + " of " + fc.nAll + " closed epics not measurable — no estimate, " +
      "or an estimate with no logged time at all: nothing to compare, so they count toward coverage " +
      "only instead of scoring as misses.");
  }
  if (unatt.forecast) {
    fcDetail.push(unatt.forecast + " closed epics unattributed across the whole export window — the Jira assignee " +
      "does not resolve to any roster row, so they are excluded from this card under every filter.");
  }
  // Secondary form (FR-1.4): the band says whether we hit estimates, the median
  // says by how much we miss. Both are needed — 40% inside the band reads very
  // differently at a 12% median variance than at a 90% one.
  var med = medianOf_(fc.absVars);
  if (med !== null) {
    fcDetail.push("Median absolute variance " + Math.round(med * 100) + "% — median of " +
      "|actual − estimate| ÷ estimate across the measurable epics. A median, not a mean: one " +
      "runaway engagement should not define the team's forecasting.");
  }
  // Direction of the miss (FR-1.6): the same accuracy reads the same whether the
  // team over-runs or closes early, and those need opposite conversations —
  // over-runs burn margin, under-runs mean capacity was held that could have
  // been sold. Counted on misses only; an epic inside the band is on target.
  var misses = fc.nMissOver + fc.nMissUnder;
  if (misses > 0) {
    var overShare = Math.round(fc.nMissOver / misses * 100);
    fcDetail.push("Of " + misses + " miss" + (misses === 1 ? "" : "es") + ", " + overShare +
      "% over-run — over-runs burn margin, under-runs mean capacity was held that could have " +
      "been sold. Opposite conversations.");
  }

  // ── Confidence gates (FR-2.1/2.2) ──────────────────────────────────────────
  // Coverage is recomputed under the ACTIVE FILTERS, because a well-tagged
  // region can be publishable while the whole population isn't. stablePeriods =
  // complete periods that actually carried data.
  function stable_(vals) { return vals.filter(function (v) { return v !== null; }).length; }
  var regOt = reg_("onTime"), regFc = reg_("forecast"), regU = reg_("util");
  // Coverage per period — what a suppressed card trends instead of the metric.
  var otCovTrend = trendPer.map(function (p) {
    var b = bucketsFor_(MODEL.onTimeBuckets, p.isos);
    return b.nAll > 0 ? b.n / b.nAll * 100 : null;
  });
  var fcCovTrend = trendPer.map(function (p) {
    var b = bucketsFor_(MODEL.forecastBuckets, p.isos);
    return b.nAll > 0 ? b.n / b.nAll * 100 : null;
  });
  var utilCovTrend = trendPer.map(function (p) {
    var s = utilFor_(p.isos);
    return s.tracked > 0 ? s.trackedCov / s.tracked * 100 : null;
  });
  var otConf = applyGatePolicy_(
    metricConfidence_(regOt.coverageGate, ot.nAll > 0 ? ot.n / ot.nAll : null, stable_(otTrend)));
  var fcConf = applyGatePolicy_(
    metricConfidence_(regFc.coverageGate, fc.nAll > 0 ? fc.n / fc.nAll : null, stable_(fcTrend)));
  // Utilization: when NetSuite isn't classifying anything, the number on screen
  // is tracked ÷ capacity — a DIFFERENT metric. Relabel it rather than publish
  // it under a billable heading (P8: one definition, one owner).
  var utilLabel = live ? "Billable Utilization" : "Capacity Utilization (tracked)";
  var utilCov = u.tracked > 0 ? u.trackedCov / u.tracked : null;
  var utilConf = applyGatePolicy_(live
    ? metricConfidence_(regU.coverageGate, utilCov, stable_(utilTrendShown))
    : metricConfidence_(0, u.avail > 0 ? 1 : null, stable_(utilTrendShown)));

  // Operating rates. stdFor_ returns null — not a number — for a stale model or
  // a metric below its coverage gate, so a suppressed card can never sprout an
  // authoritative-looking "norm" derived from the very data that suppressed it.
  var otStd = stdFor_(otSeries, otConf);
  var fcStd = stdFor_(fcSeries, fcConf);
  var utilStd = stdFor_(utilSeries, utilConf);

  // Outcome measures lead (director decision 2026-07-31): On-Time is the hero,
  // Forecast second; utilization is a capacity-health tile in slot three.
  // Out-of-tier cards are omitted from the string entirely — not dimmed, not
  // rendered-then-hidden. There is nothing in the DOM to inspect or screenshot.
  var margin = canSeeMargin_();
  document.getElementById("tiles").innerHTML =
    (MODEL.meta.jiraAvailable
      ? gatedTile_("On-Time Delivery", otConf, regOt,
          "no resolved delivery items in this period under the active filters",
          (ot.nAll - ot.n) + " of " + ot.nAll + " resolved items have no due date",
          function () {
            return tileHtml_("On-Time Delivery", ot.n > 0 ? ot.onTime / ot.n * 100 : null, otCmp, otTrend,
                             { headlineLabel: opts.headlineLabel, target: tg.onTime, conf: otConf,
                               metric: regOt, std: otStd, trendLabels: trendLabels });
          }, opts.headlineLabel, otCovTrend, trendLabels) +
        (!margin ? "" : gatedTile_("Forecast Accuracy", fcConf, regFc,
          "no epics closed in this period under the active filters",
          (fc.nAll - fc.n) + " of " + fc.nAll + " closed epics have no estimate or no logged time",
          function () {
            return tileHtml_("Forecast Accuracy", fcHeadline, fcCmp, fcTrend,
                             { headlineLabel: opts.headlineLabel, target: tg.forecast, conf: fcConf,
                               metric: regFc, std: fcStd, trendLabels: trendLabels,
                               detail: fcDetail });
          }, opts.headlineLabel, fcCovTrend, trendLabels))
      : tileHtml_("On-Time Delivery", null, "", [], { unavailable: "Jira data unavailable" }) +
        (!margin ? "" : tileHtml_("Forecast Accuracy", null, "", [], { unavailable: "Jira data unavailable" }))) +
    (!margin ? "" : gatedTile_(utilLabel, utilConf, regU,
      "no availability in this period under the active filters",
      r1_(u.tracked - u.trackedCov) + "h of " + r1_(u.tracked) + "h tracked carry no billable classification",
      function () {
        return tileHtml_(utilLabel, utilHeadline, utilCmp, utilTrendShown,
                         { headlineLabel: opts.headlineLabel, target: tg.util, conf: utilConf,
                           metric: regU, std: utilStd, trendLabels: trendLabels });
      }, opts.headlineLabel, utilCovTrend, trendLabels)) +
    qualityTile_(done, trendPer, trendLabels, opts.headlineLabel, head, hi);
  // Colour key for the cards AND the comparison bars below — one key, because
  // they use the same grading. "Its own target" rather than a number: On-Time
  // grades against 85/70, Forecast 80/60, Utilization 70/50, and each card
  // prints its own, so the key names the rule and the cards carry the numbers.
  document.getElementById("tileColorKey").innerHTML = ragKeyHtml_(
    "the metric's <b>own</b> FY27 target, printed on its card",
    "Rework Rate reverses the scale — lower is better. The comparison bars below use the same colours.");
}

// ── 🌊 FLOW TILES — compact tier inside Executive (spec 2026-08-05-flow-metrics-design.md,
//    §4.1 retirement of the standalone tab) ──────────────────────────────────

function flowMedian_(arr) {
  if (!arr || !arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function flowP85_(arr) {
  if (!arr || !arr.length) return null;
  var s = arr.slice().sort(function (a, b) { return a - b; });
  return s[Math.min(s.length - 1, Math.max(0, Math.ceil(s.length * 0.85) - 1))];
}

/** Backlog/WIP current values over the people passing the active filters.
    Person-keyed and snapshot-shaped — no iso (a backlog is not a time series). */
function flowOpenFor_() {
  if (!MODEL._pByName) {
    MODEL._pByName = {};
    MODEL.people.forEach(function (p) { MODEL._pByName[p.name] = p; });
  }
  var out = { wipN: 0, todoN: 0, todoEst: 0, todoHrs: 0 };
  (MODEL.flowOpenBuckets || []).forEach(function (b) {
    var person = b.person ? MODEL._pByName[b.person] : null;
    if (!person || !passesFilters_(person)) return;
    if (person.isIntern) return;   // same rule as bucketsFor_
    out.wipN += b.wipN || 0; out.todoN += b.todoN || 0;
    out.todoEst += b.todoEst || 0; out.todoHrs += b.todoHrs || 0;
  });
  return out;
}

/** True when the user has NOT actively narrowed scope — the only state in
    which the whole-population snapshot trend is honest to draw under the
    current filters.
    Deliberately NOT `filteredPeople_().length === MODEL.people.length`: that
    equality can never hold on a real payload. MODEL.people always includes
    attribOnly identity stubs (filteredPeople_ excludes them unconditionally,
    §"People passing every active filter" above) and the default population
    lens is "fte" (STATE.pop), which excludes crew — so even with every filter
    at its default, filteredPeople_().length is strictly less than
    MODEL.people.length. That made this always false, so the Backlog/WIP
    snapshot sparkline never rendered and the "clear filters" note showed with
    nothing to clear.
    The correct rule: compare STATE's filter dimensions to their defaults
    directly, not headcounts. Default state (including the default "fte"
    population lens) counts as unfiltered; any user-set narrowing — including
    switching the population lens away from its default — hides the trend. */
function flowUnfiltered_() {
  return STATE.pop === "fte" && STATE.role === "all" &&
    !STATE.region && !STATE.team && !STATE.pm && !STATE.family &&
    !STATE.flag && !STATE.search;
}

function fmtFlowVal_(v, unit) {
  if (v === null || v === undefined) return "—";
  var n = unit === "days" ? Math.round(v * 10) / 10 : Math.round(v);
  return n + (unit === "days" ? "d" : unit === "hrs" ? "h" : "");
}

/**
 * Flow KPI card. tileHtml_ is deliberately NOT reused: it renders percentages
 * with RAG-vs-target grammar, and every flow metric is unit-bearing (days,
 * hours, items) with target: null — neutral by design (registry D6).
 * Grammar: label → hero value → confidence chip → context line → sparkline.
 */
function flowTileHtml_(m, headline, opts) {
  opts = opts || {};
  var name = (m && m.name) || opts.label || "";
  if (m && m.status === "absent") {
    return '<div class="tile ph"><div class="lbl">' + esc_(name) + '</div>' +
      '<div class="big">—</div><div class="cmp" title="' + esc_(m.absentReason || "") + '">' +
      esc_((m.absentReason || "not measured").split("—")[0].trim()) +
      ' <span class="cellSub" style="cursor:help">ⓘ</span></div></div>';
  }
  if (opts.unavailable) {
    return '<div class="tile ph"><div class="lbl">' + esc_(name) + '</div>' +
      '<div class="big">—</div><div class="cmp">' + esc_(opts.unavailable) + '</div></div>';
  }
  var detail = (opts.detail || []).filter(Boolean).join(" · ");
  var context = (opts.context || "") + (detail
    ? ' <span class="cellSub" title="' + esc_(detail) + '" style="cursor:help">ⓘ</span>' : "");
  var vals = (opts.trend || []).filter(function (v) { return v !== null; });
  var delta = "";
  if (vals.length >= 2 && !MODEL._stale && headline !== null) {
    var d = vals[vals.length - 1] - vals[vals.length - 2];
    var mag = m && m.unit === "days" ? Math.round(d * 10) / 10 : Math.round(d);
    // NEUTRAL arrows — no dUp/dDown class: with target: null there is no
    // verdict, and colouring a direction would invent one (registry D6).
    delta = mag === 0
      ? '<span title="unchanged vs the prior complete period">unchanged vs prior</span>'
      : '<span>' + (mag > 0 ? "▲" : "▼") + " " + Math.abs(mag) +
        (m && m.unit === "days" ? "d" : m && m.unit === "hrs" ? "h" : "") + " vs prior</span>";
  }
  return '<div class="tile"><div class="lbl">' + esc_(name) + '</div>' +
    '<div class="big">' + fmtFlowVal_(headline, m && m.unit) + '</div>' +
    (opts.conf ? '<div class="cmp">' + confChip_(opts.conf, m || {}) + '</div>' : "") +
    (delta ? '<div class="cmp">' + delta + '</div>' : "") +
    '<div class="cmp">' + context + '</div>' +
    (MODEL._stale
      ? '<div class="cmp stalenote" title="the model has not been rebuilt inside the stated refresh cadence — trend comparisons are suppressed until it refreshes">trend suppressed — data stale</div>'
      : (opts.trend ? sparkHtml_(opts.trend, { labels: opts.trendLabels }) : "")) +
    '</div>';
}

function renderFlow_() {
  var el = document.getElementById("flowTiles");
  var reg = ((MODEL.meta.registry || {}).metrics) || {};
  if (!MODEL.meta.jiraAvailable) {
    el.innerHTML = '<div class="tile ph"><div class="lbl">🌊 Flow</div>' +
      '<div class="big">—</div><div class="cmp">Jira data unavailable — the Jira Raw tab could not be read</div></div>';
    return;
  }
  var done = donePeriods_();
  var hi = headPeriodIdx_(done);
  var trendPer = done.slice(Math.max(0, hi - 5), hi + 1);
  var head = done[hi] || { isos: [], label: "—" };
  var labels = trendPer.map(function (p) { return p.label; });
  var periodsWithData = 0;   // recomputed per metric below
  var html = "";

  // 1 · Lead Time — median days, p85 companion (raw day values travel per
  // bucket; the client medians whatever the filters select).
  (function () {
    var m = reg.leadTime || { unit: "days", coverageGate: 0.9, name: "Lead Time" };
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.leadTimeBuckets || [], p.isos);
      return b.days.length ? flowMedian_(b.days) : null;
    });
    var b = bucketsFor_(MODEL.leadTimeBuckets || [], head.isos);
    periodsWithData = series.filter(function (v) { return v !== null; }).length;
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.n / b.nAll : null, periodsWithData);
    html += flowTileHtml_(m, b.days.length ? flowMedian_(b.days) : null, {
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.n > 0
        ? "p85 " + fmtFlowVal_(flowP85_(b.days), "days") + " · " + b.n + " issues measured" + smallN_(b.n)
        : "no issues resolved this period",
      detail: [
        "Calendar days from Created to Resolution Date, non-epic issues, median of the period.",
        b.nAll > b.n ? (b.nAll - b.n) + " resolved issues had no usable created date" : "",
        unattribNote_("leadTime"),
      ],
    });
  })();

  // 2/6 · Cycle Time and Flow Efficiency are declared ABSENT in the registry
  // (no in-progress timestamps / no queue-state instrumentation). They used to
  // render as "—" placeholder tiles; retired from the UI 2026-08-05 (spec
  // §4.1) — the registry + Data Reference remain the record of what is
  // deliberately not measured.

  // 3 · Throughput — Σ estimate-hours delivered.
  (function () {
    var m = reg.throughput || { unit: "hrs", coverageGate: 0.6, name: "Throughput" };
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], p.isos);
      return b.nAll > 0 ? b.estHrs : null;
    });
    var b = bucketsFor_(MODEL.throughputBuckets || [], head.isos);
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.nEst / b.nAll : null,
      series.filter(function (v) { return v !== null; }).length);
    html += flowTileHtml_(m, b.nAll > 0 ? b.estHrs : null, {
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.nAll > 0
        ? b.nEst + " of " + b.nAll + " resolved issues carried an estimate" + smallN_(b.nEst)
        : "no issues resolved this period",
      detail: [
        "Sum of Original Estimate hours on non-epic issues resolved in the period. Unestimated work delivers invisibly here — the fix is estimate fill.",
        unattribNote_("throughput"),
      ],
    });
  })();

  // 4+5 · Backlog and WIP — snapshot metrics: current value from the filtered
  // open book; trend from the exporter's whole-population snapshot log.
  (function () {
    var open = flowOpenFor_();
    var snaps = MODEL.meta.flowSnapshots || [];
    var snapsOk = !!MODEL.meta.flowSnapshotsAvailable;
    var unfiltered = flowUnfiltered_();
    // Trend at week grain regardless of the unit chips — snapshots are weekly
    // rows; month/quarter would need a last-snapshot-per-period walk that the
    // spec assigns to the same rule (last row of the period), so pick the
    // snapshot whose iso is the LAST iso of each displayed period.
    function snapTrend(field) {
      if (!snapsOk || !unfiltered) return null;
      var byIso = {};
      snaps.forEach(function (s) { byIso[s.iso] = s; });
      return trendPer.map(function (p) {
        for (var i = p.isos.length - 1; i >= 0; i--) {
          if (byIso[p.isos[i]]) return byIso[p.isos[i]][field];
        }
        return null;
      });
    }
    var noSnapNote = !snapsOk
      ? "trend pending — export predates Jira Backlog.js v3.9.0"
      : (!unfiltered ? "trend available for the full population only — clear filters to see it" : "");
    var histStart = snapsOk && snaps.length ? snaps[0].iso : null;

    var mB = reg.backlog || { unit: "hrs", coverageGate: 0.6, name: "Backlog (Inventory)" };
    var bTrend = snapTrend("backlogHrs");
    var bPoints = (bTrend || []).filter(function (v) { return v !== null; }).length;
    var bConf = metricConfidence_(mB.coverageGate || 0,
      open.todoN > 0 ? open.todoEst / open.todoN : null, Math.max(1, bPoints));
    html += flowTileHtml_(mB, open.todoN > 0 || open.todoEst > 0 ? open.todoHrs : (open.todoN === 0 ? 0 : null), {
      conf: open.todoN > 0 ? bConf : null,
      trend: bPoints >= 2 ? bTrend : null, trendLabels: labels,
      context: open.todoN + " items waiting to start · " +
        open.todoEst + " estimated" +
        (noSnapNote ? " · " + noSnapNote
          : (bPoints < 2 && histStart ? " · history accumulates from " + histStart : "")),
      detail: [
        "Σ max(0, Original Estimate − Time Spent) over open assigned non-epic issues in status category To Do.",
        "Trend is whole-population — the exporter's snapshot knows nothing of dashboard filters.",
        MODEL.meta.flowUncategorized ? MODEL.meta.flowUncategorized +
          " open items sit in a status category that is neither To Do nor In Progress — counted in neither tile" : "",
        unattribNote_("flowOpen"),
      ],
    });

    var mW = reg.wip || { unit: "items", coverageGate: 0, name: "Work In Progress" };
    var wTrend = snapTrend("wip");
    var wPoints = (wTrend || []).filter(function (v) { return v !== null; }).length;
    html += flowTileHtml_(mW, open.wipN, {
      conf: null,   // a count over rows that exist — a coverage chip would be noise
      trend: wPoints >= 2 ? wTrend : null, trendLabels: labels,
      context: open.wipN + " active items right now" +
        (noSnapNote ? " · " + noSnapNote
          : (wPoints < 2 && histStart ? " · history accumulates from " + histStart : "")),
      detail: [
        "Open, assigned, non-epic issues in status category In Progress — a point-in-time count, not a period rate.",
        "Trend is whole-population — same snapshot log as Backlog.",
      ],
    });
  })();

  // 7 · Bug Count — POPULATION-WIDE (registry deviation: bugs are routinely
  // unassigned at creation, so a roster join would silently drop most of them).
  (function () {
    var m = reg.bugCount || { unit: "bugs", coverageGate: 0, name: "Bug Count" };
    if (!MODEL.meta.bugsAvailable) {
      html += flowTileHtml_(m, null,
        { unavailable: "export predates Jira Backlog.js v3.9.0 — no Jira Bugs tab yet" });
      return;
    }
    var byIso = {};
    (MODEL.bugWeekly || []).forEach(function (w) { byIso[w.iso] = w; });
    function sumOver(isos, field) {
      var t = 0;
      isos.forEach(function (iso) { if (byIso[iso]) t += byIso[iso][field] || 0; });
      return t;
    }
    var series = trendPer.map(function (p) { return sumOver(p.isos, "nCreated"); });
    var created = sumOver(head.isos, "nCreated");
    var resolved = sumOver(head.isos, "nResolved");
    html += flowTileHtml_(m, created, {
      conf: null,
      trend: series, trendLabels: labels,
      context: resolved + " resolved this period — book " +
        (created > resolved ? "growing" : created < resolved ? "shrinking" : "flat") +
        " · population-wide, filters don't apply",
      detail: [
        "Bug issues created in the period, whole population. A zero here is a REAL zero — bugs are a countable absence.",
        "Noise-filtered at export: Won't Do / Duplicate / Canceled bugs were reports, not defects.",
        "Distinct from Quality/Rework — a bug feeds neither leg of the rework rate.",
      ],
    });
  })();

  el.innerHTML = html;
}

/** "N issues not attributable to a roster person" note, or "" when clean. */
function unattribNote_(key) {
  var u = (MODEL.meta.jiraUnattributed || {})[key] || 0;
  return u > 0 ? u + " issues excluded — assignee doesn't join the roster (window-wide count)" : "";
}

/**
 * Quality / Rework — the Metrics Dictionary's fourth metric, live since
 * schema v10 (was a "data pending" placeholder).
 *
 *   Rework Rate = (reopened OR Rework-linked) ÷ delivered in period × 100
 *
 * LOWER IS BETTER, which is why its target carries `invert` — without that a
 * 3% rework rate would paint red for being "below target".
 *
 * The card is explicit about which of the two signals it actually saw. Reopen
 * detection needs expand=changelog in the export and is off by default, so most
 * of the time this rate is LINK-ONLY and therefore an understatement. Saying so
 * on the card is the difference between a floor and a measurement.
 */
function qualityTile_(done, trendPer, trendLabels, headlineLabel, head, hi) {
  var reg = reg_("quality");
  var tg = (MODEL.meta.targets || {}).quality ||
           (reg.target ? { green: reg.target.green, amber: reg.target.amber } : null);
  if (tg) tg = { green: tg.green, amber: tg.amber, invert: reg.invertTarget !== false };

  if (!MODEL.meta.jiraAvailable || !MODEL.reworkBuckets) {
    // No reworkBuckets at all = a pre-v10 cached payload, not an empty period.
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: MODEL.meta.jiraAvailable
        ? "rework feed not in this payload — refresh to rebuild on the current schema"
        : "Jira data unavailable",
    });
  }

  var q = bucketsFor_(MODEL.reworkBuckets, head.isos);
  var series = done.map(function (p) {
    var b = bucketsFor_(MODEL.reworkBuckets, p.isos);
    return b.nDelivered > 0 ? b.nRework / b.nDelivered * 100 : null;
  });
  var hIdx = hi === undefined ? done.length - 1 : hi;
  var trend = series.slice(Math.max(0, hIdx - 5), hIdx + 1);

  if (!q.nDelivered) {
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: "no delivered work in this period under the active filters",
    });
  }

  var pct = q.nRework / q.nDelivered * 100;
  // Reopens are one of the two signals in the Dictionary definition. When the
  // export never fetched the changelog (CONFIGJ.FETCH_CHANGELOG off) the
  // numerator CANNOT contain them, so the rate is a floor whatever its value.
  var isFloor = q.nReopenCov === 0;
  // Coverage = the share of delivered work whose rework signals were actually
  // measurable. The link signal exists on every v3.6.0 row; the reopen signal
  // only where the changelog was fetched. With reopens off, half the definition
  // is unmeasured and the confidence gate has to see that.
  var reopenCov = q.nDelivered > 0 ? q.nReopenCov / q.nDelivered : 0;
  var coverage = (1 + reopenCov) / 2;   // link signal always present, reopen maybe
  var conf = applyGatePolicy_(
    metricConfidence_(reg.coverageGate, coverage,
                      series.filter(function (v) { return v !== null; }).length));

  var qDetail = [];
  var cmp = q.nRework + " of " + q.nDelivered + " delivered items needed rework" +
    smallN_(q.nDelivered);
  qDetail.push("Signals: " + q.nLinked + " rework-linked" +
    (q.nReopenCov > 0
      ? ", " + q.nReopened + " reopened (of " + q.nReopenCov + " checked)."
      : ". Reopens NOT measured — the export did not fetch the Jira changelog."));
  if ((MODEL.meta.jiraUnattributed || {}).rework) {
    qDetail.push(MODEL.meta.jiraUnattributed.rework + " delivered items unattributed — the Jira " +
      "assignee is not on the delivery roster, so they are excluded under every filter.");
  }

  // The single most important caveat on this card, stated in plain words rather
  // than buried in the ⓘ: a link-only rate is a FLOOR, not a measurement.
  // The floor caveat is NOT demoted: it is the difference between "we ship clean
  // work" and "we cannot see rework". It rides on the hero's own signal line now
  // (tileHtml_ opts.floor), which is MORE prominent than the fifth body line it
  // used to occupy, not less.
  if (q.nReopenCov === 0) {
    qDetail.push("Reopen detection needs expand=changelog on the Jira export " +
      "(CONFIGJ.FETCH_CHANGELOG), which is off by default because it is expensive. Until it is " +
      "on, an issue that was reopened but never link-tagged is invisible here.");
  }
  qDetail.push("CSAT companion not connected: the Metrics Dictionary pairs this rate with a CSAT " +
    "score (0–100). The survey API is not wired — PR-09, target 2026.W37.");

  return gatedTile_("Quality / Rework", conf, reg,
    "no delivered work in this period under the active filters",
    Math.round((1 - coverage) * 100) + "% of the rework definition is unmeasured",
    function () {
      return tileHtml_("Quality / Rework", pct, cmp, trend,
                       { headlineLabel: headlineLabel, target: tg, conf: conf,
                         floor: isFloor, detail: qDetail,
                         floorWhy: "Reopen detection is one of the two signals in this metric and " +
                           "the export did not fetch it (CONFIGJ.FETCH_CHANGELOG is off), so the " +
                           "numerator can only undercount. The true rate is this value or higher — " +
                           "which is why it carries no red/amber/green verdict.",
                         metric: reg,
                         std: stdFor_(series, conf), trendLabels: trendLabels });
    }, headlineLabel, series.map(function () { return coverage * 100; }), trendLabels);
}

// ══════════════════════════════════════════════════════════════════════════
// METRIC ACCESSORS — one definition of "the number", reused by every view
//
// The Trends chart, the Executive comparison bars and the opportunity table all
// have to compute the same rate over different slices. Routing them through one
// table is what keeps a region bar and the KPI card from quietly disagreeing:
// there is exactly one expression per metric, and it lives here.
// ══════════════════════════════════════════════════════════════════════════
var METRICS_ = {
  util: {
    id: "util", targetKey: "util",
    label: function () { return nsLive_() ? "Billable Utilization" : "Capacity Utilization (tracked)"; },
    axis: function () {
      return (nsLive_() ? "billable" : "tracked") +
        " hours ÷ scheduled capacity (headcount × standard hours)";
    },
    available: function () { return true; },
    value: function (isos) {
      var s = utilFor_(isos);
      // Gross scheduled capacity — the same denominator as the KPI headline.
      // One definition per metric; a chart that quietly used the net rate would
      // disagree with the card above it.
      return nsLive_() ? s.grossPct : s.grossTrackedPct;
    },
    // Coverage drives the confidence gate — same rule as the KPI card, so a
    // slice too thinly classified to publish on the card is not publishable in
    // a chart either.
    coverage: function (isos) {
      var s = utilFor_(isos);
      if (!nsLive_()) return s.avail > 0 ? 1 : null;
      var cov = s.tracked > 0 ? s.trackedCov / s.tracked : null;
      return cov;
    },
    n: function (isos) { return utilFor_(isos).avail; },
  },
  onTime: {
    id: "onTime", targetKey: "onTime",
    label: function () { return "On-Time Delivery"; },
    axis: function () { return "resolved delivery items on or before their due date"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.n > 0 ? b.onTime / b.n * 100 : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.onTimeBuckets, isos).n; },
  },
  quality: {
    id: "quality", targetKey: "quality",
    label: function () { return "Quality / Rework"; },
    axis: function () { return "delivered items needing rework (lower is better)"; },
    available: function () { return !!(MODEL.meta.jiraAvailable && MODEL.reworkBuckets); },
    value: function (isos) {
      var b = bucketsFor_(MODEL.reworkBuckets, isos);
      return b.nDelivered > 0 ? b.nRework / b.nDelivered * 100 : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.reworkBuckets, isos);
      // Link signal is always present on a v3.6.0 export; the reopen signal only
      // where the changelog was fetched. Half the definition unmeasured = 50%.
      return b.nDelivered > 0 ? (1 + b.nReopenCov / b.nDelivered) / 2 : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.reworkBuckets, isos).nDelivered; },
  },
  forecast: {
    id: "forecast", targetKey: "forecast",
    label: function () { return "Forecast Accuracy"; },
    axis: function () { return "closed epics inside the ±" +
      Math.round((MODEL.meta.forecastBand || 0.10) * 100) + "% estimate band"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      return forecastAccuracyPct_(bucketsFor_(MODEL.forecastBuckets, isos).absVars);
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.forecastBuckets, isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.forecastBuckets, isos).n; },
  },
};

/** Metric ids the current payload can actually chart — in the SAME order as
    the KPI cards (On-Time, Forecast, Utilization, Quality; user 2026-08-04):
    the chips and charts below the cards must never shuffle that sequence. */
var METRIC_ORDER_ = ["onTime", "forecast", "util", "quality"];
function liveMetrics_() {
  return METRIC_ORDER_.filter(function (k) {
    if (!METRICS_[k]) return false;
    if (MARGIN_METRICS_[k] && !canSeeMargin_()) return false;
    return METRICS_[k].available();
  });
}

/** The metric the Trends view is on, falling back if Jira went away. */
function activeMetric_() {
  var ids = liveMetrics_();
  if (ids.indexOf(STATE.metric) === -1) STATE.metric = ids[0] || "onTime";
  return METRICS_[STATE.metric];
}

/**
 * One metric's full series over the complete periods in the window, plus its
 * confidence and its operating rate. The single call every new view uses.
 *
 * The operating rate has a WEEKLY FALLBACK. The export window holds 52 weeks,
 * which is ~11 complete months but only 3 complete fiscal quarters — so on the
 * Quarter view a norm built from the displayed unit could never reach the
 * 5-period minimum, and the feature would simply be missing exactly where an
 * executive is most likely to look. Weeks are the grain the user framed this in
 * ("the historical trend found week over week") and the metric is a RATE, so a
 * weekly median is directly comparable to a quarterly value. When the fallback
 * is used it is labelled as such — an unlabelled change of basis would be worse
 * than no rate at all.
 */
function metricSeries_(m, periods) {
  var pts = periods.map(function (p) {
    var v = m.value(p.isos);
    return { label: p.label, value: v, isos: p.isos, note: null };
  });
  var vals = pts.map(function (p) { return p.value; });
  var last = periods.length ? periods[periods.length - 1] : { isos: [] };
  var stable = vals.filter(function (v) { return v !== null; }).length;
  // Same two-step as the KPI cards: metricConfidence_ says how good the
  // attribution is, applyGatePolicy_ says what to do about it. Routing the
  // charts through the SAME policy is what stops the Trends view from going dark
  // on a metric the Executive tab is publishing (CONFIG_DH.SUPPRESS_BELOW_GATE).
  var conf = applyGatePolicy_(
    metricConfidence_(reg_(m.id).coverageGate, m.coverage(last.isos), stable));
  var std = stdFor_(vals, conf);
  if (std && !std.ok && STATE.period !== "week") {
    var wStd = stdFor_(completeWeekSeries_(m), conf);
    if (wStd && wStd.ok) { wStd.basis = "week"; wStd.displayUnit = PERIOD_LABELS[STATE.period].toLowerCase(); std = wStd; }
  }
  var tgt = (MODEL.meta.targets || {})[m.targetKey] || null;
  // Carry the lower-is-better flag from the registry onto the target object the
  // charts colour by, so a bar chart of Rework Rate doesn't paint the best
  // teams red.
  if (tgt && reg_(m.id).invertTarget) tgt = { green: tgt.green, amber: tgt.amber, invert: true };
  return { points: pts, values: vals, conf: conf, std: std, target: tgt };
}

/** The metric per COMPLETE ISO week over the whole export window — the widest
    honest basis for an operating rate, and the one the user asked for. */
function completeWeekSeries_(m) {
  var plan = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) {
    if (wk && wk.iso && wk.status !== "done") plan[wk.iso] = 1;
  });
  return allIsoWeeks_().filter(function (iso) { return !plan[iso]; })
    .map(function (iso) { return m.value([iso]); });
}

// ══════════════════════════════════════════════════════════════════════════
// EXECUTIVE VIEW — the comparison chart
//
// The cards say how the whole slice is doing. The one question that always
// follows is "where?", and answering it used to mean changing the Region filter
// five times and remembering five numbers. One labelled chart, every category
// against the same 0–100 axis, and the target and operating band drawn in.
// The bars are a READ-ONLY comparison (user 2026-08-03): filtering stays in the
// header controls, so there is one way to change scope rather than two.
// ══════════════════════════════════════════════════════════════════════════
/** Metric selector chips. Shared by the Executive comparison and the Trends
    headroom table so one click changes the metric on both — two independent
    selectors driving one STATE.metric is a lens that appears not to work. */
function metricChips_() {
  return liveMetrics_().map(function (id) {
    return '<span class="chip' + (STATE.metric === id ? " on" : "") +
      '" onclick="setMetric_(\'' + id + '\')" title="' + esc_(reg_(id).definition || "") + '">' +
      esc_(METRICS_[id].label()) + "</span>";
  }).join("");
}

var COMPARE_LABELS = { region: "Region", team: "Team", pm: "PM", family: "Job family" };
// Prose forms, declared rather than derived. `.toLowerCase()` on the chip label
// produced "4 pms measurable" and a naive + "s" would produce "job familys" —
// small, but this text sits under an executive chart.
var COMPARE_NOUN = {
  region: { one: "region", many: "regions" },
  team:   { one: "team",   many: "teams" },
  pm:     { one: "PM",     many: "PMs" },
  family: { one: "job family", many: "job families" },
};
function cmpNoun_(dim, n) {
  var w = COMPARE_NOUN[dim] || { one: dim, many: dim + "s" };
  return n === 1 ? w.one : w.many;
}
// Most bars a horizontal comparison chart draws BY DEFAULT. Above this it stops
// being a comparison and becomes a scrolling list nobody reads to the end of —
// but the cap is a default, not a wall: "Show all" lifts it (STATE.compareAll),
// because a team that isn't on the chart reads as a team that isn't in the data.
var HBAR_MAX_ROWS_ = 12;

/** Toggles between the top-N comparison and the full list. */
function toggleCompareAll_() {
  STATE.compareAll = !STATE.compareAll;
  renderCompare_();
}

function setCompare_(dim) {
  STATE.compare = dim;
  renderCompare_();
}

/** Click-through from a bar to the matching filter (toggles off if re-clicked). */

function renderCompare_() {
  var panel = document.getElementById("comparePanel");
  if (!panel) return;
  var m = activeMetric_();
  var done = donePeriods_();
  var head = done.length ? done[headPeriodIdx_(done)] : { label: "—", isos: [] };
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var target = (MODEL.meta.targets || {})[m.targetKey] || null;

  // Compare-by chips, cascaded like every other control: a dimension with
  // nothing in it under the current filters is offered but marked.
  var chips = Object.keys(COMPARE_LABELS).map(function (d) {
    var o = optionsFor_(d);
    var dead = o.live.length === 0;
    return '<span class="chip' + (STATE.compare === d ? " on" : "") + (dead ? " off" : "") +
      '"' + (dead ? "" : ' onclick="setCompare_(\'' + d + '\')"') +
      ' title="' + (dead ? "no " + cmpNoun_(d, 2) + " in this slice"
                         : "break the metric down by " + cmpNoun_(d, 1) +
                           " — " + o.live.length + " in scope") + '">' +
      COMPARE_LABELS[d] + "</span>";
  }).join("");

  // Metric chips — the comparison charts whatever the Trends view is charting,
  // so switching metric in one place switches it everywhere (one lens, not two).
  var mchips = metricChips_();

  var o = optionsFor_(STATE.compare);
  var d = FILTER_DIMS[STATE.compare];
  // Each bar is that category measured on its own, so the active filter for THIS
  // dimension is switched off while the bars are built — otherwise picking AMER
  // would leave a chart with one bar in it.
  var rows = o.live.map(function (val) {
    var members = MODEL.people.filter(function (p) {
      return passesFilters_(p, STATE.compare) && dimMatch_(p, STATE.compare, val);
    });
    // attribOnly stubs STAY in the metric scope — bucketsFor_ joins a leaver's
    // or non-Services assignee's issues through their stub name, and dropping
    // them here would silently un-attribute that work from every issue-based
    // bar (v13 whole-roster attribution). They only leave the HEADCOUNT: the
    // number left of the bar counts people in the operational population —
    // and only people who EXISTED in the compared period (existsIn_), so an
    // older window shows that window's roster, not today's.
    var names = {};
    members.forEach(function (p) { names[p.name] = 1; });
    var v = scopedMetric_(m, head.isos, names);
    var realN = members.filter(function (p) {
      return !p.attribOnly && existsIn_(p, head.isos);
    }).length;
    return { key: val, label: val, value: v, n: realN };
  }).filter(function (r) { return r.n > 0; })
    .sort(function (a, b) {
      // Nulls last: "no measurable data" is not a low score and must not sit at
      // the bottom of a ranked list as though it were one.
      if (a.value === null && b.value === null) return b.n - a.n;
      if (a.value === null) return 1;
      if (b.value === null) return -1;
      return b.value - a.value;
    });

  var std = metricSeries_(m, done).std;
  var withVal = rows.filter(function (r) { return r.value !== null; });

  // ── Population accounting (user-reported 2026-08-03) ──
  // A breakdown must be able to prove it covers everybody. Distinct people, not
  // a sum of row counts: Team and PM membership OVERLAP, so someone on two teams
  // is in two bars and the counts add up past the headcount. Anyone missing here
  // is a person the chart is silently not describing — the failure this line
  // exists to make impossible.
  // attribOnly stubs are excluded from BOTH sides of "shown of inScope": this
  // sentence proves the chart covers the operational population, and stubs are
  // not in it (their issues still move the bar values via the scope names above).
  // Same period gate as the per-bar counts: "all N people represented" must
  // describe the compared period's roster, or the sentence contradicts the
  // scope chip whenever an older window is selected (2026-08-04).
  var seen = {};
  rows.forEach(function (r) {
    MODEL.people.forEach(function (p) {
      if (!p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare) &&
          dimMatch_(p, STATE.compare, r.key)) seen[p.name] = 1;
    });
  });
  var shown = Object.keys(seen).length;
  var inScope = MODEL.people.filter(function (p) {
    return !p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare);
  }).length;
  var untaggedRow = rows.filter(function (r) { return isUntagged_(r.key); })[0];
  var overlaps = rows.reduce(function (t, r) { return t + r.n; }, 0) > shown;
  var below = target ? withVal.filter(function (r) { return r.value < target.green; }).length : 0;
  // Chart-area verdict states COUNTS, never names (P6) — the People tab is
  // where an individual is named, deliberately.
  var verdict = !withVal.length
    ? "Nothing measurable to compare in this slice."
    : "<b>" + withVal.length + "</b> " + cmpNoun_(STATE.compare, withVal.length) +
      " measurable in " + esc_(head.label) +
