//
// It is a drill-down rather than a column because the grid is a management read
// and a 60-name table would bury it. Same two-level idiom as the signals roster.
//
// CLIENT-SIDE, from `p.weeks` — no payload change and no round-trip. The cell row
// above stays the authority for the totals: these rows are the same weeks read at
// person grain, and the subtotal is printed so the two can be compared rather than
// assumed equal.

/** Capacity / planned / available for one person over the period, from the same
    person-week grain the roster's Plan column uses (planFor1_ caps planned at
    capacity: a 60h plan on a 40h week is an over-plan, not extra hours to sell). */
function wfPersonHours_(p, isos) {
  var s = planFor1_(p, isos);
  return { cap: s.cap, planned: s.planned, avail: Math.max(0, s.cap - s.planned) };
}

/** Is this person's spare capacity sellable? Ramping new hires and people on long
    leave are shown WITH their hours — hiding them would make a team look smaller
    than it is — but they stay out of the sellable subtotal, the same carve the
    recoverable-hours pulse and the roster's Hours sort already apply. */
function wfSellable_(p) { return p.newHire !== true && p.onLeave !== true; }

function toggleWfCell_(key) {
  STATE.wfOpenCell[key] = !STATE.wfOpenCell[key];
  renderWfGrid_();
}

/** The people behind one pool × band cell, most-available first. */
function wfCellPeopleRow_(c, people, isos) {
  if (!STATE.wfOpenCell[c.cell]) return "";
  var mine = people.filter(function (p) { return (p.cell || "NONE|UNKNOWN") === c.cell; })
    .map(function (p) { return { p: p, h: wfPersonHours_(p, isos) }; })
    .sort(function (a, b) {
      // Sellable first, then most available. An on-leave person at the top of a
      // "who is free" list is exactly the wrong answer.
      var sa = wfSellable_(a.p) ? 1 : 0, sb = wfSellable_(b.p) ? 1 : 0;
      return (sb - sa) || (b.h.avail - a.h.avail) || a.p.name.localeCompare(b.p.name);
    });
  if (!mine.length) {
    return '<tr class="wfReadRow"><td></td><td colspan="9"><span class="cellSub">' +
      "No people in this cell under the active filters.</span></td></tr>";
  }
  var sums = mine.reduce(function (a, r) {
    if (wfSellable_(r.p)) { a.cap += r.h.cap; a.planned += r.h.planned; a.avail += r.h.avail; a.n++; }
    else a.held++;
    return a;
  }, { cap: 0, planned: 0, avail: 0, n: 0, held: 0 });
  var body = mine.map(function (r) {
    var sell = wfSellable_(r.p);
    // No capacity scheduled at all is "—", never 0h available: nobody is free for
    // work in a week they are not scheduled to work.
    var availCell = r.h.cap <= 0 ? '<span class="cellSub">—</span>'
      : sell ? "<b>" + wfHrs_(r.h.avail) + "</b>"
             : '<span class="cellSub">' + wfHrs_(r.h.avail) + "</span>";
    return "<tr>" +
      '<td class="tname" style="padding-left:28px">' + esc_(r.p.name) + personStateBadges_(r.p) +
        (r.p.jobTitle ? '<div class="cellSub" title="' + esc_(r.p.jobTitle) + '">' +
          esc_(trunc_(jobTitleDisp_(r.p.jobTitle), 30)) + "</div>" : "") + "</td>" +
      '<td class="tnum">' + (r.h.cap > 0 ? wfHrs_(r.h.cap) : '<span class="cellSub">—</span>') + "</td>" +
      '<td class="tnum">' + wfHrs_(r.h.planned) + "</td>" +
      '<td class="tnum">' + availCell + "</td>" +
      '<td colspan="6"></td></tr>';
  }).join("");
  return '<tr class="wfReadRow"><td colspan="10" style="padding:0">' +
    '<table class="hyg tmx" style="width:100%"><thead><tr>' +
      '<th class="tname" style="padding-left:28px">Person</th>' +
      '<th class="tnum">Capacity</th><th class="tnum">Planned</th>' +
      '<th class="tnum" title="Capacity minus planned hours for this period — the hours not yet promised to anything.">Available</th>' +
      '<th colspan="6"></th>' +
    "</tr></thead><tbody>" + body +
    '<tr><td class="tname" style="padding-left:28px"><b>Sellable subtotal</b> ' +
      '<span class="cellSub">(' + sums.n + (sums.n === 1 ? " person" : " people") +
      (sums.held ? ", " + sums.held + " held back" : "") + ")</span></td>" +
      '<td class="tnum"><b>' + wfHrs_(sums.cap) + "</b></td>" +
      '<td class="tnum"><b>' + wfHrs_(sums.planned) + "</b></td>" +
      '<td class="tnum"><b>' + wfHrs_(sums.avail) + "</b></td>" +
      '<td colspan="6"></td></tr>' +
    "</tbody></table>" +
    '<div class="cellSub" style="padding:6px 8px 8px 28px">' +
      "Same weeks as the row above, read per person. 🌱 ramping and 🏖 on-leave people are " +
      "listed with their hours but <b>left out of the sellable subtotal</b> — their spare " +
      "capacity is not room to sell — which is why this subtotal can be smaller than the " +
      "cell's headroom. Planned hours are capped at each person's own capacity, so an " +
      "over-plan never reads as extra hours." +
    "</div></td></tr>";
}

/** The one message shown when the payload predates this feature. */
function wfStale_(el, title) {
  document.getElementById(el).innerHTML = "<h3>" + title + "</h3>" +
    '<div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
}

/**
 * 1 · SCOPE BANNER.
 *
 * First on screen on purpose. Availability is published against one population,
 * Contribution against another, and the job catalogue holds a third — three
 * populations, one conversation. Every trend drawn without pinning the scope
 * measures membership change as if it were performance change, so the scope is
 * stated before any number is.
 *
 * Unclassified and stem-warning counts render EVEN AT ZERO. A field that only
 * appears when it is broken gets ignored when it breaks.
 */
function renderWfScope_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfScopePanel", "🧭 Scope"); return; }
  var s = w.scope || {};
  var cov = w.coverage || {};
  var filtered = w.people.length;
  var whole = s.population || 0;

  var bits = [];
  bits.push("<b>" + filtered + "</b> " + (filtered === 1 ? "person" : "people") + " in scope" +
    (filtered !== whole ? ' <span class="cellSub">(of ' + whole + " before filters)</span>" : ""));
  bits.push("<b>" + (s.consumers || 0) + "</b> consume project backlog");
  // Zero is a REPORTED value here, not an omission.
  bits.push('<span class="' + (s.unclassified ? "vr" : "") + '"><b>' + (s.unclassified || 0) +
    "</b> unclassified</span>");
  bits.push('<span class="' + (s.stemWarnings ? "va" : "") + '"><b>' + (s.stemWarnings || 0) +
    "</b> title mismatches</span>");

  var drift = s.drift && s.drift.alert
    ? '<div class="cellSub vr" style="margin-top:4px">⚠ Population moved ' +
      Math.round(s.drift.pct * 100) + "% since the last build (" + s.drift.prev + " → " +
      s.drift.now + "). A trend across a moving population measures membership, not performance.</div>"
    : "";

  var absent = (s.absentPools || []).length
    ? '<div class="cellSub" style="margin-top:4px">Not in this population by construction: ' +
      s.absentPools.map(esc_).join(" · ") +
      " — their job families carry no time-tracking mandate, so they are outside this dashboard entirely.</div>"
    : "";

  var unclassDetail = (s.unclassifiedReasons || []).length
    ? "<details style=\"margin-top:6px\"><summary class='cellSub'>What did not classify</summary>" +
      "<ul class='cellSub'>" + s.unclassifiedReasons.map(function (r) {
        return "<li><code>" + esc_(r.jobTitle || "(blank)") + "</code> — " + esc_(r.reason || "") + "</li>";
      }).join("") + "</ul><div class='cellSub'>A rising count means new job codes exist and " +
      "Workforce Planning has not been told. One row in the sub-track registry fixes each.</div></details>"
    : "";

  var stemDetail = (s.stemWarningDetail || []).length
    ? "<details style=\"margin-top:6px\"><summary class='cellSub'>Titles that disagree with their pool</summary>" +
      "<ul class='cellSub'>" + s.stemWarningDetail.map(function (r) {
        return "<li><code>" + esc_(r.jobTitle || "") + "</code> → " + esc_(r.pool) + " — " + esc_(r.warning || "") + "</li>";
      }).join("") + "</ul><div class='cellSub'>The job code decides the pool; the title text only " +
      "raises this flag. Usually a mistyped variant digit, occasionally a real hybrid role that " +
      "needs its own sub-track.</div></details>"
    : "";

  document.getElementById("wfScopePanel").innerHTML =
    '<div class="kicker">WORKFORCE HEALTH — capacity is not fungible</div>' +
    "<h3>🧭 Scope" + (w.periodLabel ? ' <span class="cellSub">· ' + esc_(w.periodLabel) + "</span>" : "") + "</h3>" +
    '<div style="margin:4px 0">' + bits.join(" · ") + "</div>" +
    drift + absent + unclassDetail + stemDetail +
    '<div class="cellSub" style="margin-top:6px">' +
      "Everyone below is grouped by <b>deployment pool</b> — the set of people who could genuinely " +
      "swap onto the same backlog item — and then by <b>level band</b>, because an I3 cannot absorb " +
      "an I5's epic. That grain is the point: a single company-wide availability number averages " +
      "together people who cannot do each other's work." +
    "</div>";
}

/**
 * 2 · POOL GRID — the main table.
 *
 * Grouped by pool with a header row per pool, consumers first. The Read column
 * is a full sentence and wraps: it is the only place a reader is told what the
 * numbers on that row actually mean together.
 */
function renderWfGrid_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfGridPanel", "🧭 Pool grid"); return; }
  if (!w.cells.length) {
    document.getElementById("wfGridPanel").innerHTML =
      "<h3>🧭 Pool grid</h3><div class='emptyState'>Nobody in scope under the active filters.</div>";
    return;
  }
  var byPool = {};
  w.cells.forEach(function (c) { (byPool[c.pool] = byPool[c.pool] || []).push(c); });
  var pools = WF_POOL_ORDER_.filter(function (p) { return byPool[p]; })
    .concat(Object.keys(byPool).filter(function (p) { return WF_POOL_ORDER_.indexOf(p) === -1; }).sort());

  var rows = pools.map(function (pool) {
    var cells = byPool[pool].slice().sort(function (a, b) {
      return WF_BAND_ORDER_.indexOf(a.band) - WF_BAND_ORDER_.indexOf(b.band);
    });
    var head = cells.reduce(function (a, c) { return a + c.head; }, 0);
    var cfg = wfCfg_(pool);
    var hdr = '<tr class="wfPoolHdr"><td colspan="10"><b>' + esc_(pool) + "</b> " +
      '<span class="cellSub">' + head + (head === 1 ? " person" : " people") + " · " +
      esc_(WF_POOL_DESC_[pool] || (cfg.consumes ? "draws on project backlog"
        : "demand-driven — no plannable backlog by design")) +
      "</span></td></tr>";
    return hdr + cells.map(function (c) {
      // The band label carries its LEVEL RANGE. "CORE" is this model's word,
      // not the company's ladder — without "I3–I4" beside it a reader has to
      // guess where their own level lands, and two people read it differently.
      var bd = WF_BAND_DESC_[c.band] || { range: "", why: "" };
      var cellArg = esc_(c.cell).replace(/'/g, "\\'");
      var open = !!STATE.wfOpenCell[c.cell];
      return '<tr class="rosterRow" onclick="toggleWfCell_(\'' + cellArg + '\')">' +
        // The caret states the row's own state, and the whole row is the control —
        // same contract as the signals roster, where aiming at the number you want
        // explained and having nothing happen read as broken.
        '<td class="tname" style="padding-left:16px" title="' + esc_(bd.why) +
          ' · Click to see WHO holds these hours.">' +
          (open ? "▾ " : "▸ ") +
          esc_(c.band) + (bd.range && bd.range !== "—"
            ? ' <span class="cellSub">' + esc_(bd.range) + "</span>" : "") + "</td>" +
        '<td class="tnum ' + (c.structuralRisk ? "va" : "") + '">' + c.head + "</td>" +
        '<td class="tnum">' + wfHrs_(c.grossHrs) + "</td>" +
        '<td class="tnum">' + wfHrs_(c.committedHrs) + "</td>" +
        '<td class="tnum ' + wfRag_(c.headroomPct, cfg.headroomFloor, cfg.headroomCeil) + '">' +
          wfPct_(c.headroomPct) + "</td>" +
        '<td class="tnum ' + wfRag_(c.commitmentFidelity, WF_CONFIG_.fidelityFloor, null) + '">' +
          wfPct_(c.commitmentFidelity) + "</td>" +
        '<td class="tnum ' + wfRag_(c.shadowRatio, null, WF_CONFIG_.shadowCeiling, true) + '">' +
          wfPct_(c.shadowRatio) + "</td>" +
        '<td class="tnum ' + (c.coverWeeks === null ? "" :
            wfRag_(c.coverWeeks, cfg.coverFloor, cfg.coverTarget)) + '">' +
          (c.coverWeeks === null ? "n/a" : wfNum_(c.coverWeeks)) + "</td>" +
        '<td class="tnum ' + wfRag_(c.constraintIndex, WF_CONFIG_.constraintFloor, null) + '">' +
          (c.constraintIndex === null ? "n/a" : wfNum_(c.constraintIndex, 2)) + "</td>" +
        "<td>" + (c.structuralRisk
          ? '<span class="wfChip wfsNeutral" title="At or below ' + WF_CONFIG_.keyPersonThreshold +
            ' people, so every figure on this row moves on one individual\'s week. Stated as context, not as a problem — and kept in its own column so it never crowds out the row\'s Read.">SMALL CELL</span>'
          : "") + "</td>" +
        "</tr>" +
        '<tr class="wfReadRow"><td></td><td colspan="9">' +
          '<span class="wfChip ' + (WF_STATE_CLASS_[c.actionState] || "wfsNeutral") + '">' +
          esc_(c.actionState) + "</span> " +
          '<span class="cellSub">' + esc_(c.read) + "</span></td></tr>" +
        wfCellPeopleRow_(c, w.people, w.isos);
    }).join("");
  }).join("");

  document.getElementById("wfGridPanel").innerHTML =
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<h3 style="flex:1;margin:0">🧭 Pool grid' + scopeTag_("period") + "</h3>" +
    "</div>" +
    '<div class="tableWrap"><table class="hyg tmx wfGrid"><thead><tr>' +
      '<th class="tname">Pool / Band</th>' +
      '<th class="tnum" title="People in this cell after the active filters. Red at or below ' +
        WF_CONFIG_.keyPersonThreshold + '.">Head</th>' +
      '<th class="tnum" title="Gross scheduled capacity from Tempo — each country\'s own working calendar, never a flat 40h. Nothing is netted out for absence: there is no absence feed, so capacity is always gross.">Capacity</th>' +
      '<th class="tnum" title="Planned hours — what this cell is already promised to.">Committed</th>' +
      '<th class="tnum" title="Capacity minus commitment: the hours not yet promised to anything in this pool. Amber at either edge — little room, or a lot of unplanned room. Neither is automatically a problem.">Headroom</th>' +
      '<th class="tnum" title="Logged hours on planned epics ÷ planned hours THAT NAME AN ISSUE. Project-level plans name no issue and so can never be matched — they are excluded from the denominator rather than counted as a miss. Plans and worklogs are different grains and rarely tie exactly, so treat a gap as something to reconcile rather than as work that did not happen. n/a means nothing in this cell could be matched or classified at all.">Plan vs logged</th>' +
      '<th class="tnum" title="Share of classifiable hours on work outside the planned, sales-order-bound epics. Delivered work that is not yet traceable to a plan. Hours nobody could classify are excluded from the denominator, never counted here.">Outside plan</th>' +
      '<th class="tnum" title="Weeks of remaining backlog at this pool\'s own weekly capacity. n/a for demand-driven pools — their work arrives as tickets, so a 0 would falsely read as \'no work left\'.">Cover</th>' +
      '<th class="tnum" title="This pool\'s cover against the portfolio median. Relative only — it says which pool is tightest, never whether the portfolio is healthy.">Relative cover</th>' +
      "<th>Cell size</th>" +
    "</tr></thead><tbody>" + rows + "</tbody></table></div>" +
    '<div class="cellSub" style="margin-top:8px">' +
      "<b>Click any band row to see who holds the hours</b> — person, capacity, planned and " +
      "available for this period, most-available first. A cell's headroom says how much room " +
      "there is; only the names say whether it is one person with a free fortnight or eight " +
      "people with an afternoon each. " +
      "<b>How to read a row.</b> The chip says where the cell sits; the sentence beside it is the " +
      "most notable measurement on that row, with the denominator it was taken against. " +
      "<b>These are signals, not verdicts</b> — the numbers are shown so a reader can decide what " +
      "they mean, which is why nothing here is painted red and no row tells anyone what to do. " +
      keySwatch_("var(--pos)", "inside its own range") + " · " +
      keySwatch_("var(--amber)", "worth a look") + " · " +
      "<b>n/a</b> = not measurable, which is never the same as zero." +
    "</div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "<b>What changed, and why the numbers dropped.</b> This grid replaces a single blended " +
      "availability figure that averaged support and consulting capacity together. Support capacity is " +
      "contracted and recurring — it is never drawn from the project backlog — so blending it made the " +
      "org read as substantially more available than it is, and guaranteed the pool actually out of room " +
      "could not be seen. Delivery managers also left the pool denominators in the same release: they " +
      "govern backlog rather than consume it. Both are definition changes, dated in the metrics " +
      "changelog, and every affected trend line carries the ✎ marker at 2026-08-10." +
    "</div>";
}

/**
 * 3 · CONSUMERS-ONLY SUMMARY.
 *
 * If leadership asks for one number, this is the honest one — and it never
 * ships without its denominator. "32% available" is a rumour; "32% available
 * (of 63 backlog consumers)" is a fact.
 */
function renderWfConsumers_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfConsumersPanel", "🎯 The one honest number"); return; }
  var cons = w.cells.filter(function (c) { return c.cfg.consumes; });
  var head = cons.reduce(function (a, c) { return a + c.head; }, 0);
  var gross = cons.reduce(function (a, c) { return a + c.grossHrs; }, 0);
  var committed = cons.reduce(function (a, c) { return a + c.committedHrs; }, 0);
  var pct = wfDiv_(gross - committed, gross);
  var nonCons = w.cells.filter(function (c) { return !c.cfg.consumes; });
  var nonHead = nonCons.reduce(function (a, c) { return a + c.head; }, 0);

  document.getElementById("wfConsumersPanel").innerHTML =
    "<h3>🎯 The one honest number" + scopeTag_("period") + "</h3>" +
    (head === 0
      ? "<div class='emptyState'>No backlog-consuming pools in this slice.</div>"
      : '<div class="big" style="font-size:2rem">' + wfPct_(pct) + "</div>" +
        '<div class="cellSub">sellable headroom <b>of ' + head + " backlog consumer" +
          (head === 1 ? "" : "s") + "</b> — " + wfHrs_(gross - committed) + " free of " +
          wfHrs_(gross) + " scheduled</div>" +
        '<div class="cellSub" style="margin-top:6px">' +
          "This is the figure to quote when somebody asks how available the team is. It excludes " +
          nonHead + " " + (nonHead === 1 ? "person" : "people") + " in demand-driven and governing " +
          "pools, whose capacity is real but is not drawn from the project backlog. " +
          "<b>There is deliberately no company-wide equivalent</b> — averaging pools that cannot " +
          "substitute for each other produces a number that is always wrong in the same reassuring " +
          "direction." +
        "</div>");
}

/**
 * 4 · SHADOW BREAKDOWN — by reason, with owners.
 *
 * Never one number. The three reasons have three different owners and three
 * different fixes; reported as a single "shadow work" figure it gets routed to
 * one desk, where two thirds of it cannot be acted on.
 */
function renderWfShadow_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfShadowPanel", "👻 Shadow work"); return; }
  var tot = { "no-epic": 0, "no-srso": 0, "not-committed": 0 };
  var shadow = 0, tracked = 0, unmeasured = 0;
  w.cells.forEach(function (c) {
    Object.keys(tot).forEach(function (k) { tot[k] += c.shadowReasons[k] || 0; });
    shadow += c.trackedShadowHrs; tracked += c.trackedTotalHrs; unmeasured += c.unmeasuredHrs;
  });
  var den = tracked - unmeasured;
  var ratio = wfDiv_(shadow, den);
  var cov = w.coverage || {};

  var rows = ["no-epic", "no-srso", "not-committed"].map(function (k) {
    var share = wfDiv_(tot[k], den);
    var why = k === "no-epic" ? "Logged against an issue with no epic parent, so it cannot roll up to a programme."
            : k === "no-srso" ? "The epic exists but carries no SRSO component, so the hours cannot be recognised against a sales order."
            : "A planned, bound epic — but this pool was not the one staffed onto it.";
    return "<tr><td class='tname'><code>" + k + "</code></td>" +
      "<td class='tnum'>" + wfHrs_(tot[k]) + "</td>" +
      "<td class='tnum'>" + wfPct_(share) + "</td>" +
      "<td>" + esc_(WF_SHADOW_OWNER_[k]) + "</td>" +
      "<td class='cellSub'>" + esc_(why) + "</td></tr>";
  }).join("");

  document.getElementById("wfShadowPanel").innerHTML =
    "<h3>🔎 Work outside the plan" + scopeTag_("period") + "</h3>" +
    '<p class="cellSub">' + wfHrs_(shadow) + " of " + wfHrs_(den) + " classifiable tracked hours (<b>" +
      wfPct_(ratio) + "</b>) do not trace to a planned, sales-order-bound epic. " +
      "<b>This is delivered work</b> — the gap is in the paper trail, not the delivery. " +
      "Each reason below has a different owner because each has a different fix." +
      (unmeasured > 0 ? " A further " + wfHrs_(unmeasured) + " could not be classified at all and " +
        "<b>is excluded from both sides</b> — an export missing its Epic Key or Components column " +
        "would otherwise read as near-total shadow and send everyone chasing a reporting artefact." : "") +
      "</p>" +
    '<div class="tableWrap"><table class="hyg tmx"><thead><tr>' +
      "<th class='tname'>Reason</th><th class='tnum'>Hours</th><th class='tnum'>Share</th>" +
      "<th>Owner</th><th>What it means</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "Rows are <b>not</b> a pie of one problem — each is its own queue with its own desk, which is " +
      "why they are never summed into a single figure on any other surface. None of them is a " +
      "statement about whether the work was delivered well or on time; that lives on the Executive " +
      "cards, measured against ratified targets." +
      (cov.planIssueCoverage !== null && cov.planIssueCoverage !== undefined
        ? " <b>Caveat on <code>not-committed</code>:</b> only " + wfPct_(cov.planIssueCoverage) +
          " of planned hours name a specific issue (the rest are project-level plans, which name no " +
          "epic by nature), so this row is an <b>upper bound</b> — some of it was planned in a way " +
          "this pipeline cannot see."
        : "") +
    "</div>";
}

/**
 * 5 · UNROUTED BACKLOG.
 *
 * Work no pool can absorb. Shown as its own bar and never distributed across
 * the pools: spreading it would make every pool's cover look worse by an amount
 * nobody chose, and would hide the routing gap completely.
 */
function renderWfUnrouted_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfUnroutedPanel", "🧩 Unrouted backlog"); return; }
  var bl = w.backlogByPool || {};
  var cov = w.coverage || {};
  var pools = Object.keys(bl).sort(function (a, b) {
    return (bl[b].backlogAdjHrs || 0) - (bl[a].backlogAdjHrs || 0);
  });
  var totalAdj = pools.reduce(function (a, p) { return a + (bl[p].backlogAdjHrs || 0); }, 0);

  var rows = pools.map(function (p) {
    var b = bl[p];
    var isUnrouted = p === "UNROUTED";
    var share = wfDiv_(b.backlogAdjHrs, totalAdj);
    return "<tr" + (isUnrouted ? ' class="wfUnrouted"' : "") + ">" +
      "<td class='tname'>" + (isUnrouted ? "⚠ " : "") + esc_(p) + "</td>" +
      "<td class='tnum'>" + b.epicCount + "</td>" +
      "<td class='tnum'>" + wfHrs_(b.backlogHrs) + "</td>" +
      "<td class='tnum " + wfRag_(b.estimateCoverage, WF_CONFIG_.estimateCoverageFloor, null) + "'>" +
        wfPct_(b.estimateCoverage) + "</td>" +
      "<td class='tnum'><b>" + wfHrs_(b.backlogAdjHrs) + "</b></td>" +
      "<td class='tnum'>" + wfPct_(share) + "</td></tr>";
  }).join("");

  document.getElementById("wfUnroutedPanel").innerHTML =
    "<h3>🧩 Backlog by required pool" + scopeTag_("snap") + "</h3>" +
    '<p class="cellSub">Which pool can actually absorb each epic. Routing is <b>historical, not ' +
      "declared</b>: there is no <code>requiredPool</code> field in Jira, so an epic routes to " +
      "whichever pool has logged the most hours to it. An epic nobody has touched cannot be routed " +
      "at all and lands in <b>UNROUTED</b>." +
      (cov.unroutedEpics
        ? " <b class='va'>" + cov.unroutedEpics + " epic" + (cov.unroutedEpics === 1 ? "" : "s") +
          " (" + wfHrs_(cov.unroutedHrs) + ")</b> sit there — nobody has logged to them yet, " +
          "which for newly sold work is the normal state rather than a problem."
        : " Nothing is currently unrouted.") +
      "</p>" +
    '<div class="tableWrap"><table class="hyg tmx"><thead><tr>' +
      "<th class='tname'>Required pool</th><th class='tnum'>Open epics</th>" +
      "<th class='tnum' title='Original estimate minus time spent. An epic that overran reads 0, so this is a lower bound twice over.'>Remaining (raw)</th>" +
      "<th class='tnum' title='Share of this pool&apos;s open epics carrying an original estimate.'>Est. coverage</th>" +
      "<th class='tnum' title='Raw remaining grossed up by estimate coverage — what the obligation is once the unestimated work is accounted for.'>Adjusted</th>" +
      "<th class='tnum'>Share</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "<b>Raw is a lower bound; adjusted is the number to plan against.</b> Below full estimate " +
      "coverage the raw figure understates the real obligation by roughly the coverage shortfall — " +
      "both ship so the gap between them stays visible. UNROUTED is never distributed across the " +
      "other pools: doing so would worsen every pool's cover by an amount nobody chose and hide the " +
      "routing gap entirely." +
    "</div>";
}

/**
 * 6 · DISCIPLINE SECTION.
 *
 * The engine groups by pool; people navigate by discipline. This is a
 * presentation layer over the SAME classified population — it re-buckets, it
 * never recomputes, so it cannot disagree with the grid above.
 */
function renderWfDisciplines_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfDisciplinePanel", "🗂 By discipline"); return; }
  // Rebuilt from the FILTERED people so it agrees with the grid, rather than
  // replaying the payload's unfiltered version beside a filtered table.
  var rows = {};
  w.people.forEach(function (p) {
    var key = (p.pool || "NONE") + "|" + (p.disciplineLabel || "—");
    if (!rows[key]) rows[key] = { pool: p.pool || "NONE", discipline: p.disciplineLabel || "—",
                                  role: p.backlogRole || "UNCLASSIFIED", subTrack: p.subTrack,
                                  head: 0, bands: {} };
    rows[key].head++;
    rows[key].bands[p.band] = (rows[key].bands[p.band] || 0) + 1;
  });
  var ORDER = { CONSUMER: 0, CREATOR: 1, GOVERNOR: 2, SUSTAINER: 3, ENABLER: 4, UNCLASSIFIED: 5 };
  var list = Object.keys(rows).map(function (k) { return rows[k]; }).sort(function (a, b) {
    var ao = ORDER[a.role] === undefined ? 9 : ORDER[a.role];
    var bo = ORDER[b.role] === undefined ? 9 : ORDER[b.role];
    return ao !== bo ? ao - bo : b.head - a.head;
  });
  if (!list.length) {
    document.getElementById("wfDisciplinePanel").innerHTML =
      "<h3>🗂 By discipline</h3><div class='emptyState'>Nobody in scope.</div>";
    return;
  }
  var body = list.map(function (r) {
    var bands = WF_BAND_ORDER_.filter(function (b) { return r.bands[b]; })
      .map(function (b) { return b + " " + r.bands[b]; }).join(" · ");
    return "<tr><td class='tname'>" + esc_(r.discipline) + "</td>" +
      "<td>" + (r.subTrack ? "<code>" + esc_(r.subTrack) + "</code>" : "—") + "</td>" +
      "<td>" + esc_(r.role) + "</td>" +
      "<td>" + esc_(r.pool) + "</td>" +
      "<td class='tnum'>" + r.head + "</td>" +
      "<td class='cellSub'>" + esc_(bands) + "</td></tr>";
  }).join("");

  document.getElementById("wfDisciplinePanel").innerHTML =
    "<h3>🗂 By discipline</h3>" +
    '<p class="cellSub">How people describe themselves, mapped onto the pools the maths uses. ' +
      "The <b>sub-track</b> (job family + variant digit) is what actually decides the pool — the " +
      "discipline label is free text and is display only. That distinction is load-bearing: one " +
      "discipline string can span two pools that are not interchangeable on a backlog item, and a " +
      "rename in the HRIS must not move anybody's capacity.</p>" +
    '<div class="tableWrap"><table class="hyg tmx"><thead><tr>' +
      "<th class='tname'>Discipline</th><th>Sub-track</th><th>Backlog role</th>" +
      "<th>Pool</th><th class='tnum'>Head</th><th>Bands</th>" +
      "</tr></thead><tbody>" + body + "</tbody></table></div>";
}

/** Pool grid → CSV. One row per pool × band, every measure plus its verdict. */
function saveWorkforceCsv_() {
  var w = workforceHealthFor_();
  if (!w) return;
  var head = ["Pool", "Band", "Head", "CapacityHrs", "CommittedHrs", "HeadroomHrs", "HeadroomPct",
              "TrackedHrs", "TrackedCommittedHrs", "ExecutionGapHrs", "Fidelity",
              "ShadowHrs", "ShadowPct", "ShadowNoEpic", "ShadowNoSrso", "ShadowNotCommitted",
              "UnmeasuredHrs", "BacklogRawHrs", "BacklogAdjHrs", "EstimateCoverage",
              "CoverWeeks", "ConstraintIndex", "StructuralRisk", "ActionState", "Read"];
  // null → empty cell, never 0: a spreadsheet full of zeros for "not measured"
  // is the same lie as a dashboard full of them.
  var n = function (v, dp) { return v === null || v === undefined ? "" : Number(v).toFixed(dp === undefined ? 2 : dp); };
  var rows = w.cells.map(function (c) {
    return [c.pool, c.band, c.head, n(c.grossHrs, 1), n(c.committedHrs, 1), n(c.headroomHrs, 1),
            n(c.headroomPct, 4), n(c.trackedTotalHrs, 1), n(c.trackedCommittedHrs, 1),
            n(c.executionGapHrs, 1), n(c.commitmentFidelity, 4),
            n(c.trackedShadowHrs, 1), n(c.shadowRatio, 4),
            n(c.shadowReasons["no-epic"], 1), n(c.shadowReasons["no-srso"], 1),
            n(c.shadowReasons["not-committed"], 1), n(c.unmeasuredHrs, 1),
            n(c.backlogHrs, 1), n(c.backlogAdjHrs, 1), n(c.estimateCoverage, 4),
            n(c.coverWeeks, 2), n(c.constraintIndex, 3),
            csvCell_(c.structuralRisk), csvCell_(c.actionState), csvCell_(c.read)];
  });
  // CRLF + the .csv extension are this function's job — downloadCsv_ writes the
  // filename and content verbatim.
  var lines = [head.join(",")].concat(rows.map(function (r) { return r.join(","); }));
  downloadCsv_(lines.join("\r\n"), "delivery-workforce-health.csv");
}

/**
 * 🌊 Backlog health — two facing lists, healthy on the left, queues on the right.
 *
 * WHY TWO COLUMNS rather than one sorted table: they answer different questions
 * and are read by the same person in one glance. "Is what we carry workable?" is
 * the left column; "what do I go fix?" is the right. Interleaving them by size
 * would put a 70%-unestimated row above the readiness headline and bury the one
 * number that frames everything else.
 */
function renderBacklogHealth_() {
  var el = document.getElementById("backlogPanel");
  if (!el) return;
  var t = backlogHealthFor_();
  if (t === null) {
    el.innerHTML = '<h3>🌊 Backlog health</h3><div class="emptyState">' +
      'Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
    return;
  }
  if (!t.n) {
    el.innerHTML = '<h3>🌊 Backlog health' + scopeTag_("snap") + '</h3>' +
      '<div class="emptyState">No open work under the active filters.</div>';
    return;
  }
  var readyPct = Math.round((t.ready || 0) / t.n * 100);
  function col(kind) {
    return BACKLOG_ORDER_[kind].map(function (k) { return backlogRowHtml_(k, t); }).join("");
  }
  var headRow = '<tr><th class="tname">Signal</th><th class="tnum">Items</th>' +
                '<th class="tnum">Share</th><th class="tnum">Queue</th></tr>';
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<h3 style="flex:1;margin:0">🌊 Backlog health' + scopeTag_("snap") + '</h3>' +
      '<button class="iconbtn" onclick="saveBacklogCsv_()" title="Download every backlog-health signal with its item counts as CSV">CSV</button>' +
    "</div>" +
    '<p class="cellSub">' + t.n + " open item" + (t.n === 1 ? "" : "s") +
      " across " + t.people + " people · <b>readiness " + readyPct + "%</b>. " +
      "A snapshot of what the team is carrying right now — it ignores the period picker " +
      "and follows every other filter. Ageing is measured against the model build time" +
      (t.asOf ? " (" + esc_(String(t.asOf).slice(0, 10)) + ")" : "") + ", not this moment." +
      // Two DIFFERENT populations, named separately — never summed into one
      // "excluded" count. `unassigned` has no assignee to join at all;
      // `unattributed` has an assignee the roster join could not resolve.
      // Collapsing them would report an absent assignee as a failed roster
      // join, contradicting the 🧬 matrix's attrN-denominated `attr` column.
      (t.unassigned ? " " + t.unassigned + " open item" + (t.unassigned === 1 ? "" : "s") +
        " " + (t.unassigned === 1 ? "has" : "have") + " no assignee and " +
        (t.unassigned === 1 ? "is" : "are") + " excluded." : "") +
      (t.unattributed ? " " + t.unattributed + " open item" + (t.unattributed === 1 ? "" : "s") +
        " " + (t.unattributed === 1 ? "has" : "have") + " an assignee the roster join could not match and " +
        (t.unattributed === 1 ? "is" : "are") + " excluded — the 🧬 matrix below carries that gap." : "") +
      // A THIRD excluded population, named like the two above and for the same
      // reason: a count that silently leaves a queue is how a shrinking number
      // gets read as progress. These are in the population (they are real load),
      // they are simply not a due-date gap anybody owns.
      (t.undatedIgnored ? " " + t.undatedIgnored + " " +
        (t.undatedIgnored === 1 ? "item is" : "items are") +
        " unstarted with no due date and " + (t.undatedIgnored === 1 ? "is" : "are") +
        " <b>not counted as a missing due date</b> — not a commitment yet (rule, 2026-08-10)." : "") +
      "</p>" +
    '<div class="bhCols">' +
      '<div><h4 style="margin:0 0 6px">✅ Ready to be worked</h4>' +
        '<table class="hyg tmx"><thead>' + headRow + "</thead><tbody>" + col("good") + "</tbody></table></div>" +
      '<div><h4 style="margin:0 0 6px">⚠️ Needs action <span class="cellSub">— fix these and next period moves</span></h4>' +
        '<table class="hyg tmx"><thead>' + headRow + "</thead><tbody>" + col("bad") + "</tbody></table></div>" +
    "</div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "Shares are of the whole open population, so the ⚠️ rows deliberately OVERLAP — " +
      "one ticket can be unestimated, undated and stale at once. Read each row as its own " +
      "queue, never as a slice of a pie. " +
      keySwatch_("var(--pos)", "ready / healthy") + " · " +
      keySwatch_("var(--warn)", "needs an action") +
      "</div>";
}

// ── 🚩 EPICS WITHOUT A DUE DATE (team agreement 2026-08-10) ───────────────────
//
// The only 100%-target field rule on this dashboard, so the only one rendered as a
// FLAG rather than a graded share. Three deliberate choices:
//
//   · ORG scope. No person filter, no roster join, unassigned epics included —
//     `epicDueAudit` is built server-side over the whole feed and this renderer
//     does not narrow it. An epic is a container; "nobody is assigned" is not a
//     reason to stop asking for its end date. The tag says ORG so nobody reads a
//     filtered number here.
//   · RED at all, which this file otherwise reserves for ratified targets. This
//     one is ratified: the team agreed every epic carries a date, even if it is
//     only the project end date.
//   · Keys, never names. Same rule as the gaps queue — a standing list of people
//     against failures reads as a blame board; an epic key is a thing to open.
function renderEpicDue_() {
  var el = document.getElementById("epicDuePanel");
  if (!el) return;
  var a = MODEL.epicDueAudit;
  // Absent ≠ clean. A payload built before this audit existed must say it did not
  // look, or "0 epics missing a date" reads as a pass on an audit nobody ran.
  if (!a) {
    el.innerHTML = '<h3>🚩 Epics without a due date</h3><div class="emptyState">' +
      "Not in this payload — ↻ Refresh to rebuild on the current schema.</div>";
    return;
  }
  var head = '<h3 style="margin:0">🚩 Epics without a due date' + scopeTag_("org") + "</h3>";
  if (!a.n) {
    el.innerHTML = head + '<div class="emptyState">No open epics in the current export.</div>';
    return;
  }
  var pct = Math.round((a.n - a.missing) / a.n * 100);
  // Zero renders as a PASS, not as an empty panel — a check that vanishes when it
  // succeeds is a check nobody trusts the next time it fires.
  if (!a.missing) {
    el.innerHTML = head +
      '<p class="cellSub"><b class="sigGood">All ' + a.n + " open epic" + (a.n === 1 ? "" : "s") +
      " carry a due date.</b> The team's rule is 100% and this is 100% — audited on every " +
      "rebuild, so it will reappear the moment one slips.</p>";
    return;
  }
  var rows = (a.rows || []).filter(function (r) { return r.missing > 0; }).map(function (r) {
    var share = r.n > 0 ? Math.round(r.missing / r.n * 100) : 0;
    return "<tr><td class='tname'>" + esc_(r.type) + "</td>" +
      '<td class="tnum">' + r.missing + " of " + r.n + "</td>" +
      '<td class="tnum"><span class="sigBad">' + share + "%</span></td>" +
      "<td>" + keyListHtml_(r.keys, r.capped, a.keyCap) + "</td></tr>";
  }).join("");
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px">' + head +
      '<button class="iconbtn" style="margin-left:auto" onclick="saveEpicDueCsv_()" ' +
      'title="Download every open epic missing a due date, grouped by epic type, as CSV">CSV</button>' +
    "</div>" +
    '<p class="cellSub"><b class="sigBad">' + a.missing + " of " + a.n +
      " open epic" + (a.n === 1 ? "" : "s") + " (" + Math.round(a.missing / a.n * 100) +
      "%) carry no due date</b> — " + pct + "% do. The team agreed every epic carries one, " +
      "<b>even if it is only the project end date</b>, so the bar here is 100% rather than a " +
      "coverage gate: an epic with no date is an engagement with no committed end, and " +
      "On-Time Delivery cannot describe it at all." +
      "</p>" +
    '<div class="gwrap"><table class="hyg tmx"><thead>' +
      '<tr><th class="tname">Epic type</th><th class="tnum">Missing</th>' +
      '<th class="tnum">Share</th><th>Keys to fix</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "<b>Open epics only</b>, whatever their status: a To Do epic with no date is exactly what " +
      "this audits, so it is <i>not</i> subject to the To&nbsp;Do carve that the 👥 roster and " +
      "🧬 matrix columns apply. Resolved epics are out — a date added now moves no future number. " +
      "<b>Unassigned epics are included</b> and no person filter applies, which is why this panel " +
      "is tagged ORG: an epic nobody owns still needs an end date." +
      "</div>";
}

/** Key list as a compact, wrapping run of keys — the queue itself. Reports the cap
    rather than silently clipping, the same contract as every other key list here. */
function keyListHtml_(keys, capped, cap) {
  keys = keys || [];
  if (!keys.length) return '<span class="cellSub">—</span>';
  var base = jiraBase_();
  // Every key is a link when a site is configured, plus one link that opens the
  // whole row at once — this list is worked by a PM going ticket by ticket, and
  // copy-pasting keys into a search was the actual cost of using it.
  var body = base
    ? keys.map(function (k) { return jiraLink_(jiraIssueUrl_(k), k, "Open " + k + " in Jira"); })
          .join(" · ")
    : esc_(keys.join(" · "));
  return '<span class="cellSub" style="word-break:break-word">' + body +
    (capped ? " <b>… first " + cap + " shown; the count above is complete</b>" : "") +
    jiraOpenAll_(keys, "Open all in Jira") + "</span>";
}

/** CSV of the audit — one row per offending epic, because this list gets worked
    outside the dashboard (Gon + the PMs) rather than read on screen. */
function saveEpicDueCsv_() {
  var a = MODEL.epicDueAudit;
  if (!a || !a.missing) return;
  var lines = ["Epic type,Issue key,Open epics of this type,Missing of this type"];
  (a.rows || []).forEach(function (r) {
    (r.keys || []).forEach(function (k) {
      lines.push([csvCell_(r.type), csvCell_(k), r.n, r.missing].join(","));
    });
    if (r.capped) {
      lines.push([csvCell_(r.type), csvCell_("… " + (r.missing - r.keys.length) +
        " more not carried in this payload"), r.n, r.missing].join(","));
    }

}

/** CSV of every backlog-health signal — one row per signal, so the queue can be
    worked outside the dashboard. Separate from the roster CSV because it is a
    different grain (signal, not person). */
function saveBacklogCsv_() {
  var t = backlogHealthFor_();
  if (t === null || !t.n) return;
  var lines = ["Signal,Kind,Items,Share %,Open population,Keys"];
  ["good", "bad"].forEach(function (kind) {
    BACKLOG_ORDER_[kind].forEach(function (k) {
      var meta = BACKLOG_META_[k];
      var keys = t.keys[k] || [];
      lines.push([csvCell_(meta.label), kind === "good" ? "healthy" : "needs action",
        t[k] || 0, t.n > 0 ? Math.round((t[k] || 0) / t.n * 100) : "", t.n,
        csvCell_(keys.join(" "))].join(","));
    });
  });

}

/** SIGNAL_FIELDS_ lookup by key. */
function sigFieldByKey_(k) {
  for (var i = 0; i < SIGNAL_FIELDS_.length; i++) if (SIGNAL_FIELDS_[i].k === k) return SIGNAL_FIELDS_[i];
  return { tip: "" };
}

/**
 * Billable / non-billable / idle mini-bar for the analysis period — the same
 * per-person numbers the retired People-grid workload bars drew (aggWeeks_).
 * ALWAYS period-scoped (worklogs are period-shaped; a backlog snapshot has no
 * hours) — the header carries a PERIOD tag for exactly this reason.
 * ELIGIBILITY reuses the recoverable-hours exclusions (oppRows_, review
 * 2026-08-05 #2): ramping new hires and on-leave people get no idle segment —
 * their "idle" is the explanation, not a recoverable signal — and sort last.
 */
function hoursCellHtml_(p, isos) {
  var w = aggWeeks_(p, isos);
  // No weeks at all + a hire date = the period predates them. "—" reads as
  // "delivered nothing"; 🌱 says why there is nothing to read (the retired
  // People grid's pre-hire rule, reattached to the roster 2026-08-06).
  if (!w && p.hired) {
    return '<span class="cellSub" title="Joined ' + esc_(p.hired) +
      " — this period is before their start date, so there is nothing to measure yet.\">🌱 joined " +
      esc_(p.hired) + "</span>";
  }
  if (!w || !(w.avail > 0)) return "—";
  // Idle capacity is a coaching signal for a settled IC and an EXPLANATION for
  // anyone still arriving, away, or training — the same three exclusions the
  // recoverable-hours figure uses (oppRows_), so the bar and the headline can
  // never disagree about who is accountable for empty capacity.
  var ineligible = p.newHire === true || p.onLeave === true || p.isIntern === true;
  var idle = Math.max(0, w.avail - w.tracked);
  // TIME OFF IS A SUBSET OF NON-BILLABLE, not a fourth bucket beside it: the
  // server folds tracked NETSUITE/time-off hours into nonBillable by rule
  // (Code.js — "time off cannot be charged to a customer"). Splitting it here is
  // presentation only, so the invariant billable+nonBillable+unclassified ===
  // tracked still holds and no rate moves. min() guards a stale pre-v15 payload
  // where trackedOff could arrive without having been folded in.
  var off = Math.min(Math.max(0, w.trackedOff || 0), w.nonBillable);
  var nbWork = Math.max(0, w.nonBillable - off);
  var total = Math.max(w.avail, w.tracked, 1);
  function seg(h, cls, label) {
    if (!(h > 0)) return "";
    return '<i class="' + cls + '" style="width:' + Math.round(h / total * 100) + '%" title="' +
      label + " " + r1_(h) + 'h"></i>';
  }
  return '<div class="hbarMini" title="billable ' + r1_(w.billable) + "h · non-billable work " +
    r1_(nbWork) + "h" + (off > 0 ? " · time off " + r1_(off) + "h" : "") +
    " · idle " + r1_(idle) + 'h of ' + r1_(w.avail) + 'h scheduled">' +
    seg(w.billable, "segBill", "billable") +
    seg(nbWork, "segNonbill", "non-billable work") +
    seg(off, "segOff", "time off (tracked)") +
    (ineligible ? "" : seg(idle, "segIdle", "idle")) +
    "</div>" +
    (ineligible ? '<span class="cellSub" title="Ramping new hire / intern / on leave — idle capacity is the explanation here, not a coaching signal (same exclusion as the recoverable-hours figure).">' +
      (p.onLeave ? "on leave" : p.isIntern ? "in training" : "ramping") + "</span>" : "");
}

/**
 * 🎓 / 🌱 / 🏖 — the three reasons a row's numbers should be read differently.
 *
 * All three used to live on the People grid and went out with it (2026-08-05),
 * which left the Utilization card promising "their profiles and hours stay on
 * the People roster, marked 🎓" against a roster that showed no such thing.
 * A marker is how a person stays VISIBLE without being held to a bar that was
 * never meant for them — the alternative is hiding them, which is what the
 * roster was doing to interns and is the worse of the two failures.
 */
function personStateBadges_(p) {
  var out = "";
  if (p.isIntern) {
    out += '<span class="stateBadge" title="Intern (level I1) — in training, not delivery capacity. ' +
      'Shown here so they can see every signal and learn the standard; never graded, never counted ' +
      'in a published rate, never in the recoverable-hours figure.">🎓</span>';
  }
  if (p.newHire === true) {
    out += '<span class="stateBadge" title="New hire' + (p.hired ? " — joined " + esc_(p.hired) : "") +
      '. Inside the ramp-up window: their signals are shown and DO count, but idle capacity is ' +
      'expected and is excluded from the recoverable-hours figure.">🌱</span>';
  }
  if (p.onLeave === true) {
    out += '<span class="stateBadge" title="' + esc_(p.leaveStatus || "On long leave") +
      ' — capacity and hours are excluded from every published rate.">🏖</span>';
  }
  return out;
}

// ── JIRA DEEP LINKS (2026-08-10) ─────────────────────────────────────────────
//
// Every key on this dashboard is a real ticket somebody wants to open, and until
// now the only route was copy-paste into a Jira search. Four rules:
//
// 1. THE SITE COMES FROM THE PAYLOAD (`meta.jiraBase`), never a literal here. A
//    second instance or a sandbox is a Script Property away, and a hardcoded host
//    would send a manager to the wrong Jira with nothing on screen to say so.
// 2. MULTI-KEY LINKS USE `key in (…)`, not `assignee = "Name"`. Jira Cloud has
//    not resolved assignee by display name since the GDPR change — it needs an
//    accountId, which this pipeline does not carry — so an assignee query would
//    fail for some names and silently return the wrong person's board for others.
//    Keys are exact, they are already on screen, and the resulting list is
//    provably the same records the dashboard just showed.
// 3. `target="_blank"` is REQUIRED, not a nicety: this page runs inside the
//    Apps Script sandbox iframe, and a same-tab navigation is swallowed by it.
//    `rel="noopener"` with it, always.
// 4. URLs are CAPPED. A 300-key queue makes a ~4 KB URL that some proxies drop;
//    the link takes the first JIRA_LINK_MAX_KEYS_ and says so rather than
//    producing a link that silently fails to open.
var JIRA_LINK_MAX_KEYS_ = 80;

function jiraBase_() {
  return (MODEL && MODEL.meta && MODEL.meta.jiraBase) || "";
}

/** Anchor to a single issue — the plain, always-valid form. */
function jiraIssueUrl_(key) {
  return jiraBase_() + "/browse/" + encodeURIComponent(String(key || "").trim());
}

/** Issue-navigator URL for a JQL string. */
function jiraJqlUrl_(jql) {
  return jiraBase_() + "/issues/?jql=" + encodeURIComponent(jql);
}

/**
 * "Open these N in Jira" — a JQL over the exact keys on screen.
 * Returns null when there is no site configured or no key to open, so callers
 * render nothing rather than a dead link.
 */
function jiraKeysUrl_(keys) {
  if (!jiraBase_() || !keys || !keys.length) return null;
  var take = keys.slice(0, JIRA_LINK_MAX_KEYS_);
  return jiraJqlUrl_("key in (" + take.join(",") + ") ORDER BY duedate ASC, priority DESC");
}

/** One anchor, escaped, sandbox-safe. `text` is escaped here — callers pass plain
    strings, never markup, so a summary containing "<" can never inject. */
function jiraLink_(href, text, title) {
  return '<a href="' + esc_(href) + '" target="_blank" rel="noopener"' +
    (title ? ' title="' + esc_(title) + '"' : "") + ">" + esc_(text) + "</a>";
}

/** The "open the whole list" affordance, with its own cap disclosure. */
function jiraOpenAll_(keys, label) {
  var url = jiraKeysUrl_(keys);
  if (!url) return "";
  var capped = keys.length > JIRA_LINK_MAX_KEYS_;
  return " " + jiraLink_(url, "↗ " + (label || "Open in Jira") +
      (capped ? " (first " + JIRA_LINK_MAX_KEYS_ + ")" : ""),
    capped
      ? "Opens the first " + JIRA_LINK_MAX_KEYS_ + " of " + keys.length +
        " in the Jira issue navigator — a URL carrying every key would be too long for some browsers."
      : "Opens these " + keys.length + " in the Jira issue navigator, sorted by due date.");
}

  if (!STATE.openDetail[name]) delete STATE.openDetailAll[name];

function backlogItemsShown_() {

/**
 * Compare two "YYYY.WN" week keys. → -1 | 0 | 1, or null when either is
 * unparseable (an unknown shape must never silently rank as "earlier").
 *
 * NUMERIC ON PURPOSE. Week keys are NOT zero-padded — isoWeekNum_ returns an
 * integer, so weekKeyFromDate_ emits "2026.W9", not "2026.W09". A lexicographic
 * compare therefore ranks "2026.W9" AFTER "2026.W10", which would paint every
 * genuinely overdue item green for the first nine weeks of each year: invisible
 * in August, wrong every February. The server's isoWeekBefore_ parses the same
 * pattern for the same reason — this is that rule, client-side.
 */
function isoCmp_(a, b) {
  var pa = /^(\d{4})\.W(\d{1,2})$/.exec(String(a || ""));
  var pb = /^(\d{4})\.W(\d{1,2})$/.exec(String(b || ""));
  if (!pa || !pb) return null;
  var ya = +pa[1], yb = +pb[1];
  if (ya !== yb) return ya < yb ? -1 : 1;
  var wa = +pa[2], wb = +pb[2];
  return wa === wb ? 0 : (wa < wb ? -1 : 1);
}

/**
 * Urgency band for a due-date cell, as a CSS class name.
 *
 *   🔴 sigBad   due week EARLIER than the current ISO week  → overdue
 *   🟠 sigWarn  due week IS the current ISO week            → act now
 *   🟢 sigGood  due week LATER than the current ISO week    → future
 *
 * WEEK precision, not day precision: the managers' rule (2026-08-10) is that the
 * current week is compliant, and every reporting surface in this app is weekly.
 * The red band is the same claim as the server's dhOverdue_ — see the parity
 * test in node-tests.js.
 *
 * `undatedIsGap` decides what NO due date means, and it is per-surface BY
 * DESIGN — do not "fix" the inconsistency:
 *   true  → the caller's list is already filtered to STARTED work (openIssues
 *           drops unstarted-undated by rule), so an undated row there is a real
 *           gap and stays the red it has always been.
 *   false → the caller's list contains UNSTARTED work too, which is not a
 *           commitment yet and must not be coloured as a failure.
 *
 * Returns "" for ungraded, which callers render as a plain cell.
 */
function dueBand_(dueIso, nowIso, undatedIsGap) {
  if (!dueIso) return undatedIsGap ? "sigBad" : "";
  var c = isoCmp_(dueIso, nowIso);
  if (c === null) return "";
  return c < 0 ? "sigBad" : (c === 0 ? "sigWarn" : "sigGood");
}

/** The CURRENT ISO week, from the payload the model already ships.
    NOT meta.headlineIso — that is the LAST COMPLETED week (Code.js:1106), and
    using it would paint everything due this week red. */
function currentIso_() {
  var gw = (MODEL && MODEL.meta && MODEL.meta.gridWeeks) || [];
  for (var i = 0; i < gw.length; i++) if (gw[i] && gw[i].status === "now") return gw[i].iso;
  return "";
}

/**
 * The Due cell for the People drill-down.
 *
 * `undatedIsGap` is TRUE here and that is not an oversight: this table is fed by
 * openIssues, which already excludes unstarted-undated tickets by the managers'
 * 2026-08-10 rule — so anything undated reaching this cell is STARTED work with
 * no committed date, which BACKLOG_SIGNALS_.undated grades "bad" and which has
 * rendered red since before the bands existed. Grey here would silently
 * downgrade a live signal. The 🗓 PM tab, which DOES show unstarted work, passes
 * false. See spec 2026-08-11 §4.3.
 */
function dueCellHtml_(dueIso) {
  if (!dueIso) {
    return '<span class="sigBad" title="Started work with no due date — it can ' +
           'never appear in On-Time Delivery.">—</span>';

  var cls = dueBand_(dueIso, currentIso_(), true);
  var tip = cls === "sigBad" ? "Overdue — the committed week has ended."
          : cls === "sigWarn" ? "Due this week — still a live commitment."
          : cls === "sigGood" ? "Due in a later week." : "";
  return '<span class="' + cls + '" title="' + esc_(tip) + '">' + esc_(dueIso) + "</span>";
}

/** ▸ row: the person's open backlog items (backlogByPerson_ payload, already

function rosterDetailRow_(p, head) {

    ? "Tracked " + r1_(w.tracked) + "h of " + r1_(w.avail) + "h scheduled in " + esc_(head.label) +
      (w.billable > 0 || w.nonBillable > 0
        ? " · billable " + r1_(w.billable) + "h · non-billable work " + r1_(w.nonBillable - dOff) + "h" +

  // this person; `items` is what this render shows. The default stays short so the
  // row still reads as an explanation of the cells above it.
  var carried = (p.backlog && p.backlog.items) || [];
  var showAll = !!STATE.openDetailAll[p.name];
  var items = showAll ? carried : carried.slice(0, backlogItemsShown_());
  var nameArg = esc_(p.name).replace(/'/g, "\\'");
  // Three DIFFERENT facts, and they are deliberately not collapsed into one line:
  // how many are shown, how many the payload carries, and how many the person
  // actually has open. A clipped list read as complete is how "we cleared them
  // all" becomes wrong — the same contract as the gaps queue's key caps.
  var toggle = carried.length > backlogItemsShown_()
    ? ' <a href="#" onclick="event.stopPropagation();toggleRosterDetailAll_(\'' + nameArg + '\');return false" ' +
      'title="Show every open item loaded for ' + esc_(p.name) +
      ' — already in this page, nothing is fetched.">' +
      (showAll ? "▴ Show top " + backlogItemsShown_() : "▾ Show all " + carried.length) + "</a>"
    : "";

  // showing less than it holds, or the payload is holding less than the person
  // has. A note on a row that shows every item is noise, and noise on the healthy
  // rows is what teaches people to skip the line on the clipped ones.
  // p.backlog is null for anyone with no open work at all — every read of it
  // below has to survive that, which is why these are resolved once here.
  // `total` is the LISTABLE population, not the whole backlog: unstarted undated
  // tickets are ignored by rule and never reach `items`, so counting them in the

  // On a pre-v34 payload `listed` is absent and `count` IS the listable set.

  // Only when the list is showing less than it could: a "2 of 2" line on a row
  // that already shows everything is noise, and noise on the complete rows is
  // what teaches people to skip the line on the truncated ones. The full
  // population is accounted for by the reconciliation line below regardless.

      : "Top " + items.length + " of " + total + " listed") +
    " (by remaining hours)." +

        total + "."

  // the note falls silent — but the way back to the short read has to stay.
  var note = (noteText || toggle) ? noteText + toggle : "";
  // ── WHERE THE REST OF `n` WENT (user report 2026-08-10) ────────────────────
  // "n = 79 but when you expand we show only 1 ticket in progress — where did
  // the rest go?" Three exclusions were stacked behind that column with nothing
  // on screen naming any of them, so the only available reading was that the
  // dashboard had lost 78 tickets. The row now closes the arithmetic:
  //
  //     n = listed + unstarted-undated (ignored by rule) + epics (roll up)

  // Printed whenever the two numbers disagree, and NOT when they agree — a
  // reconciliation on a row that already reconciles is noise.

  var parts = [];
  if (total) parts.push("<b>" + total + "</b> listed below");
  if (ignored) {
    parts.push("<b>" + ignored + "</b> unstarted with no due date (ignored by rule — not a gap, " +
      "and not counted against this person)");
  }
  if (epicsN) {
    parts.push("<b>" + epicsN + "</b> epic" + (epicsN === 1 ? "" : "s") +
      " (never listed — they roll up their children, so listing both would double the load)");
  }
  // COLLAPSED (user 2026-08-10: the paragraph "could be wrapped to avoid going
  // out of the table"). The summary line is the arithmetic — the part a manager
  // needs at a glance — and the reasoning sits behind the disclosure, where it is
  // available to anyone who doubts the number and invisible to everyone else. It
  // is also width-capped: a single long sentence in a colspan cell stretches the
  // whole roster table, and a horizontally-scrolling roster is unreadable.
  var reconBits = [];
  if (total) reconBits.push(total + " listed");
  if (ignored) reconBits.push(ignored + " ignored");
  if (epicsN) reconBits.push(epicsN + " epic" + (epicsN === 1 ? "" : "s"));
  var recon = (nAll > total && parts.length)
    ? '<details class="reconBox"><summary><b>' + nAll + " open item" + (nAll === 1 ? "" : "s") +
      "</b> behind <b>Open issues</b> — " + reconBits.join(" · ") + "</summary>" +
      '<div class="cellSub">' + parts.join(" · ") +
      ". The signal cells above use their own denominators — Due date and Logged grade the " +
      "started work only — so none of these three numbers is the one being graded." +

        ? " You are on the <b>Resolved</b> view: the cells above cover " + esc_(head.label) +
          ", while this list is today's OPEN backlog and follows no period."
        : " This list is a snapshot of open work — it follows the filters, not the period picker.") +
      "</div></details>"
    : "";

    ? '<table class="hyg"><tr><th>Key</th><th>Summary</th>' +
      '<th title="The epic this ticket belongs to — what the work is FOR. A ticket with no epic ' +
      'cannot roll its hours up to an engagement, which is what the Epic link column grades.">' +
      "Belongs to</th><th>Status</th>" +
      '<th class="tnum">Rem. h</th><th>Due</th></tr>' +
      items.map(function (it) {

        // readable at a glance, the key is what gets pasted into Jira. Unlinked
        // work says so in the same red the missing-date cell uses — it is the
        // same class of gap and the manager is looking at both in one pass.
        // Both keys are links when a site is configured. The epic's name stays
        // the visible text — the link is on it, so the row reads as English and
        // still gets you into Jira in one click.

        var epic = it.epicKey
          ? (it.epicName
              ? (jiraBase_()
                  ? jiraLink_(epicHref, trunc_(it.epicName, 34), it.epicKey + " — " + it.epicName)
                  : '<span title="' + esc_(it.epicKey + " — " + it.epicName) + '">' +
                    esc_(trunc_(it.epicName, 34)) + "</span>") +

                'its key is known here.">' +
                (jiraBase_() ? jiraLink_(epicHref, it.epicKey, "Open " + it.epicKey + " in Jira")
                             : esc_(it.epicKey)) + "</span>")
          : '<span class="sigBad" title="No epic or parent — these hours cannot roll up to an ' +
            'engagement, so they cannot inform the next quote.">— not linked</span>';
        var keyCell = jiraBase_()
          ? jiraLink_(jiraIssueUrl_(it.key), it.key, "Open " + it.key + " in Jira")
          : esc_(it.key);
        return "<tr><td>" + keyCell + "</td><td>" + esc_(it.summary) + "</td><td>" +
          epic + "</td><td>" +
          esc_(it.status) + '</td><td class="tnum">' + r1_(it.remHrs) + "</td><td>" +
          dueCellHtml_(it.due) + "</td></tr>";

        ? '<div class="cellSub">' +

/** Scope tag chip — states which clock a column follows. The full version

/** Sums the server's per-week attribution counts over a set of ISO weeks. */

/** One gap row: coloured against its gate, never against 100% — a 90% gate met

/** Complete periods of the ACTIVE period type, oldest first. */

/**
 * Admin-only coverage-gate editor (user request 2026-08-03).

 *

function gateEditorHtml_() {

    .map(function (id) {
