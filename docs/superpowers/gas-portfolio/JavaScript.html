<script>
// ═══════════════════════════════════════════════════════════════════════════════
// Alex López Portfolio — Client-Side Modules
// Included via <?!= include('JavaScript') ?> inside index.html
// ═══════════════════════════════════════════════════════════════════════════════

// ── HELPERS ───────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function runServer(fn, args, onSuccess, onError) {
  var runner = google.script.run
    .withSuccessHandler(function(result) { onSuccess && onSuccess(result); })
    .withFailureHandler(function(err)    { onError   && onError(err);     });
  runner[fn].apply(runner, args || []);
}

// ── TOAST ─────────────────────────────────────────────────────────────────────

var Toast = (function() {
  function show(message, type) {
    type = type || 'success';
    var container = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '✓' : '✕') + '</span>' + escHtml(message);
    container.appendChild(el);
    requestAnimationFrame(function() {
      requestAnimationFrame(function() { el.classList.add('in'); });
    });
    setTimeout(function() {
      el.classList.remove('in');
      el.classList.add('out');
      setTimeout(function() { el.remove(); }, 350);
    }, 3200);
  }
  return { show: show };
}());

// ── DOMAIN GRID ───────────────────────────────────────────────────────────────

var DomainGrid = (function() {
  function render() {
    var grid = document.getElementById('domain-grid');
    if (!grid) return;
    grid.innerHTML = '';
    var projects = window.PROJECTS || [];
    var domains  = window.DOMAINS  || [];

    domains.forEach(function(domain) {
      var dp = projects.filter(function(p) { return p.domain === domain.id; });
      if (!dp.length) return;
      var card = document.createElement('div');
      card.className = 'domain-card';
      card.innerHTML =
        '<div class="domain-hd ' + escHtml(domain.color) + '">' +
          '<div class="domain-icon">' + domain.icon + '</div>' +
          '<div class="domain-name">' + escHtml(domain.label) + '</div>' +
          '<div class="domain-tagline">' + escHtml(domain.tagline) + '</div>' +
        '</div>' +
        '<div class="domain-tiles">' + dp.map(renderTile).join('') + '</div>';
      grid.appendChild(card);
    });
  }

  function renderTile(p) {
    var chips = (p.tech || []).slice(0, 3).map(function(t) {
      return '<span class="tile-chip">' + escHtml(t) + '</span>';
    }).join('');
    var del = p.id.indexOf('custom-') === 0
      ? '<button class="btn-delete" onclick="event.stopPropagation();AdminPanel&&AdminPanel.deleteProject(\'' + escHtml(p.id) + '\')">Delete</button>'
      : '';
    return (
      '<div class="domain-tile" onclick="ProjectModal.open(\'' + escHtml(p.id) + '\')" role="button" tabindex="0">' +
        '<div class="tile-row1">' +
          '<div class="tile-title">' + escHtml(p.title) + '</div>' +
          '<div class="tile-impact">⚡ ' + escHtml(p.impact) + '</div>' +
        '</div>' +
        '<div class="tile-chips">' + chips + del + '</div>' +
      '</div>'
    );
  }

  return { render: render };
}());

// ── PROJECT MODAL ─────────────────────────────────────────────────────────────

var ProjectModal = (function() {
  function open(id) {
    var projects = window.PROJECTS || [];
    var p = null;
    for (var i = 0; i < projects.length; i++) {
      if (projects[i].id === id) { p = projects[i]; break; }
    }
    if (!p) return;

    document.getElementById('pm-badges').innerHTML =
      '<span class="badge-category">' + escHtml(p.category) + '</span>' +
      '<span class="badge-impact">⚡ ' + escHtml(p.impact)  + '</span>';

    document.getElementById('pm-title').textContent   = p.title;
    document.getElementById('pm-tagline').textContent = p.tagline;

    document.getElementById('pm-car').innerHTML =
      '<div class="car-block context"><div class="car-label">Context</div><div class="car-text">'    + escHtml(p.context)    + '</div></div>' +
      '<div class="car-block action"><div class="car-label">Action</div><div class="car-text">'      + escHtml(p.action)     + '</div></div>' +
      '<div class="car-block resolution"><div class="car-label">Resolution</div><div class="car-text">' + escHtml(p.resolution) + '</div></div>';

    document.getElementById('pm-ba').innerHTML =
      '<div class="ba-card bef">' +
        '<div class="ba-label">BEFORE</div>' +
        '<div class="ba-process">' + escHtml(p.before.process) + '</div>' +
        '<div class="ba-metric">'  + escHtml(p.before.metrics) + '</div>' +
      '</div>' +
      '<div class="ba-arrow">→</div>' +
      '<div class="ba-card aft">' +
        '<div class="ba-label">AFTER</div>' +
        '<div class="ba-process">' + escHtml(p.after.process) + '</div>' +
        '<div class="ba-metric">'  + escHtml(p.after.metrics) + '</div>' +
      '</div>';

    var codeSection = document.getElementById('pm-code-section');
    if (p.codeSnippet) {
      document.getElementById('pm-code-lang').textContent     = p.codeSnippet.lang;
      document.getElementById('pm-code-lang-tag').textContent = p.codeSnippet.tag;
      document.getElementById('pm-code-pre').textContent      = p.codeSnippet.code;
      codeSection.style.display = 'block';
      document.getElementById('pm-code-toggle').classList.remove('open');
      document.getElementById('pm-code-body').classList.remove('open');
    } else {
      codeSection.style.display = 'none';
    }

    document.getElementById('pm-tech').innerHTML = (p.tech || []).map(function(t, i) {
      return '<span class="tech-chip' + (i < 2 ? ' highlight' : '') + '">' + escHtml(t) + '</span>';
    }).join('');

    document.getElementById('pm-metrics').innerHTML = (p.metrics || []).map(function(m) {
      return '<div class="inline-metric">' +
        '<div class="inline-metric-num">'   + escHtml(m.val)   + '</div>' +
        '<div class="inline-metric-label">' + escHtml(m.label) + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('pmodal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    if (p.id === 'ai-sales') DealRiskDemo.inject(document.getElementById('pmodal').querySelector('.pmodal-body'));
  }

  function close() {
    document.getElementById('pmodal-overlay').classList.remove('open');
    document.body.style.overflow = '';
    var body = document.getElementById('pmodal').querySelector('.pmodal-body');
    if (body) {
      var mounts = body.querySelectorAll('.pm-demo-mount');
      for (var i = 0; i < mounts.length; i++) { mounts[i].remove(); }
    }
  }

  function toggleCode() {
    document.getElementById('pm-code-toggle').classList.toggle('open');
    document.getElementById('pm-code-body').classList.toggle('open');
  }

  return { open: open, close: close, toggleCode: toggleCode };
}());

// ── ADMIN PANEL ───────────────────────────────────────────────────────────────

var AdminPanel = (function() {
  var currentTab = 'add';
  var _loggingEnabled = null;  // tracks server state; null = not yet loaded

  function open() {
    document.getElementById('admin-panel').classList.add('open');
    refreshManageList();
  }

  function close() {
    document.getElementById('admin-panel').classList.remove('open');
  }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.admin-tab').forEach(function(el) {
      var match = (el.getAttribute('onclick') || '').match(/switchTab\('([^']+)'\)/);
      el.classList.toggle('active', match && match[1] === tab);
    });
    document.querySelectorAll('.admin-tab-pane').forEach(function(el) {
      el.classList.remove('active');
    });
    var pane = document.getElementById('tab-' + tab);
    if (pane) pane.classList.add('active');
    if (tab === 'manage')    refreshManageList();
    if (tab === 'analytics') loadAnalytics();
    if (tab === 'settings')  loadLoggingStatus();
  }

  function submitProject() {
    var title = (document.getElementById('ap-title').value || '').trim();
    if (!title) { Toast.show('Please enter a project title', 'error'); return; }
    var impact    = (document.getElementById('ap-impact').value    || '').trim() || 'High impact';
    var category  = (document.getElementById('ap-category').value  || '').trim() || 'Analytics';
    var domain    = document.getElementById('ap-domain').value || 'ops';
    var tagline   = (document.getElementById('ap-tagline').value   || '').trim() || category + ' · ' + impact;
    var context   = (document.getElementById('ap-context').value   || '').trim() || '—';
    var action    = (document.getElementById('ap-action').value    || '').trim() || '—';
    var resolution= (document.getElementById('ap-resolution').value|| '').trim() || '—';
    var techRaw   = (document.getElementById('ap-tech').value      || '').trim();
    var tech = techRaw ? techRaw.split(',').map(function(t){ return t.trim(); }).filter(Boolean) : [];

    var projectData = {
      id:         'custom-' + Date.now(),
      domain:     domain,
      title:      title,
      tagline:    tagline,
      category:   category,
      impact:     impact,
      context:    context,
      action:     action,
      resolution: resolution,
      tech:       tech,
      metrics:    [{ val: '✓', label: 'delivered' }],
      before:     { process: 'Previous manual process', metrics: 'Time-intensive, error-prone' },
      after:      { process: 'Automated solution: ' + title, metrics: impact },
      codeSnippet: null
    };

    runServer('saveProject', [projectData],
      function(result) {
        window.PROJECTS.push(projectData);
        DomainGrid.render();
        clearAddForm();
        Toast.show('Project saved!', 'success');
      },
      function(err) { Toast.show(String(err.message || err), 'error'); }
    );
  }

  function clearAddForm() {
    ['ap-title','ap-impact','ap-category','ap-tagline','ap-context','ap-action','ap-resolution','ap-tech']
      .forEach(function(id) { var el = document.getElementById(id); if (el) el.value = ''; });
  }

  function deleteProject(projectId) {
    if (!confirm('Delete this custom project? This cannot be undone.')) return;
    runServer('deleteProject', [projectId],
      function() {
        window.PROJECTS = window.PROJECTS.filter(function(p){ return p.id !== projectId; });
        DomainGrid.render();
        refreshManageList();
        Toast.show('Project deleted', 'success');
      },
      function(err) { Toast.show(String(err.message || err), 'error'); }
    );
  }

  function refreshManageList() {
    var list = document.getElementById('ap-custom-list');
    if (!list) return;
    var custom = (window.PROJECTS || []).filter(function(p){ return p.id.indexOf('custom-') === 0; });
    if (!custom.length) {
      list.innerHTML = '<div class="admin-empty">No custom projects yet.<br>Add one from the "Add Project" tab.</div>';
      return;
    }
    list.innerHTML = custom.map(function(p) {
      return '<div class="custom-project-item">' +
        '<div>' +
          '<div class="custom-project-name">'   + escHtml(p.title)  + '</div>' +
          '<div class="custom-project-domain">' + escHtml(p.domain) + '</div>' +
        '</div>' +
        '<button class="btn-delete" onclick="AdminPanel.deleteProject(\'' + escHtml(p.id) + '\')">Delete</button>' +
      '</div>';
    }).join('');
  }

  function saveApiKey() {
    var key = (document.getElementById('ap-apikey').value || '').trim();
    if (!key) { Toast.show('Please enter an API key', 'error'); return; }
    runServer('saveApiKey', [key],
      function() {
        document.getElementById('ap-apikey').value = '';
        document.getElementById('chat-no-key').classList.remove('visible');
        Toast.show('API key saved!', 'success');
      },
      function(err) { Toast.show(String(err.message || err), 'error'); }
    );
  }

  function loadAnalytics() {
    var statsEl = document.getElementById('analytics-stats');
    var logEl   = document.getElementById('analytics-log');
    if (!statsEl) return;
    statsEl.innerHTML = '<div class="admin-empty">Loading…</div>';
    if (logEl) logEl.innerHTML = '';
    runServer('getAnalyticsSummary', [],
      function(data) {
        var ssLink = data.ssUrl
          ? '<div class="analytics-stat" onclick="window.open(\'' + data.ssUrl + '\',\'_blank\')" title="Open in Sheets" style="cursor:pointer;">' +
            '<span class="analytics-num" style="font-size:20px;">&#x2197;</span><span class="analytics-lbl">View Sheet</span></div>'
          : '';
        statsEl.innerHTML =
          '<div class="analytics-stat"><span class="analytics-num">' + data.sessions + '</span><span class="analytics-lbl">Sessions</span></div>' +
          '<div class="analytics-stat"><span class="analytics-num">' + data.messages + '</span><span class="analytics-lbl">Messages</span></div>' +
          ssLink;
        updateLoggingBadge(data.loggingEnabled);
        if (!data.rows || !data.rows.length) {
          if (logEl) logEl.innerHTML = '<div class="admin-empty">No interactions recorded yet.</div>';
          return;
        }
        if (logEl) logEl.innerHTML = data.rows.slice().reverse().map(function(r) {
          var d = r.ts ? new Date(r.ts) : null;
          var ts = d ? ((d.getMonth()+1) + '/' + d.getDate() + ' ' + d.toTimeString().substr(0,5)) : '—';
          var msg = String(r.message || '');
          if (msg.length > 100) msg = msg.substring(0, 100) + '…';
          return '<div class="analytics-row ' + escHtml(r.role || 'user') + '">' +
            '<span class="analytics-ts">' + ts + '</span>' +
            '<span class="analytics-role">' + escHtml(r.role || '—') + '</span>' +
            '<span class="analytics-msg">' + escHtml(msg) + '</span>' +
          '</div>';
        }).join('');
      },
      function(err) {
        statsEl.innerHTML = '<div class="admin-empty" style="color:#f87171;">' + escHtml(String(err.message || err)) + '</div>';
      }
    );
  }

  function clearLogs() {
    if (!confirm('Clear all chat logs? This cannot be undone.')) return;
    runServer('clearChatLogs', [],
      function() { Toast.show('Logs cleared', 'success'); loadAnalytics(); },
      function(err) { Toast.show(String(err.message || err), 'error'); }
    );
  }

  function loadLoggingStatus() {
    var el = document.getElementById('ap-logging-status');
    if (!el) return;
    el.textContent = '…';
    runServer('getAnalyticsSummary', [],
      function(data) { updateLoggingBadge(data.loggingEnabled); },
      function()     { el.textContent = '—'; }
    );
  }

  function updateLoggingBadge(enabled) {
    _loggingEnabled = enabled;
    var el = document.getElementById('ap-logging-status');
    if (!el) return;
    el.textContent = enabled ? 'ON' : 'OFF';
    el.style.color = enabled ? 'var(--teal-vivid)' : 'var(--light-muted)';
  }

  function toggleLogging() {
    if (_loggingEnabled === null) {
      Toast.show('Status still loading — try again in a moment', 'error');
      return;
    }
    var newState = !_loggingEnabled;
    runServer('toggleChatLogging', [newState],
      function() { updateLoggingBadge(newState); Toast.show('Chat logging ' + (newState ? 'enabled' : 'disabled'), 'success'); },
      function(err) { Toast.show(String(err.message || err), 'error'); }
    );
  }

  return {
    open: open, close: close, switchTab: switchTab,
    submitProject: submitProject, deleteProject: deleteProject,
    saveApiKey: saveApiKey, loadAnalytics: loadAnalytics, clearLogs: clearLogs,
    toggleLogging: toggleLogging
  };
}());

// ── CHAT ──────────────────────────────────────────────────────────────────────

var Chat = (function() {
  var history = [];
  var sending = false;

  function init() {
    var input = document.getElementById('chat-input');
    if (!input) return;
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  }

  function send() {
    if (sending) return;
    var input = document.getElementById('chat-input');
    var text  = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    document.getElementById('chat-suggestions').style.display = 'none';
    addMessage('user', text);
    var typingEl = addTyping();
    sending = true;
    document.getElementById('chat-send-btn').disabled = true;

    runServer('proxyGroqChat', [text, history.slice(), window.SESSION_ID || 'anon'],
      function(responseText) {
        typingEl.remove();
        addMessage('ai', responseText || 'No response received.');
        history.push({ role: 'user',      content: text });
        history.push({ role: 'assistant', content: responseText || '' });
        if (history.length > 12) history = history.slice(-12);
        sending = false;
        document.getElementById('chat-send-btn').disabled = false;
      },
      function(err) {
        typingEl.remove();
        var msg = String(err.message || err);
        if (msg.indexOf('not configured') !== -1) {
          document.getElementById('chat-no-key').classList.add('visible');
          addMessage('ai', 'The AI assistant isn\'t configured yet. The admin needs to set the Groq API key.');
        } else {
          addMessage('ai', 'Error: ' + msg);
        }
        sending = false;
        document.getElementById('chat-send-btn').disabled = false;
      }
    );
  }

  function sendSuggestion(el) {
    var input = document.getElementById('chat-input');
    input.value = el.textContent;
    send();
  }

  function addMessage(role, text) {
    var container = document.getElementById('chat-messages');
    var msg = document.createElement('div');
    msg.className = 'msg ' + role;
    var bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg;
  }

  function addTyping() {
    var container = document.getElementById('chat-messages');
    var el = document.createElement('div');
    el.className = 'msg-typing';
    el.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
    return el;
  }

  return { init: init, send: send, sendSuggestion: sendSuggestion };
}());

// ── PIPELINE RISK SIMULATOR ───────────────────────────────────────────────────

var DealRiskDemo = (function() {

  // 5 sample deals representing a realistic Q-end pipeline
  var DEALS = [
    { name: 'Enterprise Renewal',  amountK: 350, ageDays: 45 },
    { name: 'New Logo — SaaS Co',  amountK: 180, ageDays: 30 },
    { name: 'Platform Expansion',  amountK:  95, ageDays: 60 },
    { name: 'Mid-Market Suite',    amountK: 120, ageDays: 90 },
    { name: 'SMB Starter Pack',    amountK:  40, ageDays: 15 },
  ];
  var TARGET_K = 600;

  // Matches the Groq prompt rules: 15% multiplicative decay per 30d, larger deals decay slower
  function closePct(ageDays, amountK) {
    var start    = amountK > 250 ? 0.82 : amountK > 100 ? 0.78 : 0.74;
    var discount = amountK > 250 ? 0.50 : amountK > 100 ? 0.30 : 0;
    var decay    = 0.15 * (1 - discount);   // decay per 30-day period
    return Math.max(0.04, start * Math.pow(1 - decay, ageDays / 30));
  }

  function fmt(k) {
    return k >= 1000 ? '$' + (k / 1000).toFixed(1) + 'M' : '$' + Math.round(k) + 'K';
  }

  function probCls(p) { return p >= 0.60 ? 'g' : p >= 0.40 ? 'w' : 'b'; }

  // ── per-instance factory (called once per inject) ────────────────────────────

  function createInstance(containerEl) {
    // per-instance state
    var _aiScores = null;

    // capture refs via container-scoped queries
    var refs = {
      forecast:   containerEl.querySelector('.pl-forecast'),
      gap:        containerEl.querySelector('.pl-gap'),
      atRisk:     containerEl.querySelector('.pl-at-risk'),
      barFill:    containerEl.querySelector('.pl-bar-fill'),
      forward:    containerEl.querySelector('.pl-forward'),
      forwardVal: containerEl.querySelector('.pl-forward-val'),
      rows:       containerEl.querySelector('.pl-rows'),
      aiBtn:      containerEl.querySelector('.pl-ai-btn'),
      aiNote:     containerEl.querySelector('.pl-ai-note'),
      aiResults:  containerEl.querySelector('.pl-ai-results')
    };

    // ── render ────────────────────────────────────────────────────────────────

    function renderTable(fwd) {
      if (!refs.rows) return;
      refs.rows.innerHTML = DEALS.map(function(d) {
        var nowP  = closePct(d.ageDays,       d.amountK);
        var projP = closePct(d.ageDays + fwd, d.amountK);
        var delta = Math.round((projP - nowP) * 100);
        var deltaStr = fwd > 0
          ? '<span class="pl-delta">' + (delta >= 0 ? '+' : '') + delta + '%</span>'
          : '';
        var rowCls = projP < 0.35 ? ' pl-crit' : projP < 0.50 ? ' pl-warn' : '';
        return (
          '<div class="pl-row' + rowCls + '">' +
            '<span class="pl-cell-name">' + escHtml(d.name) + '</span>' +
            '<span class="pl-cell">'      + fmt(d.amountK)  + '</span>' +
            '<span class="pl-cell">'      + d.ageDays + 'd' + '</span>' +
            '<span class="pl-prob ' + probCls(nowP)  + '">' + Math.round(nowP  * 100) + '%</span>' +
            '<span class="pl-prob ' + probCls(projP) + '">' + Math.round(projP * 100) + '%' + deltaStr + '</span>' +
            '<span class="pl-cell">'      + fmt(d.amountK * projP) + '</span>' +
          '</div>'
        );
      }).join('');
    }

    function renderSummary(fwd) {
      var forecast = DEALS.reduce(function(s, d) {
        return s + d.amountK * closePct(d.ageDays + fwd, d.amountK);
      }, 0);
      var atRisk = DEALS.filter(function(d) {
        return closePct(d.ageDays + fwd, d.amountK) < 0.40;
      }).length;
      var pct = Math.min(1, forecast / TARGET_K);
      var gap = forecast - TARGET_K;

      if (refs.forecast) refs.forecast.textContent = fmt(forecast);
      if (refs.gap) {
        refs.gap.textContent = (gap >= 0 ? '+' : '') + fmt(Math.abs(gap));
        refs.gap.className   = 'pl-kpi-val pl-gap ' + (gap >= 0 ? 'pl-pos' : 'pl-neg');
      }
      if (refs.atRisk) {
        refs.atRisk.textContent = atRisk + ' deal' + (atRisk !== 1 ? 's' : '');
        refs.atRisk.className   = 'pl-kpi-val pl-at-risk ' + (atRisk > 0 ? 'pl-neg' : 'pl-pos');
      }
      if (refs.barFill) refs.barFill.style.width = Math.round(pct * 100) + '%';
    }

    function update() {
      var fwd = parseInt(refs.forward.value, 10) || 0;
      if (refs.forwardVal) refs.forwardVal.textContent = fwd === 0 ? 'Today' : '+' + fwd + ' days';
      renderTable(fwd);
      renderSummary(fwd);
    }

    // ── Groq batch scoring ────────────────────────────────────────────────────

    function scoreAll() {
      var btn       = refs.aiBtn;
      var noteEl    = refs.aiNote;
      var resultsEl = refs.aiResults;
      if (!btn) return;

      btn.disabled = true;
      if (noteEl) noteEl.textContent = 'Scoring 5 deals in parallel…';
      if (resultsEl) resultsEl.innerHTML =
        '<div class="demo-loading-row">' +
          '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>' +
          '<span class="demo-loading-text">Groq AI analyzing pipeline…</span>' +
        '</div>';

      var payload = DEALS.map(function(d) {
        return { ageDays: d.ageDays, amountK: d.amountK };
      });

      runServer('calculatePipelineRisk', [payload],
        function(scores) {
          btn.disabled = false;
          _aiScores = scores;
          if (noteEl) noteEl.textContent = 'AI recommendations loaded';
          if (resultsEl) {
            resultsEl.innerHTML = scores.map(function(s, i) {
              var lvl = ['Low','Medium','High','Critical'].indexOf(s.level) >= 0 ? s.level : 'Medium';
              return (
                '<div class="pl-ai-card">' +
                  '<div class="pl-ai-card-name">' +
                    escHtml(DEALS[i].name) +
                    ' <span class="demo-level ' + lvl + '">' + escHtml(s.level || '—') + '</span>' +
                  '</div>' +
                  '<div class="pl-ai-action">' + escHtml(s.nextAction || '—') + '</div>' +
                '</div>'
              );
            }).join('');
          }
        },
        function(err) {
          btn.disabled = false;
          var msg = String(err.message || err);
          if (noteEl) noteEl.textContent = '';
          if (resultsEl) {
            var colour = msg.indexOf('not configured') !== -1 ? '#fbbf24' : '#f87171';
            var label  = msg.indexOf('not configured') !== -1
              ? '⚠ Groq API key not set — admin must configure it.'
              : 'Error: ' + escHtml(msg);
            resultsEl.innerHTML =
              '<div class="demo-loading-row">' +
                '<span class="demo-loading-text" style="color:' + colour + '">' + label + '</span>' +
              '</div>';
          }
        }
      );
    }

    // bind events
    if (refs.forward) refs.forward.addEventListener('input', update);
    if (refs.aiBtn)   refs.aiBtn.addEventListener('click', scoreAll);

    // initial render
    _aiScores = null;
    update();
  }

  // ── inject / destroy ────────────────────────────────────────────────────────

  function inject(containerEl) {
    var tpl = document.getElementById('deal-risk-demo-tpl');
    if (!tpl || !containerEl) return;
    var clone = tpl.content.cloneNode(true);
    containerEl.appendChild(clone);
    // createInstance scopes to the newly added mount node
    var mount = containerEl.querySelector('.pm-demo-mount:last-of-type');
    if (mount) createInstance(mount);
  }

  return { inject: inject };
}());

// ── UI UTILITIES ──────────────────────────────────────────────────────────────

var UI = (function() {

  // Counter animation (hero metrics)
  function initCounters() {
    document.querySelectorAll('.counter').forEach(function(el) {
      var target  = parseInt(el.getAttribute('data-target'), 10) || 0;
      var current = 0;
      var duration = 1400;
      var start = null;
      function step(timestamp) {
        if (!start) start = timestamp;
        var progress = Math.min((timestamp - start) / duration, 1);
        var ease = 1 - Math.pow(1 - progress, 3);
        current = Math.round(ease * target);
        el.textContent = current;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // Scroll-reveal (IntersectionObserver)
  function initScrollReveal() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function(el) {
        el.classList.add('visible');
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(function(el) { obs.observe(el); });
  }

  // Skill bars (animate width on scroll)
  function initSkillBars() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.skill-bar-fill').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || 0) + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var pct = entry.target.getAttribute('data-pct') || 0;
          entry.target.style.width = pct + '%';
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    document.querySelectorAll('.skill-bar-fill').forEach(function(el) { obs.observe(el); });
  }

  // Mobile nav hamburger
  function initMobileNav() {
    var btn   = document.getElementById('nav-hamburger');
    var links = document.getElementById('nav-links');
    if (!btn || !links) return;
    btn.addEventListener('click', function() {
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });
    // Close on link click
    links.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
    // Close on outside tap
    document.addEventListener('click', function(e) {
      if (links.classList.contains('open') &&
          !links.contains(e.target) && !btn.contains(e.target)) {
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // Nav active-section highlight
  function initNavHighlight() {
    var sections = ['hero','projects','chat-section','about','contact'];
    var links    = document.querySelectorAll('.nav-link');
    if (!('IntersectionObserver' in window) || !links.length) return;
    var active = '';
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          active = entry.target.id;
          links.forEach(function(a) {
            var href = (a.getAttribute('href') || '').replace('#','');
            a.classList.toggle('active', href === active);
          });
        }
      });
    }, { threshold: 0.35 });
    sections.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) obs.observe(el);
    });
  }

  // Stack bar marquee — duplicate pills so loop is seamless
  function initStackBar() {
    var stack = [
      'Python','SQL · SuiteQL','Gemini Pro API','Google Apps Script',
      'Tableau','Looker','HubSpot API v3/v4','NetSuite · Oracle',
      'Vertex AI','Claude API','pandas','ETL Pipelines',
      'Prompt Engineering','PDF Automation','RBAC','Time Decay Forecasting',
      'Bitbucket Pipelines','Google Clasp · GitOps','Claude Code','Rovo Agents','MCP Integration'
    ];
    var track = document.getElementById('stack-track');
    if (!track) return;
    var html = '';
    var doubled = stack.concat(stack);
    doubled.forEach(function(t, i) {
      html += '<span class="stack-pill">' + escHtml(t) + '</span>';
      if (i < doubled.length - 1) html += '<span class="stack-sep">·</span>';
    });
    track.innerHTML = html;
  }

  return {
    initCounters:      initCounters,
    initScrollReveal:  initScrollReveal,
    initSkillBars:     initSkillBars,
    initMobileNav:     initMobileNav,
    initNavHighlight:  initNavHighlight,
    initStackBar:      initStackBar
  };
}());

// ── MODAL EVENT WIRING ────────────────────────────────────────────────────────

function wireModalEvents() {
  var overlay = document.getElementById('pmodal-overlay');
  var closeBtn = document.getElementById('pmodal-close');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) ProjectModal.close();
    });
  }
  if (closeBtn) closeBtn.addEventListener('click', ProjectModal.close);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') ProjectModal.close();
  });
  // Keyboard support for tiles
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.classList.contains('domain-tile')) {
      e.target.click();
    }
  });
}

// ── GAS BANNER SUPPRESSION ────────────────────────────────────────────────────
// GAS injects a "created by a Google Apps Script user" notice into the DOM
// after the page loads. CSS alone may not be enough if GAS injects inline
// styles; the MutationObserver catches and removes the elements in real time.
(function() {
  var SELS = [
    '.script-application-banner',
    '.docs-butterbar-container',
    '[id^="docs-butterbar"]',
    '[class*="docs-butterbar"]'
  ];
  function nuke() {
    SELS.forEach(function(s) {
      document.querySelectorAll(s).forEach(function(el) {
        el.style.cssText += ';display:none!important;height:0!important;';
      });
    });
    // GAS adds margin-top to body to make room for the banner
    document.body.style.removeProperty('margin-top');
    document.body.style.removeProperty('padding-top');
  }
  nuke();
  var mo = new MutationObserver(nuke);
  mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
}());

document.addEventListener('DOMContentLoaded', function() {
  DomainGrid.render();

  UI.initStackBar();

  UI.initScrollReveal();

  UI.initMobileNav();
  UI.initNavHighlight();

  // Admin-only module guard
  if (window.IS_ADMIN) {
    // Admin panel is already in DOM (injected by GAS template)
    // AdminPanel is fully wired via onclick attributes
  }
});

</script>
