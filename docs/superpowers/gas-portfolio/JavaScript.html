// ── UI UTILITIES ──────────────────────────────────────────────────────────────

var UI = (function() {

  // Counter animation (hero metrics)
  function initCounters() {
    document.querySelectorAll('.counter').forEach(function(el) {
      var target  = parseInt(el.getAttribute('data-target'), 10) || 0;
      var current = 0;
      var duration = 1400;
      var start = null;
      function step(timestamp) {
        if (!start) start = timestamp;
        var progress = Math.min((timestamp - start) / duration, 1);
        var ease = 1 - Math.pow(1 - progress, 3);
        current = Math.round(ease * target);
        el.textContent = current;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }

  // Scroll-reveal (IntersectionObserver)
  function initScrollReveal() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.reveal').forEach(function(el) {
        el.classList.add('visible');
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(function(el) { obs.observe(el); });
  }

  // Skill bars (animate width on scroll)
  function initSkillBars() {
    if (!('IntersectionObserver' in window)) {
      document.querySelectorAll('.skill-bar-fill').forEach(function(el) {
        el.style.width = (el.getAttribute('data-pct') || 0) + '%';
      });
      return;
    }
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var pct = entry.target.getAttribute('data-pct') || 0;
          entry.target.style.width = pct + '%';
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.3 });
    document.querySelectorAll('.skill-bar-fill').forEach(function(el) { obs.observe(el); });
  }

  // Mobile nav hamburger
  function initMobileNav() {
    var btn   = document.getElementById('nav-hamburger');
    var links = document.getElementById('nav-links');
    if (!btn || !links) return;
    btn.addEventListener('click', function() {
      var open = links.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
    });
    // Close on link click
    links.querySelectorAll('a').forEach(function(a) {
      a.addEventListener('click', function() {
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
    // Close on outside tap
    document.addEventListener('click', function(e) {
      if (links.classList.contains('open') &&
          !links.contains(e.target) && !btn.contains(e.target)) {
        links.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });
  }

  // Nav active-section highlight
  function initNavHighlight() {
    var sections = ['hero','projects','demos','chat-section','about','contact'];
    var links    = document.querySelectorAll('.nav-link');
    if (!('IntersectionObserver' in window) || !links.length) return;
    var active = '';
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          active = entry.target.id;
          links.forEach(function(a) {
            var href = (a.getAttribute('href') || '').replace('#','');
            a.classList.toggle('active', href === active);
          });
        }
      });
    }, { threshold: 0.35 });
    sections.forEach(function(id) {
      var el = document.getElementById(id);
      if (el) obs.observe(el);
    });
  }

  // Stack bar marquee — duplicate pills so loop is seamless
  function initStackBar() {
    var stack = [
      'Python','SQL · SuiteQL','Gemini Pro API','Google Apps Script',
      'Tableau','Looker','HubSpot API v3/v4','NetSuite · Oracle',
      'Vertex AI','Claude API','pandas','ETL Pipelines',
      'Prompt Engineering','RBAC','Time Decay Forecasting','Lever',
      'Bitbucket Pipelines','Google Clasp · GitOps','Claude Code','Rovo Agents','MCP Integration'
    ];
    var track = document.getElementById('stack-track');
    if (!track) return;
    var html = '';
    var doubled = stack.concat(stack);
    doubled.forEach(function(t, i) {
      html += '<span class="stack-pill">' + escHtml(t) + '</span>';
      if (i < doubled.length - 1) html += '<span class="stack-sep">·</span>';
    });
    track.innerHTML = html;
  }

  return {
    initCounters:      initCounters,
    initScrollReveal:  initScrollReveal,
    initSkillBars:     initSkillBars,
    initMobileNav:     initMobileNav,
    initNavHighlight:  initNavHighlight,
    initStackBar:      initStackBar
  };
}());

  function nuke() {
    SELS.forEach(function(s) {
      document.querySelectorAll(s).forEach(function(el) {
        el.style.cssText += ';display:none!important;height:0!important;';
      });
    });
    // GAS adds margin-top to body to make room for the banner
    document.body.style.removeProperty('margin-top');
    document.body.style.removeProperty('padding-top');
  }
  nuke();
  var mo = new MutationObserver(nuke);
  mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
}());

// ── SCROLL NUDGE (Donna contextual hint) ─────────────────────────────────────
var ScrollNudge = (function() {
  var el, msgEl;
  var dismissed = false;
  var shown = {};
  var hideTimer = null;

  var HINTS = {
    'demos':    'How does the Pipeline Risk Analyzer work?',
    'projects': 'Which project shows your strongest AI work?',
    'about':    'What kinds of roles fit Alex best?',
    'contact':  'Is Alex open to new opportunities right now?'
  };

  function init() {
    el    = document.getElementById('donna-nudge');
    msgEl = el && el.querySelector('.donna-nudge-msg');
    if (!el) return;

    try { if (sessionStorage.getItem('donna_nudge_done')) { dismissed = true; return; } } catch(e) {}

    el.querySelector('.donna-nudge-inner').addEventListener('click', onNudgeClick);
    el.querySelector('.donna-nudge-close').addEventListener('click', function(e) {
      e.stopPropagation();
      dismiss();
    });

    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting && !dismissed && !shown[entry.target.id]) {
          shown[entry.target.id] = true;
          show(entry.target.id);
        }
      });
    }, { threshold: 0.25 });

    Object.keys(HINTS).forEach(function(id) {
      var sec = document.getElementById(id);
      if (sec) obs.observe(sec);
    });
  }

  function show(sectionId) {
    if (!el || !HINTS[sectionId] || dismissed) return;
    clearTimeout(hideTimer);
    msgEl.textContent = HINTS[sectionId];
    el.classList.add('visible');
    hideTimer = setTimeout(hide, 8000);
  }

  function hide() {
    if (el) el.classList.remove('visible');
  }

  function dismiss() {
    dismissed = true;
    hide();
    try { sessionStorage.setItem('donna_nudge_done', '1'); } catch(e) {}
  }

  function onNudgeClick() {
    var msg = msgEl ? msgEl.textContent : '';
    dismiss();
    var chatSec = document.getElementById('chat-section');
    if (chatSec) chatSec.scrollIntoView({ behavior: 'smooth' });
    if (msg) {
      setTimeout(function() {
        var inp = document.getElementById('chat-input');
        if (inp && typeof Chat !== 'undefined' && !inp.value) {
          inp.value = msg;
          Chat.send();
        }
      }, 700);
    }
  }

  return { init: init, dismiss: dismiss };
}());

// ── HERO DATA-NODE CANVAS ───────────────────────────────────────────────────────
// Lightweight animated "neural network" of drifting nodes + proximity links in the
// hero's right column. Self-contained, density scales to canvas size, skips entirely
// when the canvas is hidden (≤900px) and renders a single static frame when the
// visitor prefers reduced motion.
(function() {
  function start() {
    var canvas = document.getElementById('data-nodes');
    if (!canvas || !canvas.getContext) return;
    var parent = canvas.parentElement;
    var ctx    = canvas.getContext('2d');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var DOT = 'rgba(56,189,248,0.85)', LINE = 'rgba(56,189,248,0.16)', LINK = 120;
    var nodes = [], raf = null, t = null;

    function sizeCanvas() {
      canvas.width  = parent.clientWidth;
      canvas.height = parent.clientHeight;
    }
    function build() {
      nodes = [];
      if (!canvas.width || !canvas.height) return;
      // Density scales with area; cap is high enough that the full-bleed ultra-wide
      // canvas (≥1800px) stays a dense web. Normal half-width canvases land ~45–60
      // nodes, well under the cap, so this only affects the wide full-bleed layout.
      var count = Math.min(130, Math.round(canvas.width * canvas.height / 6000));
      for (var i = 0; i < count; i++) {
        nodes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 1,
          vx: (Math.random() - 0.5) * 0.6,
          vy: (Math.random() - 0.5) * 0.6
        });
      }
    }
    function links() {
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK) {
            ctx.strokeStyle = LINE; ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }
    }
    function dots() {
      ctx.fillStyle = DOT;
      for (var i = 0; i < nodes.length; i++) {
        ctx.beginPath();
        ctx.arc(nodes[i].x, nodes[i].y, nodes[i].r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < nodes.length; i++) {
        var p = nodes[i];
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > canvas.width)  p.vx = -p.vx;
        if (p.y < 0 || p.y > canvas.height) p.vy = -p.vy;
      }
      links(); dots();
      raf = requestAnimationFrame(frame);
    }
    function boot() {
      if (raf) { cancelAnimationFrame(raf); raf = null; }
      sizeCanvas(); build();
      if (!nodes.length) return;               // hidden → clientWidth 0
      if (reduce) { ctx.clearRect(0, 0, canvas.width, canvas.height); links(); dots(); }
      else frame();
    }
    boot();
    window.addEventListener('resize', function() { clearTimeout(t); t = setTimeout(boot, 200); });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
}());

// ── HERO PROOF TERMINAL ─────────────────────────────────────────────────────────
// Types out a sample weekly-pipeline run line-by-line in the hero's right column,
// then leaves a blinking cursor. A small footer cycles through "proof" one-liners.
// Both honour prefers-reduced-motion (final state rendered statically, no loop).
(function() {
  var CURSOR = '<span class="hpf-cursor"></span>';
  var LINES = [
    { cmd: 'alex run pipeline --weekly' },
    { out: '<span class="c-arrow">→</span> reading 7 Google Sheets <span class="c-dim">…</span> <span class="c-ok">ok</span>' },
    { out: '<span class="c-arrow">→</span> joining roster × RCR × goals <span class="c-dim">1,240 rows</span>' },
    { out: '<span class="c-arrow">→</span> scoring 312 contributors <span class="c-ok">done</span>' },
    { out: '<span class="c-arrow">→</span> Gemini narrative <span class="c-dim">1.8s</span>' },
    { out: '<span class="c-ok">✓</span> dashboard published · 5-week rolling view' },
    { out: '<span class="c-dim">  saved ≈14 manual hours / cycle</span>' }
  ];
  var ROTATE = [
    '11 production apps shipped',
    '9 LLM systems live (Gemini · Claude)',
    'RBAC web apps · live exec dashboards',
    'SuiteQL audits across NetSuite + Oracle'
  ];

  function lineHTML(item) {
    return item.cmd !== undefined
      ? '<span class="c-dim">$</span> <span class="c-cmd">' + item.cmd + '</span>'
      : item.out;
  }

  function typeTerminal() {
    var el = document.getElementById('hpf-term');
    if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.innerHTML = LINES.map(lineHTML).join('\n') + CURSOR; return; }

    var html = '', i = 0;
    function next() {
      if (i >= LINES.length) { el.innerHTML = html + CURSOR; return; }
      var item = LINES[i];
      if (item.cmd !== undefined) {
        var full = item.cmd, c = 0;
        var prefix = html + '<span class="c-dim">$</span> <span class="c-cmd">';
        (function type() {
          el.innerHTML = prefix + full.slice(0, c) + '</span>' + CURSOR;
          if (c < full.length) { c++; setTimeout(type, 38); }
          else { html = prefix + full + '</span>\n'; i++; setTimeout(next, 360); }
        })();
      } else {
        html += lineHTML(item) + '\n';
        el.innerHTML = html + CURSOR;
        i++; setTimeout(next, 300);
      }
    }
    next();
  }

  function rotateProof() {
    var el = document.getElementById('hpf-rotate');
    if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var k = 0;
    setInterval(function() {
      k = (k + 1) % ROTATE.length;
      el.style.opacity = '0';
      setTimeout(function() { el.textContent = ROTATE[k]; el.style.opacity = '1'; }, 380);
    }, 3200);
  }

  function init() { typeTerminal(); rotateProof(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
}());

</script>
