<script>
"use strict";
// Menu surfaces: QTA Status, Data Reference, Access Control. Same load-order
// contract as Views.html.
function renderQta(el) {
  const d = STATE.data;
  const rows = d.qtaInterim.filter(r => !filtersActive() || visibleEmp(r));
  const overdue = rows.filter(r => r.daysOverdue != null && r.daysOverdue > 0).length;
  el.innerHTML =
    '<div class="banner">📋 <b>Official QTA-cycle source pending</b> — interim signal below uses each Rocketeer&#39;s latest <i>Next Review</i> date from the Compensation Report, waiting-longest first.</div>' +
    sourceBanner("history", "Compensation history") +
    '<div class="card"><h2>Review readiness <span class="chip red">' + overdue + ' overdue</span>' +
    '<span class="chip">' + rows.length + ' active Rocketeers</span></h2>' +
    '<table><tr><th>Name</th><th>Dept</th><th>Location</th><th>Level</th><th>Next Review</th><th>Status</th><th>Last comp event</th></tr>' +
    rows.map(r => {
      const st = r.daysOverdue == null ? '<span class="chip">no review date</span>'
        : r.daysOverdue > 0 ? '<span class="chip red">' + r.daysOverdue + 'd overdue</span>'
        : '<span class="chip green">in ' + (-r.daysOverdue) + 'd</span>';
      return '<tr class="click" onclick="openDrill(\'' + esc(r.empNo) + '\')">' +
        '<td>' + esc(r.name) + '</td><td>' + esc(r.dept) + '</td><td>' + esc(r.keyLocation) + '</td>' +
        '<td>' + esc(r.level) + '</td><td>' + esc(r.nextReview || "—") + '</td><td>' + st + '</td>' +
        '<td>' + esc(r.lastEventReason) + (r.lastEventDate ? " · " + esc(r.lastEventDate) : "") + '</td></tr>';
    }).join("") + '</table></div>';
}
// Threshold numbers interpolate from meta (compaBands / equityCfg = CONFIG_CD echoes),
// so tuning CONFIG_CD updates this prose automatically. V4 layout: sectioned
// cards with a sticky chip nav — content unchanged, structure modernized.
function refJump(id) {
  const t = document.getElementById(id);
  if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderReference(el) {
  const m = STATE.data.meta;
  const b = m.compaBands || { low: 0.8, target: 0.95, high: 1.1 };
  const q = m.equityCfg || { gapPct: 10, outlierPct: 25, tenureYearsMin: 3, tenureBelowPct: 15, smallGroupMin: 3 };
  const p = m.priorityCfg || { weights: { perf: 57, tenure: 29, compaGap: 14 },
                               caps: { companyYears: 10, profileYears: 5, gapPct: 0.25 }, ratingMax: 5 };
  const cov = m.benchCoverage || { rows: 0, matchedEmployees: 0, currencyMismatch: 0 };
  const sc = m.signalsCfg || {};
  const dot = s => /^ok$/.test(String(s)) ? '<span class="dot ok"></span>'
    : /error/i.test(String(s)) ? '<span class="dot err"></span>' : '<span class="dot pend"></span>';

  const sources = [
    { name: "Roster, attrition, TCC", status: m.sources.roster,
      desc: "Roster file — active + terminated rows; crew/contractors excluded everywhere." },
    { name: "USD conversion", status: m.tccUsdAvailable ? "ok" : "pending",
      desc: '"TCC USD" column in the roster tab (position may shift; resolved by header name, not a separate tab).' +
        (m.tccUsdAvailable ? "" : " Column not found — the USD toggle shows local-only.") },
    { name: "Comp history + QTA interim", status: m.sources.history,
      desc: 'Compensation Report — "RD" tab, joined by Employee Number.' },
    { name: "Performance ratings", status: m.sources.ratings || "—",
      desc: '"Small Improvements RD" tab (contribution data file), joined by Employee Number — ' +
        (m.ratingsCount || 0) + " rating rows." },
    { name: "Market benchmarks", status: m.sources.benchmarks || "—",
      desc: 'Benchmarking file — "Compilation" tab, joined by normalized Location + Job Title, LOCAL currency; the compilation grows over time.' },
    { name: "Employment type", status: m.employmentTypeAvailable ? "ok" : "pending",
      desc: m.employmentTypeAvailable
        ? "Roster Employment Type column — " + ((m.employmentCounts || {}).partTime || 0) + " part-time, " +
          ((m.employmentCounts || {}).intern || 0) + " intern active."
        : "Employment Type column not found — everyone currently reads as regular." },
    { name: "Contribution snapshot", status: (m.contribution && m.contribution.quarter) ? "ok" : (m.sources.contribution || "pending"),
      desc: (m.contribution && m.contribution.quarter)
        ? '"Contribution Snapshot" tab — ' + m.contribution.matched + " Rocketeers frozen at " + m.contribution.quarter +
          " cycle open (goals, PTO compliance, tracked coverage, RCR, kudos)."
        : 'Quarterly evidence frozen by exportContributionSnapshot() in the PS project — runs at QTA cycle open; pending until the first export.' },
  ];

  const formulas = [
    ["⚖️ Internal Position", 'TCC ÷ anchor, ACTIVE peers, local currency. Anchor tiers: (1) median of Key Location + Job Title peers when the group has ≥ ' + q.smallGroupMin + ' members; (2) the external <b>market mean</b> for that Location + Job Title (N-of-1 rule — external parity replaces internal equity for unique roles); (3) median of the Key Location + Level cohort (≥ ' + q.smallGroupMin + '); else "insufficient peers". Anchors always derive from the FULL active population — the universal filters never recompute them. Bands: red &lt; ' + b.low.toFixed(2) + ', yellow &lt; ' + b.target.toFixed(2) + ', green ≤ ' + b.high.toFixed(2) + ', violet above (ceiling watch).'],
    ["🎯 Priority Score", 'Weighted 0–100: performance (avg rating ÷ ' + p.ratingMax + ' over the last ' + (sc.perfWindowQuarters || 4) + ' completed quarters) × ' + p.weights.perf + '% + tenure (50/50 company capped ' + p.caps.companyYears + 'y / in-role capped ' + p.caps.profileYears + 'y) × ' + p.weights.tenure + '% + compa gap (below-anchor %, full credit at ' + Math.round(p.caps.gapPct * 100) + '%) × ' + p.weights.compaGap + '%. Missing components redistribute their weight (° = partial). Shown on the 🎯 Priority Ranking tab, which carries a full component legend. Mastery banding is a planned future component.'],
    ["🌍 vs Market", 'TCC ÷ benchmark <b>Mean</b> (a mean, not P50) for the same Location + Job Title, local currency only — currency-mismatched rows are skipped and counted. Below ' + (m.marketLow || 0.9).toFixed(2) + ' renders red (priority read). Coverage: ' + cov.matchedEmployees + ' matched / ' + cov.rows + ' rows' + (cov.currencyMismatch ? ' / ' + cov.currencyMismatch + ' currency mismatches' : '') + '.'],
    ["🕰 Tenure & growth", 'Company = years since Hire Date. In-role = years since the latest promotion, title-change, or internal-transfer comp event (falls back to Hire Date) — an Internal Transfer changes responsibilities even when pay doesn&#39;t move, so it resets the in-role clock. TTM growth = TCC now ÷ TCC in effect 12 months ago − 1 (null when history is younger). TCC AGR is the system-generated rate recorded in the RD tab ("TAG" field), shown as recorded. Annualized = (current ÷ previous)^(1 ÷ years) − 1 (RRI) between consecutive comp events; the first event (usually New Hire) is the baseline and gets no rate.'],
    ["📉 Attrition rate", 'FY terminations ÷ mean(headcount at FY start, headcount at FY end — or today for the running FY). Voluntary/involuntary from Termination Category. Fiscal year starts July 1.'],
    ["🧭 Pay Equity lenses", 'Within Key Location + level groups: gender median gap ≥ ' + q.gapPct + '% flags the group (needs ≥2 members per gender); individuals ≥ ' + q.outlierPct + '% below group median flag as outliers; ≥ ' + q.tenureYearsMin + 'y tenure AND ≥ ' + q.tenureBelowPct + '% below median flags the tenure lens.'],
    ["📋 QTA interim", 'Latest "Next Review" per Rocketeer from RD events, sorted overdue-first.'],
    ["🚨 Risk Signals", 'Performance evidence window = last ' + (sc.perfWindowQuarters || 4) + ' completed fiscal quarters (' + esc((sc.windowFqs || []).join(", ")) + '). Promotion staleness ≥ ' + (sc.promoStaleYears || 3) + ' years in role (early-career lens ' + esc(sc.earlyCareerLevels || "I1–I3") + '). Recognition risk = latest completed-quarter rating ≥ ' + (sc.recogMinRating || 4.5) + ' with TTM TCC growth under ' + Math.round((sc.recogMaxTtm || 0.05) * 100) + '%. Retention cohort = levels ' + esc(sc.coreLevels || "I3–I4") + ' stacking ≥ ' + (sc.riskFactorMin || 2) + ' factors. Invisible contributor = contribution evidence score ≥ ' + (sc.invisibleMinScore || 0.75) + ' with windowed SI below ' + (sc.invisibleWeakSi || 4) + ' or unrated. Overridable via CD_SIGNALS_CFG. These flags surface people for a human conversation — they never re-score anyone.'],
    ["🚀 Contribution snapshot", 'Quarterly frozen evidence per Rocketeer (goal compliance, PTO compliance, tracked coverage, kudos, RCR for Services) exported from the PS Contribution Report at QTA cycle open. The evidence score is the mean of available components — NOT the Top Rocketeers weekly score — and exists so the invisible-contributor check has a deterministic input until GTT-35 standardizes contribution points. Frozen on purpose: QTA evidence must not move mid-review.'],
    ["👥 Population rules", 'EOR (Employer of Record) Rocketeers are regular employees in every engine. Part-time / intern Rocketeers stay in headcount, attrition and QTA but are excluded from peer anchors, ratio scoring, equity lenses and market reads — not comparable to full-time peers. Restricted profiles (CEO / chiefs / directors, M' + ((m.restricted || {}).minMLevel || 9) + '+) are stripped server-side for anyone without exec view' + (((m.restricted || {}).hidden || 0) > 0 ? ' — ' + m.restricted.hidden + ' hidden in this session' : '') + '.'],
    ["💱 Currency & filters", 'Within-group math always runs in local currency. The Local | USD toggle changes display only; cross-location aggregates (Overview) use USD where available. Universal filters recompute every view for the filtered population, EXCEPT anchors and equity group medians (always full-population facts).'],
  ];

  const nav = [["refSources", "Sources"], ["refFormulas", "Formulas & rules"],
               ["refGlossary", "Glossary"], ["refThresholds", "Thresholds & provenance"]];

  el.innerHTML =
    '<div class="ref-nav">' + nav.map(n =>
      '<button onclick="refJump(\'' + n[0] + '\')">' + esc(n[1]) + '</button>').join("") +
    '<span class="sub" style="margin-left:auto;align-self:center">Payload ' + esc(m.generatedAt) +
    (m.fromCache ? ' · cached (⟳ Refresh = live read)' : ' · live') + ' · TTL 65 min</span></div>' +

    '<div class="card" id="refSources"><h2>🗂 Sources</h2><div class="ref-grid">' +
    sources.map(s =>
      '<div class="ref-card"><h4>' + dot(s.status) + esc(s.name) + '</h4><p>' + s.desc +
      (/error/i.test(String(s.status)) ? '<br><b style="color:var(--bad)">' + esc(s.status) + '</b>' : '') +
      '</p></div>').join("") + '</div></div>' +

    '<div class="card" id="refFormulas"><h2>🧮 Formulas &amp; rules</h2>' +
    formulas.map((f, i) =>
      '<details class="ref-acc"' + (i === 0 ? " open" : "") + '><summary>' + f[0] + '</summary>' +
      '<div class="ref-body">' + f[1] + '</div></details>').join("") + '</div>' +

    '<div class="card" id="refGlossary"><h2>📖 Glossary</h2><div class="ref-grid">' +
    (m.glossary || []).map(g =>
      '<div class="ref-card"><h4>' + esc(g.term) + '</h4><p>' + esc(g.def) + '</p></div>').join("") +
    '</div></div>' +

    '<div class="card" id="refThresholds"><h2>🎚 RAG thresholds &amp; benchmark provenance</h2>' +
    (function () {
      const r = m.ragCfg || {};
      const row = (label, bands, note) => bands
        ? '<tr><td><b>' + label + '</b></td>' +
          '<td><span style="color:var(--accent)">≤ ' + (bands.green * 100).toFixed(0) + '%</span></td>' +
          '<td><span style="color:var(--warn)">≤ ' + (bands.yellow * 100).toFixed(0) + '%</span></td>' +
          '<td><span style="color:var(--bad)">above</span></td><td class="sub">' + esc(note) + '</td></tr>'
        : "";
      return '<table><tr><th>Metric</th><th>Green</th><th>Yellow</th><th>Red</th><th>Note</th></tr>' +
        row("Total attrition", r.attritionTotal, "Mercer 2025 + SPI center total attrition at ~11–14%") +
        row("Voluntary attrition", r.attritionVol, "SHRM 2025 median voluntary is 9%") +
        row("Regretted share (of voluntary)", r.regrettedShare, "Typical firms run 15–35% (Umbrex)") +
        (r.peerVolBand ? '<tr><td><b>Peer voluntary band</b></td><td colspan="3">' +
          (r.peerVolBand.low * 100).toFixed(0) + '–' + (r.peerVolBand.high * 100).toFixed(0) +
          '%</td><td class="sub">Professional-services peer set; BPO-adjacent roles run higher</td></tr>' : "") +
        '<tr><td><b>Span of control</b></td><td colspan="3">target 1:' + (r.spanTarget || 6) +
          ' · narrow &lt; ' + (r.spanNarrow || 4) + ' · overload &gt; ' + (r.spanWide || 10) +
          '</td><td class="sub">Knowledge-work norm 6–8 (Visier, McKinsey)</td></tr>' +
        '<tr><td><b>Sample-size floors</b></td><td colspan="3">&lt; ' + (r.floorHeads || 10) +
          ' heads or &lt; ' + (r.floorExits || 3) + ' exits</td><td class="sub">Rates under the floor get a ⚠ caveat and never render as RISK</td></tr>' +
        '<tr><td><b>Manager rows / forecast</b></td><td colspan="3">≥ ' + (r.mgrMinReports || 3) +
          ' reports · ≥ ' + (r.forecastMinMonths || 6) + ' actual FY months</td>' +
          '<td class="sub">Smaller teams pool into one row; a shorter FY shows no projection</td></tr>' +
        '</table>' +
        '<p class="sub">Sources: ' + ((m.benchmarks && m.benchmarks.sources) || []).map(esc).join(" · ") +
        '. Every value is configuration (CONFIG_CD.RAG) overridable via the <b>CD_RAG_CFG</b> Script Property — this table always shows the live values.</p>';
    })() + '</div>';
}
function renderAccess(el) {
  el.innerHTML = '<div class="card"><h2>🔒 Access Control</h2><p class="sub">Loading…</p></div>';
  google.script.run
    .withSuccessHandler(s => renderAccessForm(el, s))
    .withFailureHandler(e => {
      el.innerHTML = '<div class="banner err">❌ ' + esc((e && e.message) || e) + '</div>';
    })
    .getAccessSettings();
}
function renderAccessForm(el, s) {
  el.innerHTML =
    '<div class="card"><h2>🔒 Access Control</h2>' +
    '<p class="sub">One email per line (commas also work). Bootstrap admin (' + esc(s.bootstrapAdmin) +
    ') is always active and not listed here. Every grant means <b>global</b> comp visibility — ' +
    'org-scoped manager access is a V2 feature; do not hand this out casually.</p>' +
    '<h3>Admins (manage this list + full dashboard)</h3>' +
    '<textarea id="accAdmins" rows="4" style="width:100%">' + esc(s.admins.join("\n")) + '</textarea>' +
    '<h3>Viewers (full dashboard, read-only settings)</h3>' +
    '<textarea id="accViewers" rows="6" style="width:100%">' + esc(s.viewers.join("\n")) + '</textarea>' +
    '<h3>Exec view — may see restricted profiles (CEO / chiefs / directors)</h3>' +
    '<p class="sub">Admins always see restricted profiles. A viewer listed here sees them too; every other viewer gets those records stripped server-side. Patterns live in CONFIG_CD.RESTRICTED (+ CD_RESTRICTED_EXTRA employee numbers).</p>' +
    '<textarea id="accExecView" rows="3" style="width:100%">' + esc((s.execView || []).join("\n")) + '</textarea>' +
    '<p><button onclick="saveAccess()">Save access lists</button> <span id="accMsg" class="sub"></span></p></div>';
}
function saveAccess() {
  const split = id => document.getElementById(id).value.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  document.getElementById("accMsg").textContent = "saving…";
  google.script.run
    .withSuccessHandler(() => { document.getElementById("accMsg").textContent = "✅ saved — cache version bumped"; })
    .withFailureHandler(e => { document.getElementById("accMsg").textContent = "❌ " + ((e && e.message) || e); })
    .saveAccessSettings({ admins: split("accAdmins"), viewers: split("accViewers"),
                          execView: split("accExecView") });
}
</script>
