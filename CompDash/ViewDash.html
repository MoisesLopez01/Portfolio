<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      /* COMPANY_COLORS — brand palette (see frontend standard) */
      --void-blue:   #0F1941; /* primary background (dark) */
      --light-cream: #FFFAF5; /* primary text on dark */
      --orbe-blue:   #058CDC; /* accent / CTAs */
      --ivory:       #DCCDBE; /* neutral surfaces / muted labels */
      --june:        #FF9B87; /* highlight accents (banners, emphasis) */
      /* Semantic theme derived from COMPANY_COLORS — DARK (default).
         Every renderer styles against these names only; the light theme below
         re-binds the same names, so no renderer knows which theme is active. */
      --bg: var(--void-blue);
      --panel: #16224E; --panel-2: #1C2B5E; --border: #2C3D78;
      --text: var(--light-cream); --muted: var(--ivory); --chip: #202F66;
      --cta: var(--orbe-blue);    /* interactive: buttons, links, active states */
      --cta-text: var(--void-blue); /* text on a CTA-filled control */
      /* Status colors — data semantics, deliberately NOT brand colors */
      --accent: #35c26e;  /* green — good / at target */
      --warn:   #e8b93c;  /* yellow — attention */
      --bad:    #e05252;  /* red — priority read */
      --above:  #9d7bff;  /* violet — above median (ceiling watch) */
      --banner-bg: #3B2833; --banner-border: var(--june); --banner-text: #FFD8CC;
      --banner-err-bg: #3a2020; --banner-err-text: #f2b8b8;
      --overlay: rgba(13,21,55,.85);
      --shadow: rgba(0,0,0,.4);
    }
    /* LIGHT theme — same COMPANY_COLORS family, inverted roles: cream page,
       white panels, void-blue type. Status colors are re-tuned darker so the
       chips keep AA contrast on white. Applied via data-theme on <html>,
       persisted in localStorage (cd_theme). */
    :root[data-theme="light"] {
      --bg: var(--light-cream);
      --panel: #FFFFFF; --panel-2: #F4EDE4; --border: #E3D8CB;
      --text: var(--void-blue); --muted: #6E6455; --chip: #F3EBE1;
      --cta: #0277C0;             /* orbe-blue deepened for white surfaces */
      --cta-text: #FFFFFF;
      --accent: #1B8F4E; --warn: #A87708; --bad: #C13A3A; --above: #7A5AE0;
      --banner-bg: #FFEFE9; --banner-border: var(--june); --banner-text: #8A3B2A;
      --banner-err-bg: #FBE4E4; --banner-err-text: #A03030;
      --overlay: rgba(255,250,245,.88);
      --shadow: rgba(15,25,65,.18);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
    header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; }
    .sub { color: var(--muted); font-size: 12px; }
    .hdr-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    button { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--cta); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; background: transparent; }
    .seg button.on { background: var(--cta); color: var(--cta-text); font-weight: 600; }
    nav { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
    nav button.on { background: var(--panel-2); border-color: var(--cta); font-weight: 600; }
    #stickyBar { position: sticky; top: 0; z-index: 20; background: var(--bg); }
    .filterbar { display: flex; gap: 8px; padding: 8px 18px 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
    .filterbar input[type=search] { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 190px; }
    .chip.violet { border-color: var(--above); color: var(--above); }
    /* Layout width. 1280px letterboxed an ultrawide into roughly a third of the
       glass, so the page now grows with the viewport in tiers up to --page-max
       instead of stopping at a laptop width. The tiers are widths, not device
       guesses: each one is the point where the content genuinely earns more
       room (wider tables, more KPI columns per row). */
    :root { --page-max: 1280px; }
    @media (min-width: 1600px) { :root { --page-max: 1500px; } }
    @media (min-width: 1920px) { :root { --page-max: 1760px; } }
    @media (min-width: 2560px) { :root { --page-max: 2200px; } }
    main { padding: 16px 18px 60px; max-width: var(--page-max); margin: 0 auto; }
    /* The sticky bars stay FULL-BLEED — their panel background and bottom rule
       should span the glass — but their contents line up with main's measure, so
       a filter never drifts away from the column it filters. Padding rather than
       max-width is what keeps the background full width. */
    header, nav, .filterbar {
      padding-left:  max(18px, calc((100% - var(--page-max)) / 2));
      padding-right: max(18px, calc((100% - var(--page-max)) / 2));
    }

    /* Tables scroll INSIDE their own box. Without this the 6-column manager
       hotspots table and the 8-column termination detail push the whole
       document sideways on a narrow window — the page itself must never scroll
       horizontally. min-width keeps columns legible rather than crushed. */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .scroll-x > table { min-width: 620px; }
    .scroll-x > table.wide { min-width: 860px; }

    @media (max-width: 820px) {
      main { padding: 12px 12px 60px; }
      header, nav, .filterbar { padding-left: 12px; padding-right: 12px; }
      /* A search box with a 190px floor plus four selects overflowed the row;
         let them share the line instead. */
      .filterbar input[type=search], .filterbar select { min-width: 0; flex: 1 1 140px; }
      .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .kpi-v { font-size: 22px; }
      .kpi-q { min-height: 0; }
      h1 { font-size: 16px; }
      .drill { width: 100vw; }
    }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .banner { background: var(--banner-bg); border: 1px solid var(--banner-border); color: var(--banner-text); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
    .banner.err { background: var(--banner-err-bg); border-color: var(--bad); color: var(--banner-err-text); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--panel-2); }
    .chip { display: inline-block; background: var(--chip); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin: 0 6px 6px 0; }
    .chip.green { border-color: var(--accent); color: var(--accent); }
    .chip.yellow { border-color: var(--warn); color: var(--warn); }
    .chip.red { border-color: var(--bad); color: var(--bad); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
    .kpi:hover { border-color: var(--cta); }
    .kpi-q { color: var(--muted); font-size: 12px; min-height: 30px; }
    .kpi-v { font-size: 26px; font-weight: 700; margin: 4px 0 2px; }
    .kpi-s { color: var(--muted); font-size: 11px; }
    .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
    .bar > i { display: block; height: 100%; }
    .menu { position: absolute; top: 52px; left: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px; z-index: 30; display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
    .menu button { text-align: left; border: none; background: transparent; }
    .menu button:hover { background: var(--chip); }
    .drill { position: fixed; top: 0; right: 0; width: min(560px, 96vw); height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 40; padding: 18px; overflow-y: auto; box-shadow: -12px 0 30px var(--shadow); }
    /* !important so this beats the higher-specificity #loading { display:flex }
       — without it the loading overlay can never be hidden. */
    .hidden { display: none !important; }
    #loading { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 50; font-size: 15px; color: var(--muted); }
    select, textarea { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--muted); }
    h2 { font-size: 15px; margin: 0 0 10px; }
    h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    a { color: var(--cta); }
    /* 12px floor — chart labels get screenshotted into decks; 10px on navy
       fell below the dashboard's own sub-label minimum. */
    svg text { fill: var(--muted); font-size: 12px; }
    /* 📊 Data Reference — modern sectioned layout */
    .ref-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; position: sticky; top: 0; }
    .ref-nav button { border-radius: 999px; font-size: 12px; padding: 5px 12px; }
    .ref-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .ref-card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
    .ref-card h4 { margin: 0 0 6px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .ref-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
    .dot.ok { background: var(--accent); } .dot.err { background: var(--bad); } .dot.pend { background: var(--warn); }
    details.ref-acc { margin: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); }
    details.ref-acc + details.ref-acc { margin-top: 8px; }
    details.ref-acc summary { padding: 10px 14px; font-weight: 600; font-size: 13px; color: var(--text); list-style: none; }
    details.ref-acc summary::before { content: "▸ "; color: var(--muted); }
    details.ref-acc[open] summary::before { content: "▾ "; }
    details.ref-acc .ref-body { padding: 0 14px 12px; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
    /* 🏠 Overview — facts / signals / KPI band bars */
    .factlink { cursor: pointer; }
    .factlink:hover { color: var(--cta); text-decoration: underline; }
    .bandbar { position: relative; display: flex; height: 8px; border-radius: 4px;
               overflow: visible; margin: 8px 0 4px; }
    .bandbar i { display: block; height: 100%; opacity: .4; }
    .bandbar i:first-child { border-radius: 4px 0 0 4px; }
    .bandbar i:last-child { border-radius: 0 4px 4px 0; }
    .bandbar .mk { position: absolute; top: -4px; width: 2px; height: 16px;
                   background: var(--text); border-radius: 1px; }
    .kpi.zero { opacity: .68; }
    .kpi.zero .kpi-v { font-size: 20px; color: var(--accent); }
    .kpi-verdict { font-size: 11.5px; margin-top: 2px; }
    .prov { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  </style>
</head>
<body>
<div id="stickyBar">
<header>
  <button id="menuBtn" title="Menu">☰</button>
  <div>
    <h1>Rocketeer Global Comp Health Report</h1>
    <div class="sub" id="subTitle">loading…</div>
  </div>
  <div class="hdr-right">
    <div class="seg" id="curToggle">
      <button data-cur="LOCAL" class="on">Local</button>
      <button data-cur="USD">USD</button>
    </div>
    <button id="themeBtn" title="Toggle light / dark theme">☀️</button>
    <button id="refreshBtn" title="Bypass cache for a live read">⟳ Refresh</button>
  </div>
</header>
<div id="menuPanel" class="menu hidden"></div>
<nav id="tabbar"></nav>
<div class="filterbar">
  <select id="fLoc" onchange="setFilter('loc', this.value)"></select>
  <select id="fLevel" onchange="setFilter('level', this.value)"></select>
  <select id="fDept" onchange="setFilter('dept', this.value)"></select>
  <input id="fQ" type="search" placeholder="🔎 Find a Rocketeer…" oninput="setFilter('q', this.value)">
  <button id="fClear" class="hidden" onclick="clearFilters()">✕ Clear</button>
  <span class="sub" id="fNote"></span>
</div>
</div>
<main><div id="pane"></div></main>
<div id="drill" class="drill hidden"></div>
<div id="loading">Loading compensation data…</div>

<script>
"use strict";
const USER_ROLE  = "<?= userRole ?>";
const USER_EMAIL = "<?= userEmail ?>";
// Bump in lockstep with BUILD_.code in Code.js. A mismatch means the server and
// this file came from different pastes — the numbers on screen may be stale.
const SCHEMA = 46;

// Single source of truth for navigation — same pattern as PS Dashboard.
const VIEWS = [
  { id: "overview",  label: "🏠 Overview",           roles: ["admin", "viewer"] },
  // Managers folded INTO Attrition (2026.W31): the full manager list outgrew
  // its own tab — only outlier teams render there now (see mgrHotspotsHtml).
  { id: "attrition", label: "📉 Attrition",           roles: ["admin", "viewer"] },
  { id: "compa",     label: "⚖️ Internal Position",   roles: ["admin", "viewer"] },
  { id: "qta",       label: "📋 QTA Status",          roles: ["admin", "viewer"] },
  { id: "reference", label: "📊 Data Reference",      roles: ["admin", "viewer"], menu: true },
  { id: "access",    label: "🔒 Access Control",      roles: ["admin"],           menu: true },
];

const STATE = {
  data: null, tab: "overview", currency: "LOCAL",
  attrGran: "month", attrDim: "department",
  filters: { loc: "", level: "", dept: "", q: "" },
};

// ── helpers ─────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// ── universal filters ───────────────────────────────────────────────────────────
function normName(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function filtersActive() {
  const f = STATE.filters;
  return !!(f.loc || f.level || f.dept || f.q);
}
// One predicate for employees[], people[], and any row carrying these fields.
function visibleEmp(e) {
  const f = STATE.filters;
  return (!f.loc || e.keyLocation === f.loc) &&
         (!f.level || e.level === f.level) &&
         (!f.dept || e.dept === f.dept) &&
         (!f.q || normName(e.name).indexOf(normName(f.q)) !== -1);
}
function setFilter(k, v) {
  STATE.filters[k] = v;
  syncFilterBar();
  render();
}
function clearFilters() {
  STATE.filters = { loc: "", level: "", dept: "", q: "" };
  populateFilters();
  syncFilterBar();
  render();
}
function syncFilterBar() {
  document.getElementById("fClear").classList.toggle("hidden", !filtersActive());
  document.getElementById("fNote").textContent = filtersActive()
    ? STATE.data.employees.filter(visibleEmp).length + " Rocketeers match" : "";
}
function populateFilters() {
  const d = STATE.data;
  if (!d) return;
  const f = STATE.filters;
  const opt = (id, label, vals, cur) => {
    document.getElementById(id).innerHTML =
      '<option value="">' + label + ': All</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") +
        '>' + esc(v) + '</option>').join("");
  };
  opt("fLoc", "Location", [...new Set(d.employees.map(e => e.keyLocation))].filter(Boolean).sort(), f.loc);
  opt("fLevel", "Level", [...new Set(d.employees.map(e => e.level))].sort(), f.level);
  opt("fDept", "Department", [...new Set(d.employees.map(e => e.dept))].filter(Boolean).sort(), f.dept);
  document.getElementById("fQ").value = f.q;
}
function fmtMoney(tcc, tccUsd, currency) {
  if (STATE.currency === "USD") return tccUsd != null ? "$" + Math.round(tccUsd).toLocaleString() : "—";
  return tcc != null ? Math.round(tcc).toLocaleString() + (currency ? " " + currency : "") : "—";
}
function pctFmt(x, dp) { return x == null ? "—" : (x * 100).toFixed(dp == null ? 1 : dp) + "%"; }
function ratioClass(r) {
  // Bands come from CONFIG_CD via meta.compaBands — never hardcode them here.
  const b = (STATE.data && STATE.data.meta.compaBands) || { low: 0.8, target: 0.95, high: 1.1 };
  return r == null ? "" : r < b.low ? "red" : r < b.target ? "yellow" : r <= b.high ? "green" : "violet";
}
function ratioBarColor(cls) {
  return cls === "green" ? "var(--accent)" : cls === "yellow" ? "var(--warn)" :
         cls === "violet" ? "var(--above)" : "var(--bad)";
}
// MIRROR of ragBand_ in Code.js (3-line band classifier) — keep in sync.
function ragBandC(value, bands) {
  if (value == null || !bands) return null;
  return value <= bands.green ? "green" : value <= bands.yellow ? "yellow" : "red";
}
// Colored status glyph + value. band null → plain value. The glyph SHAPE
// changes with the band (✓/!/✕), so the read survives colorblindness and
// grayscale printing — status is never encoded by color alone.
function ragDot(band, text) {
  const col = band === "green" ? "var(--accent)" : band === "yellow" ? "var(--warn)" :
              band === "red" ? "var(--bad)" : "var(--muted)";
  const glyph = band === "green" ? "✓" : band === "yellow" ? "!" : band === "red" ? "✕" : "•";
  return '<span style="color:' + col + ';font-weight:700">' + glyph + '</span> ' + text;
}
// Trend arrow vs a prior-basis value (±0.5pp dead zone). Direction only —
// the RAG dot carries the judgment. Empty string when either basis is missing.
function trendArrow(cur, prev) {
  if (cur == null || prev == null) return "";
  const d = cur - prev;
  return Math.abs(d) < 0.005 ? " →" : d > 0 ? " ▲" : " ▼";
}
// One verdict line: severity → fact → so-what → action → caveat.
function verdictHtml(v) {
  const col = v.severity === "RISK" ? "var(--bad)" : v.severity === "NOTE" ? "var(--warn)" : "var(--accent)";
  return '<div style="border-left:3px solid ' + col + ';padding:5px 10px;margin:0 0 8px">' +
    '<b style="color:' + col + '">' + esc(v.severity) + '</b> — ' + esc(v.fact) +
    (v.soWhat ? ' <i class="sub">' + esc(v.soWhat) + '</i>' : '') +
    (v.action ? ' <b>→ ' + esc(v.action) + '</b>' : '') +
    (v.caveat ? ' <span class="sub">⚠ ' + esc(v.caveat) + '</span>' : '') + '</div>';
}
// All verdicts for a view, in payload order.
function verdictsFor(view) {
  return ((STATE.data && STATE.data.verdicts) || []).filter(v => v.view === view);
}
/**
 * The drawing width a chart should use: the pane's real inner width, less card
 * padding. Measured rather than assumed, so one viewBox unit is one screen pixel
 * and nothing stretches — the same reason the chart sets "meet" instead of
 * "none". Falls back to the old fixed 720 before the pane exists.
 *
 * @param {number=} fallback
 * @returns {number}
 */
function chartWidth(fallback) {
  const pane = document.getElementById("pane");
  const w = pane ? pane.clientWidth : 0;
  if (!w) return fallback || 720;
  // 34px = the card's own horizontal padding plus its borders.
  return Math.max(560, Math.min(2000, Math.round(w - 34)));
}
function median(nums) {
  const a = nums.slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
// ── ISO weeks (org standard: "2026.W32", always paired with calendar dates) ──
function isoWeekParts(iso, plusWeeks) {
  const d = new Date(iso + "T00:00:00Z");
  if (plusWeeks) d.setUTCDate(d.getUTCDate() + plusWeeks * 7);
  const t = new Date(d);
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // ISO Thursday
  const jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  const mon = new Date(d);
  mon.setUTCDate(mon.getUTCDate() - ((mon.getUTCDay() + 6) % 7));
  const sun = new Date(mon);
  sun.setUTCDate(sun.getUTCDate() + 6);
  return { label: t.getUTCFullYear() + ".W" + (week < 10 ? "0" + week : week), mon, sun };
}
function isoWeekLabel(iso, plusWeeks) { return isoWeekParts(iso, plusWeeks).label; }
// "2026.W32 · Aug 3–9" — a week number is never shown without its dates.
function isoWeekFull(iso, plusWeeks) {
  const p = isoWeekParts(iso, plusWeeks);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const range = M[p.mon.getUTCMonth()] + " " + p.mon.getUTCDate() + "–" +
    (p.mon.getUTCMonth() === p.sun.getUTCMonth() ? "" : M[p.sun.getUTCMonth()] + " ") + p.sun.getUTCDate();
  return p.label + " · " + range;
}
// Same calendar day one year earlier (Feb 29 clamps to Feb 28) — used for
// like-for-like "previous FY same period" attrition when filters are active.
function prevYearIso(iso) {
  const y = parseInt(iso.slice(0, 4), 10) - 1;
  const md = iso.slice(4) === "-02-29" ? "-02-28" : iso.slice(4);
  return y + md;
}
function sourceBanner(key, label) {
  const s = STATE.data.meta.sources[key];
  return s === "ok" ? "" :
    '<div class="banner err">⚠️ ' + esc(label) + ' unavailable — ' + esc(s) + '</div>';
}
// Previous FY as a shadow area, current FY as a trend line cut at the current
// fiscal month (uptoIdx). V3: optional dashed forecast extension and a subtle
// peer-band zone (annual voluntary rate mapped to monthly-equivalent counts:
// rate × avgHeadcount ÷ 12 — like-for-like with the monthly series).
function attritionChart(prevSeries, curSeries, labels, uptoIdx, w, h, opts) {
  opts = opts || {};
  const P = 26, n = labels.length;
  const prevV = prevSeries.map(m => m.terms);
  const curV = curSeries.map(m => m.terms);
  const fcV = (opts.forecastMonths || []).map(m => m.terms);
  const maxY = Math.max.apply(null, prevV.concat(curV, fcV, [1]));
  const x = i => P + i * ((w - P - 6) / Math.max(1, n - 1));
  const y = v => h - 18 - v / maxY * (h - 30);
  const area = prevV.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ") +
    " " + x(n - 1).toFixed(1) + "," + y(0).toFixed(1) + " " + x(0).toFixed(1) + "," + y(0).toFixed(1);
  const cut = Math.max(0, Math.min(uptoIdx, n - 1));
  const line = curV.slice(0, cut + 1).map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  let band = "";
  if (opts.bandLo != null && opts.bandHi != null) {
    band = '<rect x="' + P + '" y="' + y(opts.bandHi).toFixed(1) + '" width="' + (w - P - 6) +
      '" height="' + Math.max(1, y(opts.bandLo) - y(opts.bandHi)).toFixed(1) +
      '" fill="var(--cta)" opacity="0.12"/>';
  }
  let fc = "";
  if (opts.forecastMonths && opts.forecastMonths.length && cut < n - 1) {
    const pts = [x(cut).toFixed(1) + "," + y(curV[cut]).toFixed(1)]
      .concat(opts.forecastMonths.filter(m => m.forecast && m.idx < n).map(m =>
        x(m.idx).toFixed(1) + "," + y(m.terms).toFixed(1)));
    fc = '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--accent)" ' +
      'stroke-width="2" stroke-dasharray="5,4" opacity="0.8"/>';
  }
  const ticks = labels.map((L, i) =>
    (n <= 4 || i % 3 === 0 || i === n - 1)
      ? '<text x="' + x(i).toFixed(1) + '" y="' + (h - 4) + '" text-anchor="middle">' + esc(L) + '</text>'
      : "").join("");
  const yTicks = [0, Math.ceil(maxY / 2), maxY].map(v =>
    '<text x="2" y="' + (y(v) + 3).toFixed(1) + '">' + v + '</text>').join("");
  // preserveAspectRatio="xMidYMid meet" rather than "none": non-uniform scaling
  // stretched the drawing horizontally as the container widened, which showed up
  // as uneven forecast dashes and horizontally smeared axis labels on a wide
  // screen. "meet" scales both axes together, so type and dash patterns keep
  // their shape; the chart simply centres in a wider card.
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="xMidYMid meet" style="max-width:100%">' +
    band +
    '<polygon points="' + area + '" fill="var(--chip)" opacity="0.75"/>' +
    '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>' +
    fc + ticks + yTicks + '</svg>';
}
// FY terminations as month BARS — counts are discrete events, so bars, not a
// line (a line interpolates between months where nothing happened). Prior FY
// renders as outlined ghost bars beside the current-FY solid bars; the data
// series is Orbe (--cta), never the warn yellow — status colors stay reserved
// for judgment, not decoration.
function termBarsSvg(prevM, curM, labels, uptoIdx, w, h) {
  const P = 30, n = labels.length;
  const prevV = prevM.map(m => m.terms), curV = curM.map(m => m.terms);
  const maxY = Math.max.apply(null, prevV.concat(curV, [1]));
  const gw = (w - P - 8) / n;
  const bw = Math.max(6, Math.min(24, gw * 0.32));
  const y0 = h - 24;
  const y = v => y0 - v / maxY * (h - 52);
  const parts = [];
  parts.push('<line x1="' + P + '" y1="' + y0 + '" x2="' + (w - 4) + '" y2="' + y0 + '" stroke="var(--border)"/>');
  parts.push('<text x="2" y="' + (y(maxY) + 4).toFixed(1) + '">' + maxY + '</text>');
  parts.push('<text x="2" y="' + (y0 + 4) + '">0</text>');
  for (let i = 0; i < n; i++) {
    const cx = P + i * gw + gw / 2;
    if (prevV[i] > 0) {
      parts.push('<rect x="' + (cx - bw - 1).toFixed(1) + '" y="' + y(prevV[i]).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + (y0 - y(prevV[i])).toFixed(1) +
        '" rx="2" fill="none" stroke="var(--muted)" stroke-width="1.2" opacity="0.7">' +
        '<title>previous FY ' + esc(labels[i]) + ': ' + prevV[i] + '</title></rect>');
    }
    if (i <= uptoIdx) {
      if (curV[i] > 0) {
        parts.push('<rect x="' + (cx + 1).toFixed(1) + '" y="' + y(curV[i]).toFixed(1) +
          '" width="' + bw.toFixed(1) + '" height="' + (y0 - y(curV[i])).toFixed(1) + '" rx="2" fill="var(--cta)"/>');
        parts.push('<text x="' + (cx + 1 + bw / 2).toFixed(1) + '" y="' + (y(curV[i]) - 4).toFixed(1) +
          '" text-anchor="middle" style="fill:var(--text)">' + curV[i] + '</text>');
      } else {
        // Explicit zero tick — "no bar" must read as measured-zero, not missing data.
        parts.push('<rect x="' + (cx + 1).toFixed(1) + '" y="' + (y0 - 2) +
          '" width="' + bw.toFixed(1) + '" height="2" fill="var(--cta)" opacity="0.5"/>');
      }
    }
    parts.push('<text x="' + cx.toFixed(1) + '" y="' + (h - 6) + '" text-anchor="middle">' + esc(labels[i]) + '</text>');
  }
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="xMidYMid meet" style="max-width:100%">' + parts.join("") + '</svg>';
}

// MIRROR of fyAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function fyAttritionFromPeople_(people, fyStartCalYear, asOfIso, label) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const idxOf = iso => (+iso.slice(0, 4) - fyStartCalYear) * 12 + (+iso.slice(5, 7) - 1) - 6;
  const hcOn = iso => people.filter(p =>
    (!p.hireDate || p.hireDate <= iso) && (!p.termDate || p.termDate > iso)).length;
  const monthly = Array.from({ length: 12 }, () => ({ terms: 0, vol: 0, invol: 0 }));
  const terms = people.filter(p => p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso);
  terms.forEach(p => {
    const i = idxOf(p.termDate);
    if (i < 0 || i > 11) return;
    monthly[i].terms++;
    if (p.termCls === "vol") monthly[i].vol++;
    else if (p.termCls === "invol") monthly[i].invol++;
  });
  const quarterly = [0, 1, 2, 3].map(q => {
    const s = monthly.slice(q * 3, q * 3 + 3);
    return { terms: s.reduce((t, x) => t + x.terms, 0),
             vol:   s.reduce((t, x) => t + x.vol, 0),
             invol: s.reduce((t, x) => t + x.invol, 0) };
  });
  const vol = terms.filter(p => p.termCls === "vol").length;
  const invol = terms.filter(p => p.termCls === "invol").length;
  const regretted = terms.filter(p => p.regretted).length;
  const avgHeadcount = (hcOn(fyStartIso) + hcOn(endIso)) / 2;
  return { label, monthly, quarterly, total: terms.length, vol, invol, regretted,
           avgHeadcount, rate: avgHeadcount > 0 ? terms.length / avgHeadcount : null };
}

// MIRROR of sliceAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function sliceAttritionFromPeople_(people, fyStartCalYear, asOfIso, keyFn) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const groups = new Map();
  const get = k => {
    if (!groups.has(k)) groups.set(k, { key: k, terms: 0, vol: 0, invol: 0, hcStart: 0, hcEnd: 0 });
    return groups.get(k);
  };
  people.forEach(p => {
    const g = get(keyFn(p) || "—");
    if ((!p.hireDate || p.hireDate <= fyStartIso) && (!p.termDate || p.termDate > fyStartIso)) g.hcStart++;
    if ((!p.hireDate || p.hireDate <= endIso) && (!p.termDate || p.termDate > endIso)) g.hcEnd++;
    if (p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso) {
      g.terms++;
      if (p.termCls === "vol") g.vol++;
      else if (p.termCls === "invol") g.invol++;
    }
  });
  return [...groups.values()]
    .map(g => {
      const avg = (g.hcStart + g.hcEnd) / 2;
      return { key: g.key, terms: g.terms, vol: g.vol, invol: g.invol,
               headcount: g.hcEnd, rate: avg > 0 ? g.terms / avg : null };
    })
    .filter(g => g.terms > 0 || g.headcount > 0)
    .sort((x, y) => y.terms - x.terms || y.headcount - x.headcount);
}

// MIRROR of levelRank_ in Code.js.
function levelRankC(level) {
  const m = String(level || "").match(/^([IM])(\d+)$/);
  if (!m) return 999;
  return (m[1] === "I" ? 0 : 100) + parseInt(m[2], 10);
}

// ── navigation ──────────────────────────────────────────────
function buildNav() {
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  VIEWS.filter(v => !v.menu && v.roles.includes(USER_ROLE)).forEach(v => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.id = "tab_" + v.id;
    b.onclick = () => switchTab(v.id);
    bar.appendChild(b);
  });
  const menu = document.getElementById("menuPanel");
  menu.innerHTML = "";
  VIEWS.filter(v => v.menu && v.roles.includes(USER_ROLE)).forEach(v => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.onclick = () => { menu.classList.add("hidden"); switchTab(v.id); };
    menu.appendChild(b);
  });
}
function switchTab(id) {
  const v = VIEWS.find(x => x.id === id);
  // Role gate enforced HERE, not just by hiding buttons.
  if (!v || !v.roles.includes(USER_ROLE)) id = "overview";
  STATE.tab = id;
  VIEWS.filter(x => !x.menu).forEach(x => {
    const b = document.getElementById("tab_" + x.id);
    if (b) b.classList.toggle("on", x.id === id);
  });
  closeDrill();
  render();
}
function render() {
  if (!STATE.data) return;
  const pane = document.getElementById("pane");
  (RENDERERS[STATE.tab] || renderOverview)(pane);
  wrapTables(pane);
}

/**
 * Puts every rendered table in its own horizontal scroll box.
 *
 * Done here rather than in the twelve renderers that build table markup: one
 * pass cannot forget a table, and any table added later is covered for free.
 * Without it a wide table (manager hotspots is 6 columns, the termination
 * detail 8) pushes the whole document sideways — the page itself must never
 * scroll horizontally, only the table inside its card.
 *
 * @param {HTMLElement} el Container just re-rendered.
 */
function wrapTables(el) {
  if (!el) return;
  Array.prototype.forEach.call(el.querySelectorAll("table"), function (t) {
    if (t.parentElement && t.parentElement.classList.contains("scroll-x")) return;
    const box = document.createElement("div");
    box.className = "scroll-x";
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
    // Wide tables get a bigger floor so their columns stay readable rather than
    // compressing to nothing before the scrollbar appears.
    if (t.rows[0] && t.rows[0].cells.length >= 7) t.classList.add("wide");
  });
}

// ── data load ───────────────────────────────────────────────
function loadData(force) {
  document.getElementById("loading").classList.remove("hidden");
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onLoadError)
    .getCompReportData(!!force);
}
function onData(raw) {
  // Server returns one JSON STRING (marshalling a large nested object through
  // google.script.run is minutes-slow); parse here. Object tolerated for safety.
  let d = raw;
  if (typeof raw === "string") {
    try { d = JSON.parse(raw); } catch (e) { onLoadError(e); return; }
  }
  if (!d || !d.ok) { onLoadError(new Error((d && d.error) || "Unknown load failure")); return; }
  STATE.data = d;
  if (d.meta && d.meta.schema !== SCHEMA) {
    document.getElementById("pane").insertAdjacentHTML("beforebegin",
      '<div class="banner err">⚠️ <b>Incomplete deployment</b> — ViewDash.html is ' +
      'from a different release than the server (client ' + SCHEMA + ', server ' +
      d.meta.schema + '). Re-paste all nine files and publish a new version.</div>');
  }
  const hidden = (d.meta.restricted && d.meta.restricted.hidden) || 0;
  document.getElementById("subTitle").textContent =
    d.meta.fyLabel + " " + d.meta.qLabel + " · " + d.meta.activeCount + " active Rocketeers · " +
    (d.meta.fromCache ? "cached" : "live") + " · " + USER_ROLE +
    (hidden > 0 ? " · " + hidden + " leadership profile" + (hidden === 1 ? "" : "s") + " not shown" : "");
  document.getElementById("loading").classList.add("hidden");
  populateFilters();
  syncFilterBar();
  render();
}
function onLoadError(err) {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("pane").innerHTML =
    '<div class="banner err">❌ Could not load the report: ' + esc((err && err.message) || err) + '</div>';
}

// ── tab renderers ───────────────────────────────────────────
// 🏠 Overview = facts (2–3 past-tense sentences, no imperatives) + a READ-ONLY
// signals card (Concerns / Notes / Highlights) + KPI cards with target bands +
// FY-vs-FY termination bars + provenance. Facts and signals derive from server
// verdicts (always full-population). There is no actionable queue — the
// Action Queue surface was removed (per-viewer state, no shared ownership).
function ovViewLabel(id) {
  const v = VIEWS.find(x => x.id === id);
  return v ? v.label.replace(/^[^\s]+\s/, "") : id; // strip the emoji prefix
}
// Small-denominator rule: under the floor the COUNT is the primary display and
// the rate is a caption — "2 of 2 regretted", never "100.0% ▲". Trend arrows
// are suppressed too: direction on a two-person base is decoration, not signal.
function smallN(denom, floor) { return denom == null || denom < (floor == null ? 10 : floor); }

function ovFactsHtml(d) {
  const byId = {};
  (d.verdicts || []).forEach(v => { byId[v.id] = v; });
  // Lead with the most defensible number (voluntary vs the peer band), then
  // the FY total with its SAME-PERIOD comparison, then headcount. Hard cap: 3
  // sentences — anything longer is a report, not an overview.
  const picks = ["attr-vol", "attr-total", "headcount"].map(id => byId[id]).filter(Boolean);
  if (!picks.length) return "";
  const caveat = byId["fy-caveat"];
  const sentence = v => '<span class="factlink" onclick="switchTab(\'' + esc(v.view) +
    '\')" title="Open ' + esc(ovViewLabel(v.view)) + '">' + esc(v.fact) + '</span>';
  return '<div class="card"><h2>' + esc(d.meta.fyLabel) + ' so far' +
    (filtersActive() ? ' <span class="sub">(company-wide — filters don&#39;t apply here)</span>' : '') + '</h2>' +
    '<p style="margin:0">' + picks.map(sentence).join(" ") + '</p>' +
    (caveat ? '<div class="sub" style="margin-top:6px">⚠ ' + esc(caveat.fact) + ' ' + esc(caveat.soWhat) + '</div>' : '') +
    ovChangedSinceHtml(d) + '</div>';
}

// "What moved" — the question a returning viewer actually has. Compares the
// full-population headline numbers against the snapshot taken on this
// viewer's last visit in an EARLIER ISO week (localStorage, per browser).
function ovSnapshotVals(d) {
  const cur = d.attrition.currentFY, eq = d.equity, rag = d.meta.ragCfg || {};
  const eqFlags = (eq.genderAvailable ? eq.gender.filter(g => g.flagged).length : 0) +
    eq.outliers.length + eq.tenure.length;
  return {
    "Attrition":         { v: cur.rate, fmt: "pct" },
    "Voluntary rate":    { v: cur.avgHeadcount > 0 ? cur.vol / cur.avgHeadcount : null, fmt: "pct" },
    "Regretted exits":   { v: cur.regretted, fmt: "int" },
    "Below anchor":      { v: d.employees.filter(e => e.ratio != null && e.ratio < (d.meta.compaBands || {}).low).length, fmt: "int" },
    "Equity flags":      { v: eqFlags, fmt: "int" },
    "Reviews overdue":   { v: d.qtaInterim.filter(r => r.daysOverdue != null && r.daysOverdue > 0).length, fmt: "int" },
    "Retention risks":   { v: d.employees.filter(e => e.signals && e.signals.retentionRisk).length, fmt: "int" },
    "Recognition risks": { v: d.employees.filter(e => e.signals && e.signals.recognitionRisk).length, fmt: "int" },
    "Teams needing manager support": { v: (d.managers && d.managers.available)
      ? d.managers.rows.filter(r => r.attritionRate != null && r.attritionRate > (rag.attritionTotal || {}).yellow).length
      : null, fmt: "int" },
  };
}
function ovChangedSinceHtml(d) {
  const cw = isoWeekLabel(d.meta.asOf);
  const vals = ovSnapshotVals(d);
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem("cd_ov_snap") || "null"); } catch (e) { stored = null; }
  let line = "";
  if (stored && stored.week && stored.week !== cw && stored.vals) {
    const fmt = (m, x) => x == null ? "—" : m === "pct" ? (x * 100).toFixed(1) + "%" : String(x);
    const moved = Object.keys(vals).filter(k => {
      const o = stored.vals[k], n = vals[k];
      return o && o.v != null && n.v != null && fmt(n.fmt, o.v) !== fmt(n.fmt, n.v);
    }).map(k => k + " " + fmt(vals[k].fmt, stored.vals[k].v) + " → " + fmt(vals[k].fmt, vals[k].v));
    line = moved.length
      ? "Changed since " + stored.week + ": " + moved.join(" · ")
      : "No headline movement since " + stored.week + ".";
  }
  // Baseline updates only when the week rolls over, so mid-week reloads keep
  // comparing against last week rather than against five minutes ago.
  if (!stored || stored.week !== cw) {
    try { localStorage.setItem("cd_ov_snap", JSON.stringify({ week: cw, vals })); } catch (e) { /* sandbox */ }
  }
  return line ? '<div class="sub" style="margin-top:6px">🗓 ' + esc(line) + '</div>' : "";
}

// Fiscal-quarter close date for a given ISO date, as YYYY-MM-DD (FY starts
// July 1). Used wherever a "before the cycle closes" deadline needs a real
// date rather than a vibe.
function fiscalQuarterEndIso(iso) {
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7);
  const e = m >= 7 && m <= 9 ? [y, "09", 30] : m >= 10 ? [y, "12", 31]
    : m <= 3 ? [y, "03", 31] : [y, "06", 30];
  return e[0] + "-" + e[1] + "-" + e[2];
}

// Read-only signals for the Overview — the original design: server verdicts
// grouped by severity into Concerns (RISK) / Notes (NOTE) / Highlights (FACT).
// No state, no owners — there is no action-queue workflow anywhere.
// Skips the ids the facts card already narrates, so nothing reads twice.
function ovSignalsHtml(d) {
  const skip = { "attr-vol": 1, "attr-total": 1, "headcount": 1, "fy-caveat": 1 };
  const rows = (d.verdicts || []).filter(v => !skip[v.id]);
  if (!rows.length) return "";
  const groups = [["RISK", "⚠️ Concerns"], ["NOTE", "📝 Notes"], ["FACT", "✨ Highlights"]];
  const body = groups.map(g => {
    const vs = rows.filter(v => v.severity === g[0]);
    if (!vs.length) return "";
    return '<h3>' + g[1] + ' <span class="chip">' + vs.length + '</span></h3>' +
      vs.map(v => '<div class="factlink" onclick="switchTab(\'' + esc(v.view) +
        '\')" title="Open ' + esc(ovViewLabel(v.view)) + '">' + verdictHtml(v) + '</div>').join("");
  }).join("");
  return '<div class="card"><h2>🚦 Signals' +
    (filtersActive() ? ' <span class="sub">(company-wide — filters don&#39;t apply here)</span>' : '') +
    '</h2>' + body + '</div>';
}

// Target-band strip for a KPI card: colored zones + a marker at the value.
// segs = [{to, color}] covering lo..hi in order.
function bandBarHtml(segs, val, lo, hi) {
  const pct = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
  let prev = lo, html = '<div class="bandbar">';
  segs.forEach(s => {
    const to = Math.min(s.to, hi);
    html += '<i style="width:' + (pct(to) - pct(prev)).toFixed(1) + '%;background:' + s.color + '"></i>';
    prev = to;
  });
  if (val != null) html += '<span class="mk" style="left:' + pct(val).toFixed(1) + '%"></span>';
  return html + '</div>';
}

function ovProvenanceHtml(d) {
  const m = d.meta, s = m.sources || {};

  const excl = "Population rules: crew/contractors excluded everywhere · part-time & interns stay in " +
    "headcount/attrition but are excluded from peer anchors, equity lenses and market reads · " +

    esc(String(m.generatedAt).replace("T", " ").slice(0, 16)) + ' UTC · ' +
    (m.fromCache ? 'cached — ⟳ Refresh for a live read' : 'live') +
    ' · Sources: Roster ' + src("roster") + ' · Comp history ' + src("history") +
    ' · Ratings ' + src("ratings") + ' · Benchmarks ' + src("benchmarks") +

function renderOverview(el) {
  const d = STATE.data, act = filtersActive();
  const emps = d.employees.filter(visibleEmp);
  const people = act ? d.people.filter(visibleEmp) : d.people;
  const cur = act
    ? fyAttritionFromPeople_(people, d.meta.fyStartCalYear, d.meta.asOf, d.meta.fyLabel)
    : d.attrition.currentFY;
  const prev = act
    ? fyAttritionFromPeople_(people, d.meta.fyStartCalYear - 1, null, d.meta.prevFyLabel)
    : d.attrition.previousFY;
  // SAME PERIOD last FY — never partial-year vs full-year in one breath.
  const prevSp = act
    ? fyAttritionFromPeople_(people, d.meta.fyStartCalYear - 1, prevYearIso(d.meta.asOf),
        d.meta.prevFyLabel + " same period")
    : d.attrition.previousFYSamePeriod;
  const eq = d.equity;
  const f = STATE.filters;
  const rag = d.meta.ragCfg || {};
  const empIndex = {};
  d.employees.forEach(e => { empIndex[e.empNo] = e; });
  const flagVisible = r => { const e = empIndex[r.empNo]; return e ? visibleEmp(e) : false; };

  const medRatio = median(emps.filter(e => e.ratio != null).map(e => e.ratio));
  const mkt = emps.filter(e => e.marketRatio != null).map(e => e.marketRatio);

          " cycle open (goals, PTO compliance, tracked coverage, RCR, kudos)."
        : 'Quarterly evidence frozen by exportContributionSnapshot() in the PS project — runs at QTA cycle open; pending until the first export.' },
  ];

  const formulas = [
    ["⚖️ Internal Position", 'TCC ÷ anchor, ACTIVE peers, local currency. Anchor tiers: (1) median of Key Location + Job Title peers when the group has ≥ ' + q.smallGroupMin + ' members; (2) the external <b>market mean</b> for that Location + Job Title (N-of-1 rule — external parity replaces internal equity for unique roles); (3) median of the Key Location + Level cohort (≥ ' + q.smallGroupMin + '); else "insufficient peers". Anchors always derive from the FULL active population — the universal filters never recompute them. Bands: red &lt; ' + b.low.toFixed(2) + ', yellow &lt; ' + b.target.toFixed(2) + ', green ≤ ' + b.high.toFixed(2) + ', violet above (ceiling watch).'],
    ["🎯 Priority Score", 'Weighted 0–100: performance (avg rating ÷ ' + p.ratingMax + ' over the last ' + (sc.perfWindowQuarters || 4) + ' completed quarters) × ' + p.weights.perf + '% + tenure (50/50 company capped ' + p.caps.companyYears + 'y / in-role capped ' + p.caps.profileYears + 'y) × ' + p.weights.tenure + '% + compa gap (below-anchor %, full credit at ' + Math.round(p.caps.gapPct * 100) + '%) × ' + p.weights.compaGap + '%. Missing components redistribute their weight (° = partial). Shown on the 🎯 Priority Ranking tab, which carries a full component legend. Mastery banding is a planned future component.'],
    ["🌍 vs Market", 'TCC ÷ benchmark <b>Mean</b> (a mean, not P50) for the same Location + Job Title, local currency only — currency-mismatched rows are skipped and counted. Below ' + (m.marketLow || 0.9).toFixed(2) + ' renders red (priority read). Coverage: ' + cov.matchedEmployees + ' matched / ' + cov.rows + ' rows' + (cov.currencyMismatch ? ' / ' + cov.currencyMismatch + ' currency mismatches' : '') + '.'],
    ["🕰 Tenure & growth", 'Company = years since Hire Date. In-role = years since the latest promotion, title-change, or internal-transfer comp event (falls back to Hire Date) — an Internal Transfer changes responsibilities even when pay doesn&#39;t move, so it resets the in-role clock. TTM growth = TCC now ÷ TCC in effect 12 months ago − 1 (null when history is younger). TCC AGR is the system-generated rate recorded in the RD tab ("TAG" field), shown as recorded. Annualized = (current ÷ previous)^(1 ÷ years) − 1 (RRI) between consecutive comp events; the first event (usually New Hire) is the baseline and gets no rate.'],
    ["📉 Attrition rate", 'FY terminations ÷ mean(headcount at FY start, headcount at FY end — or today for the running FY). Voluntary/involuntary from Termination Category. Fiscal year starts July 1.'],
    ["🧭 Pay Equity lenses", 'Within Key Location + level groups: gender median gap ≥ ' + q.gapPct + '% flags the group (needs ≥2 members per gender); individuals ≥ ' + q.outlierPct + '% below group median flag as outliers; ≥ ' + q.tenureYearsMin + 'y tenure AND ≥ ' + q.tenureBelowPct + '% below median flags the tenure lens.'],
    ["📋 QTA interim", 'Latest "Next Review" per Rocketeer from RD events, sorted overdue-first.'],
    ["🚨 Risk Signals", 'Performance evidence window = last ' + (sc.perfWindowQuarters || 4) + ' completed fiscal quarters (' + esc((sc.windowFqs || []).join(", ")) + '). Promotion staleness ≥ ' + (sc.promoStaleYears || 3) + ' years in role (early-career lens ' + esc(sc.earlyCareerLevels || "I1–I3") + '). Recognition risk = latest completed-quarter rating ≥ ' + (sc.recogMinRating || 4.5) + ' with TTM TCC growth under ' + Math.round((sc.recogMaxTtm || 0.05) * 100) + '%. Retention cohort = levels ' + esc(sc.coreLevels || "I3–I4") + ' stacking ≥ ' + (sc.riskFactorMin || 2) + ' factors. Invisible contributor = contribution evidence score ≥ ' + (sc.invisibleMinScore || 0.75) + ' with windowed SI below ' + (sc.invisibleWeakSi || 4) + ' or unrated. Overridable via CD_SIGNALS_CFG. These flags surface people for a human conversation — they never re-score anyone.'],

    (emp.ttmGrowthPct != null ? '<span class="chip">TTM growth ' + pctFmt(emp.ttmGrowthPct) + '</span>' : '');

    if (s.recognitionRisk) body += '<span class="chip yellow">⭐ recognition risk</span>';

    if (s.earlyCareer) body += '<span class="chip">🌱 early career</span>';
    if (s.invisibleContributor) body += '<span class="chip yellow" title="Strong contribution evidence, weak/absent rating — verify with the manager">👻 possible invisible contributor</span>';

      '<div class="sub" style="margin-top:4px">avg ' + (emp.perfAvg != null ? emp.perfAvg.toFixed(2) : "—") +
      ' over ' + emp.perfCount + ' windowed quarter(s) · ' + (emp.perfTotalCount || emp.perfCount) + ' total on record</div>';
  }
  box.innerHTML = body;
  // The drill panel renders outside render(), so it needs the same pass — its
  // comp-history table is 6 columns inside a 560px drawer.
  wrapTables(box);
  box.classList.remove("hidden");
}

// Waterfall: first bar is the grey baseline; each later bar spans prev TCC → new TCC
// (green up, red down). Y-axis starts at 90% of the minimum so deltas stay readable.
function waterfallSvg(events, w, h) {
  const evs = events.filter(e => e.tcc != null);
  if (!evs.length) return "";
  const minV = Math.min.apply(null, evs.map(e => e.tcc));
  const maxV = Math.max.apply(null, evs.map(e => e.tcc));
  const lo = minV * 0.9, span = Math.max(1, maxV - lo);
  const bw = Math.max(18, Math.min(64, (w - 30) / evs.length - 8));
  const y = v => 12 + (h - 40) * (1 - (v - lo) / span);
  let sx = 10;
  const parts = [];
  evs.forEach((e, i) => {
    const top = y(e.tcc);
    const base = y(i === 0 ? lo : evs[i - 1].tcc);
    const fill = i === 0 ? "var(--chip)" : (e.tcc >= evs[i - 1].tcc ? "var(--accent)" : "var(--bad)");
    parts.push('<rect x="' + sx + '" y="' + Math.min(top, base).toFixed(1) + '" width="' + bw +
      '" height="' + Math.max(2, Math.abs(base - top)).toFixed(1) + '" rx="3" fill="' + fill + '"/>');
    parts.push('<text x="' + (sx + bw / 2).toFixed(1) + '" y="' + (h - 6) +
      '" text-anchor="middle">' + esc(e.date.slice(0, 7)) + '</text>');
    sx += bw + 8;
  });
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + Math.max(w, sx) + " " + h +
    '" preserveAspectRatio="xMinYMid meet">' + parts.join("") + '</svg>';
}

// ── wiring ──────────────────────────────────────────────────
// Theme: dark is the default; "light" re-binds the same semantic variables so
// no renderer knows which theme is active. Persisted per browser. SVGs inherit
// because every chart color is a var(--…) reference, never a literal.
function applyTheme(t) {
  if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  const b = document.getElementById("themeBtn");
  b.textContent = t === "light" ? "🌙" : "☀️";
  b.title = t === "light" ? "Switch to dark theme" : "Switch to light theme";
  try { localStorage.setItem("cd_theme", t); } catch (e) { /* sandboxed iframe — theme just won't persist */ }
}
document.getElementById("themeBtn").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
(function () {
  let saved = "dark";
  try { saved = localStorage.getItem("cd_theme") || "dark"; } catch (e) { /* default dark */ }
  applyTheme(saved);
})();

// Charts are drawn to a MEASURED width, so a resized window (or a laptop
// docked to an ultrawide) has to redraw them or they keep the old scale. Only
// width matters, and it is debounced — a drag would otherwise re-render on
// every animation frame. Height-only changes (the mobile URL bar) are ignored.
let RESIZE_T = null, LAST_W = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === LAST_W) return;
  LAST_W = window.innerWidth;
  clearTimeout(RESIZE_T);
  RESIZE_T = setTimeout(render, 180);
});
