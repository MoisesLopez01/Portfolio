<script>
"use strict";
const USER_ROLE  = "<?= userRole ?>";
const USER_EMAIL = "<?= userEmail ?>";
// Bump in lockstep with BUILD_.code in Code.js. A mismatch means the server and
// this file came from different pastes — the numbers on screen may be stale.
const SCHEMA = 49;

// Single source of truth for navigation — same pattern as PS Dashboard.
// Order is the spec's narrative order (Executive Pulse → Compensation
// Position → Workforce & Attrition); QTA, Data Reference and Access Control
// live in the ☰ menu (`menu: true`). Managers folded INTO Attrition
// (2026.W31): the full manager list outgrew its own tab — only outlier teams
// render there now (see mgrHotspotsHtml).
const VIEWS = [
  { id: "overview",  icon: "i-overview",  label: "Executive Brief",       roles: ["admin", "viewer"] },
  { id: "compa",     icon: "i-compa",     label: "Compensation Position", roles: ["admin", "viewer"] },
  { id: "attrition", icon: "i-attrition", label: "Retention Analytics",   roles: ["admin", "viewer"] },
  { id: "people",    icon: "i-people",    label: "People Signals",        roles: ["admin", "viewer"] },
  { id: "qta",       icon: "i-qta",       label: "QTA Status",            roles: ["admin", "viewer"], menu: true },
  { id: "reference", icon: "i-reference", label: "Data Reference",        roles: ["admin", "viewer"], menu: true },
  { id: "access",    icon: "i-access",    label: "Access Control",        roles: ["admin"],           menu: true },
];

const STATE = {
  data: null, tab: "overview", currency: "LOCAL",
  attrGran: "month", attrDim: "department",
  filters: { loc: "", level: "", dept: "", q: "" },
};

// ── helpers ─────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// ── universal filters ───────────────────────────────────────────────────────────
function normName(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function filtersActive() {
  const f = STATE.filters;
  return !!(f.loc || f.level || f.dept || f.q);
}
// One predicate for employees[], people[], and any row carrying these fields.
function visibleEmp(e) {
  const f = STATE.filters;
  return (!f.loc || e.keyLocation === f.loc) &&
         (!f.level || e.level === f.level) &&
         (!f.dept || e.dept === f.dept) &&
         (!f.q || normName(e.name).indexOf(normName(f.q)) !== -1);
}
function setFilter(k, v) {
  STATE.filters[k] = v;
  syncFilterBar();
  render();
}
function clearFilters() {
  STATE.filters = { loc: "", level: "", dept: "", q: "" };
  populateFilters();
  syncFilterBar();
  render();
}
function syncFilterBar() {
  document.getElementById("fClear").classList.toggle("hidden", !filtersActive());
  document.getElementById("fNote").textContent = filtersActive()
    ? STATE.data.employees.filter(visibleEmp).length + " Rocketeers match" : "";
}
function populateFilters() {
  const d = STATE.data;
  if (!d) return;
  const f = STATE.filters;
  const opt = (id, label, vals, cur) => {
    document.getElementById(id).innerHTML =
      '<option value="">' + label + ': All</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") +
        '>' + esc(v) + '</option>').join("");
  };
  opt("fLoc", "Location", [...new Set(d.employees.map(e => e.keyLocation))].filter(Boolean).sort(), f.loc);
  opt("fLevel", "Level", [...new Set(d.employees.map(e => e.level))].sort(), f.level);
  opt("fDept", "Department", [...new Set(d.employees.map(e => e.dept))].filter(Boolean).sort(), f.dept);
  document.getElementById("fQ").value = f.q;
}
function fmtMoney(tcc, tccUsd, currency) {
  if (STATE.currency === "USD") return tccUsd != null ? "$" + Math.round(tccUsd).toLocaleString() : "—";
  return tcc != null ? Math.round(tcc).toLocaleString() + (currency ? " " + currency : "") : "—";
}
function pctFmt(x, dp) { return x == null ? "—" : (x * 100).toFixed(dp == null ? 1 : dp) + "%"; }
function ratioClass(r) {
  // Bands come from CONFIG_CD via meta.compaBands — never hardcode them here.
  const b = (STATE.data && STATE.data.meta.compaBands) || { low: 0.8, target: 0.95, high: 1.1 };
  return r == null ? "" : r < b.low ? "red" : r < b.target ? "yellow" : r <= b.high ? "green" : "violet";
}
// MIRROR of ragBand_ in Code.js (3-line band classifier) — keep in sync.
function ragBandC(value, bands) {
  if (value == null || !bands) return null;
  return value <= bands.green ? "green" : value <= bands.yellow ? "yellow" : "red";
}
// Colored status glyph + value. band null → plain value. The glyph SHAPE
// changes with the band (✓/!/✕), so the read survives colorblindness and
// grayscale printing — status is never encoded by color alone.
function ragDot(band, text) {
  const col = band === "green" ? "var(--accent)" : band === "yellow" ? "var(--warn)" :
              band === "red" ? "var(--bad)" : "var(--muted)";
  const glyph = band === "green" ? "✓" : band === "yellow" ? "!" : band === "red" ? "✕" : "•";
  return '<span style="color:' + col + ';font-weight:700">' + glyph + '</span> ' + text;
}
// One verdict line: severity → fact → so-what → action → caveat.
function verdictHtml(v) {
  const col = v.severity === "RISK" ? "var(--bad)" : v.severity === "NOTE" ? "var(--warn)" : "var(--accent)";
  return '<div style="border-left:3px solid ' + col + ';padding:5px 10px;margin:0 0 8px">' +
    '<b style="color:' + col + '">' + esc(v.severity) + '</b> — ' + esc(v.fact) +
    (v.soWhat ? ' <i class="sub">' + esc(v.soWhat) + '</i>' : '') +
    (v.action ? ' <b>→ ' + esc(v.action) + '</b>' : '') +
    (v.caveat ? ' <span class="sub">⚠ ' + esc(v.caveat) + '</span>' : '') + '</div>';
}
/**
 * The drawing width a chart should use: the pane's real inner width, less card
 * padding. Measured rather than assumed, so one viewBox unit is one screen pixel
 * and nothing stretches — the same reason the chart sets "meet" instead of
 * "none". Falls back to the old fixed 720 before the pane exists.
 *
 * @param {number=} fallback
 * @returns {number}
 */
function chartWidth(fallback) {
  const pane = document.getElementById("pane");
  const w = pane ? pane.clientWidth : 0;
  if (!w) return fallback || 720;
  // 34px = the card's own horizontal padding plus its borders.
  return Math.max(560, Math.min(2000, Math.round(w - 34)));
}
function median(nums) {
  const a = nums.slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
// ── ISO weeks (org standard: "2026.W32", always paired with calendar dates) ──
function isoWeekParts(iso, plusWeeks) {
  const d = new Date(iso + "T00:00:00Z");
  if (plusWeeks) d.setUTCDate(d.getUTCDate() + plusWeeks * 7);
  const t = new Date(d);
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3); // ISO Thursday
  const jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((t - jan4) / 864e5 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  const mon = new Date(d);
  mon.setUTCDate(mon.getUTCDate() - ((mon.getUTCDay() + 6) % 7));
  const sun = new Date(mon);
  sun.setUTCDate(sun.getUTCDate() + 6);
  return { label: t.getUTCFullYear() + ".W" + (week < 10 ? "0" + week : week), mon, sun };
}
function isoWeekLabel(iso, plusWeeks) { return isoWeekParts(iso, plusWeeks).label; }
// "2026.W32 · Aug 3–9" — a week number is never shown without its dates.
function isoWeekFull(iso, plusWeeks) {
  const p = isoWeekParts(iso, plusWeeks);
  const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const range = M[p.mon.getUTCMonth()] + " " + p.mon.getUTCDate() + "–" +
    (p.mon.getUTCMonth() === p.sun.getUTCMonth() ? "" : M[p.sun.getUTCMonth()] + " ") + p.sun.getUTCDate();
  return p.label + " · " + range;
}
function sourceBanner(key, label) {
  const s = STATE.data.meta.sources[key];
  return s === "ok" ? "" :
    '<div class="banner err">⚠️ ' + esc(label) + ' unavailable — ' + esc(s) + '</div>';
}
// MIRROR of fyAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function fyAttritionFromPeople_(people, fyStartCalYear, asOfIso, label) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const idxOf = iso => (+iso.slice(0, 4) - fyStartCalYear) * 12 + (+iso.slice(5, 7) - 1) - 6;
  const hcOn = iso => people.filter(p =>
    (!p.hireDate || p.hireDate <= iso) && (!p.termDate || p.termDate > iso)).length;
  const monthly = Array.from({ length: 12 }, () => ({ terms: 0, vol: 0, invol: 0 }));
  const terms = people.filter(p => p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso);
  terms.forEach(p => {
    const i = idxOf(p.termDate);
    if (i < 0 || i > 11) return;
    monthly[i].terms++;
    if (p.termCls === "vol") monthly[i].vol++;
    else if (p.termCls === "invol") monthly[i].invol++;
  });
  const quarterly = [0, 1, 2, 3].map(q => {
    const s = monthly.slice(q * 3, q * 3 + 3);
    return { terms: s.reduce((t, x) => t + x.terms, 0),
             vol:   s.reduce((t, x) => t + x.vol, 0),
             invol: s.reduce((t, x) => t + x.invol, 0) };
  });
  const vol = terms.filter(p => p.termCls === "vol").length;
  const invol = terms.filter(p => p.termCls === "invol").length;
  const regretted = terms.filter(p => p.regretted).length;
  const avgHeadcount = (hcOn(fyStartIso) + hcOn(endIso)) / 2;
  return { label, monthly, quarterly, total: terms.length, vol, invol, regretted,
           avgHeadcount, rate: avgHeadcount > 0 ? terms.length / avgHeadcount : null };
}

// MIRROR of sliceAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function sliceAttritionFromPeople_(people, fyStartCalYear, asOfIso, keyFn) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const groups = new Map();
  const get = k => {
    if (!groups.has(k)) groups.set(k, { key: k, terms: 0, vol: 0, invol: 0, hcStart: 0, hcEnd: 0 });
    return groups.get(k);
  };
  people.forEach(p => {
    const g = get(keyFn(p) || "—");
    if ((!p.hireDate || p.hireDate <= fyStartIso) && (!p.termDate || p.termDate > fyStartIso)) g.hcStart++;
    if ((!p.hireDate || p.hireDate <= endIso) && (!p.termDate || p.termDate > endIso)) g.hcEnd++;
    if (p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso) {
      g.terms++;
      if (p.termCls === "vol") g.vol++;
      else if (p.termCls === "invol") g.invol++;
    }
  });
  return [...groups.values()]
    .map(g => {
      const avg = (g.hcStart + g.hcEnd) / 2;
      return { key: g.key, terms: g.terms, vol: g.vol, invol: g.invol,
               headcount: g.hcEnd, rate: avg > 0 ? g.terms / avg : null };
    })
    .filter(g => g.terms > 0 || g.headcount > 0)
    .sort((x, y) => y.terms - x.terms || y.headcount - x.headcount);
}

// ── navigation ──────────────────────────────────────────────
function buildNav() {
  const bar = document.getElementById("tabbar");
  bar.innerHTML = "";
  VIEWS.filter(v => !v.menu && v.roles.includes(USER_ROLE)).forEach(v => {
    const b = document.createElement("button");
    b.innerHTML = '<svg class="tico"><use href="#' + v.icon + '"></use></svg>' + esc(v.label);
    b.id = "tab_" + v.id;
    b.onclick = () => switchTab(v.id);
    bar.appendChild(b);
  });
  const menu = document.getElementById("menuPanel");
  menu.innerHTML = "";
  VIEWS.filter(v => v.menu && v.roles.includes(USER_ROLE)).forEach(v => {
    const b = document.createElement("button");
    b.innerHTML = '<svg class="tico"><use href="#' + v.icon + '"></use></svg>' + esc(v.label);
    b.onclick = () => { menu.classList.add("hidden"); switchTab(v.id); };
    menu.appendChild(b);
  });
}
function switchTab(id) {
  const v = VIEWS.find(x => x.id === id);
  // Role gate enforced HERE, not just by hiding buttons.
  if (!v || !v.roles.includes(USER_ROLE)) id = "overview";
  STATE.tab = id;
  VIEWS.filter(x => !x.menu).forEach(x => {
    const b = document.getElementById("tab_" + x.id);
    if (b) b.classList.toggle("on", x.id === id);
  });
  closeDrill();
  render();
}
function render() {
  if (!STATE.data) return;
  const pane = document.getElementById("pane");
  (RENDERERS[STATE.tab] || renderOverview)(pane);
  wrapTables(pane);
}

/**
 * Puts every rendered table in its own horizontal scroll box.
 *
 * Done here rather than in the twelve renderers that build table markup: one
 * pass cannot forget a table, and any table added later is covered for free.
 * Without it a wide table (manager hotspots is 6 columns, the termination
 * detail 8) pushes the whole document sideways — the page itself must never
 * scroll horizontally, only the table inside its card.
 *
 * @param {HTMLElement} el Container just re-rendered.
 */
function wrapTables(el) {
  if (!el) return;
  Array.prototype.forEach.call(el.querySelectorAll("table"), function (t) {
    if (t.parentElement && t.parentElement.classList.contains("scroll-x")) return;
    const box = document.createElement("div");
    box.className = "scroll-x";
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
    // Wide tables get a bigger floor so their columns stay readable rather than
    // compressing to nothing before the scrollbar appears.
    if (t.rows[0] && t.rows[0].cells.length >= 7) t.classList.add("wide");
  });
}

// ── data load ───────────────────────────────────────────────
function loadData(force) {
  document.getElementById("loading").classList.remove("hidden");
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onLoadError)
    .getCompReportData(!!force);
}
function onData(raw) {
  // Server returns one JSON STRING (marshalling a large nested object through
  // google.script.run is minutes-slow); parse here. Object tolerated for safety.
  let d = raw;
  if (typeof raw === "string") {
    try { d = JSON.parse(raw); } catch (e) { onLoadError(e); return; }
  }
  if (!d || !d.ok) { onLoadError(new Error((d && d.error) || "Unknown load failure")); return; }
  STATE.data = d;
  // Fixed id + existence check: #pane is only re-innerHTML'd by render(), so a
  // banner inserted beforebegin sits outside it and survives every re-render —
  // without the guard, each ⟳ Refresh while skewed would stack another copy.
  if (d.meta && d.meta.schema !== SCHEMA && !document.getElementById("schemaBanner")) {
    document.getElementById("pane").insertAdjacentHTML("beforebegin",
      '<div id="schemaBanner" class="banner err">⚠️ <b>Incomplete deployment</b> — ViewDash.html is ' +
      'from a different release than the server (client ' + SCHEMA + ', server ' +
      d.meta.schema + '). Re-push via clasp (hand-paste still possible) and publish a new version.</div>');
  }
  const hidden = (d.meta.restricted && d.meta.restricted.hidden) || 0;
  document.getElementById("subTitle").textContent =
    d.meta.fyLabel + " " + d.meta.qLabel + " · " + d.meta.activeCount + " active Rocketeers · " +
    (d.meta.fromCache ? "cached" : "live") + " · " + USER_ROLE +
    (hidden > 0 ? " · " + hidden + " leadership profile" + (hidden === 1 ? "" : "s") + " not shown" : "");
  const fc = document.getElementById("freshChip");
  fc.innerHTML = 'As of <b>' + esc(isoWeekLabel(d.meta.asOf)) + '</b> · ' +
                 (d.meta.fromCache ? 'cached' : 'live');
  fc.hidden = false;
  document.getElementById("loading").classList.add("hidden");
  populateFilters();
  syncFilterBar();
  render();
}
function onLoadError(err) {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("pane").innerHTML =
    '<div class="banner err">❌ Could not load the report: ' + esc((err && err.message) || err) + '</div>';
}

// ── tab renderers ───────────────────────────────────────────
// 🏠 Overview = facts (2–3 past-tense sentences, no imperatives) + a READ-ONLY
// signals card (Concerns / Notes / Highlights) + KPI cards with target bands +
// FY-vs-FY termination bars + provenance. Facts and signals derive from server
// verdicts (always full-population). There is no actionable queue — the
// Action Queue surface was removed (per-viewer state, no shared ownership).
function ovViewLabel(id) {
  const v = VIEWS.find(x => x.id === id);
  return v ? v.label : id; // labels carry no emoji prefix since Task 11 (SVG tab icons)
}
// Fiscal-quarter close date for a given ISO date, as YYYY-MM-DD (FY starts
// July 1). Used wherever a "before the cycle closes" deadline needs a real
// date rather than a vibe.
function fiscalQuarterEndIso(iso) {
  const y = +iso.slice(0, 4), m = +iso.slice(5, 7);
  const e = m >= 7 && m <= 9 ? [y, "09", 30] : m >= 10 ? [y, "12", 31]
    : m <= 3 ? [y, "03", 31] : [y, "06", 30];
  return e[0] + "-" + e[1] + "-" + e[2];
}

// Target-band strip for a KPI card: colored zones + a marker at the value.
// segs = [{to, color}] covering lo..hi in order.
function bandBarHtml(segs, val, lo, hi) {
  const pct = x => Math.max(0, Math.min(100, (x - lo) / (hi - lo) * 100));
  let prev = lo, html = '<div class="bandbar">';
  segs.forEach(s => {
    const to = Math.min(s.to, hi);
    html += '<i style="width:' + (pct(to) - pct(prev)).toFixed(1) + '%;background:' + s.color + '"></i>';
    prev = to;
  });
  if (val != null) html += '<span class="mk" style="left:' + pct(val).toFixed(1) + '%"></span>';
  return html + '</div>';
}

function setAttrGran(g) { STATE.attrGran = g; render(); }
// 👤 Manager hotspots — lives INSIDE Attrition (2026.W31): the full manager
// list outgrew its own tab, and the decision question is "which teams are the
// outliers", not "what is every manager's rate". Only teams above the yellow
// attrition line render (same rule as the mgr-hotspots verdict); the healthy
// majority is a COUNT, never a list — no silent truncation, no scoreboard.
// Rows stay read-only on purpose: employees[] doesn't carry supervisor, so a
// row click can't scope the other views to a team (roadmap backlog item).
// Department filter and name search apply; Location/Level don't — a manager's
// team spans both, so a sub-note says so when those filters are active.
function mgrHotspotsHtml(d) {
  const m = d.managers;
  const head = '<div class="card"><h2>👤 Manager hotspots';
  if (!m || !m.available) {
    return head + '</h2><p class="sub">Manager data unavailable — the roster extract has no Supervisor values. This section activates automatically when the column lands.</p></div>';
  }
  const rag = d.meta.ragCfg || {};
  const yellow = (rag.attritionTotal || {}).yellow;
  const isHot = r => r && r.attritionRate != null && yellow != null && r.attritionRate > yellow;
  const f = STATE.filters;
  const hotAll = m.rows.filter(isHot);
  const hot = hotAll.filter(r =>
    (!f.dept || r.dept === f.dept) &&
    (!f.q || normName(r.name).indexOf(normName(f.q)) !== -1));
  const pooledHot = isHot(m.pooledSmallTeams) ? m.pooledSmallTeams : null;
  const within = m.rows.length - hotAll.length;
  const span = m.spanOfControl;
  const ignored = (f.loc || f.level)
    ? '<div class="sub" style="margin-bottom:8px">Location/Level filters don&#39;t apply to manager rows (teams span both).</div>' : '';
  const tr = (r, pooled) =>
    '<tr><td>' + esc(r.name) +
    (pooled ? ' <span class="sub">(' + r.pooledManagers + ' managers pooled — sample-size rule)</span>' : '') + '</td>' +
    '<td>' + r.teamSize + '</td><td>' + r.exitsFY + '</td><td>' + r.voluntaryExits + '</td>' +
    '<td>' + ragDot(ragBandC(r.attritionRate, rag.attritionTotal), pctFmt(r.attritionRate)) +
    (r.teamSize < (rag.floorHeads || 10) ? ' <span class="chip yellow" title="Small team — rate is noisy">⚠</span>' : '') +
    '</td><td>' + esc(r.dept) + '</td></tr>';
  return head + ' <span class="chip ' + (hotAll.length ? 'red' : 'green') + '">' + hotAll.length + '</span>' +
    ' <span class="sub">(' + esc(d.meta.fyLabel) + ' · teams above ' + pctFmt(yellow, 0) +
    ' attrition · managers with ' + (rag.mgrMinReports || 3) + '+ reports · worst first)</span></h2>' +
    ignored +
    (hot.length || pooledHot
      ? '<table><tr><th>Manager</th><th>Team size</th><th>FY exits</th><th>Voluntary</th><th>Team attrition</th><th>Department</th></tr>' +
        hot.map(r => tr(r, false)).join("") +
        (pooledHot ? tr(pooledHot, true) : "") + '</table>'
      : '<p class="sub">' + (hotAll.length
          ? 'No hotspot teams match the current filters (' + hotAll.length + ' company-wide).'
          : '✓ No team sits above the at-risk line at current thresholds.') + '</p>') +
    '<div class="sub" style="margin-top:8px">' + within + ' team' + (within === 1 ? '' : 's') +
    ' within threshold not listed — this section surfaces outliers for a support conversation, not a league table.' +
    (span ? ' · Span of control: <b>1:' + span.ratio + '</b> (' + span.managers + ' managers · ' +
      span.ics + ' ICs) vs 1:' + span.target + ' target.' : '') + '</div></div>';
}

// ── employee drill panel — shared by the Compensation Position table and QTA Status ──
function openDrill(empNo) {
  const d = STATE.data;
  const emp = d.employees.find(e => e.empNo === empNo);
  const g = d.history[empNo];
  const box = document.getElementById("drill");
  if (!emp) {
    box.innerHTML = '<button onclick="closeDrill()" style="float:right">✕ Close</button><p class="sub">Employee not found in the active payload.</p>';
    box.classList.remove("hidden");
    return;
  }
  const marketLow = d.meta.marketLow || 0.9;
  let body =
    '<button onclick="closeDrill()" style="float:right">✕ Close</button>' +
    '<h2>' + esc(emp.name) + '</h2>' +
    '<div class="sub">' + esc(emp.jobTitle) + ' · ' + esc(emp.keyLocation) + ' · ' + esc(emp.dept) + '</div>' +
    '<div style="margin:10px 0">' +
    (emp.employmentType && emp.employmentType !== "regular"
      ? '<span class="chip" title="Excluded from peer anchors, equity lenses and market reads — not comparable to full-time peers">' +
        esc(emp.employmentType) + '</span>' : '') +
    '<span class="chip">TCC ' + fmtMoney(emp.tcc, emp.tccUsd, emp.currency) + '</span>' +
    (emp.ratio != null
      ? '<span class="chip ' + ratioClass(emp.ratio) + '" title="anchor: ' + esc(TIER_LABEL[emp.anchorTier] || "") + '">position ' + emp.ratio.toFixed(2) + '</span>' : '') +
    (emp.marketRatio != null
      ? '<span class="chip ' + (emp.marketRatio < marketLow ? "red" : "green") + '" title="' + esc(emp.benchSource || "benchmark") + '">vs market ' + emp.marketRatio.toFixed(2) + '</span>' : '') +
    (emp.tenureCompanyYears != null
      ? '<span class="chip">tenure ' + emp.tenureCompanyYears + 'y company / ' + (emp.tenureProfileYears != null ? emp.tenureProfileYears + 'y in role' : "—") + '</span>' : '') +
    (emp.ttmGrowthPct != null ? '<span class="chip">TTM growth ' + pctFmt(emp.ttmGrowthPct) + '</span>' : '');
  if (emp.priority && emp.priority.score != null) {
    const c = emp.priority.components;
    body += '<span class="chip yellow" title="perf ' + (c.perf != null ? (c.perf * 100).toFixed(0) + '%' : '—') +
      ' · tenure ' + (c.tenure != null ? (c.tenure * 100).toFixed(0) + '%' : '—') +
      ' · gap ' + (c.compaGap != null ? (c.compaGap * 100).toFixed(0) + '%' : '—') +
      (emp.priority.partial ? ' · partial (missing: ' + emp.priority.missing.join(", ") + ')' : '') +
      '">priority ' + emp.priority.score + (emp.priority.partial ? '°' : '') + '</span>';
  }
  if (emp.signals) {
    const s = emp.signals;
    if (s.retentionRisk) body += '<span class="chip red" title="' + esc(s.riskFactors.join(" · ")) + '">🔥 retention risk (' + s.riskFactors.length + ' factors)</span>';
    if (s.recognitionRisk) body += '<span class="chip yellow">⭐ recognition risk</span>';
    if (s.promoStale) body += '<span class="chip yellow">🪜 ' +
      (s.everPromoted ? 'no promotion in ' + (emp.tenureProfileYears != null ? emp.tenureProfileYears + 'y' : '3y+') : 'never promoted') + '</span>';
    if (s.earlyCareer) body += '<span class="chip">🌱 early career</span>';
    if (s.invisibleContributor) body += '<span class="chip yellow" title="Strong contribution evidence, weak/absent rating — verify with the manager">👻 possible invisible contributor</span>';
  }
  // P2: remote-pull person signal — the market that can poach governs.
  if (emp.p2 && emp.p2.remote && emp.p2.remote.signal !== "pending" && emp.p2.remote.signal !== "not-comparable") {
    const r = emp.p2.remote;
    body += ' ' + sigChipHtml(r.signal);
    if (r.remotePullRatio != null) {
      body += '<span class="chip ' + (r.remotePullRatio < ((p2cfg("remote").stableMin) || 0.85) ? "red" : "green") +
        '" title="TCC USD ÷ remote-pull benchmark mean — the market that recruits this role remotely">vs remote-pull ' +
        r.remotePullRatio.toFixed(2) + '</span>';
    } else if (r.benchScope === "local-only") {
      body += '<span class="chip" title="No remote benchmark row for this role × country yet — the signal reads the local market">local-only bench</span>';
    }
  }
  body += '</div>';
  if (emp.contrib) {
    const c = emp.contrib;
    body += '<h3>Contribution — ' + esc(c.quarter) + ' snapshot (frozen evidence)</h3><div>' +
      (c.score != null ? '<span class="chip green">evidence score ' + c.score.toFixed(2) + '</span>' : '') +
      (c.goalCompliant != null ? '<span class="chip ' + (c.goalCompliant ? 'green' : 'red') + '">goals ' +
        (c.goalCompliant ? 'compliant' : 'not compliant') + (c.goalsTotal != null ? ' · ' + c.goalsTotal + ' goals' : '') + '</span>' : '') +
      (c.ptoCompliance != null ? '<span class="chip">PTO compliance ' + pctFmt(c.ptoCompliance, 0) + '</span>' : '') +
      (c.trackedCoverage != null ? '<span class="chip">tracked ' + (c.trackedHrs != null ? Math.round(c.trackedHrs) + 'h' : '') +
        ' · ' + pctFmt(c.trackedCoverage, 0) + ' of planned</span>' : '') +
      (c.rcr != null ? '<span class="chip">RCR ' + c.rcr.toFixed(2) + '</span>' : '') +
      ((c.kudosReceived || c.kudosGiven) ? '<span class="chip" title="Low kudos signals program under-use, not low contribution">kudos ' +
        (c.kudosReceived || 0) + '↓ ' + (c.kudosGiven || 0) + '↑</span>' : '') +
      '</div><div class="sub" style="margin-top:4px">Read from the quarterly Contribution Snapshot — frozen at cycle open so QTA evidence never moves mid-review. RCR applies to Services only; blank never means zero.</div>';
  }
  // P2: 36-month acceleration path — renders only for opted-in I3/I4s.
  if (emp.p2 && emp.p2.accel) body += accelStepperHtml(emp.p2.accel);
  if (!g || !g.events.length) {
    body += '<div class="banner">No comp history found in the Compensation Report (RD) for this Rocketeer.</div>';
  } else {
    body +=
      '<h3>TCC growth waterfall (local Total Target Compensation)</h3>' +
      waterfallSvg(g.events, 500, 200) +
      '<h3>Comp events</h3>' +
      '<table><tr><th>Date</th><th>Event</th><th>TCC</th><th>Δ</th><th>TCC AGR</th><th>Annualized</th></tr>' +
      g.events.map(e =>
        '<tr><td>' + esc(e.date) + '</td><td>' + esc(e.reason) + '</td>' +
        '<td>' + (e.tcc != null ? Math.round(e.tcc).toLocaleString() : "—") + '</td>' +
        '<td>' + (e.deltaAbs != null ? (e.deltaAbs >= 0 ? "+" : "") + Math.round(e.deltaAbs).toLocaleString() : "—") + '</td>' +
        '<td>' + pctFmt(e.tag, 2) + '</td><td>' + pctFmt(e.annualized) + '</td></tr>').join("") +
      '</table>' +
      '<div class="sub" style="margin-top:6px">First event is the baseline (usually New Hire) — no growth math applies to it.</div>';
  }
  const ratings = (g && g.ratings) ? g.ratings : [];
  if (ratings.length) {
    body += '<h3>Performance ratings (Small Improvements)</h3><div>' +
      ratings.map(r =>
        '<span class="chip ' + (r.rate >= 4 ? "green" : r.rate >= 3 ? "" : "red") + '"' +
        (r.explanation ? ' title="' + esc(r.explanation) + '"' : '') + '>' +
        esc(r.fq) + ' · ' + esc(r.rate) + '</span>').join("") + '</div>' +
      '<div class="sub" style="margin-top:4px">avg ' + (emp.perfAvg != null ? emp.perfAvg.toFixed(2) : "—") +
      ' over ' + emp.perfCount + ' windowed quarter(s) · ' + (emp.perfTotalCount || emp.perfCount) + ' total on record</div>';
  }
  box.innerHTML = body;
  // The drill panel renders outside render(), so it needs the same pass — its
  // comp-history table is 6 columns inside a 560px drawer.
  wrapTables(box);
  box.classList.remove("hidden");
}

// Waterfall: first bar is the grey baseline; each later bar spans prev TCC → new TCC
// (green up, red down). Y-axis starts at 90% of the minimum so deltas stay readable.
function waterfallSvg(events, w, h) {
  const evs = events.filter(e => e.tcc != null);
  if (!evs.length) return "";
  const minV = Math.min.apply(null, evs.map(e => e.tcc));
  const maxV = Math.max.apply(null, evs.map(e => e.tcc));
  const lo = minV * 0.9, span = Math.max(1, maxV - lo);
  const bw = Math.max(18, Math.min(64, (w - 30) / evs.length - 8));
  const y = v => 12 + (h - 40) * (1 - (v - lo) / span);
  let sx = 10;
  const parts = [];
  evs.forEach((e, i) => {
    const top = y(e.tcc);
    const base = y(i === 0 ? lo : evs[i - 1].tcc);
    const fill = i === 0 ? "var(--chip)" : (e.tcc >= evs[i - 1].tcc ? "var(--accent)" : "var(--bad)");
    parts.push('<rect x="' + sx + '" y="' + Math.min(top, base).toFixed(1) + '" width="' + bw +
      '" height="' + Math.max(2, Math.abs(base - top)).toFixed(1) + '" rx="3" fill="' + fill + '"/>');
    parts.push('<text x="' + (sx + bw / 2).toFixed(1) + '" y="' + (h - 6) +
      '" text-anchor="middle">' + esc(e.date.slice(0, 7)) + '</text>');
    sx += bw + 8;
  });
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + Math.max(w, sx) + " " + h +
    '" preserveAspectRatio="xMinYMid meet">' + parts.join("") + '</svg>';
}
function closeDrill() { document.getElementById("drill").classList.add("hidden"); }

// ── wiring ──────────────────────────────────────────────────
// Theme: dark is the default; "light" re-binds the same semantic variables so
// no renderer knows which theme is active. Persisted per browser. SVGs inherit
// because every chart color is a var(--…) reference, never a literal.
function applyTheme(t) {
  if (t === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  const b = document.getElementById("themeBtn");
  b.textContent = t === "light" ? "🌙" : "☀️";
  b.title = t === "light" ? "Switch to dark theme" : "Switch to light theme";
  try { localStorage.setItem("cd_theme", t); } catch (e) { /* sandboxed iframe — theme just won't persist */ }
}
document.getElementById("themeBtn").onclick = () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
(function () {
  let saved = "dark";
  try { saved = localStorage.getItem("cd_theme") || "dark"; } catch (e) { /* default dark */ }
  applyTheme(saved);
})();

document.getElementById("menuBtn").onclick = () =>
  document.getElementById("menuPanel").classList.toggle("hidden");
document.getElementById("refreshBtn").onclick = () => loadData(true);
document.querySelectorAll("#curToggle button").forEach(b => {
  b.onclick = () => {
    STATE.currency = b.dataset.cur;
    document.querySelectorAll("#curToggle button").forEach(x => x.classList.toggle("on", x === b));
    render();
  };
});
document.addEventListener("click", e => {
  const menu = document.getElementById("menuPanel");
  if (!menu.classList.contains("hidden") &&
      !menu.contains(e.target) && e.target.id !== "menuBtn") menu.classList.add("hidden");
});

// Charts are drawn to a MEASURED width, so a resized window (or a laptop
// docked to an ultrawide) has to redraw them or they keep the old scale. Only
// width matters, and it is debounced — a drag would otherwise re-render on
// every animation frame. Height-only changes (the mobile URL bar) are ignored.
let RESIZE_T = null, LAST_W = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === LAST_W) return;
  LAST_W = window.innerWidth;
  clearTimeout(RESIZE_T);
  RESIZE_T = setTimeout(render, 180);
});

buildNav();
switchTab("overview");
loadData(false);
