<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      /* COMPANY_COLORS — brand palette (see frontend standard) */
      --void-blue:   #0F1941; /* primary background (dark) */
      --light-cream: #FFFAF5; /* primary text on dark */
      --orbe-blue:   #058CDC; /* accent / CTAs */
      --ivory:       #DCCDBE; /* neutral surfaces / muted labels */
      --june:        #FF9B87; /* highlight accents (banners, emphasis) */
      /* Semantic theme derived from COMPANY_COLORS */
      --bg: var(--void-blue);
      --panel: #16224E; --panel-2: #1C2B5E; --border: #2C3D78;
      --text: var(--light-cream); --muted: var(--ivory); --chip: #202F66;
      --cta: var(--orbe-blue);    /* interactive: buttons, links, active states */
      /* Status colors — data semantics, deliberately NOT brand colors */
      --accent: #35c26e;  /* green — good / at target */
      --warn:   #e8b93c;  /* yellow — attention */
      --bad:    #e05252;  /* red — priority read */
      --above:  #9d7bff;  /* violet — above median (ceiling watch) */
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", Arial, sans-serif; }
    header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; }
    .sub { color: var(--muted); font-size: 12px; }
    .hdr-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
    button { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
    button:hover { border-color: var(--cta); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; background: transparent; }
    .seg button.on { background: var(--cta); color: var(--void-blue); font-weight: 600; }
    nav { display: flex; gap: 6px; padding: 10px 18px 0; flex-wrap: wrap; }
    nav button.on { background: var(--panel-2); border-color: var(--cta); font-weight: 600; }
    #stickyBar { position: sticky; top: 0; z-index: 20; background: var(--bg); }
    .filterbar { display: flex; gap: 8px; padding: 8px 18px 10px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--border); }
    .filterbar input[type=search] { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 190px; }
    .chip.violet { border-color: var(--above); color: var(--above); }
    /* Layout width. 1280px letterboxed an ultrawide into roughly a third of the
       glass, so the page now grows with the viewport in tiers up to --page-max
       instead of stopping at a laptop width. The tiers are widths, not device
       guesses: each one is the point where the content genuinely earns more
       room (wider tables, more KPI columns per row). */
    :root { --page-max: 1280px; }
    @media (min-width: 1600px) { :root { --page-max: 1500px; } }
    @media (min-width: 1920px) { :root { --page-max: 1760px; } }
    @media (min-width: 2560px) { :root { --page-max: 2200px; } }
    main { padding: 16px 18px 60px; max-width: var(--page-max); margin: 0 auto; }
    /* The sticky bars stay FULL-BLEED — their panel background and bottom rule
       should span the glass — but their contents line up with main's measure, so
       a filter never drifts away from the column it filters. Padding rather than
       max-width is what keeps the background full width. */
    header, nav, .filterbar {
      padding-left:  max(18px, calc((100% - var(--page-max)) / 2));
      padding-right: max(18px, calc((100% - var(--page-max)) / 2));
    }

    /* Tables scroll INSIDE their own box. Without this the 6-column Managers
       table and the 8-column termination detail push the whole document
       sideways on a narrow window — the page itself must never scroll
       horizontally. min-width keeps columns legible rather than crushed. */
    .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .scroll-x > table { min-width: 620px; }
    .scroll-x > table.wide { min-width: 860px; }

    @media (max-width: 820px) {
      main { padding: 12px 12px 60px; }
      header, nav, .filterbar { padding-left: 12px; padding-right: 12px; }
      /* A search box with a 190px floor plus four selects overflowed the row;
         let them share the line instead. */
      .filterbar input[type=search], .filterbar select { min-width: 0; flex: 1 1 140px; }
      .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
      .kpi-v { font-size: 22px; }
      .kpi-q { min-height: 0; }
      h1 { font-size: 16px; }
      .drill { width: 100vw; }
    }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
    .banner { background: #3B2833; border: 1px solid var(--june); color: #FFD8CC; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
    .banner.err { background: #3a2020; border-color: var(--bad); color: #f2b8b8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    tr.click { cursor: pointer; }
    tr.click:hover td { background: var(--panel-2); }
    .chip { display: inline-block; background: var(--chip); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12px; margin: 0 6px 6px 0; }
    .chip.green { border-color: var(--accent); color: var(--accent); }
    .chip.yellow { border-color: var(--warn); color: var(--warn); }
    .chip.red { border-color: var(--bad); color: var(--bad); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .kpi { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
    .kpi:hover { border-color: var(--cta); }
    .kpi-q { color: var(--muted); font-size: 12px; min-height: 30px; }
    .kpi-v { font-size: 26px; font-weight: 700; margin: 4px 0 2px; }
    .kpi-s { color: var(--muted); font-size: 11px; }
    .bar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; }
    .bar > i { display: block; height: 100%; }
    .menu { position: absolute; top: 52px; left: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 6px; z-index: 30; display: flex; flex-direction: column; gap: 4px; min-width: 200px; }
    .menu button { text-align: left; border: none; background: transparent; }
    .menu button:hover { background: var(--chip); }
    .drill { position: fixed; top: 0; right: 0; width: min(560px, 96vw); height: 100vh; background: var(--panel); border-left: 1px solid var(--border); z-index: 40; padding: 18px; overflow-y: auto; box-shadow: -12px 0 30px rgba(0,0,0,.4); }
    /* !important so this beats the higher-specificity #loading { display:flex }
       — without it the loading overlay can never be hidden. */
    .hidden { display: none !important; }
    #loading { position: fixed; inset: 0; background: rgba(13,21,55,.85); display: flex; align-items: center; justify-content: center; z-index: 50; font-size: 15px; color: var(--muted); }
    select, textarea { background: var(--chip); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--muted); }
    h2 { font-size: 15px; margin: 0 0 10px; }
    h3 { font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
    a { color: var(--cta); }
    svg text { fill: var(--muted); font-size: 10px; }
  </style>
</head>
<body>
<div id="stickyBar">
<header>
  <button id="menuBtn" title="Menu">☰</button>
  <div>
    <h1>Rocketeer Global Comp Health Report</h1>
    <div class="sub" id="subTitle">loading…</div>
  </div>
  <div class="hdr-right">
    <div class="seg" id="curToggle">
      <button data-cur="LOCAL" class="on">Local</button>
      <button data-cur="USD">USD</button>
    </div>
    <button id="refreshBtn" title="Bypass cache for a live read">⟳ Refresh</button>
  </div>
</header>
<div id="menuPanel" class="menu hidden"></div>
<nav id="tabbar"></nav>
<div class="filterbar">
  <select id="fLoc" onchange="setFilter('loc', this.value)"></select>
  <select id="fLevel" onchange="setFilter('level', this.value)"></select>
  <select id="fDept" onchange="setFilter('dept', this.value)"></select>
  <input id="fQ" type="search" placeholder="🔎 Find a Rocketeer…" oninput="setFilter('q', this.value)">
  <button id="fClear" class="hidden" onclick="clearFilters()">✕ Clear</button>
  <span class="sub" id="fNote"></span>
</div>
</div>
<main><div id="pane"></div></main>
<div id="drill" class="drill hidden"></div>
<div id="loading">Loading compensation data…</div>

<script>
"use strict";
const USER_ROLE  = "<?= userRole ?>";
const USER_EMAIL = "<?= userEmail ?>";

// Single source of truth for navigation — same pattern as PS Dashboard.
const VIEWS = [
  { id: "overview",  label: "🏠 Overview",           roles: ["admin", "viewer"] },
  { id: "ranking",   label: "🎯 Priority Ranking",    roles: ["admin", "viewer"] },
  { id: "attrition", label: "📉 Attrition",           roles: ["admin", "viewer"] },
  { id: "managers",  label: "👤 Managers",            roles: ["admin", "viewer"] },
  { id: "compa",     label: "⚖️ Internal Position",   roles: ["admin", "viewer"] },
  { id: "market",    label: "🌍 Market Gap",          roles: ["admin", "viewer"] },
  { id: "equity",    label: "🧭 Pay Equity",          roles: ["admin", "viewer"] },
  { id: "qta",       label: "📋 QTA Status",          roles: ["admin", "viewer"] },
  { id: "contrib",   label: "🚀 Contribution",        roles: ["admin", "viewer"] },
  { id: "reference", label: "📊 Data Reference",      roles: ["admin", "viewer"], menu: true },
  { id: "access",    label: "🔒 Access Control",      roles: ["admin"],           menu: true },
];

const STATE = {
  data: null, tab: "overview", currency: "LOCAL",
  attrGran: "month", attrDim: "department",
  filters: { loc: "", level: "", dept: "", q: "" },
  rankSort: { key: "score", dir: -1 },
};

// ── helpers ─────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
// ── universal filters ───────────────────────────────────────────────────────────
function normName(s) { return String(s || "").toLowerCase().replace(/\s+/g, " ").trim(); }
function filtersActive() {
  const f = STATE.filters;
  return !!(f.loc || f.level || f.dept || f.q);
}
// One predicate for employees[], people[], and any row carrying these fields.
function visibleEmp(e) {
  const f = STATE.filters;
  return (!f.loc || e.keyLocation === f.loc) &&
         (!f.level || e.level === f.level) &&
         (!f.dept || e.dept === f.dept) &&
         (!f.q || normName(e.name).indexOf(normName(f.q)) !== -1);
}
function setFilter(k, v) {
  STATE.filters[k] = v;
  syncFilterBar();
  render();
}
function clearFilters() {
  STATE.filters = { loc: "", level: "", dept: "", q: "" };
  populateFilters();
  syncFilterBar();
  render();
}
function syncFilterBar() {
  document.getElementById("fClear").classList.toggle("hidden", !filtersActive());
  document.getElementById("fNote").textContent = filtersActive()
    ? STATE.data.employees.filter(visibleEmp).length + " Rocketeers match" : "";
}
function populateFilters() {
  const d = STATE.data;
  if (!d) return;
  const f = STATE.filters;
  const opt = (id, label, vals, cur) => {
    document.getElementById(id).innerHTML =
      '<option value="">' + label + ': All</option>' +
      vals.map(v => '<option value="' + esc(v) + '"' + (v === cur ? " selected" : "") +
        '>' + esc(v) + '</option>').join("");
  };
  opt("fLoc", "Location", [...new Set(d.employees.map(e => e.keyLocation))].filter(Boolean).sort(), f.loc);
  opt("fLevel", "Level", [...new Set(d.employees.map(e => e.level))].sort(), f.level);
  opt("fDept", "Department", [...new Set(d.employees.map(e => e.dept))].filter(Boolean).sort(), f.dept);
  document.getElementById("fQ").value = f.q;
}
function fmtMoney(tcc, tccUsd, currency) {
  if (STATE.currency === "USD") return tccUsd != null ? "$" + Math.round(tccUsd).toLocaleString() : "—";
  return tcc != null ? Math.round(tcc).toLocaleString() + (currency ? " " + currency : "") : "—";
}
function pctFmt(x, dp) { return x == null ? "—" : (x * 100).toFixed(dp == null ? 1 : dp) + "%"; }
function ratioClass(r) {
  // Bands come from CONFIG_CD via meta.compaBands — never hardcode them here.
  const b = (STATE.data && STATE.data.meta.compaBands) || { low: 0.8, target: 0.95, high: 1.1 };
  return r == null ? "" : r < b.low ? "red" : r < b.target ? "yellow" : r <= b.high ? "green" : "violet";
}
function ratioBarColor(cls) {
  return cls === "green" ? "var(--accent)" : cls === "yellow" ? "var(--warn)" :
         cls === "violet" ? "var(--above)" : "var(--bad)";
}
// MIRROR of ragBand_ in Code.js (3-line band classifier) — keep in sync.
function ragBandC(value, bands) {
  if (value == null || !bands) return null;
  return value <= bands.green ? "green" : value <= bands.yellow ? "yellow" : "red";
}
// Colored status dot + value. band null → plain value.
function ragDot(band, text) {
  const col = band === "green" ? "var(--accent)" : band === "yellow" ? "var(--warn)" :
              band === "red" ? "var(--bad)" : "var(--muted)";
  return '<span style="color:' + col + '">●</span> ' + text;
}
// Trend arrow vs a prior-basis value (±0.5pp dead zone). Direction only —
// the RAG dot carries the judgment. Empty string when either basis is missing.
function trendArrow(cur, prev) {
  if (cur == null || prev == null) return "";
  const d = cur - prev;
  return Math.abs(d) < 0.005 ? " →" : d > 0 ? " ▲" : " ▼";
}
// One verdict line: severity → fact → so-what → action → caveat.
function verdictHtml(v) {
  const col = v.severity === "RISK" ? "var(--bad)" : v.severity === "NOTE" ? "var(--warn)" : "var(--accent)";
  return '<div style="border-left:3px solid ' + col + ';padding:5px 10px;margin:0 0 8px">' +
    '<b style="color:' + col + '">' + esc(v.severity) + '</b> — ' + esc(v.fact) +
    (v.soWhat ? ' <i class="sub">' + esc(v.soWhat) + '</i>' : '') +
    (v.action ? ' <b>→ ' + esc(v.action) + '</b>' : '') +
    (v.caveat ? ' <span class="sub">⚠ ' + esc(v.caveat) + '</span>' : '') + '</div>';
}
// All verdicts for a view, in payload order.
function verdictsFor(view) {
  return ((STATE.data && STATE.data.verdicts) || []).filter(v => v.view === view);
}
/**
 * The drawing width a chart should use: the pane's real inner width, less card
 * padding. Measured rather than assumed, so one viewBox unit is one screen pixel
 * and nothing stretches — the same reason the chart sets "meet" instead of
 * "none". Falls back to the old fixed 720 before the pane exists.
 *
 * @param {number=} fallback
 * @returns {number}
 */
function chartWidth(fallback) {
  const pane = document.getElementById("pane");
  const w = pane ? pane.clientWidth : 0;
  if (!w) return fallback || 720;
  // 34px = the card's own horizontal padding plus its borders.
  return Math.max(560, Math.min(2000, Math.round(w - 34)));
}
function median(nums) {
  const a = nums.slice().sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function sourceBanner(key, label) {
  const s = STATE.data.meta.sources[key];
  return s === "ok" ? "" :
    '<div class="banner err">⚠️ ' + esc(label) + ' unavailable — ' + esc(s) + '</div>';
}
// Previous FY as a shadow area, current FY as a trend line cut at the current
// fiscal month (uptoIdx). V3: optional dashed forecast extension and a subtle
// peer-band zone (annual voluntary rate mapped to monthly-equivalent counts:
// rate × avgHeadcount ÷ 12 — like-for-like with the monthly series).
function attritionChart(prevSeries, curSeries, labels, uptoIdx, w, h, opts) {
  opts = opts || {};
  const P = 26, n = labels.length;
  const prevV = prevSeries.map(m => m.terms);
  const curV = curSeries.map(m => m.terms);
  const fcV = (opts.forecastMonths || []).map(m => m.terms);
  const maxY = Math.max.apply(null, prevV.concat(curV, fcV, [1]));
  const x = i => P + i * ((w - P - 6) / Math.max(1, n - 1));
  const y = v => h - 18 - v / maxY * (h - 30);
  const area = prevV.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ") +
    " " + x(n - 1).toFixed(1) + "," + y(0).toFixed(1) + " " + x(0).toFixed(1) + "," + y(0).toFixed(1);
  const cut = Math.max(0, Math.min(uptoIdx, n - 1));
  const line = curV.slice(0, cut + 1).map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
  let band = "";
  if (opts.bandLo != null && opts.bandHi != null) {
    band = '<rect x="' + P + '" y="' + y(opts.bandHi).toFixed(1) + '" width="' + (w - P - 6) +
      '" height="' + Math.max(1, y(opts.bandLo) - y(opts.bandHi)).toFixed(1) +
      '" fill="var(--cta)" opacity="0.12"/>';
  }
  let fc = "";
  if (opts.forecastMonths && opts.forecastMonths.length && cut < n - 1) {
    const pts = [x(cut).toFixed(1) + "," + y(curV[cut]).toFixed(1)]
      .concat(opts.forecastMonths.filter(m => m.forecast && m.idx < n).map(m =>
        x(m.idx).toFixed(1) + "," + y(m.terms).toFixed(1)));
    fc = '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--accent)" ' +
      'stroke-width="2" stroke-dasharray="5,4" opacity="0.8"/>';
  }
  const ticks = labels.map((L, i) =>
    (n <= 4 || i % 3 === 0 || i === n - 1)
      ? '<text x="' + x(i).toFixed(1) + '" y="' + (h - 4) + '" text-anchor="middle">' + esc(L) + '</text>'
      : "").join("");
  const yTicks = [0, Math.ceil(maxY / 2), maxY].map(v =>
    '<text x="2" y="' + (y(v) + 3).toFixed(1) + '">' + v + '</text>').join("");
  // preserveAspectRatio="xMidYMid meet" rather than "none": non-uniform scaling
  // stretched the drawing horizontally as the container widened, which showed up
  // as uneven forecast dashes and horizontally smeared axis labels on a wide
  // screen. "meet" scales both axes together, so type and dash patterns keep
  // their shape; the chart simply centres in a wider card.
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + " " + h +
    '" preserveAspectRatio="xMidYMid meet" style="max-width:100%">' +
    band +
    '<polygon points="' + area + '" fill="var(--chip)" opacity="0.75"/>' +
    '<polyline points="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.5"/>' +
    fc + ticks + yTicks + '</svg>';
}
function svgSpark(series, w, h, color) {
  const max = Math.max.apply(null, series.concat([1]));
  const step = w / Math.max(1, series.length - 1);
  const pts = series.map((v, i) =>
    (i * step).toFixed(1) + "," + (h - v / max * (h - 4) - 2).toFixed(1)).join(" ");
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + " " + h + '">' +
         '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2"/></svg>';
}

// MIRROR of fyAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function fyAttritionFromPeople_(people, fyStartCalYear, asOfIso, label) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const idxOf = iso => (+iso.slice(0, 4) - fyStartCalYear) * 12 + (+iso.slice(5, 7) - 1) - 6;
  const hcOn = iso => people.filter(p =>
    (!p.hireDate || p.hireDate <= iso) && (!p.termDate || p.termDate > iso)).length;
  const monthly = Array.from({ length: 12 }, () => ({ terms: 0, vol: 0, invol: 0 }));
  const terms = people.filter(p => p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso);
  terms.forEach(p => {
    const i = idxOf(p.termDate);
    if (i < 0 || i > 11) return;
    monthly[i].terms++;
    if (p.termCls === "vol") monthly[i].vol++;
    else if (p.termCls === "invol") monthly[i].invol++;
  });
  const quarterly = [0, 1, 2, 3].map(q => {
    const s = monthly.slice(q * 3, q * 3 + 3);
    return { terms: s.reduce((t, x) => t + x.terms, 0),
             vol:   s.reduce((t, x) => t + x.vol, 0),
             invol: s.reduce((t, x) => t + x.invol, 0) };
  });
  const vol = terms.filter(p => p.termCls === "vol").length;
  const invol = terms.filter(p => p.termCls === "invol").length;
  const regretted = terms.filter(p => p.regretted).length;
  const avgHeadcount = (hcOn(fyStartIso) + hcOn(endIso)) / 2;
  return { label, monthly, quarterly, total: terms.length, vol, invol, regretted,
           avgHeadcount, rate: avgHeadcount > 0 ? terms.length / avgHeadcount : null };
}

// MIRROR of sliceAttritionFromPeople_ in Code.js — parity-tested there; keep in sync.
function sliceAttritionFromPeople_(people, fyStartCalYear, asOfIso, keyFn) {
  const fyStartIso = fyStartCalYear + "-07-01";
  const fyEndIso = (fyStartCalYear + 1) + "-06-30";
  const endIso = (asOfIso && asOfIso < fyEndIso) ? asOfIso : fyEndIso;
  const groups = new Map();
  const get = k => {
    if (!groups.has(k)) groups.set(k, { key: k, terms: 0, vol: 0, invol: 0, hcStart: 0, hcEnd: 0 });
    return groups.get(k);
  };
  people.forEach(p => {
    const g = get(keyFn(p) || "—");
    if ((!p.hireDate || p.hireDate <= fyStartIso) && (!p.termDate || p.termDate > fyStartIso)) g.hcStart++;
    if ((!p.hireDate || p.hireDate <= endIso) && (!p.termDate || p.termDate > endIso)) g.hcEnd++;
    if (p.termDate && p.termDate >= fyStartIso && p.termDate <= fyEndIso) {
      g.terms++;
      if (p.termCls === "vol") g.vol++;
      else if (p.termCls === "invol") g.invol++;
    }
  });
  return [...groups.values()]
    .map(g => {
      const avg = (g.hcStart + g.hcEnd) / 2;
      return { key: g.key, terms: g.terms, vol: g.vol, invol: g.invol,
               headcount: g.hcEnd, rate: avg > 0 ? g.terms / avg : null };
    })
    .filter(g => g.terms > 0 || g.headcount > 0)
    .sort((x, y) => y.terms - x.terms || y.headcount - x.headcount);
}

// MIRROR of levelRank_ in Code.js.
function levelRankC(level) {
  const m = String(level || "").match(/^([IM])(\d+)$/);
  if (!m) return 999;
  return (m[1] === "I" ? 0 : 100) + parseInt(m[2], 10);
}

/**
 * Puts every rendered table in its own horizontal scroll box.
 *
 * Done here rather than in the twelve renderers that build table markup: one
 * pass cannot forget a table, and any table added later is covered for free.
 * Without it a wide table (Managers is 6 columns, the termination detail 8)
 * pushes the whole document sideways — the page itself must never scroll
 * horizontally, only the table inside its card.
 *
 * @param {HTMLElement} el Container just re-rendered.
 */
function wrapTables(el) {
  if (!el) return;
  Array.prototype.forEach.call(el.querySelectorAll("table"), function (t) {
    if (t.parentElement && t.parentElement.classList.contains("scroll-x")) return;
    const box = document.createElement("div");
    box.className = "scroll-x";
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
    // Wide tables get a bigger floor so their columns stay readable rather than
    // compressing to nothing before the scrollbar appears.
    if (t.rows[0] && t.rows[0].cells.length >= 7) t.classList.add("wide");
  });
}

function onData(raw) {

// Renders the SERVER-computed suggestion (marketSuggestion_ in Code.js) — no client math.
function suggestionChip(e) {
  const s = e.suggestion || { status: "pending" };
  if (s.status === "below-p25") {
    return { badge: '<span class="chip red">below P25</span>',
             text: "+" + pctFmt(s.pctToP25, 0) + " to reach P25 · +" + pctFmt(s.pctToP50, 0) + " to mean" };
  }
  if (s.status === "below-p50") {
    return { badge: '<span class="chip yellow">below mean</span>',
             text: "+" + pctFmt(s.pctToP50, 0) + " to reach the mean" };
  }
  if (s.status === "at-market") {
    return { badge: '<span class="chip green">at/above mean</span>', text: "market competitive" };
  }
  return { badge: '<span class="chip">pending</span>', text: "—" };
}

  document.getElementById("accMsg").textContent = "saving…";
  google.script.run
    .withSuccessHandler(() => { document.getElementById("accMsg").textContent = "✅ saved — cache version bumped"; })
    .withFailureHandler(e => { document.getElementById("accMsg").textContent = "❌ " + ((e && e.message) || e); })
    .saveAccessSettings({ admins: split("accAdmins"), viewers: split("accViewers") });
}

// ── employee drill panel — shared by Internal Position, Market Gap, Pay Equity, QTA ──
function openDrill(empNo) {
  const d = STATE.data;
  const emp = d.employees.find(e => e.empNo === empNo);
  const g = d.history[empNo];
  const box = document.getElementById("drill");
  if (!emp) {
    box.innerHTML = '<button onclick="closeDrill()" style="float:right">✕ Close</button><p class="sub">Employee not found in the active payload.</p>';
    box.classList.remove("hidden");
    return;
  }
  const marketLow = d.meta.marketLow || 0.9;
  let body =
    '<button onclick="closeDrill()" style="float:right">✕ Close</button>' +
    '<h2>' + esc(emp.name) + '</h2>' +
    '<div class="sub">' + esc(emp.jobTitle) + ' · ' + esc(emp.keyLocation) + ' · ' + esc(emp.dept) + '</div>' +
    '<div style="margin:10px 0">' +
    '<span class="chip">TCC ' + fmtMoney(emp.tcc, emp.tccUsd, emp.currency) + '</span>' +
    (emp.ratio != null
      ? '<span class="chip ' + ratioClass(emp.ratio) + '" title="anchor: ' + esc(TIER_LABEL[emp.anchorTier] || "") + '">position ' + emp.ratio.toFixed(2) + '</span>' : '') +
    (emp.marketRatio != null
      ? '<span class="chip ' + (emp.marketRatio < marketLow ? "red" : "green") + '" title="' + esc(emp.benchSource || "benchmark") + '">vs market ' + emp.marketRatio.toFixed(2) + '</span>' : '') +
    (emp.tenureCompanyYears != null
      ? '<span class="chip">tenure ' + emp.tenureCompanyYears + 'y company / ' + (emp.tenureProfileYears != null ? emp.tenureProfileYears + 'y in role' : "—") + '</span>' : '') +
    (emp.ttmGrowthPct != null ? '<span class="chip">TTM growth ' + pctFmt(emp.ttmGrowthPct) + '</span>' : '');
  if (emp.priority && emp.priority.score != null) {
    const c = emp.priority.components;
    body += '<span class="chip yellow" title="perf ' + (c.perf != null ? (c.perf * 100).toFixed(0) + '%' : '—') +
      ' · tenure ' + (c.tenure != null ? (c.tenure * 100).toFixed(0) + '%' : '—') +
      ' · gap ' + (c.compaGap != null ? (c.compaGap * 100).toFixed(0) + '%' : '—') +
      (emp.priority.partial ? ' · partial (missing: ' + emp.priority.missing.join(", ") + ')' : '') +
      '">priority ' + emp.priority.score + (emp.priority.partial ? '°' : '') + '</span>';
  }
  body += '</div>';
  if (!g || !g.events.length) {
    body += '<div class="banner">No comp history found in the Compensation Report (RD) for this Rocketeer.</div>';
  } else {
    body +=
      '<h3>TCC growth waterfall (local Total Target Compensation)</h3>' +
      waterfallSvg(g.events, 500, 200) +
      '<h3>Comp events</h3>' +
      '<table><tr><th>Date</th><th>Event</th><th>TCC</th><th>Δ</th><th>TCC AGR</th><th>Annualized</th></tr>' +
      g.events.map(e =>
        '<tr><td>' + esc(e.date) + '</td><td>' + esc(e.reason) + '</td>' +
        '<td>' + (e.tcc != null ? Math.round(e.tcc).toLocaleString() : "—") + '</td>' +
        '<td>' + (e.deltaAbs != null ? (e.deltaAbs >= 0 ? "+" : "") + Math.round(e.deltaAbs).toLocaleString() : "—") + '</td>' +
        '<td>' + pctFmt(e.tag, 2) + '</td><td>' + pctFmt(e.annualized) + '</td></tr>').join("") +
      '</table>' +
      '<div class="sub" style="margin-top:6px">First event is the baseline (usually New Hire) — no growth math applies to it.</div>';
  }
  const ratings = (g && g.ratings) ? g.ratings : [];
  if (ratings.length) {
    body += '<h3>Performance ratings (Small Improvements)</h3><div>' +
      ratings.map(r =>
        '<span class="chip ' + (r.rate >= 4 ? "green" : r.rate >= 3 ? "" : "red") + '"' +
        (r.explanation ? ' title="' + esc(r.explanation) + '"' : '') + '>' +
        esc(r.fq) + ' · ' + esc(r.rate) + '</span>').join("") + '</div>' +
      '<div class="sub" style="margin-top:4px">avg ' + (emp.perfAvg != null ? emp.perfAvg.toFixed(2) : "—") +
      ' over ' + emp.perfCount + ' quarter(s)</div>';
  }
  box.innerHTML = body;
  // The drill panel renders outside render(), so it needs the same pass — its
  // comp-history table is 6 columns inside a 560px drawer.
  wrapTables(box);
  box.classList.remove("hidden");
}

// Waterfall: first bar is the grey baseline; each later bar spans prev TCC → new TCC
// (green up, red down). Y-axis starts at 90% of the minimum so deltas stay readable.
function waterfallSvg(events, w, h) {
  const evs = events.filter(e => e.tcc != null);
  if (!evs.length) return "";
  const minV = Math.min.apply(null, evs.map(e => e.tcc));
  const maxV = Math.max.apply(null, evs.map(e => e.tcc));
  const lo = minV * 0.9, span = Math.max(1, maxV - lo);
  const bw = Math.max(18, Math.min(64, (w - 30) / evs.length - 8));
  const y = v => 12 + (h - 40) * (1 - (v - lo) / span);
  let sx = 10;
  const parts = [];
  evs.forEach((e, i) => {
    const top = y(e.tcc);
    const base = y(i === 0 ? lo : evs[i - 1].tcc);
    const fill = i === 0 ? "var(--chip)" : (e.tcc >= evs[i - 1].tcc ? "var(--accent)" : "var(--bad)");
    parts.push('<rect x="' + sx + '" y="' + Math.min(top, base).toFixed(1) + '" width="' + bw +
      '" height="' + Math.max(2, Math.abs(base - top)).toFixed(1) + '" rx="3" fill="' + fill + '"/>');
    parts.push('<text x="' + (sx + bw / 2).toFixed(1) + '" y="' + (h - 6) +
      '" text-anchor="middle">' + esc(e.date.slice(0, 7)) + '</text>');
    sx += bw + 8;
  });
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + Math.max(w, sx) + " " + h +
    '" preserveAspectRatio="xMinYMid meet">' + parts.join("") + '</svg>';
}

      !menu.contains(e.target) && e.target.id !== "menuBtn") menu.classList.add("hidden");
});

// Charts are drawn to a MEASURED width, so a resized window (or a laptop
// docked to an ultrawide) has to redraw them or they keep the old scale. Only
// width matters, and it is debounced — a drag would otherwise re-render on
// every animation frame. Height-only changes (the mobile URL bar) are ignored.
let RESIZE_T = null, LAST_W = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === LAST_W) return;
  LAST_W = window.innerWidth;
  clearTimeout(RESIZE_T);
  RESIZE_T = setTimeout(render, 180);
});

buildNav();
switchTab("overview");
loadData(false);
