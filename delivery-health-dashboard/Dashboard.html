<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
:root{
  --void:#0F1941; --orbe:#058CDC; --ivory:#DCCDBE; --cream:#FFFAF5;
  --royal:#2864E6; --june:#FF9B87; --slate:#64748B;
  --bg:var(--cream); --surface:#ffffff; --surface-2:#FBF6F0;
  --border:#E7DDD2; --text:var(--void); --muted:#6B7280;
  --up:#1F8A57; --down:#C2410C; --neutral:#E7DDD2;
  --winner:#FF9B87; --pos:#1F8A57; --warn:#C2410C; --amber:#B45309;
  --shadow:0 1px 2px rgba(15,25,65,.06), 0 8px 24px rgba(15,25,65,.06);
  --scale:1;
  /* ── Chart marks ──
     Deliberately SEPARATE tokens from the text colours above, because marks and
     text have different jobs and different constraints. The text amber
     (--amber #B45309) and the text red (--warn #C2410C) are only ΔE 4.1 apart
     in normal vision and ΔE 0.1 under deuteranopia — as *text* that is fine
     (they are never adjacent and each carries a word), but as two fills side by
     side in a chart they are the same colour. The chart set below passes the
     lightness-band, chroma, CVD-separation (worst adjacent ΔE 8.7 protan),
     normal-vision (16.5) and contrast checks. --c-warn sits at 2.94:1 on white,
     just under the 3:1 mark, so every bar using it also carries a value label
     and a ✔/▲/✖ glyph and appears in a table view — status is never colour
     alone (FR-4.4). Verified with the dataviz palette validator, not by eye. */
  --c-good:#1F8A57; --c-warn:#CA8A04; --c-bad:#C2410C;
  --c-series:#058CDC; --c-ref:#64748B; --c-target:#2864E6;
  --grid:#EDE4DA; --plot:#ffffff;
  /* Workload-bar segments. Their own tokens because the light values could not
     be reused in dark: billable was --void (#0F1941) on a #141C3D surface —
     the most important segment in the grid was effectively invisible in dark
     mode, which is how a manager reads a full bar as an empty one. */
  /* Time off gets its OWN segment token (user 2026-08-06). Tracked time off is
     inside non-billable by rule, so without a separate mark a week of PTO and a
     week of unbilled project work draw the identical bar — and "why is your
     non-billable so high" gets asked of someone who was on holiday. Warm sand
     is a hue step away from the cool slate of real non-billable work, which is
     the distinction being drawn. */
  --seg-bill:#0F1941; --seg-nonbill:#64748B; --seg-idle:#E7DDD2; --seg-off:#C08B5C;
  /* ── Left sidebar (redesign 2026-08-17) ──
     The rail is DARK IN BOTH THEMES and therefore owns its own token set rather
     than reusing --surface/--text. Navigation is chrome: if it inverted with the
     page it would read as a sixth panel in light mode, which is the horizontal
     tab strip's problem all over again. Only the accent (--orbe) is shared. */
  --navw:212px;
  --nav-bg:#0B1230; --nav-text:#FFFAF5; --nav-muted:#98A6C8;
  --nav-border:#1B2551; --nav-hover:#151E45; --nav-active:#1E2A5E;
}
[data-theme="dark"]{
  --bg:#090F26; --surface:#141C3D; --surface-2:#0F1733;
  --border:#1E295A; --text:#FFFAF5; --muted:#94A3B8;
  --up:#34D399; --down:#FB7185; --neutral:#1E295A;
  --winner:#FF9B87; --pos:#34D399; --warn:#FDBA74; --amber:#FDBA74;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  /* Dark chart marks are SELECTED against the dark surface, not flipped from
     light. The light amber (#CA8A04) is invisible on #141C3D; #FBBF24 clears it
     and lifts CVD separation from the old --amber pairing (ΔE 4.4 protan, a
     fail) to 10.6. These sit slightly above the validator's 0.43–0.77 lightness
     band on purpose — that band is calibrated for a light surface, and marks on
     a near-black panel have to be lighter to hold 3:1 contrast, which they do. */
  --c-good:#34D399; --c-warn:#FBBF24; --c-bad:#FB7185;
  --c-series:#38BDF8; --c-ref:#94A3B8; --c-target:#7BA4FF;
  --grid:#1E295A; --plot:#141C3D;
  /* The rail's BACKGROUND is deliberately not redefined here — it is chrome and
     stays dark in both themes. Its EDGE is, because in dark mode the rail and
     the page are both near-black and the light-mode border disappears against
     them: the rail lost its outline entirely and read as page background with
     text floating on it. Brightening only the border keeps the "one dark rail,
     accents move" rule while restoring the separation the eye needs. */
  --nav-border:#2B3A78;
  /* Billable takes the series blue so a filled bar reads as filled; non-billable
     stays a cool grey a clear step away from it; idle is a near-surface navy so
     empty capacity reads as absence rather than as another kind of work. */
  --seg-bill:#38BDF8; --seg-nonbill:#94A3B8; --seg-idle:#222D57; --seg-off:#E9A76B;
}
/* Fluid type/space scale — every font-size and several key dimensions below multiply
   this token, so laptop and (especially) ultrawide screens get visibly bigger text and
   controls instead of the same fixed-size column floating in empty margin. */
@media(max-width:420px){:root{--scale:.94}}
@media(min-width:1024px){:root{--scale:1.08}}
@media(min-width:1440px){:root{--scale:1.16}}
@media(min-width:1920px){:root{--scale:1.28}}
@media(min-width:2560px){:root{--scale:1.4}}
@media(min-width:3440px){:root{--scale:1.5}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Roboto','Franklin Gothic Book',-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);padding:calc(16px*var(--scale));
     padding-left:calc(var(--navw) + 16px*var(--scale))}
/* Collapse toggle. The class sits on <body>, so the rail (a child) inherits the
   narrowed --navw and the body's own left padding follows it in the same rule —
   one token drives both, and they can never drift out of step. */
body.navCollapsed{--navw:56px}
/* Narrow screens force the icon rail regardless of the user's toggle: a 212px
   rail on a phone is a third of the viewport. The toggle still works — it just
   has nothing left to collapse until there is room for labels again. */
@media(max-width:900px){
  body{--navw:56px}
  .navName,.tabLbl,.navToggleLbl{display:none}
  .tab,.navToggle,.navBrand{justify-content:center;padding-left:0;padding-right:0}
}
/* Identity Lockdown typography: headings + hero numbers in the condensed face */
h1,h2,h3,.title,.tile .big{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
/* Sticky filter bar: KPIs scroll away, Region/Team/Family/search stay pinned
   (user feedback 2026-07-31: while scrolling, only filters + table header remain).
   Two intentional rows (feedback round 2 — the flat chip strip read as one messy
   row): identity + action buttons on top, labeled filter groups below. */
.hdr{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
     position:sticky;top:0;z-index:100;background:var(--bg);
     padding:calc(8px*var(--scale)) 0;border-bottom:1px solid var(--border)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* The advanced-filter drawer. `display:flex` on .hrow beats the UA's
   [hidden]{display:none}, so the collapsed state has to be declared here or the
   drawer never actually closes. Indented and rule-led so an open drawer reads
   as a continuation of the bar above rather than a second, competing bar. */
.hrow.fadv[hidden]{display:none}
.hrow.fadv{padding-left:10px;border-left:2px solid var(--border)}
/* The count of active hidden filters, worn by the toggle. Coloured, because it
   is the one thing on the bar that says "a scope you cannot see is applied". */
#btnAdvFilters .advN{color:var(--amber);font-weight:800}
/* Labeled segmented control per filter group — a group reads as ONE control:
   tiny uppercase name + joined pills sharing a border. */
.fgroup{display:flex;align-items:center;gap:7px}
.fgroup .flbl{font-size:calc(9px*var(--scale));color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.seg{gap:0;display:inline-flex;border:1px solid var(--border);border-radius:999px;
     overflow:hidden;background:var(--surface)}
.seg .chip{border:none;border-radius:0;background:transparent}
.seg .chip+.chip{border-left:1px solid var(--border)}
.seg .chip.on{background:var(--orbe);color:#fff}
.hdr h1{font-size:calc(19px*var(--scale));font-weight:800}
.hdr .sub{color:var(--muted);font-size:calc(12px*var(--scale))}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;
     padding:6px 12px;font-size:calc(12px*var(--scale));cursor:pointer;color:var(--text)}
.btn:hover{filter:brightness(.97)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--border);border-radius:999px;padding:4px 12px;cursor:pointer;
      font-size:calc(11px*var(--scale));background:var(--surface)}
.chip.on{background:var(--orbe);border-color:var(--orbe);color:#fff}
select,input[type=search]{background:var(--surface);border:1px solid var(--border);
      border-radius:8px;padding:6px 10px;font-size:calc(12px*var(--scale));color:var(--text)}
/* The filter row must NOT reflow when a cascade changes its text (user report
   2026-08-04: "filters move their position"). A select sizes itself to its
   longest option, so every cascade rebuild resized it — and in a wrapping flex
   row that moves every control after it, sometimes onto another line, right as
   the user reaches for it. Fixed widths pin the row: the closed control may
   clip a long selection, but the open list and the tooltip carry it in full. */
#teamSel,#pmSel{width:calc(150px*var(--scale))}
#famSel{width:calc(175px*var(--scale))}
#personSearch{width:calc(140px*var(--scale))}
/* ── MULTISELECT FILTERS (2026-08-28) ─────────────────────────────────────────
   Team / PM / Job family: a button that reads like the old select, a checkbox
   panel under it. position:relative + absolute panel so opening one never
   reflows the filter row — the same no-reflow contract the fixed widths keep. */
.ms{position:relative;display:inline-block}
.msBtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-size:calc(12px*var(--scale));color:var(--text);
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msBtn.on{border-color:var(--orbe);box-shadow:0 0 0 1px var(--orbe) inset}
.msBtn .msCaret{float:right;color:var(--muted)}
.msPanel{position:absolute;top:calc(100% + 4px);left:0;z-index:60;min-width:100%;
  max-width:320px;max-height:300px;overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:6px}
.msPanel .msHead{padding:4px 8px 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.msRow{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;
  font-size:calc(12px*var(--scale));cursor:pointer;white-space:nowrap}
.msRow:hover{background:var(--bg)}
.msRow input{margin:0}
.msRow.msOff{color:var(--muted);cursor:default}
.msDeadHead{padding:6px 8px 2px;color:var(--muted);font-size:calc(10px*var(--scale))}
#periodPick{width:calc(150px*var(--scale))}
/* Chips: tabular figures + a width floor so a live count changing from 140 to
   7 doesn't change the chip's size (the Region strip re-counts on every click). */
.chip{font-variant-numeric:tabular-nums}
#regionChips .chip{min-width:calc(78px*var(--scale));text-align:center}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;
       padding:16px;box-shadow:var(--shadow)}
/* ── EXECUTIVE TIERS (redesign 2026-08-17) ────────────────────────────────────
   The Executive tab is a three-tier hierarchy — the protagonist KPIs, then the
   context that explains them, then background/housekeeping. The tiers are
   SEMANTIC, not decorative: a card's tier is a statement about how much of an
   executive's attention it has earned, so each one is a labelled section rather
   than an unmarked run of panels a reader has to infer a hierarchy from. */
.tier{margin-bottom:calc(22px*var(--scale))}
.tierHead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;
  font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
  font-size:calc(12px*var(--scale));font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--muted)}
.tierHead .tierNote{font-family:'Roboto',sans-serif;font-size:calc(11px*var(--scale));
  font-weight:400;text-transform:none;letter-spacing:0}
/* Tier 1 cards are the largest and most visually distinct things on the page:
   a wider grid track, a bigger hero figure, more padding and a deeper shadow.
   Everything below them is deliberately quieter. */
.tiles.tier1{grid-template-columns:repeat(auto-fit,minmax(calc(228px*var(--scale)),1fr));
  gap:calc(12px*var(--scale))}
.tiles.tier1>.tile{padding:16px 18px;border-radius:14px;
  box-shadow:0 1px 2px rgba(15,25,65,.05),0 10px 28px rgba(15,25,65,.09)}
[data-theme="dark"] .tiles.tier1>.tile{box-shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4)}
.tiles.tier1>.tile .big{font-size:calc(34px*var(--scale));line-height:1.05}
.tiles.tier1>.tile .lbl{font-size:calc(10.5px*var(--scale));font-weight:700}
/* Tier 3 sits back: no shadow, a quieter ground — present for the people who
   need it, never competing with the two tiers above. */
.tier3 .panel{box-shadow:none;background:var(--surface-2)}
/* Contextual callout — a reassurance or caveat attached to the number directly
   above it. Left rule rather than a coloured fill: it must read as an aside on
   the same surface, not as an alert. */
.ctxNote{border-left:3px solid var(--orbe);border-radius:0 8px 8px 0;
  background:var(--surface-2);padding:10px 12px;margin-top:10px;
  font-size:calc(11.5px*var(--scale));color:var(--muted);line-height:1.5;max-width:96ch}
.ctxNote b{color:var(--text)}
/* Smart legend — the criteria behind each backlog segment, stated rather than
   left to a tooltip. A swatch alone says "these are different"; the reader also
   needs to know WHAT puts an item in each one before arguing about the split. */
.smartLegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(210px*var(--scale)),1fr));
  gap:8px calc(16px*var(--scale));margin-top:8px}
.legItem{display:flex;gap:8px;align-items:flex-start;font-size:calc(11px*var(--scale));
  color:var(--muted);line-height:1.45}
.legSwatch{flex:0 0 12px;width:12px;height:12px;border-radius:3px;margin-top:2px;
  border:1px solid var(--border)}
.legItem b{color:var(--text);font-size:calc(11.5px*var(--scale))}
/* Drill-through row — the chart's exit. Set apart with a top rule and a tinted
   ground so it reads as "do something" rather than as one more caption under a
   chart already carrying three of them. */
/* In-page sub-tabs (2026-08-17). Underline tabs, not pills: the rail already
   owns the "which place am I in" job, and a second set of filled chips would
   compete with it. These say "which lens", which is a lighter promise. */
.subtabs{display:flex;gap:calc(4px*var(--scale));align-items:flex-end;
  border-bottom:1px solid var(--border);margin:0 0 calc(18px*var(--scale))}
.subtab{background:transparent;border:none;border-bottom:2px solid transparent;
  padding:9px 14px 8px;cursor:pointer;color:var(--muted);font-family:inherit;
  font-size:calc(13px*var(--scale));font-weight:600;white-space:nowrap;
  margin-bottom:-1px}
.subtab:hover{color:var(--text)}
.subtab.on{color:var(--text);border-bottom-color:var(--orbe)}
.subtab .stCount{font-weight:400;color:var(--muted);font-size:calc(11px*var(--scale))}
/* Three scannable figures replacing a paragraph. Big number, small label, no
   card chrome — they are a sentence read left to right, not four more tiles. */
.statRow{display:flex;flex-wrap:wrap;gap:calc(28px*var(--scale));margin-bottom:10px}
.statCell .statVal{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
  font-size:calc(30px*var(--scale));font-weight:800;line-height:1.05;
  font-variant-numeric:tabular-nums}
.statCell .statLbl{font-size:calc(10px*var(--scale));color:var(--muted);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
.statCell .statSub{font-size:calc(11px*var(--scale));color:var(--muted);margin-top:2px}
/* Flow clusters — a labelled group per question, so eight cards read as three
   answers instead of one wall. */
.cluster{margin-top:12px}
.cluster:first-of-type{margin-top:0}
.clusterHead{font-size:calc(10.5px*var(--scale));font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
/* In-cell micro-bar. Sits BEHIND the number at low opacity: the cell is still a
   table cell that reads as text, with a length cue underneath it. Absolutely
   positioned so it never affects row height or column width — a bar that
   reflowed the table would cost the space it was added to save. */
.gridCell{position:relative;isolation:isolate}
.gridCell .cellBar{position:absolute;left:0;top:50%;transform:translateY(-50%);
  height:calc(100% - 8px);border-radius:3px;opacity:.16;z-index:-1;pointer-events:none}
[data-theme="dark"] .gridCell .cellBar{opacity:.28}
/* Offender row — a left rule, not a fill: a tinted row would fight the in-cell
   bars for the same surface and make a table of eight rows look like an alert. */
/* A clickable KPI card. The affordance is deliberately quiet — cursor, a hover
   lift and a selected outline. A button-styled KPI card would read as an action
   ("do this") when it is a lens ("show me this"). */
/* The primary of the two destinations — used only when the selected metric
   makes one of them the obvious next step, never both at once. */
.btnPrimary{border-color:var(--orbe);color:var(--orbe);font-weight:700}
.tileDrill{cursor:pointer}
.tileDrill:hover{border-color:var(--orbe)}
.tileDrill:focus-visible{outline:2px solid var(--orbe);outline-offset:2px}
/* One-click drill-through cells (2026-08-18): the pointer + hover ring say
   "this navigates" before the tooltip does — no invisible click targets. */
.gridCell.go{cursor:pointer}
.gridCell.go:hover{box-shadow:inset 0 0 0 1px var(--orbe)}
.gridCell.go:focus-visible{outline:2px solid var(--orbe);outline-offset:-2px}
.tileSel{border-color:var(--orbe);box-shadow:0 0 0 1px var(--orbe) inset,
  0 1px 2px rgba(15,25,65,.05),0 10px 28px rgba(15,25,65,.09)}
.rowOffender>td:first-child{box-shadow:inset 3px 0 0 var(--c-bad)}
.rowOffender>td{background:color-mix(in srgb, var(--c-bad) 5%, transparent)}
.offMark{color:var(--c-bad);font-weight:700;margin-right:4px}
/* Drill-down row selection (user 2026-08-17): the row IS a control, so it gets
   a pointer, a visible active state and a focus ring. Declared AFTER
   .rowOffender so a row that is both selected and failing shows the selection
   bar — the ▸ offender glyph still marks the failure. */
.gridTable tbody tr{cursor:pointer}
.gridTable tbody tr:focus-visible{outline:2px solid var(--c-target);outline-offset:-2px}
.rowActive>td{background:color-mix(in srgb, var(--c-target) 12%, transparent)}
.rowActive>td:first-child{box-shadow:inset 3px 0 0 var(--c-target)}
/* Over-allocation pill: planned hours past scheduled capacity is a burnout
   signal, never a "negative availability" — red is earned here. */
.pillOver{display:inline-block;padding:1px 8px;border-radius:999px;font-weight:700;
  font-size:calc(11px*var(--scale));color:var(--c-bad);
  background:color-mix(in srgb, var(--c-bad) 14%, transparent);
  border:1px solid color-mix(in srgb, var(--c-bad) 45%, transparent)}
/* Key queue. Collapsed to a count by default; expanded into columns that fill
   the width available rather than a fixed four, so the same markup reads on a
   laptop and an ultrawide. min() keeps it from collapsing to one column on a
   narrow pane. */
/* Methodology overlay. Reference material one click away, and off the page the
   rest of the time. Backdrop click and the Close button both dismiss it; a
   click inside the box does not. */
.methodOverlay{position:fixed;inset:0;z-index:400;background:rgba(15,25,65,.45);
  display:flex;align-items:center;justify-content:center;padding:24px}
.methodOverlay[hidden]{display:none}
.methodBox{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow);max-width:min(720px,100%);max-height:82vh;display:flex;
  flex-direction:column;overflow:hidden}
.methodHead{display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--border);font-size:calc(13px*var(--scale))}
.methodHead .btn{margin-left:auto}
.methodBody{padding:14px 16px;overflow-y:auto;font-size:calc(11.5px*var(--scale));
  color:var(--muted);line-height:1.55;max-width:96ch}
.methodBody b{color:var(--text)}
.methodBody ul{margin:8px 0 0;padding-left:18px}
.methodBody li{margin-bottom:6px}
/* A link that is a button: no chrome, so it reads as the aside it is. */
.linkBtn{background:none;border:none;padding:0;cursor:pointer;color:var(--orbe);
  font-family:inherit;font-size:calc(11.5px*var(--scale));font-weight:600;white-space:nowrap}
.linkBtn:hover{text-decoration:underline}
/* The key queue owns a full-width row of its own, so the grid is sized by the
   panel rather than by the three numeric columns beside it. */
.keyRow{padding:2px 0 10px !important}
.keyBox>summary{cursor:pointer;font-size:calc(11.5px*var(--scale));color:var(--orbe);
  font-weight:600;padding:2px 0}
.keyBox[open]>summary{margin-bottom:6px}
.keyTools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.keyGrid{display:grid;gap:2px calc(14px*var(--scale));
  grid-template-columns:repeat(auto-fill,minmax(min(120px,100%),1fr));
  max-height:calc(320px*var(--scale));overflow-y:auto;
  border-top:1px solid var(--border);padding-top:6px}
.keyCell{font-size:calc(11px*var(--scale));font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drillActions{flex:0 0 auto;gap:8px}
.drillRow{margin-top:12px;padding:12px;border-top:1px solid var(--border);
  border-radius:0 0 10px 10px;background:var(--surface-2)}
.drillRow .btn{font-weight:600}
.loading{padding:60px;text-align:center;color:var(--muted)}
/* Cold-start progress. The wait is real and can run into minutes, so the panel
   has to hold attention honestly rather than repeat one static sentence: a
   headline that changes as the stages pass, a live elapsed clock so the reader
   can see it is still moving, and the one instruction that actually matters. */
.loadWrap{max-width:520px;margin:0 auto;text-align:left}
.loadHead{font-size:calc(14px*var(--scale));font-weight:600;color:var(--fg);
          text-align:center;margin-bottom:4px}
.loadElapsed{text-align:center;font-variant-numeric:tabular-nums;font-size:calc(11px*var(--scale));
             color:var(--muted);margin-bottom:14px}
.loadBar{height:4px;border-radius:2px;background:color-mix(in srgb,var(--muted) 20%,transparent);
         overflow:hidden;margin-bottom:14px}
/* Indeterminate — it must NOT imply a known percentage. We genuinely cannot
   measure progress server-side, and a bar that crept toward 100% would be
   inventing one, then stalling there for two minutes. */
.loadBar i{display:block;height:100%;width:38%;border-radius:2px;background:var(--muted);
           animation:loadSlide 1.5s ease-in-out infinite}
@keyframes loadSlide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
@media (prefers-reduced-motion:reduce){.loadBar i{animation:none;width:100%;opacity:.45}}
.loadNote{font-size:calc(11.5px*var(--scale));line-height:1.5;color:var(--muted)}
.loadNote b{color:var(--fg)}
/* Flex column, so the mini line chart can be pinned to the BOTTOM of the card
   (rule below). A tile row is a grid of stretched cards, but its content is
   top-aligned, so a card carrying three context lines pushed its sparkline
   ~40px lower than the card beside it carrying one — the flow band mixes three
   tile grammars (tileHtml_, flowTileHtml_, backlogTileHtml_) with 1–4 lines
   each in ONE grid, so the charts landed at four different heights and the row
   stopped reading as a comparable set (user 2026-08-07: "some KPI mini line
   charts are out of place"). Trimming lines was the 2026-08-05 fix and it does
   not hold: the line count is data-dependent. Aligning the baselines in CSS
   does, whatever each card happens to say. */
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;
      display:flex;flex-direction:column}
/* The spark (and, where a caption belongs to it, the caption+spark pair) is the
   only thing that moves — every text line stays stacked under the hero, and the
   slack collects between the last line and the chart. Scoped to .spark, not
   .chart: a full-size chart inside a tile is the tile's content, not its
   footer. flex:0 0 auto keeps the SVG at its aspect ratio instead of being
   shrunk by the flex algorithm. */
.tile>.spark,.tile>.sparkWrap{margin-top:auto;flex:0 0 auto}
.sparkWrap>.spark{margin-top:0}
.tile .lbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .big{font-size:calc(26px*var(--scale));font-weight:800;margin:2px 0}
.tile .big.g{color:var(--pos)} .tile .big.a{color:var(--amber)} .tile .big.r{color:var(--warn)}
.tile .cmp{font-size:calc(11px*var(--scale));color:var(--muted)}
/* VARIANCE ACCENT (review item #2, 2026-08-17). A card missing its target wears
   a coloured left edge plus a barely-there wash, so a row of cards can be
   scanned for trouble before any number is read.

   An EDGE, not a filled background: a tinted card competes with its own hero
   number for contrast, and the hero is already coloured against the same
   target. The wash is deliberately at the threshold of visible — enough to
   group the card as "this one", not enough to restate the verdict a third time.

   Two levels, not one. Amber (.vNear) is half the weight of red (.vMiss)
   because "approaching the bar" and "through the bar" are different
   conversations; one shared alarm colour for both is what the per-metric RAG
   was introduced to fix. Never colour alone — the hero glyph and the delta
   sentence carry the same verdict in text, so this survives a photocopy and a
   colour-vision difference by not being the only signal.

   Mixed into var(--surface), never into `transparent`: the base .tile rule
   paints the card surface, and a translucent wash would replace it rather than
   sit on it — the card would lose its own ground and pick up whatever the tier
   behind it happens to be, which differs between light and dark.

   The edge is a ::before BAR, not an inset box-shadow. The first attempt used
   `box-shadow:inset 3px 0 0` and rendered on nothing in Tier 1, because
   `.tiles.tier1>.tile` (specificity 0,3,1) sets the card's elevation shadow and
   outranks `.tile.vMiss` (0,2,0) — the property was simply replaced. A
   pseudo-element does not compete with the shadow at all, so the accent and the
   elevation can both be true. Caught by screenshot; a markup assertion cannot
   see a property it lost a cascade fight over.

   Inset 8px top and bottom rather than running the full height: at the card's
   12–14px corner radius a full-height 3px bar pokes out past the rounded
   corner, and rounding the bar to match would need it to know which radius its
   tier uses. A floating marker sidesteps that and reads as deliberate. */
.tile.vMiss,.tile.vNear{position:relative}
.tile.vMiss::before,.tile.vNear::before{content:"";position:absolute;left:0;top:8px;bottom:8px;
  width:3px;border-radius:0 3px 3px 0}
.tile.vMiss::before{background:var(--warn)}
.tile.vNear::before{background:var(--amber)}
.tile.vMiss{background:color-mix(in srgb,var(--warn) 4%,var(--surface))}
.tile.vNear{background:color-mix(in srgb,var(--amber) 3%,var(--surface))}
/* The target rule's own label. Quieter than the axis dates it shares a class
   with: it names a reference, and a reference that shouts is a second series. */
.chart .tgtlabel{opacity:.75;font-weight:600}
/* Hero row = the number and the bar it is graded against, side by side.
   The target used to be restated inside the delta sentence on every card
   ("▼ 44 pts vs target ≥85%") — redundant beside a number already coloured
   against that same target (user 2026-08-06). It is now printed ONCE, quiet
   and baseline-aligned next to the hero, which frees the delta line to say
   only how far off we are and how it moved.
   .tgt is a SIBLING of .big, never a child: the count-up animation rewrites
   .big's textContent on load and would swallow a nested chip. */
.tile .heroRow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0}
.tile .heroRow .big{margin:0}
.tile .tgt{font-size:calc(10px*var(--scale));color:var(--muted);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  border:1px solid var(--border);border-radius:999px;padding:1px 8px}
/* Window phase, worn by the hero (2026-08-06). An unfinished window has to be
   unmissable ON THE CARD, not only in the picker: cards get screenshotted into
   decks one at a time, and "41%" from a half-elapsed month pasted into a board
   pack is the failure this chip exists to prevent. Dashed for "not settled";
   amber for in-flight, plain for planning — a plan is not a warning. */
.tile .tgt.phase{border-style:dashed;border-color:var(--amber);color:var(--amber)}
.tile .tgt.phase.plan{border-color:var(--border);color:var(--muted)}
.tile.tPhase{border-style:dashed}
.tile.ph{opacity:.55;border-style:dashed}
/* Compact tier (spec 2026-08-05 §4.1): the flow tiles sit under the primary
   KPI cards in the Executive strip, so they read as a second, quieter row
   rather than five more headline numbers competing for the same weight. */
.tilesCompact .tile{padding:10px 12px}
.tilesCompact .big{font-size:calc(20px*var(--scale));line-height:1.2}
.tilesCompact .lbl{font-size:calc(10px*var(--scale))}
/* ── Backlog-band density (user 2026-08-07: the band took so much of the
   Executive tab that the masthead's own conclusion and the ruler could not be
   read in one screen) ──
   Nothing is removed and no row is demoted out of the band: three tile rows
   that each reserved headline padding and a two-sentence prose header are
   simply asked to cost what they are worth. The hero triplet keeps its 26px
   figure (it is the reason to look at the band at all) and gives up only the
   compact tier's padding; the workforce and assigned rows wear .tilesCompact,
   which already exists for exactly this "quieter second row" purpose. */
#backlogBand .tiles{margin-bottom:8px}
#backlogBand .tiles .tile{padding:10px 12px}
/* The long explanations did not get deleted — they moved into the native
   tooltip, which is how every other dense surface on this page carries its
   caveats (the filter bar, the utilization footnotes, the metric formulas).
   A dotted underline + the ⓘ says there is more to read, so a caveat that is
   one hover away never reads as a caveat that was dropped. */
.why{border-bottom:1px dotted var(--border);cursor:help}
/* ── Confidence + suppression (FR-2.1/2.2) ──
   A suppressed tile is styled as a distinct STATE, not a greyed-out number:
   dashed border, no hero figure, the coverage and the owner in its place. The
   glyphs (◆ ◈ ◇, ✔ ▲ ✖) carry the same information as the colour, so the read
   survives a monochrome board pack and a colour-vision difference (FR-4.4). */
.tile.sup{border-style:dashed;border-color:var(--amber)}
.tile .supbig{font-size:calc(15px*var(--scale));font-weight:700;color:var(--amber);
              margin:4px 0;cursor:help;font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
.conf{font-size:calc(10px*var(--scale));font-weight:700;cursor:help;letter-spacing:.02em}
.conf.chigh{color:var(--pos)} .conf.cmedium{color:var(--amber)} .conf.clow{color:var(--warn)}
.hyglink{color:var(--orbe);font-weight:700;text-decoration:none}
.hyglink:hover{text-decoration:underline}
.stalenote{color:var(--warn);font-weight:700}
/* .profPanel: shared panel chrome for the 🧬 field-fill-by-issue-type matrix
   (built to be SCREEN-SHARED live, user 2026-08-04 — bigger type so a room can
   read it). */
.profPanel { border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin: 10px 0; }
.profPanel h4 { margin: 0 0 4px; font-size: calc(17px*var(--scale)); }
/* ── 👁 Confidential view ────────────────────────────────────────────────────
   The control is a header button like Reset/Refresh, not a special object: it
   is a mode you turn on and off, and dressing it up would suggest it does
   something to the DATA rather than to what is on screen. It earns colour only
   when it is ON, so an armed state and a safe one cannot be confused at a
   glance across a room — which is the exact situation it exists for. */
.confBtn{display:inline-flex;align-items:center;gap:6px}
.confBtn svg{width:calc(13px*var(--scale));height:calc(13px*var(--scale));flex:none}
.confBtn.on{border-color:var(--amber);color:var(--amber);
            background:color-mix(in srgb,var(--amber) 10%,var(--surface))}
.confBtn:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.confBanner{border:1px solid var(--amber);border-radius:12px;padding:10px 14px;margin-bottom:14px;
            background:color-mix(in srgb,var(--amber) 7%,var(--surface));
            font-size:calc(11.5px*var(--scale));line-height:1.55}
.confBanner a{color:var(--royal);font-weight:700}
/* THE BLUR ITSELF. Applied from a single class on <body>, so turning the mode
   on costs one class change and cannot drift out of step with what is drawn.
   `user-select:none` because a blurred name is still selectable text, and a
   presenter who drags across the roster would otherwise paste it into the chat
   they are sharing. The layout does not move: blurring keeps the glyphs, so
   column widths, truncation and row heights are identical either way — a mode
   that reflowed the page would make the presenter lose their place.
   A radius under ~4px leaves longer names guessable at full-screen, which is
   the one thing this must not do. */
.pii{transition:filter .12s}
body.confOn .pii{filter:blur(5px);user-select:none;cursor:default}
/* The roster name is a link-ish target; without this the pointer still invites
   a click on something nobody can read. */
body.confOn .rosterName{cursor:default}
@media (prefers-reduced-motion:reduce){ .pii{transition:none} }
/* ── ACCESS CONTROL (admin) ──────────────────────────────────────────────────
   THE LIST IS THE MODEL. This page used to be two text inputs holding
   comma-separated addresses, with the bootstrap admin mentioned in a sentence
   above them. Three things were wrong with that, and only one of them was that
   it looked bad:
     · a joined string is not a list — you cannot count it, scan it, or remove
       one person from it without editing text, and a stray comma silently
       creates an entry nobody notices until somebody cannot get in;
     · "who has access" was split across a sentence and two strings, so no
       single thing on screen answered the only question the page exists for;
     · open access — the one control that lets in people who are on no list at
       all — was a checkbox with exactly the weight of everything else.
   Every person with access is now a ROW, the bootstrap admin included.

   No new colour tokens: the rails reuse --royal (admin) and --slate (viewer),
   and --amber is spent in exactly one place, on open access. */
.accHead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.accHead h3{flex:1;margin:0}
.accGrid{display:grid;gap:14px;margin:12px 0}
@media (min-width:900px){ .accGrid.two{grid-template-columns:1fr 1fr} }
.accCard{border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden}
.accCardHead{display:flex;align-items:baseline;gap:8px;padding:10px 14px;
             border-bottom:1px solid var(--border);background:var(--surface)}
.accCardHead b{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
               font-size:calc(12px*var(--scale));text-transform:uppercase;letter-spacing:.06em}
.accCount{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.accWhat{flex:1;text-align:right;color:var(--muted);font-size:calc(10.5px*var(--scale))}
.accRow{display:flex;align-items:center;gap:10px;padding:8px 14px;
        border-bottom:1px solid var(--border);border-left:3px solid transparent}
.accRow:last-of-type{border-bottom:none}
.accRow.isAdmin{border-left-color:var(--royal)}
.accRow.isViewer{border-left-color:var(--slate)}
.accRow:hover{background:var(--surface)}
/* THE ONE TYPE MOVE, and it is derived from the content rather than from taste:
   every address on this list ends in the same domain, so the domain is noise
   repeated on every row while the local part is the only thing identifying
   anybody. Dimming it turns a column of addresses into a column of names
   without hiding a character of it. */
.accWho{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
        font-size:calc(12px*var(--scale))}
.accName{font-weight:700}
.accDomain{color:var(--muted)}
.accTag{font-size:calc(9px*var(--scale));text-transform:uppercase;letter-spacing:.05em;
        border:1px solid var(--border);border-radius:999px;padding:1px 8px;
        color:var(--muted);background:var(--surface);white-space:nowrap}
.accRm{background:transparent;border:1px solid transparent;border-radius:8px;color:var(--muted);
       cursor:pointer;font:inherit;font-size:calc(11px*var(--scale));padding:2px 8px}
.accRm:hover{color:var(--warn);border-color:var(--border);background:var(--surface)}
.accRm:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.accAdd{display:flex;gap:8px;padding:10px 14px;background:var(--surface);
        border-top:1px solid var(--border)}
.accAdd input{flex:1;min-width:0;font:inherit;font-size:calc(12px*var(--scale));padding:6px 10px;
              border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.accAdd input:focus-visible{outline:2px solid var(--royal);outline-offset:1px}
.accSay{padding:0 14px 10px;font-size:calc(11px*var(--scale));color:var(--muted);background:var(--surface)}
.accSay.bad{color:var(--warn)}
.accSay.warn{color:var(--amber)}
.accEmpty{padding:16px 14px;color:var(--muted);font-size:calc(11.5px*var(--scale))}
/* Open access is the only control here that grants access to people who are on
   no list, so it is the only one that gets colour — and it only gets it when
   it is ON, because an armed switch and a safe one must not look alike. */
.accOpen{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.accOpen.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--surface))}
.accSwitch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;
           font-size:calc(12px*var(--scale))}
.accSwitch input{position:absolute;opacity:0;width:0;height:0}
.accTrack{width:38px;height:22px;border-radius:999px;background:var(--border);
          position:relative;transition:background .15s;flex:none}
.accTrack::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
                 background:var(--surface);box-shadow:0 1px 2px rgba(15,25,65,.25);transition:transform .15s}
.accSwitch input:checked + .accTrack{background:var(--amber)}
.accSwitch input:checked + .accTrack::after{transform:translateX(16px)}
.accSwitch input:focus-visible + .accTrack{outline:2px solid var(--royal);outline-offset:2px}
.accBar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.accPending{flex:1;font-size:calc(11.5px*var(--scale));color:var(--muted)}
.accPending b{color:var(--text)}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:hover{filter:none}
@media (prefers-reduced-motion:reduce){ .accTrack,.accTrack::after{transition:none} }
/* ── Tables shared by the gates editor and the epic-due key list ──
   .hnav / .hper (the deleted gaps queue window banner) and td.hnum / .hbar (its
   coverage cell and fill bar) went with that table on 2026-08-17. table.hyg
   itself stays: the gate editor and the epic-due list both use it. */
.gedit{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.gedit summary{cursor:pointer;font-weight:700;font-size:calc(12px*var(--scale))}
.gedit input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--border);
                          border-radius:6px;background:var(--surface);color:var(--text)}
table.hyg{border-collapse:collapse;width:100%;font-size:calc(11px*var(--scale))}
table.hyg th{text-align:left;color:var(--muted);font-weight:700;text-transform:uppercase;
             font-size:calc(9px*var(--scale));letter-spacing:.05em;padding:6px 8px;
             border-bottom:1px solid var(--border);white-space:nowrap}
table.hyg td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top}
/* ── .tmx — the DENSE NUMERIC TABLE layout ──
   Written for the 🧬 by-type matrix (removed 2026-08-17) and INHERITED by the
   surfaces that outlived it: the 👥 signals roster (.rosterTbl below), the
   comparison grid and the workforce pool grid. Kept under the same class name
   deliberately — three tables share one layout contract, and forking it per
   table is how two of them quietly stop matching.
   The rule that matters: EVERY column right of the name column is right-aligned,
   header included. The first cut left headers default-left over right-aligned
   values, which put each label over the gap between two columns instead of over
   its own data — the table looked misaligned because it was.
   The matrix's own cell decoration (.tcell / .tbar / .tmiss / .tepic) went with
   it; nothing emits those classes any more. */
table.hyg.tmx{table-layout:fixed}
table.hyg.tmx td,table.hyg.tmx th{padding:7px 10px;white-space:nowrap;
                                  border-bottom:1px solid var(--border)}
table.hyg.tmx th{padding-bottom:6px}
table.hyg.tmx .tnum{text-align:right}
/* The type name is the row's identity — it stays left, wraps, and is the one
   column allowed to be wide. Sticky so a horizontal scroll on a narrow screen
   never leaves a row of numbers with nothing naming it. */
table.hyg.tmx .tname{text-align:left;white-space:normal;width:26%;min-width:150px;
                     position:sticky;left:0;background:var(--surface);z-index:1}
table.hyg.tmx td.tn{font-weight:700;color:var(--muted);width:52px}
/* Zebra banding: at nine columns the eye loses its row on the way across. */
table.hyg.tmx tr:nth-child(even) td{background:var(--surface-2)}
table.hyg.tmx tr:nth-child(even) td.tname{background:var(--surface-2)}
/* Theme-neutral hover: a translucent grey reads on both the cream and the navy
   surface, so no second token is needed and neither theme can be forgotten. */
table.hyg.tmx tr:hover td{background:rgba(127,127,127,.12)}
/* 👥 Signals roster (spec §5.2) — RAG per CELL rather than per column, and a
   dot alone is never the whole story: sigCellHtml_ always prints the % text
   right beside it (FR-4.4). Uses the CHART tokens, not the text ones — in dark
   mode --warn and --amber are literally the same hex, survivable for words the
   ✔ ▲ ✖ marks already separate, fatal where colour is the only channel. */
.sigDot{font-size:12px}
.sigGood{color:var(--c-good)} .sigWarn{color:var(--c-warn)} .sigBad{color:var(--c-bad)}
.sigSmall{color:var(--muted)}
.pmProjRow td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--border)}
.drillItems{margin:8px 0}
.drillItems .needRow td{background:color-mix(in srgb,var(--c-bad) 6%,transparent)}
/* Intern cells: the SAME muted ink as an ungraded small-n cell, deliberately —
   both mean "shown, not judged", and inventing a second grey would suggest a
   second meaning. */
.sigLearn{color:var(--muted)}
/* Sticky column headers on the roster (user 2026-08-06). This is the ONE table
   with a row per active person, so it runs long enough that the header scrolls
   away and a bare "62%" stops saying WHICH field it grades — the same reason the
   retired People grid pinned its header.
   The header pins to the WRAPPER, not the page: .gwrap is already a scroll
   container (overflow-x:auto forces overflow-y to auto), so a page-level sticky
   top would resolve against a scrollport that never scrolls and never fire. Cap
   the wrapper and the header has a real edge to stick to; page scroll past the
   panel is untouched, and .shooting already uncaps this for the PNG export.
   box-shadow, not border-bottom: under border-collapse the border belongs to the
   collapsed grid rather than the cell, so it stays behind while the cell moves. */
.rosterWrap{max-height:70vh;overflow:auto}
/* The drill-down's reconciliation, collapsed (user 2026-08-10). Two jobs: keep
   the explanation available without spending five lines of every open row on it,
   and CAP ITS WIDTH — an uncapped sentence inside a colspan cell sets the whole
   roster table's width, and a roster you have to scroll sideways is unreadable.
   max-width in ch so it tracks the font rather than a guessed pixel count. */
.reconBox{margin-top:6px;max-width:96ch}
.reconBox>summary{cursor:pointer;font-size:calc(12px*var(--scale));color:var(--muted)}
.reconBox>summary:hover{color:var(--text)}
.reconBox>.cellSub{margin-top:4px;white-space:normal}
/* Same width cap on the detail row's own prose, for the same reason. */
tr.detailRow>td{white-space:normal}
tr.detailRow>td>.cellSub{max-width:96ch}
/* The drill-down nests its own table inside this cell. It must never be able to
   push the cell wider than the column span it sits in — an over-wide nested
   table drags the parent cell out past the table's right edge and paints over
   whatever is beside it. Scroll the inner table instead of growing the outer. */
tr.detailRow>td>.cellSub table.hyg{width:100%;table-layout:fixed}
tr.detailRow>td>.cellSub table.hyg td{overflow-wrap:anywhere}
/* ── "How to read this" ──
   The methodology is load-bearing and stays on the page, but folded: as running
   prose above the table it was five dense lines nobody read, which is the same
   as not stating it at all. */
details.howto{margin:6px 0 8px}
details.howto>summary{cursor:pointer;font-size:calc(11.5px*var(--scale));
  color:var(--muted);user-select:none}
details.howto>summary:hover{color:var(--text)}
.howtoBody{max-width:96ch;font-size:calc(11.5px*var(--scale));color:var(--muted);
  border-left:2px solid var(--border);padding:2px 0 2px 10px;margin-top:6px}
.howtoBody p{margin:4px 0}
.howtoBody ul{margin:4px 0 4px 16px;padding:0}
.howtoBody li{margin:3px 0;line-height:1.5}
/* The hours legend stays visible and on one line — it is read off a PNG, where
   a wrapped legend reads as two unrelated rows of swatches. */
.legendRow{max-width:none}
table.hyg.tmx.rosterTbl thead th{position:sticky;top:0;z-index:6;
  background:var(--surface);box-shadow:inset 0 -1px 0 var(--border)}
/* The corner cell is sticky on BOTH axes — it must outrank the body's sticky
   name column (z-index 1) and its own header row, or a horizontal scroll slides
   names over it. */
table.hyg.tmx.rosterTbl thead th.tname{left:0;z-index:7}
/* Scope tag chip — states which clock a column follows (SNAP / PERIOD / ORG)
   right on the header, so "why did this number not move when I picked another
   month" has its answer one glance away instead of in a tooltip nobody opens. */
.scopeTag{font-size:9px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px;vertical-align:middle}
/* Section kicker — a small caps label ABOVE a band's own heading (newspaper
   sense: the line above the headline that names the section), distinct from
   a scopeTag (which names a COLUMN's clock, not a band's section). */
.kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
/* Executive data-trust strip (Task 8, spec §4.4) — four org-wide fill-vs-gate
   tiles, same trust-at-a-glance grammar as the KPI cards above them. */
.trustRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.trustItem{border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.trustVal{font-weight:700;font-size:calc(18px*var(--scale))}
.trustBar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:4px 0}
.trustBar i{display:block;height:100%}
.dUp{color:var(--pos);font-weight:700} .dDown{color:var(--warn);font-weight:700}
.lgd{font-size:calc(9px*var(--scale));color:var(--muted);margin-right:10px;white-space:nowrap}
.lgd i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:3px}
.attn{font-size:calc(11px*var(--scale));font-weight:700;margin-bottom:6px}
.gwrap{overflow-x:auto}
/* Descendant, not child: the roster's capped scroller is nested inside
   #rosterPanel, while savePng_ puts .shooting on the whole 🎯 view — a child
   selector would leave the roster capped and the PNG would show only the rows
   that happened to be scrolled into view. */
.shooting .gwrap{max-height:none;overflow:visible}
table.grid{width:100%;border-collapse:collapse;font-size:calc(12px*var(--scale))}
.grid th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:8px;text-align:center;cursor:pointer;user-select:none;white-space:nowrap;
  position:sticky;top:0;background:var(--surface);z-index:5}
.grid th.now{border-bottom:2px solid var(--orbe);color:var(--orbe)}
.grid th.plan,.grid td.plan{opacity:.75}
.grid td{padding:6px 8px;border-top:1px solid var(--border);text-align:center;white-space:nowrap}
.grid td.name{text-align:left;font-weight:600;min-width:150px}
.grid td.tG{background:rgba(31,138,87,.14)} .grid td.tA{background:rgba(180,83,9,.14)}
.grid td.tR{background:rgba(194,65,12,.16)}
.grid th.exp{background:var(--surface-2)}
.bar{position:relative;height:16px;min-width:160px;border:1px solid var(--border);
     border-radius:4px;overflow:hidden;display:flex;cursor:pointer}
.bar .sB{background:var(--seg-bill)} .bar .sN{background:var(--seg-nonbill)}
.bar .sI{background:var(--seg-idle)}
/* Unclassified: tracked in Tempo, no NetSuite split. Hatched slate so it reads
   as "real work, unknown kind" — distinct from solid-slate non-billable. */
.bar .sU{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
/* 👥 Signals roster Hours cell (Task 6, 2026-08-05) — a small billable/
   non-billable/idle bar, same segment vocabulary and tokens as the retired
   People-grid .bar above, scaled down to sit inline in a table cell. */
.hbarMini{display:inline-flex;width:110px;height:9px;border-radius:4px;overflow:hidden;background:var(--surface-2);vertical-align:middle}
.hbarMini i{display:block;height:100%}
.hbarMini .segBill{background:var(--seg-bill)} .hbarMini .segNonbill{background:var(--seg-nonbill)} .hbarMini .segIdle{background:var(--seg-idle)}
.hbarMini .segOff{background:var(--seg-off)}
/* Person-state badges on the roster name (🎓 intern / 🌱 new hire / 🏖 on leave).
   Each one is the reason a row's numbers should be read differently, so it sits
   ON the name — the one place a reader is already looking. */
.stateBadge{margin-left:5px;cursor:help;font-size:calc(11px*var(--scale))}
/* The whole roster row is the toggle, so the whole row shows it: one pointer
   cursor on the <tr> rather than one on a single word inside it. */
tr.rosterRow{cursor:pointer}
.rosterName{font-weight:600}
/* Signal chip strip — the Executive pulse's buckets, as filters on the roster.
   Same .chip vocabulary as the header filters so it reads as a control, not a
   legend; a zero bucket stays in place, greyed, because a strip that changes
   length as you click stops being a fixed picture of the slice. */
.sigChips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.sigChips .chip{padding:3px 10px}
.sigChip.off{opacity:.45;cursor:default}
/* The pulse's counts are links into the filtered roster. Underlined on hover
   only — the row already reads as clickable, and five underlines in one
   sentence would look like an error state. */
.pulseLink{cursor:pointer;border-radius:6px;padding:0 3px}
.pulseLink:hover{background:rgba(127,127,127,.16);text-decoration:underline}
.planTick{position:absolute;top:-6px;font-size:9px;color:var(--royal);transform:translateX(-50%)}
.warnFlag{color:var(--warn);font-weight:700;margin-left:4px}
/* Small print must stay readable — was a raw 9px (unscaled), reported unreadable. */
.cellSub{font-size:calc(10.5px*var(--scale));color:var(--muted)}
tr.detail td{background:var(--surface-2);padding:12px 16px 14px;text-align:left}
.blbl{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;margin:6px 0 2px}
.btrack{position:relative;height:10px;background:var(--orbe);border-radius:3px;max-width:360px}
.bline{height:8px;border-radius:3px;max-width:360px;display:flex;overflow:hidden}
.bline .b{background:var(--seg-bill)} .bline .n{background:var(--seg-nonbill)}
.bline .u{background:repeating-linear-gradient(45deg,var(--seg-nonbill),var(--seg-nonbill) 3px,transparent 3px,transparent 6px)}
.bplanned{height:8px;background:var(--royal);border-radius:3px;max-width:360px;opacity:.85}
table.bklog{border-collapse:collapse;font-size:calc(11px*var(--scale));margin-top:2px}
.bklog th{font-size:calc(10px*var(--scale));color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;text-align:left;padding:3px 10px 3px 0;border-bottom:1px solid var(--border)}
.bklog td{padding:3px 10px 3px 0;border-bottom:1px solid var(--border);max-width:420px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Soft vertical separators so week columns stay readable when fully expanded —
   applies to headers, cells, AND the aligned detail cards. */
.grid th+th,.grid td+td{border-left:1px solid var(--border)}
/* Export controls are utilities, not protagonists (user feedback 2026-07-31):
   borderless ghost icon-buttons in muted ink, tiny uppercase caption, only
   gaining presence on hover. */
.iconbtn{background:transparent;border:none;color:var(--muted);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:6px;
  font-size:calc(9.5px*var(--scale));font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.iconbtn:hover{color:var(--text);background:var(--surface-2)}
.iconbtn svg{width:calc(13px*var(--scale));height:calc(13px*var(--scale))}
td.name.pname{cursor:pointer}
td.name.pname:hover{color:var(--orbe)}
tr.detail td.dctx{vertical-align:top;text-align:left;font-size:calc(11px*var(--scale));
  min-width:150px;padding:8px}
tr.detail td.dcell{vertical-align:top;text-align:left;padding:8px;min-width:170px}
tr.detail td.dback{padding:8px 16px 12px}
.mstat{font-size:calc(11px*var(--scale));margin:1px 0;white-space:nowrap}
.mstat b{font-size:calc(13px*var(--scale))}

/* ── TAB BAR ──
   One view per question. Everything used to stack into a single scroll — KPI
   cards, roster grid, drill-downs — which is exactly the "mixed signals" a
   manager has to untangle before reading anything. The tab bar is generated
   from the VIEWS array, so a view's label, pane and role gate are declared once.

   ── LEFT SIDEBAR (redesign 2026-08-17) ──
   The tabs used to be a horizontal strip that ate a full row of vertical space
   directly above the data, on every view. Moved into a fixed dark rail on the
   left: navigation is now a persistent, low-contrast surround rather than a
   competing band inside the reading column, and the whole page height goes to
   the analytics. Dark on purpose — the rail must read as chrome, not as another
   panel, so it stays dark in BOTH themes and only its accents move. */
.sidenav{position:fixed;left:0;top:0;bottom:0;width:var(--navw);z-index:200;
  background:var(--nav-bg);color:var(--nav-text);display:flex;flex-direction:column;
  border-right:1px solid var(--nav-border);transition:width .16s cubic-bezier(.4,0,.2,1);
  overflow:hidden;box-shadow:1px 0 0 rgba(255,255,255,.04)}
.navBrand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px;
  border-bottom:1px solid var(--nav-border);min-height:56px}
.navMark{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--orbe);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:13px;font-family:'Roboto Condensed',sans-serif;letter-spacing:.02em}
.navName{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
  font-size:calc(14px*var(--scale));font-weight:700;letter-spacing:.01em;white-space:nowrap}
/* Vertical rail: tabs stack as full-width rows. */
.tabs{display:flex;flex-direction:column;gap:2px;padding:12px 8px;flex:1;overflow-y:auto}
.tab{background:transparent;border:none;border-radius:8px;padding:9px 11px;cursor:pointer;
  color:var(--nav-muted);font-size:calc(12.5px*var(--scale));font-weight:600;
  text-align:left;width:100%;display:flex;align-items:center;gap:10px;
  white-space:nowrap;position:relative;font-family:inherit}
.tab:hover{color:var(--nav-text);background:var(--nav-hover)}
/* Active state is SUBTLE by instruction: a quiet fill plus a left accent rule,
   never a saturated block — the sidebar must not steal focus from the data. */
.tab.on{background:var(--nav-active);color:#fff}
.tab.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:0 3px 3px 0;background:var(--orbe)}
/* Each row carries a small geometric mark, NOT an emoji (redesign 2026-08-17:
   the interface is a strict enterprise data tool). The glyph is decorative —
   the label is the accessible name — so it is aria-hidden in the markup. */
.tabDot{flex:0 0 16px;width:16px;text-align:center;font-size:13px;opacity:.85}
.navFoot{padding:8px;border-top:1px solid var(--nav-border)}
.navToggle{width:100%;background:transparent;border:1px solid var(--nav-border);
  border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--nav-muted);
  font-size:calc(11px*var(--scale));font-weight:600;font-family:inherit;
  display:flex;align-items:center;gap:10px;white-space:nowrap}
.navToggle:hover{color:var(--nav-text);background:var(--nav-hover)}
/* Collapsed rail: icons only. Labels are removed from the flow rather than
   hidden with opacity, so the 56px rail has no horizontal scroll. */
.navCollapsed .navName,.navCollapsed .tabLbl,.navCollapsed .navToggleLbl{display:none}
.navCollapsed .tab,.navCollapsed .navToggle{justify-content:center;padding-left:0;padding-right:0}
.navCollapsed .navBrand{justify-content:center;padding-left:0;padding-right:0}

/* ── CHARTS ──
   Inline SVG, no library. A CDN chart lib is one blocked request away from an
   empty executive dashboard inside the HtmlService iframe, and every label,
   reference line and hit target here is bespoke anyway. */
.chart{width:100%;height:auto;display:block;overflow:visible;
       font-family:'Roboto',-apple-system,"Segoe UI",sans-serif}
/* Horizontal bar charts grow DOWNWARD with the category count, and `height:auto`
   on a 100%-wide SVG scales that growth by the container width too. At 52 PMs on
   a wide monitor the viewBox was ~1600 units tall rendering at ~2× — a chart
   several screens high where one row was legible at a time. Capping the width
   caps the scale factor, so a row is always ~30px however many there are, and
   the row cap in hbarChart_ keeps the list itself readable. */
.chart.hbar{max-width:calc(760px*var(--scale))}
/* The queue ruler is the same SHAPE of object and had the same problem for the
   same reason (user 2026-08-07: "the KPIs and the stack chart take too much
   space"). Its viewBox is 760 units wide, so at ~1950px of Executive-tab width
   `height:auto` scaled it ~2.5×: a three-segment bar rendering ~190px tall,
   physically the largest thing in the band while carrying three numbers. Capped
   like .hbar, it draws at its designed size — the SVG's own 10–11px axis and
   segment text then render at 10–11px, which is what the rest of the page uses. */
.chart.backlogRuler{max-width:calc(760px*var(--scale))}
.chart text{fill:var(--muted);font-size:11px}
.chart text.val{fill:var(--text);font-weight:700}
.chart text.axis{font-size:10px;font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1;shape-rendering:crispEdges}
.chart .hit{fill:transparent;cursor:crosshair}
.chartHead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.chartHead h3{font-size:calc(14px*var(--scale));font-weight:800}
.chartHead .sub{color:var(--muted);font-size:calc(11px*var(--scale))}
/* A legend entry that FILTERS says so — it is a control, not a caption. Reaches
   the grid's attention strip and bar vocabulary (.lgd.act): a legend where some
   entries act and others don't must show which is which. */
.act{cursor:pointer;border-bottom:1px dotted var(--muted)}
.act:hover{color:var(--text);border-bottom-color:var(--text)}
.act.on{color:var(--orbe);font-weight:700;border-bottom-color:var(--orbe)}
/* ── Verdict strip — the "rapid answer" line above each chart ── */
.verdict{font-size:calc(12.5px*var(--scale));line-height:1.5;margin:2px 0 10px}
.verdict b{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
           font-size:calc(15px*var(--scale))}
.vg{color:var(--pos)} .va{color:var(--amber)} .vr{color:var(--warn)}
.norm{font-size:calc(11px*var(--scale));color:var(--muted);margin-top:2px}

.emptyState{padding:26px 16px;text-align:center;color:var(--muted);
            font-size:calc(12.5px*var(--scale))}

/* 🗓 PM tab — one block per PM. The rule between rows is what keeps the two
   bars visually attached to their own PM; without it the "in project" line
   reads as though it belongs to the PM below. */
/* ── 🗓 PM table ──
   ONE table, three row levels. The levels are told apart by weight, background
   and indent rather than by nested tables, so every column line runs unbroken
   down the page — which is what makes a table scannable, and is exactly what a
   nested table destroys. */
.pmGroup>td{background:var(--surface-2);padding:8px 8px 6px}
/* Both collapse levels are click targets, so both have to LOOK like one — a row
   that responds to a click without inviting it is a feature nobody finds. */
.pmHead{cursor:pointer;user-select:none;font-size:calc(13px*var(--scale));
        font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif}
.pmEpicRow{cursor:pointer}
.pmEpicRow:hover>td,.pmGroup:hover>td{background:var(--border)}
/* The gap pills sit inside the PM group row, visible whether or not the group
   is expanded — "what should this PM fix first" should not require a click.
   Horizontal and colour-coded so a director scans DOWN the PM list and sees
   who carries the most red (director feedback 2026-08-17). Every pill acts. */
.pmOpp{margin:5px 0 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pmPill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;
        font-size:calc(11px*var(--scale));line-height:1.5;white-space:nowrap;cursor:pointer;
        border:1px solid var(--border);text-decoration:none;color:inherit}
.pmPill.sigBad{color:var(--c-bad);background:color-mix(in srgb,var(--c-bad) 12%,transparent);
               border-color:color-mix(in srgb,var(--c-bad) 40%,transparent)}
.pmPill.sigWarn{color:var(--c-warn);background:color-mix(in srgb,var(--c-warn) 12%,transparent);
                border-color:color-mix(in srgb,var(--c-warn) 40%,transparent)}
.pmPill.sigGood{color:var(--c-good);background:color-mix(in srgb,var(--c-good) 10%,transparent);
                border-color:color-mix(in srgb,var(--c-good) 35%,transparent);cursor:default}
.pmVia{margin:4px 0 0 14px}
/* Methodology, collapsed: one quiet line where eight lines of prose stood. */
.pmMethod{margin:2px 0 10px}
.pmMethod>summary{cursor:pointer;user-select:none;color:var(--muted);
                  font-size:calc(11.5px*var(--scale))}
.pmMethod>summary:hover{color:var(--fg)}
.pmMethod .cellSub{margin:6px 0 0}
/* Recoverable-hours alert — the pulse panel's lead (director feedback
   2026-08-17). Amber, not red: idle capacity is an opportunity, not a
   failure, and red is reserved for missed commitments. */
.pulseAlert{margin:2px 0 8px;padding:8px 12px;border-radius:8px;cursor:pointer;
            font-size:calc(14px*var(--scale));font-weight:600;
            color:var(--c-warn);background:color-mix(in srgb,var(--c-warn) 12%,transparent);
            border:1px solid color-mix(in srgb,var(--c-warn) 40%,transparent)}
.pulseAlert b{font-size:calc(17px*var(--scale))}
/* Children sit under their epic, one indent in. The tick is a tree line without
   a tree: it reads as "belongs to the row above" at a glance. */
.pmKid>td{background:var(--surface);font-size:calc(11.5px*var(--scale))}
.pmKidTick{color:var(--muted);padding-left:10px}
.pmTwist{display:inline-block;width:calc(10px*var(--scale));color:var(--muted)}
.pmEmpty>td{padding:6px 10px}
/* ── Layout ──
   Fixed layout driven by the <colgroup> the renderer emits, and cells that WRAP.
   This table deliberately does NOT use .tmx: that style is built for a matrix of
   short numeric cells (nowrap, sized from the first row), and here the first row
   is a full-width group header, so it had nothing to size from and every nowrap
   cell overflowed on top of its neighbour. Text columns wrap; only the Due week
   is nowrap, because "2026.W31" broken across two lines is unreadable. */
.pmTable{table-layout:fixed}
.pmTable th,.pmTable td{white-space:normal;vertical-align:top;
                        overflow-wrap:anywhere;padding:7px 10px}
.pmTable th{text-align:left}
.pmTable .tnum{text-align:left}
.pmTable td:nth-child(3){white-space:nowrap}
/* The Gaps and Against-epic-date cells carry several chips each. Stacking them
   keeps the row height honest instead of letting one long chip set the width of
   a column every other row then has to live with. */
.pmTable td:nth-child(4) span,.pmTable td:nth-child(5) span{display:inline-block}
/* The two rules below sit AFTER the .pmTable block on purpose: they style rows
   and a nested table INSIDE it, and at equal specificity the later rule wins —
   above the block they lost white-space/alignment to .pmTable's own cells. */
/* 🎯 Needs-action card (user 2026-08-28): the PM working their own section
   gets ONE CLICK PER SIGNAL — the whole row is the control and the button
   says what happens. A SELF-CONTAINED card, not a bare table: inside the
   beige group row a bare .tmx table sized its columns from nothing and let
   the row's background bleed through (user screenshot, same day). */
.pmNeeds{margin:10px 0 10px 14px;max-width:640px;background:var(--surface);
         border:1px solid var(--border);border-radius:10px;padding:10px 12px 6px}
.pmNeedsHead{font-size:calc(11.5px*var(--scale));font-weight:700;margin-bottom:6px}
.pmNeedsTbl{table-layout:fixed}
.pmNeedsTbl td,.pmNeedsTbl th{background:var(--surface)}
.pmNeedsTbl .tnum{text-align:right;white-space:nowrap}
.pmNeedsTbl td.tname{white-space:normal}
.pmNeedsTbl tbody tr:last-child td{border-bottom:none}
.pmNeedRow{cursor:pointer}
.pmNeedRow:hover td{background:color-mix(in srgb,var(--orbe) 8%,var(--surface))}
.pmFixBtn{display:inline-block;padding:2px 10px;border-radius:8px;white-space:nowrap;
          font-size:calc(11px*var(--scale));font-weight:700;text-decoration:none;
          color:#fff;background:var(--orbe);border:1px solid var(--orbe)}
.pmFixBtn:hover{filter:brightness(1.08)}
/* Per-section column headers (user 2026-08-28): each expanded PM's epic list
   opens with its own labels — the table-level thead they replace floated over
   collapsed group rows it did not describe. Styled exactly as table.hyg th so
   the two reads are indistinguishable; td-based, see pmColsHeadRow_. */
.pmTable .pmColsRow td{color:var(--muted);font-weight:700;text-transform:uppercase;
              font-size:calc(9px*var(--scale));letter-spacing:.05em;
              padding:10px 8px 5px;border-bottom:1px solid var(--border);
              white-space:nowrap;vertical-align:bottom}

/* 🌊 Backlog health — two facing lists. Grid rather than flex so the two tables
   share a column width regardless of label length: a healthy column that is
   narrower than its neighbour reads as the less important one, which is the
   opposite of the point. Collapses to one column under 900px, where side-by-side
   would force each table into its own horizontal scroll. */
.bhCols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
@media (max-width:900px){.bhCols{grid-template-columns:1fr}}

/* ── 🧭 WORKFORCE HEALTH ─────────────────────────────────────────────────────
   The pool grid is the widest table in the app (ten numeric columns plus a
   wrapping sentence), so it scrolls INSIDE its own container rather than
   letting the page scroll sideways. */
.tableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.wfGrid{min-width:760px}
/* The flat availability list (user 2026-08-28): one row per person, ranked
   most-available first — pool/level demoted to a tag so no section scaffolding
   repeats between the reader and the names. */
table.wfList{min-width:680px}
.wfList td{vertical-align:middle;padding:7px 8px}
.wfList .tnum{text-align:right;white-space:nowrap}
.wfPoolTag{display:inline-block;font-size:calc(10px*var(--scale));color:var(--muted);
           border:1px solid var(--border);border-radius:999px;padding:1px 8px;
           white-space:nowrap;cursor:help;background:var(--surface)}
/* Per-rocketeer stacked capacity bar (2026-08-18): planned fills first,
   available follows, the row ends in the person's own availability rate.
   Labels render inside a segment only when it is wide enough to hold them —
   the tooltip always carries the full sentence. Held-back people (🏖 🌱 bench)
   draw muted and rate-free: real hours, no room to sell. */
.wfBarWrap{display:flex;align-items:center;gap:8px;min-width:220px}
.wfBar{display:flex;flex:0 0 auto;height:16px;border-radius:4px;overflow:hidden;
       background:color-mix(in srgb,var(--muted) 14%,transparent)}
.wfBarPlan,.wfBarAvail{font-size:11px;line-height:16px;text-align:center;
                       white-space:nowrap;overflow:hidden;color:#fff}
.wfBarPlan{background:var(--c-ref)}
.wfBarAvail{background:var(--c-good)}
.wfBarHeld .wfBarPlan,.wfBarHeld .wfBarAvail{opacity:.45}
.wfBarRate{font-variant-numeric:tabular-nums}
/* Sellable headroom, modern view (2026-08-18): the same bar at three zoom
   levels. Hero — the org rate beside one full-width capacity bar; band rows —
   a three-column grid (label | bar | hours), so the bars share one left edge
   and read as a single chart rather than a list of sentences. */
.wfHero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:6px 0 2px}
.wfHeroRate{flex:0 0 auto}
.wfHeroBarBox{flex:1;min-width:260px}
.wfBarLg .wfBar{height:24px;border-radius:5px}
.wfBarLg .wfBarPlan,.wfBarLg .wfBarAvail{font-size:12px;line-height:24px}
.wfBandCap{margin-top:14px;font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
           font-size:calc(11px*var(--scale));text-transform:uppercase;letter-spacing:.06em;
           color:var(--muted);font-weight:700}
.wfBandRows{display:grid;grid-template-columns:minmax(120px,auto) 1fr auto;
            gap:8px 14px;align-items:center;margin-top:8px}
.wfBandLbl{white-space:nowrap}
.wfBandBar{min-width:160px}
.wfBandVal{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:700px){
  .wfBandRows{grid-template-columns:1fr auto}
  .wfBandBar{grid-column:1 / -1}
}
/* Pool header row — a band across the table, so the eye groups by pool before
   it reads any band. Tinted, not bold-only: at 11px bold alone does not
   separate a header row from a data row. */
.wfPoolHdr td{background:color-mix(in srgb,var(--muted) 10%,transparent);
              border-bottom:1px solid var(--border);padding:7px 8px}
/* The Read row hangs under its own band row with no bottom rule, so the pair
   reads as one unit rather than two rows that happen to be adjacent. */
/* ── Workforce: alert card, methodology drawer, in-cell reconcile flag ──
   The alert is the only coloured block on the tab, because it is the only thing
   on it with a queue somebody can work. The ⚠ replaces a full-width sentence
   row that used to sit between every pair of data rows — the table now keeps
   its column lines, which is the thing that makes it scannable. */
.wfAlert{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--surface));
         margin-bottom:14px}
.wfAlertRow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wfAlertBody{flex:1;min-width:260px}
.wfAlertHead{font-family:'Roboto Condensed','Franklin Gothic Medium Cond',sans-serif;
             font-size:calc(11px*var(--scale));text-transform:uppercase;letter-spacing:.06em;
             color:var(--amber);font-weight:700}
.wfAlertBig{font-size:calc(22px*var(--scale));font-weight:800;margin:2px 0 4px}
.wfAlertBtn{white-space:nowrap;text-decoration:none;font-weight:700;
            border-color:var(--amber);color:var(--text)}
.wfAlertBtn:hover{background:color-mix(in srgb,var(--amber) 14%,var(--surface))}
.wfFlag{color:var(--amber);cursor:help;font-size:calc(11px*var(--scale))}
.wfWhy{color:var(--royal);cursor:pointer;font-weight:700;white-space:nowrap}
.wfWhy:focus-visible{outline:2px solid var(--royal);outline-offset:2px}
.wfDrawer{position:fixed;top:0;right:0;width:min(460px,92vw);height:100vh;z-index:60;
          background:var(--surface);border-left:1px solid var(--border);
          box-shadow:-8px 0 24px rgba(15,25,65,.14);display:flex;flex-direction:column}
.wfDrawer[hidden]{display:none}
.wfDrawerHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
              padding:14px 16px;border-bottom:1px solid var(--border)}
.wfDrawerBody{overflow:auto;padding:14px 16px;font-size:calc(11.5px*var(--scale));
              color:var(--muted);line-height:1.6}
.wfDrawerBody h4{margin:14px 0 4px;color:var(--text);
                 font-size:calc(12px*var(--scale));text-transform:uppercase;letter-spacing:.05em}
.wfDrawerBody h4:first-child{margin-top:0}
.wfDrawerBody p{margin:6px 0}
.wfReadRow td{border-bottom:1px solid var(--border);padding-top:0;padding-bottom:8px}
.wfReadRow td:first-child{border-bottom:none}
/* Action-state and structural-risk chips. Deliberately the same shape as the
   attention chips elsewhere — a reader should not have to learn a second
   vocabulary of pills. */
.wfChip{display:inline-block;font-size:calc(9.5px*var(--scale));font-weight:700;
        letter-spacing:.04em;border-radius:4px;padding:1px 6px;white-space:nowrap}
.wfsGood{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.wfsWarn{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.wfsBad{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.wfsNeutral{background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
/* UNROUTED is the one row on the backlog table that is a finding rather than a
   measurement, so it is tinted — it must not read as just another pool. */
.wfUnrouted td{background:color-mix(in srgb,var(--warn) 8%,transparent);font-weight:600}
/* The readiness row is the panel's headline; a tint rather than a bigger font,
   so it leads without breaking the table's rhythm. */
.bhHero td{font-weight:600;background:color-mix(in srgb,var(--pos) 8%,transparent)}
/* Options that exist in the data but not in the current slice stay VISIBLE and
   disabled, so a filter list never silently loses a value someone is looking for. */
select option:disabled{color:var(--muted);font-style:italic}
.chip.off{opacity:.38;cursor:not-allowed}
/* §1 THE MASTHEAD (spec 2026-08-06) — the lede, first child of #viewExec.
   The evidence chip sits opposite the verdict so a reader weighs the sentence
   against how much of the page it is standing on before reading anything else. */
.mastRow{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.mastLede{flex:1;min-width:260px}
.mastHead{font-size:calc(13px*var(--scale));margin:2px 0}
.mastVerdict{font-size:calc(15px*var(--scale));line-height:1.5;margin:4px 0 0;font-weight:600}
.mastEvidence{font-size:calc(11px*var(--scale));color:var(--muted);text-align:right;
              white-space:nowrap;cursor:help;padding-top:2px}
/* ── Motion (spec §7) — portfolio language, ONCE per load. Every rule lives
   behind prefers-reduced-motion; re-renders from filter/sort changes never
   re-animate (body.loaded gates the entrance keyframes). ── */
@media (prefers-reduced-motion: no-preference){
  :root{--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1)}
  body:not(.loaded) .tile{opacity:0;transform:translateY(14px)}
  body.entering .tile{animation:dhReveal .5s var(--ease) both}
  body.entering .tile:nth-child(2){animation-delay:.06s}
  body.entering .tile:nth-child(3){animation-delay:.12s}
  body.entering .tile:nth-child(4){animation-delay:.18s}
  body.entering .tile:nth-child(5){animation-delay:.24s}
  @keyframes dhReveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .tile,.trustItem{transition:transform .25s var(--spring),box-shadow .25s var(--ease)}
  .tile:hover,.trustItem:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .viewPane.paneIn{animation:paneIn .15s var(--ease) both}
  @keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .trustBar i,.hbarMini i{transition:width .8s var(--spring)}
}
</style>
</head>
<body>
<!-- ── LEFT SIDEBAR NAVIGATION (redesign 2026-08-17) ──────────────────────────
     The tab strip that used to sit above the panes, moved into a fixed dark
     rail. Still generated from VIEWS into #tabBar — one declaration site for a
     view's label, pane and role gate — so this is a relocation of the same
     control, not a second copy of navigation that could drift from the first. -->
<nav class="sidenav" id="sidenav" aria-label="Dashboard sections">
  <div class="navBrand">
    <span class="navMark" aria-hidden="true">DH</span>
    <span class="navName">Delivery Health</span>
  </div>
  <div class="tabs" id="tabBar" role="tablist"></div>
  <div class="navFoot">
    <button class="navToggle" id="btnNav" title="Collapse the sidebar to icons" aria-expanded="true">
      <span class="tabDot" aria-hidden="true">‹‹</span><span class="navToggleLbl">Collapse</span>
    </button>
  </div>
</nav>

<div class="hdr">
  <div class="hrow">
    <h1>Delivery Health</h1>
    <span class="sub" id="asOf"></span>
    <span style="flex:1"></span>
    <!-- 👁 Confidential view. Rendered by renderConfBtn_ only for a viewer who
         actually HAS confidential content — an eye that removes nothing would
         advertise hidden data that is not there. -->
    <span id="confSlot"></span>
    <button class="btn" id="btnRefresh" title="Bypass the cache and reload live data">Refresh</button>
    <button class="btn" id="btnTheme" title="Switch between light and dark theme">Dark</button>
  </div>
  <!-- ══ FILTER BAR · PROGRESSIVE DISCLOSURE (review item #1, 2026-08-17) ═════
       Nine controls in one row read as a cockpit: every one of them is a
       decision, presented at equal weight, before the reader has seen a single
       number. The row now carries only the three dimensions an executive
       actually re-cuts by — WHEN, WHERE, WHO (period, region, team) — plus the
       person search. Population, Role, PM and Job family move into the
       drawer below.
