/**
 * Sums the server's per-week joiner/leaver rows over a set of ISO weeks.
 * @returns {?Object} null when the payload predates workforceWeeks (v28) —
 *   an UNKNOWN, which must not render as "nobody joined or left".
 */
function workforceFor_(isos) {
  var rows = MODEL.workforceWeeks;
  if (!rows) return null;
  var s = { joiners: 0, leavers: 0, hoursGained: 0, hoursLost: 0,
            joinersNoCap: 0, leaversNoCap: 0 };
  rows.forEach(function (r) {
    if (isos.indexOf(r.iso) === -1) return;
    Object.keys(s).forEach(function (k) { s[k] += (r[k] || 0); });
  });
  return s;
}

/**
 * WORKFORCE CHANGE card (user request 2026-08-07).
 *
 * Lives in the Backlog band rather than the Capacity band for two reasons: the
 * Capacity band is canSeeMargin_-gated and this was asked for as an
 * everyone card, and this number only means anything set against the queue
 * growth printed two tiles to its left. "The queue is growing 75 items a week"
 * and "the team lost 32 hours a week of capacity" are one sentence.
 *
 * ORG-scoped like Inventory and Net flow beside it: roster movements are not
 * filterable here (a leaver has no Region/Team/PM row left to filter on), and
 * a card that silently ignored the active filters without saying so would be
 * read as a filtered number. The scope tag says which it is.
 *
 * COUNTS AND HOURS ONLY — never who. See the registry deviation.
 */
function workforceTileHtml_() {
  var w = workforceFor_(analysisHead_().head.isos);
  if (!w) {
    return backlogTileHtml_("Workforce change", "—",
      "arrives after the next refresh — this payload predates the measure", "org");
  }
  var known = w.joiners + w.leavers;
  if (!known) {
    // A REAL zero: the roster was read and nobody moved. Distinct from the
    // null above, and it must not be dressed as a placeholder.
    return backlogTileHtml_("Workforce change", "0h/wk",
      "nobody joined or left this period", "org");
  }
  var net = w.hoursGained - w.hoursLost;
  var big = (net > 0 ? "+" : net < 0 ? "−" : "") + nfDh_(Math.round(Math.abs(net))) + "h/wk";
  var parts = [
    w.joiners + " joined" + (w.hoursGained ? " (+" + nfDh_(Math.round(w.hoursGained)) + "h)" : ""),
    w.leavers + " left" + (w.hoursLost ? " (−" + nfDh_(Math.round(w.hoursLost)) + "h)" : ""),
  ];
  // The unknown-capacity disclosure. Without it the hours read as the whole
  // story while a departure sits inside the count contributing nothing —
  // exactly the direction of error that flatters us.
  var noCap = w.joinersNoCap + w.leaversNoCap;
  if (noCap) {
    parts.push(noCap + " with no scheduled hours on record — counted as " +
      (noCap === 1 ? "a person" : "people") + ", not as hours");
  }
  // Set against the demand side, which is the only reason this card is here.
  var nf = netFlowPerWeek_();
  if (nf !== null && nf > 0.0001 && net < 0) {
    parts.push("queue growing " + nfDh_(Math.round(nf)) + "/wk while capacity fell");
  }
  // Ramp-up is a real qualifier on the gain and is NOT discounted from it —
  // any discount would be a guess. Stated, and left to the reader.
  var ramping = (MODEL.people || []).filter(function (p) { return p.newHire; }).length;
  if (ramping && w.joiners) {
    parts.push(ramping + " of the current team still in ramp-up");
  }
  return backlogTileHtml_("Workforce change", big, parts.join(" · "), "org");
}

/**
 * The sample size behind one metric's current value, or `null` when the
 * metric has no sample notion at all (no METRICS_ accessor — a registry-only
 * count like `inventory`/`arrived`/`cleared`/`netFlow`, or an absent-status
 * metric with no accessor to ask). Reads the SAME METRICS_[id].n(isos) every
 * other surface on this page already computes from, over the current
 * filtered scope — coverage and sample size are both filter-dependent here
 * for the same reason metricConfidence_ already is (a region slice can be
 * thinly sampled while the whole population isn't).
 */
function metricSampleN_(id) {
  var mm = METRICS_[id];
  if (!mm || !mm.n) return null;
  var isos = analysisHead_().head.isos;
  var n = mm.n(isos);
  return (n === null || n === undefined || isNaN(n)) ? null : n;
}

/**
 * The CLIENT twin of `sampleFloorFor_` (Code.js) — same contract, same
 * fail-closed-on-unknown-id rule, read from the registry the client already
 * has rather than re-declaring the floors a second time. `_test_clientParity_`
 * (Task 17) is expected to extract and diff this against the server copy the
 * same way it already does for `metricConfidence_`.
 * @returns {{ok:boolean, need:number|null, n:number}}
 */
function sampleFloorClient_(id, n) {
  var m = reg_(id);
  if (!m.id) return { ok: false, need: null, n: n };
  if (m.sampleFloor === null || m.sampleFloor === undefined) return { ok: true, need: null, n: n };
  var need = m.sampleFloor;
  return { ok: (Number(n) || 0) >= need, need: need, n: Number(n) || 0 };
}

/** This metric's current coverage (0–1), or null when it has no accessor or
    no measurable coverage — used ONLY to add context to an already-shelved
    (below-floor) entry (see shelfRows_ below); gate alone never shelves a
    metric on its own (below-gate still publishes, D5/2026-08-03). */
function metricCoverageNow_(id) {
  var mm = METRICS_[id];
  if (!mm || !mm.coverage) return null;
  var c = mm.coverage(analysisHead_().head.isos);
  return (c === null || c === undefined || isNaN(c)) ? null : c;
}

/** True when a metric that DOES have an accessor cannot currently compute at
    all — the export ran but this metric's own feed did not come back this
    refresh (distinct from registry status "absent", which is "no feed exists
    at all" — a permanent, structural gap rather than a this-run outage). */
function metricFeedDown_(id) {
  var mm = METRICS_[id];
  return !!mm && !mm.available();
}

/** The one-line "what would clear this" — derived from the registry entry
    itself, never hand-typed per metric, so a metric added to the registry
    tomorrow gets a sensible line for free. */
function shelfClears_(id, m) {
  if (m.status === "absent") return m.absentReason || "connect the feed this metric reads from";
  if (m.sampleFloor) return "collect " + m.sampleFloor + " or more measurable records in this window";
  return "reconnect the feed this metric reads from";
}

/**
 * ── §7 THE SHELF ─────────────────────────────────────────────────────────────
 * "Not measured this week", built from data rather than curated by hand — a
 * hand-written list cannot notice that a metric quietly dropped to two
 * samples and is still sitting on a card looking authoritative.
 *
 * Three sources, in this order, and a metric appears ONCE however many apply:
 *  · registry status "absent"  — no feed exists at all (Cycle Time, CSAT, rework)
 *  · below its sample floor    — nothing to average (spec D5)
 *  · its feed is unavailable   — the tab could not be read this run
 *
 * A metric below its COVERAGE GATE is deliberately NOT here — this function
 * never checks the gate on its own account, only as CONTEXT once a metric is
 * already shelved for being below its sample floor (the two-reasons case:
 * one shelf entry naming both, never two entries). Below-gate alone still
 * publishes (CONFIG_DH.SUPPRESS_BELOW_GATE = false, user decision
 * 2026-08-03); the gates band carries that read. Conflating the two would
 * reopen a settled decision by accident.
 *
 * NO OWNER on any row (D9). A standing table of names against failures in the
 * most-read view on the dashboard reads as a blame board, and that is not
 * what gets Jira tagging fixed.
 *
 * @returns {Array<{id, name, why:Array<string>, clears:string}>}
 */
function shelfRows_() {
  var reg = (MODEL.meta.registry || {}).metrics || {};
  var rows = [];
  Object.keys(reg).forEach(function (id) {
    var m = reg[id], why = [];
    if (m.status === "absent") why.push(m.absentReason || "no feed connected");
    var n = metricSampleN_(id);
    if (n !== null) {
      var fl = sampleFloorClient_(id, n);
      if (!fl.ok && fl.need !== null) {
        var reason = "resting on " + n + " measurable record" + (n === 1 ? "" : "s") +
                     " — needs " + fl.need;
        var cov = metricCoverageNow_(id);
        if (cov !== null && m.coverageGate && cov < m.coverageGate) {
          reason += "; also below its " + Math.round(m.coverageGate * 100) +
                    "% coverage gate (" + Math.round(cov * 100) + "%) — that alone would " +
                    "still publish, the sample size is what shelves it here";
        }
        why.push(reason);
      }
    }
    if (metricFeedDown_(id)) why.push("its feed could not be read this run");
    if (!why.length) return;
    rows.push({ id: id, name: m.name || id, why: why, clears: shelfClears_(id, m) });
  });
  return rows;
}

/**
 * ── THE VERDICT ────────────────────────────────────────────────────────────
 * Composed from ranked findings, never a sentence template.
 *
 * The prototype hardcoded "…and it grew by N items last week". On the real
 * feed net flow is +14/wk against a clearing rate of ~297 — the queue is
 * stable, and that clause would have been simply false. A template cannot
 * decline to make a claim; a findings list can.
 *
 * Rank order is FIXED and each finding carries its own materiality
 * threshold, because not every finding has a target to be distant from
 * (unowned share has none). A finding whose threshold is not met returns
 * nothing and never renders.
 *
 * @returns {Array<{key:string, text:string, sev:string}>} worst first
 */
function verdictFindings_() {
  var out = [];
  var q = MODEL.queue || { assigned: {}, unassigned: {} };
  var rate = MODEL.meta.clearRateMedian;
  var un = q.unassigned ? q.unassigned.items : null;
  var total = (un === null || un === undefined) ? null : (q.assigned.items || 0) + un;

  // 1 — QUEUE DEPTH. Against the operating band, NOT a target: D11 ships
  // queueCover with target: null. Suppressed outright while the norm is
  // unpublishable, because "deep" is meaningless without a normal to be deep
  // against, and inventing one here would put a verdict on screen no owner
  // holds. `std.ok` (not `std.baseline !== null`) is the correct guard —
  // standardRate_ returns {ok:false} with baseline left `undefined`, not
  // `null`, under 5 periods, and `undefined !== null` is true in JS, so a
  // null-check here would silently let an unpublishable norm through.
  if (total !== null && rate) {
    var cover = total / rate;
    var std = stdFor_(coverSeries_(), { publish: true });
    if (std && std.ok && cover > std.hi) {
      out.push({ key: "depth", sev: "bad",
        text: "We are holding " + nfDh_(total) + " items and clearing about " +
              nfDh_(Math.round(rate)) + " a week — roughly " + n1Dh_(cover) +
              " weeks of work, against a normal of " + n1Dh_(std.baseline) + "." });
    }
  }

  // 2 — UNOWNED SHARE. Threshold 20%: below that it is housekeeping, above it
  // the queue has no owner and that is the finding.
  if (total !== null && total > 0 && un !== null) {
    var share = un / total;
    if (share >= 0.20) {
      out.push({ key: "unowned", sev: "bad",
        text: Math.round(share * 100) + "% of it has no owner — " + nfDh_(un) +
              " items nobody has picked up." });
    }
  }

  // 3 — NET FLOW. Threshold: 5% of the clearing rate. Below that the queue is
  // stable, and calling a stable queue "growing" is noise dressed as a finding.
  if (rate && MODEL.arrivalWeeks && MODEL.arrivalWeeks.length) {
    var nf = netFlowPerWeek_();
    if (nf !== null && Math.abs(nf) >= rate * 0.05) {
      out.push({ key: "flow", sev: nf > 0 ? "bad" : "good",
        text: nf > 0
          ? "It is growing by about " + nfDh_(Math.round(nf)) + " items a week."
          : "It is draining by about " + nfDh_(Math.abs(Math.round(nf))) + " items a week." });
    }
  }

  // 4 — GATES. Same last-complete-period head, and the same gapsRows_ call,
  // renderTrust_ already uses — one list of definitions, so the masthead and
  // the gates band can never disagree about which checks are failing.
  var gA = analysisHead_();
  var gHead = gA.done[gA.done.length - 1] || { label: "—", isos: [] };
  var gapsAll = gapsRows_(hygieneFor_(gHead.isos), hygienePeopleFor_(gHead.isos)) || [];
  var failing = gapsAll.filter(function (g) {
    return g.value !== null && g.gate !== null && g.value < g.gate;
  });
  if (failing.length) {
    out.push({ key: "gates", sev: "warn",
      text: failing.length + " of " + gapsAll.length +
            " evidence gates are below their bar." });
  }

  // 5 — SHELVED. Says how much of the scorecard is not answerable at all.
  var shelved = shelfRows_() || [];
  if (shelved.length) {
    out.push({ key: "shelf", sev: "warn",
      text: shelved.length + " metric" + (shelved.length === 1 ? " is" : "s are") +
            " not measurable this period." });
  }
  return out;
}

/**
 * CAPACITY BAND's own KPI tile — Utilisation, or Planned Coverage on a
 * forward window (Task 16B: moved from the retired #tiles strip). Every
 * behaviour renderTiles_ owned for this card survives unmoved: gatedTile_'s

 *
 * canSeeMargin_() gating is NOT repeated here: renderPulse_ (the only caller)
 * already omits its whole panel — this tile included — from the DOM for a
 * non-margin role, so the card shares the capacity band's one gate instead of
 * carrying a second one that could disagree with it.
 */
/**
 * ── AVAILABILITY RATE — Tier 1, immediately after Forecast Accuracy ──────────
 *
 * The question it answers: how many hours do we have free for direct delivery
 * of the backlog? Utilization answered the inverse — how much is spoken for —
 * which is a report, not a decision. Free hours are something a leader can
 * assign, which is why this card replaced it (user 2026-08-17).
 *
 * The RATE headlines because the card is named for it and because the Workforce
 * tab headlines the same percentage — the two must agree at a glance. The HOURS
 * sit directly beneath it in bold, because hours are the unit anybody actually
 * reassigns, and "what amount of hours" was the ask.
 *
 * NO TARGET, therefore no RAG colour (D11). Nobody has agreed an availability
 * bar: too little is a delivery risk and too much is unsold capacity, so a
 * one-sided verdict would be wrong in one of those directions at all times.
 *
 * Margin-tier, like the utilization card it replaces: it publishes scheduled
 * capacity hours, and the Metrics Dictionary limits that to directs and above.
 * The gate lives in renderFlow_ with the Forecast card's, not here.
 */
function availabilityTileHtml_() {
  var a = wfAvailability_();
  if (!a) {
    return tileHtml_("Availability Rate", null, "", [], {
      unavailable: "arrives after the next refresh — this payload predates workforce health" });
  }
  if (a.head === 0) {
    return tileHtml_("Availability Rate", null, "", [], {
      unavailable: "nobody in this slice this period" });
  }
  if (a.pct === null) {
    return tileHtml_("Availability Rate", null, "", [], {
      unavailable: "no scheduled capacity on record for these " + a.head + " people this period" });
  }
  // The deep link is the point of the card: a leader who sees free hours wants
  // the names behind them, and those live on Workforce.
  //
  // OVER-ALLOCATION, NEVER A NEGATIVE RATE (user 2026-08-17): planned hours can
  // exceed scheduled capacity, and (gross − committed)/gross then goes negative.
  // The card clamps to 0% and says what the overrun IS — hours booked past

function flowMedian_(arr) {

 * else there: reg.cleared/reg.arrived (flowTileHtml_, above) also carry unit

      detail: [
        "Count of issues resolved in the period — the items side of Throughput's hours below. A zero here is a real zero, not missing data.",
        unattribNote_("throughput"),
      ],
    });
  })();

  // 2 · Arrived — issues CREATED in the period, whole population, no
  // assignee clause (Task 14, spec §4). ORG-scoped deliberately: this is the
  // raw arrival side of the same trailing-weeks arithmetic netFlowPerWeek_
  // and the backlog band's hero already use, so it must never be filtered —
  // a Region slice of "how much work arrived" answers a different question
  // than "is the whole queue growing". target: null (flowTileHtml_ already
  // treats that neutrally, same grammar as every other flow tile).
  (function () {
    var m = regRequired_("arrived");
    if (!m) { sec += registryMissingTile_("arrived", "org"); return; }
    if (!MODEL.meta.arrivalsAvailable) {
      sec += flowTileHtml_(m, null,
        { scope: "org", unavailable: "not measured — the Jira Arrivals tab isn't in this export yet" });
      return;
    }
    var byIso = {};
    (MODEL.arrivalWeeks || []).forEach(function (w) { byIso[w.iso] = w; });
    // Coverage-aware sum: null (not 0) when NO iso in the set has an arrivals
    // row. A period with zero rows is "nobody looked", not "measured zero" —
    // conflating the two would plot a flat zero line asserting "no work
    // arrived" for a gap in the export. sparkHtml_ already breaks its
    // polyline on null, so this alone restores the correct gap rendering.
    function sumOver(isos, field) {
      var found = false, t = 0;
      isos.forEach(function (iso) {
        if (byIso[iso]) { found = true; t += byIso[iso][field] || 0; }
      });
      return found ? t : null;
    }
    var series = trendPer.map(function (p) { return sumOver(p.isos, "created"); });
    var created = sumOver(head.isos, "created");
    var resolvedCt = sumOver(head.isos, "resolved");
    var createdUnassigned = sumOver(head.isos, "createdUnassigned");
    sec += flowTileHtml_(m, created, {
      scope: "org",
      conf: null,
      trend: series, trendLabels: labels,
      context: created === null ? "no arrivals data for this period" :
        resolvedCt + " resolved this period — book " +
        (created > resolvedCt ? "growing" : created < resolvedCt ? "shrinking" : "flat") +
        " · population-wide, filters don't apply",
      detail: [
        "Issues created in the period, whole population, no assignee clause — the raw arrival " +
          "side of the backlog band's net-flow figure.",
        createdUnassigned > 0
          ? createdUnassigned + " of " + created + " arrived still unassigned" : "",
      ],
    });
  })();

  // 3 · Lead Time — median days, p85 companion (raw day values travel per
  // bucket; the client medians whatever the filters select).
  (function () {
    var m = regRequired_("leadTime");
    if (!m) { sec += registryMissingTile_("leadTime", "period"); return; }
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.leadTimeBuckets || [], p.isos);
      return b.days.length ? flowMedian_(b.days) : null;
    });
    var b = bucketsFor_(MODEL.leadTimeBuckets || [], head.isos);
    var periodsWithData = series.filter(function (v) { return v !== null; }).length;
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.n / b.nAll : null, periodsWithData);
    sec += flowTileHtml_(m, b.days.length ? flowMedian_(b.days) : null, {
      scope: "period",
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.n > 0
        ? "p85 " + fmtFlowVal_(flowP85_(b.days), "days") + " · " + b.n + " issues measured" + smallN_(b.n)
        : "no issues resolved this period",
      detail: [
        "Calendar days from Created to Resolution Date, non-epic issues, median of the period.",
        b.nAll > b.n ? (b.nAll - b.n) + " resolved issues had no usable created date" : "",
        unattribNote_("leadTime"),
      ],
    });
  })();

  // 2/6 · Cycle Time and Flow Efficiency are declared ABSENT in the registry
  // (no in-progress timestamps / no queue-state instrumentation). They used to
  // render as "—" placeholder tiles; retired from the UI 2026-08-05 (spec
  // §4.1) — the registry + Data Reference remain the record of what is
  // deliberately not measured.

  // 4 · On-Time Delivery — outcome tile, moved from the retired #tiles strip
  // (Task 16B). gatedTile_'s coverage gate, the planning-window notYetTile_
  // swap and the stdFor_ operating-rate read all survive the move unchanged
  // — verified by name in task-16b-report.md.
  (function () {
    // Registry first (review item #6). This card is GATED — regOt.coverageGate
    // is what gatedTile_ grades against — and an empty-object miss made that
    // gate `undefined`, which metricConfidence_ reads as 0 and therefore as
    // "ungated, publish at high confidence". The headline KPI of the page must
    // never publish itself by accident.
    var regOt = regRequired_("onTime");
    if (!regOt) { html += registryMissingTile_("onTime", "items"); return; }
    // ITEMS, NOT PEOPLE (user 2026-09-09): every resolved item in the window
    // counts, whoever it is assigned to — see bucketsFor_'s opts.items.
    var ITEMS_ = { items: true };
    var ot = bucketsFor_(MODEL.onTimeBuckets, outHead.isos, ITEMS_);
    var otSeries = done.map(function (p) {
      var b = bucketsFor_(MODEL.onTimeBuckets, p.isos, ITEMS_);
      return b.n > 0 ? b.onTime / b.n * 100 : null;
    });
    var otTrend = otSeries.slice(Math.max(0, hi - 5), hi + 1);
    // Name the scope on the card: "85% on time" means something different over
    // Stories/Tasks than over epics, and the switch lives in CONFIG_DH.
    var OT_SCOPE = {
      dictionary: { word: "resolved epics / milestones / commitments",
        why: "The Metrics Dictionary scope: epics, Milestone-type issues and Client-Commitment-labelled work. Stories and Tasks are excluded — an epic's due date is the client-facing milestone." },
      delivery: { word: "resolved issues",
        why: "Stories and Tasks — the team's own delivery commitments. Epics are excluded: an epic's due date is a programme milestone set by the PM and its resolution trails its last child, so the two measure different lifecycles." },
      epic: { word: "resolved epics",
        why: "Epics only — milestone-level client commitments, per the Metrics Dictionary. Stories and Tasks are excluded." },
      all: { word: "resolved items (all types)",
        why: "Every resolved issue type in one rate, epics included. Mixes programme milestones with task-level commitments — kept only for comparison with the pre-2026-08-03 number." },
    };
    var otSc = OT_SCOPE[MODEL.meta.onTimeScope] || OT_SCOPE.delivery;
    var otCmp = ot.n + " of " + ot.nAll + " " + otSc.word +
      ' <span title="' + esc_(otSc.why) + '">had a due date ⓘ</span>' + smallN_(ot.n);
    var otDetail = itemsScopeNotes_(ot, "resolved items").concat(regCaveats_("onTime"));
    function stable_(vals) { return vals.filter(function (v) { return v !== null; }).length; }
    var otCovTrend = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.onTimeBuckets, p.isos, ITEMS_);
      return b.nAll > 0 ? b.n / b.nAll * 100 : null;
    });
    var otConf = applyGatePolicy_(
      metricConfidence_(regOt.coverageGate, ot.nAll > 0 ? ot.n / ot.nAll : null, stable_(otTrend)));
    var otStd = stdFor_(otSeries, otConf);
    html += planning
      ? notYetTile_("On-Time Delivery", outHead, outHeadlineLabel, "items")
      : gatedTile_("On-Time Delivery", otConf, regOt,
          "no resolved delivery items in this period under the active filters",
          (ot.nAll - ot.n) + " of " + ot.nAll + " resolved items have no due date",
          function () {
            return tileHtml_("On-Time Delivery", ot.n > 0 ? ot.onTime / ot.n * 100 : null, otCmp, otTrend,
                             { drillMetric: "onTime", headlineLabel: outHeadlineLabel, target: tg.onTime,
                               std: otStd, trendLabels: labels, phase: phase,
                               detail: otDetail, scope: "items" });
          }, outHeadlineLabel, otCovTrend, labels, "items");
  })();

  // 5 · Forecast Accuracy — margin-tier outcome tile. REDEFINED 2026-09-09
  // (registry 4.4, user decision): the share of tasks and milestones SCHEDULED
  // in the window that finished by the end of their committed week, read as
  // ITEMS. The closed-epic estimate-variance read it replaces described
  // engagements kicked off two or three quarters ago and moved for nobody
  // inside a quarter — "not doable" as a weekly read. canSeeMargin_() gating
  // survives unchanged: omitted from the html string entirely for a non-margin
  // role, never dimmed.
  if (margin) (function () {
    var regFc = regRequired_("forecast");
    if (!regFc) { html += registryMissingTile_("forecast", "items"); return; }
    if (!MODEL.forecastTaskBuckets) {
      // A pre-v49 payload has the old epic buckets and nothing this card can
      // read. Say so; never fall back to the epic series under the new label.
      html += tileHtml_("Forecast Accuracy", null, "", [], {
        unavailable: "Not in this payload — ↻ Refresh to rebuild on the current schema " +
                     "(Forecast Accuracy now reads the week's schedule, not closed epics).",
        headlineLabel: outHeadlineLabel, scope: "items" });
      return;
    }
    var ITEMS_ = { items: true };
    function pct_(b) { var g = b.nHit + b.nMiss; return g > 0 ? b.nHit / g * 100 : null; }
    function cov_(b) {
      // Coverage = the share of the window's FINISHED work that ever carried a
      // schedule. With nothing finished but something scheduled and missed, the
      // rate describes the whole schedule — coverage is complete, not absent.
      return b.nRes > 0 ? b.nResDated / b.nRes : (b.nHit + b.nMiss > 0 ? 1 : null);
    }
    var fc = bucketsFor_(MODEL.forecastTaskBuckets, outHead.isos, ITEMS_);
    var fcSeries = done.map(function (p) { return pct_(bucketsFor_(MODEL.forecastTaskBuckets, p.isos, ITEMS_)); });
    var fcTrend = fcSeries.slice(Math.max(0, hi - 5), hi + 1);
    var graded = fc.nHit + fc.nMiss;
    var fcHeadline = pct_(fc);
    var fcCmp = fc.nHit + " of " + graded + " scheduled item" + (graded === 1 ? "" : "s") +
      ' <span title="' + esc_(regFc.formula || "") + ' Week grain: a Tuesday date met on Thursday kept its week.">' +
      "finished in their committed week ⓘ</span>" + smallN_(graded);
    var fcDetail = [];
    if (fc.nPending) {
      fcDetail.push(fc.nPending + " more scheduled in this window " + (fc.nPending === 1 ? "is" : "are") +
        " pending — due in a week that has not ended yet, so not graded either way.");
    }
    if (fc.nMiss) {
      fcDetail.push("Of " + fc.nMiss + " miss" + (fc.nMiss === 1 ? "" : "es") + ", " + fc.nLate +
        " did finish — just after the committed week; the other " + (fc.nMiss - fc.nLate) +
        (fc.nMiss - fc.nLate === 1 ? " is" : " are") + " still open.");
    }
    if (fc.nRes > fc.nResDated) {
      fcDetail.push((fc.nRes - fc.nResDated) + " of " + fc.nRes + " items resolved in this window carried no due " +
        "date at all — outside any schedule, so this rate describes " +
        Math.round(fc.nResDated / fc.nRes * 100) + "% of the finished work.");
    }
    // No "N issues excluded" line here: on the ITEMS read the unattributed
    // items are COUNTED, and itemsScopeNotes_ says so (or says how many a WHERE
    // filter left out). The excluded-count note is for the per-person cards.
    fcDetail = fcDetail.concat(itemsScopeNotes_(fc, "scheduled or resolved items"));
    fcDetail = fcDetail.concat(regCaveats_("forecast"));
    function stable_(vals) { return vals.filter(function (v) { return v !== null; }).length; }
    var fcCovTrend = trendPer.map(function (p) {
      var c = cov_(bucketsFor_(MODEL.forecastTaskBuckets, p.isos, ITEMS_));
      return c === null ? null : c * 100;
    });
    var fcConf = applyGatePolicy_(metricConfidence_(regFc.coverageGate, cov_(fc), stable_(fcTrend)));
    var fcStd = stdFor_(fcSeries, fcConf);
    html += planning
      ? notYetTile_("Forecast Accuracy", outHead, outHeadlineLabel, "items")
      : gatedTile_("Forecast Accuracy", fcConf, regFc,
          fcEmptyMsg_(fc),
          (fc.nRes - fc.nResDated) + " of " + fc.nRes + " items resolved in this window have no due date",
          function () {
            return tileHtml_("Forecast Accuracy", fcHeadline, fcCmp, fcTrend,
                             { drillMetric: "forecast", headlineLabel: outHeadlineLabel, target: tg.forecast,
                               std: fcStd, trendLabels: labels, phase: phase,
                               detail: fcDetail, scope: "items" });
          }, outHeadlineLabel, fcCovTrend, labels, "items");
  })();

  // 5b · Availability Rate — hours free for direct delivery of the backlog
  // (user 2026-08-17). Sits immediately after Forecast by instruction, and the
  // position reads correctly: On-Time and Forecast say whether we are meeting
  // commitments, and this says what capacity is left to meet the next ones.
  //
  // Margin-gated with Forecast above it — it publishes scheduled capacity
  // hours, the same disclosure the Metrics Dictionary limits to directs and
  // above. It does NOT fall back to a completed period on a planning window:
  // availability is a forward question, and the current window's own answer is
  // the one worth having.
  if (margin) html += availabilityTileHtml_();

  // 6 · Quality / Rework — outcome tile, moved from #tiles. qualityTile_
  // itself is unchanged (already its own function); only its caller moved.
  html += planning ? notYetTile_("Quality / Rework", outHead, outHeadlineLabel)
                   : qualityTile_(done, trendPer, labels, outHeadlineLabel, outHead, hi, phase);

  // 7 · Throughput — Σ estimate-hours delivered. TIER 2 (demoted 2026-08-17b):
  // hours shipped is volume, not an outcome — it says how much moved, never
  // whether what moved was what we promised. It opens the secondary strip.
  (function () {
    var m = regRequired_("throughput");
    if (!m) { secThroughput += registryMissingTile_("throughput", "period"); return; }
    var series = trendPer.map(function (p) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], p.isos);
      return b.nAll > 0 ? b.estHrs : null;
    });
    var b = bucketsFor_(MODEL.throughputBuckets || [], head.isos);
    var conf = metricConfidence_(m.coverageGate || 0,
      b.nAll > 0 ? b.nEst / b.nAll : null,
      series.filter(function (v) { return v !== null; }).length);
    secThroughput += flowTileHtml_(m, b.nAll > 0 ? b.estHrs : null, {
      scope: "period",
      conf: b.nAll > 0 ? conf : null,
      trend: series, trendLabels: labels,
      context: b.nAll > 0
        ? b.nEst + " of " + b.nAll + " resolved issues carried an estimate" + smallN_(b.nEst)
        : "no issues resolved this period",
      detail: [
        "Sum of Original Estimate hours on non-epic issues resolved in the period. Unestimated work delivers invisibly here — the fix is estimate fill.",
        unattribNote_("throughput"),
      ],
    });
  })();

  // 8 · Bug Count — POPULATION-WIDE (registry deviation: bugs are routinely
  // unassigned at creation, so a roster join would silently drop most of them).
  // TIER 2 (demoted 2026-08-17b): defect arrivals are an input to the queue,
  // and Quality/Rework above already carries the outcome read on quality.
  (function () {
    var m = regRequired_("bugCount");
    if (!m) { secQuality += registryMissingTile_("bugCount", "period"); return; }
    if (!MODEL.meta.bugsAvailable) {
      secQuality += flowTileHtml_(m, null,
        { scope: "period", unavailable: "export predates Jira Backlog.js v3.9.0 — no Jira Bugs tab yet" });
      return;
    }
    var byIso = {};
    (MODEL.bugWeekly || []).forEach(function (w) { byIso[w.iso] = w; });
    function sumOver(isos, field) {
      var t = 0;
      isos.forEach(function (iso) { if (byIso[iso]) t += byIso[iso][field] || 0; });
      return t;
    }
    var series = trendPer.map(function (p) { return sumOver(p.isos, "nCreated"); });
    var created = sumOver(head.isos, "nCreated");
    var resolved = sumOver(head.isos, "nResolved");
    secQuality += flowTileHtml_(m, created, {
      scope: "period",
      conf: null,
      trend: series, trendLabels: labels,
      context: resolved + " resolved this period — book " +
        (created > resolved ? "growing" : created < resolved ? "shrinking" : "flat") +
        " · population-wide, filters don't apply",
      detail: [
        "Bug issues created in the period, whole population. A zero here is a REAL zero — bugs are a countable absence.",
        "Noise-filtered at export: Won't Do / Duplicate / Canceled bugs were reports, not defects.",
        "Distinct from Quality/Rework — a bug feeds neither leg of the rework rate.",
      ],
    });
  })();

  // Which cluster a card lands in is decided HERE and nowhere else, so the
  // grouping is one readable line rather than a flag threaded through every
  // tile builder above. The Runway cluster and Net flow left 2026-08-28 — see
  // the note in paint_.
  paint_(html, {
    flow: secThroughput + sec,
    quality: secQuality,
  });
}

/** "N issues not attributable to a roster person" note, or "" when clean. */
function unattribNote_(key) {
  var u = (MODEL.meta.jiraUnattributed || {})[key] || 0;
  return u > 0 ? u + " issues excluded — assignee doesn't join the roster (window-wide count)" : "";
}

/**
 * Quality / Rework — the Metrics Dictionary's fourth metric, live since
 * schema v10 (was a "data pending" placeholder).
 *
 *   Rework Rate = (reopened OR Rework-linked) ÷ delivered in period × 100
 *
 * LOWER IS BETTER, which is why its target carries `invert` — without that a
 * 3% rework rate would paint red for being "below target".
 *
 * The card is explicit about which of the two signals it actually saw. Reopen
 * detection needs expand=changelog in the export and is off by default, so most
 * of the time this rate is LINK-ONLY and therefore an understatement. Saying so
 * on the card is the difference between a floor and a measurement.
 */
function qualityTile_(done, trendPer, trendLabels, headlineLabel, head, hi, phase) {
  // Registry first (review item #6): the target below falls back to reg.target,
  // and reg_ handing back {} on a miss would have quietly produced a rework rate
  // with no target and no invert flag — a LOWER-IS-BETTER metric graded as if
  // higher were better is worse than not drawing it.
  var reg = regRequired_("quality");
  if (!reg) return registryMissingTile_("quality", "period");
  var tg = (MODEL.meta.targets || {}).quality ||
           (reg.target ? { green: reg.target.green, amber: reg.target.amber } : null);
  if (tg) tg = { green: tg.green, amber: tg.amber, invert: reg.invertTarget !== false };

  if (!MODEL.meta.jiraAvailable || !MODEL.reworkBuckets) {
    // No reworkBuckets at all = a pre-v10 cached payload, not an empty period.
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: MODEL.meta.jiraAvailable
        ? "rework feed not in this payload — refresh to rebuild on the current schema"
        : "Jira data unavailable",
    });
  }

  var q = bucketsFor_(MODEL.reworkBuckets, head.isos);
  var series = done.map(function (p) {
    var b = bucketsFor_(MODEL.reworkBuckets, p.isos);
    return b.nDelivered > 0 ? b.nRework / b.nDelivered * 100 : null;
  });
  var hIdx = hi === undefined ? done.length - 1 : hi;
  var trend = series.slice(Math.max(0, hIdx - 5), hIdx + 1);

  if (!q.nDelivered) {
    return tileHtml_("Quality / Rework", null, "", [], {
      headlineLabel: headlineLabel,
      unavailable: "no delivered work in this period under the active filters",
    });
  }

  var pct = q.nRework / q.nDelivered * 100;
  // Reopens are one of the two signals in the Dictionary definition. When the
  // export never fetched the changelog (CONFIGJ.FETCH_CHANGELOG off) the
  // numerator CANNOT contain them, so the rate is a floor whatever its value.
  var isFloor = q.nReopenCov === 0;
  // Coverage = the share of delivered work whose rework signals were actually
  // measurable. The link signal exists on every v3.6.0 row; the reopen signal
  // only where the changelog was fetched. With reopens off, half the definition
  // is unmeasured and the confidence gate has to see that.
  var reopenCov = q.nDelivered > 0 ? q.nReopenCov / q.nDelivered : 0;
  var coverage = (1 + reopenCov) / 2;   // link signal always present, reopen maybe
  var conf = applyGatePolicy_(
    metricConfidence_(reg.coverageGate, coverage,
                      series.filter(function (v) { return v !== null; }).length));

  var qDetail = [];
  var cmp = q.nRework + " of " + q.nDelivered + " delivered items needed rework" +
    smallN_(q.nDelivered);
  qDetail.push("Signals: " + q.nLinked + " rework-linked" +
    (q.nReopenCov > 0
      ? ", " + q.nReopened + " reopened (of " + q.nReopenCov + " checked)."
      : ". Reopens NOT measured — the export did not fetch the Jira changelog."));

  // The single most important caveat on this card, stated in plain words rather
  // than buried in the ⓘ: a link-only rate is a FLOOR, not a measurement.
  // The floor caveat is NOT demoted: it is the difference between "we ship clean
  // work" and "we cannot see rework". It rides on the hero's own signal line now
  // (tileHtml_ opts.floor), which is MORE prominent than the fifth body line it
  // used to occupy, not less.
  if (q.nReopenCov === 0) {
    qDetail.push("Reopen detection needs expand=changelog on the Jira export " +
      "(CONFIGJ.FETCH_CHANGELOG), which is off by default because it is expensive. Until it is " +
      "on, an issue that was reopened but never link-tagged is invisible here.");
  }
  qDetail.push("CSAT companion not connected: the Metrics Dictionary pairs this rate with a CSAT " +
    "score (0–100). The survey API is not wired — PR-09, target 2026.W37.");
  qDetail = qDetail.concat(regCaveats_("quality"));

  return gatedTile_("Quality / Rework", conf, reg,
    "no delivered work in this period under the active filters",
    Math.round((1 - coverage) * 100) + "% of the rework definition is unmeasured",
    function () {
      return tileHtml_("Quality / Rework", pct, cmp, trend,
                       { drillMetric: "quality", headlineLabel: headlineLabel, target: tg, phase: phase,
                         floor: isFloor, detail: qDetail,
                         floorWhy: "Reopen detection is one of the two signals in this metric and " +
                           "the export did not fetch it (CONFIGJ.FETCH_CHANGELOG is off), so the " +
                           "numerator can only undercount. The true rate is this value or higher — " +
                           "which is why it carries no red/amber/green verdict.",
                         std: stdFor_(series, conf), trendLabels: trendLabels });
    }, headlineLabel, series.map(function () { return coverage * 100; }), trendLabels);
}

// ══════════════════════════════════════════════════════════════════════════
// METRIC ACCESSORS — one definition of "the number", reused by every view
//
// The KPI cards, the Executive comparison bars and the recoverable-hours pulse
// all have to compute the same rate over different slices. Routing them through
// one table is what keeps a region bar and the KPI card from quietly
// disagreeing: there is exactly one expression per metric, and it lives here.
// ══════════════════════════════════════════════════════════════════════════
var METRICS_ = {
  util: {
    id: "util", targetKey: "util",
    label: function () { return nsLive_() ? "Billable Utilization" : "Capacity Utilization (tracked)"; },
    axis: function () {
      return (nsLive_() ? "billable" : "tracked") +
        " hours ÷ scheduled capacity (headcount × standard hours)";
    },
    available: function () { return true; },
    value: function (isos) {
      var s = utilFor_(isos);
      // Gross scheduled capacity — the same denominator as the KPI headline.
      // One definition per metric; a chart that quietly used the net rate would
      // disagree with the card above it.
      return nsLive_() ? s.grossPct : s.grossTrackedPct;
    },
    // Coverage drives the confidence gate — same rule as the KPI card, so a
    // slice too thinly classified to publish on the card is not publishable in
    // a chart either.
    coverage: function (isos) {
      var s = utilFor_(isos);
      if (!nsLive_()) return s.avail > 0 ? 1 : null;
      var cov = s.tracked > 0 ? s.trackedCov / s.tracked : null;
      return cov;
    },
    n: function (isos) { return utilFor_(isos).avail; },
  },
  onTime: {
    id: "onTime", targetKey: "onTime",
    label: function () { return "On-Time Delivery"; },
    axis: function () { return "resolved delivery items on or before their due date"; },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.n > 0 ? b.onTime / b.n * 100 : null;
    },
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.onTimeBuckets, isos);
      return b.nAll > 0 ? b.n / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.onTimeBuckets, isos).n; },
    // The unit the grid prints beside the rate: "50% (1/2 items)". Declared only
    // where n() returns a COUNT — see gridCellHtml_.
    sampleNoun: "items",
  },
  /**

  avail: {

    // A ratio over HOURS, not over a count of records — there is no coverage

  quality: {

  // Task-grain schedule read since registry 4.4 (2026-09-09). Per-person

  forecast: {
    id: "forecast", targetKey: "forecast",
    label: function () { return "Forecast Accuracy"; },

    value: function (isos) {

    n: function (isos) { var b = bucketsFor_(MODEL.forecastTaskBuckets || [], isos); return b.nHit + b.nMiss; },

  leadTime: {
    id: "leadTime", targetKey: null, unit: "days",
    label: function () { return "Lead Time"; },

    id: "throughput", targetKey: null, unit: "hrs",
    label: function () { return "Throughput"; },

    available: function () { return !!MODEL.meta.jiraAvailable; },
    value: function (isos) {

    },
    // Coverage: nEst/nAll — throughputBuckets_ (Code.js) never populates a `.n`

    // undefined and bucketsFor_'s `out.n += b.n` (no ||0 fallback) turns it
    // into NaN — metricConfidence_ then reads NaN as no-data and the operating
    // band/verdict silently never draw. Same formula renderFlow_'s throughput
    // tile already uses (Dashboard.html ~2513) — one definition, not two.
    coverage: function (isos) {
      var b = bucketsFor_(MODEL.throughputBuckets || [], isos);
      return b.nAll > 0 ? b.nEst / b.nAll : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.throughputBuckets || [], isos).nEst; },
  },
  // ── Task 15 grid columns (spec 2026-08-06 §6) ──────────────────────────────
  // Both carry targetKey: null on purpose (D11): nobody owns a per-head or a
  // weeks-to-clear bar, and an unratified target on the C-suite grid reads as
  // agreed the moment it is on screen. Labels/axis read from reg_() rather
  // than a literal string — the registry is the one place the "no target,
  // norm-graded only" language already lives (both metrics' `deviations`).
  clearedPerHead: {
    // ⚠ NOT RENDERED ANYWHERE since 2026-08-17, when it left the Drill-down's
    // chips and grid columns. The accessor stays because the SHELF and the
    // masthead read it: shelfRows_ walks the SERVER registry, which still
    // defines this metric, and calls metricSampleN_ / metricCoverageNow_ —
    // both of which look the id up in METRICS_. Delete this entry and the
    // shelf silently loses its sample-size read for a metric it still lists.
    // If the metric is ever dropped from the registry too, this goes with it.
    id: "clearedPerHead", targetKey: null, unit: "items",
    label: function () { return reg_("clearedPerHead").name || "Cleared per Person"; },
    axis: function () {
      return reg_("clearedPerHead").formula || "items resolved ÷ people in the group ÷ weeks in period";
    },
    available: function () { return !!MODEL.meta.jiraAvailable; },
    // Items cleared ÷ DISTINCT headcount ÷ weeks in the window — the fix for
    // the prototype's flat-target grading, which ranked a group by size: 8
    // people clearing 12 items scored a miss while 63 clearing 61 scored a
    // pass. Per head, per week, the smaller group is not automatically worse.
    value: function (isos) {
      if (!isos || !isos.length) return null;
      var head = filteredPeople_().filter(function (p) { return existsIn_(p, isos); }).length;

      var b = bucketsFor_(MODEL.throughputBuckets || [], isos);
      return b.nAll / head / isos.length;
    },
    // coverageGate is 0 in the registry — this is a ratio of a count to a
    // headcount, never a per-record attribute gate (same reasoning as
    // planCov's coverage below). metricConfidence_ still needs a non-null
    // number to tell "measured" from "nothing in scope" apart.
    coverage: function (isos) {
      var head = filteredPeople_().filter(function (p) { return existsIn_(p, isos); }).length;
      return head > 0 ? 1 : null;
    },
    n: function (isos) { return bucketsFor_(MODEL.throughputBuckets || [], isos).nAll; },
  },
  queueCover: {
    // ⚠ NOT RENDERED ANYWHERE since 2026-08-17, when it left the Drill-down's
    // chips and grid columns. The accessor stays because the SHELF and the
    // masthead read it: shelfRows_ walks the SERVER registry, which still
    // defines this metric, and calls metricSampleN_ / metricCoverageNow_ —
    // both of which look the id up in METRICS_. Delete this entry and the
    // shelf silently loses its sample-size read for a metric it still lists.
    // If the metric is ever dropped from the registry too, this goes with it.
    id: "queueCover", targetKey: null, unit: "weeks",
    // NOT reg_("queueCover") (blocking fix): the server registry entry of

    // open + unassigned open) ÷ median(resolved per week…)" — because
    // unassigned work belongs to no group and the hero is the only surface
    // that can report it. This grid column's own value() below divides the
    // ASSIGNED-ONLY snapshot by the ASSIGNED-ONLY clearing rate (same as the
    // backlog band's filterable sub-row) — a materially smaller number

    // name, so hero and grid are visibly different measures.

    // Overrides renderCompare_'s reg_(m.id).formula fallback for the same

    // backlog band's assigned sub-row) — flowOpenFor_ and assignedClearRate_

    // already narrows both to one comparison bar's population; isos plays no
