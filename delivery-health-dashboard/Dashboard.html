  // (user 2026-08-17), so they sit outside the bar above. Stated on the SAME
  // LINE as the bar, never only in a tooltip: a denominator that quietly got
  // smaller is how a bar comes to read better than the work behind it.
  var backlogN = r.epicBacklogN || 0;

    ? ' <span class="cellSub" title="Epics in To Do with no due date: assigned backlog, not a ' +

      "<b>" + (open ? "▾ " : "▸ ") + piiHtml_(r.pm) + "</b>" +
      // The two bars stay side by side and stay LABELLED. They are never
      // averaged: one is the PM's own field, the other is their team's hygiene.
      // A PM whose every epic is undated backlog has NO denominator here, and
      // says so rather than rendering a clean 100% over nothing.
      (r.epicN
        ? ' <span class="cellSub">· Owns ' + viaIcon + '<b class="' + ownCls + '">' + r.epicDated +
          "</b>/" + r.epicN + " epics dated" +
          (ownPct === null ? "" : " (" + ownPct + "%)") + " · bar 100%</span>"
        : ' <span class="cellSub">· Owns ' + viaIcon + '<span title="Every epic attributed to this PM is ' +
          'unstarted and undated — assigned backlog, which this bar does not grade. There is ' +
          'nothing committed to measure yet.">no committed epics</span></span>') +
      backlogNote +
      ' <span class="cellSub">· In project ' +
        (readyPct === null ? "no open tasks" : readyPct + "% of " + r.readyDen + " ready") +
        " <span title=\"Dated, estimated, linked and fresh. Team hygiene, shown as " +

    pmOppHtml_(r) +
    (open
      ? // 🎯 THIS PM's Needs-action queue (user 2026-08-28): inside the
        // collapsible section so each PM meets only their own areas of
        // opportunity — nothing renders when they are clean, the ✔ pill
        // above already says so.
        pmNeedsActionHtml_(r.epics) +
        // The 🚩 key list yields to the card's own "No due date" queue (user

        (missing && !(r.epics || []).some(PM_NEEDS_[0].match)

        // The carved-out set is nameable too, under a heading that says what it
        // is. These are not a queue to fix — they are the backlog this PM is
        // carrying — but a reader who wants to date one can still find it.
        (backlogN
          ? '<div class="cellSub pmVia">○ In backlog (To Do, no date — not graded): ' +

}

/**
 * The column-header row each EXPANDED section opens with (user 2026-08-28,

/** Every epic row for one PM, headed by the column labels, each epic

function pmEpicRowsHtml_(r, nowIso) {

  // pre-v50 epic falls back to its key prefix so the grouping never collapses
  // into one unnamed bucket.
  var groups = {}, order = [];

/**
 * One epic as a table row, plus its children as rows beneath when expanded.
 */
function pmEpicHtml_(e, nowIso) {
  var open = !!STATE.pmEpicOpen[e.key];
  var kids = e.children || [];
  var span = Object.keys(PM_COLS_).length;

    ? '<span class="' + dueBand_(e.due, nowIso, false) + '">' + esc_(e.due) + "</span>"
    : '<span class="sigBad" title="Work started without a deadline. This bypasses On-Time ' +
      'Delivery tracking and requires immediate scoping.">&#128681; none</span>';

  // The `vs` cell for an EPIC: how its children sit against its own committed
  // week. "over" leads because it is the finding — an epic cannot land on its
  // date if its own work is scheduled past it.
  var tally = [];
  if (e.breached) tally.push('<span class="sigBad">' + e.breached + " breached</span>");
  if (e.atRisk) tally.push('<span class="sigWarn">' + e.atRisk + " at risk</span>");
  if (e.noDate) tally.push('<span class="sigWarn">' + e.noDate + " undated</span>");
  if (e.within) tally.push('<span class="sigGood">' + e.within + " within</span>");

  // precisely, and printing both would read as two findings about one fact.

      'epic — nothing has been broken down under it, so its hours cannot be attributed to an engagement.">&#128279; without tasks</span>');
  }

  // LATEST push in the window (the row is a sentence, not a log).
  var pushedN = pmPushedInWindow_(e);
  if (pushedN) {
    var inWin = (e.pushes || []).filter(function (p) { return PM_WINDOW_.isos.indexOf(p.wk) !== -1; });
    var lastP = inWin[inWin.length - 1];
    gaps.push('<span class="sigWarn" title="' + esc_("Due date moved " + lastP.from + " → " + lastP.to +
      " on " + lastP.at + (pushedN > 1 ? " (" + pushedN + " pushes in " + pmWindowLabel_() + ")" : "") +
      ". A commitment moved while live — the conversation is why, and whether the new date is real.") +
      '">⏩ pushed +' + lastP.days + "d in " + esc_(lastP.wk) + "</span>");
  }

    gaps.push('<span class="sigWarn" title="Untouched beyond the backlog\'s staleness bar. ' +
      'Blocked, or not real work.">&#128338; ' +
      (e.staleDays ? e.staleDays + "d" : "stale") + "</span>");

        "<b>" + pmKeyLink_(e.key) + "</b> " +

      "<td>" + esc_(e.status) + "</td>" +
      '<td class="tnum">' + dueCell + "</td>" +

      "</td>" +

      ? '<span class="' + dueBand_(c.due, nowIso, false) + '">' + esc_(c.due) + "</span>"

          ? '<span class="sigBad" title="Finishes after an epic whose week has already ' +

            "w past · epic overdue</span>"
          : c.verdict === "atRisk"
            ? '<span class="sigWarn" title="Finishes AFTER the epic it belongs to, whose ' +
              'date has not passed yet. Move the child, or move the epic.">⚠ ' + c.overByWeeks +
              "w past epic</span>"
          : c.verdict === "within" ? '<span class="sigGood">✔ within</span>'
          : c.verdict === "nodate"
            ? '<span class="sigWarn" title="Started with no date of its own — it cannot be ' +
              'graded against a deadline.">no date</span>'
            : '<span class="cellSub" title="The epic has no due date, so there is nothing ' +
              'to measure against.">ungraded</span>';
    return '<tr class="pmKid">' +
      '<td class="tname"><span class="pmKidTick">↳</span> ' + pmKeyLink_(c.key) + " " +
        '<span class="cellSub">' + esc_(trunc_(c.summary, 40)) + "</span></td>" +
      "<td>" + esc_(c.status) + "</td>" +
      '<td class="tnum">' + due + "</td>" +
      '<td class="tnum">' + v + "</td>" +
      '<td colspan="2"></td>' +
    "</tr>";
  }).join("") : "";

  // One click to work the whole list in Jira, over exactly the keys shown - the
  // same affordance the People drill-down carries.
  var openAll = open && kids.length && jiraBase_()
    ? '<tr class="pmKid"><td colspan="' + span + '"><span class="cellSub">' +

                   kids.length === 1 ? "Open this one in Jira"

}

/**

 * Degrades to plain escaped text when no Jira site is configured, rather than

 */
function pmKeyLink_(key) {
  if (!jiraBase_()) return esc_(key);
  return '<a href="' + esc_(jiraIssueUrl_(key)) + '" target="_blank" rel="noopener" ' +

}

function renderEpicDue_() {
  var el = document.getElementById("epicDuePanel");
  if (!el) return;
  var a = MODEL.epicDueAudit;
  // Absent ≠ clean. A payload built before this audit existed must say it did not
  // look, or "0 epics missing a date" reads as a pass on an audit nobody ran.
  if (!a) {
    el.innerHTML = '<h3>Epics without a due date</h3><div class="emptyState">' +
      "Not in this payload — ↻ Refresh to rebuild on the current schema.</div>";
    return;
  }
  var head = '<h3 style="margin:0">Epics without a due date' + scopeTag_("org") + "</h3>";
  if (!a.n) {
    el.innerHTML = head + '<div class="emptyState">No open epics in the current export.</div>';
    return;
  }
  var pct = Math.round((a.n - a.missing) / a.n * 100);
  // Zero renders as a PASS, not as an empty panel — a check that vanishes when it
  // succeeds is a check nobody trusts the next time it fires.
  if (!a.missing) {
    el.innerHTML = head +
      '<p class="cellSub"><b class="sigGood">All ' + a.n + " open epic" + (a.n === 1 ? "" : "s") +
      " carry a due date.</b> The team's rule is 100% and this is 100% — audited on every " +
      "rebuild, so it will reappear the moment one slips.</p>";
    return;
  }
  // TWO ROWS PER TYPE (2026-08-17). The key list used to sit in a fourth column,
  // where it was sized by the three numeric columns beside it — 180 keys came
  // out two-abreast in a narrow cell, metres tall, with the rest of the row
  // empty. The queue gets the FULL panel width on its own row instead, so the
  // grid can actually use the columns it was built for.
  var COLS_ = 3;
  var rows = (a.rows || []).filter(function (r) { return r.missing > 0; }).map(function (r) {
    var share = r.n > 0 ? Math.round(r.missing / r.n * 100) : 0;
    return "<tr><td class='tname'>" + esc_(r.type) + "</td>" +
      '<td class="tnum">' + r.missing + " of " + r.n + "</td>" +
      '<td class="tnum"><span class="sigBad">' + share + "%</span></td></tr>" +
      // colspan MUST equal the rendered column count — a mismatch shifts every
      // header above it and the table quietly stops describing itself.
      '<tr><td colspan="' + COLS_ + '" class="keyRow">' +
      keyGridHtml_(r.keys, r.capped, a.keyCap) + "</td></tr>";
  }).join("");
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px">' + head +
      '<button class="iconbtn" style="margin-left:auto" onclick="saveEpicDueCsv_()" ' +
      'title="Download every open epic missing a due date, grouped by epic type, as CSV">CSV</button>' +
    "</div>" +
    '<p class="cellSub"><b class="sigBad">' + a.missing + " of " + a.n +
      " open epic" + (a.n === 1 ? "" : "s") + " (" + Math.round(a.missing / a.n * 100) +
      "%) carry no due date</b> — " + pct + "% do. The team agreed every epic carries one, " +
      "<b>even if it is only the project end date</b>, so the bar here is 100% rather than a " +
      "coverage gate: an epic with no date is an engagement with no committed end, and " +
      "On-Time Delivery cannot describe it at all." +
      "</p>" +
    '<div class="gwrap"><table class="hyg tmx"><thead>' +
      '<tr><th class="tname">Epic type</th><th class="tnum">Missing</th>' +
      '<th class="tnum">Share</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "<b>Open epics only</b>, whatever their status: a To Do epic with no date is exactly what " +
      "this audits, so it is <i>not</i> subject to the To&nbsp;Do carve that the 👥 roster and " +
      "🧬 matrix columns apply. Resolved epics are out — a date added now moves no future number. " +
      "<b>Unassigned epics are included</b> and no person filter applies, which is why this panel " +
      "is tagged ORG: an epic nobody owns still needs an end date." +
      "</div>";
}

/**
 * ── KEY GRID: a worked queue, not a wall (user 2026-08-17) ──────────────────
 *
 * The 🚩 audit lists every open epic missing a due date. At 230 keys that ran
 * as one wrapping run inside a table cell — unreadable, unscannable, and it
 * stretched the row until the rest of the table stopped making sense.
 *
 * Collapsed by default behind a count, expanded into a multi-column grid. Three
 * decisions worth stating:
 *   · SORTED ALPHABETICALLY, so a PM hunting one key scans rather than reads,
 *     and two rebuilds put the same key in the same place.
 *   · <details>, not a JS toggle — it survives a re-render with its open state
 *     intact and works with no script at all.
 *   · COPY ALL is the actual exit: the list gets pasted into Slack or a Jira
 *     bulk edit, and hand-copying 230 links is why the panel went unused.
 *
 * The count in the summary is the FULL count; the grid draws what the payload
 * carries, and says so when the server capped it.
 */
function keyGridHtml_(keys, capped, cap) {
  keys = keys || [];
  if (!keys.length) return '<span class="cellSub">—</span>';
  var sorted = keys.slice().sort(function (a, b) { return String(a).localeCompare(String(b)); });
  var base = jiraBase_();
  var cells = sorted.map(function (k) {
    return '<span class="keyCell">' +
      (base ? jiraLink_(jiraIssueUrl_(k), k, "Open " + k + " in Jira") : esc_(k)) + "</span>";
  }).join("");
  // The raw list travels in a data attribute rather than being rebuilt from the
  // DOM on click: the rendered cells are links, and scraping their text back out
  // would break the moment the label stops being the key.
  var payload = sorted.join(" ");
  return '<details class="keyBox"><summary>View ' + sorted.length + " key" +
    (sorted.length === 1 ? "" : "s") + "</summary>" +
    '<div class="keyTools">' +
      '<button class="btn" data-keys="' + esc_(payload) + '" onclick="copyKeys_(this)" ' +
      'title="Copy every key to the clipboard, space-separated — ready to paste into Slack or a ' +
      'Jira bulk edit">Copy all keys</button>' +
      jiraOpenAll_(sorted, "Open all in Jira") +
      (capped ? ' <span class="cellSub">first ' + cap +
        " shown; the count above is complete</span>" : "") +
    "</div>" +
    '<div class="keyGrid">' + cells + "</div></details>";
}

/**
 * Copy a button's key list to the clipboard.
 *
 * Falls back to a hidden textarea + execCommand: this runs inside the
 * HtmlService iframe, where navigator.clipboard is unavailable on older
 * browsers and can be refused outright. A copy button that silently does
 * nothing is worse than no button, so the label reports the outcome either way.
 */
function copyKeys_(btn) {
  var text = btn.getAttribute("data-keys") || "";
  var label = btn.textContent;
  function done(ok) {
    btn.textContent = ok ? "Copied ✓" : "Press Ctrl+C";
    setTimeout(function () { btn.textContent = label; }, 2000);
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); },
                                              function () { fallback_(); });
      return;
    }
  } catch (e) { /* fall through */ }
  fallback_();
  function fallback_() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand && document.execCommand("copy");
      document.body.removeChild(ta);
      done(!!ok);
    } catch (e2) { done(false); }
  }
}

/** Key list as a compact, wrapping run of keys — the queue itself. Reports the cap
    rather than silently clipping, the same contract as every other key list here. */
function keyListHtml_(keys, capped, cap, showMax) {
  keys = keys || [];
  if (!keys.length) return '<span class="cellSub">—</span>';
  var base = jiraBase_();
  // `showMax` bounds what is DRAWN, independently of `cap` which bounds what the
  // payload carries. The 🚩 audit wants the whole list on screen — it is worked
  // ticket by ticket. The PM tab does not: 134 undated epics rendered as 134
  // inline links ran clean across the page and buried every other signal on the
  // row (user 2026-08-11, "the Gaps column is a disaster"). Same data, same
  // "Open all" affordance, a readable number of links.
  var shown = (showMax && keys.length > showMax) ? keys.slice(0, showMax) : keys;
  var hidden = keys.length - shown.length;
  // Every key is a link when a site is configured, plus one link that opens the
  // whole row at once — this list is worked by a PM going ticket by ticket, and
  // copy-pasting keys into a search was the actual cost of using it.
  var body = base
    ? shown.map(function (k) { return jiraLink_(jiraIssueUrl_(k), k, "Open " + k + " in Jira"); })
          .join(" · ")
    : esc_(shown.join(" · "));
  return '<span class="cellSub" style="word-break:break-word">' + body +
    (hidden ? ' <span class="cellSub">+ ' + hidden + " more</span>" : "") +
    (capped ? " <b>… first " + cap + " shown; the count above is complete</b>" : "") +
    jiraOpenAll_(keys, "Open all in Jira") + "</span>";
}

/** CSV of the audit — one row per offending epic, because this list gets worked

/**
 * Billable / non-billable / idle mini-bar for the analysis period — the same
 * per-person numbers the retired People-grid workload bars drew (aggWeeks_).
 * ALWAYS period-scoped (worklogs are period-shaped; a backlog snapshot has no
 * hours) — the header carries a PERIOD tag for exactly this reason.
 * ELIGIBILITY reuses the recoverable-hours exclusions (oppRows_, review
 * 2026-08-05 #2): ramping new hires and on-leave people get no idle segment —
 * their "idle" is the explanation, not a recoverable signal — and sort last.
 */
/**
 * The AVAILABLE cell (user 2026-08-28; replaces the billable-share Hours bar).
 * Scheduled capacity not yet used in the period — the hours a manager can
 * actually route more work against. The signal is provided; the decision to
 * assign stays the manager's, which is why this is a figure, not a verdict.
 *
 * Ineligible people (ramping, intern, on leave, benched) show their context
 * instead of a number — the same three exclusions the recoverable-hours pulse
 * applies, so this column and that headline can never disagree about whose
 * empty capacity is assignable room.
 */
function availCellHtml_(p, isos) {
  var w = aggWeeks_(p, isos);
  // No weeks at all + a hire date = the period predates them. "—" reads as
  // "delivered nothing"; 🌱 says why there is nothing to read (the retired
  // People grid's pre-hire rule, reattached to the roster 2026-08-06).
  if (!w && p.hired) {
    return '<span class="cellSub" title="Joined ' + esc_(p.hired) +
      " — this period is before their start date, so there is nothing to measure yet.\">🌱 joined " +
      esc_(p.hired) + "</span>";
  }
  if (!w || !(w.avail > 0)) return "—";
  var ineligible = p.newHire === true || p.onLeave === true || p.onBench === true || p.isIntern === true;
  if (ineligible) {
    return '<span class="cellSub" title="Ramping new hire / intern / on leave — spare capacity here is the explanation, not assignable room (same exclusion as the recoverable-hours figure).">' +
      (p.onLeave ? "on leave" : p.onBench ? "on the bench" : p.isIntern ? "in training" : "ramping") + "</span>";
  }
  var avail = Math.max(0, w.avail - w.tracked);
  var tip = r1_(w.tracked) + "h used of " + r1_(w.avail) + "h scheduled this period — " +
    r1_(avail) + "h still available. Capacity a manager can decide to assign against; " +
    "the dashboard provides the signal, the routing decision stays human.";
  return (avail > 0 ? "<b>" : '<span class="cellSub">') + r1_(avail) + "h" +
    (avail > 0 ? "</b>" : "</span>") +
    ' <span class="cellSub" title="' + esc_(tip) + '">of ' + r1_(w.avail) + "h</span>";
}

/**
 * 🎓 / 🌱 / 🏖 — the three reasons a row's numbers should be read differently.
 *
 * All three used to live on the People grid and went out with it (2026-08-05),
 * which left the Utilization card promising "their profiles and hours stay on

      'excluded from every availability figure; the person stays on the roster because ' +

}

// ── JIRA DEEP LINKS (2026-08-10) ─────────────────────────────────────────────
//
// Every key on this dashboard is a real ticket somebody wants to open, and until
// now the only route was copy-paste into a Jira search. Four rules:
//
// 1. THE SITE COMES FROM THE PAYLOAD (`meta.jiraBase`), never a literal here. A
//    second instance or a sandbox is a Script Property away, and a hardcoded host
//    would send a manager to the wrong Jira with nothing on screen to say so.
// 2. MULTI-KEY LINKS USE `key in (…)`, not `assignee = "Name"`. Jira Cloud has
//    not resolved assignee by display name since the GDPR change — it needs an
//    accountId, which this pipeline does not carry — so an assignee query would
//    fail for some names and silently return the wrong person's board for others.
//    Keys are exact, they are already on screen, and the resulting list is
//    provably the same records the dashboard just showed.
// 3. `target="_blank"` is REQUIRED, not a nicety: this page runs inside the
//    Apps Script sandbox iframe, and a same-tab navigation is swallowed by it.
//    `rel="noopener"` with it, always.
// 4. URLs are CAPPED. A 300-key queue makes a ~4 KB URL that some proxies drop;
//    the link takes the first JIRA_LINK_MAX_KEYS_ and says so rather than
//    producing a link that silently fails to open.
var JIRA_LINK_MAX_KEYS_ = 80;

function jiraBase_() {
  return (MODEL && MODEL.meta && MODEL.meta.jiraBase) || "";
}

/** Anchor to a single issue — the plain, always-valid form. */
function jiraIssueUrl_(key) {
  return jiraBase_() + "/browse/" + encodeURIComponent(String(key || "").trim());
}

/** Issue-navigator URL for a JQL string. */
function jiraJqlUrl_(jql) {
  return jiraBase_() + "/issues/?jql=" + encodeURIComponent(jql);
}

/**
 * "Open these N in Jira" — a JQL over the exact keys on screen.
 * Returns null when there is no site configured or no key to open, so callers
 * render nothing rather than a dead link.
 */
function jiraKeysUrl_(keys) {
  if (!jiraBase_() || !keys || !keys.length) return null;
  var take = keys.slice(0, JIRA_LINK_MAX_KEYS_);
  return jiraJqlUrl_("key in (" + take.join(",") + ") ORDER BY duedate ASC, priority DESC");
}

/** One anchor, escaped, sandbox-safe. `text` is escaped here — callers pass plain
    strings, never markup, so a summary containing "<" can never inject. */
function jiraLink_(href, text, title) {
  return '<a href="' + esc_(href) + '" target="_blank" rel="noopener"' +
    (title ? ' title="' + esc_(title) + '"' : "") + ">" + esc_(text) + "</a>";
}

/** The "open the whole list" affordance, with its own cap disclosure. */
function jiraOpenAll_(keys, label) {
  var url = jiraKeysUrl_(keys);
  if (!url) return "";
  var capped = keys.length > JIRA_LINK_MAX_KEYS_;
  return " " + jiraLink_(url, "↗ " + (label || "Open in Jira") +
      (capped ? " (first " + JIRA_LINK_MAX_KEYS_ + ")" : ""),
    capped
      ? "Opens the first " + JIRA_LINK_MAX_KEYS_ + " of " + keys.length +
        " in the Jira issue navigator — a URL carrying every key would be too long for some browsers."
      : "Opens these " + keys.length + " in the Jira issue navigator, sorted by due date.");
}

}

/** Second-level expand: the whole list instead of the first few (manager request
    2026-08-10 — "in case the manager wants to see all tickets, not only 8"). A

    explain the RAG cells above it and a 60-row table buries them. The items are

function toggleRosterDetailAll_(name) {

  renderRoster_();
}

/** How many backlog items a freshly-opened detail row shows. Server-supplied so
    one config edit moves the view and the "N of M" line together; the literal is
    the pre-v32 fallback, matching what those payloads were built against. */
function backlogItemsShown_() {
  return (MODEL.meta && MODEL.meta.backlogItemsShown) || 8;
}

/**
 * Compare two "YYYY.WN" week keys. → -1 | 0 | 1, or null when either is
 * unparseable (an unknown shape must never silently rank as "earlier").
 *
 * NUMERIC ON PURPOSE. Week keys are NOT zero-padded — isoWeekNum_ returns an
 * integer, so weekKeyFromDate_ emits "2026.W9", not "2026.W09". A lexicographic
 * compare therefore ranks "2026.W9" AFTER "2026.W10", which would paint every
 * genuinely overdue item green for the first nine weeks of each year: invisible
 * in August, wrong every February. The server's isoWeekBefore_ parses the same
 * pattern for the same reason — this is that rule, client-side.
 */
function isoCmp_(a, b) {
  var pa = /^(\d{4})\.W(\d{1,2})$/.exec(String(a || ""));
  var pb = /^(\d{4})\.W(\d{1,2})$/.exec(String(b || ""));
  if (!pa || !pb) return null;
  var ya = +pa[1], yb = +pb[1];
  if (ya !== yb) return ya < yb ? -1 : 1;
  var wa = +pa[2], wb = +pb[2];
  return wa === wb ? 0 : (wa < wb ? -1 : 1);
}

/**
 * Urgency band for a due-date cell, as a CSS class name.
 *
 *   🔴 sigBad   due week EARLIER than the current ISO week  → overdue
 *   🟠 sigWarn  due week IS the current ISO week            → act now
 *   🟢 sigGood  due week LATER than the current ISO week    → future
 *
 * WEEK precision, not day precision: the managers' rule (2026-08-10) is that the
 * current week is compliant, and every reporting surface in this app is weekly.
 * The red band is the same claim as the server's dhOverdue_ — see the parity
 * test in node-tests.js.
 *
 * `undatedIsGap` decides what NO due date means, and it is per-surface BY
 * DESIGN — do not "fix" the inconsistency:
 *   true  → the caller's list is already filtered to STARTED work (openIssues
 *           drops unstarted-undated by rule), so an undated row there is a real
 *           gap and stays the red it has always been.
 *   false → the caller's list contains UNSTARTED work too, which is not a
 *           commitment yet and must not be coloured as a failure.
 *
 * Returns "" for ungraded, which callers render as a plain cell.
 */
function dueBand_(dueIso, nowIso, undatedIsGap) {
  if (!dueIso) return undatedIsGap ? "sigBad" : "";
  var c = isoCmp_(dueIso, nowIso);
  if (c === null) return "";
  return c < 0 ? "sigBad" : (c === 0 ? "sigWarn" : "sigGood");
}

/** The CURRENT ISO week, from the payload the model already ships.
    NOT meta.headlineIso — that is the LAST COMPLETED week (Code.js:1106), and
    using it would paint everything due this week red. */
function currentIso_() {
  var gw = (MODEL && MODEL.meta && MODEL.meta.gridWeeks) || [];
  for (var i = 0; i < gw.length; i++) if (gw[i] && gw[i].status === "now") return gw[i].iso;
  return "";
}

/**
 * The Due cell for the People drill-down.
 *
 * `undatedIsGap` is TRUE here and that is not an oversight: this table is fed by
 * openIssues, which already excludes unstarted-undated tickets by the managers'
 * 2026-08-10 rule — so anything undated reaching this cell is STARTED work with
 * no committed date, which BACKLOG_SIGNALS_.undated grades "bad" and which has
 * rendered red since before the bands existed. Grey here would silently
 * downgrade a live signal. The 🗓 PM tab, which DOES show unstarted work, passes
 * false. See spec 2026-08-11 §4.3.
 */
function dueCellHtml_(dueIso) {
  if (!dueIso) {
    return '<span class="sigBad" title="Started work with no due date — it can ' +
           'never appear in On-Time Delivery.">—</span>';
  }
  var cls = dueBand_(dueIso, currentIso_(), true);
  var tip = cls === "sigBad" ? "Overdue — the committed week has ended."
          : cls === "sigWarn" ? "Due this week — still a live commitment."
          : cls === "sigGood" ? "Due in a later week." : "";
  return '<span class="' + cls + '" title="' + esc_(tip) + '">' + esc_(dueIso) + "</span>";
}

/** ▸ row: the person's open backlog items (backlogByPerson_ payload, already
    on p.backlog) + the period's hours line — the People grid's per-person
    detail, reattached where the signal is (spec §5.2). */
function rosterDetailRow_(p, head) {
  if (!STATE.openDetail[p.name]) return "";
  var w = aggWeeks_(p, head.isos);
  // Same PTO carve as the mini bar: time off is named, never left inside the
  // non-billable figure a reader is about to ask someone to explain.
  var dOff = w ? Math.min(Math.max(0, w.trackedOff || 0), w.nonBillable) : 0;
  var hours = w
    ? "Tracked " + r1_(w.tracked) + "h of " + r1_(w.avail) + "h scheduled in " + esc_(head.label) +
      (w.billable > 0 || w.nonBillable > 0
        ? " · billable " + r1_(w.billable) + "h · non-billable work " + r1_(w.nonBillable - dOff) + "h" +
          (dOff > 0 ? " · time off " + r1_(dOff) + "h (tracked in Tempo, inside non-billable by rule)" : "")
        : "")
    : (p.hired ? "Joined " + esc_(p.hired) + " — after " + esc_(head.label)
               : "No scheduled capacity in " + esc_(head.label));
  // RESOLVED view (user 2026-09-09): on a complete window the row lists what
  // this person CLOSED in it — the population the cells above are graded on —
  // instead of today's open backlog, which follows no period.
  if (STATE.typePop === "resolved") {
    return '<tr class="detailRow"><td colspan="' + rosterColKeys_().length + '"><div class="cellSub">' +
      hours + "</div>" + resolvedDetailHtml_(p, head) + "</td></tr>";
  }
  // Two levels of expand (2026-08-10). `carried` is what the payload holds for
  // this person; `items` is what this render shows. The default stays short so the
  // row still reads as an explanation of the cells above it.
  var carried = (p.backlog && p.backlog.items) || [];
  var showAll = !!STATE.openDetailAll[p.name];
  var items = showAll ? carried : carried.slice(0, backlogItemsShown_());
  var nameArg = esc_(p.name).replace(/'/g, "\\'");
  // Three DIFFERENT facts, and they are deliberately not collapsed into one line:
  // how many are shown, how many the payload carries, and how many the person
  // actually has open. A clipped list read as complete is how "we cleared them
  // all" becomes wrong — the same contract as the gaps queue's key caps.
  var toggle = carried.length > backlogItemsShown_()
    ? ' <a href="#" onclick="event.stopPropagation();toggleRosterDetailAll_(\'' + nameArg + '\');return false" ' +
      'title="Show every open item loaded for ' + esc_(p.name) +
      ' — already in this page, nothing is fetched.">' +
      (showAll ? "▴ Show top " + backlogItemsShown_() : "▾ Show all " + carried.length) + "</a>"
    : "";
  // The line only appears when there is something to SAY — either the view is
  // showing less than it holds, or the payload is holding less than the person
  // has. A note on a row that shows every item is noise, and noise on the healthy
  // rows is what teaches people to skip the line on the clipped ones.
  // p.backlog is null for anyone with no open work at all — every read of it
  // below has to survive that, which is why these are resolved once here.
  // `total` is the LISTABLE population, not the whole backlog: unstarted undated
  // tickets are ignored by rule and never reach `items`, so counting them in the
  // denominator would print "8 of 63" over a list that can only ever reach 43.
  // On a pre-v34 payload `listed` is absent and `count` IS the listable set.
  var total = (p.backlog && (p.backlog.listed !== undefined ? p.backlog.listed : p.backlog.count)) || 0;
  var ignored = (p.backlog && p.backlog.ignoredN) || 0;
  var clipped = total > carried.length;
  // Only when the list is showing less than it could: a "2 of 2" line on a row
  // that already shows everything is noise, and noise on the complete rows is
  // what teaches people to skip the line on the truncated ones. The full
  // population is accounted for by the reconciliation line below regardless.
  var noteText = (!items.length || (items.length >= total && !clipped)) ? "" :
    (showAll
      ? "All " + items.length + " items carried, of " + total + " listed"
      : "Top " + items.length + " of " + total + " listed") +
    " (by remaining hours)." +
    (clipped
      ? " The payload carries the " + carried.length + " largest; the counts and hours above cover all " +
        total + "."
      : "");
  // The toggle is NOT gated by the note: once expanded, the counts reconcile and
  // the note falls silent — but the way back to the short read has to stay.
  var note = (noteText || toggle) ? noteText + toggle : "";
  // ── WHERE THE REST OF `n` WENT (user report 2026-08-10) ────────────────────
  // "n = 79 but when you expand we show only 1 ticket in progress — where did
  // the rest go?" Three exclusions were stacked behind that column with nothing
  // on screen naming any of them, so the only available reading was that the
  // dashboard had lost 78 tickets. The row now closes the arithmetic:
  //
  //     n = listed + unstarted-undated (ignored by rule) + epics (roll up)
  //
  // Printed whenever the two numbers disagree, and NOT when they agree — a
  // reconciliation on a row that already reconciles is noise.
  var epicsN = (p.backlog && p.backlog.epicsN) || 0;
  var nAll = total + ignored + epicsN;
  var parts = [];
  if (total) parts.push("<b>" + total + "</b> listed below");
  if (ignored) {
    parts.push("<b>" + ignored + "</b> unstarted with no due date (ignored by rule — not a gap, " +
      "and not counted against this person)");
  }
  if (epicsN) {
    parts.push("<b>" + epicsN + "</b> epic" + (epicsN === 1 ? "" : "s") +
      " (never listed — they roll up their children, so listing both would double the load)");
  }
  // COLLAPSED (user 2026-08-10: the paragraph "could be wrapped to avoid going
  // out of the table"). The summary line is the arithmetic — the part a manager
  // needs at a glance — and the reasoning sits behind the disclosure, where it is
  // available to anyone who doubts the number and invisible to everyone else. It
  // is also width-capped: a single long sentence in a colspan cell stretches the
  // whole roster table, and a horizontally-scrolling roster is unreadable.
  var reconBits = [];
  if (total) reconBits.push(total + " listed");
  if (ignored) reconBits.push(ignored + " ignored");
  if (epicsN) reconBits.push(epicsN + " epic" + (epicsN === 1 ? "" : "s"));
  var recon = (nAll > total && parts.length)
    ? '<details class="reconBox"><summary><b>' + nAll + " open item" + (nAll === 1 ? "" : "s") +
      "</b> behind <b>Open issues</b> — " + reconBits.join(" · ") + "</summary>" +
      '<div class="cellSub">' + parts.join(" · ") +
      ". The signal cells above use their own denominators — Due date and Logged grade the " +
      "started work only — so none of these three numbers is the one being graded." +
      (STATE.typePop === "resolved"
        ? " You are on the <b>Resolved</b> view: the cells above cover " + esc_(head.label) +
          ", while this list is today's OPEN backlog and follows no period."
        : " This list is a snapshot of open work — it follows the filters, not the period picker.") +
      "</div></details>"
    : "";
  var list = items.length
    ? '<table class="hyg"><tr><th>Key</th><th>Summary</th>' +
      '<th title="The epic this ticket belongs to — what the work is FOR. A ticket with no epic ' +
      'cannot roll its hours up to an engagement, which is what the Epic link column grades.">' +
      "Belongs to</th><th>Status</th>" +
      '<th class="tnum">Rem. h</th><th>Due</th></tr>' +
      items.map(function (it) {
        // Name first, key second and muted: the name is what makes the row
        // readable at a glance, the key is what gets pasted into Jira. Unlinked
        // work says so in the same red the missing-date cell uses — it is the
        // same class of gap and the manager is looking at both in one pass.
        // Both keys are links when a site is configured. The epic's name stays
        // the visible text — the link is on it, so the row reads as English and
        // still gets you into Jira in one click.
        var epicHref = it.epicKey ? jiraIssueUrl_(it.epicKey) : "";
        var epic = it.epicKey
          ? (it.epicName
              ? (jiraBase_()
                  ? jiraLink_(epicHref, trunc_(it.epicName, 34), it.epicKey + " — " + it.epicName)
                  : '<span title="' + esc_(it.epicKey + " — " + it.epicName) + '">' +
                    esc_(trunc_(it.epicName, 34)) + "</span>") +
                ' <span class="cellSub">' + esc_(it.epicKey) + "</span>"
              : '<span class="cellSub" title="This epic is outside the exported window, so only ' +
                'its key is known here.">' +
                (jiraBase_() ? jiraLink_(epicHref, it.epicKey, "Open " + it.epicKey + " in Jira")
                             : esc_(it.epicKey)) + "</span>")
          : '<span class="sigBad" title="No epic or parent — these hours cannot roll up to an ' +
            'engagement, so they cannot inform the next quote.">— not linked</span>';
        var keyCell = jiraBase_()
          ? jiraLink_(jiraIssueUrl_(it.key), it.key, "Open " + it.key + " in Jira")
          : esc_(it.key);
        return "<tr><td>" + keyCell + "</td><td>" + esc_(it.summary) + "</td><td>" +
          epic + "</td><td>" +
          esc_(it.status) + '</td><td class="tnum">' + r1_(it.remHrs) + "</td><td>" +
          dueCellHtml_(it.due) + "</td></tr>";
      }).join("") + "</table>" +
      // One click to work the whole list in Jira, over exactly the keys shown.
      (jiraBase_()
        ? '<div class="cellSub">' +
          jiraOpenAll_(items.map(function (i) { return i.key; }),
                       "Open these " + items.length + " in Jira").replace(/^ /, "") + "</div>"
        : "") +
      (note ? '<div class="cellSub">' + note + "</div>" : "")
    // An empty list has TWO different causes and they must not read alike: no open
    // work at all, versus open work that is all unstarted and undated. The second
    // is a person carrying a real backlog nobody has committed a date to, and
    // reporting it as "nothing attributed" would hide that entirely.
    : '<div class="cellSub">' + ((ignored || epicsN)
        ? "Nothing to list here — see the breakdown below."
        : "No open backlog items attributed to this person.") + "</div>";
  // rosterColKeys_(), never Object.keys(ROSTER_COLS_): the Plan column is
  // conditional, and a colspan wider than the table extends this cell past the
  // table's right edge instead of spanning it.
  return '<tr class="detailRow"><td colspan="' + rosterColKeys_().length + '"><div class="cellSub">' +
    hours + "</div>" + list + recon + "</td></tr>";
}
/**
 * ▸ row, RESOLVED view: the items this person resolved inside the analysis
 * window (person.resolved, schema 49 — resolvedByPerson_). Misses first, then
 * the biggest logged effort, so the row explains the red cells above it before
 * anything else. Says plainly when the payload predates the field, when the
 * window is older than the horizon the payload carries, and when a week's list
 * is clipped — a clipped list read as complete is how "we closed them all"
 * becomes wrong.
 */
function resolvedDetailHtml_(p, head) {
  if (p.resolved === undefined) {
    return '<div class="cellSub">Resolved items are not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
  }
  var weeks = (p.resolved && p.resolved.weeks) || {};
  var items = [], count = 0, listed = 0, dated = 0, onTime = 0, epics = 0;
  (head.isos || []).forEach(function (iso) {
    var w = weeks[iso];
    if (!w) return;
    count += w.count || 0; dated += w.dated || 0; onTime += w.onTime || 0; epics += w.epics || 0;
    listed += (w.listed !== undefined ? w.listed : (w.items || []).length);
    (w.items || []).forEach(function (it) { items.push(it); });
  });
  // Is any part of this window older than the horizon the payload carries?
  var horizon = MODEL.meta.resolvedItemsWeeks || 13;
  // "Now" = the in-flight week, else the latest week the payload knows about
  // (gridWeeks carries {iso,status} objects; a pre-toggle payload carries
  // bare iso strings — allPeriods_ accepts both, so this does too).
  var gw = MODEL.meta.gridWeeks || [];
  var lastGw = gw.length ? gw[gw.length - 1] : null;
  var nowKey = currentIso_() || (lastGw ? (typeof lastGw === "string" ? lastGw : (lastGw.iso || "")) : "");
  var nowMon = weekKeyMonday_(nowKey);
  var beyond = nowMon !== null && (head.isos || []).some(function (iso) {
    var m = weekKeyMonday_(iso);
    return m !== null && (nowMon - m) > horizon * 7 * 864e5;
  });
  if (!items.length) {
    return '<div class="cellSub">' + (beyond
      ? "Resolved items for " + esc_(head.label) + " are beyond the " + horizon +
        "-week horizon this payload carries — the cells above still count them, the list cannot."
      : "No resolved items attributed to this person in " + esc_(head.label) + ".") + "</div>";
  }
  // Needs-action first (user 2026-09-09: "if the cell says 3/10 we show
  // everything, sorted by the 3 that need action, with the actual status").
  // `gaps` is the server's list of reasons, the same fields the cells grade;
  // late counts as a reason. Most reasons first, then the biggest logged effort.
  function reasons_(it) { return (it.gaps || (it.onTime === false ? ["late"] : [])).length; }
  items.sort(function (a, b) {
    if (reasons_(b) !== reasons_(a)) return reasons_(b) - reasons_(a);
    if ((b.spentHrs || 0) !== (a.spentHrs || 0)) return (b.spentHrs || 0) - (a.spentHrs || 0);
    return String(a.key).localeCompare(String(b.key));
  });
  var needN = items.filter(function (it) { return reasons_(it) > 0; }).length;
  var rows = items.map(function (it) {
    var epicHref = it.epicKey ? jiraIssueUrl_(it.epicKey) : "";
    var epic = it.isEpic
      ? '<span class="cellSub" title="This row IS an epic — a milestone this person closed.">— is an epic</span>'
      : it.epicKey
        ? (it.epicName
            ? (jiraBase_()
                ? jiraLink_(epicHref, trunc_(it.epicName, 34), it.epicKey + " — " + it.epicName)
                : '<span title="' + esc_(it.epicKey + " — " + it.epicName) + '">' + esc_(trunc_(it.epicName, 34)) + "</span>") +
              ' <span class="cellSub">' + esc_(it.epicKey) + "</span>"
            : '<span class="cellSub">' + (jiraBase_() ? jiraLink_(epicHref, it.epicKey, "Open " + it.epicKey + " in Jira") : esc_(it.epicKey)) + "</span>")
        : '<span class="sigBad" title="No epic or parent — these hours cannot roll up to an engagement.">— not linked</span>';
    var keyCell = jiraBase_() ? jiraLink_(jiraIssueUrl_(it.key), it.key, "Open " + it.key + " in Jira") : esc_(it.key);
    var verdict = it.onTime === true
      ? '<span class="sigGood" title="Resolved on or before its due calendar day.">✓ on time</span>'
      : it.onTime === false
        ? '<span class="sigBad" title="Resolved after its due calendar day.">✗ late</span>'
        : '<span class="cellSub" title="Carried no due date — never a commitment On-Time could grade.">no due date</span>';
    var gaps = it.gaps || (it.onTime === false ? ["late"] : []);
    var need = gaps.length
      ? gaps.map(function (g) {
          return '<span class="' + (g === "late" ? "sigBad" : "sigWarn") + '">● ' + esc_(g) + "</span>";
        }).join(" ")
      : '<span class="sigGood" title="Every graded field present and the date kept.">✓ complete</span>';
    return '<tr class="' + (gaps.length ? "needRow" : "") + '"><td>' + keyCell + "</td><td>" + esc_(it.summary) +
      "</td><td>" + epic + "</td><td>" + esc_(it.status || "") + "</td><td>" + need + "</td><td>" +
      esc_(it.resolvedOn || "") + "</td><td>" +
      (it.due ? esc_(it.due) : '<span class="cellSub">—</span>') + "</td><td>" + verdict +
      '</td><td class="tnum">' + r1_(it.spentHrs || 0) + "</td></tr>";
  }).join("");
  var summary = "<b>" + count + "</b> resolved in " + esc_(head.label) +
    ' · <b class="' + (needN ? "sigWarn" : "sigGood") + '">' + needN + "</b> of " + items.length +
    " listed need action (sorted first)" +
    (dated ? " · " + dated + " carried a due date, <b>" + onTime + "</b> kept it" : " · none carried a due date") +
    (epics ? " · " + epics + " epic" + (epics === 1 ? "" : "s") : "");
  var clip = listed < count
    ? ' <span class="cellSub">— ' + listed + " of " + count + " listed (needs-action first, then logged hours); the payload carries at most " +
      (MODEL.meta.backlogMaxItems || 60) + " per week.</span>"
    : "";
  return '<div class="cellSub" style="margin:4px 0">' + summary + clip + "</div>" +
    '<table class="hyg"><tr><th>Key</th><th>Summary</th>' +
    '<th title="The epic this item belongs to — what the work was FOR.">Belongs to</th>' +
    '<th title="The Jira status the item resolved in.">Status</th>' +
    '<th title="Why this item needs action: the same fields the cells above grade (due date, estimate, time logged, epic link), plus late. Items with reasons sort first.">Needs action</th>' +
    '<th title="Resolution date.">Resolved</th><th title="Committed week (from the Jira Due Date).">Due</th>' +
    '<th title="On time = resolved on or before the due calendar day — the same rule as the On-Time card.">On time</th>' +
    '<th class="tnum" title="Time logged on the item (Jira Time Spent).">Logged h</th></tr>' + rows + "</table>" +
    (jiraBase_()
      ? '<div class="cellSub">' + jiraOpenAll_(items.map(function (i) { return i.key; }),
          "Open these " + items.length + " in Jira").replace(/^ /, "") + "</div>"
      : "");
}

/** Scope tag chip — states which clock a column follows. The full version
    (threaded through the other tiles) arrives in Task 9; this one is real,
    not a placeholder — its API does not change later. */
function scopeTag_(kind) {
  var t = { period: ["PERIOD", "Analysis period — follows the period picker and every filter."],
            items:  ["ITEMS",  "Work items in the analysis period — every resolved or scheduled item, whoever it is assigned to (crew and items with no roster match included; interns' items excepted by the 2026-08-04 rule). Region / Team / PM narrow it through the assignee; Population, Role, Job family and the person search do not."],
            snap:   ["SNAP",   "Snapshot at the last export — follows filters, ignores the period picker."],

// ── DATA HYGIENE VIEW (FR-2.3/FR-2.4) ────────────────────────────────────────
//
// The raw attribution counts used to sit on the KPI cards in small grey type —
// "404 of 615 resolved had a due date" — which framed an organisational work
// queue as a caveat on a number. They live here instead: what's missing, how
// much, and what it blocks. Owner / prereq-ID / target-week columns were all
// removed (2026-08-03 / 2026-08-04) — accountability and scheduling live in
// the requirements doc, not in a widely-read table.
//
// Deliberately UNFILTERED: hygiene is a whole-population question. A region
// slice that looks well-tagged doesn't make the feed publishable.

/** Plain-language name for the population On-Time measures, so the hygiene row

  return { dictionary: "epics / milestones / client commitments",
           epic: "resolved epics",
           all: "resolved items (all types)" }[MODEL.meta.onTimeScope] || "resolved delivery items";
}

/**

function leaverIssues_() {

}

function leaverNoteHtml_() {
  var lx = (MODEL.meta || {}).leaverExcluded;
  if (!lx || !lx.issues) return "";
  return '<div class="cellSub" style="margin:8px 0" title="Former employees are ' +
