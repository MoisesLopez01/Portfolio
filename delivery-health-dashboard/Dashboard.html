/** Sums the server's per-week attribution counts over a set of ISO weeks. */
function hygieneFor_(isos) {
  var s = { res: 0, resDue: 0, resAssigned: 0, resRegion: 0, resTeam: 0,
            resReady: 0, resFull: 0, epics: 0, epicsEst: 0, epicsTime: 0,
            // SRSO binding (v29). Absent on a cached v28 row, which sums to 0
            // and is exactly what `srsoMeasurable === 0` is read as: not
            // measured. A field added here without a server counterpart would
            // silently report a solved gap.
            srsoAny: 0, srsoSeen: 0, srsoCompOnly: 0, srsoMeasurable: 0 };
  (MODEL.hygieneBuckets || []).forEach(function (h) {
    if (isos.indexOf(h.iso) === -1) return;
    Object.keys(s).forEach(function (k) { s[k] += (h[k] || 0); });
  });
  return s;
}

/** Person-week counts the Jira feed can't see: NS classification + capacity. */
function hygienePeopleFor_(isos) {
  var s = { tracked: 0, trackedCov: 0, weeks: 0, capEst: 0 };
  MODEL.people.forEach(function (p) {
    isos.forEach(function (iso) {
      var w = p.weeks[iso];
      if (!w) return;
      s.weeks++;
      s.tracked += w.tracked || 0;
      s.trackedCov += w.trackedCov || 0;
      if (w.capEst) s.capEst++;
    });
  });
  return s;
}

/** Complete periods of the ACTIVE period type, oldest first. */
// The view's own ◀ ▶ / Σ stepper (hygPeriods_/setHygIdx_) was removed
// 2026-08-04: the header's analysis-period picker is universal, so one
// selection drives this view like every other surface.

/**
 * Admin-only coverage-gate editor (user request 2026-08-03).
 *
 * "How much coverage is enough" is a judgement the Services Director owns and
 * revisits at period close. Keeping it in code meant it could only change in a
 * deploy window rather than in the review where the decision is actually made.
 *
 * Three things keep this from becoming a way to make problems disappear:
 * the agreed registry default is always shown next to the current value, an
 * override records who set it and when, and Restore puts the agreed number back
 * exactly. Moving a gate is a visible decision, not a quiet one.
 */
function gateEditorHtml_() {
  if (MODEL.viewerRole !== "admin") return "";
  var reg = MODEL.meta.registry || {};
  var ms = reg.metrics || {};
  var rows = ["onTime", "forecast", "util", "quality"].filter(function (id) { return ms[id]; })
    .map(function (id) {
      var m = ms[id];
      var cur = Math.round((m.coverageGate || 0) * 100);
      var def = m.gateDefault === undefined ? cur : Math.round(m.gateDefault * 100);
      var ov = m.gateOverride;
      return "<tr><td>" + esc_(m.name) +
        '<div class="cellSub">' + esc_(m.coverageOf || "") + "</div></td>" +
        '<td><input type="number" min="0" max="100" step="1" id="gate_' + id +
          '" value="' + cur + '" style="width:70px"> %</td>' +
        "<td>" + def + "%" + (ov
          ? '<div class="cellSub" title="' + esc_("Overridden by " + (ov.by || "an admin") +
              " on " + (ov.at || "an earlier date") + ". Restore returns the agreed value.") +
            '">✎ changed ' + esc_(ov.at || "") + "</div>"
          : "") + "</td>" +
        '<td><button class="btn" onclick="restoreGate_(\'' + id + '\')"' +
          (ov ? "" : " disabled") + ' title="put the agreed registry value back">Restore</button></td></tr>';
    }).join("");

  return '<details class="gedit"><summary>Coverage gates (admin)</summary>' +
    '<p class="cellSub">The attribution a metric needs before it is treated as reliable. ' +
    "Raising a gate makes the dashboard stricter; lowering one makes a weak number look " +
    "settled — the agreed value stays on screen so the difference is never invisible. " +
    "Saving rebuilds the model for everyone.</p>" +
    '<div class="gwrap"><table class="hyg"><tr><th>Metric</th><th>Gate</th>' +
    "<th>Agreed default</th><th></th></tr>" + rows + "</table></div>" +
    '<div style="margin-top:8px"><button class="btn" onclick="saveGates_()">Save gates</button> ' +
    '<span id="gateMsg" class="cellSub"></span></div></details>';
}

/** Resets one input to its registry default, then saves. */
function restoreGate_(id) {
  var el = document.getElementById("gate_" + id);
  if (el) el.value = "";           // empty = clear the override server-side
  saveGates_();
}

function saveGates_() {
  var msg = document.getElementById("gateMsg");
  var ms = (MODEL.meta.registry || {}).metrics || {};
  var payload = {};
  var bad = null;
  Object.keys(ms).forEach(function (id) {
    var el = document.getElementById("gate_" + id);
    if (!el) return;
    var v = String(el.value).trim();
    if (v === "") { payload[id] = null; return; }   // clear → registry default
    var n = Number(v);
    if (!(n >= 0 && n <= 100)) bad = ms[id].name;
    payload[id] = n;
  });
  if (bad) { msg.textContent = "⚠️ " + bad + ": gate must be between 0 and 100."; return; }
  msg.textContent = "Saving…";
  google.script.run
    .withSuccessHandler(function () {
      // The gates decide what every tile publishes, so nothing on screen is
      // trustworthy until the model is rebuilt against the new numbers.
      msg.textContent = "✅ Saved — reloading with the new gates…";
      loadData(true);
    })
    .withFailureHandler(function (e) { msg.textContent = "⚠️ " + e.message; })
    .saveGateOverrides(payload);
}

/** The gap definitions, extracted so the gaps queue and the data-trust strip
    render from ONE list (spec §4.4/§5.4). `key` marks the ones the strip shows —
    three since 2026-08-17, when the Roster join tile was removed with its row. */
/** A row measured at 100% is not a gap. `retireWhenFull` opts a row into being
    hidden while that holds: data-driven, so the row returns by itself the moment
    a record fails, with no deploy. A null value (nothing measured, or a feed
    that is not connected) is NOT solved and always stays.
    ⚠ Retiring is not deleting. The roster-join row WAS deleted on 2026-08-17
    after a fortnight retired at 100% — that one is gone from the code, not
    hidden, and restoring it means restoring the builder from git. */
function gapRetired_(g) {
  return !!g.retireWhenFull && g.value !== null && g.value >= 1;
}

/** Live gaps — what the queue and the trust strip render. */
function gapsRows_(h, pp) {
  return gapsRowsAll_(h, pp).filter(function (g) { return !gapRetired_(g); });
}

/** Rows retired at 100%, so the queue can name them instead of silently
    dropping them. A check that disappears without a word reads as a check
    somebody removed. */
function gapsRetired_(h, pp) {
  return gapsRowsAll_(h, pp).filter(gapRetired_);
}

function gapsRowsAll_(h, pp) {
  return [
    // The row NAMES the population it measures. Under the Dictionary scope this
    // is epics / milestones / Client-Commitment-labelled work — not "delivery
    // work" — and the distinction is the whole finding: Stories and Tasks carry
    // due dates at ~73%, epics at ~11%, so a label saying "delivery work" sent
    // people looking for a problem that isn't where the number says it is.
    { key: "due", name: "Due date on the work On-Time measures",
      value: h.res > 0 ? h.resDue / h.res : null, gate: 0.80,
      detail: h.resDue + " of " + h.res + " " + onTimeScopeWord_(),
      blocks: "On-Time Delivery — the metric cannot publish without it",
      note: "Measured against the mutable Jira Due Date — a baselined committed date does not exist yet. " +
            "Under the Metrics Dictionary scope this counts epics and milestones, which carry due dates far " +
            "less often than the Stories and Tasks the previous scope measured." },
    // This row is the SURVIVOR of a 2026-08-03 split. Reported as one number,
    // ~46% "unattributed" read as a Jira hygiene failure and was routed to the
    // Jira admin queue, where there was nothing to fix: the assignee is nearly
    // always THERE, it just didn't match a roster name. The split separated the
    // two owners — "carries an assignee" (Jira discipline, here) from "…and that
    // assignee resolves to a roster person" (OUR name index).
    //
    // The second half was fixed on 2026-08-04, retired itself at 100% from
    // 2026-08-06, and was DELETED on 2026-08-17 with the rest of the
    // per-parameter compliance summaries. What still catches a name-index
    // regression is this row plus each card's own unattributed count
    // (`meta.jiraUnattributed`) — neither of which changed.
    { name: "Resolved work carries a Jira assignee",
      value: h.res > 0 ? h.resAssigned / h.res : null, gate: 0.95,
      detail: (h.res - h.resAssigned) + " of " + h.res + " have no assignee at all",
      blocks: "all four delivery cards",
      note: "This one is a Jira discipline gap — an issue closed with nobody on it." },
    { name: "Region tagged on delivery work",
      value: h.res > 0 ? h.resRegion / h.res : null, gate: 1.00,
      detail: (h.res - h.resRegion) + " of " + h.res + " land in Unassigned",
      blocks: "Region × Team comparison — the executive layer's whole premise",
      note: "Blank ≠ Other. Unassigned is a tagging gap tracked under PR-01; Other is a value we haven't mapped yet." },
    { name: "Team tagged on delivery work",
      value: h.res > 0 ? h.resTeam / h.res : null, gate: 1.00,
      detail: (h.res - h.resTeam) + " of " + h.res + " untagged",
      blocks: "Region × Team comparison",
      note: "Open decision #1: is the Jira Team picker the same vocabulary as Tempo team names?" },
    { key: "est", name: "Estimate on closed epics",
      value: h.epics > 0 ? h.epicsEst / h.epics : null, gate: 0.70,
      detail: h.epicsEst + " of " + h.epics + " closed epics estimated",
      blocks: "the epic estimate-variance series (audit only — the Forecast Accuracy card reads schedules since 2026.W37)",
      note: "The estimate is mutable — one revised mid-flight scores as accurate." },
    { key: "logged", name: "Logged time on estimated epics",
      value: h.epicsEst > 0 ? h.epicsTime / h.epicsEst : null, gate: 0.70,
      detail: (h.epicsEst - h.epicsTime) + " estimated epics carry no worklog at all",
      blocks: "the epic estimate-variance series (audit only — the Forecast Accuracy card reads schedules since 2026.W37)",
      note: "Counted toward coverage only — a hygiene failure must not score as a forecasting miss." },
    { name: "Billable / non-billable classification on tracked hours",
      value: pp.tracked > 0 ? pp.trackedCov / pp.tracked : null, gate: 0.90,
      detail: r1_(pp.tracked - pp.trackedCov) + "h of " + r1_(pp.tracked) + "h unclassified",
      blocks: "Billable Utilization",
      note: "Unclassified hours leave BOTH sides of the rate — they are never counted as 0% billable." },
    { name: "Capacity from the Tempo feed (not estimated)",
      value: pp.weeks > 0 ? (pp.weeks - pp.capEst) / pp.weeks : null, gate: 0.95,
      detail: pp.capEst + " of " + pp.weeks + " person-weeks fell back to a default",
      blocks: "the utilization denominator" },
    // ── SRSO BINDING (2026-08-07) ──────────────────────────────────────────
    // NOT a Jira-hygiene gap and not a PM failure: this row measures OUR reader
    // against the documented process. The services runbook (BL02 step B2.6)
    // tells the PM to bind delivery work to the sales order with a Jira
    // COMPONENT named for the SRSO; "Jira Backlog.js" derives Billing Type from
    // FIX VERSIONS alone. Work bound exactly as instructed therefore exports as
    // "Untagged" — by our own reckoning, delivered work that cannot be
    // recognised against a milestone. If this row is red, the fix is a reader
    // change on our side, not a campaign to make PMs tag differently, and the
    // note says so — an owner sent to the wrong team is worse than no owner.
    //
    // retireWhenFull: at 100% every sales-order-bound item is visible to the
    // billing reader and there is nothing to look at.
    { key: "srso", name: "Sales-order binding our billing reader can see", retireWhenFull: true,
      // srsoMeasurable === 0 → null → "not connected", NEVER a clean 100%: a
      // cached v28 payload and an export without the Components column both
      // land here, and neither is evidence that the binding is fine.
      value: h.srsoMeasurable > 0 && h.srsoAny > 0 ? h.srsoSeen / h.srsoAny : null, gate: 0.95,
      // THREE reasons this can be blank, and they are different findings:
      //   column absent  → we did not look
      //   nothing bound  → we looked and NO delivered work is tied to a sales
      //                    order by either route, which is itself the finding
      //                    (and must not be reported as "not connected", or
      //                    someone goes hunting for a column that is there)
      //   otherwise      → the ratio, which is the actual measurement
      detail: h.srsoMeasurable === 0
        ? "Components column not in this export — the runbook binding cannot be checked"
        : h.srsoAny === 0
        ? "none of the " + h.srsoMeasurable + " delivered items in this window is bound to a " +
          "sales order by EITHER route — the column is present, the bindings are not"
        : h.srsoCompOnly + " of " + h.srsoAny +
          " sales-order-bound items are bound by COMPONENT only and read as untagged",
      blocks: "Billing Type — untagged delivered work cannot be recognised against a milestone",
      note: "Two bindings exist and they disagree. The runbook (BL02 B2.6) tells the PM to name a " +
            "Jira COMPONENT after the sales order; the exporter classifies Billing Type from FIX " +
            "VERSIONS (fixVersion ~ SRSO*). Work bound the documented way is invisible to the " +
            "classifier. If this is red the fix is in the exporter, not with the PMs — they " +
            "followed the process. Same SRSO token rule on both sides, so a mismatch here is " +
            "about the FIELD, never about two regexes disagreeing." },
    { name: "Reopen events + CSAT feed",
      value: null, gate: 1.00,
      blocks: "Quality / Rework — the tile stays suppressed until both are live",
      note: "The Jira changelog is not exported, no Rework link type is defined, and the CSAT API is not connected." },
    { name: "Engagement key + rate card (Jira ↔ NetSuite ↔ contract)",
      value: null, gate: 0.80,
      blocks: "every dollar translation — no cost rate means no margin",
      note: "Open decision #3: cost rate basis — individual actual, role blended, or region blended?" },
  ];
}

/**
 * What is left of the Actions tab's field/requirements half.
 *
 * THE GAPS QUEUE WAS DELETED 2026-08-17 (user), together with its
 * whole-population caption. It was a ~10-row table stating each gap's coverage,
 * its gate, and what it blocks.
 *
 * What replaced its job, and what did not:
 *   · The three gates that decide whether a published metric may be quoted —
 *     estimate coverage, due-date fill, logged fill — are on the DATA-TRUST
 *     STRIP at the top of this tab, which reads from the same gapsRows_()
 *     definitions. Nothing was lost there.
 *   · The gaps with no strip tile (region tagging, team tagging, the billable
 *     classification, capacity source, the SRSO binding, reopen/CSAT, the
 *     engagement key) are no longer NAMED anywhere on screen. Their count still
 *     reaches the Executive masthead — "N of M evidence gates are below their
 *     bar" — so renderTrust_ now names the failing ones in one line beneath the
 *     tiles. A verdict that counts things nothing can name is the failure this
 *     avoids; it is a sentence, not the table coming back.
 *
 * `gapsRows_` / `gapsRowsAll_` therefore STAY: they are the shared definition
 * list behind the trust strip, the masthead's gates finding and the shelf. Only
 * the table that drew them is gone.
 *
 * This panel now carries the two things that were sitting inside it and belong
 * to nothing else: the ⚙ coverage-gate editor (admin-only) and the leaver
 * exclusion note. It renders NOTHING at all for a viewer with no exclusions to
 * state, rather than an empty bordered box.
 */
function renderHygPanel_() {
  var panel = document.getElementById("hygPanel");
  // No window banner and no period read here any more. Both belonged to the
  // queue's field-fill figures; the gate editor is a settings surface and the
  // leaver note is a scoping fact, and neither follows the period picker. A
  // window label over content that does not follow a window is worse than none.
  var body = leaverNoteHtml_() + gateEditorHtml_();
  if (!body) {
    // Nothing to show this role. Collapse the panel rather than leaving an empty
    // card, which reads as a surface that failed to load.
    panel.innerHTML = "";
    panel.style.display = "none";
    return;
  }
  panel.style.display = "";
  panel.innerHTML = body;
}

/** Gate for a signal field, from the metric registry when the field names one
    (`gateOf`), else the field's own literal gate, else null = ungraded. Never
    re-typed at the call site — an admin gate override has to reach the roster
    the same way it reaches the tiles.
    Named `typeField…` because it was written for the 🧬 by-type matrix (removed
    2026-08-17); the 👥 roster was its second caller and is now its only one. */
function typeFieldGate_(f) {
  if (f.gateOf) {
    var m = (MODEL.meta.registry || {}).metrics || {};
    return m[f.gateOf] ? m[f.gateOf].coverageGate : null;
  }
  return f.gate === undefined ? null : f.gate;
}

// ── 👥 PEOPLE SIGNALS (Actions roster, spec 2026-08-05 §5.2) ─────────────────
// Person grain, and since 2026-08-17 the ONLY per-parameter compliance read in
// the product: the 🧬 by-type matrix that used to sit beside it was removed
// because a summary per issue type names nobody who can fix a ticket, while
// this one names a person. The three METRIC-GATING fields (due / est / logged)
// read the server's shared predicates and resolve their gates from the metric
// registry, so this table cannot drift from backlog health, the 🚩 epic audit
// or the gaps queue about the same record. Three MORE fields (2026-08-06) are
// per-person commercial obligations; the block below says why they are graded
// here and why they stay out of `overall`.

// ── WHY THREE MORE FIELDS, AND WHY THEY ARE GRADED (2026-08-06) ──────────────
// The first three fields gate a PUBLISHED metric, which is what earns them a
// colour. The three added below gate none — so grading them looks like the
// mistake typeImpact_ documents at length about Region and Team, and it is worth
// saying exactly why it is not.
//
// Region and Team are ROLLUP DIMENSIONS. No individual's job is to fill them,
// they are owned centrally under PR-01, and grading them painted an identical
// red on every row — one org-wide gap wearing 40 costumes.
//
// Epic link, Billing Type and Start Date are PER-TICKET ACTS BY THE ASSIGNEE,
// and each one gates money rather than a tile:
//   link  — hours that cannot be rolled to an engagement cannot price the next
//           one. This is the pricing input, and it is the reason the audit
//           (2026-08-05) called out ~1,023 delivered sub-tasks parented to a
//           Story instead of an epic.
//   bill  — untagged delivered work cannot be recognised against a milestone.
//           Graded over its OWN denominator (billN): tristate, so an export
//           without the column is ungraded, never 0%.
//   start — a missed due date with no start date cannot be diagnosed. "Started
//           late" and "ran long" need opposite conversations, and only this
//           field tells them apart.
// They are deliberately NOT added to the 🧬 matrix's typeImpact_ sort, which
// must keep ranking by fixable gaps on metric-gating fields only.
//
// One gate for all three, because none of them has a registry gate to inherit.
// 80% matches the coverage gate the registry uses for the metrics that DO
// publish, so the roster grades on one consistent bar.
var SIGNAL_OPS_GATE_ = 0.80;

// TWO STRINGS PER FIELD (user 2026-08-17). `tip` is the hover — one or two
// sentences, the rule a reader needs at the moment they are looking at the
// number. `rule` is the full entry, shown in the "How these are counted" panel.
// The old single string put five sentences and internal jargon into a tooltip,
// which is where careful writing goes to be skipped.
var SIGNAL_FIELDS_ = [
  // `denom: "dueN"` — graded over STARTED work on the open backlog (Code.js
  // dueExpected_), managers' feedback 2026-08-10. A ticket nobody has picked up
  // is not a commitment yet, and dating it to satisfy a dashboard is how due
  // dates stop meaning anything. Falls back to n on a pre-v32 bucket, which is
  // also exactly right for the resolved half, where dueN === n by construction.
  { k: "due",    label: "Due date", gateOf: "onTime", denom: "dueN", denomFallbackN: true,
    tip: "Percentage of started or dated work carrying a due date. Undated To‑Do tickets are excluded.",
    rule: "Share carrying a due date. On the open backlog this is measured over work that has STARTED (status category In Progress) OR already carries a date, plus all resolved work. An undated To Do ticket is ignored entirely — not delayed, not missing — while a dated ticket is tracked whatever its status. Same predicate and gate as the 🧬 matrix, so the two surfaces can never disagree about a record. Epics are audited separately (🚩): every epic is expected to carry a date, To Do included." },
  { k: "est",    label: "Estimate", gateOf: "forecast",
    tip: "Percentage carrying an original estimate.",
    rule: "Share carrying an original estimate." },
  // `denomFallbackN` — a bucket from before v24 has no loggedN. Fall back to n,
  // which reproduces exactly what that payload measured, rather than reading 0
  // and blanking the column. Deliberately NOT set on `bill`: billN absent means
  // the export never carried a Billing Type, and falling back there would grade
  // a column nobody measured — the fabricated-finding failure billN exists to
  // prevent. One flag, two opposite right answers.
  { k: "logged", label: "Logged",   gateOf: "forecast", denom: "loggedN", denomFallbackN: true,
    tip: "Percentage of started work carrying logged time. Unstarted tickets are excluded.",
    rule: "Share carrying logged time (Jira Time Spent > 0), measured over work that has STARTED — status category In Progress — plus all resolved work. A ticket nobody has picked up yet is expected to carry no worklog, so it counts in neither half rather than as a gap against this person." },
  { k: "link",   label: "Epic link", gate: SIGNAL_OPS_GATE_, ops: true,
    tip: "Percentage whose hours roll up to an epic. Unlinked work cannot inform the next quote.",
    rule: "Share whose hours can be rolled up to a programme — an Epic Key, or a parent that chains to one. Unlinked work is invisible to engagement costing, so it cannot inform the next quote. Epics count as linked by definition: they are the container. Graded, but does not move the Overall column." },
  { k: "bill",   label: "Billable tag", gate: SIGNAL_OPS_GATE_, denom: "billN", ops: true,
    tip: "Percentage tagged Billable or Internal rather than Untagged.",
    rule: "Share tagged Billable (SRSO) or Internal rather than Untagged. Untagged delivered work cannot be recognised against a revenue milestone. Measured only over rows where the export carried a Billing Type — an older export shows this ungraded, not 0%. Graded, but does not move the Overall column." },
  { k: "start",  label: "Start date", gate: SIGNAL_OPS_GATE_, ops: true,
    tip: "Percentage carrying a start date. Without it, 'started late' and 'ran long' look identical.",
    rule: "Share carrying a start date. Without it a late delivery cannot be diagnosed — 'started late' and 'ran long' are different problems with different fixes, and the due date alone cannot tell them apart. Graded, but does not move the Overall column." },
];

// ── WHY `ops` FIELDS ARE GRADED BUT DO NOT MOVE `overall` ────────────────────
// `overall` is not just a row's own summary: it drives the Executive pulse's
// 🟢/🟡🔴 counts and the default biggest-opportunity sort. Letting a field that
// gates no published metric into it means one org-wide fill gap turns every
// person red at once — and then the pulse reports a data-collection habit as if
// it were delivery performance, which is the precise failure the Region/Team
// exclusion in typeImpact_ exists to prevent.
//
// So the three commercial-readiness columns carry their own RAG cell — visible,
// sortable, exportable, which is what makes them manageable per person — while
// `overall` stays a verdict about the metrics the dashboard actually publishes.
// Fold them in later if it turns out fill is high enough that the reds are
// individual rather than universal; that is a one-word change (drop `ops`).
function sigGradesOverall_(f) { return !f.ops; }

function signalMinN_() { return (MODEL.meta && MODEL.meta.signalMinN) || 4; }

/**
 * Grade one signal. Below signalMinN_ the cell is "small": grey, ungraded,
 * % still shown — one missing due date on one ticket must never render the
 * same red as fifteen on forty (review 2026-08-05 #1; the roster's
 * STD_MIN_PERIODS). "na" = nothing to grade at all.
 */
function gradeSignal_(hit, n, gate) {
  if (!n) return { cls: "na", pct: null, miss: 0 };
  var pct = hit / n;
  var out = { pct: pct, miss: n - hit };
  if (n < signalMinN_()) { out.cls = "small"; return out; }
  if (gate === null)      { out.cls = "na";    return out; }
  out.cls = pct >= gate ? "good" : pct >= gate - 0.10 ? "warn" : "bad";
  return out;
}

var SIGNAL_RANK_ = { bad: 3, warn: 2, good: 1 };

/**
 * One row per person in the filtered population. Returns null on a pre-v22
 * payload (renderers show the same "Not in this payload" state as the matrix).
 * Population follows the 🧬 matrix's Open ↔ Resolved toggle (STATE.typePop);
 * isos scope the resolved half only — a backlog has no history to walk.
 * Interns excluded like every ranking surface (oppRows_ precedent).
 */
function personSignalRows_(isos) {
  var ph = MODEL.personHygiene;
  if (!ph) return null;
  // Every counter personHygieneBuckets_ emits, summed the same way. Listed once
  // so a new bucket field cannot be added to the payload and silently dropped
  // here — the previous form named due/est/logged inline in three places.
  var SUM_KEYS = ["n", "due", "dueN", "est", "logged", "loggedN", "link", "start", "bill", "billN",
                  "estSec", "spentSec", "wip"];
  function blank_() {
    var o = {};
    SUM_KEYS.forEach(function (k) { o[k] = 0; });
    return o;
  }
  // Per-field denominators that stand in for n on a bucket that predates them.
  // Resolved BEFORE summing, because the substitution is per BUCKET: a window
  // spanning a schema change must add each week's own denominator.
  var FALLBACK_N_ = SIGNAL_FIELDS_.filter(function (f) { return f.denomFallbackN; })
                                  .map(function (f) { return f.denom; });
  function val_(b, k) {
    if (b[k] === undefined && FALLBACK_N_.indexOf(k) !== -1) return Number(b.n) || 0;
    return Number(b[k]) || 0;
  }
  var byName = {};
  if (STATE.typePop === "resolved") {
    (ph.resolved || []).forEach(function (b) {
      if (isos.indexOf(b.iso) === -1) return;
      var t = byName[b.person] || (byName[b.person] = blank_());
      SUM_KEYS.forEach(function (k) { t[k] += val_(b, k); });
    });
  } else {
    (ph.open || []).forEach(function (b) {
      var t = byName[b.person] = blank_();
      SUM_KEYS.forEach(function (k) { t[k] = val_(b, k); });
    });
  }
  var m = (MODEL.meta.registry || {}).metrics || {};
  // Interns are IN this list (user 2026-08-06 — they were filtered out entirely,
  // while the Utilization card told readers their profiles stayed here). What
  // they do not get is a grade: see the "learn" downgrade below.
  return filteredPeople_().map(function (p) {
    var t = byName[p.name] || blank_();
    var sig = {}, worst = 0, miss = 0;
    SIGNAL_FIELDS_.forEach(function (f) {
      // Registry gate when the field has one, else the field's literal gate —
      // routed through typeFieldGate_ so the roster and the 🧬 matrix resolve
      // gates through ONE function. A field with neither reads ungraded.
      var gate = f.gateOf ? (m[f.gateOf] ? m[f.gateOf].coverageGate : null)
                          : typeFieldGate_(f);
      // `denom` lets a tristate field grade over the rows that were actually
      // measured (bill → billN). Without it an absent export column reports 0%
      // for everyone, which is a fabricated finding rather than a missing one.
      var n = f.denom ? (t[f.denom] || 0) : t.n;
      var g = gradeSignal_(t[f.k], n, gate);
      sig[f.k] = g;
      if (SIGNAL_RANK_[g.cls] && sigGradesOverall_(f)) {
        worst = Math.max(worst, SIGNAL_RANK_[g.cls]);
        miss += g.miss;
      }
    });
    var overall = worst === 3 ? "bad" : worst === 2 ? "warn" : worst === 1 ? "good" : "na";
    if (p.isIntern) {
      // 🎓 SHOWN, NEVER GRADED. The percentages stay — that is the whole point,
      // an intern should be able to read their own record and learn the standard
      // — but the RAG verdict, the missing-count and the overall grade all go.
      // miss:0 is load-bearing: it feeds the opportunity sort's tie-break, so a
      // graded intern would otherwise rank as the org's biggest problem on day
      // one. Grading someone against a bar they were never set is how a metric
      // imposes a change on the one person who is here to be taught.
      SIGNAL_FIELDS_.forEach(function (f) { if (sig[f.k].cls !== "na") sig[f.k].cls = "learn"; });
      return { p: p, n: t.n, sig: sig, overall: "learn", miss: 0, t: t };
    }
    return { p: p, n: t.n, sig: sig, overall: overall, miss: miss, t: t };
  });
}

/** 🟢/🟡/🔴 counts for the Executive pulse. Small-n rows are counted apart —
    NEVER in bad (they would inflate the reds with statistical noise). */
function signalSummary_(isos) {
  var rows = personSignalRows_(isos);
  var out = { good: 0, warn: 0, bad: 0, small: 0, learn: 0, na: 0, available: rows !== null };
  (rows || []).forEach(function (r) {
    // Interns get their own bucket, not "small n" — both are ungraded, but one
    // is a sample-size fact and the other is a policy. Pooling them would put a
    // policy decision behind a tooltip about statistics.
    if (r.overall === "learn") out.learn++;
    else if (r.overall === "na") {
      // A row is "small" for the summary when it HAS issues but none graded.
      out[r.n > 0 ? "small" : "na"]++;
    } else out[r.overall]++;
  });
  return out;
}

/** Open ↔ Resolved population toggle for the 👥 signals roster.
    It drove two surfaces until 2026-08-17; the 🧬 matrix that carried its chips
    is gone, and the chips moved onto the roster itself. renderHygPanel_ is still
    called because the gaps queue's caption names the same window. */
function setTypePop_(v) { STATE.typePop = v; renderRoster_(); renderHygPanel_(); }

/**
 * The roster's population FOLLOWS THE WINDOW (user 2026-09-09): on the current
 * week "so far" (or a planning week) the actionable half is the OPEN backlog;
 * on a complete week the question is historical — what did each person
 * actually resolve in 2026.W36 — so the roster opens on RESOLVED · that week
 * and its ▸ rows list the work closed. Called wherever the window changes
 * (period unit, picker, Reset, first load). The chips still override it for
 * the current window; the next window change re-syncs.
 */
function syncTypePop_() {
  if (!MODEL) return;
  STATE.typePop = analysisHead_().phase === "done" ? "resolved" : "open";
}

// ══════════════════════════════════════════════════════════════════════════
// ✎ CHANGES (admin only) — the change register, user request 2026-09-09
//
// One row per impactful change: "Change #001 — Title", the request as it was
// made, what the dashboard does about it, and a status. Grouped To do → Under
// review → Solved, because the open items are what an admin came to check.
// The register itself lives in Code.js (DH_CHANGES_) and ships in meta.changes;
// this only arranges it.
// ══════════════════════════════════════════════════════════════════════════
var CHANGE_STATUS_ = {
  todo:   { label: "To do",        cls: "sigSmall", order: 0,
            tip: "Agreed, not built yet. The row says what is pending and who decides." },
  review: { label: "Under review", cls: "sigWarn",  order: 1,
            tip: "Built and tested; awaiting review or deploy. The row says what has to happen for it to go live." },
  solved: { label: "Solved",       cls: "sigGood",  order: 2,
            tip: "Live on the deployed dashboard." },
};
function changeNo_(id) { var s = String(id); while (s.length < 3) s = "0" + s; return "#" + s; }

function renderChanges_() {
  var el = document.getElementById("viewChanges");
  if (!el) return;
  var list = MODEL && MODEL.meta && MODEL.meta.changes;
  if (!list) {
    el.innerHTML = "<h3>Changes</h3><div class=\"emptyState\">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>";
    return;
  }
  var rows = list.slice().sort(function (a, b) {
    var ao = (CHANGE_STATUS_[a.status] || CHANGE_STATUS_.todo).order,
        bo = (CHANGE_STATUS_[b.status] || CHANGE_STATUS_.todo).order;
    if (ao !== bo) return ao - bo;
    return b.id - a.id;                          // newest request first within a status
  });
  var counts = { todo: 0, review: 0, solved: 0 };
  list.forEach(function (c) { if (counts[c.status] !== undefined) counts[c.status]++; });
  var body = rows.map(function (c) {
    var st = CHANGE_STATUS_[c.status] || CHANGE_STATUS_.todo;
    return '<tr class="changeRow"><td class="tname">' +
      '<b>Change ' + changeNo_(c.id) + " — " + esc_(c.title) + "</b>" +
      '<div class="cellSub">' + esc_(c.area) + " · asked " + esc_(c.week) + " (" + esc_(c.requested) + ")</div></td>" +
      "<td><div><b>Asked:</b> " + esc_(c.ask) + "</div>" +
      '<div style="margin-top:4px"><b>Solution:</b> ' + esc_(c.done) + "</div>" +
      (c.needs ? '<div class="cellSub" style="margin-top:4px"><b>Needs:</b> ' + esc_(c.needs) + "</div>" : "") + "</td>" +
      '<td class="tnum"><span class="pmPill ' + st.cls + '" title="' + esc_(st.tip) + '">' +
      (c.status === "solved" ? "✔ " : c.status === "review" ? "◐ " : "○ ") + st.label + "</span></td></tr>";
  }).join("");
  el.innerHTML =
    '<div class="chartHead"><h3>Changes — what was asked, and where it stands</h3>' +
      '<span class="sub">' + counts.todo + " to do · " + counts.review + " under review · " +
      counts.solved + " solved</span></div>" +
    '<p class="cellSub">Impactful changes only: a change is listed when it moves a published number, changes what ' +
      "a number means, or changes what a reader does on a tab. Numbered in request order; the register starts " +
      "with the 2026.W37 batch — earlier history is in the README.</p>" +
    '<div class="gwrap"><table class="hyg changesTbl">' +
      '<colgroup><col style="width:28%"><col style="width:60%"><col style="width:12%"></colgroup>' +
      '<thead><tr><th class="tname">Change</th><th>Request and solution</th><th class="tnum">Status</th></tr></thead>' +
      "<tbody>" + body + "</tbody></table></div>";
}

// ══════════════════════════════════════════════════════════════════════════
// ACCESS CONTROL (admin only)
//
// The working copy lives here between load and save. Nothing round-trips until
// Save is pressed, so adding four people and removing one is ONE decision with
// one confirmation, not five separate writes that can half-apply.
//
// `orig` is the snapshot the server sent. Every dirty check diffs against it,
// which is what lets the page state what is about to happen rather than just
// offering a button that is always available.
// ══════════════════════════════════════════════════════════════════════════
var ACCESS_ = null;
var ACCESS_SAY_ = { admin: null, viewer: null };   // per-list inline message

/** Splits an address into the part that identifies a person and the part that
    repeats on every row. Falls back to treating the whole string as the name,
    so a malformed entry already in Script Properties still renders readably
    instead of disappearing into an empty span. */
function accParts_(email) {
  var at = String(email == null ? "" : email).lastIndexOf("@");
  return at === -1 ? { name: String(email == null ? "" : email), domain: "" }
                   : { name: String(email).slice(0, at), domain: String(email).slice(at) };
}

/** Shape check only — deliberately not an RFC-complete pattern. The server's
    allowlist is the authority on whether an address WORKS; this exists to catch
    the typo before it is saved, and being stricter than the mail system would
    reject addresses that are perfectly real. */
function accIsEmail_(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || "").trim()); }

/** The org's own domain, LEARNED from the bootstrap admin rather than declared.
    A hardcoded "@servicerocket.com" here would be a second place to edit the
    day the company changes domain, and the one place that would be forgotten. */
function accOrgDomain_() {
  return ACCESS_ ? accParts_(ACCESS_.bootstrapAdmin).domain.toLowerCase() : "";
}

/** Where this address already sits, or "" — so a duplicate can be refused with
    the reason rather than with a bare "already exists". */
function accWhere_(st, email) {
  var e = String(email || "").trim().toLowerCase();
  if (!e) return "";
  if (String(st.bootstrapAdmin || "").toLowerCase() === e) return "the owner";
  if (st.admins.some(function (a) { return a.toLowerCase() === e; })) return "an admin";
  if (st.viewers.some(function (v) { return v.toLowerCase() === e; })) return "a viewer";
  return "";
}

/** One person's row. `locked` is the bootstrap admin: shown IN the list, because
    he has access and the list claims to be everyone who does, but with no remove
    control because the server would ignore it. */
function accRowHtml_(email, role, opts) {
  var o = opts || {};
  var p = accParts_(email);
  return '<div class="accRow ' + (role === "admin" ? "isAdmin" : "isViewer") + '">' +
    '<span class="accWho" title="' + esc_(email) + '">' +
      '<span class="accName">' + esc_(p.name) + "</span>" +
      '<span class="accDomain">' + esc_(p.domain) + "</span></span>" +
    (o.locked ? '<span class="accTag" title="Set in Security.js and always an admin. ' +
                'Removing it here would do nothing — the server puts it back on every check.">' +
                "🔒 owner</span>" : "") +
    (o.you ? '<span class="accTag" title="This is the account you are signed in as.">you</span>' : "") +
    (o.locked ? ""
              : '<button class="accRm" onclick="accRemove_(' + jsArg_(role) + "," + jsArg_(email) +
                ')" title="' + esc_("Remove " + email + " from this list") +
                '" aria-label="' + esc_("Remove " + email) + '">Remove</button>') +
    "</div>";
}

/** One role's card: header, rows, add field, and whatever the last add attempt
    had to say about itself. */
function accCardHtml_(st, role) {
  var isAdmin = role === "admin";
  var list = isAdmin ? st.admins : st.viewers;
  var locked = isAdmin && st.bootstrapAdmin ? 1 : 0;
  var me = String(st.callerEmail || "").toLowerCase();
  var rows = (isAdmin && st.bootstrapAdmin
                ? accRowHtml_(st.bootstrapAdmin, "admin", { locked: true,
                    you: String(st.bootstrapAdmin).toLowerCase() === me })
                : "") +
    list.map(function (e) {
      return accRowHtml_(e, role, { you: String(e).toLowerCase() === me });
    }).join("");
  var say = ACCESS_SAY_[role];
  return '<div class="accCard">' +
    '<div class="accCardHead"><b>' + (isAdmin ? "Admins" : "Viewers") + "</b>" +
      '<span class="accCount">' + (list.length + locked) + "</span>" +
      '<span class="accWhat">' + (isAdmin ? "Full dashboard, plus this page"
                                          : "Full dashboard, read-only") + "</span></div>" +
    (rows || '<div class="accEmpty">' +
      (isAdmin ? "No admins beyond the owner. Add an email to let someone else manage this list."
               : "No viewers yet. Add an email to give someone read-only access.") + "</div>") +
    '<div class="accAdd">' +
      '<input id="accIn_' + role + '" type="email" autocomplete="off" spellcheck="false" ' +
        'placeholder="name@company.com" aria-label="' +
        (isAdmin ? "Add an admin" : "Add a viewer") + '" ' +
        "onkeydown=\"if(event.key==='Enter'){event.preventDefault();accAdd_(" + jsArg_(role) + ")}\">" +
      '<button class="btn" onclick="accAdd_(' + jsArg_(role) + ')">Add</button></div>' +
    (say ? '<div class="accSay ' + esc_(say.kind) + '">' + esc_(say.text) + "</div>" : "") +
    "</div>";
}

/** What Save is about to do, in words. A security page should never offer a
    button whose effect the reader has to reconstruct from memory of what they
    clicked. Returns "" when nothing changed, which is also what disables Save. */
function accPending_(st) {
  var o = st.orig, bits = [];
  function diff(now, was, noun) {
    var added = now.filter(function (e) { return was.indexOf(e) === -1; }).length;
    var gone = was.filter(function (e) { return now.indexOf(e) === -1; }).length;
    if (added) bits.push("+" + added + " " + noun + (added === 1 ? "" : "s"));
    if (gone) bits.push("−" + gone + " " + noun + (gone === 1 ? "" : "s"));
  }
  diff(st.admins, o.admins, "admin");
  diff(st.viewers, o.viewers, "viewer");
  if (st.openAccess !== o.openAccess) bits.push("open access " + (st.openAccess ? "ON" : "off"));
  return bits.join(", ");
}

/**
 * The whole panel, as a pure function of the working state.
 *
 * Extracted from renderAccess_ so it can be tested without a google.script.run
 * round-trip — the same reason rosterCsvLines_ is a builder rather than part of
 * the download path. renderAccess_ fetches; this decides what the fetch means.
 */
function accessPanelHtml_(st) {
  var pending = accPending_(st);
  var total = st.admins.length + st.viewers.length + (st.bootstrapAdmin ? 1 : 0);
  return '<div class="accHead"><h3>Access control</h3>' +
      '<span class="cellSub">' + total + " " + (total === 1 ? "person" : "people") +
      " can open this dashboard</span></div>" +
    '<p class="cellSub">Changes apply when you save. Everyone here signs in with their ' +
      "own account — there is no shared link and no password.</p>" +
    '<div class="accGrid two">' + accCardHtml_(st, "admin") + accCardHtml_(st, "viewer") + "</div>" +
    '<div class="accOpen' + (st.openAccess ? " on" : "") + '">' +
      '<label class="accSwitch"><input type="checkbox" id="accOpenSw"' +
        (st.openAccess ? " checked" : "") + ' onchange="accToggleOpen_(this.checked)">' +
        '<span class="accTrack"></span><span>Open access</span></label>' +
      '<div class="cellSub" style="margin-top:8px">' +
        (st.openAccess
          ? "<b>Anyone with the link can open this dashboard</b>, without being on either list. " +
            "They come in as a guest: utilization and forecast variance stay hidden, and the " +
            "Actions, Project Managers and Workforce tabs do not appear. Turn this off after the " +
            "demo."
          : "Only the people listed above can open this dashboard. Turn this on for an all-hands " +
            "or a demo, and off again afterwards.") + "</div></div>" +
    '<div class="accBar">' +
      '<span class="accPending">' +
        (pending ? "Pending: <b>" + esc_(pending) + "</b>"
                 : "No changes to save.") + "</span>" +
      '<span id="accMsg" class="cellSub"></span>' +
      '<button class="btn" id="accSave" onclick="saveAccess_()"' +
        (pending ? "" : " disabled") + ">Save changes</button></div>";
}

function renderAccess_() {
  var panel = document.getElementById("viewAccess");
  panel.innerHTML = '<div class="cellSub">Loading access settings…</div>';
  google.script.run.withSuccessHandler(function (s) {
    ACCESS_ = {
      admins: (s.admins || []).slice(),
      viewers: (s.viewers || []).slice(),
      openAccess: !!s.openAccess,
      bootstrapAdmin: s.bootstrapAdmin || "",
      callerEmail: s.callerEmail || "",
      // The snapshot every dirty check diffs against.
      orig: { admins: (s.admins || []).slice(), viewers: (s.viewers || []).slice(),
              openAccess: !!s.openAccess },
    };
    ACCESS_SAY_ = { admin: null, viewer: null };
    accPaint_();
  }).withFailureHandler(function (e) {
    panel.innerHTML = '<div class="emptyState">⚠️ ' + esc_(e.message) + "</div>";
  }).getDeliveryAccessSettings();
}

/** Repaint from the working copy. Kept separate from renderAccess_ so an edit
    never re-fetches — a round-trip on every keystroke would also mean the
    server's copy silently overwriting edits in progress. */
function accPaint_() {
  if (!ACCESS_) return;
  document.getElementById("viewAccess").innerHTML = accessPanelHtml_(ACCESS_);
}

/** Add one address to a list, validating in the order a person would: is it an
    address at all, is it already somewhere, and is it one of ours. */
function accAdd_(role) {
  if (!ACCESS_) return;
  var input = document.getElementById("accIn_" + role);
  var raw = String(input && input.value || "").trim();
  ACCESS_SAY_[role] = null;
  if (!raw) { accPaint_(); return; }
  if (!accIsEmail_(raw)) {
    ACCESS_SAY_[role] = { kind: "bad", text: "“" + raw + "” is not an email address." };
    accPaint_(); return;
  }
  var already = accWhere_(ACCESS_, raw);
  if (already) {
    ACCESS_SAY_[role] = { kind: "bad", text: raw + " is already " + already + "." };
    accPaint_(); return;
  }
  var org = accOrgDomain_();
  var mine = accParts_(raw).domain.toLowerCase();
  (role === "admin" ? ACCESS_.admins : ACCESS_.viewers).push(raw);
  // A foreign domain is a WARNING, not a refusal. Contractors and partners are
  // real, and a rule that silently blocks them would send someone to edit
  // Script Properties by hand — which is the thing this page exists to replace.
  if (org && mine && mine !== org) {
    ACCESS_SAY_[role] = { kind: "warn", text: "Added. " + mine + " is outside " + org +
      " — check that is intended before saving." };
  }
  if (input) input.value = "";
  accPaint_();
}

/** Remove one address. Removing YOURSELF is the one action here that can lock
    the person doing it out of this page, so it asks first — and says exactly
    what will happen rather than "are you sure?". */
function accRemove_(role, email) {
  if (!ACCESS_) return;
  var me = String(ACCESS_.callerEmail || "").toLowerCase();
  if (String(email).toLowerCase() === me &&
      typeof confirm === "function" &&
      !confirm("Remove your own account?\n\nAfter you save, you will lose access to this page " +
               "and only another admin can put you back.")) return;
  ACCESS_SAY_[role] = null;
  var key = role === "admin" ? "admins" : "viewers";
  ACCESS_[key] = ACCESS_[key].filter(function (e) { return e !== email; });
  accPaint_();
}

function accToggleOpen_(on) {
  if (!ACCESS_) return;
  ACCESS_.openAccess = !!on;
  accPaint_();
}

function saveAccess_() {
  if (!ACCESS_) return;
  var btn = document.getElementById("accSave");
  var msg = document.getElementById("accMsg");
  if (btn) btn.disabled = true;
  if (msg) msg.textContent = "Saving…";
  google.script.run.withSuccessHandler(function () {
    // The saved state becomes the new baseline, so the page immediately reads
    // "No changes to save" rather than continuing to offer a save that would
    // now be a no-op.
    ACCESS_.orig = { admins: ACCESS_.admins.slice(), viewers: ACCESS_.viewers.slice(),
                     openAccess: ACCESS_.openAccess };
    accPaint_();
    var m2 = document.getElementById("accMsg");
    if (m2) m2.textContent = "✅ Saved";
  }).withFailureHandler(function (e) {
    var m2 = document.getElementById("accMsg");
    if (m2) m2.textContent = "⚠️ " + e.message;
    var b2 = document.getElementById("accSave");
    if (b2) b2.disabled = false;
  }).saveDeliveryAccessSettings({
    admins: ACCESS_.admins.slice(),
    viewers: ACCESS_.viewers.slice(),
    openAccess: ACCESS_.openAccess,
  });
}

/** One CSV field, quoted only when it needs to be (comma, quote or newline).
    Extracted from the old saveCsv_ body so every CSV export shares one
    quoting rule instead of re-deriving it. */
function csvCell_(v) {
  v = String(v == null ? "" : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/** Pure builder for the signals-roster CSV: one row per person, signal
    values + offending counts + the hours split (spec §5). Extracted from
    saveCsv_ (review finding, 2026-08-05) so the row grammar — small-n rows
    keep their REAL percentages (small-n suppresses grading, not
    measurement), a zero-issue person's percentages are blank, and an
    ineligible (ramping/on-leave) row blanks Idle and carries the Note
    instead — is testable without a DOM/Blob download round-trip.
    @returns {?Array<string>} CSV lines (header first), or null on a
    pre-v22 payload (no personHygiene to grade). */
function rosterCsvLines_() {
  var head = analysisHead_().head;
  var rows = personSignalRows_(head.isos);
  if (rows === null) return null;
  // The export follows the signal chip, like every other CSV here follows the
  // filters on screen: someone who narrowed to "need action" wants to send THAT
  // list, and a download that quietly contained the whole org would be worse
  // than useless — it would be wrong in a way nobody checks before forwarding.
  rows = rows.filter(sigFilterMatch_);
  // "Non-billable work h" and "Time off h" split what used to be one
  // "Non-billable h" column — a spreadsheet reader summing the old column was
  // adding holidays to unbilled project work. The two still sum to the payload's
  // nonBillable, so a saved workbook can be reconciled against it.
  // Signal columns are GENERATED from SIGNAL_FIELDS_ rather than typed out, so a
  // field added to the roster reaches the export automatically. The hand-listed
  // form would have silently shipped a CSV missing the three commercial-readiness
  // columns while the screen showed them — the worst kind of drift, because the
  // spreadsheet is what gets mailed to the person being asked to fix the gap.
  var sigHead = SIGNAL_FIELDS_.map(function (f) {
    return csvCell_(f.label + " %") + "," + csvCell_(f.label + " missing");
  }).join(",");
  // Planned h / Capacity h ship ALWAYS, not only while the Plan column is on
  // screen: a fixed header is what makes two exports comparable, and a
  // spreadsheet whose columns move with a dropdown cannot be appended to.
  // "n" became "Issues (all incl. epics)" and grew its three parts (2026-08-10).
  // The spreadsheet is what gets mailed to the person being asked to fix a gap,
  // and a bare "n" there was the same unexplained number as on screen — with no
  // tooltip to rescue it and no drill-down to expand.
  // "Idle h" became "Available h" (2026-08-28) with the on-screen column: same
  // number, named for what it is used for — assignable room. "Overdue (open
  // backlog)" ships beside the count it flags on screen; blank on a payload
  // with no backlog-health feed, never a fabricated 0.
  var lines = ["Person,Job title,Region,Issues (all incl. epics),Overdue (open backlog)," +
               "Listed,Ignored (unstarted no due date),Epics," + sigHead +
               ",Overall,Est h,Logged h,Progress %,In progress," +
               "Billable h,Non-billable work h,Time off h,Available h,Planned h,Capacity h,State"];
  rows.forEach(function (r) {
    var w = aggWeeks_(r.p, head.isos) || { billable: 0, nonBillable: 0, trackedOff: 0, tracked: 0, avail: 0 };
    var inel = r.p.newHire === true || r.p.onLeave === true || r.p.isIntern === true;
    var off = Math.min(Math.max(0, w.trackedOff || 0), w.nonBillable);
    function pc(g) { return g.pct === null ? "" : Math.round(g.pct * 100); }
    var t = r.t || {};
    var pl = planFor1_(r.p, head.isos);
    var estH = (Number(t.estSec) || 0) / 3600, spentH = (Number(t.spentSec) || 0) / 3600;
    // The three parts of the count, blank rather than 0 on a payload that predates
    // them — a fabricated 0 in a saved workbook outlives every caveat on screen.
    var bl = r.p.backlog || {};
    var blank_ = function (v) { return v === undefined || v === null ? "" : v; };
    var bhb = bhBucketOf_(r.p.name);
    lines.push([csvCell_(r.p.name), csvCell_(r.p.jobTitle), csvCell_(r.p.region), r.n,
                bhb === null ? "" : (bhb.overdue || 0),
                blank_(bl.listed), blank_(bl.ignoredN), blank_(bl.epicsN)]
      .concat(SIGNAL_FIELDS_.map(function (f) { return pc(r.sig[f.k]) + "," + r.sig[f.k].miss; }))
      .concat([r.overall,
        r1_(estH), r1_(spentH),
        // BLANK, never 0, with no estimate to divide by. A fabricated 0% in a
        // saved workbook outlives every caveat on the screen it came from.
        estH > 0 ? Math.round(spentH / estH * 100) : "",
        Number(t.wip) || 0,
        r1_(w.billable), r1_(w.nonBillable - off), r1_(off),
        inel ? "" : r1_(Math.max(0, w.avail - w.tracked)),
        r1_(pl.planned), r1_(pl.cap),
        r.p.onLeave ? "on leave" : r.p.isIntern ? "intern (in training, ungraded)"
                    : r.p.newHire === true ? "ramping new hire" : ""]).join(","));
  });
  return lines;
}

/** CSV = the signals roster (spec §5). Replaces the Task-3 interim, which
    exported the opportunity table instead. */
function saveCsv_() {
  var lines = rosterCsvLines_();
  if (lines === null) return;
  // CRLF line endings + .csv extension are this function's job — downloadCsv_
  // does neither, it writes the filename and content verbatim.
  downloadCsv_(lines.join("\r\n"), "delivery-people-signals.csv");
}

/** A CSV string → a downloaded file. Shared by every CSV export. */
function downloadCsv_(csv, filename) {
  var a = document.createElement("a");
  a.download = filename;
  // Blob URLs are the right default (no size ceiling — a full roster × 6 periods
  // export runs past what a data: URI reliably carries), but some managed
  // browsers block blob: in a sandboxed iframe, which is exactly what an
  // HtmlService web app is. Fall back to a data: URI rather than failing silently.
  try {
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  } catch (e) {
    a.href = "data:text/csv;charset=utf-8,%EF%BB%BF" + encodeURIComponent(csv);
  }
  a.click();
  if (a.href.indexOf("blob:") === 0) {
    // Release the object URL once the download has been handed off — the blob
    // otherwise pins the whole CSV in memory until the tab closes.
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 30000);
  }
}

var H2C_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
/** The headline period, filename-safe — "Jul 2026" → "Jul-2026", "FY27 Q1" →
    "FY27-Q1". Falls back to the model's ISO week if no period resolves. */
function pngPeriodStamp_() {
  var done = allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
  var lbl = done.length ? done[done.length - 1].label : (MODEL.meta.headlineIso || "");
  return String(lbl).replace(/[^\w.-]+/g, "-").replace(/^-|-$/g, "") || "export";
}

function savePng_(elId, name) {
  function shoot() {
    var el = document.getElementById(elId);
    // Uncap the grid's internal scroller for the shot — otherwise the PNG
    // captures only the visible viewport of rows, not the whole roster.
    el.classList.add("shooting");
    html2canvas(el, { backgroundColor: getComputedStyle(document.body).backgroundColor })
      .then(function (canvas) {
        var a = document.createElement("a");
        // Stamp the filename with the period the shot actually SHOWS, not the
        // model's ISO week. A board-pack PNG of July 2026 saved as
        // "…-2026.W31.png" is a figure filed under the wrong period, and nobody
        // opens the file again to check.
        a.download = "delivery-health-" + name + "-" + pngPeriodStamp_() + ".png";
        a.href = canvas.toDataURL("image/png");
        a.click();
      })
      .finally(function () { el.classList.remove("shooting"); });
  }
  if (window.html2canvas) return shoot();
  var s = document.createElement("script");
  s.src = H2C_URL;
  s.onload = shoot;
  s.onerror = function () { alert("PNG export unavailable (script blocked)"); };
  document.head.appendChild(s);
}

loadData(false);
</script>
</body>
</html>
