    // own trailing-weeks basis, not the period picker).
    value: function () {
      var open = flowOpenFor_();
      var rate = assignedClearRate_();
      return rate ? ((open.wipN || 0) + (open.todoN || 0)) / rate : null;
    },
    coverage: function () { return assignedClearRate_() ? 1 : null; },
    // n() is deliberately NOT group-specific: the floor this feeds is "is
    // there enough CALENDAR history for a trailing rate at all", the same
    // question assignedClearRate_'s own CLEAR_RATE_MIN_N_ guard asks, and that
    // question has one answer regardless of which bar is asking it.
    n: function () { return trailingCompleteWeeks_(MODEL.meta.clearRateWeeks || 8).length; },
  },
  // The only metric a window that has not happened yet can be compared on
  // (2026-08-06). targetKey null on purpose: no planned-coverage bar has been
  // agreed, so the bars carry no RAG and no reference line — the comparison is
  // "who is covered and who isn't", which the ranking already answers.
  planCov: {
    id: "planCov", targetKey: null,
    label: function () { return "Planned Coverage"; },
    axis: function () { return "planned hours ÷ scheduled capacity"; },
    available: function () { return planWeeks_().length > 0; },
    value: function (isos) { return planFor_(isos).pct; },
    coverage: function (isos) { return planFor_(isos).cap > 0 ? 1 : null; },
    n: function (isos) { return planFor_(isos).cap; },
  },
};

/** Metric ids the Drill-down (Tier 3) can chart — in the SAME order as the KPI
    cards (On-Time, Forecast, Utilization, Quality; user 2026-08-04).

    NARROWED 2026-08-17 (user): Lead Time, Throughput, Cleared per Person and
    Assigned wks to clear are OUT. The drill-down asks "where isn't it working",
    and a reader answers that against the rates the org has agreed a bar for.
    The four removed ones have no ratified target between them — they were
    graded against the operating band instead — so a bar chart of them invites a
    comparison ("EMEA clears fewer per person than AMER") that the numbers
    cannot settle: team size, work mix and ticket granularity all move them, and
    none of that is visible on the bar.

    Lead Time and Throughput keep their own compact tiles in Tier 2, where they
    read as trends rather than as a league table. Cleared per Person and
    Assigned wks to clear now render NOWHERE — deliberately; see the note on
    their METRICS_ entries.

    Backlog/WIP (snapshot — no period grain) and Bug Count (population-wide — no
    person join to dimension by) were never here; see the tile scope tags.
    `util` stays in the list and is gated off by SHOW_UTILIZATION_ below, so
    flipping that one flag restores it everywhere at once. `planCov` is the
    planning-window member: liveMetrics_ swaps the whole set for it on a forward
    window, so removing it would leave the drill-down empty there. */
// ⚠ `avail` is NOT here. It cannot be broken down by region/team/PM with the
// current payload: workforce capacity ships pre-aggregated per pool × band
// (wfFold_ sums weekly[cell][iso]), and headByCell only sets the head count —
// so scoping to a subset changes WHO is counted but not the HOURS. Every row
// would print the same org figure, which is not a breakdown, it is a number
// repeated four times. The Availability card deep-links to Workforce instead,
// where capacity IS reported per pool × band. See the note above
// GRID_METRIC_IDS_ for what would have to change server-side.
// "available rate" joined on 2026-08-17, completing the set the user named for
// this panel: On-Time, Forecast, available rate, Quality/Rework. It reads
// wfAvailability_ — the SAME function behind the Availability Rate card and
// the Workforce tab — so a bar here cannot disagree with the card above it.
var METRIC_ORDER_ = ["onTime", "forecast", "avail", "quality", "util", "planCov"];
/**
 * ── FEATURE FLAG: Utilization ────────────────────────────────────────────────
 * Utilization is switched OFF across the whole dashboard (user 2026-08-17).
 * Availability Rate replaces it as the capacity read an executive acts on:
 * "how much of the team is spoken for" answers a different question from "how
 * many hours are free for the backlog", and only the second one is a decision.
 *
 * ONE gate, in liveMetrics_ below, because every surface that could show the
 * metric already routes through it — the comparison chart's metric chips, the
 * §6 grid columns (gridMetrics_ filters liveMetrics_) and activeMetric_'s
 * fallback. The KPI card is switched off separately in capacityTileHtml_, the
 * only place it is built. Flip this to true and every one of them returns.
 *
 * NOT removed: the util SERIES. renderPulse_ still reads its operating norm to
 * price recoverable hours, and that figure is not the utilization KPI — it is
 * hours a manager can reassign, which is exactly what this change is about.
 */
var SHOW_UTILIZATION_ = false;

function liveMetrics_() {
  // A PLANNING window and a completed one are disjoint metric sets, not a
  // superset and a subset: everything except planCov needs work that already
  // happened, and planCov over a closed week is a plan nobody can act on any
  // more. Filtering here rather than in each available() means activeMetric_
  // re-points the comparison chart by itself when the reader moves the picker.
  var planning = planningPhase_();
  return METRIC_ORDER_.filter(function (k) {
    if (!METRICS_[k]) return false;
    if (!SHOW_UTILIZATION_ && k === "util") return false;
    if (MARGIN_METRICS_[k] && !canSeeMargin_()) return false;
    if (planning !== (k === "planCov")) return false;
    return METRICS_[k].available();
  });
}

/**
 * The columns of the grid that sits under the Drill-down's bullet chart.
 *
 * Now the SAME set as METRIC_ORDER_ (2026-08-17). It used to be deliberately
 * different — it carried Cleared per Person and Assigned wks to clear while the
 * chips carried Lead Time and Throughput — which meant the two halves of one
 * panel offered two different answers to "which metrics can I break down here",
 * and a reader who looked at the chips first was told the wrong thing about the
 * table directly beneath them.
 *
 * Kept as its own constant rather than collapsed into METRIC_ORDER_: the grid
 * and the chart have diverged before for real reasons, and a second list is a
 * cheaper way to diverge again than unpicking a shared one. If they are still
 * identical the next time this file is opened, collapse them.
 *
 * Filtered through liveMetrics_() so the grid inherits the planning-phase
 * collapse for free: on a forward window liveMetrics_() already returns only
 * "planCov", so gridMetrics_() does too and the grid re-points itself with no
 * separate switch to keep in sync.
 */
// TO MAKE AVAILABILITY A REAL COLUMN, the server would have to emit workforce
// capacity at a grain the client can re-aggregate — per person, or per
// cell × region — rather than per pool × band alone. Pro-rating the cell total
// by head share was considered and rejected: it assumes every person in a
// cell carries identical capacity, and "capacity is not fungible" is the
// doctrine the Workforce tab exists to enforce. An estimate wearing a graded
// cell is worse than an absent column.
// Availability sits where its KPI card does — straight after Forecast — so the
// columns read in the same order as the cards above them. Executive symmetry:
// a metric worth a top-level card is worth a regional breakdown.
var GRID_METRIC_IDS_ = ["onTime", "forecast", "avail", "quality", "util", "planCov"];
function gridMetrics_() {
  return liveMetrics_().filter(function (id) { return GRID_METRIC_IDS_.indexOf(id) !== -1; });
}

/** The metric the Trends view is on, falling back if Jira went away. */
function activeMetric_() {
  var ids = liveMetrics_();
  if (ids.indexOf(STATE.metric) === -1) STATE.metric = ids[0] || "onTime";
  return METRICS_[STATE.metric];
}

/**
 * One metric's full series over the complete periods in the window, plus its
 * confidence and its operating rate. The single call every new view uses.
 *
 * The operating rate has a WEEKLY FALLBACK. The export window holds 52 weeks,
 * which is ~11 complete months but only 3 complete fiscal quarters — so on the
 * Quarter view a norm built from the displayed unit could never reach the
 * 5-period minimum, and the feature would simply be missing exactly where an
 * executive is most likely to look. Weeks are the grain the user framed this in
 * ("the historical trend found week over week") and the metric is a RATE, so a
 * weekly median is directly comparable to a quarterly value. When the fallback
 * is used it is labelled as such — an unlabelled change of basis would be worse
 * than no rate at all.
 */
function metricSeries_(m, periods) {
  var pts = periods.map(function (p) {
    var v = m.value(p.isos);
    return { label: p.label, value: v, isos: p.isos, note: null };
  });
  var vals = pts.map(function (p) { return p.value; });
  var last = periods.length ? periods[periods.length - 1] : { isos: [] };
  var stable = vals.filter(function (v) { return v !== null; }).length;
  // Same two-step as the KPI cards: metricConfidence_ says how good the
  // attribution is, applyGatePolicy_ says what to do about it. Routing the
  // charts through the SAME policy is what stops the Trends view from going dark
  // on a metric the Executive tab is publishing (CONFIG_DH.SUPPRESS_BELOW_GATE).
  var conf = applyGatePolicy_(
    metricConfidence_(reg_(m.id).coverageGate, m.coverage(last.isos), stable));
  var std = stdFor_(vals, conf);
  if (std && !std.ok && STATE.period !== "week") {
    var wStd = stdFor_(completeWeekSeries_(m), conf);
    if (wStd && wStd.ok) { wStd.basis = "week"; wStd.displayUnit = PERIOD_LABELS[STATE.period].toLowerCase(); std = wStd; }
  }
  var tgt = (MODEL.meta.targets || {})[m.targetKey] || null;
  // Carry the lower-is-better flag from the registry onto the target object the
  // charts colour by, so a bar chart of Rework Rate doesn't paint the best
  // teams red.
  if (tgt && reg_(m.id).invertTarget) tgt = { green: tgt.green, amber: tgt.amber, invert: true };
  return { points: pts, values: vals, conf: conf, std: std, target: tgt };
}

/** The metric per COMPLETE ISO week over the whole export window — the widest
    honest basis for an operating rate, and the one the user asked for. */
function completeWeekSeries_(m) {
  var plan = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) {
    if (wk && wk.iso && wk.status !== "done") plan[wk.iso] = 1;
  });
  return allIsoWeeks_().filter(function (iso) { return !plan[iso]; })
    .map(function (iso) { return m.value([iso]); });
}

// ══════════════════════════════════════════════════════════════════════════
// EXECUTIVE VIEW — the comparison chart
//
// The cards say how the whole slice is doing. The one question that always
// follows is "where?", and answering it used to mean changing the Region filter
// five times and remembering five numbers. One labelled chart, every category
// against the same 0–100 axis, and the target and operating band drawn in.
// The bars are a READ-ONLY comparison (user 2026-08-03): filtering stays in the
// header controls, so there is one way to change scope rather than two.
// ══════════════════════════════════════════════════════════════════════════
/** Metric selector chips for the Executive comparison — the one surface that
    reads STATE.metric. */
function metricChips_() {
  return liveMetrics_().map(function (id) {
    return '<span class="chip' + (STATE.metric === id ? " on" : "") +
      '" onclick="setMetric_(\'' + id + '\')" title="' + esc_(reg_(id).definition || "") + '">' +
      esc_(METRICS_[id].label()) + "</span>";
  }).join("");
}

var COMPARE_LABELS = { region: "Region", level: "Level", team: "Team", pm: "PM",
                       family: "Job family" };
// Prose forms, declared rather than derived. `.toLowerCase()` on the chip label
// produced "4 pms measurable" and a naive + "s" would produce "job familys" —
// small, but this text sits under an executive chart.
var COMPARE_NOUN = {
  region: { one: "region", many: "regions" },
  team:   { one: "team",   many: "teams" },
  pm:     { one: "PM",     many: "PMs" },
  family: { one: "job family", many: "job families" },
  level:  { one: "level band", many: "level bands" },
};
function cmpNoun_(dim, n) {
  var w = COMPARE_NOUN[dim] || { one: dim, many: dim + "s" };
  return n === 1 ? w.one : w.many;
}
// Most bars a horizontal comparison chart draws BY DEFAULT. Above this it stops
// being a comparison and becomes a scrolling list nobody reads to the end of —
// but the cap is a default, not a wall: "Show all" lifts it (STATE.compareAll),
// because a team that isn't on the chart reads as a team that isn't in the data.
var HBAR_MAX_ROWS_ = 12;

/** Toggles between the top-N comparison and the full list. */
function toggleCompareAll_() {
  STATE.compareAll = !STATE.compareAll;
  renderCompare_();
}

function setCompare_(dim) {
  STATE.compare = dim;
  renderCompare_();
}

/**
 * ── §6 THE GRID — one cell of the metric × dimension table ─────────────────
 * Never a bare, uncoloured number that looks graded (brief D4): every branch
 * states WHY there is no colour, so "no verdict" reads differently from
 * "nothing here" and differently again from "not big enough to grade".
 *
 * Priority, checked in this order because each is a stronger reason than the
 * one below it: no data at all > too few people to grade > no target rule for
 * this metric at all (D11) > graded against a target.
 * @param {{value:?number, n:number, target:?Object, std:?Object, unit:?string}} o
 */
/**
 * ── IN-CELL MICRO-BARS (user 2026-08-17) ────────────────────────────────────
 * A length behind the number, so a director reads a whole column's shape in one
 * pass instead of comparing eight percentages digit by digit.
 *
 * IT IS A BACKGROUND, NOT A CHART. The bar carries no axis, no label and no
 * hit target — the number in front of it is still the value, and every grading
 * cue (the ✔/▲/✖ glyph, the ungraded-cell tooltip) is unchanged. That is what
 * keeps it safe under FR-4.4: strip the colour and the cell still says
 * everything it said before.
 *
 * DOMAIN. A percentage runs 0–100 always — a bar that rescaled to the column
 * max would make 88% and 92% look like a chasm. Unit metrics (days, hours) have
 * no natural ceiling, so those size against the column's own max, which the
 * caller passes; without one they draw no bar at all rather than inventing a
 * denominator.
 *
 * @param {number} v     the value
 * @param {?string} unit metric unit, or null for a percentage
 * @param {?number} max  column max, required only for unit metrics
 * @param {string} colour CSS colour for the fill
 */
function cellBarHtml_(v, unit, max, colour) {
  var pct;
  if (unit) {
    if (!max || !(max > 0)) return "";
    pct = v / max * 100;
  } else {
    pct = v;
  }
  pct = Math.max(0, Math.min(100, pct));
  // aria-hidden: the number beside it is the accessible value. A screen reader
  // announcing "37 percent" twice per cell is noise, not information.
  return '<i class="cellBar" aria-hidden="true" style="width:' + pct.toFixed(1) +
    "%;background:" + colour + '"></i>';
}

/**
 * The absolute counts behind a rate: " (1/2 items)".
 *
 * REPLACES the "ungraded (small n)" caveat (user 2026-08-17). The caveat warned
 * that a percentage might be thin; this states exactly how thin, which is the
 * question the reader was being asked to guess at. 50% is a different fact when
 * it is 1 of 2 than when it is 50 of 100, and the second reading is the one that
 * decides whether the row is worth a click.
 *
 * Rendered ONLY where the metric declares a sampleNoun, i.e. where its n() is a
 * count of records. util and planCov measure hours, so "(1400/2000 items)" would
 * be a fabricated unit — they print the rate alone, as before.
 *
 * The numerator is derived from the UNROUNDED value, so 61/63 prints "(61/63)"
 * rather than the 62 that rounding the displayed 97% back out would produce.
 */
function sampleFracHtml_(o) {
  if (!o.sampleNoun || o.unit) return "";
  var den = o.sampleN;
  if (den === null || den === undefined || !isFinite(den) || den <= 0) return "";
  var num = Math.round(o.value / 100 * den);
  return ' <span class="cellSub cellFrac">(' + num + "/" + den + " " +
    esc_(o.sampleNoun) + ")</span>";
}

function gridCellHtml_(o) {
  var lbl = o.unit ? function (v) { return fmtGridVal_(v, o.unit); } : function (v) { return Math.round(v) + "%"; };
  if (o.value === null || o.value === undefined) {
    // Click-inert ON PURPOSE, even when o.go is set: there is nobody behind a
    // number that was never measured, and a dead-end navigation teaches the
    // reader the live cells aren't worth clicking either.
    return '<td class="tnum gridCell" title="No measurable data in this slice.">—</td>';
  }
  // ── ONE-CLICK DRILL-THROUGH (user 2026-08-18) ─────────────────────────────
  // o.go = {row, id} marks this cell as a navigation control: click = slice +
  // metric + destination tab in one step (drillGo_). Built once here so every
  // value-carrying branch below wears the same affordance — pointer class,
  // keyboard reach, and a tooltip that makes the promise BEFORE the click.
  var go = o.go || null;
  var goCls = go ? " go" : "";
  var goTip = "", goAttr = "";
  if (go) {
    var gm = METRICS_[go.id];
    // ITEM metrics open the list of items behind the number, in place (user
    // 2026-09-09: "for MGMT 10% (1/10 items) I expect to see those 10 items").
    // Hour metrics (availability, planned coverage, utilisation) have no items
    // — they keep navigating to the tab that holds the people.
    var fn = ITEM_METRICS_[go.id] ? "drillItems_" : "drillGo_";
    if (fn === "drillItems_") {
      goTip = " Click: list the " + (o.sampleN !== undefined && o.sampleN !== null ? o.sampleN + " " : "") +
        "items behind this number — the ones that did not meet " + (gm ? gm.label() : go.id) +
        " first, with who owns each.";
    } else {
      var gDest = DRILL_DEST_[go.id] === "workforce" ? "Workforce" : "Actions";
      goTip = " Click: open " + gDest + " for this row's people on " + (gm ? gm.label() : go.id) + ".";
    }
    goAttr = ' role="button" tabindex="0" onclick="event.stopPropagation();' +
      fn + "(" + go.row + ",'" + go.id + "')\" " +
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
      "event.stopPropagation();" + fn + "(" + go.row + ",'" + go.id + "')}\"";
  }
  // ── OVER-ALLOCATION, NEVER A NEGATIVE RATE (user 2026-08-17) ───────────────
  // Availability goes below zero when planned hours exceed scheduled capacity.
  // "-25% available" is a data artefact a director cannot act on; the fact
  // underneath it — this group is booked past its capacity — is one they must.
  // The value clamps to 0% and the overrun becomes a red pill, with the raw
  // magnitude kept in the tooltip so nothing is hidden, only translated.
  if (!o.unit && o.value < 0) {
    return '<td class="tnum gridCell' + goCls + '"' + goAttr +
      ' title="Planned hours exceed scheduled capacity by ' +
      Math.round(-o.value) + '% of it — this group is booked past 100%. Shown as 0% ' +
      'available because a group cannot be less than empty-handed.' + esc_(goTip) + '">0% ' +
      '<span class="pillOver">Over-allocated</span></td>';
  }
  var txt = lbl(o.value) + sampleFracHtml_(o);
  // ── SMALL GROUPS ARE GRADED LIKE EVERY OTHER (user decision 2026-08-17) ────
  // Until now a category under 10 people kept its value, lost its colour, and
  // carried "ungraded (small n)". That was written to stop a red badge on six
  // people reading as a systemic failure — a real risk, answered the wrong way.
  //
  // Greying the one cell that is failing hardest breaks the scan: the reader
  // stops, reads fine print, and is left to judge severity themselves, on the
  // row least likely to get that effort. If ANZ is at 50% against an 85% target
  // it is red, exactly as AMER would be.
  //
  // The volume question the caveat was really asking — is this 50 of 100 or 1
  // of 2 — is now ANSWERED rather than warned about: sampleFracHtml_ prints the
  // absolute counts beside the rate, so the reader sees the severity AND the
  // weight in one glance and decides for themselves whether it is worth a click.
  // A number with its own denominator beside it needs no disclaimer.
  if (!o.target) {
    // D11: no target has been agreed, so the cell never colours. When a norm
    // publishes, the operating band is what "graded" means for this column —
    // drawn on the bullet chart below, not as a per-cell verdict here. When it
    // does NOT publish either, the cell says so explicitly, so it can never be
    // mistaken for a plain number that simply wasn't coloured.
    if (o.std && o.std.ok) {
      return '<td class="tnum gridCell' + goCls + '"' + goAttr +
        ' title="No target has been agreed for this metric. ' +
        'Graded against the operating band (' + lbl(o.std.lo) + '–' + lbl(o.std.hi) +
        ').' + esc_(goTip) + '">' +
        cellBarHtml_(o.value, o.unit, o.max, "var(--c-ref)") + txt + "</td>";
    }
    // THE "no reference" CAPTION IS GONE (user 2026-08-17). It made the reader
    // guess what the system meant, on every row of a target-less column. The
    // fact it carried lives in the tooltip instead — the neutral grey bar and
    // the absent RAG glyph already say "not graded" to anyone scanning.
    return '<td class="tnum gridCell' + goCls + '"' + goAttr +
      ' title="No organizational target has been set for this ' +
      'metric, and there is not yet enough history for an operating norm — the value is ' +
      'shown ungraded.' + esc_(goTip) + '">' +
      cellBarHtml_(o.value, o.unit, o.max, "var(--c-ref)") + txt + "</td>";
  }
  var rag = ragOf_(o.value, o.target);
  var cls = { g: "sigGood", a: "sigWarn", r: "sigBad" }[rag] || "";
  // The bar takes the RAG the glyph ALREADY states — read from the same rag,
  // never recomputed, so the colour and the mark cannot drift apart.
  var fill = { g: "var(--c-good)", a: "var(--c-warn)", r: "var(--c-bad)" }[rag] || "var(--c-ref)";
  return '<td class="tnum gridCell' + goCls + '"' + goAttr +
    (goTip ? ' title="' + esc_(goTip.trim()) + '"' : "") + ">" +
    cellBarHtml_(o.value, o.unit, o.max, fill) +
    '<span class="sigDot ' + cls + '">' + RAG_MARK[rag] +
    "</span> " + txt + "</td>";
}

/** Click-through from a bar to the matching filter (toggles off if re-clicked). */

/**
 * ── THE BREAKDOWN CHART (Tier 3 drill-down) ──────────────────────────────────
 * Restored 2026-08-17 after a phase hidden behind SHOW_COMPARE_PANEL_. It was
 * hidden as "Billable Utilization by Region" — but the panel was never a
 * utilization panel: it charts whichever metric is selected, and its default
 * has always been On-Time Delivery. Hiding it to suppress a financial metric
 * removed the org's only breakdown of on-time performance along with it.
 *
 * With Utilization now switched off at liveMetrics_ (SHOW_UTILIZATION_), the
 * financial lens is gone from the chip strip while the breakdown itself stays —
 * which is what was actually wanted both times.
 */
function renderCompare_() {
  var panel = document.getElementById("comparePanel");
  if (!panel) return;
  panel.style.display = "";
  var m = activeMetric_();
  var A = analysisHead_();
  var done = A.done, head = A.head;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var target = (MODEL.meta.targets || {})[m.targetKey] || null;

  // Compare-by chips, cascaded like every other control: a dimension with
  // nothing in it under the current filters is offered but marked.
  var chips = Object.keys(COMPARE_LABELS).map(function (d) {
    var o = optionsFor_(d);
    var dead = o.live.length === 0;
    return '<span class="chip' + (STATE.compare === d ? " on" : "") + (dead ? " off" : "") +
      '"' + (dead ? "" : ' onclick="setCompare_(\'' + d + '\')"') +
      ' title="' + (dead ? "no " + cmpNoun_(d, 2) + " in this slice"
                         : "break the metric down by " + cmpNoun_(d, 1) +
                           " — " + o.live.length + " in scope") + '">' +
      COMPARE_LABELS[d] + "</span>";
  }).join("");

  // Metric chips — the comparison charts whatever the Trends view is charting,
  // so switching metric in one place switches it everywhere (one lens, not two).
  var mchips = metricChips_();

  var o = optionsFor_(STATE.compare);
  var d = FILTER_DIMS[STATE.compare];
  // Each bar is that category measured on its own, so the active filter for THIS
  // dimension is switched off while the bars are built — otherwise picking AMER
  // would leave a chart with one bar in it. Two halves to that switch-off:
  // members skip it via passesFilters_'s skip argument, but the metric
  // accessors inside scopedMetric_ run passesFilters_ WITHOUT a skip — so the
  // filter itself is parked for the duration of the fold (found 2026-08-17 when
  // row selection landed: picking AMER blanked every other row's values and
  // reshuffled the ranking under the click).
  var savedSel = STATE[STATE.compare] || "";
  STATE[STATE.compare] = "";
  try {
  var rows = o.live.map(function (val) {
    var members = MODEL.people.filter(function (p) {
      return passesFilters_(p, STATE.compare) && dimMatch_(p, STATE.compare, val);
    });
    // attribOnly stubs STAY in the metric scope — bucketsFor_ joins a leaver's
    // or non-Services assignee's issues through their stub name, and dropping
    // them here would silently un-attribute that work from every issue-based
    // bar (v13 whole-roster attribution). They only leave the HEADCOUNT: the
    // number left of the bar counts people in the operational population —
    // and only people who EXISTED in the compared period (existsIn_), so an
    // older window shows that window's roster, not today's.
    var names = {};
    members.forEach(function (p) { names[p.name] = 1; });
    var v = scopedMetric_(m, head.isos, names);
    var realN = members.filter(function (p) {
      return !p.attribOnly && existsIn_(p, head.isos);
    }).length;
    // §6 THE GRID (Task 15) — every grid column's value for THIS same bar,
    // computed alongside the active metric's so the grid and the bullet chart
    // below it describe one row, not two independently-built lists that could
    // silently disagree on membership.
    var cells = {}, cellN = {};
    gridMetrics_().forEach(function (id) {
      cells[id] = scopedMetric_(METRICS_[id], head.isos, names);
      // The rate's own denominator, scoped to the SAME population — this is what
      // turns "50%" into "50% (1/2 items)".
      cellN[id] = scopedMetricN_(METRICS_[id], head.isos, names);
    });
    return { key: val, label: val, value: v, n: realN, cells: cells, cellN: cellN, names: names };
  }).filter(function (r) { return r.n > 0; })
    .sort(function (a, b) {
      // Nulls last: "no measurable data" is not a low score and must not sit at
      // the bottom of a ranked list as though it were one.
      if (a.value === null && b.value === null) return b.n - a.n;
      if (a.value === null) return 1;
      if (b.value === null) return -1;
      return b.value - a.value;
    });

  var std = metricSeries_(m, done).std;
  var withVal = rows.filter(function (r) { return r.value !== null; });

  // ── §6 THE GRID (Task 15, spec 2026-08-06 §6) ──
  // Rows are chosen by capRows_ against the ACTIVE metric's own value — the
  // SAME ranking hbarChart_ applies to `rows` below, so the grid and the
  // bullet chart can never disagree about which categories are "the ones that
  // matter" (distance below reference, never list position). Target/std are
  // computed per COLUMN (org-wide), never per row — grading is always a value
  // against ITS OWN metric's reference, not the active metric's.
  var gridIds = gridMetrics_();
  var gridTargets = {}, gridStds = {};
  gridIds.forEach(function (id) {
    var mm = METRICS_[id];
    var t = (MODEL.meta.targets || {})[mm.targetKey] || null;
    if (t && reg_(id).invertTarget) t = { green: t.green, amber: t.amber, invert: true };
    gridTargets[id] = t;
    gridStds[id] = metricSeries_(mm, done).std;
  });
  // The park ends here: the row values AND the per-column operating bands are
  // both folded over the whole population — a band recomputed from only the
  // selected category would silently re-grade every other row.
  } finally { STATE[STATE.compare] = savedSel; }
  var gridSel = capRows_(rows, !!STATE.compareAll);
  // Per-column max, for the micro-bars on UNIT metrics only (days, hours) —
  // percentages always draw against 0–100. Computed from the rows actually
  // DRAWN, so the longest visible bar fills its cell rather than being scaled
  // by a row the cap removed.
  var gridMax = {};
  gridIds.forEach(function (id) {
    var mx = 0;
    gridSel.rows.forEach(function (r) {
      var v = r.cells[id];
      if (v !== null && v !== undefined && v > mx) mx = v;
    });
    gridMax[id] = mx;
  });
  var gridHtml = "";
  if (gridIds.length) {
    // ── ROWS ARE CONTROLS (user 2026-08-17) ─────────────────────────────────
    // Clicking a row selects its category: the row highlights, the dimension's
    // own universal filter is set, and the two drill buttons in the header
    // inherit the slice — "Who is available → · ANZ" — before they are clicked.
    // Keys travel by INDEX through DRILL_ROW_KEYS_, never inlined into the
    // onclick string, so a team named O'Brien & Co cannot break the handler.
    DRILL_ROW_KEYS_ = gridSel.rows.map(function (r) { return r.key; });
    // The exact people set each row was computed over (2026-09-09): the items
    // panel reproduces a cell from the SAME population, never a re-derivation.
    DRILL_ROW_NAMES_ = gridSel.rows.map(function (r) { return r.names || {}; });
    DRILL_ROW_LABELS_ = gridSel.rows.map(function (r) { return r.label; });
    var dimSel = STATE[STATE.compare] || "";
    gridHtml = '<div class="gwrap" style="margin:8px 0"><table class="hyg gridTable">' +
      '<thead><tr><th class="tname">' + esc_(COMPARE_LABELS[STATE.compare]) + "</th>" +
      gridIds.map(function (id) {
        var mm = METRICS_[id];
        return '<th class="tnum' + (STATE.metric === id ? " on" : "") + '" role="button" tabindex="0" ' +
          'onclick="setMetric_(\'' + id + '\')" ' +
          'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
          'setMetric_(\'' + id + '\');}" style="cursor:pointer" title="' +
          esc_("Rank the rows by " + mm.label() + ", and make it the selected metric.") + '">' +
          esc_(mm.label()) + (STATE.metric === id ? " ▾" : "") + "</th>";
      }).join("") + "</tr></thead><tbody>" +
      gridSel.rows.map(function (r, i) {
        // OFFENDER ROWS (2026-08-17). A row is marked when it is below the
        // ACTIVE metric's target — the metric the reader selected, or the KPI
        // card they clicked to get here. Marked, never reordered: the ranking
        // is capRows_'s job and having two things move at once would make the
        // table feel like it jumped. Graded rows only — a small-n row keeps its
        // ungraded status here exactly as it does in its cells.
        var av = r.cells[STATE.metric];
        var atg = gridTargets[STATE.metric];
        // No headcount floor (2026-08-17): the cell is coloured at every size, so
        // a row whose cell is red and whose name is unmarked would be the two
        // halves of one table disagreeing about the same number.
        var offender = atg && av !== null && av !== undefined &&
                       ragOf_(av, atg) === "r";
        var isActive = dimSel === r.key;
        var rowCls = (offender ? "rowOffender" : "") + (isActive ? " rowActive" : "");
        return "<tr" + (rowCls.trim() ? ' class="' + rowCls.trim() + '"' : "") +
          ' role="button" tabindex="0" aria-pressed="' + (isActive ? "true" : "false") +
          '" onclick="drillRowPick_(' + i + ')" ' +
          'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
          'drillRowPick_(' + i + ');}" title="' +
          esc_(isActive
            ? "Selected. Every filter on the page is narrowed to this slice — click again to clear it."
            : "Select " + r.label + ": every filter on the page narrows to it, so the Actions, " +
              "Project Managers and Workforce tabs open already narrowed.") + '"><td class="tname">' +
          (offender ? '<span class="offMark" title="Below the ' +
            esc_(METRICS_[STATE.metric].label()) + ' target — one of the rows pulling ' +
            'the selected metric down.">▸</span>' : "") + esc_(r.label) +
          ' <span class="cellSub">(' + r.n + ")</span></td>" +
          gridIds.map(function (id) {
            return gridCellHtml_({ value: r.cells[id], n: r.n, target: gridTargets[id],
                                   std: gridStds[id], unit: METRICS_[id].unit,
                                   max: gridMax[id],
                                   sampleN: (r.cellN || {})[id],
                                   sampleNoun: METRICS_[id].sampleNoun,
                                   // One-click drill-through (2026-08-18): the
                                   // cell navigates to this metric's own tab
                                   // with this row's slice applied.
                                   go: { row: i, id: id } });
          }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>" +
      // ── THE ITEMS BEHIND THE CLICKED CELL (user 2026-09-09) ─────────────
      drillItemsHtml_() +
      // THE ROW CAP NEEDS ITS OWN ESCAPE HATCH (2026-08-17). This affordance
      // used to live on the bar chart; the chart went, the cap did not, and a
      // 15-team org would have silently shown 12 with no way to see the rest.
      // Removing a redundant view must not remove a capability with it.
      (gridSel.hidden > 0 || STATE.compareAll
        ? '<div class="cellSub" style="margin:-2px 0 6px">' +
          '<button class="btn" onclick="toggleCompareAll_()" title="' +
          esc_(STATE.compareAll
            ? "Show only the rows furthest below their reference."
            : "Show every " + cmpNoun_(STATE.compare, 2) + " in this slice, not just the " +
              "ones furthest below their reference.") + '">' +
          (STATE.compareAll ? "Show top " + HBAR_MAX_ROWS_
                            : "Show all " + (gridSel.rows.length + gridSel.hidden)) +
          "</button>" +
          (gridSel.hiddenNoData > 0 && !STATE.compareAll
            ? ' <span title="Hidden because nothing measurable landed in them this period, not ' +
              'because they scored badly.">' + gridSel.hiddenNoData +
              " with no measurable data</span>" : "") +
          "</div>"
        : "");
  }

  // ── Population accounting (user-reported 2026-08-03) ──
  // A breakdown must be able to prove it covers everybody. Distinct people, not
  // a sum of row counts: Team and PM membership OVERLAP, so someone on two teams
  // is in two bars and the counts add up past the headcount. Anyone missing here
  // is a person the chart is silently not describing — the failure this line
  // exists to make impossible.
  // attribOnly stubs are excluded from BOTH sides of "shown of inScope": this
  // sentence proves the chart covers the operational population, and stubs are
  // not in it (their issues still move the bar values via the scope names above).
  // Same period gate as the per-bar counts: "all N people represented" must
  // describe the compared period's roster, or the sentence contradicts the
  // scope chip whenever an older window is selected (2026-08-04).
  var seen = {};
  rows.forEach(function (r) {
    MODEL.people.forEach(function (p) {
      if (!p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare) &&
          dimMatch_(p, STATE.compare, r.key)) seen[p.name] = 1;
    });
  });
  var shown = Object.keys(seen).length;
  var inScope = MODEL.people.filter(function (p) {
    return !p.attribOnly && existsIn_(p, head.isos) && passesFilters_(p, STATE.compare);
  }).length;
  var untaggedRow = rows.filter(function (r) { return isUntagged_(r.key); })[0];
  var overlaps = rows.reduce(function (t, r) { return t + r.n; }, 0) > shown;
  var below = target ? withVal.filter(function (r) { return r.value < target.green; }).length : 0;
  // Chart-area verdict states COUNTS, never names (P6) — the People tab is
  // where an individual is named, deliberately.
  var verdict = !withVal.length
    ? "Nothing measurable to compare in this slice."
    : "<b>" + withVal.length + "</b> " + cmpNoun_(STATE.compare, withVal.length) +
      " measurable in " + esc_(head.label) +
      (target ? " · <b class=\"" + (below ? "vr" : "vg") + '">' + below + "</b> below the ≥" +
        target.green + "% target" : "") +
      (std && std.ok ? " · <b>" + rows.filter(function (r) {
        return r.value !== null && r.value < std.lo;
      }).length + "</b> below the normal operating range" : "") +
      (rows.length > withVal.length ? " · " + (rows.length - withVal.length) +
        " with no measurable data" : "") +
      // Say it even when it's complete. "Every person is in a bar" is exactly the
      // reassurance an executive needs before acting on a comparison, and the
      // day it stops being true the sentence changes by itself.
      ' · <span title="Distinct people represented by the bars above, against everyone the current filters select. Team and PM membership overlaps, so the per-bar counts add up past the headcount — this figure counts each person once.">' +
      (shown >= inScope
        ? "<b>all " + inScope + "</b> people represented"
        : '<b class="vr">' + shown + " of " + inScope + "</b> people represented — " +
          (inScope - shown) + " missing") + "</span>";

  panel.innerHTML =
    // Title, period, THEN THE TWO ACTIONS on the same line — the section's
    // point is reachable without scrolling. The dimension chips drop to their
    // own row below: five of them plus two buttons on one line wrapped into a
    // muddle on anything narrower than a desktop.
    '<div class="chartHead"><h3>' + esc_(m.label()) + " by " +
      esc_(COMPARE_LABELS[STATE.compare]) + scopeTag_("period") + "</h3>" +
      '<span class="sub">' + esc_(head.label) + " · last complete " + unit + "</span>" +
      '<span style="flex:1"></span>' + "</div>" +
    '<div class="chartHead" style="margin-bottom:6px"><span class="sub">Break down by</span>' +
      '<span class="chips seg">' + chips + "</span></div>" +
    // THE METRIC TOGGLE ROW IS GONE (2026-08-17). It offered a pill per metric
    // directly above a table with a column per metric — the same choice twice,
    // and the pills only ever existed to swap out the bar chart that was removed
    // earlier. The COLUMN HEADER is the control now: clicking it ranks by that
    // metric, which is what the pill did, in the place the reader is already
    // looking.

    // The active metric's own definition still needs saying — it is what the
    // ranking is by — so it keeps a line, without the pills that used to sit
    // beside it.
    '<div class="chartHead" style="margin-bottom:6px"><span class="sub" title="' +
      esc_((m.detail ? m.detail() : reg_(m.id).formula) || "") + '">Ranked by ' +
      esc_(m.label()) + " — " + esc_(m.axis()) + ' ⓘ</span></div>' +
    gridHtml +
    '<div class="verdict">' + verdict + "</div>" +
    // THE BAR CHART IS GONE (2026-08-17). It restated the table directly above
    // it — the same categories, the same values, the same ranking — and did so
    // at full page width, which meant a director scrolled past a bar drawn at
    // 0% to reach the buttons that let them act on it. The grid already grades
    // every cell against that metric's own target and operating band, and a
    // number in a table is not harder to read than a bar; it is only less tall.
    //
    // hbarChart_ itself is UNTOUCHED and still tested. The chart is a candidate
    // to return on a wide-screen layout where it costs nothing, which is a
    // different decision from "this comparison should be a picture".
    '<div class="cellSub" style="margin-top:6px">' +
      "The number beside each row is its headcount. " +
      (overlaps
        ? "Membership overlaps, so the rows sum to more than the headcount — " +
          "someone on two teams appears in both. "

/**
 * Per-person utilization opportunity for one period: the gap between the rate
 * someone ran at and the cohort operating rate, converted to HOURS — because a
 * percentage point is not something anyone can reassign, and hours are.
 *
 *   opportunity = max(0, norm% × their available hours − their delivered hours)
 *
 * Only ever positive: someone above the norm is carrying it, not owed a
 * negative. Excluded, because their gap is not an opportunity at all: people
 * on long leave (no availability is expected), interns (ranking them by
 * "hours that could be recovered" is exactly the punishment that flag exists
 * to prevent), pre-hire periods, and anyone with no measurable capacity.
 * Ramping new hires get a row but come back FLAGGED — the 👥 pulse leaves
 * them out of its recoverable total, because "ramping" is the explanation and
 * the total is a call to act.
 * Utilization only: On-Time and Forecast are attributed per issue, and an
 * individual's on-time rate over three closed stories is not a number anybody
 * should act on. Fed the roster's headline period; the roster itself carries
 * the per-person detail (the standalone headroom table was retired 2026-08-05).
 */
/**
 * ── PER-BAND OPERATING RATES (user 2026-08-17) ───────────────────────────────
 * One blended norm priced everyone against a median dominated by consultants,
 * so a manager's ordinary meeting, coaching and 1:1 load (POL - Time Logging;
 * Manager Playbook) read as recoverable idle hours. The RevOps utilization
 * reference measures net utilization as ALL logged hours over net capacity —
 * the achieved rate already carries each role's structural overhead, but only
 * when it is measured per role. So the norm is computed PER LEVEL BAND
 * (MGMT / SENIOR / CORE / JUNIOR) — the same "never blended" doctrine the
 * Workforce tab enforces for capacity — and every person is priced against
 * their own band's achieved median.
 *
 * A band without a publishable norm of its own (thin history) is EXCLUDED and
 * disclosed, never guessed at: falling back to the blended norm would
 * re-import the bug for exactly the band most unlike the blend.
 */
function bandNorms_(done) {
  var members = {};
  filteredPeople_().forEach(function (p) {
    var band = levelName_(p);
    (members[band] = members[band] || {})[p.name] = 1;
  });
  var norms = {};
  Object.keys(members).forEach(function (band) {
    SCOPE_NAMES_ = members[band];
    try {
      var std = metricSeries_(METRICS_.util, done).std;
      norms[band] = (std && std.ok) ? std.baseline : null;
    } finally {
      SCOPE_NAMES_ = null;
    }
  });
  return norms;
}

function oppRows_(head, norms) {
  var live = nsLive_();
  return filteredPeople_().map(function (p) {
    if (p.onLeave) return null;
    // A benched person's idle hours are not an opportunity to recover — there is
    // no engagement to recover them into. Same reasoning as the on-leave carve
    // above, and the same reasoning that keeps ramping new hires out of the
    // pulse total.
    if (p.onBench) return null;
    if (p.isIntern) return null;
    var w = aggWeeks_(p, head.isos);
    if (!w) return null;                       // pre-hire: the period predates them
    var den = live ? (w.availCov || 0) : w.avail;
    if (den <= 0) return null;                 // no capacity, or nothing NS classified
    var num = live ? w.billable : w.tracked;
    var rate = num / den * 100;
    // The norm is the person's OWN band's achieved rate (bandNorms_), never a
    // blend — a manager is priced against how managers actually run.
    var bn = norms ? norms[levelName_(p)] : null;
    if (bn === undefined) bn = null;
    // Hours, not points: the unit a manager can actually move.
    var opp = bn === null ? 0 : Math.max(0, den * (bn / 100) - num);
    return { name: p.name, rate: rate, opp: opp, den: den, num: num, p: p,
             ramping: p.newHire === true,
             // Band norm unpublishable → this row is not PRICED. The pulse
             // states how many people that leaves out rather than pricing them
             // against a blend that misdescribes their role.
             unpriced: bn === null, band: levelName_(p) };
  }).filter(Boolean);
}

  var pulseUnit = PERIOD_LABELS[STATE.period].toLowerCase();

    : "";

    '<div class="kicker">CAPACITY — what we have to throw at it</div>' +

/**
 * Count-up animation (Motion, spec §7) — runs ONCE per page load, only where
 * rAF exists (the render-smoke DOM stub has none — the whole feature is
 * invisible to it by design) and never under prefers-reduced-motion. Moved
 * here from the retired renderTiles_ (Task 16B) and generalised to scan every
 * container that carries KPI tiles with a live count-up: Tier 1 (#tier1Tiles —
 * On-Time/Forecast/Quality/Throughput/Bug Count plus the three queue cards),
 * Tier 2's flow-detail strip (#flowSecondary — Cleared/Arrived/Lead Time) and
 * the Capacity panel's Utilisation/Planned-Coverage tile. One shared flag, not
 * one per container, because the spec says "once per page load" — not once per
 * band. All three rewrite their innerHTML on every render, so a count-up
 * mid-flight from a prior render can never corrupt a later one — the nodes it
 * was mutating are simply gone.
 */
function countUpTiles_() {
  if (countedUp_ || !window.requestAnimationFrame ||
      window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  countedUp_ = true;
  ["tier1Tiles", "flowSecondary", "pulsePanel"].forEach(function (id) {
    var bigs = document.getElementById(id).getElementsByClassName("big");
    Array.prototype.forEach.call(bigs, function (el) {
      var m = /^(\d+)(.*)$/.exec(el.textContent || "");
      if (!m) return;
      var target = +m[1], suffix = m[2], t0 = null;
      function step(ts) {
        if (t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / 700);
        el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + suffix;
        if (k < 1) window.requestAnimationFrame(step);
      }
      window.requestAnimationFrame(step);
    });
  });
}

 * previous narrowing — otherwise the general entry point would silently inherit
 * a filter set minutes ago on another tab.
 */
function openRoster_(sig) {
  STATE.rosterSort = "opp"; STATE.rosterDesc = false;
  STATE.sigFilter = sig || "";
  switchView_("actions");
}

/**
 * Little's Law (L = λW) sanity check on the queue: does the measured open
 * inventory roughly match what the measured clearing rate (λ) and the
 * measured median lead time (W) would predict? Every figure here is read off
 * MODEL — there is no hand-typed threshold, so a change to either buckets
 * feed changes what this prints on the next render, unlike the prototype's
 * literal "1 person on leave is not credible" line, which would have been
 * wrong the very next month with nothing to notice.
 * @returns {{measured:?number, rate:?number, leadWeeks:?number, predicted:?number}}
 */
function littlesLawCheck_() {
  var q = MODEL.queue || {};
  var asg = q.assigned || {}, un = q.unassigned || {};
  var unItems = (un.items === null || un.items === undefined) ? 0 : un.items;
  var measured = (asg.items || 0) + unItems;
  var rate = MODEL.meta.clearRateMedian || null;
  var isos = analysisHead_().head.isos;
  var b = bucketsFor_(MODEL.leadTimeBuckets || [], isos);
  var leadWeeks = (b.days && b.days.length) ? flowMedian_(b.days) / 7 : null;
  var predicted = (rate && leadWeeks !== null) ? rate * leadWeeks : null;
  return { measured: measured, rate: rate, leadWeeks: leadWeeks, predicted: predicted };
}

/** People-signals reconciliation sentence — the SAME two computed quantities

    `[object Object]` "people" caveat. */

  var s = signalSummary_(isos);

  var pop = filteredPeople_().length;

  return acct === pop
    ? acct + " of " + pop + " people accounted for across the signal buckets."
    : acct + " of " + pop + " people accounted for — " + (pop - acct) + " missing from every bucket.";
}

      n1Dh_(ll.leadWeeks) + " weeks, predicting ≈" + nfDh_(Math.round(ll.predicted)) +

/**
 * A metric restricted to a named set of people.
 *
 * ⚠ THIS FUNCTION MUST NEVER CONTAIN A FORMULA. It used to, and every one of
 * them had drifted from the METRICS_ accessor it was shadowing:
 *   · quality fell through to forecastBuckets and published forecast-band
 *     numbers under a Quality/Rework label;
 *   · forecast returned nWithin/n (the ±10% band) while the card showed the
 *     Dictionary mean;
 *   · util divided by availCov (net) while the card divided by capCov (gross).
 * So a Region bar and the tile directly above it disagreed on three of four
 * metrics, each pair internally consistent and mutually contradictory.
 *
 * The fix is structural, not three patches: scope the POPULATION, then call the
 * one accessor. `SCOPE_NAMES_` is read by passesFilters_, which is what both
 * utilFor_ and bucketsFor_ already run every person through — so every metric,
 * including any added later, is scoped by construction and can only ever have
 * one definition.
 */
function scopedMetric_(m, isos, nameSet) {
  SCOPE_NAMES_ = nameSet;
  try {
    return m.value(isos);
  } finally {
    // finally, not a trailing assignment: an exception inside an accessor would
    // otherwise leave the whole dashboard scoped to one bar's population.
    SCOPE_NAMES_ = null;
  }
}

/**
 * The metric's own SAMPLE SIZE for one bar's population — how many records the
 * rate was computed over, not how many people are in the category.
 *
 * Same scoping mechanism and the same one-accessor rule as scopedMetric_ above:
 * it sets SCOPE_NAMES_ and calls the metric's declared n(), so the count and the
 * value it contextualises can never be computed over two different populations.
 * Null when the metric declares no n().
 */
function scopedMetricN_(m, isos, nameSet) {
  if (!m || typeof m.n !== "function") return null;
  SCOPE_NAMES_ = nameSet;
  try {
    return m.n(isos);
  } finally {
    SCOPE_NAMES_ = null;
  }
}

/**
 * Triage flags for one person (director feedback: the grid is a roster, the
 * manager's question is "who needs me this week"). Each flag states the
 * IMPLICATION, not just the number. New hires skip zero-tracked (ramping).
 */
function personExceptions_(p) {
  // On leave = no availability expected: zero-tracked / under-planned /
  // overloaded flags would all misread the absence as a delivery problem.
  if (p.onLeave) return [];
  // Interns carry no triage flags — "zero-tracked" or "under-planned" on
  // someone who is here to learn reads as a performance verdict it isn't.
  if (p.isIntern) return [];
  var ex = [];
  var hi = MODEL.meta.headlineIso;
  var w = p.weeks[hi];
  var futureAvail = 0, futurePlanned = 0;
  MODEL.meta.gridWeeks.forEach(function (g) {
    if (g.status !== "plan") return;
    var fw = p.weeks[g.iso];
    if (!fw) return;
    futureAvail += fw.avail;
    futurePlanned += fw.cap > 0 ? Math.min(fw.planned, fw.avail) : fw.planned;
  });
  var backlogOver = MODEL.meta.jiraAvailable && p.backlog &&
    (futureAvail - p.backlog.remHrs) < 0;
  if ((w && w.cap > 0 && w.tracked > w.cap) || backlogOver) {
    ex.push({ sev: 3, icon: "⚠", label: "overloaded",
      why: backlogOver
        ? "backlog ~" + r1_(p.backlog.remHrs) + "h vs " + r1_(futureAvail) +
          "h available over the next weeks — needs offloading or re-planning"
        : "tracked " + r1_(w.tracked) + "h against " + r1_(w.cap) + "h capacity in " +
          hi + " — real overtime" });
  }
  // PLAN_CLIFF_, not a second literal 0.5: the Planned Coverage card and the
  // roster's Plan column count "under-planned" people with this same line, and
  // three copies of a threshold is three places for it to drift.
  if (futureAvail > 0 && futurePlanned < futureAvail * PLAN_CLIFF_) {
    ex.push({ sev: 2, icon: "▽", label: "under-planned",
      why: "only " + r1_(futurePlanned) + "h planned of " + r1_(futureAvail) +
        "h available over the next weeks — coverage cliff, needs planning" });
  }
  if (w && w.avail > 0 && w.tracked === 0 && !p.newHire) {
    ex.push({ sev: 1, icon: "○", label: "zero tracked",
      why: "no time tracked in " + hi + " with " + r1_(w.avail) +
        "h available — worth a check-in" });
  }
  return ex;
}

// ── TRIAGE FLAGS AS A FILTER ─────────────────────────────────
//
// The attention line ("18 of 64 people need attention — ⚠ 4 overloaded · …")
// used to be a read-only caption. Every one of those counts is a question a
// manager wants to act on, so each is now a filter: click "4 overloaded" and the
// whole dashboard — cards, charts and grid — narrows to those four. Clicking it
// again clears it. This is the legend-as-control rule the user asked for: if a
// label states a count, clicking it should show you that count.

var FLAG_LABELS = {
  over:  { icon: "⚠", label: "overloaded",    sev: 3, key: "overloaded" },
  under: { icon: "▽", label: "under-planned", sev: 2, key: "under-planned" },
  zero:  { icon: "○", label: "zero tracked",  sev: 1, key: "zero tracked" },
};

/**
 * personExceptions_ walks the forward grid weeks for every person, and
 * passesFilters_ can be called once per person PER PERIOD inside utilFor_ — so
 * an unmemoized call turns one render into tens of thousands of week loops.
 * Flags depend only on the payload, never on the filters, so one cache per load
 * is correct. Cleared in loadData.
 */
function exceptionsOf_(p) {
  if (!MODEL._exCache) MODEL._exCache = {};
  if (!MODEL._exCache[p.name]) MODEL._exCache[p.name] = personExceptions_(p);
  return MODEL._exCache[p.name];
}

function hasFlag_(p, flag) {
  var want = FLAG_LABELS[flag];
  if (!want) return true;
  return exceptionsOf_(p).some(function (x) { return x.label === want.key; });
}

/** Toggle a triage flag filter (clicking the active one clears it). */
function toggleFlag_(flag) {
  STATE.flag = STATE.flag === flag ? "" : flag;
  buildFilters_();   // the audience changed, so every other option list re-cascades
  renderAll_();
}

function r1_(v) { return Math.round((Number(v) || 0) * 10) / 10; }

function setMetric_(id) {
  STATE.metric = id;
  renderAll_();      // the Executive comparison chart follows STATE.metric
}

// ── 👥 SIGNALS ROSTER RENDER (spec §5.2, 2026-08-05) ─────────────────────────
// Default sort: biggest opportunity first — most-red overall, then most
// offending records. The Executive pulse deep-links here with this sort.
// Sort order for the roster's "biggest opportunity first" default. `learn`
// (intern) sits BEYOND `na` on purpose: an ungraded row is not an opportunity,
// and a 🎓 row must never be able to surface at the top of an action queue.
var ROSTER_RANK_ = { bad: 0, warn: 1, small: 2, good: 3, na: 4, learn: 5 };
/** The Hours column's sorter has no other way to know which period the roster
    is showing — renderRoster_ refreshes this to head.isos before every sort
    (Task 6, 2026-08-05). */
var ROSTER_ISOS_ = null;
/** Which phase of window the roster is rendering — "done" | "now" | "plan".
    Set by renderRoster_ before the header and sorters run, for the same reason
    ROSTER_ISOS_ exists: a column's `when`/`sort` is called from a context that
    has no access to the head. */
var ROSTER_PHASE_ = "done";
var ROSTER_COLS_ = {
  person: { label: "Person", sort: function (a, b) { return a.p.name.localeCompare(b.p.name); } },
  // OVERALL IS OFF THE TABLE (user decision 2026-08-28): a synthetic
  // worst-of-columns verdict beside the columns it summarises read as noise once
  // the per-field cells were trimmed to the actionable five. The GRADE survives
  // — r.overall still drives the Executive pulse, the Need action / Watch chips
  // and this default sort — it just no longer paints a cell. `when: false` hides
  // the header; renderRoster_ writes no cell for it, so the two stay aligned.
  //
  // ⚠ ROSTER_COLS_ key order drives the HEADER only. The row cells are written
  // out by hand in renderRoster_ and must be moved with it — a header without
  // its cell shifts every value one column left, which is the quiet kind of
  // wrong that gets screenshotted. A render check pins the two orders together.
  opp:    { label: "Overall", when: function () { return false; },
    sort: function (a, b) {
    return (ROSTER_RANK_[a.overall] - ROSTER_RANK_[b.overall]) || (b.miss - a.miss);
  } },
  // "Backlog of the week" (renamed from "Open issues", user 2026-08-28): the
  // open half is the work this person is carrying RIGHT NOW under the status
  // and due-date rules — the actionable backlog — and the cell flags how much
  // of it is already overdue. Still a count, never a grade: it is the widest
  // population on the row, epics included, while every cell beside it divides
  // by something narrower. The name follows the population toggle, because the
  // same number means two different things on the two views.
  n:      { label: "Issues",
            labelOf: function (open) { return open ? "Backlog of the week" : "Resolved"; },
            sort: function (a, b) { return b.n - a.n; } },
  due:    { label: "Due date", sig: "due" },
  est:    { label: "Estimate", sig: "est" },
  logged: { label: "Logged",   sig: "logged" },
  // Epic link stays (2026-08-28): unlinked hours cannot reach an engagement.
  // Billable tag, Start date and Progress left the table the same day (user
  // decision) — SIGNAL_FIELDS_ still computes them for the CSV and the
  // methodology, they just no longer paint columns.
  link:   { label: "Epic link",    sig: "link" },
  // Available: the hours NOT yet spoken for — the signal a manager can assign
  // against (user 2026-08-28; replaces the billable-share Hours bar). Most
  // available first. Ramping new hires and on-leave people (same exclusion as
  // the recoverable-hours pulse) sort last regardless of direction — their
  // idle capacity is not assignable room.
  hours:  { label: "Available",  sort: function (a, b) {
    function availH(r) {
      if (r.p.newHire === true || r.p.onLeave === true || r.p.onBench === true || r.p.isIntern === true) return null;   // ineligible → last
      var w = aggWeeks_(r.p, ROSTER_ISOS_);
      return w && w.avail > 0 ? Math.max(0, w.avail - w.tracked) : null;
    }
    var sa = availH(a), sb = availH(b);
    return (sb === null ? -1 : sb) - (sa === null ? -1 : sa);
  } },
  // PLAN — only on an unfinished window (user request 2026-08-06: "confirm
  // planning"). Deliberately conditional rather than always-on: over a closed
  // period the column would show a plan nobody can change any more, which is
  // history dressed as an action. Sorts LEAST-COVERED FIRST, because the whole
  // reason to open a forward week is to find the people with nothing on them.
  plan:   { label: "Plan", when: function () { return ROSTER_PHASE_ !== "done"; },
    sort: function (a, b) {
      function cov(r) {
        var s = planFor1_(r.p, ROSTER_ISOS_);
        return s.cap > 0 ? s.planned / s.cap : null;    // no capacity → last
      }
      var ca = cov(a), cb = cov(b);
      if (ca === null && cb === null) return 0;
      if (ca === null) return 1;
      if (cb === null) return -1;
      return ca - cb;
    } },
};
// Signal columns share one sorter: worst grade first, most missing first.
Object.keys(ROSTER_COLS_).forEach(function (k) {
  var c = ROSTER_COLS_[k];

           (b.sig[c.sig].miss - a.sig[c.sig].miss);
  };
});

function sigChipsHtml_(rows) {

    return '<button class="chip sigChip' + (on ? " on" : "") + (n ? "" : " off") + '"' +
      (n ? ' onclick="setSigFilter_(\'' + f.k + '\')"' : " disabled") +
      ' title="' + esc_(f.tip) + (n ? " Click to show only these." : " None in this slice.") + '">' +
      f.dot + esc_(f.label) + " " + n + "</button>";
  }).join("");
  var total = rows.length;
  return '<div class="sigChips">' +
    '<button class="chip sigChip' + (STATE.sigFilter ? "" : " on") + '"' +
      ' onclick="setSigFilter_(\'\')" title="Every person in this slice.">All ' + total + "</button>" +
    chips + "</div>";
}

function setRosterSort_(col) {
  // A column with no sorter (hours had none until Task 6 filled it in) is
  // click-inert rather than a crash: rows.sort(null) throws a TypeError, and
  // that rule has to hold for ANY future sorter-less column, not just the one
  // that used to be true of today (review finding 2026-08-05).
  if (!ROSTER_COLS_[col] || !ROSTER_COLS_[col].sort) return;
  if (STATE.rosterSort === col) STATE.rosterDesc = !STATE.rosterDesc;
  else { STATE.rosterSort = col; STATE.rosterDesc = false; }
  renderRoster_();
}

/** One signal cell: dot + % together (FR-4.4 — colour never carries the verdict
    alone), plus the miss count when there is one. "na" = nothing to grade.
    g.pct === null (the Overall column's synthetic grade) renders the dot with
    no percentage — `null * 100` JS-coerces to 0, and a fabricated "0%" would
    read as a real measurement, exactly the misleading-signal class this
    dashboard exists to stamp out (review finding 2026-08-05). */
function sigCellHtml_(g) {
  if (g.cls === "na") return '<td class="tnum">—</td>';
  var pct = g.pct === null ? "" : " " + Math.round(g.pct * 100) + "%";
  var body = g.cls === "small"
    ? '<span class="sigDot sigSmall" title="Fewer than ' + signalMinN_() +
      ' issues — shown ungraded: one missing field on one ticket is not a signal (SIGNAL_MIN_N).">●</span>' + pct
    : g.cls === "learn"
    ? '<span class="sigDot sigLearn" title="Intern (level I1) — the number is shown so they can see ' +
      'the standard and learn it; it is deliberately not graded and moves no published rate.">●</span>' + pct
    : '<span class="sigDot sig' + g.cls.charAt(0).toUpperCase() + g.cls.slice(1) + '">●</span>' + pct;
  return '<td class="tnum">' + body +
    (g.miss ? ' <span class="cellSub">· ' + g.miss + " missing</span>" : "") + "</td>";
}

/** Every active person in the current population, RAG-graded on the same
    fields and gates as the 🧬 matrix. Population + sort both follow shared
    STATE, so the Open/Resolved chips on the matrix drive this table too. */
/**
 * The roster columns actually on screen, in order.
 *
 * ONE list, because three places need the same answer: the header, each row, and
 * the drill-down cell's colspan. They were computed separately, and the
 * drill-down used `Object.keys(ROSTER_COLS_).length` — the count of ALL columns,
 * including the conditional Plan column that `when()` hides. A colspan wider
 * than the table makes the browser extend that cell PAST the right edge, which
 * is what pushed the drill-down's Due column out of the table and over the row
 * beneath it (user screenshot 2026-08-11).
 */
function rosterColKeys_() {
  return Object.keys(ROSTER_COLS_).filter(function (k) {
    var c = ROSTER_COLS_[k];
    return !c.when || c.when();
  });
}

/**
 * ── "HOW THESE ARE COUNTED" (user 2026-08-17) ───────────────────────────────
 *
 * The roster used to open with a block of methodology: denominators, the two
 * rules that differ, the epic exception. All of it true, and all of it pushing
 * the actionable table below the fold on every single visit. A reader needs it
 * once; they meet it every time.
 *
 * It moves behind one link in the section header. The rules are BUILT FROM
 * SIGNAL_FIELDS_ rather than re-typed, so a column and its rulebook entry can
 * never drift — which is exactly what a second hand-written copy would do.
 */
function methodPanelHtml_() {
  // Only the fields that still paint a column (2026-08-28): Billable tag and
  // Start date are computed and exported but no longer on the table, and a
  // rulebook entry for an absent column reads as a bug.
  var SHOWN_ = ["due", "est", "logged", "link"];
  var rules = SIGNAL_FIELDS_.filter(function (f) { return SHOWN_.indexOf(f.k) !== -1; })
    .map(function (f) {
    return "<li><b>" + esc_(f.label) + "</b> — " + esc_(f.rule || f.tip) + "</li>";
  }).join("");
  return '<div class="methodOverlay" id="methodModal" hidden onclick="closeMethod_(event)">' +
    '<div class="methodBox" role="dialog" aria-modal="true" aria-label="How these columns are counted">' +
      '<div class="methodHead"><b>How these columns are counted</b>' +
        '<button class="btn" onclick="closeMethod_()" title="Close">Close</button></div>' +
      '<div class="methodBody">' +
        "<p><b>Backlog of the week</b> is a count, not a grade: every open ticket attributed " +
        "to this person, <b>epics included</b>, as a snapshot that follows the filters but not " +
        "the period picker. Items past their committed week are flagged ⚑ overdue in the " +
        "cell. Expand a row to see it broken down.</p>" +
        "<p><b>Due date</b> and <b>Logged</b> deliberately divide by less than that count " +
        "(managers' feedback 2026-08-10). An undated To Do ticket is ignored entirely — " +
        "not delayed, not missing — while <b>anything with a date is tracked whatever its " +
        "status</b>. Epics are the exception and are audited separately below: every epic is " +
        "expected to carry a date, To Do included.</p>" +
        "<p>The <b>Overall</b> column left the table (2026-08-28), but the grade behind it " +
        "still drives the Need action / Watch chips above and the default sort: worst grade " +
        "across the columns that gate a published metric.</p>" +
        "<p>Each cell is the share of that person's issues carrying the field, graded against " +
        "<b>the field's own gate</b> — read from the metric registry, so an admin gate " +
        "override reaches this table exactly as it reaches the KPI cards. Grey means fewer " +
        "than " + signalMinN_() + " issues: shown, never graded. Click any header to sort; " +
        "the default is biggest opportunity first.</p>" +
        "<p><b>Available</b> — scheduled capacity minus tracked time for the period: the " +
        "hours a manager could still assign work against. Interns are shown and never " +
        "graded; ramping new hires and people on leave show their context instead of a " +
        "figure — their spare capacity is not assignable room.</p>" +
        "<ul>" + rules + "</ul>" +
      "</div></div></div>";
