       The rule that makes this safe: a hidden filter is never a silent one.
       The toggle counts how many drawer filters are off their default, and
       renderAdvToggle_ FORCES the drawer open whenever that count is non-zero.
       A number scoped by a control the reader cannot see is the one outcome
       worse than a crowded filter bar. -->
  <div class="hrow">
    <div class="fgroup" id="periodGroup" title="Aggregation period — months are calendar, quarters are fiscal (FY starts Jul 1, named for its end year)">
      <span class="flbl">Period</span><div class="chips seg" id="periodChips"></div>
    </div>
    <div class="fgroup" title="Region — universal: scopes the KPI tiles and the grid.">
      <span class="flbl">Region</span><div class="chips seg" id="regionChips"></div>
    </div>
    <!-- Team / PM / Job family are MULTISELECTS (user 2026-08-28): pick any
         combination and the slice is the union — comfortable filtering beats a
         single-value dropdown that forces one slice at a time. Rendered by
         fillMulti_ into these containers; the ids survive from the old selects
         so deep links and tests keep their addresses. -->
    <div class="ms" id="teamSel" title="Team filter — universal: scopes the KPI tiles and the grid. Pick several teams to see their union."></div>
    <input type="search" id="personSearch" placeholder="Find person…">
    <button class="btn" id="btnAdvFilters" aria-expanded="false" aria-controls="advFilters"
            title="Population, Role, PM and Job family. Kept out of the default view to leave three dimensions in the bar; opens automatically whenever any of them is set, so a filter can never be applied out of sight.">More filters</button>
    <!-- Reset sits WITH the filters it clears (user 2026-09-09) — it used to
         live in the title row beside Refresh/Dark, a row about the page, not
         about the slice. Same id, same handler (resetFilters_). -->
    <button class="btn" id="btnReset" title="Back to the default view — clears every filter, the person search, the period selection and all expanded rows">Reset</button>
    <span id="filterWarn" class="cellSub" style="color:var(--amber)"></span>
  </div>
  <div class="hrow fadv" id="advFilters" hidden>
    <div class="fgroup" title="Population — FTEs are the primary focus (default); Crew shows contractors only; All combines them. Scopes the capacity tiles, the grid and the roster. On-Time Delivery and Forecast Accuracy count ITEMS, not people, so this lens does not narrow them.">
      <span class="flbl">People</span><div class="chips seg" id="popChips"></div>
    </div>
    <div class="fgroup" title="Role — split managers (M-level job codes) from individual contributors. Managers often plan without tracking much, which drags delivery rates; the IC view removes that effect. Scopes the capacity tiles, the grid and the roster. On-Time Delivery and Forecast Accuracy count ITEMS, not people, so this lens does not narrow them.">
      <span class="flbl">Role</span><div class="chips seg" id="roleChips"></div>
    </div>
    <!-- The "Focus" group (Plan / Billable / Non-bill) was DELETED 2026-08-17.
         It was a control that moved nothing: the People grid it used to drive was
         removed on 2026-08-05, and from then on STATE.focus was read by its own
         chips and by the scope-chip label — and by nothing else. A filter that
         only changes its own highlight teaches the reader that filters here do
         not work. Same finding, same fix as the Headroom tab's metric buttons.

         ⚠ Its closing </div> was left behind by that deletion and closed
         #advFilters six lines early, so PM and Job family sat OUTSIDE the
         drawer — permanently visible, never hidden by the toggle — and .hdr
         closed a level early with them. Removed 2026-08-17. -->
    <div class="ms" id="pmSel" title="Worked with PM — universal: scopes the KPI tiles and the grid. Selects PEOPLE with planned or tracked hours on any project this PM leads (Tempo PM field); membership-based like Teams, and multiselect — several PMs give the union. NOT the same as the Project Managers tab, which reports the TICKETS a PM owns — this control sits above the tabs and stays visible there, so the two are deliberately named apart."></div>
    <div class="ms" id="famSel" title="Job-family filter — universal: scopes the KPI tiles and the grid. Multiselect — several families give the union. Options cover the tracking-mandated population (JF007 Managed Services &amp; Support, JF009 Service Delivery, uncatalogued/crew); non-tracking families are not in this dashboard at all."></div>
  </div>
</div>

<div id="loading" class="loading">Loading delivery health…</div>

<div id="app" style="display:none">
  <!-- Live scope chip: states exactly WHAT slice is on screen. Above the panes,
       because the filter row scopes every view (never per-chart filters). -->
  <div class="sub" id="scopeChip" style="margin:-6px 0 12px;color:var(--muted);font-size:11px;cursor:help"
    title="Every filter is universal — it scopes the KPI cards, the charts and the grid together. On-Time and Forecast issues join to people via the Jira Assignee, so population/role/PM/family/search apply to them too; items without a roster assignee are excluded (count in the card tooltip). Team and PM rates are membership-based, so slices don't sum to All; a PM slice shows the whole week of everyone on that PM's projects."></div>

  <!-- ── EXECUTIVE — a three-tier hierarchy (redesign 2026-08-17) ─────────────
       TIER 1 the protagonist KPIs, TIER 2 the context that explains them,
       TIER 3 background. The ordering is the whole point of the tab: an
       executive should reach a verdict before meeting a single caveat, so the
       delivery-outcome numbers land first and everything that qualifies them
       — the narrative, the backlog shape, capacity — sits underneath.

       Moved OFF this tab in the same pass: the "Can we publish these numbers?"
       data-quality strip, now first on Actions, where the queue that fixes each
       gap already lives. Deleted: "Not measured this week" and the
       Workforce-change card.

       The breakdown panel STAYS and ships on. It spent a phase behind a
       SHOW_COMPARE_PANEL_ flag, which was a mistake worth recording: the panel
       charts whichever metric is selected and defaults to On-Time Delivery, so
       switching it off to suppress a financial metric removed the org's only
       breakdown of on-time performance along with it. The financial lens is
       withheld at liveMetrics_ (SHOW_UTILIZATION_) instead — the metric goes,
       the breakdown stays. The flag itself is gone. -->
  <!-- ══ EXECUTIVE — a SMART SPLIT across two in-page sub-tabs (2026-08-17) ══
       One endlessly-scrolling page served two audiences badly. A director
       wanting "are we on target, and who do I call" had to scroll past the
       backlog story to reach the actions; an auditor wanting the pipeline had
       to wade through KPI cards to reach the queue.

       So the pane splits, and the split follows the QUESTION being asked:
         HEALTH & ACTIONS  are we on target, where isn't it, who can act
         BACKLOG & FLOW    is the pipeline healthy, and how far does it cover

       In-page sub-tabs rather than two sidebar entries: both halves answer to
       the same global filters and the same period, and a reader moving between
       them is changing lens, not location. Splitting them in the rail would say
       they are different places and invite the filters to drift apart. -->
  <div id="viewExec" class="viewPane">
    <div class="subtabs" id="execTabs" role="tablist" aria-label="Executive views"></div>

    <!-- ══ SUB-TAB 1 · HEALTH & ACTIONS ═══════════════════════════════════════
         The 10-second read, then the route to act. Nothing between the numbers
         and the drill-down: no prose block, no colour key, no chart restating
         a table. Everything removed from here is still in Backlog & Flow. -->
    <div id="execHealth">
      <section class="tier tier1">
        <div class="tierHead">Delivery health
          <span class="tierNote">the outcome numbers this org is run on</span>
          <span style="flex:1"></span>
          <button class="iconbtn" onclick="savePng_('tier1Tiles','kpis')" title="Save the KPI cards as a PNG image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
        </div>
        <div class="tiles tier1" id="tier1Tiles"></div>
      </section>

      <!-- THE DRILL-DOWN, PULLED UP to sit directly under the KPIs. Its value
           cells open the items behind each number in place (drillItems_,
           2026-09-09); the header buttons that used to navigate away are gone. -->
      <section class="tier tier3">
        <div class="panel" id="comparePanel"></div>
      </section>
    </div>

    <!-- ══ SUB-TAB 2 · BACKLOG & FLOW ═════════════════════════════════════════
         The queue shape, then the flow cards, then capacity.

         THE PIPELINE MASTHEAD IS GONE (user decision 2026-08-28): the three
         stat callouts (Delivery pace · Total runway · Groomed pipeline) and the
         week/headcount lede were removed as MISLEADING — a whole-queue runway
         figure reads as a forecast, and pace over a queue that is mostly
         unowned pipeline is not a delivery promise. The Runway KPI cards
         (Inventory · Net flow · Weeks to clear and their Assigned twins) left
         in the same pass, for the same reason. -->
    <div id="execFlow" hidden>
      <section class="tier tier2">
        <div class="tierHead">Backlog &amp; Flow
          <span class="tierNote">the queue shape, and how work arrives and clears</span>
        </div>
        <!-- CAPACITY BAND — the idle-hours signal is the most actionable read
             on this tab and must not sit below the fold — stated as hours LEFT
             on the table in the named finished week, never as hours still
             recoverable from it.
             Planned Coverage (forward windows) plus the people-signals pulse;
             both share the SAME margin gate, so the whole band is omitted from
             the DOM together for a non-margin role. -->
        <div class="panel" id="pulsePanel" style="margin-bottom:14px"></div>
        <!-- §2 BACKLOG BAND — the Active / Planned / Runway bar and its legend. -->
        <div class="panel" id="backlogBand" style="margin-bottom:14px"></div>
        <!-- FLOW CARDS, clustered by the question they answer. The colour key
             that sat below this strip is DELETED (director feedback 2026-08-17):
             these are mostly ungraded volume metrics, and every graded card
             already carries its own ✔/▲/✖ glyph and value label (FR-4.4). -->
        <div class="panel" id="flowSecondary" style="margin-bottom:14px"></div>
      </section>
      <!-- DATA TRUST DETAIL — super-admin only (canSeeSuper_ / MODEL.viewerSuper).
           Provenance detail is a build-integrity read, not an executive one. -->
      <section class="tier tier3">
        <div class="panel" id="trustDetail"></div>
      </section>
    </div>
  </div>

  <!-- ── ACTIONS — everything person- and field-level (spec 2026-08-05 §5).
       Admin + viewer only (inherits the old Headroom gate). Reading order:
       data-quality gates → people signals roster → gaps queue. (The 🧬 by-type
       matrix sat between the last two until 2026-08-17; per-parameter
       compliance is read per PERSON on the roster now.)
       The standalone "Where the headroom is" table was retired 2026-08-05: the
       roster covers the same people with the same exclusions, and its
       recoverable-hours figure lives on in the Executive pulse. ── -->
  <div id="viewActions" class="viewPane" style="display:none">
    <div style="text-align:right;margin-bottom:6px">
      <button class="iconbtn" onclick="saveCsv_()" title="Download the signals roster (one row per person: signal values, offending counts, hours split) as CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>
      <button class="iconbtn" onclick="savePng_('viewActions','actions')" title="Save this view as a PNG image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
    </div>
    <!-- The "Can we publish these numbers?" data-trust strip was REMOVED
         2026-08-28 (user decision): the signals roster below grades the same
         gates per person, and the super-admin trust detail on Backlog & Flow
         remains the provenance surface. -->
    <div class="panel" id="rosterPanel"></div>
    <!-- 🌊 Backlog health (2026-08-06). Sits between the roster and the 🧬 matrix
         on purpose: the roster says WHO, this says WHAT STATE the work they carry
         is in, and the matrix says WHICH FIELD is missing. Actions rather than
         Executive because every row is a queue with an owner — the same reason
         the gaps queue lives here and not on the 30-second read. -->
    <div class="panel" id="backlogPanel" style="margin-top:14px"></div>
    <!-- 🚩 Epics without a due date (team agreement 2026-08-10). Directly above
         the 🧬 matrix because it is the same question at a different bar: the
         matrix GRADES due-date fill against a coverage gate, this one AUDITS a
         ratified 100% rule and names the tickets. Gon + the PMs own the queue. -->
    <div class="panel" id="epicDuePanel" style="margin-top:14px"></div>
    <div class="panel" id="hygPanel" style="margin-top:14px"></div>
  </div>

  <!-- ── 🧭 WORKFORCE HEALTH (spec v1.1, 2026-08-10) ────────────────────────
       Panel order is load-bearing (§6.1): the first thing on screen sets what
       the room argues about. Scope before numbers, pools before the summary,
       and the honest consumers-only denominator before anybody asks for "the"
       availability figure. ── -->
  <div id="viewWorkforce" class="viewPane" style="display:none">
    <!-- METHODOLOGY DRAWER (user 2026-08-17). Every panel on this tab carried a
         three-to-five line paragraph explaining the data model, and together
         they were most of the page. An executive assumes the data is correct;
         the auditor who needs to know how sellable headroom is derived can open
         this. Nothing was deleted — it moved. -->
    <div id="wfMethod" class="wfDrawer" role="dialog" aria-modal="false"
         aria-label="How the Workforce figures are measured" hidden>
      <div class="wfDrawerHead">
        <b>How this is measured</b>
        <button class="iconbtn" onclick="toggleWfMethod_(false)" aria-label="Close">✕</button>
      </div>
      <div class="wfDrawerBody" id="wfMethodBody"></div>
    </div>
    <div style="text-align:right;margin-bottom:6px">
      <button class="iconbtn" onclick="toggleWfMethod_(true)"
              title="How these figures are built: denominators, what each column means, and what the numbers deliberately do not claim.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Methodology</button>
      <button class="iconbtn" onclick="saveWorkforceCsv_()" title="Download the pool grid (one row per pool × band, every measure and its action state) as CSV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>CSV</button>
      <button class="iconbtn" onclick="savePng_('viewWorkforce','workforce')" title="Save this view as a PNG image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>PNG</button>
    </div>
    <!-- ORDER REVISED 2026-08-17. The headline figure was sitting BELOW the pool
         grid, so the tab opened on a 40-row table and the one number an
         executive came for arrived halfway down. Reading order is now: the
         figure, then anything demanding action, then the detail behind both.

         1 · Sellable headroom — the figure, first thing on the tab. -->
    <div class="panel" id="wfConsumersPanel" style="margin-bottom:14px"></div>
    <!-- 2 · Unrouted backlog — an ALERT, not a table row, and only when there
         is something to route. Sits second because it is the only thing on
         this tab with a queue behind it somebody can work. -->
    <div id="wfAlertPanel"></div>
    <!-- 3 · Scope banner — population, unclassified (even at zero), drift. -->
    <div class="panel" id="wfScopePanel" style="margin-bottom:14px"></div>
    <!-- 4 · Pool grid — the main table, one row per pool × band. -->
    <div class="panel" id="wfGridPanel" style="margin-bottom:14px"></div>
    <!-- 5 · Shadow breakdown — stacked by reason, each with its owner. -->
    <div class="panel" id="wfShadowPanel" style="margin-bottom:14px"></div>
    <!-- 6 · Backlog by pool — the routing table the alert above summarises. -->
    <div class="panel" id="wfUnroutedPanel" style="margin-bottom:14px"></div>
    <!-- The "By discipline" mapping table was REMOVED 2026-08-17: it mapped job
         codes to pools, which is configuration, not delivery health. Nothing on
         it changed week to week, so it cost a screen and answered no question a
         director had. renderWfDisciplines_ went with it. -->
  </div>

  <!-- 🗓 PM-owned work — one row per PM, two bars that are never averaged. -->
  <div id="viewPm" class="viewPane" style="display:none">
    <div class="panel" id="pmPanel"></div>
  </div>

  <!-- ✎ Changes — admin only, gated in switchView_ like Access. -->
  <div id="viewChanges" class="viewPane panel" style="display:none"></div>

  <!-- Access Control — admin only, gated in switchView_ as well as in the tab bar. -->
  <div id="viewAccess" class="viewPane panel" style="display:none"></div>

<script>
var MODEL = null;
// Count-up on the hero tiles runs ONCE per page load (Motion, spec §7) — set
// the instant it fires, never reset, so a later filter/sort re-render can't
// retrigger it.
var countedUp_ = false;
// period: "month" (default per user decision 2026-07-31) | "week" | "quarter"
// pop: population lens — "fte" (default: FTEs are the primary focus) | "crew" | "all"
// (hygIdx removed 2026-08-04 — the Data Hygiene window follows the global
// analysis-period picker like every other surface.)
// view:    which tab is open — see VIEWS below.
// flag:    triage filter driven by clicking the attention legend ("" = off).
// metric:  which metric the Trends view charts.
// compare: which dimension the Executive comparison chart breaks down by.
// team / pm / family are ARRAYS since 2026-08-28 (multiselect, user request):
// empty = no filter, several values = the union. Region stays a single chip.
var STATE = { period: "month", pop: "fte", role: "all", region: "", team: [], pm: [], family: [], search: "", expandedWeeks: {}, openDetail: {},
              // msOpen: which multiselect panel is open ("" = none) — single-open
              // like the PS dashboard's filter panels; Esc and outside clicks close.
              msOpen: "",
              // wfOpenCell: which 🧭 pool × band cells have their person list open
              // ("who has available hours", Billy 2026-08-10). Keyed by the cell's
              // own `pool|band` id, the same key the payload uses.
              wfOpenCell: {},
              // openDetailAll: which OPEN roster detail rows are showing every
              // carried backlog item rather than the first few (2026-08-10).
              // Separate from openDetail so the second level cannot survive a
              // collapse — see toggleRosterDetail_.
              openDetailAll: {},
              // 🗓 PM tab, two independent levels of collapse (user feedback
              // 2026-08-11). Separate maps rather than one nested object so the
              // epic level cannot outlive its PM: collapsing a PM leaves its
              // epic keys in pmEpicOpen, and re-opening the PM restores exactly
              // the epics that reader had open — which is the behaviour people
              // expect from a drill-down they are working through.
              pmOpen: {}, pmEpicOpen: {},
              view: "exec", flag: "", metric: "onTime", compare: "region", compareAll: false,
              // Which half of the Executive pane is on screen. Health first: it is
              // the 10-second read, and the pipeline is what you open when that
              // read raises a question.
              execTab: "health",
              // level: set only by drilling the Tier-3 breakdown chart — there is no
              // header control for it, so the scope chip is where a reader sees it.
              level: "",
              // rosterSort/rosterDesc: 👥 signals roster sort (spec §5.2). Default
              // is biggest opportunity first — most-red overall, then most
              // offending records — because the Executive pulse deep-links here
              // with this sort already applied.
              rosterSort: "opp", rosterDesc: false,
              // sigFilter: which signal verdict the 👥 roster is narrowed to
              // ("" = all). Set by the roster's own chips AND by clicking a
              // count on the Executive pulse, which is the whole point — the
              // pulse says "3 need action" and the click lands on those 3.
              sigFilter: "",

              // the 🧬 by-type matrix that used to own the toggle (removed
              // 2026-08-17); the roster inherited the chips and is now its only
              // consumer. OPEN is the default because it is the half anyone can
              // act on — fixing a resolved ticket's due date changes history,
              // not the next report.
              typePop: "open",

              // an index into donePeriods_(), or null for the latest (user
              // request 2026-08-04: the reader picks the month/quarter).
              periodIdx: null };
var PERIOD_LABELS = { week: "Week", month: "Month", quarter: "Quarter" };

/**
 * ── VIEWS: the single source of truth for navigation ─────────────────────────
 * Label, pane id and role gate are declared once; the tab bar, switchView_ and
 * renderAll_'s dispatch all derive from this array. Same pattern as the PS
 * dashboard's VIEWS — adding a tab must never mean editing four places.
 *
 * Why tabs at all: everything used to stack into one scroll, so a manager
 * looking for "who needs me this week" waded through executive KPIs, and an
 * executive looking for "are we on target" waded through a 200-row roster.
 * One view answers one question.
 */
// LABELS CARRY NO EMOJI (redesign 2026-08-17). The dashboard is a strict
// enterprise data tool, and a picture-glyph in a nav label is decoration that
// also reads aloud as one to a screen reader. Each entry keeps a `dot` — a
// small geometric mark drawn beside the label, aria-hidden in buildTabs_, so
// the rail still has a scannable left column when it is collapsed to icons.
var VIEWS = [
  { id: "exec",    label: "Executive", dot: "◆", pane: "viewExec",    roles: null,
    hint: "The protagonist KPIs, the backlog story and the people-signals pulse — the 30-second read." },
  // "Actions", not "Accountability" (review 2026-08-05): the matrix and gaps
  // queue are about fields and requirements, not people — a people-blame
  // banner over them framed the whole tab wrong.
  { id: "actions", label: "Actions", dot: "▲", pane: "viewActions", roles: ["admin", "viewer"],
    hint: "Who and what needs action: the data-quality gates, the compliance signals roster and the gaps queue." },
  // Project Managers — the epics a PM OWNS, attributed by Jira assignee then
  // project lead (spec 2026-08-11). Sits NEXT TO ACTIONS (user 2026-08-11)
  // because it answers the same question at a different grain: Actions is "who
  // needs action", this is "which committed work needs action". Distinct from
  // the "Worked with PM" filter above the tabs, which selects PEOPLE who worked
  // for a PM.
  //
  // Spelled out in full from 2026-08-17 (user): "PM" beside "Actions" and
  // "Workforce" read as an abbreviation of something, and the one group whose
  // work this tab is about is the one group that should not have to decode its
  // own tab. `id` stays "pm" — it is the STATE key, the pane suffix and what a
  // bookmarked deep link carries.
  { id: "pm", label: "Project Managers", dot: "■", pane: "viewPm", roles: ["admin", "viewer"],
    hint: "Epics in flight per PM: due-date fill against the team's 100% bar, and whether their own children are scheduled past them." },
  // Workforce — capacity read by DEPLOYMENT POOL, never blended. Gated to
  // admin + viewer like Actions: the grid carries per-pool capacity, headroom
  // and backlog cover, which is the same margin tier as the utilization detail.
  { id: "workforce", label: "Workforce", dot: "●", pane: "viewWorkforce", roles: ["admin", "viewer"],
    hint: "Capacity by pool and level band: headroom, plan-vs-logged, work outside the plan and backlog cover — signals, not verdicts, because capacity is not fungible." },
  // ✎ Changes — the change register, admins only (user 2026-09-09): what was
  // asked, what was done, and whether it is solved, under review or to do.
  // Sits before Access: it is about the product, Access is about the door.
  { id: "changes", label: "Changes", dot: "◈", pane: "viewChanges", roles: ["admin"],
    hint: "Every impactful change request in plain English, with its status — solved, under review or to do." },
  { id: "access",  label: "Access", dot: "◇", pane: "viewAccess",  roles: ["admin"],
    hint: "Manage who can open this dashboard." },
];

function viewDef_(id) {
  for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i].id === id) return VIEWS[i];
  return VIEWS[0];
}

/**
 * ── MARGIN TIER ──
 * The Metrics Dictionary limits utilization and forecast-variance detail to
 * "directs and above". Admins and named viewers are that audience; an
 * open-access guest (the demo / all-hands switch) is not.
 *
 * HIDDEN, NOT DIMMED. A dimmed number is still a number on a projector, and
 * "greyed out" invites someone to ask what it says. Out-of-tier cards are not
 * rendered at all, the metric is removed from every chip strip and comparison
 * chart, and the Actions tab — whose roster carries per-person hours — is
 * gated in VIEWS like Access is.
 *
 * Server-side twin: dhMarginTier_() in Security.js. Change one, change both.
 */
// planCov joins the margin tier because it publishes the same capacity hours
// utilization does — a coverage percentage is a capacity disclosure read a
// different way, and the Dictionary's audience rule is about the data, not the
// arithmetic on top of it.
// avail is margin-tier like util — it publishes the same scheduled-capacity
// hours. Kept here even though it is not currently a selectable metric, so it
// arrives gated the day it becomes one.
var MARGIN_METRICS_ = { util: 1, forecast: 1, planCov: 1, avail: 1 };
function canSeeMargin_() {
  var r = (MODEL && MODEL.viewerRole) || "";
  return r === "admin" || r === "viewer";
}

/**
 * ── SUPER-ADMIN TIER ──
 * A tier ABOVE admin, for build-integrity surfaces (the Tier-3 data-trust
 * detail). Only the bootstrap admin qualifies — the one account that cannot be
 * removed through the Access UI.
 *
 * The DECISION is the server's: Security.js resolves the session email against
 * SEC_DH.BOOTSTRAP_ADMIN and ships a boolean. The client never sees the
 * bootstrap address and never compares emails itself, so the rule cannot be
 * inspected or spoofed from the page. Server-side twin: dhSuperAdmin_().
 *
 * Strict === true: a payload built before this field existed leaves it
 * undefined, and an undefined must resolve to "not a super-admin" rather than
 * to a truthy accident.
 */
function canSeeSuper_() {
  return !!(MODEL && MODEL.viewerSuper === true);
}

/**
 * ── 👁 CONFIDENTIAL VIEW ─────────────────────────────────────────────────────
 *
 * It BLURS PEOPLE. Names and job titles go illegible; every KPI, chart, tab and
 * number stays exactly where it was. The dashboard is built to be shown — in an
 * all-hands, on a call, over a shoulder — and the thing that cannot be shown is
 * not the delivery rate, it is which named person is behind the red cell.
 *
 * ⚠ THE FIRST CUT OF THIS GOT IT BACKWARDS and the mistake is worth recording,
 * because it is an easy one to make again: it hid the margin metrics and every
 * role-gated tab, which removed the analysis and kept the names. That is the
 * opposite trade. A presenter needs the numbers on screen — they are what the
 * meeting is about — and needs the individuals off it.
 *
 * SO THIS TOUCHES PRESENTATION ONLY. It does not read or change roles, it does
 * not gate a view, and it removes nothing from the payload. `canSeeMargin_` and
 * `canSeeSuper_` are untouched by it and keep reading role alone, because they
 * are the client twins of dhMarginTier_ / dhSuperAdmin_ in Security.js. This
 * switch is a lens over what is drawn; those are the gate over what is sent.
 *
 * WHAT IT CANNOT DO, stated plainly: the names are still in the DOM, in the
 * page source and in a CSV export. Anyone with devtools can read them. That is
 * the correct scope — the threat this answers is a projector and a screen
 * share, not an attacker with the page open. It is a courtesy to the people on
 * the roster, not a security control, and the banner says so rather than
 * implying a protection it does not provide.
 *
 * PERSISTED, and deliberately LOUD about it. It survives a reload because
 * presenting is a session, not a click; but a page that silently blurs half its
 * roster on Monday morning is a support ticket, so the header states the mode in
 * words beside the icon and the Executive tab carries a banner while it is on.
 */
var CONF_KEY_ = "dhConfidential";
var CONF_HIDDEN_ = false;

/** localStorage, guarded: HtmlService sandboxes can throw on access and the
    render-smoke stub is minimal. Neither is a reason to fail — both degrade to
    "not hidden, not persisted", which is the safe direction for a control whose
    ON state removes content. */
function confLoad_() {
  try { CONF_HIDDEN_ = localStorage.getItem(CONF_KEY_) === "1"; }
  catch (e) { CONF_HIDDEN_ = false; }
  // ⚠ The class MUST be applied here too, not only in setConfidential_. Without
  // it a reload with the mode saved restores the flag and leaves the names
  // legible until somebody toggles — which is the one moment this feature is
  // supposed to cover and the one nobody would think to test by hand.
  confApplyClass_();
  return CONF_HIDDEN_;
}

/** Mirrors the flag onto <body>, which is what the blur selector keys off.
    Guarded: the render-smoke DOM stub has no classList, and an HtmlService
    sandbox can hand back an odd body — neither is a reason to fail. */
function confApplyClass_() {
  try {
    var b = document.body;
    if (!b) return;
    if (b.classList) b.classList[CONF_HIDDEN_ ? "add" : "remove"]("confOn");
    else b.className = String(b.className || "").replace(/ ?confOn/, "") +

  } catch (e) { /* no body in the harness */ }
}
function confHidden_() { return CONF_HIDDEN_ === true; }

/** Does this viewer ever see a person's name? A guest reaches no tab that
    names anybody, so the control is not offered to them — an eye that blurs
    nothing is a promise the page cannot keep. */
function confEligible_() { return canSeeMargin_(); }

/** Wraps a person's name or job title so the confidential switch can blur it.
    ⚠ ESCAPES ITS OWN INPUT: every call site passes a RAW roster string, so this
    is the escape boundary — a second esc_ outside would double-encode, and none
    would put sheet-derived text straight into innerHTML.
    @param {string} txt the name or title, unescaped
    @param {string=} cls extra classes for the span */
function piiHtml_(txt, cls) {
  return '<span class="pii' + (cls ? " " + cls : "") + '">' + esc_(txt) + "</span>";
}

/** A ` title="…"` attribute carrying personal detail — EMPTY while names are
    blurred, because a CSS blur cannot reach a native tooltip and hovering a row
    is exactly what a presenter does while talking over it. Outside the mode the
    tooltip is restored in full: the roster truncates job titles to fit a column,
    and losing the hover permanently to protect a mode that is occasionally on
    would be paying every day for an occasional need.
    @param {string} txt raw text; escaped here, as piiHtml_ escapes its own. */
function piiTitleAttr_(txt) {
  return confHidden_() || !txt ? "" : ' title="' + esc_(txt) + '"';
}

function setConfidential_(on) {
  CONF_HIDDEN_ = !!on;
  try { localStorage.setItem(CONF_KEY_, CONF_HIDDEN_ ? "1" : "0"); } catch (e) { /* not persisted */ }
  // A class on <body>, not a re-render of every panel: the blur is a CSS state
  // over markup that is already correct, so toggling costs one class change and
  // cannot get out of step with what is on screen. Shared with confLoad_ so a
  // restored session and a click take the same path.
  confApplyClass_();
  renderConfBtn_();
  renderAll_();
}

function toggleConfidential_() { setConfidential_(!confHidden_()); }

/** The header control. Two icons, because an eye and a struck-through eye are

function confBtnHtml_() {

      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/></svg>';

    'aria-pressed="' + (on ? "true" : "false") + '" ' +
    'title="' + esc_(on
      ? "Names and job titles are blurred. Every number, chart and tab is unchanged. " +
        "Click to show the names again."
      : "Blur names and job titles before you share your screen. Every number, chart and tab " +
        "stays exactly as it is — only the people are anonymised.") +
    '">' + eye + "<span>" + (on ? "Names blurred" : "Blur names") + "</span></button>";
