  // The confidential switch is restored at the same point and for the same
  // reason: it must be settled BEFORE the first paint, or a cold start would
  // show confidential content to somebody who left the page hidden. The button
  // itself is drawn later by renderAll_, which needs MODEL to know whether this
  // viewer has anything to hide.
  confLoad_();
})();

/** Utilization rollup over a period's weeks (mirrors server utilRollup_).
    Scopes on passesFilters_ — ALL filters are universal (user decision
    2026-07-31, superseded the finding-I2 grid-finder rule): a job-family or
    person selection re-bases the utilization tile too. The payload is already
    tracking-mandated families only. */
function utilFor_(isos) {
  var s = { avail: 0, availCov: 0, billable: 0, tracked: 0, trackedCov: 0, cap: 0, capCov: 0 };
  MODEL.people.forEach(function (p) {
    // Long leave (maternity/paternity/parental/sabbatical) never moves the
    // rate: Tempo capacity can lag HR, so their avail would read as idle time.
    if (p.onLeave) return;
    if (p.onBench) return;   // crew between engagements — hours are not sellable
    // Interns (I1) never move a rate — in training, not delivery capacity
    // (user decision 2026-08-04). Their grid hours stay visible, unlike leave.
    if (p.isIntern) return;
    if (!passesFilters_(p)) return;
    isos.forEach(function (iso) {
      var w = p.weeks[iso];
      if (!w) return;
      s.avail += w.avail; s.billable += w.billable; s.tracked += w.tracked;
      // availCov = availability of NS-CLASSIFIED person-weeks only. Billable %
      // divides by this, never by total avail: an unclassified week has a
      // forced-zero numerator, so leaving its avail in the denominator would
      // report the NS export's lag as a drop in billing (audit 2026-08-03).
      s.availCov += w.availCov || 0; s.trackedCov += w.trackedCov || 0;
      // capCov = GROSS scheduled capacity of NS-classified weeks — the Metrics
      // Dictionary's "headcount × standard hours" denominator, coverage-matched
      // the same way availCov is.
      s.capCov += w.capCov || 0;
      s.cap += w.cap;
    });
  });
  // grossPct is THE rate — the Dictionary's: billable ÷ gross scheduled
  // capacity (headcount × standard hours). No absenteeism is modelled (user
  // decision 2026-08-04), so avail === cap and billablePct is numerically the
  // same gross rate (the field survives for the shared accessors/tests).
  // trackedPct/grossTrackedPct are the fallback readings when NetSuite is
  // classifying nothing and no billable claim can be made.
  s.grossPct = s.capCov > 0 ? s.billable / s.capCov * 100 : null;
  s.billablePct = s.availCov > 0 ? s.billable / s.availCov * 100 : null;
  s.trackedPct = s.avail > 0 ? s.tracked / s.avail * 100 : null;
  s.grossTrackedPct = s.cap > 0 ? s.tracked / s.cap * 100 : null;
  return s;
}

/**
 * PLANNED COVERAGE over a window — the forward twin of utilFor_.
 *
 * Planned hours ÷ scheduled capacity, over the same population utilFor_ uses
 * (long leave and interns out: neither owes a plan). This is the only thing a
 * week that has not happened yet can honestly be measured on, and it is the
 * question a manager coaching a team actually asks — "is the next fortnight
 * covered, and who is not covered?"
 *
 * Planned is capped at capacity PER WEEK before summing. Tempo duplicates a
 * weekly plan per project assignment, so someone on two projects reads as 2×40h
 * planned and would push a team over 100% while a third of it sat unplanned.
 * The same cap the grid, the CSV and personExceptions_ have always applied.
 *
 * `none` / `thin` are headcounts, not hours, because the fix is a conversation
 * with a person: 58% coverage does not tell you whether nine people are half
 * planned or four are not planned at all, and those are different weeks.
 */
function planFor_(isos) {
  var s = { planned: 0, cap: 0, people: 0, none: 0, thin: 0 };
  MODEL.people.forEach(function (p) {
    if (p.onLeave || p.onBench || p.isIntern || p.attribOnly) return;
    if (!passesFilters_(p)) return;
    var one = planFor1_(p, isos);
    // No capacity in the window = not expected to be planned into it (pre-hire
    // weeks are not even emitted). Counting them would report a roster gap as a
    // planning gap.
    if (one.cap <= 0) return;
    s.people++; s.cap += one.cap; s.planned += one.planned;
    if (one.planned <= 0) s.none++;
    else if (one.planned < one.cap * PLAN_CLIFF_) s.thin++;
  });
  s.pct = s.cap > 0 ? s.planned / s.cap * 100 : null;
  return s;
}

/** One person's planned hours and capacity over a window — the per-row half of
    planFor_, kept as its own function so the tile total and the roster cell can
    never apply the per-week cap differently. */
function planFor1_(p, isos) {
  var cap = 0, pl = 0;
  (isos || []).forEach(function (iso) {
    var w = p.weeks[iso];
    if (!w) return;
    cap += w.cap || 0;
    pl += (w.cap || 0) > 0 ? Math.min(w.planned || 0, w.cap) : (w.planned || 0);
  });
  return { planned: pl, cap: cap, pct: cap > 0 ? pl / cap * 100 : null };
}

/**
 * The roster's Plan cell: hours planned against hours of capacity, with the
 * same three-way read the signal cells use.
 *
 * Colour is a DOT, never the text, and the hours are always printed — the
 * conversation this column exists to start is "you have 40 hours next week and
 * 6 of them are planned", and that sentence needs the numbers, not a verdict.
 * People with no capacity in the window (pre-hire, or simply not scheduled) get
 * an em-dash rather than 0%: nothing is owed, so nothing is graded.
 */
function planCellHtml_(p, isos) {
  if (p.onLeave) return '<td class="tnum"><span class="cellSub">on leave</span></td>';
  if (p.onBench) return '<td class="tnum"><span class="cellSub">on the bench</span></td>';
  if (p.isIntern) return '<td class="tnum"><span class="cellSub">🎓</span></td>';
  var s = planFor1_(p, isos);
  if (s.cap <= 0) return '<td class="tnum">—</td>';
  var cls = s.planned <= 0 ? "sigBad" : s.pct < PLAN_CLIFF_ * 100 ? "sigWarn" : "sigGood";
  return '<td class="tnum" title="' + r1_(s.planned) + "h planned of " + r1_(s.cap) +
    "h scheduled capacity. Under " + Math.round(PLAN_CLIFF_ * 100) +
    '% is the coverage cliff — the line the triage flag uses.">' +
    '<span class="sigDot ' + cls + '">●</span> ' + r1_(s.planned) + "h" +
    ' <span class="cellSub">/ ' + r1_(s.cap) + "h</span></td>";
}

/**
 * Filter-scoped sums over the person-attributed Jira buckets. Buckets carry
 * the roster person (Assignee join), so EVERY filter — population, role,
 * region, team, PM, family, search — drives the per-person reads exactly like
 * Billable Utilization (user decision 2026-07-31). Buckets whose person fell
 * out of the roster (stale cache, renamed) are skipped.
 *
 * opts.items — the ITEMS read (user 2026-09-09, On-Time and Forecast on the
 * Overview): count work, not people. Three differences from the default:
 *   · buckets under person "" (no roster assignee — unassigned, a contractor
 *     outside the roster, a non-tracking family) are COUNTED whenever no WHERE
 *     filter is narrowing, and counted into `nUnplaced` when one is (they
 *     cannot be placed in a region or team nobody joined them to);
 *   · people pass passesWhereFilters_ (Region / Team / PM / drill states), not
 *     passesFilters_ — Population, Role, Job family and search describe people;
 *   · interns' items still leave (user decision 2026-08-04 — an intern's
 *     record must never move a published number; that is about the number,
 *     not the attribution, so it holds here as well).
 */
function bucketsFor_(buckets, isos, opts) {
  if (!MODEL._pByName) {
    MODEL._pByName = {};
    MODEL.people.forEach(function (p) { MODEL._pByName[p.name] = p; });
  }
  var items = !!(opts && opts.items);
  var narrowed = items && whereNarrowed_();
  var out = { n: 0, onTime: 0, nWithin: 0, nAll: 0, nNoTime: 0,
              nMissOver: 0, nMissUnder: 0, absVars: [],
              // ITEMS read (2026-09-09): how many unattributed items were
              // counted (nUnattributed) or had to be left out because a WHERE
              // filter is narrowing (nUnplaced) — the card states both.
              nUnattributed: 0, nUnplaced: 0,
              // Task-grain forecast (forecastTaskBuckets_, schema 49).
              nSched: 0, nHit: 0, nMiss: 0, nLate: 0, nPending: 0, nRes: 0, nResDated: 0,
              // How many of the forecast epics reached this person through
              // their CHILDREN rather than their own assignee (2026-08-17).
              // Additive like every other counter, so a month states the share
              // of the whole month rather than of its last week.
              nViaChildren: 0,
              // Quality / Rework counters (schema v10). Absent on the other
              // bucket kinds, so they simply stay zero there.
              nDelivered: 0, nRework: 0, nLinked: 0, nReopened: 0, nReopenCov: 0,
              // 🌊 Flow (schema v11). days concats like absVars — a median is
              // not additive, so the raw values travel.
              days: [], estHrs: 0, nEst: 0 };
  (buckets || []).forEach(function (b) {
    if (isos.indexOf(b.iso) === -1) return;
    if (items && !b.person) {
      // An item nobody on the roster is attached to. Countable as an item;
      // not placeable under a Region / Team / PM.
      var size = (b.nAll || b.n || 0) + (b.nSched || 0) + (b.nRes || 0);
      if (narrowed) { out.nUnplaced += size; return; }
      out.nUnattributed += size;
    } else {
      var person = b.person ? MODEL._pByName[b.person] : null;
      if (!person) return;

    out.nAll += (b.nAll || b.n || 0); // stale cache pre-nAll: coverage = n

    out.nViaChildren += (b.nViaChildren || 0);   // absent on a pre-2026-08-17 cache → 0

    out.nMissOver += (b.nMissOver || 0); out.nMissUnder += (b.nMissUnder || 0);
    out.nDelivered += (b.nDelivered || 0); out.nRework += (b.nRework || 0);
    out.nLinked += (b.nLinked || 0); out.nReopened += (b.nReopened || 0);

/**
 * Forecast Accuracy, the Metrics Dictionary formula:
 *   mean of (1 − |Actual − Estimate| / Estimate) across engagements closed in
 *   the period, as a percentage.
 *
 * Computed from the per-epic absolute relative deviations the payload already
 * carries for the median, so the headline, the band and the median all come
 * from ONE array and cannot disagree.
 *
 * FLOORED AT ZERO per epic. The raw expression goes negative past a 2× over-run
 * (1 − 2.0 = −100%), and a "share of accuracy" below zero is not a quantity
 * anyone can act on — worse, a single runaway engagement would drag the mean
 * of a good period below zero. The floor is applied BEFORE averaging, which is
 * the difference between "this epic was completely wrong" and "this epic
 * cancels out three good ones".

 * @returns {?number} 0–100, or null when nothing was measurable

  var sum = 0;
  for (var i = 0; i < absVars.length; i++) sum += Math.max(0, 1 - absVars[i]);

/** Median of a numeric array; null when empty. Mirrors medianOf_ in Code.js. */

  if (!vals || !vals.length) return null;
  var s = vals.slice().sort(function (a, b) { return a - b; });
  var mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;

// ── STANDARD RATE — the level we actually run at ─────────────
//
// A target says what someone decided; a standard rate says what the
// organisation has demonstrably done, period after period. Both are needed, and
// they answer different questions: "are we hitting the plan?" versus "is this
// week different from how we normally operate?". A month at 64% against a 70%
// target is a miss; the same month against an observed norm of 63% is a
// completely ordinary month, and the two conversations should not be confused.
//
// Robust by construction. The baseline is a MEDIAN and the band is derived from
// the median absolute deviation, not a mean and a standard deviation, so one
// broken export week or one holiday-shortened month cannot move the norm it is
// being judged against. 1.4826 is the constant that makes MAD estimate σ for
// normally distributed data, so the ±1 MAD-σ band is the familiar "about two
// thirds of periods land in here" range.
//
// Deliberately conservative about publishing:
//   · fewer than MIN periods → no rate at all, and the UI says how many more
//     complete periods it needs. An "operating norm" from three points is noise
//     with a decimal point on it.
//   · the band never narrows below ±2 points, so a metric that happens to have
//     been flat for a stretch does not start flagging every 1-point wobble as
//     an exception.
//   · callers must not publish one for a suppressed metric or a stale model —
//     see stdFor_.

 * @param {Array<?number>} vals  metric per period, oldest first; nulls skipped
 * @param {{minN:number, floor:number}=} opts
 * @returns {{ok:boolean, n:number, minN:number, baseline:number, lo:number,
 *            hi:number, sigma:number, last:number, verdict:string, run:number,
 *            slope:number, per:number}}

  opts = opts || {};

  var pts = (vals || []).filter(function (v) {
    return v !== null && v !== undefined && !isNaN(v);
  });
  if (pts.length < minN) return { ok: false, n: pts.length, minN: minN };
  var med = medianOf_(pts);
  var mad = medianOf_(pts.map(function (v) { return Math.abs(v - med); }));
  var sigma = Math.max(mad * 1.4826, opts.floor === undefined ? 2 : opts.floor);
  var lo = Math.max(0, med - sigma), hi = Math.min(100, med + sigma);
  var last = pts[pts.length - 1];

  // baseline. One period outside the band is an event; five consecutive periods
  // on one side of the median is a shift in the operating rate itself, and is
  // the thing worth escalating — the classic control-chart run rule.
  var side = last >= med ? 1 : -1, run = 0;
  for (var i = pts.length - 1; i >= 0; i--) {

    ok: true, n: n, baseline: med, lo: lo, hi: hi, sigma: sigma, last: last,
    verdict: last > hi ? "above" : (last < lo ? "below" : "normal"),
    run: run, side: side, slope: den ? (n * sxy - sx * sy) / den : 0,

}

/**
 * The standard rate for a published metric, or null when it must not be shown.
 *
 * Three suppressions, all deliberate:
 *   · stale model — every point could predate the last refresh, so the "norm"
 *     would describe a window nobody can date (NFR-7, same rule that kills the
 *     vs-prior delta).

 *     average of a measurement error (FR-2.2).

 *     it is waiting for rather than rendering nothing.

  if (conf && conf.publish === false) return null;

/**
 * Data-confidence verdict for one metric (FR-2.1/2.2/2.6).
 *
 * ⚠ VERBATIM COPY of metricConfidence_ in Code.js — the client needs it because
 * coverage is filter-dependent (a region slice can be well attributed while the
 * whole population isn't). _test_confidenceParity_ in node-tests.js extracts
 * this copy and diffs it against the server's across a matrix of inputs; if you
 * change one, change both.
 */

  var g = Number(gate) || 0;

    return { level: "none", publish: false, coverage: null };

  var c = Math.max(0, Math.min(1, Number(coverage)));

  if (c >= g && p >= 2) return { level: "high", publish: true, coverage: c };
  if (c >= g - 0.10) return { level: "medium", publish: true, coverage: c };

/** Registry entry for a metric, with an empty-object fallback so a stale cache

/**
 * ── THE REGISTRY IS THE SPINE (2026-08-17, review item #6) ───────────────────
 * The registry entry for a metric, or NULL when the server does not define one.
 *
 * Every card used to carry its own literal fallback — `reg.throughput || { unit:

 * || 0`, which is its "ungated, publish at high confidence" branch. Between the
 * two, a metric the server had never heard of rendered as a fully-formed,
 * confidently-published card with a hand-typed name and a hand-typed gate. That

 * silent one wins whenever the loud one is missing.

/**

// ══════════════════════════════════════════════════════════════════════════
// CHART KIT — inline SVG, no library
//
// Every chart here is written by hand rather than pulled from a CDN. Two
// reasons: an HtmlService web app is a sandboxed iframe on a managed browser,
// so one blocked script request is an executive dashboard with no charts in it;
// and every reference line, direct label and hit target below is bespoke enough
// that a library would be configured into the same shape at twice the weight.
//
// The rules the kit enforces, because the previous sparklines broke all of them
// (user feedback 2026-08-03 — "charts with no labels tell nothing"):
//   · every chart states its own units, its axis, and its period range;
//   · values are labelled SELECTIVELY — endpoint, min and max — never on every
//     point, which is noise;
//   · reference lines (target, operating norm) are drawn AND labelled inline,
//     so a reader never has to remember what 70% was;
//   · nulls break the line instead of being interpolated across — a gap in the
//     data is drawn as a gap;
//   · every chart has a table-view twin, so no value is reachable only by hover;
//   · marks carry colour, text never does.
// ══════════════════════════════════════════════════════════════════════════

/**

 * `target.invert` flips the comparison for metrics where LOWER IS BETTER —

 * error a reader trusts because the colour looks confident.

// pack, a photocopy and a colour-vision difference.

/** One inert colour-key entry: a swatch beside the words it stands for.

/* ragKeyHtml_ DELETED (director feedback 2026-08-17): its last caller was the

 * above the top of the frame, and since `.chart` is `overflow:visible` the
 * polyline then paints straight up across the header and down over the bands

 * @param {{rows:Array<{key:string,label:string,value:?number,n:number,sub:string}>,

 *          onExpand:?string}} o

 * Which rows survive the HBAR_MAX_ROWS_ cap, and which were cut — factored out

 * over one array cannot disagree by construction; two hand-written copies of
 * this logic could, silently, the day only one of them is edited.

 * (P2, management by exception); the tail is available by expanding, and the
 * count of what was cut is stated rather than the chart quietly ending early.

 * furthest below target/reference. Taking the first N of a best-first list

    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (TOP - 6) +

    s += '<line x1="' + x(o.target.green) + '" x2="' + x(o.target.green) + '" y1="' + (TOP - 12) +

      '<text x="' + x(o.target.green) + '" y="' + (TOP - 16) + '" text-anchor="middle" ' +

        " · " + r.n + (r.n === 1 ? " person" : " people") + (r.sub ? " · " + r.sub : "")) + "</title>" +
      '<rect x="0" y="' + yTop + '" width="' + W + '" height="' + RH + '" fill="transparent"/>' +
      '<text class="val" x="0" y="' + (by + 8) + '">' +

      '<text class="axis" x="' + (L - 8) + '" y="' + (by + 8) + '" text-anchor="end">' +
        r.n + "</text>";
    if (r.value === null) {
      s += '<text class="axis" x="' + (L + 4) + '" y="' + (by + 8) + '">no measurable data</text></g>';
      return;
    }
    // 4px rounded data-end, square at the baseline.
    var bw = Math.max(2, xv(r.value) - L);
    s += '<path d="' + roundEndBar_(L, by, bw, bh, 4) + '" class="barfill" fill="' +
        RAG_FILL[rag] + '"/>' +
      '<text class="val" x="' + (L + bw + 7) + '" y="' + (by + 8) + '">' +
        RAG_MARK[rag] + " " + lbl(r.value) + "</text></g>";
  });
  s += "</svg>";
  // Say what was cut. A chart that silently stops at 12 of 52 reads as "there
  // are 12" — the same failure as a truncated table with no ellipsis.
  // Say what was cut, and make it reachable. A cap that can't be lifted turns
  // "too long to read" into "the data isn't there", which is a worse problem
  // than the one it solved — the default stays short, the whole list is one
  // click away.
  if (hidden > 0) {
    var ranked = hidden - hiddenNoData;
    s += '<div class="cellSub" style="margin-top:4px">Showing the ' + rows.length +
      " furthest from target · " +
      (ranked > 0 ? ranked + " nearer target" : "") +
      (ranked > 0 && hiddenNoData > 0 ? " and " : "") +
      (hiddenNoData > 0 ? hiddenNoData + " with no measurable data" : "") +
      " not shown. " +
      (o.onExpand
        ? '<button class="btn" onclick="' + o.onExpand + '" title="' +
          esc_("Draw every one of the " + all.length + " categories. The chart gets long — the " +
               "default keeps the ones carrying a decision at the top of the page.") +
          '">Show all ' + all.length + "</button>"
        : "") + "</div>";
  } else if (o.onExpand && o.expanded && all.length > (o.cap || HBAR_MAX_ROWS_)) {
    s += '<div class="cellSub" style="margin-top:4px">All ' + all.length +
      " shown. " + '<button class="btn" onclick="' + o.onExpand +
      '" title="back to the ' + (o.cap || HBAR_MAX_ROWS_) +
      ' furthest from target">Show top ' + (o.cap || HBAR_MAX_ROWS_) + "</button></div>";
  }
  return s;
}

/** Bar path: square at the baseline (left), radius r on the data end (right). */
function roundEndBar_(x, y, w, h, r) {
  r = Math.min(r, w, h / 2);
  return "M" + x + "," + y + "H" + (x + w - r) + "a" + r + "," + r + " 0 0 1 " + r + "," + r +
    "V" + (y + h - r) + "a" + r + "," + r + " 0 0 1 " + (-r) + "," + r + "H" + x + "Z";
}

function trunc_(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}

/** A string safe to drop into an inline onclick="fn(…)" — HTML-escaped, then
    single-quotes backslash-escaped, then quoted. The roster inlines this same
    pair of steps at two call sites; a PM name or a Jira key with an apostrophe
    would otherwise terminate the handler and silently break the click. */
function jsArg_(s) {
  return "'" + esc_(String(s == null ? "" : s)).replace(/'/g, "\\'") + "'";
}

/**
 * The KPI-tile micro chart, replacing a bare row of unlabelled bars.
 *
 * Same information density as before plus the three things that were missing:
 * which periods it spans, what the last value was, and where the operating norm
 * sits. Still small enough to live under a hero number.
 */
function sparkHtml_(vals, opts) {
  opts = opts || {};
  var labels = opts.labels || [];
  // `flags` (Task 17): a parallel boolean array, one per point in `vals` —
  // true = measured, false/absent-at-that-index = reconstructed/inferred.
  // Omitted entirely (the default, every existing caller), every point draws
  // exactly as before — this is additive, not a behaviour change for the 20+
  // percentage sparklines already on the page.
  //
  // `unit`/`fmt` let a caller plot something that is not a percentage (an
  // item count, here) without lying about the axis: the old hardcoded "%"
  // suffix on the value label and every point's tooltip would have read
  // "3,279%" on an inventory series. `domain` lets that same caller supply
  // its own y-range instead of pctDomain_'s hardcoded 0–100 clamp, which is
  // correct for a rate but would flatten an item-count series against a
  // ceiling it never approaches.
  var flags = opts.flags || null;
  var unit = opts.unit === undefined ? "%" : opts.unit;
  var fmt = opts.fmt || function (v) { return Math.round(v) + unit; };
  var W = 240, H = 54, L = 2, R = 30, T = 12, B = 13;
  var pw = W - L - R, ph = H - T - B;
  var std = opts.std && opts.std.ok ? opts.std : null;
  // ── TARGET LINE (review item #2, 2026-08-17) ─────────────────────────────
  // `target` is the same {green, amber, invert} object the card's hero is
  // coloured against — passed through, never re-derived, so the line and the
  // colour can never disagree about where the bar is.
  //
  // Reading trend-to-goal used to mean reading the delta sentence: the chart
  // showed the SHAPE of the series and the text showed its distance from
  // target, and the reader joined them. One horizontal rule does that join.
  //
  // Drawn at `green` only — the committed target. Amber is a warning band, not
  // a goal, and a second rule would turn the reference into a ladder that
  // competes with the series for attention.
  var tgt = (opts.target && typeof opts.target.green === "number") ? opts.target : null;
  var dom = opts.domain || pctDomain_(vals, std ? [std.lo, std.hi] : []);
  // CONTAINMENT GUARD. A domain that does not contain its own data does not
  // clip the line — `.chart` is overflow:visible, so the polyline is drawn at
  // whatever coordinate the maths produces and paints across the rest of the
  // page. That is how a count series against pctDomain_'s 0–100 clamp ended up
  // running the full height of the dashboard (2026-08-07). Widening the frame
  // is the honest repair: the value stays true, the axis grows to hold it.
  // Clamping the POINT instead would draw a real number at a false height.
  dom = { lo: dom.lo, hi: dom.hi };
  vals.forEach(function (v) {
    if (v === null || v === undefined || isNaN(v)) return;
    if (v < dom.lo) dom.lo = v;
    if (v > dom.hi) dom.hi = v;
  });
  // The target joins the containment guard above for the same reason the data
  // does: a reference line drawn outside the frame is drawn at whatever
  // coordinate the maths produces, and `.chart` is overflow:visible. A target
  // the series never approaches must widen the axis, not escape it — and a
  // target line clipped to the frame edge would read as "we are nearly there".
  if (tgt) {
    if (tgt.green < dom.lo) dom.lo = tgt.green;
    if (tgt.green > dom.hi) dom.hi = tgt.green;
  }
  var span = dom.hi - dom.lo || 1;
  function y(v) { return T + ph - (v - dom.lo) / span * ph; }
  function x(i) { return vals.length === 1 ? L + pw / 2 : L + (i / (vals.length - 1)) * pw; }
  // `spark` (not just `chart`) is what the tile CSS pins to the card's bottom
  // edge, so every mini chart in a row shares one baseline regardless of how
  // many context lines the card above it printed.
  var s = '<svg class="chart spark" style="max-width:240px" viewBox="0 0 ' + W + " " + H + '">';
  if (std) {
    s += '<rect x="' + L + '" y="' + y(std.hi) + '" width="' + pw + '" height="' +
      Math.max(1, y(std.lo) - y(std.hi)) + '" fill="var(--c-ref)" opacity="0.13"><title>' +
      "operating rate " + Math.round(std.lo) + "–" + Math.round(std.hi) +
      "% — where this metric normally sits</title></rect>";
  }
  // The target rule, drawn UNDER the series (before the polyline) so the data
  // is never obscured by its own reference. Dashed and muted for the same
  // reason: it is the bar, not a measurement, and a solid second line at full
  // weight reads as a second series.
  if (tgt) {
    var ty = y(tgt.green);
    var dir = tgt.invert ? "at or below" : "at or above";
    // The label shares the right-hand gutter with the endpoint value, and a
    // metric sitting ON its target puts the two at the same height — which
    // rendered as "90%t", the value label with the word "target" printed
    // through it (caught by screenshot, 2026-08-17). When they are within a
    // line's height of each other the label drops below the rule instead.
    // Neither is droppable: the value is the answer and the rule is the bar.
    var lastY = null;
    for (var li = vals.length - 1; li >= 0; li--) {
      var lv = vals[li];
      if (lv !== null && lv !== undefined && !isNaN(lv)) { lastY = y(lv); break; }
    }
    var ly = (lastY !== null && Math.abs(ty - lastY) < 11) ? ty + 9 : ty - 3;
    s += '<line class="tgtline" x1="' + L + '" y1="' + ty + '" x2="' + (L + pw) + '" y2="' + ty +
      '" stroke="var(--c-ref)" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.75"><title>' +
      esc_("target — " + dir + " " + fmt(tgt.green) + ". The series is on target wherever it sits " +
           (tgt.invert ? "below" : "above") + " this line.") + "</title></line>" +
      // Labelled on the axis edge, not floating: an unlabelled rule is a line
      // whose meaning has to be guessed, and the guess is usually "average".
      '<text class="axis tgtlabel" x="' + (L + pw + 2) + '" y="' + ly + '">target</text>';
  }
  var run = [], last = null, lastI = -1;
  // Basis-of-the-line: dashed + muted whenever ANY point behind the line is
  // reconstructed rather than measured — an unlabelled change of basis in a
  // chart is worse than no chart (same rule the ✎ definition-changed marker
  // applies to a trend that steps on a redefinition, reused here for a trend
  // that steps on a change of EVIDENCE instead of a change of formula). A run
  // that happens to be ALL measured draws solid, same as every other spark.
  var runAllMeasured = true;
  if (flags) for (var fi = 0; fi < vals.length; fi++) if (flags[fi] !== true) { runAllMeasured = false; break; }
  var lineAttrs = (flags && !runAllMeasured)
    ? ' stroke-dasharray="4,3" opacity="0.6"' : "";
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) {
      if (run.length > 1) s += '<polyline points="' + run.join(" ") +
        '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"' + lineAttrs + '/>';
      run = [];
      return;
    }
    run.push(x(i) + "," + y(v));
    last = v; lastI = i;
  });
  if (run.length > 1) s += '<polyline points="' + run.join(" ") +
    '" fill="none" stroke="var(--c-series)" stroke-width="2" stroke-linejoin="round"' + lineAttrs + '/>';
  vals.forEach(function (v, i) {
    if (v === null || v === undefined || isNaN(v)) return;
    // Reconstructed points draw HOLLOW (fill = the page background, not the
    // series colour) at reduced opacity; the measured point(s) stay the same
    // solid dot every other sparkline already draws — a reader distinguishes
    // "this far back is inferred" from "this one is a real snapshot" without
    // needing the tooltip, though the tooltip says it in words too.
    var measured = flags ? flags[i] === true : true;
    var r = i === lastI ? 3.6 : 2.2;
    var basisWord = !flags ? "" : (measured ? " (measured)" : " (reconstructed — inferred, not a snapshot)");
    s += '<circle class="' + (measured ? "pt-measured" : "pt-reconstructed") + '" cx="' + x(i) + '" cy="' + y(v) +
      '" r="' + r + '" fill="' + (measured ? "var(--c-series)" : "var(--plot)") +
      '" stroke="var(--c-series)" stroke-width="1.6"' + (measured ? "" : ' stroke-dasharray="1.5,1.2"') + '><title>' +
      esc_((labels[i] || "period " + (i + 1)) + " · " + fmt(v) + basisWord) + "</title></circle>";
  });
  if (last !== null) {
    s += '<text class="val" x="' + (L + pw + 4) + '" y="' + (y(last) + 4) + '">' +
      esc_(fmt(last)) + "</text>";
  }
  // The two labels that turn a squiggle into a chart: what it starts at and
  // what it ends at, in time.
  //
  // `bare` omits them for the in-table variant. Not a relaxation of the rule —
  // in a 170px table cell the 10px axis text renders at about 6px, which is
  // worse than no label, and the column HEADER carries the span for every row at
  // a readable size. The per-point hover still names each period.
  if (labels.length && !opts.bare) {
    s += '<text class="axis" x="' + L + '" y="' + (H - 2) + '">' + esc_(labels[0]) + "</text>" +
      '<text class="axis" x="' + (L + pw) + '" y="' + (H - 2) + '" text-anchor="end">' +
      esc_(labels[labels.length - 1]) + "</text>";
  }
  return s + "</svg>";
}

/** Confidence chip (FR-2.1). Rendered only on the compact flow tiles now —
    the four KPI cards dropped it (user 2026-08-05: data-quality noise; the
    Data trust strip below carries coverage-vs-gate for the executive read). */
function confChip_(conf, metric) {
  if (!conf || conf.level === "none") return "";
  var pct = conf.coverage === null ? "—" : Math.round(conf.coverage * 100) + "%";
  var gate = Math.round((metric.coverageGate || 0) * 100) + "%";
  var why = {
    high:   "Coverage is at or above the registry gate (" + gate + ") with at least two complete periods behind it.",
    medium: "Coverage is within 10 points of the registry gate (" + gate + "), or there aren't yet two complete periods. Directionally useful; not board-ready.",
    low:    "Coverage is more than 10 points below the registry gate (" + gate + "). The value is suppressed.",
  }[conf.level] || "";
  return '<span class="conf c' + conf.level + '" title="' + esc_(why + " Measured over: " +
    (metric.coverageOf || "attributed records") + ".") + '">' +
    { high: "◆", medium: "◈", low: "◇" }[conf.level] + " " + conf.level +
    " confidence · " + pct + " attributed</span>";
}

/**
 * Suppressed tile (FR-2.2). A metric whose inputs are mostly missing is not a
 * cautious number, it is a different number — so nothing numeric is rendered.
 * Publishing a low-confidence value is treated here as a defect, not a display
 * choice: the alternative is a CEO escalating on a tagging artifact, or writing
 * the tool off for good the first time one is caught.
 */
function suppressedTileHtml_(label, metric, conf, detail, headlineLabel, covTrend, covLabels, scope) {
  var pct = conf.coverage === null ? "—" : Math.round(conf.coverage * 100) + "%";
  // The period used to be repeated here for the same reason it was on every
  // published card — now that it is stated once globally above the row, the
  // repetition is just a stolen line. (Kept as a tooltip: a suppressed card is
  // still a statement about a window.)
  return '<div class="tile sup"><div class="lbl"' +
    (headlineLabel ? ' title="' + esc_(headlineLabel) + '"' : "") + ">" + label +
    scopeTag_(scope || "period") + '</div>' +
    '<div class="supbig" title="' + esc_((metric.definition || "") + " Gate: " +
      Math.round((metric.coverageGate || 0) * 100) + "% of " + (metric.coverageOf || "records") +
      ".") + '">Not yet measurable</div>' +
    '<div class="cmp">' + pct + " attributed · gate " +
      Math.round((metric.coverageGate || 0) * 100) + "%</div>" +
    // No owner line (user decision 2026-08-03, same rule as the hygiene table).
    // The registry still carries `owner` and `paramOwner` for the definition
    // record; it just isn't rendered onto a card as a name beside a failure.
    (detail ? '<div class="cmp">' + detail + "</div>" : "") +
    // Trend the COVERAGE, not the metric. Publishing "is the gap closing?" is
    // not publishing the suppressed number — it's the one thing a suppressed
    // card can honestly say, and without it the state looks permanent.
    // Caption + chart travel together in .sparkWrap — the wrapper is what gets
    // pinned to the card's bottom edge, so the words never separate from the
    // squiggle they name.
    (covTrend && covTrend.filter(function (v) { return v !== null; }).length >= 2 && !MODEL._stale
      ? '<div class="sparkWrap"><div class="cmp">attribution trend</div>' +
        sparkHtml_(covTrend, { labels: covLabels }) + "</div>"
      : "") + "</div>";
    // No "What's missing →" link (user 2026-08-05): the who-and-what of data
    // quality lives on the 🎯 Actions tab (signals roster + gaps queue), and
    // the Data trust strip already sits on this same view.
}

/**
 * Applies the coverage-gate POLICY on top of the band computation.
 *
 * metricConfidence_ decides how good the attribution is; this decides what to do
 * about it. The two are kept apart on purpose, so flipping
 * CONFIG_DH.SUPPRESS_BELOW_GATE changes exactly one thing: whether a weak number
 * is shown or withheld.
 *
 * Shipped setting is "show" (accepted deviation from FR-2.2 — see the config
 * note in Code.js). Only an explicit `true` suppresses, so a cached model
 * predating the flag publishes rather than going dark for the rest of its TTL.
 */
function applyGatePolicy_(conf) {
  if (MODEL.meta.suppressBelowGate === true) return conf;
  if (conf.level === "none") return conf;   // nothing in scope is still nothing
  return { level: conf.level, publish: true, coverage: conf.coverage };
}

/**
 * The three states a gated metric can be in, resolved in one place so they can
 * never be rendered as each other:
 *   nothing in scope   → "—" with the reason. NOT a coverage failure: a quiet
 *                        week with no closed epics is not a data-quality problem,
 *                        and showing it as one trains people to ignore the gate.
 *   below the gate     → published with a low-confidence chip, or suppressed
 *                        when CONFIG_DH.SUPPRESS_BELOW_GATE is on (FR-2.2)
 *   otherwise          → the metric, with its confidence chip
 */
function gatedTile_(label, conf, metric, emptyMsg, suppressDetail, publish, headlineLabel, covTrend, covLabels, scope) {
  // `scope` (2026-09-09): the tag the card wears in EVERY state — empty,
  // suppressed or published — so an ITEMS card cannot read as PERIOD the
  // moment it has nothing to show.
  if (conf.level === "none") {
    return tileHtml_(label, null, "", [], { unavailable: emptyMsg, headlineLabel: headlineLabel, scope: scope });
  }
  if (!conf.publish) {
    return suppressedTileHtml_(label, metric, conf, suppressDetail, headlineLabel, covTrend, covLabels, scope);
  }
  return publish();
}

function tileHtml_(label, headlinePct, cmpText, trendVals, opts) {
  opts = opts || {};
  if (opts.placeholder) {
    return '<div class="tile ph"><div class="lbl">' + label + scopeTag_(opts.scope || "period") + '</div>' +
      '<div class="big">—</div><div class="cmp">data pending — reopen/CSAT feed not yet connected</div></div>';
  }
  if (opts.unavailable) {
    return '<div class="tile ph"><div class="lbl"' +
      (opts.headlineLabel ? ' title="' + esc_(opts.headlineLabel) + '"' : "") + ">" + label +
      scopeTag_(opts.scope || "period") + '</div>' +
      '<div class="big">—</div><div class="cmp">' + opts.unavailable + '</div></div>';
  }
  var big = headlinePct === null ? "—" : Math.round(headlinePct) + "%";
  // Per-metric RAG (director feedback: one shared orange made every number look
  // equally alarming) + delta vs the prior complete period + explicit target.
  var t = opts.target || null;
  // FLOOR: a rate whose numerator signal is structurally absent can only
  // undercount, so its value is a lower bound, not a measurement. It gets NO RAG
  // colour at all — not green, not amber. Colour is a verdict, and there is no
  // verdict to give: 0% detected is not 0% happened, and rendering it green made
  // the least-measured number the healthiest-looking card on the screen.
  // Distinct from low coverage (which the confidence chip already handles) —
  // this is about what the numerator can physically contain.
  var floor = !!opts.floor;
  var rag = floor ? "" : ragOf_(headlinePct, t);
  // Lower-is-better metrics (Rework Rate) invert both the colour AND the
  // direction words, or a falling rate would read as a decline.
  var inv = !!(t && t.invert);
  // The target as a scale mark beside the number, printed once. Not a verdict —
  // it carries no colour and no arrow; the hero's RAG and the gap line below
  // do the judging. See .tgt in the stylesheet for why it is a sibling of .big.
  var tgtChip = (t && headlinePct !== null)
    ? '<span class="tgt" title="FY27 target: ' + (inv ? "at or below " : "at or above ") +
      t.green + '%">target ' + (inv ? "≤" : "≥") + t.green + "%</span>"
    : "";
  var signal = "";
  if (floor && headlinePct !== null) {
    // No target restated here either — the chip beside the number has it, and a
    // floor has no verdict to give against it.
    signal = '<span title="' + esc_(opts.floorWhy || "") +
      '">▱ at least ' + Math.round(headlinePct) + "% — lower bound, not a measurement</span>";
  } else if (t && headlinePct !== null) {
    // Variance to TARGET leads (P5/FR-4.1): "3 pts better than last month" is
    // not an answer to "will we make the year?". vs-prior comes second, and is
    // dropped entirely when the data is stale (NFR-7) — a delta computed across
    // a gap in refreshes is a fiction.
    var gap = Math.round(headlinePct - t.green);
    var good = inv ? gap <= 0 : gap >= 0;
    // The THRESHOLD is not repeated here — it sits next to the hero as .tgt.
    // This line carries only the distance and its direction, so the two numbers
    // on it ("44 pts below target" · "3 pts vs prior") stay tellable apart.
    signal += '<span class="' + (good ? "dUp" : "dDown") + '" title="' +
      (good ? "at or better than" : "worse than") + ' the FY27 target of ' +
      (inv ? "≤" : "≥") + t.green + '%">' +
      (gap === 0 ? "on target"
                 : (gap > 0 ? "▲ " : "▼ ") + Math.abs(gap) + " pts " +
                   (gap > 0 ? "above" : "below") + " target") + "</span>";
    var vals = (trendVals || []).filter(function (v) { return v !== null; });
    // vs-prior is dropped on an UNFINISHED window as well as a stale one
    // (2026-08-06). Two weeks of a month against a whole prior month is not a
    // delta, it is a length difference wearing an arrow — and the arrow is the
    // part a reader remembers. The target gap survives: it judges the number
    // that is actually on the card.
    if (vals.length >= 2 && !MODEL._stale && (opts.phase || "done") === "done") {
      // A sub-half-point move must not print as "▲ 0 pts" — an arrow next to a
      // zero claims a direction the data doesn't support.
      var d = Math.round(vals[vals.length - 1] - vals[vals.length - 2]);
      signal += d === 0
        ? ' · <span title="the change since the prior complete period is under half a point">' +
          "unchanged</span> vs prior"
        : ' · <span class="' + ((inv ? d < 0 : d > 0) ? "dUp" : "dDown") + '">' +
          (d > 0 ? "▲" : "▼") + " " + Math.abs(d) + " pts</span> vs prior";
    }
  }
  // Second reference: the rate we actually run at. "6 pts below target" and
  // "exactly where we always are" are both true of the same number, and an
  // executive needs both before deciding whether anything happened this period.
  var std = opts.std || null;
  var stdLine = "";
  if (std && std.ok && headlinePct !== null) {
    var vc = { above: "dUp", normal: "", below: "dDown" }[std.verdict];
    var vw = { above: "▲ above", normal: "● inside", below: "▼ below" }[std.verdict];
    stdLine = '<span class="' + vc + '" title="Operating rate = the median of the ' +
      std.n + " complete " + (std.basis === "week" ? "WEEKS" : "periods") +
      " in this window, with a ±1 MAD-σ normal range of " +
      Math.round(std.lo) + "–" + Math.round(std.hi) + "%. It is measured, not declared: " +
      "it says how this metric normally behaves, so an ordinary period is never escalated as a move." +
      (std.basis === "week"
        ? " Measured weekly because the window holds too few complete " +
          (std.displayUnit || "periods") + " for a stable rate."
        : "") + '">' +
      vw + " normal (" + Math.round(std.baseline) + "%" +
      (std.basis === "week" ? ", weekly basis" : "") + ")</span>" +
      (std.run >= 4 ? ' · <span class="' + vc + '" title="' + std.run +
        " consecutive periods on the same side of the norm — a sustained shift in the operating rate, " +
        'not a single bad period">' + std.run + " in a row</span>" : "");
  }
  // ── CARD GRAMMAR (fixed, four lines maximum) ────────────────────────────
  //   label → hero → delta-vs-target → operating rate → ONE context line → sparkline
  //
  // The period is NOT in the label: it was repeating in all four headers,
  // stating one fact four times and stealing a line from each card. It is
  // printed once, globally, above the row.
  //
  // NO data-quality lines (user 2026-08-05): the confidence chip, the
  // "below gate — directional only" caveat and the "What's missing →" link
  // were noise repeated on all four cards. Coverage-vs-gate lives on the
  // 🔍 Data trust strip on this same view, and WHO can close each gap lives
  // on the 🎯 Actions tab (signals roster + gaps queue). The gate still acts —
  // gatedTile_/metricConfidence_ decide publish/suppress exactly as before;
  // the cards just stop narrating it.
  //
  // Everything else — median variance, miss-direction split, the CSAT note —
  // is real and stays reachable, but as the context line's tooltip, not as a
  // fifth through eighth line. Quality carried eight lines and Forecast seven,
  // which put the four sparkline baselines at four different heights: the row
  // stopped reading as a set of comparable cards and started reading as four
  // unrelated blocks. A director scanning for the worst number should not
  // have to re-find the baseline in each card.
  //
  // `note` takes the delta line's slot on a TARGET-LESS card (Planned
  // Coverage). It is not a fifth line: a card with no target prints no gap
  // sentence, so the slot is free and the grammar holds at four.
  var detail = (opts.detail || []).filter(Boolean).join(" · ");
  var context = cmpText + (detail
    ? ' <span class="cellSub" title="' + esc_(detail) + '" style="cursor:help">ⓘ</span>' : "");
  var noteLine = (!signal && opts.note) ? opts.note : "";
  var phase = opts.phase || "done";
  // The window's phase rides on the HERO, next to the target chip, not as a
  // line: it qualifies the number itself. A reader who screenshots one card
  // must not be able to lose the fact that the window is still open.
  var phaseChip = phase === "done" ? "" :
    '<span class="tgt phase' + (phase === "plan" ? " plan" : "") + '" title="' +
      esc_(opts.phaseWhy || (phase === "plan"
        ? "This window has not happened yet — what is shown is the plan, not delivery."
        : "This window is still running. Nothing here is compared to the period before it: " +
          "a part-period against a whole one is a length difference, not a change.")) + '">' +
    (phase === "plan" ? "planning" : "◐ in progress") + "</span>";
  // ── VARIANCE ACCENT (review item #2, 2026-08-17) ─────────────────────────
  // A card that is missing its target wears a coloured edge, so the row can be
  // scanned for trouble without reading a single number. Derived from `rag`,
  // never computed a second time — the edge, the hero colour and the target
  // line on the chart are three renderings of ONE verdict.
  //
  // Amber is included and deliberately quieter than red: "approaching" and
  // "missed" are different conversations, and giving them the same edge would
  // make the row read as uniformly on fire — the exact failure the per-metric
  // RAG replaced a shared orange to fix. A floor carries no accent at all,
  // consistent with carrying no colour: `rag` is already "" in that case.
  var accent = rag === "r" ? " vMiss" : rag === "a" ? " vNear" : "";
  // ── CLICK-TO-FILTER (user 2026-08-17) ──
  // A KPI card whose metric is also a drill-down column becomes the control for
  // that column: clicking it selects the metric below, which re-ranks the table
  // and marks the rows dragging it down. The card is not a link and does not
  // navigate — it changes the lens on the section directly beneath it, which is
  // why the whole page does not move under the reader.
  //
  // Keyboard-reachable and announced: role=button, tabindex=0 and an Enter/Space
  // handler, or the feature exists for mouse users only. aria-pressed carries
  // the selected state, because "which card am I filtered by" is exactly what a
  // screen-reader user cannot see from the highlight.
  var drillId = opts.drillMetric || "";
  var isSel = drillId && STATE.metric === drillId;
  var clickAttrs = drillId
    ? ' role="button" tabindex="0" aria-pressed="' + (isSel ? "true" : "false") + '"' +
      ' onclick="setMetric_(' + jsArg_(drillId) + ')"' +
      ' onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
      'setMetric_(' + jsArg_(drillId) + ');}"' +
      ' title="' + esc_("Break this metric down below — the table re-ranks by it and marks " +
                        "the rows pulling it down.") + '"'
    : "";
  return '<div class="tile' + (phase === "done" ? "" : " tPhase") + accent +
    (drillId ? " tileDrill" : "") + (isSel ? " tileSel" : "") + '"' + clickAttrs +
    '><div class="lbl">' + label + scopeTag_(opts.scope || "period") + '</div>' +
    // No chip → no wrapper: an empty .heroRow would close two divs in a row and
    // change the markup shape for every target-less tile.
    (tgtChip || phaseChip
      ? '<div class="heroRow"><div class="big ' + rag + '">' + big + "</div>" + tgtChip + phaseChip + "</div>"
      : '<div class="big ' + rag + '">' + big + "</div>") +
    (signal ? '<div class="cmp">' + signal + '</div>' : "") +
    (noteLine ? '<div class="cmp">' + noteLine + '</div>' : "") +
    (stdLine ? '<div class="cmp">' + stdLine + '</div>' : "") +
    '<div class="cmp">' + context + '</div>' +
    // The sparkline is handed the SAME target object the hero is coloured
    // against (review item #2) — one source, so the rule on the chart and the
    // colour on the number can never disagree. A floor gets no line for the
    // same reason it gets no RAG colour: there is no verdict to draw.
    (MODEL._stale ? '<div class="cmp stalenote" title="the model has not been rebuilt inside the stated refresh cadence — trend comparisons are suppressed until it refreshes">trend suppressed — data stale</div>'
                  : sparkHtml_(trendVals, { labels: opts.trendLabels, std: std,
                                            target: floor ? null : t })) + '</div>';
}

/** True when the NS billable feed is actually delivering data — nsAvailable
    with ZERO classified person-weeks is a broken join/empty feed, not a
    measured 0% (director feedback: the hero read 0% next to tracked 71%).
    Keyed on nsCov rather than billable hours: under the ratio model a covered
    week with a 0% billable mix is a real measurement, not an empty feed. */
function nsLive_() {
  if (!MODEL.meta.nsAvailable) return false;
  if (MODEL._nsLive === undefined) {
    var cov = 0;
    MODEL.people.forEach(function (p) {
      Object.keys(p.weeks).forEach(function (iso) { if (p.weeks[iso].nsCov) cov++; });
    });
    MODEL._nsLive = cov > 0;
  }
  return MODEL._nsLive;
}

/** Small-sample flag for issue-based tiles (n=10 is a headline built on 10 epics). */
function smallN_(n) { return n > 0 && n < 15 ? " · ⚠ small sample" : ""; }

/**
 * An outcome card over a window that has not happened yet.
 *
 * Deliberately the SAME "—" placeholder state a card uses when there is nothing
 * in scope, with a different reason. The alternative — publishing 0% or 100%
 * over zero resolved items — is the failure mode this whole tier of the code
 * exists to prevent: a rate computed on an empty set looks exactly like a
 * measured one, and 100% on-time for next week would be quoted.
 */
function notYetTile_(label, head, headlineLabel, scope) {
  return tileHtml_(label, null, "", [], {
    headlineLabel: headlineLabel, scope: scope,
    unavailable: esc_(head.label) + " has not happened yet — this measures work that " +
      "has been delivered, so there is nothing to grade until the week closes. " +
      "Planned Coverage is what this window can answer." });
}

/**
 * PLANNED COVERAGE card — the Utilization slot on a forward window.
 *
 * No target and therefore NO RAG colour: nobody has agreed a planned-coverage
 * bar, and inventing one here would put a verdict on screen that no owner
 * stands behind. What it does carry is the actionable count — the coverage
 * cliff personExceptions_ has always used — because "who is not planned" is the
 * thing a manager can act on before the week starts, and it is a name, not a
 * percentage.
 */
function planTile_(head, headlineLabel, phase) {
  var pl = planFor_(head.isos);
  var unplanned = pl.none + pl.thin;
  var note = pl.people === 0 ? "" :
    (unplanned === 0
      ? '<span class="dUp" title="Every person with capacity in this window is planned to at least ' +
        Math.round(PLAN_CLIFF_ * 100) + '% of it.">● all ' + pl.people + " covered</span>"
      : '<span class="dDown" title="Under ' + Math.round(PLAN_CLIFF_ * 100) +
        "% of their scheduled capacity planned — the coverage cliff the roster flags " +
        'per person. Open 🎯 Actions to see who.">▽ ' + unplanned + " of " + pl.people +
        " under " + Math.round(PLAN_CLIFF_ * 100) + "% planned</span>" +
        (pl.none ? ' · <span class="dDown" title="No planned hours at all in this window.">' +
          pl.none + " with no plan</span>" : ""));
  return tileHtml_("Planned Coverage", pl.pct,
    r1_(pl.planned) + "h planned of " + r1_(pl.cap) + "h scheduled capacity",
    [], {
      headlineLabel: headlineLabel, target: null, phase: phase, note: note,
      phaseWhy: "Planned hours against scheduled capacity for a window that has not " +
        "started. It is a plan, not a result — and it carries no RAG colour because no " +
        "planned-coverage target has been agreed.",
      detail: ["Planned hours are capped at capacity per week before summing: Tempo " +
        "records a weekly plan PER project assignment, so someone on two projects " +
        "reads as twice their week. Long leave and interns are excluded — the same " +
        "population as the utilization rate.",
        "Under-planned is under " + Math.round(PLAN_CLIFF_ * 100) + "% of scheduled " +
        "capacity, the same coverage-cliff line the signals roster flags per person."] });
}

// ══════════════════════════════════════════════════════════════════════════
// §1 THE MASTHEAD — the lede (spec 2026-08-06)
// ══════════════════════════════════════════════════════════════════════════

/** Thousands-grouped integer — "3,279", never a bare run of digits a reader
    has to count by eye. Scoped to the masthead/verdict on purpose: every
    other tile already has its own display convention (r1_ for hours, a bare
    number for small counts) and nothing here forces a second one on them. */
function nfDh_(v) {
  var n = Math.round(Number(v) || 0);
  var s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (n < 0 ? "-" : "") + s;
}

/** One-decimal string — "11.0", not the bare float r1_ rounds to. Guards NaN
    the same way r1_ guards it; toFixed alone on a non-number prints "NaN". */
function n1Dh_(v) {
  var n = Number(v);
  return isNaN(n) ? "0.0" : n.toFixed(1);
}

/**
 * MODEL.inventoryHistory (queue size per week, oldest first) ÷ TODAY's clear
 * rate → a weeks-to-clear series stdFor_ can judge the CURRENT cover
 * against. One rate applied to every point, deliberately: the question this
 * answers is "how unusual is carrying today's queue at the rate we clear
 * today", the same question stdFor_ answers for every other metric on the
 * page — a rate that varied per historical week would be a different
 * question with a different answer.
 */
function coverSeries_() {
  var rate = MODEL.meta.clearRateMedian;
  if (!rate) return [];
  return (MODEL.inventoryHistory || []).map(function (h) {
    return (h && typeof h.items === "number") ? h.items / rate : null;
  });
}

/**
 * MODEL.arrivalWeeks with the IN-FLIGHT week removed — the exact series
 * clearRateMedian_ builds server-side (`closedArrWeeks`, Code.js).
 *
 * Since Jira Backlog.js v3.15.0 the arrivals tab carries the current week, so
 * that the picker's "current week" has Jira numbers behind it. Every TRAILING-
 * WINDOW consumer here must still drop it: an eight-week window whose newest
 * entry is a two-day week is seven weeks of history plus a fraction, and both
 * consumers below document themselves as using "the same window the server
 * does". This is the one place that decision is made, so they cannot drift.
 *
 * Status comes from meta.gridWeeks — the same lookup trailingCompleteWeeks_
 * uses — so "which week is in flight" has one answer on this page.
 */
function completeArrivalWeeks_() {
  var st = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) { if (wk && wk.iso) st[wk.iso] = wk.status; });
  return (MODEL.arrivalWeeks || []).filter(function (w) {
    return w && (st[w.iso] || "done") === "done";
  });
}

/**
 * Average (created − resolved) per week over the TRAILING meta.clearRateWeeks
 * of COMPLETE arrival weeks (oldest first) — the same window clearRateMedian_
 * uses server-side (spec D3/D4), so the verdict and the rate it is judged
 * against can never describe different spans of history. A week the arrivals
 * tab could not parse is skipped, never treated as zero flow.
 */
function netFlowPerWeek_() {
  var weeks = completeArrivalWeeks_();
  var win = MODEL.meta.clearRateWeeks || 8;
  var trailing = weeks.slice(Math.max(0, weeks.length - win));
  var sum = 0, cnt = 0;
  trailing.forEach(function (w) {
    if (w && typeof w.created === "number" && typeof w.resolved === "number") {
      sum += w.created - w.resolved;
      cnt++;
    }
  });
  return cnt > 0 ? sum / cnt : null;
}

// ══════════════════════════════════════════════════════════════════════════
// §2 BACKLOG BAND — the page's hero (spec 2026-08-06 §2)
//
// The dashboard could only ever see ASSIGNED open work. Measured live
// 2026-08-06: 1,440 assigned vs 1,839 unassigned — 56% of the queue invisible.
// Assigned-only, weeks-to-clear reads 4.9w (at target); the true queue reads
// 11.0w, 2.75x over. So this band ships two tiers on purpose:
//   · a hero triplet, ORG-tagged, that ignores every filter — the true state,
//     seen first;
//   · a filterable assigned sub-row, SNAP-tagged, labelled "the work that has
//     an owner" — for the reader who wants to slice by Region/Team/PM/Family.
// NO TARGET RULE ANYWhERE IN THIS BAND (D11): queueCover and netFlow ship
// target: null deliberately. Nobody owns a <=4w or <=0 bar, and an unratified
// target on a C-suite headline reads as agreed the moment it appears. The
// operating band (stdFor_) is shaded instead; when the norm is unpublishable,
// no reference mark is drawn at all.
// ══════════════════════════════════════════════════════════════════════════

/** Minimum trailing weeks the ASSIGNED clear rate needs before it publishes —
    the same bar clearRateMedian_ (Code.js) applies to the ORG rate, so the two
    denominators the backlog band divides by are equally conservative. */
var CLEAR_RATE_MIN_N_ = 5;

/**
 * Every ISO week the payload knows about, restricted to COMPLETE ("done")
 * weeks, oldest first — period-picker-independent (spec D3: the queue/flow
 * band is fixed to a trailing-weeks basis, the same way netFlowPerWeek_ and
 * the masthead already are; a Month/Quarter picker selection must not change
 * what "the last 8 weeks" means here). Mirrors allPeriods_'s own
 * gridWeeks-status lookup rather than depending on donePeriods_(), which is
 * shaped by STATE.period.
 */
function trailingCompleteWeeks_(n) {
  var st = {};
  (MODEL.meta.gridWeeks || []).forEach(function (wk) { if (wk && wk.iso) st[wk.iso] = wk.status; });
  var isos = allIsoWeeks_().filter(function (iso) { return (st[iso] || "done") === "done"; });
  return isos.slice(Math.max(0, isos.length - n));
}

/**
 * How far the ORG clear rate is from publishing, mirrored client-side from
 * MODEL.arrivalWeeks — the same trailing window and the same "a null week is
 * a gap, a zero week is data" rule clearRateMedian_ (Code.js) applies, so the
 * client can state "needs N more weeks" without duplicating the rate itself.
 * @returns {{n:number, minN:number, need:number}}
 */
function orgClearRateGap_() {
  var weeks = completeArrivalWeeks_();   // in-flight week excluded — see the helper
  var win = MODEL.meta.clearRateWeeks || 8;
  var trailing = weeks.slice(Math.max(0, weeks.length - win));
  var n = trailing.filter(function (w) { return w && typeof w.resolved === "number"; }).length;
  return { n: n, minN: CLEAR_RATE_MIN_N_, need: Math.max(0, CLEAR_RATE_MIN_N_ - n) };
}

/**
 * The ASSIGNED clear rate — median of the last CLEAR_RATE_WEEKS complete
 * weeks of throughputBuckets_ CLEARED COUNTS (nAll, not estHrs), under the
 * ACTIVE FILTERS. This is the second of the band's two denominators (D-two-
 * denominators): the sub-row divides its filtered numerator by this, never by
 * the ORG rate — a filtered numerator over an org-wide denominator would
 * belong to neither population.
 * @returns {number|null} null under CLEAR_RATE_MIN_N_ usable weeks
 */
function assignedClearRate_() {
  var win = MODEL.meta.clearRateWeeks || 8;
  var isos = trailingCompleteWeeks_(win);
  if (isos.length < CLEAR_RATE_MIN_N_) return null;
  var vals = isos.map(function (iso) {
    return bucketsFor_(MODEL.throughputBuckets || [], [iso]).nAll;
  });
  return medianOf_(vals);
}

/**
 * Three-segment queue ruler, hand-rolled SVG (no CDN, no library — a blocked
 * external request inside the HtmlService iframe means an empty chart, the
 * same reason every chart in the CHART KIT above is a string of inline SVG
 * rather than a call into a library). Scaled in WEEKS at the ORG clear rate,
 * because the ruler's total — assigned + unowned — IS the ORG total, the same
 * population the hero triplet describes.
 *
 * NO target line (D11) — the operating band (o.std, from stdFor_(coverSeries_(),
 * …), the SAME series the masthead's depth finding judges) shades instead, and
 * is omitted outright while the norm is unpublishable.
 *
 * @param {{wipN:number, todoN:number, unItems:?number, rate:?number,
 *           std:?Object, onDrill:?string}} o
 */
function queueRulerSvg_(o) {
  var rate = o.rate;
  // rate === null → genuinely unmeasured (not enough clearing history) — the
  // ruler can't be scaled in weeks at all. rate === 0 is a DIFFERENT, REAL
  // state (an all-zero clearing week is a measured zero, per
  // clearRateMedian_'s contract) — dividing by it here would produce Infinity
  // rather than the "needs N more weeks" message a falsy check used to give
  // it, so it gets its own honest message instead of either (Task 16B review
  // finding: rate === 0 was being collapsed into rate === null).
  if (rate === null || rate === undefined) {
    var gap = orgClearRateGap_();
    return '<div class="emptyState">Can\'t scale the ruler in weeks yet — needs ' + gap.need +
      ' more week' + (gap.need === 1 ? "" : "s") + ' of clearing history (' + gap.n + ' of ' +
      gap.minN + ' so far).</div>';
  }
  if (rate === 0) {
    return '<div class="emptyState">Clearing rate is 0/wk this window — the queue isn\'t draining ' +
      'at all, so it can\'t be scaled in weeks.</div>';
  }
  var hasUnowned = o.unItems !== null && o.unItems !== undefined;
  var wipW = o.wipN / rate, todoW = o.todoN / rate;
  var unW = hasUnowned ? o.unItems / rate : 0;
  var totalW = wipW + todoW + unW;
  var domainMax = Math.max(8, Math.ceil(totalW) + 1);
  // Geometry trimmed 2026-08-07 (92 → 68 tall, 34 → 24 bar): paired with the
  // .backlogRuler width cap in CSS, the ruler went from ~236px of Executive-tab
  // height to ~68px. The bar stays thick enough to carry its in-segment counts
  // and its click target (the unowned segment drills to Actions) — the fat came
  // from the empty margin above the bar, not from the bar.
  var W = 760, H = 68, L = 8, R = 8, barH = 24, barY = 16;
  var pw = W - L - R;
  function x(wk) { return L + Math.max(0, Math.min(domainMax, wk)) / domainMax * pw; }
  var s = '<svg class="chart backlogRuler" viewBox="0 0 ' + W + ' ' + H +
    '" role="img" aria-label="queue depth in weeks, three segments: active, planned, runway">' +
    '<defs><pattern id="unownedHatch" width="6" height="6" patternTransform="rotate(45)" ' +
    'patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="var(--ivory)"/>' +
    '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--c-bad)" stroke-width="2"/></pattern></defs>';
  for (var g = 0; g <= domainMax; g += 2) {
    s += '<line class="gl" x1="' + x(g) + '" x2="' + x(g) + '" y1="' + (barY - 6) + '" y2="' +
      (barY + barH + 6) + '"/><text class="axis" x="' + x(g) + '" y="' + (barY + barH + 20) +
      '" text-anchor="middle">' + g + 'w</text>';
  }
  // Operating band — no invented reference. Drawn ONLY when the norm publishes.
  if (o.std && o.std.ok) {
    s += '<rect x="' + x(o.std.lo) + '" y="' + (barY - 6) + '" width="' +
      Math.max(1, x(o.std.hi) - x(o.std.lo)) + '" height="' + (barH + 12) +
      '" fill="var(--c-ref)" opacity="0.16"><title>operating band ' + n1Dh_(o.std.lo) + "–" +
      n1Dh_(o.std.hi) + "w — where this queue normally sits</title></rect>";
  }
  var x0 = x(0), x1 = x(wipW), x2 = x(wipW + todoW), x3 = x(totalW);
  function segLabel(a, b, text) {
    return (b - a > 24)
      ? '<text class="val" x="' + ((a + b) / 2) + '" y="' + (barY + barH / 2 + 4) +
        '" text-anchor="middle">' + text + "</text>" : "";
  }
  s += '<rect x="' + x0 + '" y="' + barY + '" width="' + Math.max(0, x1 - x0) + '" height="' + barH +
    '" fill="var(--seg-bill)"><title>Active — in progress (assigned WIP) — ' + nfDh_(o.wipN) + ' items, ' +
    n1Dh_(wipW) + 'w</title></rect>' + segLabel(x0, x1, nfDh_(o.wipN));
  s += '<rect x="' + x1 + '" y="' + barY + '" width="' + Math.max(0, x2 - x1) + '" height="' + barH +
    '" fill="var(--ivory)"><title>Planned — queued (assigned To Do) — ' + nfDh_(o.todoN) + ' items, ' +
    n1Dh_(todoW) + 'w</title></rect>' + segLabel(x1, x2, nfDh_(o.todoN));
  if (hasUnowned && o.unItems > 0) {
    var drillable = !!o.onDrill;
    s += '<rect x="' + x2 + '" y="' + barY + '" width="' + Math.max(0, x3 - x2) + '" height="' + barH +
      '" fill="url(#unownedHatch)"' + (drillable ? ' style="cursor:pointer" onclick="' + o.onDrill + '"' : "") +
      '><title>Runway — backlog with no assignee yet: ' + nfDh_(o.unItems) + ' items of future sprints, ' + n1Dh_(unW) + "w" +
      (drillable ? " — click to open" : "") + '</title></rect>' + segLabel(x2, x3, nfDh_(o.unItems));
  }
  s += "</svg>";
  var caption = '<div class="cellSub" style="margin-top:2px">Active ' + nfDh_(o.wipN) +
    " · Planned " + nfDh_(o.todoN) + " · Runway " +
    (hasUnowned ? nfDh_(o.unItems) : "not measured this refresh") +
    " · scaled in weeks at " + nfDh_(Math.round(rate)) + "/wk.</div>";
  return s + caption;
}

/** One backlog-band tile: label + scope tag, a hero VALUE (already formatted —
    never a bare percentage, since inventory/net-flow/weeks-to-clear are not
    percentages), and one context line. Deliberately NOT tileHtml_: that
    grammar hardcodes `Math.round(headlinePct) + "%"` and a RAG verdict against
    a target, neither of which this band's numbers carry (D11 — no target rule
    anywhere in this band) — the same reason flowTileHtml_ was written apart
    from tileHtml_ for the other unit-bearing metrics. */
function backlogTileHtml_(label, big, context, scope, trendHtml) {
  // House "unavailable" convention (tileHtml_/flowTileHtml_ both apply it):
  // a "—" state gets the dashed placeholder shell, not a fully-formed tile —
  // otherwise a Net-flow or Weeks-to-clear tile with nothing to show looks
  // like a real measurement on a projector (Task 16B review finding).
  var ph = big === "—" ? " ph" : "";
  return '<div class="tile' + ph + '"><div class="lbl">' + esc_(label) + scopeTag_(scope) + '</div>' +
    '<div class="big">' + big + '</div>' +
    (context ? '<div class="cmp">' + context + '</div>' : "") +
    // `trendHtml` (Task 17): the Inventory tile's only caller, so a Net-flow
    // or Weeks-to-clear tile gets no extra slot — those two are already
    // derived FROM the same history, and a second trend line under each
    // would restate the first rather than add information.
    (trendHtml ? trendHtml : "") + '</div>';
}

/**
 * The hero's inventory-history sparkline (Task 17 — regression fix). Tasks
 * 5/7 built MODEL.inventoryHistory (a 26-week reconstructed walkback,
 * inventoryWalkback_ in Code.js) explicitly so the hero would ship WITH a
 * trend; Task 16B's retirement of the Backlog/WIP flow tiles removed the only
 * place a queue-depth history was ever drawn and nothing replaced it — a
 * headline with no context is a headline nobody can act on.
 *
 * Only the newest point in the walkback is a measured snapshot; every other
 * point is inferred backwards from the arrivals feed (created − resolved per
 * week). "An unlabelled change of basis in a chart is worse than no chart" —
 * the same rule the ✎ definition-changed marker applies to a formula change —
 * so sparkHtml_'s `flags` option draws the reconstructed run dashed/hollow and
 * the measured point solid, and every point's tooltip says which it is in
 * words, not just pixels.
 *
 * Draws NOTHING (with a stated reason) when the walkback is unanchorable —
 * inventoryWalkback_ returns [] with no measurable anchor or no arrivals
 * history at all (Code.js `_test_modelAssembly_`, part 3) — never a flat line
 * at zero, which would read as a measured, stable queue instead of an absent
 * one.
 * @returns {string} an empty string is never returned FOR NO REASON — the
 *   no-history branch always renders its own explanation instead.
 */
function inventoryHistoryTrendHtml_() {

/**
 * "Weeks to clear" at a given clearing rate — shared by the hero and the
 * assigned sub-row so the null-vs-zero distinction is fixed in exactly one
 * place (Task 16B review finding).
 *
 * `rate === null` means "not enough clearing history yet" — genuinely
 * unmeasured, renders "—". `rate === 0` is a REAL measured rate:
 * clearRateMedian_'s contract (Code.js, unit-tested) is explicit that an
 * all-zero series is a measured zero, not missing history. Nothing clears at
 * a rate of zero, so the queue is UNBOUNDED, not unmeasured — collapsing the
 * two under a falsy check produced self-contradictory copy ("—" beside "needs
 * 0 more weeks"). Returns null (not "—") for the null-rate case so callers can
 * tell "no string" apart from "the string IS the em-dash" and write their own
 * reason alongside it.
 * @returns {?string} "∞w" / "0w" / "N.Nw", or null when rate itself is unmeasured
 */
function weeksToClearStr_(total, rate) {
  if (rate === null || rate === undefined) return null;
  if (rate === 0) return total > 0 ? "∞w" : "0w";
  return n1Dh_(total / rate) + "w";
}
