/** Paints the control in place, or removes it for a viewer with nothing to hide. */
function renderConfBtn_() {
  var slot = document.getElementById("confSlot");
  if (!slot) return;
  slot.innerHTML = confEligible_() ? confBtnHtml_() : "";
  var b = document.getElementById("btnConf");
  if (b) b.onclick = toggleConfidential_;
}

/** The banner on the Executive tab while the mode is on. The header control
    says the mode; this says what it COST, so a reader who wonders where the
    utilization card went is answered on the page rather than by a colleague. */
function confBannerHtml_() {
  if (!confHidden_()) return "";
  return '<div class="confBanner">👁 <b>Names and job titles are blurred.</b> ' +
    "Every KPI, chart and tab is unchanged — only the people are anonymised. " +
    '<a href="#" onclick="setConfidential_(false);return false">Show names</a> ' +
    "when you have finished presenting. " +
    '<span class="cellSub">This is a courtesy for screen-sharing, not a security control: ' +
    "the names are still in the page source and in any CSV you export.</span></div>";
}

/** A view the current viewer is allowed to open.
    ROLE ONLY. The confidential switch deliberately does NOT reach this: it
    anonymises people, it does not remove analysis. Hiding whole tabs was the
    first cut of that feature and it was wrong — see the note on confHidden_. */
function viewAllowed_(v) {
  return !v.roles || v.roles.indexOf((MODEL && MODEL.viewerRole) || "") !== -1;
}

/**
 * ── EXECUTIVE SUB-TABS (2026-08-17) ─────────────────────────────────────────
 * Declared once, like VIEWS, so the strip, the router and the pane toggling all
 * read one list. `pane` is the wrapper each half lives in.
 */
var EXEC_TABS_ = [
  { id: "health", label: "Health & Actions", pane: "execHealth",
    hint: "The four outcome numbers and the breakdown that says where they are coming from — plus the two routes to act on it." },
  { id: "flow", label: "Backlog & Flow", pane: "execFlow",
    hint: "The queue shape — active, planned and runway — and the flow figures behind the outcome KPIs." },
];

/**
 * Paints the sub-tab strip and shows the selected half.
 *
 * BOTH halves are rendered on every pass and only their visibility toggles.
 * renderFlow_ writes into containers on both of them in one call, so rendering
 * "only the visible half" would mean either splitting that renderer or leaving
 * one pane holding a previous filter's numbers — and a hidden pane with stale
 * figures is what a PNG export or a find-in-page would pick up.
 */
function renderExecTabs_() {
  var bar = document.getElementById("execTabs");
  if (!bar) return;
  bar.innerHTML = "";
  EXEC_TABS_.forEach(function (t) {
    var b = document.createElement("button");
    b.className = "subtab" + (STATE.execTab === t.id ? " on" : "");
    b.textContent = t.label;
    b.title = t.hint;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", STATE.execTab === t.id ? "true" : "false");
    b.onclick = function () { setExecTab_(t.id); };
    bar.appendChild(b);
  });
  EXEC_TABS_.forEach(function (t) {
    var el = document.getElementById(t.pane);
    if (el) el.hidden = (t.id !== STATE.execTab);
  });
}

function setExecTab_(id) {
  STATE.execTab = id;
  renderExecTabs_();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function buildTabs_() {
  var bar = document.getElementById("tabBar");
  bar.innerHTML = "";
  VIEWS.forEach(function (v) {
    if (!viewAllowed_(v)) return;
    var b = document.createElement("button");
    b.className = "tab" + (STATE.view === v.id ? " on" : "");
    // innerHTML, not textContent: the row is a decorative mark plus a label
    // that the collapsed rail hides. The mark is aria-hidden and the label
    // carries the accessible name, so a screen reader reads "Executive", never
    // "black diamond Executive" — and the name survives the collapse, because
    // .tabLbl is hidden with display:none rather than removed from the DOM.
    b.innerHTML = '<span class="tabDot" aria-hidden="true">' + (v.dot || "•") + "</span>" +
      '<span class="tabLbl">' + esc_(v.label) + "</span>";
    b.title = v.hint;
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", STATE.view === v.id ? "true" : "false");
    b.onclick = function () { switchView_(v.id); };
    bar.appendChild(b);
  });
}

/**
 * Sidebar collapse. Persisted in localStorage so the choice survives a reload —
 * a rail that silently re-expands on every refresh is a setting the user has to
 * make again every time, which is the same as not having one.
 *
 * Guarded: HtmlService sandboxes can throw on localStorage access, and the
 * render-smoke DOM stub has no classList — neither is a reason for navigation
 * to fail, so both degrade to "expanded, not persisted".
 */
var NAV_KEY_ = "dhNavCollapsed";
function setNavCollapsed_(on) {
  var b = document.body;
  if (b && b.classList) b.classList.toggle("navCollapsed", !!on);
  var btn = document.getElementById("btnNav");
  if (btn) {
    btn.title = on ? "Expand the sidebar" : "Collapse the sidebar to icons";
    btn.setAttribute("aria-expanded", on ? "false" : "true");
    btn.innerHTML = '<span class="tabDot" aria-hidden="true">' + (on ? "››" : "‹‹") + "</span>" +
      '<span class="navToggleLbl">Collapse</span>';
  }
  try { localStorage.setItem(NAV_KEY_, on ? "1" : "0"); } catch (e) { /* sandboxed */ }
}
function toggleNav_() {
  var b = document.body;
  var on = !(b && b.classList && b.classList.contains("navCollapsed"));
  setNavCollapsed_(on);
}

/**
 * Open a view. The role gate is enforced HERE, not just by hiding the tab, so
 * every other entry point — openRoster_() from the Executive pulse, and any
 * future deep link — routes through this one function.
 */
function switchView_(id) {
  var v = viewDef_(id);
  if (!viewAllowed_(v)) v = VIEWS[0];
  STATE.view = v.id;
  VIEWS.forEach(function (x) {
    var el = document.getElementById(x.pane);
    if (el) el.style.display = x.id === v.id ? "" : "none";
  });
  // Motion (spec §7): the shown pane cross-fades in; strip paneIn from every
  // pane first (including the one about to be shown) so re-entering a view
  // always restarts the animation rather than a no-op class re-add.
  VIEWS.forEach(function (x) {
    var pel = document.getElementById(x.pane);
    if (pel) pel.className = pel.className.replace(/ ?paneIn/, "");
  });
  var pane = document.getElementById(v.pane);
  if (pane) pane.className += " paneIn";
  // The scope chip describes the FILTERED population. Actions now mixes
  // filtered content (the signals roster) with the deliberately
  // whole-population gaps queue/matrix — the chip stays visible for the
  // filtered majority, and hygPanel states its own whole-population scope
  // inline (leaverNoteHtml_/the "Whole-population view" caption).
  document.getElementById("scopeChip").style.display =
    (v.id === "access") ? "none" : "";
  buildTabs_();
  renderAll_();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
var POP_LABELS = { fte: "FTE", crew: "Crew", all: "All" };
// `focus` (Plan / Billable / Non-bill) lived here as the People grid's value
// lens. The grid went on 2026-08-05 and the lens was kept "for the roster that
// replaces it" — but the roster never read it, so for twelve days the chips
// changed nothing but their own highlight. Deleted 2026-08-17.

/** Population lens — one of the universal filters (they ALL scope the
    utilization tiles and the grid together, via passesFilters_). */
function popMatch_(p) {
  if (STATE.pop === "all") return true;
  return STATE.pop === "crew" ? p.isCrew === true : p.isCrew !== true;
}

// role: "all" (default) | "ic" | "mgr" — managers = M-level job codes
// ("07.M5.1 - …"); managers often plan without tracking much, so the IC view
// removes that drag from delivery rates (user feedback 2026-07-31).
var ROLE_LABELS = { all: "All", ic: "IC", mgr: "Mgr" };
function roleMatch_(p) {
  if (STATE.role === "ic") return p.isManager !== true;
  if (STATE.role === "mgr") return p.isManager === true;
  return true;
}

function esc_(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/**
 * The header freshness line: what the DATA's age is, plus the model-staleness
 * warning when that also applies.
 *
 * Two clocks, and conflating them is the bug this function exists to prevent:
 *   · meta.dataAsOf.jira — when the Jira export last wrote Jira Raw. Moves daily.
 *     This is what a reader means by "how current is this?".
 *   · meta.generatedAt   — when this model was assembled. The warmer resets it
 *     every 30 min, so it is always fresh and always uninformative.
 *
 * And one thing that is NOT a clock at all:
 *   · meta.jiraExporter — which RULES the export was built under. An export can
 *     be an hour old and still carry sandbox projects, because the exporter that
 *     wrote it predates the exclusion. Fresh and wrong at the same time is a
 *     state neither clock can show, so it gets its own line.
 *
 * AGE COMES FROM THE SERVER (`jiraAgeH`), never from a browser-clock diff: two
 * people in one review would otherwise read different staleness verdicts off the
 * same payload because one laptop's clock drifts. The wall-clock time IS
 * localised — same instant, the reader's own timezone — and always carries its
 * timezone name, because the exporter's "03:00" is meaningless to SEA without it.
 *
 * Three states: fresh (muted, informational), stale (warn — a scheduled export
 * was missed), unknown (muted — an older exporter or a cropped footer; NOT a
 * warning, because a reader can do nothing about it and a false alarm here
 * teaches them to ignore the real one).
 *
 * Pure over (meta, modelStale, builtAt) so render-smoke can pin every state.
 * @returns {{html:string, warn:boolean, title:string}}
 */
function dataAsOfView_(meta, modelStale, builtAt) {
  var d = (meta && meta.dataAsOf) || {};
  var parts = [], warn = false, tips = [];
  function localStamp_(iso) {
    return new Date(iso).toLocaleString([], {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
      timeZoneName: "short" });
  }
  function ageWords_(h) {
    if (h === null || h === undefined) return "";
    if (h < 1) return "under an hour ago";
    if (h < 48) return Math.round(h) + "h ago";
    return Math.round(h / 24) + " days ago";
  }
  if (d.jira) {
    warn = d.jiraStale === true;
    parts.push((warn ? "⚠ " : "📅 ") + "Data as of " + esc_(localStamp_(d.jira)) +
               " · " + esc_(ageWords_(d.jiraAgeH)));
    tips.push("Jira export last wrote the Jira Raw tab at " + localStamp_(d.jira) +
      " (" + d.jiraAgeH + "h ago). This is the age of the DATA — the four delivery " +
      "cards cannot be more current than this.");
    if (warn) {
      parts.push("export may have failed");
      tips.push("Older than " + (meta.jiraExportStaleH || 30) + "h, so a scheduled " +
        "export run was missed — check the Jira Backlog.js trigger. Every Jira-based " +
        "number on screen describes the world as it was at the stamp above.");
    }
  } else if (d.jiraUnknown) {
    parts.push("📅 Data refresh time unknown");
    tips.push("The Jira Raw tab carries no readable \"Generated:\" footer, so the age of " +
      "the data cannot be stated. Run probeDeliverySources for the diagnosis. Not a " +
      "staleness warning — the data may be current; we just cannot prove it.");
  }
  // ── WHICH RULES BUILT THE DATA ───────────────────────────────────────────
  // Only ever shown when the export is BEHIND the minimum — an up-to-date
  // exporter is the expected case and needs no line, and a version number on
  // screen every day is noise that teaches people to skip the whole strip.
  //
  // It names the CONSEQUENCE, not the version mismatch. "3.11.0 < 3.14.0" tells
  // a reader nothing they can act on; "the backlog counts include sandbox
  // projects" tells them which numbers to distrust and that re-running the
  // export fixes it.
  var xp = meta.jiraExporter || {};
  if (xp.stale) {
    warn = true;
    parts.push("⚠ built by an older exporter");
    tips.push("The Jira export was written by Jira Backlog.js " +
      (xp.version ? "v" + xp.version : "a version before stamping began") +
      ", older than the v" + xp.min + " these figures assume. That exporter still " +
      "exported sandbox and test projects, so the open backlog, weeks-to-clear and " +
      "the unrouted-epics alert are all overstated. Deploy the current " +
      "Jira Backlog.js and re-run the export — the delivery, quality and " +
      "utilization metrics are unaffected.");
  }

  // The model-rebuild warning is a SEPARATE condition (NFR-7) and keeps its own
  // consequence: trend comparisons are suppressed while it holds. Shown alongside
  // the data age rather than instead of it — they fail independently.
  if (modelStale) {
    warn = true;
    parts.push("⚠ dashboard not rebuilt since " + esc_(localStamp_(builtAt.toISOString())));
    tips.push("The model itself has not been reassembled inside the stated refresh " +
      "cadence" + (meta.refreshEveryMin ? " (every " + meta.refreshEveryMin + " min)" : "") +
      ", so trend comparisons are suppressed until it refreshes.");
  }
  (meta.sources || []).forEach(function (s) { tips.push(s.system + " → " + s.feeds); });
  // ── STANDING CADENCE NOTE (user request 2026-08-28) ────────────────────────
  // The two feeds refresh on different clocks and readers kept asking which:
  // the Jira backlog export runs HOURLY (runJiraEpicTrackerLight), the Tempo
  // hours exports run DAILY. Rides the freshness line whenever one renders —
  // the stamps say when, this says how often. A pre-v16 payload with no
  // dataAsOf still renders NOTHING: a cadence claim over data whose age cannot
  // be stated would be the exact overstatement this strip exists to prevent.
  if (d.jira || d.jiraUnknown) parts.push('<span title="The Jira backlog export refreshes hourly ' +
    "(a nightly full pass rebuilds history); the Tempo planned/tracked hours " +
    'exports refresh daily. The stamps on this line say when each last ran.">' +
    "backlog updates hourly · Tempo hours daily</span>");
  return { html: parts.join(' <span style="opacity:.5">·</span> '),
           warn: warn, title: tips.join("\n\n") };
}

/**
 * ── COLD-START PROGRESS ────────────────────────────────────────────────────
 *
 * A warm load returns in about a second. A COLD one rebuilds the whole model
 * server-side — reading two large Tempo grids, Jira Raw, NS Billable and the
 * roster, then joining them — and that has been measured in MINUTES, not the
 * "minute or two" this panel used to claim. Understating it was its own
 * problem: a reader told to expect two minutes starts refreshing at three.
 *
 * Three things this has to do, in order of how much they matter:
 *
 *   1. STOP THE REFRESHING. Every refresh abandons the in-flight rebuild and
 *      starts another one. It is not neutral — it is the single action that
 *      makes the wait longer, and it is what an unattended progress message
 *      provokes. That instruction leads, and it says WHY.
 *   2. PROVE IT IS STILL MOVING. A static sentence is indistinguishable from a
 *      hung tab after ninety seconds. A live elapsed clock and a moving bar
 *      cost nothing and are the difference between "working" and "broken".
 *   3. SAY WHAT IS HAPPENING, TRUTHFULLY. The stage text below is derived from
 *      the real build order, so it describes what the server is actually doing
 *      rather than inventing reassurance.
 *
 * What it deliberately does NOT do is show a percentage. There is no progress
 * signal to read — `google.script.run` is a single opaque round trip — so any
 * bar that filled toward 100% would be fabricating one and would then sit at
 * 95% for two minutes, which is worse than no bar at all.
 */
var LOAD_STAGES_ = [
  { at: 0,   head: "Loading delivery health…",
    note: "" },
  { at: 8,   head: "Building the data model",
    note: "Nothing is cached for this view yet, so the server is rebuilding it from source: " +
          "the Tempo tracked and planned grids, Jira Raw, NetSuite billable hours and the roster." },
  { at: 45,  head: "Still building — this is the slow path",
    note: "A cold rebuild reads several large sheets end to end and typically takes " +
          "<b>a few minutes</b>. <b>Do not refresh.</b> Refreshing abandons this rebuild and " +
          "starts a new one from scratch, which is the one thing that makes the wait longer." },
  { at: 150, head: "Still building — joining the sources",
    note: "<b>Do not refresh.</b> The page will fill in on its own the moment the model is ready. " +
          "Once it does, it is cached for about an hour and the next load takes a second or two — " +
          "for you and for everyone else." },
  { at: 330, head: "Taking longer than expected",
    note: "This is past a normal cold rebuild. Leave the tab open a little longer — it may still " +
          "land. If it does not, the model may be failing to build rather than running slowly: " +
          "tell Alex López, and mention roughly how long you waited." },
];

/** The in-flight cold-start clock, so a second load can cancel the first. */
var loadTick_ = null;

function loadData(force) {
  var loadEl = document.getElementById("loading");
  loadEl.style.display = "";
  document.getElementById("app").style.display = "none";
  // ↻ Refresh while a load is already in flight would otherwise leave the first
  // interval running: two clocks writing the same #loadElapsed and #loadHead,
  // the older one winning at random and reporting the WRONG elapsed time.
  if (loadTick_ !== null) clearInterval(loadTick_);
  var t0 = Date.now();
  var stageIdx = -1;
  loadEl.innerHTML =
    '<div class="loadWrap">' +
      '<div class="loadHead" id="loadHead">Loading delivery health…</div>' +
      '<div class="loadElapsed" id="loadElapsed"></div>' +
      '<div class="loadBar"><i></i></div>' +
      '<div class="loadNote" id="loadNote"></div>' +
    "</div>";

  // One timer drives both the clock and the stage text — a second interval for
  // the copy could drift out of step with the seconds the reader is watching.
  var tick = loadTick_ = setInterval(function () {
    if (loadEl.style.display === "none") { clearInterval(tick); return; }
    var s = Math.round((Date.now() - t0) / 1000);
    var el = document.getElementById("loadElapsed");
    if (el) el.textContent = s < 60 ? s + "s elapsed"
      : Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s elapsed";
    var next = stageIdx;
    for (var i = 0; i < LOAD_STAGES_.length; i++) if (s >= LOAD_STAGES_[i].at) next = i;
    if (next === stageIdx) return;
    stageIdx = next;
    var st = LOAD_STAGES_[stageIdx];
    var h = document.getElementById("loadHead"), n = document.getElementById("loadNote");
    if (h) h.textContent = st.head;
    if (n) n.innerHTML = st.note;
  }, 1000);

  google.script.run
    .withSuccessHandler(function (m) {
      clearInterval(tick);
      if (m.error) { document.getElementById("loading").textContent = "⚠️ " + m.error; return; }
      MODEL = m;
      document.getElementById("loading").style.display = "none";
      document.getElementById("app").style.display = "";
      MODEL._exCache = {};   // per-person triage flags, recomputed per payload
      // Date + timezone matter on a dashboard with AMER/EMEA/SEA/ANZ filters;
      // seconds don't (director feedback).
      var builtAt = new Date(m.meta.generatedAt);
      // NFR-7: a figure older than 48h presented as current is worse than no
      // figure. Flag it, and suppress every trend comparison while it holds —
      // a delta measured across a gap in refreshes is a fiction.
      MODEL._stale = (Date.now() - builtAt.getTime()) > 48 * 3600 * 1000;
      var asOfEl = document.getElementById("asOf");
      // ── DATA FRESHNESS, ALWAYS ON (user request 2026-08-04) ──
      // A "Data as of" line WAS removed on 2026-08-04 for reading as noise — but
      // that line reported meta.generatedAt, the model rebuild, which the cache
      // warmer resets every 30 minutes and which therefore says nothing. This one
      // reports the Jira export's own "Generated:" stamp: it moves once a day, it
      // is the answer to "how current is this?", and it is the one clock that can
      // be days stale while the dashboard looks brand new. Different number,
      // different reason to be on screen.
      var af = dataAsOfView_(m.meta, MODEL._stale, builtAt);
      asOfEl.style.display = "";
      asOfEl.innerHTML = af.html;
      asOfEl.className = "sub" + (af.warn ? " stalenote" : "");
      asOfEl.title = af.title;
      // Stale cache from before the period toggle shipped → no meta.periods;
      // fall back to weekly until a refresh/warm rebuilds the model.
      if (!m.meta.periods) STATE.period = "week";
      syncTypePop_();            // Open on the current week, Resolved on a complete one
      buildFilters_();
      switchView_(STATE.view);   // paints the tab bar, the pane and everything in it
      // Motion (spec §7), ONCE per load: stagger-reveal the tiles, then settle.
      // classList (not className =) because body carries no other class today
      // (theme lives on <html data-theme>, not body) but might one day — this
      // way a future body class survives the entrance sequence instead of
      // being clobbered.
      document.body.classList.add("entering");
      setTimeout(function () {
        document.body.classList.remove("entering");
        document.body.classList.add("loaded");
      }, 900);
    })
    .withFailureHandler(function (e) {
      clearInterval(tick);
      // A real failure is the ONE case where refreshing is the right move, so
      // it says so plainly — the opposite of the in-flight advice above, and
      // the reason that advice is scoped to the waiting state rather than
      // being a standing rule.
      var waited = Math.round((Date.now() - t0) / 1000);
      document.getElementById("loading").innerHTML =
        '<div class="loadWrap"><div class="loadHead">⚠️ Load failed</div>' +
        '<div class="loadNote">' + esc_(e.message) + "<br><br>" +
        "It stopped after " + waited + "s. <b>Now</b> is the time to retry — use ↻ Refresh. " +
        "If it fails again the same way, the model is not building; tell Alex López and quote " +
        "that message.</div></div>";
    })
    .getDeliveryData(!!force);
}

// The old headPeriodIdx_(done) is GONE (2026-08-06). It indexed a complete-only
// list, so there was no index a forward window could be given. Every analysis
// surface now calls analysisHead_() — see the FORWARD WINDOWS block — which
// returns the selected window AND the trend anchor separately, because those
// stopped being the same thing the moment an unfinished window became pickable.

function setPeriodIdx_(v) {
  STATE.periodIdx = (v === "" || v === null) ? null : Number(v);
  syncTypePop_();           // the roster follows the window — see syncTypePop_
  renderAll_();
}

function buildPeriodChips_() {
  var pc = document.getElementById("periodChips");
  pc.innerHTML = "";
  var grp = document.getElementById("periodGroup");
  grp.style.display = "";
  // Unit chips need the periods payload (a stale pre-toggle cache is weekly
  // only); the analysis-period PICKER below works either way — weeks are
  // complete periods too, so the group is never an empty dangling label.
  if (MODEL.meta.periods) {
    ["week", "month", "quarter"].forEach(function (k) {
      var b = document.createElement("span");
      b.className = "chip" + ((STATE.period === k) ? " on" : "");
      b.textContent = PERIOD_LABELS[k];
      b.onclick = function () { setPeriod_(k); };
      pc.appendChild(b);
    });
  }
  // ── Analysis-period picker (user request 2026-08-04, forward windows
  //    2026-08-06) ────────────────────────────────────────────────────────────
  // The unit chips choose the GRANULARITY; this chooses the WINDOW that the KPI
  // cards, the comparison, the signals roster and the brief analyse.
  //
  // Three groups, because they are three different kinds of answer and a flat
  // list would let a reader quote a planning window as a result:
  //   Complete    — graded normally. "Latest complete" stays the default.
  //   In progress — the current week/month/quarter: what the team is on now.
  //   Planning    — the next ≤2 weeks: is the fortnight actually covered?
  var done = donePeriods_(), all = analysisPeriods_();
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  var sel = document.createElement("select");
  sel.id = "periodPick";
  sel.title = "Which window every analysis surface reads. Complete " + unit +
    "s are graded against target; the current " + unit +
    " is published but never compared to the one before it; a planning week " +
    "measures the plan, not delivery.";
  // The default entry NAMES what the default is (user 2026-09-09): the current
  // period so far when the payload has one, the latest complete period
  // otherwise. The former "In progress" group is gone — it held exactly the
  // window this entry now is, and one window under two names is a picker that
  // teaches readers not to trust it.
  var nowP = DEFAULT_WINDOW_ === "now" ? nowPeriod_() : null;
  var opt0 = document.createElement("option");
  opt0.value = ""; opt0.textContent = nowP ? "◐ Current " + unit + " — so far" : "Latest complete";
  sel.appendChild(opt0);
  function group_(label, from, to, decorate) {
    if (to < from) return;
    var g = document.createElement("optgroup");
    g.label = label;
    for (var i = to; i >= from; i--) {
      var op = document.createElement("option");
      op.value = String(i);
      op.textContent = decorate ? decorate(all[i]) : all[i].label;
      if (STATE.periodIdx === i) op.selected = true;
      g.appendChild(op);
    }
    sel.appendChild(g);
  }
  var nPlan = planWeeks_().length;
  var nowAt = all.length - nPlan - 1;          // −1 when there is no in-flight period
  group_("Planning · next " + (nPlan === 1 ? "week" : nPlan + " weeks"),
         all.length - nPlan, all.length - 1,
         function (p) { return "▸ " + p.label + " — plan"; });
  // The in-flight period is opt0 above whenever it is the default — see the
  // note there. Under the "done" default it keeps its own group, as before.
  if (!nowP && nowAt >= done.length) {
    group_("In progress", nowAt, nowAt, function (p) { return "◐ " + p.label + " — so far"; });
  }
  group_("Complete", 0, done.length - 1);
  sel.onchange = function () { setPeriodIdx_(this.value); };
  pc.appendChild(sel);
}

function setPeriod_(k) {
  if (STATE.period === k) return;
  STATE.period = k;
  STATE.expandedWeeks = {}; // period keys change — stale expansions/drills reset
  STATE.openDetail = {};
  STATE.openDetailAll = {};
  STATE.periodIdx = null;   // a picked index means a different window per unit — reset to latest
  syncTypePop_();
  buildPeriodChips_();
  renderAll_();
}

function buildRoleChips_() {
  var rc = document.getElementById("roleChips");
  rc.innerHTML = "";
  ["all", "ic", "mgr"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.role === k) ? " on" : "");
    b.textContent = ROLE_LABELS[k];
    b.onclick = function () {
      if (STATE.role === k) return;
      STATE.role = k;
      // Full cascade rebuild, not just this strip (user report 2026-08-04:
      // "filters get stuck") — the region counts and the Team/PM/Family
      // dropdowns are computed against the lens, so they must follow it.
      buildFilters_();
      renderAll_();
    };
    rc.appendChild(b);
  });
}

function buildPopChips_() {
  var pc = document.getElementById("popChips");
  pc.innerHTML = "";
  ["fte", "crew", "all"].forEach(function (k) {
    var b = document.createElement("span");
    b.className = "chip" + ((STATE.pop === k) ? " on" : "");
    b.textContent = POP_LABELS[k];
    b.onclick = function () {
      if (STATE.pop === k) return;
      STATE.pop = k;
      // Full cascade rebuild, not just this strip (user report 2026-08-04:
      // "filters get stuck") — switching FTE/Crew/All must re-count the
      // region chips and re-cascade every dropdown, or the filter row keeps
      // describing the population you just left.
      buildFilters_();
      renderAll_();
    };
    pc.appendChild(b);
  });
}

/** Person's family label for the filter (blank roster family → Uncatalogued). */
function famName_(p) { return p.jobFamily || "Uncatalogued"; }

/** Roster job titles arrive as "07.M5.1 - Manager, Service Delivery" or
    "09.P3.Consultant" — the leading grade code is roster plumbing, not a
    title. Strip it for display; the full string stays in the tooltip and in
    the CSV. A title without the code prefix passes through untouched. */
function jobTitleDisp_(t) {
  t = String(t || "").trim();
  var clean = t.replace(/^\d{1,3}\.\s*(?:[A-Za-z]\d+(?:\.\d+)*)?[\s.\-–—]*/, "").trim();
  return clean || t;
}

// ── CASCADING FILTERS ────────────────────────────────────────
//
// Every audience dimension is declared once here. Each dropdown/chip strip is
// then populated from the people who pass every OTHER dimension — pick AMER and
// the Team, PM and Job-family lists collapse to the teams, PMs and families that
// actually exist in AMER. Clear it and the full lists return, so scenarios can be
// built up and unwound without ever landing on a combination that selects nobody
// by accident (user request 2026-08-03).
//
// Two rules make it safe rather than merely clever:
//   1. The ACTIVE value is always listed, even at zero — a selection may never
//      silently vanish from the control that set it.
//   2. Values with no one in the current slice are shown DISABLED under a
//      separate group, never deleted. A list that changes length under you is
//      how people lose trust in a filter.

/**
 * ── UNTAGGED BUCKETS — why every dimension needs one ──
 *
 * Region and Job family are single-valued and already have server-side
 * fallbacks ("Unassigned", "Uncatalogued"), so every person lands somewhere.
 * Team and PM are MEMBERSHIP LISTS and can be empty — and an empty list belongs
 * to no bucket at all.
 *
 * That silently broke the Executive comparison chart (user-reported 2026-08-03,
 * "charts do not show all records — we are missing PMs and Teams"): a person on
 * no team contributed to no bar, so the chart quietly described a subset of the
 * population with nothing on screen saying so. Ten untagged people out of forty
 * is a chart that is 25% wrong and looks complete.
 *
 * So an empty list resolves to an explicit bucket instead. It is a real,
 * selectable value everywhere — filter, dropdown, chart, drill-through — because
 * "who has no PM?" is a question worth being able to ask, and because the bars
 * must add up to the population or the chart is lying by omission.
 */
// `level` joins the untagged sentinels so an unclassified job code sorts and
// styles like every other gap rather than reading as a real seniority band —
// and so it is never hidden: a rising unclassified count means new job codes
// were created and nobody told Workforce Planning.
var UNTAGGED_ = { team: "(No team)", pm: "(No PM)", level: "(Unclassified)" };

/** True when a value is one of the untagged sentinels (styled + sorted apart). */
function isUntagged_(val) {
  for (var k in UNTAGGED_) if (UNTAGGED_[k] === val) return true;
  return false;
}

var FILTER_DIMS = {
  region: { label: "region",     vals: function (p) { return [p.region]; },
            all: function () { return MODEL.meta.regions || []; } },
  team:   { label: "team",
            vals: function (p) {
              var t = p.teams || [];
              return t.length ? t : [UNTAGGED_.team];
            },
            all: function () { return MODEL.meta.teams || []; } },
  pm:     { label: "PM",
            vals: function (p) {
              var m = p.pms || [];
              return m.length ? m : [UNTAGGED_.pm];
            },
            all: function () { return MODEL.meta.pms || []; } },
  family: { label: "job family", vals: function (p) { return [famName_(p)]; },
            all: function () { return MODEL.meta.families || []; } },
  // LEVEL BAND (user 2026-08-17): the grain the Workforce tab already reports
  // capacity on, so "On-Time by level" and "who is available at that level"
  // describe the same cohort rather than two similar-sounding ones. The band
  // is the server's own classification (dhBand_ — MGMT / SENIOR / CORE /
  // JUNIOR / UNKNOWN), never re-derived from the job title here: a second
  // parse of the same string is a second answer waiting to happen.
  //
  // all() is read off the POPULATION rather than meta, because there is no
  // meta.bands — and it is ordered seniority-first, not alphabetically, so the
  // chart's category gutter reads as a ladder.
  level:  { label: "level",
            vals: function (p) { return [levelName_(p)]; },
            all: function () {
              var seen = {};
              (MODEL.people || []).forEach(function (p) {
                if (!p.attribOnly) seen[levelName_(p)] = 1;
              });
              return LEVEL_ORDER_.filter(function (b) { return seen[b]; });
            } },
};

/** Seniority order for the level band, most senior first. */
var LEVEL_ORDER_ = ["MGMT", "SENIOR", "CORE", "JUNIOR", UNTAGGED_.level];

/** A person's level band, with the server's UNKNOWN folded into the house
    untagged bucket so it sorts and reads like every other untagged value. */
function levelName_(p) {
  var b = p.band || "";
  return (!b || b === "UNKNOWN") ? UNTAGGED_.level : b;
}

/**
 * Does this person carry `val` on dimension `dim`?
 *
 * ONE membership test, used by the filter predicate, the option counts and the
 * comparison chart's row members alike. Before this each had its own inline
 * `p.teams.indexOf(...)`, which is exactly how the untagged bucket could exist
 * in the option list while matching nobody in the filter.
 */
function dimMatch_(p, dim, val) {
  return FILTER_DIMS[dim].vals(p).indexOf(val) !== -1;
}

// ── MULTISELECT DIMENSIONS (user 2026-08-28) ────────────────────────────────
// Team, PM and Job family hold ARRAYS in STATE; several values are a UNION.
var MS_DIMS_ = { team: "All teams", pm: "Worked with PM: all", family: "All job families" };

/** Is this multiselect dimension narrowing anything? (Defensive on shape: a
    stale string from an old deep link counts as one selection, not a crash.) */
function msActive_(dim) {
  var v = STATE[dim];
  return Array.isArray(v) ? v.length > 0 : !!v;
}

/** The selected values of a multiselect dim, always as an array. */
function msVals_(dim) {
  var v = STATE[dim];
  return Array.isArray(v) ? v : (v ? [v] : []);
}

/** ANY-of membership across the selected values — the union read. */
function dimMatchAny_(p, dim, vals) {
  var list = Array.isArray(vals) ? vals : (vals ? [vals] : []);
  for (var i = 0; i < list.length; i++) if (dimMatch_(p, dim, list[i])) return true;
  return false;
}

/**
 * THE filter predicate — every filter is universal (user decision 2026-07-31):
 * population, role, region, team, PM, job family, triage flag and person search
 * scope the KPI cards, the charts and the grid identically.
 *
 * @param {Object} p     person record
 * @param {string=} skip dimension to ignore ("region"|"team"|"pm"|"family"|"flag"),
 *                       which is what makes the option lists cascade: the choices
 *                       for a dimension are computed with that dimension switched off.
 */
/**
 * Population override for scopedMetric_ — null in normal rendering.
 *
 * When set, only these people exist as far as every metric accessor is
 * concerned. This is how one comparison bar reuses the card's exact formula
 * instead of a hand-rolled copy of it.
 */
var SCOPE_NAMES_ = null;

function passesFilters_(p, skip) {
  if (SCOPE_NAMES_ && !SCOPE_NAMES_[p.name]) return false;
  if (!popMatch_(p)) return false;
  if (!roleMatch_(p)) return false;
  // Routed through dimMatch_ so the filter, the option counts and the chart rows
  // share one membership definition — including the untagged buckets.
  if (skip !== "region" && STATE.region && !dimMatch_(p, "region", STATE.region)) return false;
  // Team / PM / family are multiselects (2026-08-28): several values are a
  // UNION — any one membership keeps the person in.
  if (skip !== "team" && msActive_("team") && !dimMatchAny_(p, "team", STATE.team)) return false;
  if (skip !== "pm" && msActive_("pm") && !dimMatchAny_(p, "pm", STATE.pm)) return false;
  if (skip !== "family" && msActive_("family") && !dimMatchAny_(p, "family", STATE.family)) return false;
  if (skip !== "level" && STATE.level && !dimMatch_(p, "level", STATE.level)) return false;
  if (skip !== "flag" && STATE.flag && !hasFlag_(p, STATE.flag)) return false;
  if (STATE.search && p.name.toLowerCase().indexOf(STATE.search.toLowerCase()) === -1) return false;
  return true;
}

/**
 * The WHERE filters only — Region, Team, PM (and the two drill states, level
 * band and triage flag, plus a comparison bar's SCOPE_NAMES_). This is the
 * predicate the ITEMS read uses (user 2026-09-09: On-Time and Forecast are
 * evaluated on items, not people): a filter that says where the work sits
 * narrows it; a filter that describes people — Population, Role, Job family,
 * the person search — does not, because an item is an item whoever closed it.
 */
function passesWhereFilters_(p) {
  if (SCOPE_NAMES_ && !SCOPE_NAMES_[p.name]) return false;
  if (STATE.region && !dimMatch_(p, "region", STATE.region)) return false;
  if (msActive_("team") && !dimMatchAny_(p, "team", STATE.team)) return false;
  if (msActive_("pm") && !dimMatchAny_(p, "pm", STATE.pm)) return false;
  if (STATE.level && !dimMatch_(p, "level", STATE.level)) return false;
  if (STATE.flag && !hasFlag_(p, STATE.flag)) return false;
  return true;
}
/** True when a WHERE filter is narrowing — the one case in which an item with
    no roster assignee cannot be placed and has to be left out (and counted). */
function whereNarrowed_() {
  return !!(SCOPE_NAMES_ || STATE.region || msActive_("team") || msActive_("pm") || STATE.level || STATE.flag);
}

/** People passing every active filter. attribOnly stubs (whole-roster issue
    attribution, schema v12) exist only so buckets can join a person record —
    they are not the operational population, so the grid, the scope headcount
    and the person CSV never see them. Their BUCKETS still count everywhere:
    bucketsFor_ runs passesFilters_ directly, on purpose. */
function filteredPeople_() {
  return MODEL.people.filter(function (p) {
    // ── BENCH LEAVES THE VIEW (user decision 2026-08-17) ───────────────────
    // Crew between engagements are not shown as rows on any surface: not the
    // pool grid, not the People roster, not the Actions signals roster. The
    // earlier design kept them visible with a ⏸ badge; the user's rule is
    // "show active working only".
    //
    // The bench is still a stated FACT — the Workforce Scope panel prints
    // "N on the bench (not shown)" — it just stops being a set of rows. That
    // matters most on Actions: grading somebody's estimate fill on work they
    // are not doing is the "finger on him/her" failure, and a benched
    // contractor cannot act on a signal about an engagement they are off.
    //
    // ⚠️ THE GATE LIVES HERE, NOT IN passesFilters_, AND THAT IS LOAD-BEARING.
    // bucketsFor_ calls passesFilters_ directly to attribute Jira buckets, so
    // gating there would drop work a benched person ALREADY DELIVERED out of
    // On-Time, Forecast and Quality. Delivered is delivered; being benched
    // later does not un-deliver it. This gate scopes the PEOPLE surfaces only.
    if (p.onBench) return false;
    return !p.attribOnly && passesFilters_(p);
  });
}

/** True when the person EXISTED during the period. Pre-hire weeks are never
    emitted by the server (user decision 2026-07-31), so a person with no week
    cell in any of the period's isos was not yet hired then. Period-scoped
    headcounts use this (user report 2026-08-04: a June window counted July's
    two new hires — "140 people" regardless of the selected time). An empty
    isos list means no period is framing the count, so everyone counts. */
function existsIn_(p, isos) {
  if (!isos || !isos.length) return true;
  for (var i = 0; i < isos.length; i++) {
    if (p.weeks && p.weeks[isos[i]]) return true;
  }
  return false;
}

/**
 * Headcount per value of one dimension, over the people who pass every OTHER
 * filter. Returns { counts, order } where order lists every known value of the
 * dimension — in-scope ones first (by count, then name), out-of-scope after.
 */
function optionsFor_(dim) {
  var d = FILTER_DIMS[dim], counts = {}, people = 0;
  (d.all() || []).forEach(function (v) { counts[v] = 0; });
  MODEL.people.forEach(function (p) {
    if (p.attribOnly) return; // identity stubs must not inflate headcounts
    // Benched crew are out of the population (filteredPeople_), so they must be
    // out of these counts too — a chip reading "AMER 5" that yields three rows
    // when clicked is a filter bar disagreeing with the page it filters. Caught
    // by screenshot 2026-08-17: Scope said "3 people in scope" beside a chip
    // saying 5. The gate cannot live in passesFilters_ (it would drop delivered
    // work from the KPI buckets — see filteredPeople_), so every population
    // COUNT has to carry it explicitly.
    if (p.onBench) return;
    if (!passesFilters_(p, dim)) return;
    // Distinct people behind the counts. Team and PM are MULTI-VALUED, so the
    // per-option counts sum past this number — see fillSelect_, which says so
    // rather than leaving a reader to discover it by adding the dropdown up.
    people++;
    d.vals(p).forEach(function (v) {
      if (v === undefined || v === null || v === "") return;
      counts[v] = (counts[v] || 0) + 1;
    });
  });
  var live = [], dead = [];
  Object.keys(counts).forEach(function (v) { (counts[v] > 0 ? live : dead).push(v); });
  // Untagged last regardless of size. It is a data-hygiene bucket, not a team,
  // and sorting a big one to the top of a dropdown pushes the real values out of
  // sight. It is never hidden — just never first.
  live.sort(function (a, b) {
    var ua = isUntagged_(a) ? 1 : 0, ub = isUntagged_(b) ? 1 : 0;
    return (ua - ub) || (counts[b] - counts[a]) || a.localeCompare(b);
  });
  dead.sort(function (a, b) { return a.localeCompare(b); });
  return { counts: counts, live: live, dead: dead, people: people };
}

/**
 * Populate one MULTISELECT control from its cascaded options (user 2026-08-28;
 * replaces the single-value fillSelect_). A button states the selection; the
 * panel under it is checkboxes, so several teams / PMs / families can be
 * combined into one union slice. Panels are single-open (STATE.msOpen), Esc
 * and outside clicks close them — the PS dashboard's filter-panel contract.
 *
 * The cascade rules survive intact: counts follow the OTHER active filters,
 * out-of-scope values stay visible but inert, and a selected value the cascade
 * emptied stays listed and checked so it can be cleared from the same control
 * (rule 1 — never lose a selection).
 */
function fillMulti_(id, dim, allLabel) {
  var box = document.getElementById(id);
  if (!box) return;
  var o = optionsFor_(dim);
  var total = 0;
  o.live.forEach(function (v) { total += o.counts[v]; });
  var sel = msVals_(dim);
  var listed = o.live.slice();
  sel.forEach(function (v) { if (listed.indexOf(v) === -1) listed.push(v); });
  var dead = o.dead.filter(function (v) { return listed.indexOf(v) === -1; });
  var open = STATE.msOpen === dim;
  // The button carries the DISTINCT headcount on "all" — on a multi-valued
  // dimension the options sum past it, and seeing both is the disclosure.
  var btnLabel = !sel.length ? allLabel + " (" + o.people + ")"
    : sel.length === 1 ? sel[0]
    : sel.length + " selected";
  var rows = listed.map(function (v) {
    var on = sel.indexOf(v) !== -1;
    return '<label class="msRow"><input type="checkbox"' + (on ? " checked" : "") +
      ' onchange="msSet_(' + jsArg_(dim) + "," + jsArg_(v) + ',this.checked)"> ' +
      "<span>" + esc_(v) + ' <span class="cellSub">(' + (o.counts[v] || 0) + ")</span></span></label>";
  }).join("");
  var deadRows = dead.length
    ? '<div class="msDeadHead">— none in this slice —</div>' +
      dead.map(function (v) {
        return '<div class="msRow msOff">' + esc_(v) + ' <span class="cellSub">(0)</span></div>';
      }).join("")
    : "";
  box.innerHTML =
    '<button class="msBtn' + (sel.length ? " on" : "") + '" onclick="msToggle_(' + jsArg_(dim) +
      ')" aria-haspopup="listbox" aria-expanded="' + (open ? "true" : "false") + '">' +
      esc_(btnLabel) + ' <span class="msCaret">▾</span></button>' +
    '<div class="msPanel"' + (open ? "" : " hidden") + ' role="listbox" aria-label="' +
      esc_(allLabel) + '">' +
      '<div class="msHead"><a href="#" onclick="msClear_(' + jsArg_(dim) + ');return false">' +
        esc_(allLabel) + " (" + o.people + ")</a></div>" +
      rows + deadRows +
    "</div>";
  if (sel.length > 1) {
    box.title = sel.length + " selected — the union: anyone in ANY of " +
      sel.join(", ") + ". Memberships overlap, so the union is at most the sum of the parts.";
  }
}

/** Open/close one multiselect panel — single-open, like the PS dashboard. */
function msToggle_(dim) {
  STATE.msOpen = STATE.msOpen === dim ? "" : dim;
  buildFilters_();
}

/** (Un)tick one value. The panel STAYS OPEN — combining values is the point. */
function msSet_(dim, val, on) {
  var cur = msVals_(dim).slice();
  var i = cur.indexOf(val);
  if (on && i === -1) cur.push(val);
  if (!on && i !== -1) cur.splice(i, 1);
  STATE[dim] = cur;
  buildFilters_();
  renderAll_();
}

function msClear_(dim) {
  STATE[dim] = [];
  buildFilters_();
  renderAll_();
}

// Esc and outside clicks close whichever panel is open. Guarded feature-checks:
// the render-smoke DOM stub has no closest(), and these handlers never fire there.
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && STATE.msOpen) { STATE.msOpen = ""; buildFilters_(); }
});
document.addEventListener("click", function (ev) {
  if (!STATE.msOpen) return;
  var t = ev.target;
  if (t && t.closest && t.closest(".ms")) return;   // inside a control — leave it
  // ⚠ A DETACHED target is an INSIDE click (fix 2026-08-29). msToggle_ / msSet_ /
  // msClear_ rebuild the control's innerHTML synchronously, mid-dispatch — so by
  // the time this listener runs, the clicked button/checkbox has no parent and
  // closest(".ms") finds nothing. Reading that as "outside" closed every panel
  // in the same tick it opened: the filters looked dead. Only the control's own
  // handlers can detach the target mid-click, so detached ⇒ inside, never out.
  if (t && document.documentElement && document.documentElement.contains &&
      !document.documentElement.contains(t)) return;
  STATE.msOpen = "";
  buildFilters_();
});

function buildFilters_() {
  buildPeriodChips_();
  buildPopChips_();
  buildRoleChips_();
  var rc = document.getElementById("regionChips");
  var ro = optionsFor_("region");
  rc.innerHTML = "";
  var totalR = 0;
  ro.live.forEach(function (v) { totalR += ro.counts[v]; });
  [""].concat(MODEL.meta.regions).forEach(function (r) {
    var n = r === "" ? totalR : (ro.counts[r] || 0);
    var empty = r !== "" && n === 0 && STATE.region !== r;
    var b = document.createElement("span");
    b.className = "chip" + (STATE.region === r ? " on" : "") + (empty ? " off" : "");
    b.textContent = (r === "" ? "All" : r) + " " + n; // group label "REGION" carries the context
    b.title = empty
      ? r + " has nobody under the other active filters — clear one of them to reach it"
      : (r === "" ? "Every region in the current slice — " + n + " people"
                  : r + " — " + n + " people under the other active filters");
    if (!empty) b.onclick = function () { STATE.region = r; buildFilters_(); renderAll_(); };
    rc.appendChild(b);
  });
  fillMulti_("teamSel", "team", "All teams");
  // "Worked with PM", not "PM": this control selects PEOPLE who worked FOR a PM,
  // while the 🗓 PM tab reports the TICKETS a PM owns. The filter row sits above
  // the tabs, so both are on screen together and one word cannot mean both.
  fillMulti_("pmSel", "pm", "Worked with PM: all");
  // Tempo stamps whoever led a project at the time, so the raw PM list keeps
  // former employees indefinitely. Say how many were removed — a list that
  // quietly shrinks between deploys is its own small mystery.
  var pmDrop = MODEL.meta.pmsDropped || 0;
  if (pmDrop) {
    var pmEl = document.getElementById("pmSel");
    pmEl.title = pmEl.title.replace(/ Excludes \d+ former.*$/, "") +
      " Excludes " + pmDrop + " former employee" + (pmDrop === 1 ? "" : "s") +
      " the roster shows as no longer active.";
  }
  fillMulti_("famSel", "family", "All job families");
  // Last, so it sees the state every control above just settled on (review
  // item #1). buildFilters_ runs after EVERY filter change, which is exactly
  // the cadence the drawer's badge and its forced-open rule need.
  renderAdvToggle_();
  renderFilterWarn_();
}

/**
 * Dead-end guard. A filter set that selects nobody is not an error state to be
 * discovered three panels down — say so in the filter row itself, name the
 * dimension that emptied it and offer the one click that reopens the view.
 */
function renderFilterWarn_() {
  var el = document.getElementById("filterWarn");
  if (!el) return;
  if (filteredPeople_().length > 0) { el.innerHTML = ""; return; }
  // Find the single filter whose removal brings back the MOST people — that's
  // the one to offer, rather than nuking every choice the user just made. Ties
  // resolve in declaration order, so the suggestion is stable across renders.
  var culprit = null;
  ["region", "team", "pm", "family", "flag"].forEach(function (dim) {
    // Multiselect dims hold arrays — "active" means a non-empty selection.
    if (MS_DIMS_[dim] ? !msActive_(dim) : !STATE[dim]) return;
    var n = MODEL.people.filter(function (p) { return !p.attribOnly && passesFilters_(p, dim); }).length;
    if (n > 0 && (!culprit || n > culprit.n)) culprit = { dim: dim, n: n };
  });
  el.innerHTML = culprit
    ? '⚠ No one matches — <a href="#" class="hyglink" onclick="clearFilter_(\'' +
      culprit.dim + '\');return false">clear ' +
      esc_(FILTER_DIMS[culprit.dim] ? FILTER_DIMS[culprit.dim].label : "the triage filter") +
      "</a> to see " + culprit.n + " people"
    : '⚠ No one matches this combination — <a href="#" class="hyglink" ' +
      'onclick="document.getElementById(\'btnReset\').click();return false">reset the filters</a>';
}

function clearFilter_(dim) {
  STATE[dim] = MS_DIMS_[dim] ? [] : "";
  buildFilters_();
  renderAll_();
}

/**
 * ── ADVANCED FILTER DRAWER (review item #1, 2026-08-17) ──────────────────────
 * The five dimensions that moved out of the default filter bar, each paired
 * with the value that means "not filtering".
 *
 * Defaults are declared HERE and read by resetFilters_'s sibling logic rather
 * than being re-typed: "off its default" is the only definition of an active
 * filter this drawer has, and two copies of it would drift into a badge that
 * says 0 while a filter is applied — which is precisely the failure the drawer
 * introduces if it is done carelessly.
 */
// `focus` is NOT in this list: its control was deleted 2026-08-17 (see the
// markup comment). Leaving the entry behind would have been worse than the
// control it described — advActive_ would count a filter with no widget, and
// renderAdvToggle_'s "never hide an active filter" rule would force the drawer
// permanently open on a scope the reader can neither see nor clear.
var ADV_FILTERS_ = [
  { dim: "pop",    off: "fte",  label: "People" },
  { dim: "role",   off: "all",  label: "Role" },
  { dim: "pm",     off: "",     label: "Worked with PM" },
  { dim: "family", off: "",     label: "Job family" },
];

/** The drawer filters currently off their default, as {dim,label,value}.
    PM and family are multiselect arrays — off means an empty selection. */
function advActive_() {
  return ADV_FILTERS_.filter(function (f) {
    if (MS_DIMS_[f.dim]) return msActive_(f.dim);
    return (STATE[f.dim] || f.off) !== f.off;
  });
}

/**
 * Paints the toggle and enforces the drawer's one hard rule: an ACTIVE filter
 * is never hidden.
 *
 * `STATE.advOpen` is the reader's preference, but it only decides the CLOSED
 * case — the moment any drawer filter is off its default, the drawer opens and
 * stays open regardless. Collapsing a control that is currently scoping every
 * number on the page would make the dashboard quietly disagree with itself, and
 * the reader would have no visible reason why. The badge is the belt to that
 * brace: it names the count even in the instant before the open lands.
 */
function renderAdvToggle_() {
  var btn = document.getElementById("btnAdvFilters");
  var box = document.getElementById("advFilters");
  if (!btn || !box) return;
  var on = advActive_();
  var open = STATE.advOpen || on.length > 0;
  box.hidden = !open;
  btn.setAttribute("aria-expanded", open ? "true" : "false");
  btn.innerHTML = (open ? "Fewer filters" : "More filters") +
    (on.length ? ' <span class="advN">· ' + on.length + " on</span>" : "");
  // The tooltip NAMES them. A count tells a reader that something is applied;
  // only the names tell them what to expect the numbers to mean.
  btn.title = on.length
    ? "Applied: " + on.map(function (f) {
        return f.label + " = " + (MS_DIMS_[f.dim] ? msVals_(f.dim).join(" + ") : STATE[f.dim]);
      }).join(" · ") +
      ". These scope every KPI and the grid. The drawer stays open while any of " +
      "them is set — a filter is never applied out of sight."
    : "Population, Role, Focus, PM and Job family. Kept out of the default view to " +
      "leave three dimensions in the bar; opens automatically whenever any of them " +
      "is set, so a filter can never be applied out of sight.";
}

function toggleAdvFilters_() {
  // Only the OPEN preference is the reader's to set; renderAdvToggle_ still
  // overrides a close while a drawer filter is active.
  STATE.advOpen = !(STATE.advOpen || advActive_().length > 0);
  renderAdvToggle_();
}

// ── PERIODS (Week / Month / fiscal Quarter toggle) ───────────

/**
 * Every ISO week in the export window, oldest first.
 *
 * meta.trendWeeks carries only the 6 weeks the KPI sparkline needed, but
 * p.weeks holds the whole 52-week deep window (CONFIG_DH.WEEKS_PAST_DEEP), and
 * the month calendar is built over exactly that window — so flattening
 * meta.periods.month recovers the full weekly axis with no payload change and
 * no cache bust. That history is what makes an observed operating rate
 * meaningful: a "standard rate" derived from six points is an opinion.
 */
function allIsoWeeks_() {
  if (MODEL._allIsos) return MODEL._allIsos;
  var out = [];
  if (MODEL.meta.periods && MODEL.meta.periods.month) {
    MODEL.meta.periods.month.forEach(function (m) { out = out.concat(m.isos); });
  } else {
    var seen = {};
    (MODEL.meta.trendWeeks || []).forEach(function (iso) { seen[iso] = 1; out.push(iso); });
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      var iso = wk.iso || wk;
      if (!seen[iso]) { seen[iso] = 1; out.push(iso); }
    });
  }
  MODEL._allIsos = out;
  return out;
}

/** Every period of the active type, oldest first: {key,label,status,partial,isos[]}. */
function allPeriods_() {
  if (STATE.period === "week" || !MODEL.meta.periods) {
    if (MODEL._weekPeriods) return MODEL._weekPeriods;
    // Status comes from gridWeeks where it is known (done/now/plan); any week
    // older than the grid window is complete by construction.
    var st = {};
    (MODEL.meta.gridWeeks || []).forEach(function (wk) {
      if (wk && wk.iso) st[wk.iso] = wk.status;
    });
    MODEL._weekPeriods = allIsoWeeks_().map(function (iso) {
      return { key: iso, label: iso, status: st[iso] || "done", partial: false, isos: [iso] };
    });
    return MODEL._weekPeriods;
  }
  return (STATE.period === "month" ? MODEL.meta.periods.month : MODEL.meta.periods.quarter) || [];
}

/** Complete, non-truncated periods of the active type, oldest first — the only
    periods a trend or an operating rate may be built from. */
function donePeriods_() {
  return allPeriods_().filter(function (p) { return p.status === "done" && !p.partial; });
}

// ══════════════════════════════════════════════════════════════════════════
// FORWARD WINDOWS — the in-flight period and the next two weeks
//
// Until 2026-08-06 the picker offered COMPLETE periods only, and that was
// right for a scorecard: an unfinished month graded against a full-month
// target reads as a collapse on the 1st. But the dashboard's job is to help a
// manager coach, and the two questions coaching starts from — "what is the
// team on right now?" and "is the next fortnight actually planned?" — are both
// about windows that have not closed (user request 2026-08-06).
//
// So the picker gains them, and the grammar changes with the window rather
// than the numbers being quietly published under the old rules:
//   done → graded exactly as before
//   now  → published, but never compared against the period before it
//   plan → outcome metrics say so and stay blank; PLAN is what is measured
//
// The one invariant: trends and operating rates are still built from
// donePeriods_() alone. A forward window trends the complete history up to
// today; it never trends itself.
// ══════════════════════════════════════════════════════════════════════════

/** How many future weeks the picker offers. ZERO since 2026-09-09 (user:
    "remove the next-2-weeks planning from the filter, we are not actively using
    it") — the Planning group no longer renders and the outcome cards never
    enter their planning grammar. The machinery stays (planWeeks_, planTile_,
    notYetTile_) behind this one number: set it to 2 to bring the windows back.
    The server still ships CONFIG_DH.WEEKS_FUTURE (3) forward weeks, so two is
    the most the payload can honestly answer if it is re-enabled. */
var PLAN_WEEKS_AHEAD_ = 0;
function setPlanWeeksAhead_(n) {
  PLAN_WEEKS_AHEAD_ = Math.max(0, Number(n) || 0);
  if (MODEL) delete MODEL._planWeeks;       // the memo was built under the old number
}

/** The share of scheduled capacity below which a forward window counts as
    under-planned. Not a new target: this is the coverage-cliff line
    personExceptions_ has flagged people on since 2026-07-31, named once so the
    tile, the roster column and the triage flag cannot drift apart. */
var PLAN_CLIFF_ = 0.5;

/** Forward weeks the payload can actually speak to: gridWeeks entries with
    status "plan", nearest first, capped at PLAN_WEEKS_AHEAD_, and only while
    SOMEBODY has a cell there. A week with no cells at all is the export not
    reaching that far, which is a different fact from an unplanned week and
    must not be offered as one. */
function planWeeks_() {
  if (MODEL._planWeeks) return MODEL._planWeeks;
  var out = [];
  (MODEL.meta.gridWeeks || []).forEach(function (wk) {
    if (!wk || !wk.iso || wk.status !== "plan" || out.length >= PLAN_WEEKS_AHEAD_) return;
    var any = MODEL.people.some(function (p) {
      var w = p.weeks[wk.iso];
      return !!w && ((w.cap || 0) > 0 || (w.planned || 0) > 0);
    });
    if (any) out.push({ key: wk.iso, label: wk.iso, status: "plan", partial: false, isos: [wk.iso] });
  });
  MODEL._planWeeks = out;
  return out;
}

/** The in-flight period of the ACTIVE unit — this week, this month, this
    quarter. Never a trend input; offered because "what is the team on right
    now" is a different question from "how did last month close". */
function nowPeriod_() {
  var ps = allPeriods_();
  for (var i = ps.length - 1; i >= 0; i--) if (ps[i].status === "now") return ps[i];
  return null;
}

/**
 * Every window the picker offers, oldest first:
 *   [ …complete periods… , the in-flight one , …the next ≤2 weeks… ]
 *
 * Complete periods keep INDEX PARITY with donePeriods_() — for i < done.length,
 * all[i] IS done[i] — so the trend anchor is min(idx, done.length−1) and a
 * forward selection can never slide a partial period into a trend or a norm.
 *
 * The forward entries are always WEEKS even when the unit chip says Month or
 * Quarter: a future month is one planned fortnight and two empty ones, and
 * publishing that as a month's coverage would read as a planning collapse.
 * The unit chooses the granularity of HISTORY; planning is a weekly act.
 */
function analysisPeriods_() {
  var all = donePeriods_().slice();
  var now = nowPeriod_();
  if (now) all.push(now);
  return all.concat(planWeeks_());
}

/** Index into analysisPeriods_() of the selected window.
    DEFAULT = THE IN-FLIGHT PERIOD when there is one (user 2026-09-09: "when
    week or month is selected we need to show the current week or month, so
    they get what is happening now"). Until then the default was the last
    COMPLETE period, on the argument that a part-month graded against a
    full-month target reads as a collapse on the 1st — that risk is carried
    by the grammar instead: a "now" window is published with its ◐ phase chip
    and never compared to the period before it. With no in-flight period in
    the payload the default falls back to the last complete one. */
// Which window the picker's DEFAULT entry resolves to: "now" (shipped — the
// in-flight period so far, falling back to the last complete one when the
// payload has no in-flight period) or "done" (the last complete period, the
// pre-2026-09-09 behaviour). A named knob rather than a literal so the choice
// is one place to find, and so the render harness can pin the complete-window
// grammar without every fixture selecting a window by hand.
var DEFAULT_WINDOW_ = "now";
function setDefaultWindow_(v) { DEFAULT_WINDOW_ = v === "done" ? "done" : "now"; }

function headPickIdx_(all, done) {
  if (STATE.periodIdx === null || STATE.periodIdx === undefined) {
    if (DEFAULT_WINDOW_ === "now") {
      for (var i = all.length - 1; i >= 0; i--) if (all[i].status === "now") return i;
    }
    return Math.max(0, done.length - 1);
  }
  return Math.max(0, Math.min(all.length - 1, STATE.periodIdx));
}

/**
 * ONE resolution of "which window is on screen", used by every analysis
 * surface so they can never disagree about it.
 *   head  — the selected window (may be in-flight or forward)
 *   hi    — the trend anchor INTO donePeriods_(): the last complete period at
 *           or before the head
 *   phase — "done" | "now" | "plan", the grammar every renderer switches on
 */
function analysisHead_() {
  var done = donePeriods_(), all = analysisPeriods_();
  var pi = headPickIdx_(all, done);
  var head = all[pi] || { key: "", label: "—", isos: [], status: "done", partial: false };
  return { done: done, all: all, pi: pi,
           hi: Math.max(0, Math.min(pi, done.length - 1)),
           head: head,
           phase: head.status === "plan" ? "plan" : (head.status === "now" ? "now" : "done") };
}

/** True while the reader is looking at a window that has not happened yet. */
function planningPhase_() { return analysisHead_().phase === "plan"; }

/** How a non-complete window is described, in one place — the tiles, the scope
    chip and the roster all name it the same way or the reader gets three
    stories about one selection. */
function phaseWord_(phase, unit) {
  return phase === "plan" ? "planning window"
       : phase === "now"  ? "current " + unit + ", in progress"
       : "complete " + unit;
}

/**
 * Aggregates a person's weekly cells over a period. effPlanned caps planned at
 * capacity PER WEEK before summing (the Tempo per-project duplication rule).
 * Returns null when no member week has data.
 */
function aggWeeks_(p, isos) {
  var a = null;
  isos.forEach(function (iso) {
    var w = p.weeks[iso];
    if (!w) return;
    if (!a) a = { cap: 0, avail: 0, planned: 0, effPlanned: 0,
                  tracked: 0, trackedOff: 0, billable: 0, nonBillable: 0, capEst: false,
                  availCov: 0, capCov: 0, trackedCov: 0, nsBillRaw: 0, nsNonBillRaw: 0,
                  covWeeks: 0, nWeeks: 0 };
    a.cap += w.cap; a.avail += w.avail;
    a.planned += w.planned; a.trackedOff += w.trackedOff || 0;
    // Planning is capped at capacity: a 60h plan against a 40h schedule is an
    // over-plan, not extra deliverable capacity.
    a.effPlanned += w.cap > 0 ? Math.min(w.planned, w.avail) : w.planned;
    a.tracked += w.tracked; a.billable += w.billable; a.nonBillable += w.nonBillable;
    a.capEst = a.capEst || w.capEst;
    // NS-coverage companions: billable rates divide by availCov (classified weeks
    // only), so a period spanning covered and uncovered weeks reports the rate of
    // the part NS actually classified instead of diluting it with forced zeros.
    a.availCov += w.availCov || 0; a.trackedCov += w.trackedCov || 0;
    a.capCov += w.capCov || 0;
    a.nsBillRaw += w.nsBillRaw || 0; a.nsNonBillRaw += w.nsNonBillRaw || 0;
    a.nWeeks++; if (w.nsCov) a.covWeeks++;
  });
  return a;
}

/** Unclassified tracked hours in an aggregated cell — logged in Tempo but with
    no NS billable/non-billable signal, so they belong to neither bucket. */
function unclassifiedH_(w) {
  return w ? Math.max(0, (w.tracked || 0) - (w.trackedCov || 0)) : 0;
}

/** Raw NetSuite hours behind a cell (billable + non-billable, as exported).
    Diagnostic only — never a rate numerator; the rates use the ratio split. */
function nsRawTot_(w) {
  return w ? (w.nsBillRaw || 0) + (w.nsNonBillRaw || 0) : 0;
}

/** The NS billable share driving a cell's split (0–1), or 0 with no NS signal. */
function nsShare_(w) {
  var t = nsRawTot_(w);
  return t > 0 ? (w.nsBillRaw || 0) / t : 0;
}

/**
 * Renders only the pane that is on screen. Every view reads the same STATE, so
 * a filter change is a single re-render of the active pane rather than four
 * hidden ones — and the pane can never show a window that no longer matches the
 * header controls (the bug the old always-render-everything code had).
 */
function renderAll_() {
  // The confidential control is painted on every render, not once at boot: it
  // reads MODEL (canSeeMargin_/canSeeSuper_), which does not exist until the
  // first payload lands.
  renderConfBtn_();
  renderScope_();
  renderFilterWarn_();
  switch (STATE.view) {
    // Executive tier order (redesign 2026-08-17). renderFlow_ writes BOTH the
    // Tier-1 grid (#tier1Tiles — the outcome cards plus the backlog hero
    // triplet) and the Tier-2 secondary strip, so it runs before the panels
    // that sit under it. renderCompare_ now paints Tier 3's drill-down chart;
    // renderTrustDetail_ gates itself behind canSeeSuper_(), so the dispatch
    // stays a plain list rather than growing conditionals here.
    // renderMasthead_ left this list 2026-08-28 with its panel (user decision —
    // the pipeline pace/runway/groomed callouts were misleading); the
    // confidential banner it carried now opens the backlog band instead.
    case "exec":    renderFlow_(); renderBacklogBand_(); renderPulse_(); renderCompare_(); renderTrustDetail_(); renderExecTabs_(); break;
    // renderTrust_ ("Can we publish these numbers?") left this list 2026-08-28
    // (user decision) — the super-admin trust detail on Backlog & Flow remains
    // the provenance surface.
    case "actions": renderRoster_(); renderBacklogHealth_(); renderEpicDue_(); renderHygPanel_(); break;
    // renderWfDisciplines_ was removed 2026-08-17 (job-code-to-pool mapping is
    // configuration, not delivery health). renderWfAlert_ takes its place in the
    // list, at the top of the tab rather than the bottom.
    case "workforce": renderWfConsumers_(); renderWfAlert_(); renderWfScope_(); renderWfGrid_(); renderWfShadow_(); renderWfUnrouted_(); break;
    case "pm":      renderPm_(); break;
    case "changes": renderChanges_(); break;
    case "access":  renderAccess_(); break;
  }
}

/** Live scope chip: states exactly what slice is on screen — replaces the old
    explanatory footnote (fine print lives in the chip's tooltip). */
function renderScope_() {
  var parts = [POP_LABELS[STATE.pop],
    STATE.region || "All regions",
    msActive_("team") ? msVals_("team").join(" + ") : "All teams"];
  if (msActive_("pm")) parts.push("PM: " + msVals_("pm").join(" + "));
  if (msActive_("family")) parts.push(msVals_("family").join(" + "));
  if (STATE.level) parts.push("Level: " + STATE.level);
  if (STATE.flag) parts.push(FLAG_LABELS[STATE.flag].icon + " " + FLAG_LABELS[STATE.flag].label);
  if (STATE.search) parts.push("“" + STATE.search + "”");
  // The period is stated HERE and nowhere else. It used to repeat in all four
  // card headers — one fact, four times, one stolen line per card.
  var A = analysisHead_();
  var head = A.all.length ? A.head : null;
  var unit = PERIOD_LABELS[STATE.period].toLowerCase();
  // Headcount is PERIOD-SCOPED (user report 2026-08-04): "Jun 2026 — N people"
  // must count June's roster, not today's — someone hired in July did not
  // exist in a June window. Only hires can be corrected for (the payload is
  // active-roster only, so leavers are invisible either way); the delta is
  // stated so 140 → 138 reads as a fact, not a glitch.
  var pool = filteredPeople_();
  var n = head ? pool.filter(function (p) { return existsIn_(p, head.isos); }).length : pool.length;
  var later = pool.length - n;
  document.getElementById("scopeChip").innerHTML =
    // The window's PHASE leads, because "58%" means three different things
    // across the three of them and the chip is the only place the reader is
    // told which one they are looking at.
    (head ? "<b>" + (A.phase === "plan" ? "Planning · " + esc_(head.label)
                   : A.phase === "now"  ? "Current " + unit + " so far · " + esc_(head.label)
                   : (STATE.periodIdx === null ? "Last complete " : "Selected ") +
                     unit + " · " + esc_(head.label)) + "</b> — " : "") +
    esc_(parts.join(" · ")) + " — " + n + " people" +
    (later > 0
      ? ' <span class="cellSub" title="On the roster today but hired after this ' + unit +
        " — they did not exist in this window, so they are not in its headcount or its rates.\">(+" +
        later + " hired later)</span>"
      : "");
}

document.getElementById("btnRefresh").onclick = function () { loadData(true); };
// Reset (user feedback 2026-07-31, tightened same day): EVERYTHING returns to
// the default view in one click — every filter and lens (population FTE, role
// All, focus Plan, period Monthly), all dropdowns, search, and every expanded
// column/detail row. No leftover state, period included (Monthly IS the default).
// A NAMED function, not only a click handler: panels that hide rows because of a
// filter offer "clear filters" inline, and they must run the same reset the ⟲
// button does rather than a second, drifting copy of it.
function resetFilters_() {
  STATE.period = MODEL && MODEL.meta.periods ? "month" : "week"; // stale-cache guard parity with loadData
  STATE.pop = "fte"; STATE.role = "all";
  STATE.region = ""; STATE.team = []; STATE.pm = []; STATE.family = []; STATE.search = "";
  STATE.msOpen = "";      // …and any open multiselect panel closes with them
  STATE.level = "";        // …including the level band, set by drilling the breakdown chart
  STATE.flag = ""; STATE.expandedWeeks = {}; STATE.openDetail = {}; STATE.openDetailAll = {};
  STATE.sigFilter = "";   // …including the roster's signal chip
  STATE.drillItems = null; // …and the items panel under the breakdown grid
  STATE.periodIdx = null; // …including the analysis-period picker
  STATE.advOpen = false;  // …and the advanced drawer collapses, since Reset
                          //    just returned every filter inside it to default
  syncTypePop_();         // …and the roster's Open/Resolved follows the default window
  buildPeriodChips_();    // reflect the reset in the picker's selection
  var srch = document.getElementById("personSearch");
  if (srch) srch.value = "";
  buildFilters_();   // rebuilds every dropdown from the now-unfiltered population
  renderAll_();
}
document.getElementById("btnReset").onclick = resetFilters_;
document.getElementById("btnAdvFilters").onclick = toggleAdvFilters_;
// A dropdown change re-cascades the OTHER dropdowns before re-rendering — that
// is what makes a Region pick collapse the Team/PM/Family lists.
function onFilterChange_(dim, value) {
  STATE[dim] = value;
  buildFilters_();
  renderAll_();
}
// Team / PM / family are multiselects (2026-08-28): their change handlers are
// inline in fillMulti_'s checkboxes, so no onchange wiring here any more.
document.getElementById("personSearch").oninput = function () { onFilterChange_("search", this.value); };
// Theme button says what it DOES (the mode you'd switch to), not a cryptic glyph.

(function () {
