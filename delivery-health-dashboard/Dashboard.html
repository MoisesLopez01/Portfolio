function openMethod_() {
  var el = document.getElementById("methodModal");
  if (el) el.hidden = false;
}
/** Closes on the button, on the backdrop, but never on a click inside the box. */
function closeMethod_(ev) {
  if (ev && ev.target && ev.target.className !== "methodOverlay") return;
  var el = document.getElementById("methodModal");
  if (el) el.hidden = true;
}

function renderRoster_() {
  var el = document.getElementById("rosterPanel");
  // SCROLL PRESERVATION. Every toggle rebuilds the panel's innerHTML, which
  // resets the .rosterWrap scroller to the top — so opening a row two thirds of
  // the way down threw the reader back to the first name and the list read as
  // though it had reordered itself (user 2026-08-06). The retired People grid
  // carried this exact guard for this exact reason; adding the capped scroller
  // for the sticky header reintroduced the bug it was written for.
  var wrapWas = el.querySelector ? el.querySelector(".rosterWrap") : null;
  var scrollTop = wrapWas ? wrapWas.scrollTop : 0;
  var scrollLeft = wrapWas ? wrapWas.scrollLeft : 0;
  var A = analysisHead_();
  var head = A.head;
  ROSTER_PHASE_ = A.phase;   // drives the conditional Plan column (see ROSTER_COLS_)
  var rows = personSignalRows_(head.isos);
  if (rows === null) {
    el.innerHTML = '<h3>People signals</h3><div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
    return;
  }
  var open = STATE.typePop !== "resolved";
  var scopeTag = open ? scopeTag_("snap") : scopeTag_("period");
  // Fall back to opp whenever the resolved column has no sorter — not just
  // when the key is unrecognized. setRosterSort_'s click guard only protects
  // clicks; STATE.rosterSort can still be set directly (tests, a future
  // deep-link reader) to a RECOGNIZED key whose .sort is null (every column
  // has one today, "hours" included since Task 6 — but a future column may
  // not), and rows.sort(null) throws (review finding 2026-08-05).
  var col = ROSTER_COLS_[STATE.rosterSort];
  if (!col || !col.sort) col = ROSTER_COLS_.opp;
  ROSTER_ISOS_ = head.isos;   // the hours sorter's only way to know the period
  rows.sort(col.sort);
  if (STATE.rosterDesc) rows.reverse();
  // The chip strip counts the WHOLE slice; only the table below it narrows. Sort
  // first, then filter, so a narrowed table keeps the ranking it had — the rows
  // that were adjacent are still adjacent.
  var chips = sigChipsHtml_(rows);
  var shown = rows.filter(sigFilterMatch_);

  // Conditional columns (Plan, 2026-08-06) are filtered out of the HEADER here
  // and out of each ROW below. The two lists must move together — a header
  // without its cell shifts every value one column left, which is the quiet
  // kind of wrong that gets screenshotted.
  var showPlan = !!(ROSTER_COLS_.plan.when && ROSTER_COLS_.plan.when());
  var head_ = "<tr>" + rosterColKeys_().map(function (k) {
    var c = ROSTER_COLS_[k];
    // Progress follows the population like the signal columns (SNAP on the open
    // backlog, PERIOD on resolved) — it is computed from the same buckets. Hours
    // is always PERIOD: worklogs are period-shaped, a backlog snapshot has none.
    var tag = (c.sig || k === "n") ? " " + scopeTag
            : (k === "hours" || k === "plan") ? " " + scopeTag_("period") : "";
    return '<th class="' + (k === "person" ? "tname" : "tnum") + '" onclick="setRosterSort_(\'' + k + '\')" style="cursor:pointer"' +
      (c.sig ? ' title="' + esc_(sigFieldByKey_(c.sig).tip) + '"'
             // `n` needed a tooltip of its own (user 2026-08-10: "n = 79 but the
             // drill-down shows 1 ticket"). It is the widest population on the
             // row — epics included, ignored tickets included — and every cell
             // beside it divides by something narrower.
             : k === "n" ? ' title="' + esc_(open
                 ? "The backlog this person is carrying right now: every OPEN issue attributed to " +
                   "them, epics included — a snapshot that follows the filters but not the period " +
                   "picker. Items already past their committed week are flagged red in the cell. " +
                   "It is deliberately wider than the list in the drill-down, which excludes epics " +
                   "(they roll up their children) and unstarted tickets with no due date (ignored " +
                   "by rule). Expand the row for the full breakdown."
                 : "Issues RESOLVED by this person in the selected period, epics included. " +
                   "Expand the row to list them — misses first.") + '"'
             : k === "plan" ? ' title="' + esc_("Hours planned in Tempo against scheduled " +
                 "capacity for this window, capped per week. Shown only while the window is " +
                 "still open, because a plan you can no longer change is history, not an " +
                 "action. Sorts least-covered first.") + '"'
             : k === "hours" ? ' title="' + esc_("Scheduled hours not yet used in this period " +
                 "— capacity minus tracked time. This is the assignable signal: if someone has " +
                 "available time, a manager can decide to route more work to them. Ramping new " +
                 "hires, interns and people on leave show their context instead — their spare " +
                 "capacity is not assignable room.") + '"'
             : "") + ">" +
      esc_(c.labelOf ? c.labelOf(open) : c.label) + tag +
      (STATE.rosterSort === k ? (STATE.rosterDesc ? " ▾" : " ▴") : "") + "</th>";
  }).join("") + "</tr>";

  var body = shown.map(function (r) {
    // Job title as a visible tag under the name (user request 2026-08-05 —
    // the retired headroom table carried it, the roster inherits it): grade
    // code stripped for reading, the full roster string in the tooltip/CSV.
    // The WHOLE ROW is the control, not just the name (user 2026-08-06). A row
    // that only responds on one word reads as broken — you aim at the number you
    // want explained and nothing happens. The caret flips so the row also states
    // whether it is currently open.
    var nameArg = esc_(r.p.name).replace(/'/g, "\\'");
    return '<tr class="rosterRow" onclick="toggleRosterDetail_(\'' + nameArg + '\')">' +
      '<td class="tname"><span class="rosterName">' +
        (STATE.openDetail[r.p.name] ? "▾ " : "▸ ") +
        piiHtml_(r.p.name) + "</span>" + personStateBadges_(r.p) +
        (r.p.jobTitle ? '<div class="cellSub"' + piiTitleAttr_(r.p.jobTitle) + '>' +
          piiHtml_(trunc_(jobTitleDisp_(r.p.jobTitle), 26)) + "</div>" : "") + "</td>" +
      // Cell order must match ROSTER_COLS_ key order EXACTLY. The Overall,
      // Billable tag, Start date and Progress cells left the row 2026-08-28
      // with their headers (user decision); r.overall still drives the chips,
      // the pulse and the default sort — it just paints no cell.
      backlogCellHtml_(r, open) +
      sigCellHtml_(r.sig.due) + sigCellHtml_(r.sig.est) + sigCellHtml_(r.sig.logged) +
      sigCellHtml_(r.sig.link) +
      '<td class="tnum">' + availCellHtml_(r.p, head.isos) + "</td>" +
      (showPlan ? planCellHtml_(r.p, head.isos) : "") +
      "</tr>" + rosterDetailRow_(r.p, head);
  }).join("");

  el.innerHTML =
    '<div class="chartHead"><h3>People signals — every active person in this slice</h3>' +
      '<span style="flex:1"></span>' +
      '<button class="linkBtn" onclick="openMethod_()" title="Denominators, the two rules that differ from the count beside them, and what each column measures">ⓘ How these are counted</button></div>' +
    methodPanelHtml_() +
    // POPULATION TOGGLE — moved here 2026-08-17. It used to live on the 🧬
    // by-type matrix and this table simply followed it; deleting that matrix
    // would have stranded the roster on Open with no way back, because
    // STATE.typePop had exactly one control in the whole client. It belongs on
    // the surface that reads it anyway: this is now the only view the toggle
    // moves.
    '<div class="chips seg" style="margin-bottom:8px">' +
      '<span class="chip' + (open ? " on" : "") + '" onclick="setTypePop_(\'open\')"' +
        ' title="Unresolved work, as at the last export. THIS is the actionable half — a due date ' +
        'added here moves next period\'s number.">Open backlog</span>' +
      '<span class="chip' + (open ? "" : " on") + '" onclick="setTypePop_(\'resolved\')"' +
        ' title="Work resolved in the selected window. Explains the numbers on the cards today; ' +
        'fixing these records changes history, not the next report.">Resolved · ' +
        esc_(head.label) + "</span></div>" +
    // ONE LINE, not five (user 2026-08-17). What a cell measures, where its gate
    // comes from and what grey means are all true and all REFERENCE — they moved
    // into the "How these are counted" panel. What stays is the sentence that
    // changes what a reader does next: which half of the work this is.
    '<p class="cellSub">' + (open
      ? "<b>Open backlog</b> — fix these and next period's numbers move."
      : "<b>Resolved in " + esc_(head.label) + "</b> — explains today's cards; fixing these " +
        "changes history, not the next report.") + "</p>" +
    // ── The methodology, FOLDED ──
    // Every rule below is load-bearing (the managers ratified them 2026-08-10) and
    // none of it is deleted — but as five lines of running prose above the table it
    // was a wall nobody read, which is the same as not stating it. Collapsed into
    // labelled one-line rules: the summary says what is inside, so a reader who
    // needs the denominators can find them in one click, and a reader who does not
    // gets to the table immediately.
    //
    // It stays OPEN on the resolved view's absence: there is no methodology block
    // there, so nothing to fold.
     // METHODOLOGY MOVED, BUT NOT ALL OF IT (user 2026-08-17).
    //
    // A block of denominators and rules used to open this panel — all true, all
    // pushing the actionable table below the fold on every visit. It now lives
    // behind the header link (methodPanelHtml_).
    //
    // ⚠ ONE SENTENCE STAYS ON THE PAGE, deliberately. The managers asked for
    // these rules to be visible rather than hovered (2026-08-10) for a specific
    // reason: this table is usually read as a PNG in a channel, and neither a
    // tooltip nor a modal survives a screenshot. The rule that caused a real
    // misreading — Due and Logged divide by LESS than the count beside them —
    // is the one that has to travel with the image. Everything else is
    // reference and is one click away.
    (open
      ? '<p class="cellSub"><b>Due date</b> and <b>Logged</b> divide by less than the ' +
        "<b>Backlog of the week</b> count beside them: an undated To Do ticket is ignored by rule, " +
        "while anything carrying a date is tracked whatever its status. " +
        '<span class="sigBad">⚑ overdue</span> flags work whose committed week has ended.</p>'
      : "") +
    // The Plan column only exists on an open window, so it has to introduce
    // itself when it appears rather than sit there as an unexplained new column.
    // Kept VISIBLE rather than folded: a column that appears and disappears needs
    // its explanation next to it the moment it shows up.
    (showPlan
      ? '<p class="cellSub"><b>Plan ' + esc_(head.label) + "</b>: hours planned in Tempo " +
        "against scheduled capacity for the selected window — the column to sort by when " +
        "the question is who is not covered yet. <span class=\"sigDot sigBad\">●</span> no plan · " +
        '<span class="sigDot sigWarn">●</span> under ' + Math.round(PLAN_CLIFF_ * 100) + "% · " +
        '<span class="sigDot sigGood">●</span> covered. It disappears once the window closes: ' +
        "a plan you can no longer change is history, not an action.</p>"
      : "") +
    // The four-colour Hours bar left with its column (2026-08-28) — the
    // Available cell is a single figure, so the swatch legend it needed is
    // gone too. What stays is the sentence that makes the column actionable
    // and the state badges that ARE still on screen (a legend behind a click
    // is absent from the screenshot this table is read as).
    '<p class="cellSub legendRow"><b>Available</b> = scheduled capacity not yet used this ' +
    "period — room a manager can decide to assign more work against. The signal is " +
    "provided here; the routing decision stays with the manager." +
    ' · <span class="lgd">🎓 intern</span>' +
    '<span class="lgd">🌱 ramping</span>' +
    '<span class="lgd">🏖 on leave</span></p>' +
    chips +
    // A filter that empties the table must say so and offer the way back —
    // an empty <tbody> under a full chip strip reads as a broken table.
    (shown.length === 0
      ? '<div class="emptyState">No one in this slice is <b>' + esc_(sigFilterLabel_()) +
        '</b>. <a href="#" onclick="setSigFilter_(\'\');return false">Show all ' + rows.length + "</a>.</div>"
      : // thead/tbody are load-bearing here, not tidiness: the sticky header rule is
        // scoped to `thead th` so the detail rows' nested tables can never inherit it.
        '<div class="gwrap rosterWrap"><table class="hyg tmx rosterTbl">' +
          "<thead>" + head_ + "</thead><tbody>" + body + "</tbody></table></div>") +
    // State the narrowing under the table too: the chip is at the top and a
    // filtered roster scrolled to the bottom otherwise looks like the whole org.
    (STATE.sigFilter && shown.length
      ? '<p class="cellSub">Showing ' + shown.length + " of " + rows.length +
        " — filtered to <b>" + esc_(sigFilterLabel_()) + "</b>. The ⬇ CSV exports this filtered view.</p>"
      : "");

  // Put the reader back where they were — see the note at the top of this
  // function. Restored on the NEW node, which only exists after the assignment
  // above; a scroll offset past the new content height is clamped by the
  // browser, so a re-render that shortens the table cannot strand the view.
  var wrapNow = el.querySelector ? el.querySelector(".rosterWrap") : null;
  if (wrapNow) { wrapNow.scrollTop = scrollTop; wrapNow.scrollLeft = scrollLeft; }
}

// progCellHtml_ (logged-vs-estimated burn) left the roster 2026-08-28 with its
// Progress column (user decision) — the same two figures still ship in the CSV

/** Per-person backlog-health bucket, keyed once per load. Null for a person
    the backlog feed has no row for — which renders as a plain count, never as
    a clean "0 overdue" claim about work nobody measured. */
function bhBucketOf_(name) {
  var bh = MODEL.backlogHealth;
  if (!bh || !bh.buckets) return null;
  if (!MODEL._bhByPerson) {
    MODEL._bhByPerson = {};
    bh.buckets.forEach(function (b) { if (b.person) MODEL._bhByPerson[b.person] = b; });
  }
  return MODEL._bhByPerson[name] || null;
}

/**
 * The "Backlog of the week" cell (renamed from Open issues, user 2026-08-28):
 * the open count, with the OVERDUE share flagged red beside it — work whose
 * committed week has already ended is the part of the backlog that cannot wait
 * for the weekly review. Counts come from the same per-person backlog-health
 * buckets the 🌊 panel reads, so the two surfaces can never disagree; the flag
 * deep-links the keys into Jira where the payload carries them.
 * Resolved view: a plain count — history has no overdue queue to work.
 */
function backlogCellHtml_(r, open) {
  var base = '<td class="tnum">' + r.n;
  if (!open || !r.n) return base + "</td>";
  var b = bhBucketOf_(r.p.name);
  var ov = b ? (b.overdue || 0) : 0;
  if (!ov) return base + "</td>";
  var keys = (b.keys && b.keys.overdue) || [];
  var flag = '<span class="sigBad" title="' + ov + " of " + r.n +
    " open items are past their committed week (measured against the model build " +
    'time). The committed week must have ENDED to count — the current week is ' +
    'still in compliance.">⚑ ' + ov + " overdue</span>";
  if (keys.length && jiraBase_()) {
    flag = '<a class="sigBad" href="' + esc_(jiraKeysUrl_(keys)) +
      '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="' +
      ov + " of " + r.n + " open items are past their committed week. Click to open " +
      (ov === 1 ? "it" : "them") + ' in Jira.">⚑ ' + ov + " overdue</a>";
  }
  return base + ' <span class="cellSub">·</span> ' + flag + "</td>";
}

// ── 🌊 BACKLOG HEALTH PANEL (2026-08-06) ─────────────────────────────────────

// biggest lever first, so the eye lands on the row worth acting on. Sizes are
// re-checked against live data (2026-08-06 measurements in the audit memory);

var BACKLOG_META_ = {
  // healthy — a denominator and a sense of movement, so the queue below reads as
  // a state rather than an accusation.

    tip: "Dated AND estimated AND linked to a parent AND touched in the last 30 days. The share of the backlog you could actually commit to, plan and price today. The four conditions are deliberately conjunctive: any one of them missing makes the other three unreliable." },
  fresh:       { label: "Touched ≤14d", kind: "good",
    tip: "Updated within the last fortnight — someone is actually working this." },
  futureDated: { label: "Dated, due this week or later", kind: "good",
    tip: "Carries a due date that the current week has not passed yet — including dates earlier THIS week, which are still live commitments (managers' feedback 2026-08-10). Every reporting surface here is weekly, so a date is late only once the week it was committed to has ended. The exact complement of the overdue rows below: no dated item can be in both, or in neither." },
  estimated:   { label: "Estimated", kind: "good",
    tip: "Carries an Original Estimate, so it can be planned into capacity and priced." },
  linked:      { label: "Linked to a parent", kind: "good",

  started:     { label: "Start date set", kind: "good",
    tip: "Carries a start date, so a late delivery can be diagnosed rather than just noticed." },

  // needs action — every row is a queue.
  unestimated: { label: "Unestimated", kind: "bad",
    tip: "No Original Estimate. These contribute ZERO hours to the Backlog tile, which is why that number is a lower bound: unestimated work is invisible to capacity planning and to pricing." },
  wipNoLog:    { label: "In progress, never logged", kind: "bad",
    tip: "Status category says In Progress and no time has ever been logged. Either it is not really started or the time is not being tracked — both are a two-minute conversation, and it is the most actionable list here." },
  overdueOver30: { label: "Overdue >30 days", kind: "bad",
    tip: "Past due by more than a month. Not a slip — an abandoned commitment. Shown apart from the shorter bands because they need completely different conversations. Like every overdue row here, counts only items whose committed WEEK has ended." },
  overdue30:   { label: "Overdue 8–30 days", kind: "bad",

// assumed equal.

/** Capacity / planned / available for one person over the period, from the same
    person-week grain the roster's Plan column uses (planFor1_ caps planned at
    capacity: a 60h plan on a 40h week is an over-plan, not extra hours to sell). */
function wfPersonHours_(p, isos) {
  var s = planFor1_(p, isos);
  return { cap: s.cap, planned: s.planned, avail: Math.max(0, s.cap - s.planned) };
}

/** Is this person's spare capacity sellable? Ramping new hires, people on long
    leave and benched crew are shown WITH their hours — hiding them would make a
    team look smaller than it is — but they stay out of the sellable subtotal,
    the same carve the recoverable-hours pulse and the roster's Hours sort
    already apply. Bench is listed separately from leave on purpose: the two
    have different owners and different fixes. */
function wfSellable_(p) {
  return p.newHire !== true && p.onLeave !== true && p.onBench !== true;
}

/**
 * ── THE PERSON'S WEEK AS ONE BAR (user 2026-08-18) ──────────────────────────
 * Planned fills first, available follows, the row ends in the person's own
 * availability rate — the same three numbers the columns held, readable in one
 * glance. Bar length is the person's capacity against the LONGEST capacity in
 * the list, so hours compare across people (a 20h week half-planned must not
 * look like a 40h week half-planned). Non-sellable rows (🏖 🌱 bench) draw
 * muted and verdict-free: the hours are real, the room to sell is not.
 * Segment labels render only when the segment is wide enough to hold them —
 * the tooltip always carries the full sentence, so nothing is lost, only
 * unsquashed.
 */
function wfPersonBarHtml_(h, sell, maxCap) {
  if (h.cap <= 0) return '<span class="cellSub">—</span>';
  var w = maxCap > 0 ? Math.max(6, Math.round(h.cap / maxCap * 100)) : 100;
  var planPct = Math.min(100, Math.round(h.planned / h.cap * 100));
  var availPct = Math.max(0, 100 - planPct);
  var rate = Math.round(h.avail / h.cap * 100);
  var tip = r1_(h.planned) + "h planned + " + r1_(h.avail) + "h available of " +
    r1_(h.cap) + "h scheduled capacity" +
    (sell ? " — " + rate + "% of their week is open."
          : " — spare hours here are not sellable.");
  return '<span class="wfBarWrap' + (sell ? "" : " wfBarHeld") + '" title="' + esc_(tip) + '">' +
    '<span class="wfBar" style="width:' + w + '%">' +
      (h.planned > 0 ? '<span class="wfBarPlan" style="width:' + planPct + '%">' +
        (planPct >= 18 ? r1_(h.planned) + "h" : "") + "</span>" : "") +
      (h.avail > 0 ? '<span class="wfBarAvail" style="width:' + availPct + '%">' +
        (availPct >= 18 ? r1_(h.avail) + "h" : "") + "</span>" : "") +
    "</span>" +
    (sell ? ' <b class="wfBarRate">' + rate + "%</b>"
          : ' <span class="cellSub">' + r1_(h.avail) + "h</span>") +
  "</span>";
}

// ── THE POOL × BAND DRILL-DOWN IS GONE (user decision 2026-08-28, second pass) ─
// wfCellOpen_/toggleWfCell_/wfCellPeopleRow_ were DELETED with the grouped
// grid: the flat availability list IS the people view now, so there is no
// cell to open. STATE.wfOpenCell survives as an inert key (old deep links
// and resets touch it); the per-person row format lives on in renderWfGrid_.

/** The one message shown when the payload predates this feature. */
function wfStale_(el, title) {
  document.getElementById(el).innerHTML = "<h3>" + title + "</h3>" +
    '<div class="emptyState">Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
}

/**
 * 1 · SCOPE BANNER.
 *
 * First on screen on purpose. Availability is published against one population,
 * Contribution against another, and the job catalogue holds a third — three
 * populations, one conversation. Every trend drawn without pinning the scope
 * measures membership change as if it were performance change, so the scope is
 * stated before any number is.
 *
 * Unclassified and stem-warning counts render EVEN AT ZERO. A field that only
 * appears when it is broken gets ignored when it breaks.
 */
function renderWfScope_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfScopePanel", "Scope"); return; }
  var s = w.scope || {};
  var cov = w.coverage || {};
  var filtered = w.people.length;
  var whole = s.population || 0;

  var bits = [];
  bits.push("<b>" + filtered + "</b> " + (filtered === 1 ? "person" : "people") + " in scope" +
    (filtered !== whole ? ' <span class="cellSub">(of ' + whole + " before filters)</span>" : ""));
  bits.push("<b>" + (s.consumers || 0) + "</b> consume project backlog");
  // ── BENCH (spec 2026-08-17, moved here from the capacity tile) ────────────
  // This count first sat on the Utilization card, beside the on-leave and
  // intern exclusions. That card opens with
  // `if (!SHOW_UTILIZATION_ && !planningPhase_()) return ""`, and
  // SHOW_UTILIZATION_ ships false — so the line rendered only on a planning
  // window and was invisible the rest of the time. Its render-smoke test
  // passed throughout because it forces the card on via withUtilization_(),
  // which is exactly how a correct implementation ends up on a dark surface
  // without anyone noticing.
  //
  // Scope always renders, and it is the panel a resourcing lead reads first,
  // so the fact now sits next to the headcount it qualifies: these people are
  // IN the population and OUT of every availability figure.
  //
  // ⚠️ Counted from MODEL.people, NOT from w.people. Since 2026-08-17
  // filteredPeople_ removes benched crew from the population entirely, so
  // w.people no longer contains a single one of them — reading it here would
  // print "0 on the bench" for every org that has a bench, which is worse
  // than printing nothing. passesFilters_ is applied so the count still moves
  // with the Region/Team/PM filters like every other number on this line.
  //
  // This is now the ONLY place the bench is stated. The rows are gone, so if
  // this line goes quiet the bench becomes invisible rather than merely
  // unlisted. Omitted at zero — a standing "0 on the bench" teaches readers to
  // skip the line on the day it is not zero. Deliberately unstyled: bench is a
  // state, not a defect, and this surface paints no verdicts.
  var benchedN = MODEL.people.filter(function (p) {
    return p.onBench && !p.attribOnly && passesFilters_(p);
  }).length;
  if (benchedN) {
    bits.push('<span title="Crew between engagements (roster Employee Status) — not contracted ' +
      'to deliver right now. They are NOT listed on any tab: no pool row, no roster row, no ' +
      'signals row, because nobody should be graded on work they are not doing. Their hours are ' +
      'out of every availability and capacity figure. Work they delivered BEFORE going on the ' +
      'bench still counts toward On-Time and Forecast.">' +
      "<b>" + benchedN + "</b> on the bench <span class=\"cellSub\">(not shown)</span></span>");
  }
  // Zero is a REPORTED value here, not an omission.
  bits.push('<span class="' + (s.unclassified ? "vr" : "") + '"><b>' + (s.unclassified || 0) +
    "</b> unclassified</span>");
  bits.push('<span class="' + (s.stemWarnings ? "va" : "") + '"><b>' + (s.stemWarnings || 0) +
    "</b> title mismatches</span>");

  var drift = s.drift && s.drift.alert
    ? '<div class="cellSub vr" style="margin-top:4px">⚠ Population moved ' +
      Math.round(s.drift.pct * 100) + "% since the last build (" + s.drift.prev + " → " +
      s.drift.now + "). A trend across a moving population measures membership, not performance.</div>"
    : "";

  var absent = (s.absentPools || []).length
    ? '<div class="cellSub" style="margin-top:4px">Not in this population by construction: ' +
      s.absentPools.map(esc_).join(" · ") +
      " — their job families carry no time-tracking mandate, so they are outside this dashboard entirely.</div>"
    : "";

  var unclassDetail = (s.unclassifiedReasons || []).length
    ? "<details style=\"margin-top:6px\"><summary class='cellSub'>What did not classify</summary>" +
      "<ul class='cellSub'>" + s.unclassifiedReasons.map(function (r) {
        return "<li><code>" + esc_(r.jobTitle || "(blank)") + "</code> — " + esc_(r.reason || "") + "</li>";
      }).join("") + "</ul><div class='cellSub'>A rising count means new job codes exist and " +
      "Workforce Planning has not been told. One row in the sub-track registry fixes each.</div></details>"
    : "";

  var stemDetail = (s.stemWarningDetail || []).length
    ? "<details style=\"margin-top:6px\"><summary class='cellSub'>Titles that disagree with their pool</summary>" +
      "<ul class='cellSub'>" + s.stemWarningDetail.map(function (r) {
        return "<li><code>" + esc_(r.jobTitle || "") + "</code> → " + esc_(r.pool) + " — " + esc_(r.warning || "") + "</li>";
      }).join("") + "</ul><div class='cellSub'>The job code decides the pool; the title text only " +
      "raises this flag. Usually a mistyped variant digit, occasionally a real hybrid role that " +
      "needs its own sub-track.</div></details>"
    : "";

  document.getElementById("wfScopePanel").innerHTML =
    '<div class="kicker">WORKFORCE HEALTH — capacity is not fungible</div>' +
    "<h3>Scope" + (w.periodLabel ? ' <span class="cellSub">· ' + esc_(w.periodLabel) + "</span>" : "") + "</h3>" +
    '<div style="margin:4px 0">' + bits.join(" · ") + "</div>" +
    drift + absent + unclassDetail + stemDetail +
    '<div class="cellSub" style="margin-top:6px">' +
      "Everyone below is grouped by <b>deployment pool</b> — the set of people who could genuinely " +
      "swap onto the same backlog item — and then by <b>level band</b>, because an I3 cannot absorb " +
      "an I5's epic. That grain is the point: a single company-wide availability number averages " +
      "together people who cannot do each other's work." +
    "</div>";
}

/**
 * 2 · WHO IS AVAILABLE — one flat list (user 2026-08-28, screenshot).
 *
 * The pool × band grid — pool header rows, band summary rows, a nested table
 * per cell with its own header, subtotal and footnote — repeated the same
 * scaffolding for every cell, and the director's question ("who can take work
 * right now, for how many hours?") was buried under it. This is that question
 * answered directly: EVERY person passing the filters, one row each, ranked
 * most-available first, pool and level demoted to a tag on the row. The reader
 * ranks nothing and decodes nothing — they read down until they run out of
 * hours, and decide themselves who to ask.
 *
 * The pool × band AGGREGATES did not vanish: the Sellable headroom card above
 * splits the same hours by band, and saveWorkforceCsv_ still exports the full
 * cell grid with every audit measure. What left this panel is the repetition.
 */
function renderWfGrid_() {
  var w = workforceHealthFor_();
  if (!w) { wfStale_("wfGridPanel", "Who is available"); return; }
  var rows = (w.people || []).map(function (p) {
    return { p: p, h: wfPersonHours_(p, w.isos), sell: wfSellable_(p) };
  });
  if (!rows.length) {
    document.getElementById("wfGridPanel").innerHTML =
      "<h3>Who is available</h3><div class='emptyState'>Nobody in scope under the active filters.</div>";
    return;
  }
  // Sellable first, then most available — an on-leave person at the top of a
  // "who is free" list is exactly the wrong answer (the wfCellPeopleRow_ rule,
  // now applied to the whole slice at once).
  rows.sort(function (a, b) {
    return ((b.sell ? 1 : 0) - (a.sell ? 1 : 0)) ||
           (b.h.avail - a.h.avail) || a.p.name.localeCompare(b.p.name);
  });
  var maxCap = rows.reduce(function (mx, r) { return Math.max(mx, r.h.cap); }, 0);
  var sums = rows.reduce(function (a, r) {
    if (r.sell) { a.cap += r.h.cap; a.planned += r.h.planned; a.avail += r.h.avail; a.n++; }
    else a.held++;
    return a;
  }, { cap: 0, planned: 0, avail: 0, n: 0, held: 0 });
  var readyN = rows.filter(function (r) { return r.sell && r.h.avail > 0; }).length;

  var body = rows.map(function (r) {
    var sell = r.sell;
    // No capacity scheduled at all is "—", never 0h available: nobody is free
    // for work in a week they are not scheduled to work.
    var availCell = r.h.cap <= 0 ? '<span class="cellSub">—</span>'
      : sell ? "<b>" + wfHrs_(r.h.avail) + "</b>"
             : '<span class="cellSub">' + wfHrs_(r.h.avail) + "</span>";
    // Pool + level as a TAG, not a section: the answer to "can this person do
    // the work" rides the row instead of structuring the page. Tooltip carries
    // the pool's meaning and the band's level range.
    var pool = r.p.pool || "NONE";
    var bd = WF_BAND_DESC_[r.p.band] || { range: "", why: "" };
    var consumes = wfCfg_(pool).consumes;
    var tag = '<span class="wfPoolTag" title="' +
      esc_((WF_POOL_DESC_[pool] || pool) + (bd.why ? " · " + bd.why : "") +
           (consumes ? "" : " · This pool is never drawn from the project backlog — spare hours here are not sellable delivery capacity.")) + '">' +
      esc_(pool) + " · " + esc_(wfBandLabel_(pool, r.p.band || "UNKNOWN")) +
      (bd.range && bd.range !== "—" ? ' <span class="cellSub">' + esc_(bd.range) + "</span>" : "") +
      "</span>";
    return "<tr>" +
      '<td class="tname">' + piiHtml_(r.p.name) + personStateBadges_(r.p) +
        (r.p.jobTitle ? '<div class="cellSub"' + piiTitleAttr_(r.p.jobTitle) + '>' +
          piiHtml_(trunc_(jobTitleDisp_(r.p.jobTitle), 30)) + "</div>" : "") + "</td>" +
      "<td>" + tag + "</td>" +
      "<td>" + wfPersonBarHtml_(r.h, sell, maxCap) + "</td>" +
      '<td class="tnum">' + availCell + "</td></tr>";
  }).join("");

  document.getElementById("wfGridPanel").innerHTML =
    '<h3 style="margin:0 0 4px">Who is available' + scopeTag_("period") + "</h3>" +
    // ONE headline instead of a subtotal per cell: the figure the director
    // came for, with its carve stated once.
    '<p class="cellSub"><b>' + readyN + "</b> of " + rows.length +
      (rows.length === 1 ? " person" : " people") + " in this slice " +
      (readyN === 1 ? "has" : "have") + " hours available — <b>" + wfHrs_(sums.avail) +
      "</b> ready to assign of " + wfHrs_(sums.cap) + " scheduled" +
      (sums.held ? " (" + sums.held + " held back — 🌱/🏖/⏸, listed below, never counted)" : "") +
      ". Most available first; the routing decision is yours. The Sellable headroom card " +
      "above splits the same hours by level.</p>" +
    '<div class="tableWrap"><table class="hyg wfList">' +
      '<colgroup><col style="width:24%"><col style="width:19%"><col style="width:43%"><col style="width:14%"></colgroup>' +
      "<thead><tr>" +
      '<th class="tname">Person</th>' +
      '<th title="Deployment pool and level band — capacity is not fungible, so who can do WHICH work rides every row. Hover a tag for what the pool means and which job levels the band covers.">Pool · level</th>' +
      '<th title="Scheduled capacity for this period as one bar: planned hours fill first, available hours follow, and the figure at the end is that person\'s own availability rate (available ÷ capacity).">Week — planned, then available</th>' +
      '<th class="tnum" title="Capacity minus planned hours for this period — the hours not yet promised to anything.">Available</th>' +
    "</tr></thead><tbody>" + body + "</tbody></table></div>" +
    // ONE footnote instead of one per cell (user 2026-08-28: the repetition
    // was the noise). Everything it says was said before — once each now.
    '<div class="cellSub" style="margin-top:8px">' +
      "🌱 ramping, 🏖 on leave and ⏸ benched people are listed with their hours but " +
      "<b>never counted available</b> — their spare capacity is not room to sell. Planned hours " +
      "are capped at each person's own capacity, so an over-plan never reads as extra hours. " +
      "Pools that are never drawn from the project backlog (support, PMO, crew) are tagged so " +
      "their free hours are read as what they are. <b>Signals, not verdicts</b> — available " +
      "time is room a manager can decide to assign against, never an automatic instruction. " +
      "The pool × band audit measures still ship in the ⬇ CSV. " +
      '<span class="wfWhy" onclick="toggleWfMethod_(true)" role="button" tabindex="0" ' +
        "onkeydown=\"if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleWfMethod_(true)}\" " +
        'title="How these figures are built, and how to read a row.">How this is measured</span>' +
    "</div>";
}

/**
 * 3 · SELLABLE HEADROOM — whole-department summary.
 *
 * If leadership asks for one number, this is it — and it never ships without
 * its denominator. "32% available" is a rumour; "32% available (of 84 people)"
 * is a fact.
 */
/**
 * ── AVAILABILITY: hours free across the whole department ────────────────────
 *
 * THE definition, computed once and read by two surfaces: the Executive tab's
 * Availability Rate KPI and this tab's "Sellable headroom" panel. A second
 * copy of the arithmetic would be a number that can disagree with itself
 * across two tabs, which is worse than not publishing it.
 *
 * WHOLE DEPARTMENT (user decision 2026-08-28, superseding the consumers-only
 * carve of 2026-08-10): everyone in Services counts as available — "we have
 * all in the department as available". The old carve limited the figure to the
 * ~backlog-consuming pools and read as a 62-person team to anyone asking who
 * could help. The consumers-vs-support SPLIT is still computed and REPORTED
 * as context (consHead/consFree/consGross below): which pools the free hours
 * sit in still matters to what they can absorb, it just no longer gates the
 * headline.
 *
 * Gross, not deployable, as the denominator — deliberately the same basis the
 * panel has always published, so the KPI cannot read differently from the tab
 * it deep-links into.
 *
 * @returns {?Object} null when the payload predates workforce health;
 *   {head, gross, committed, freeHrs, pct, consHead, consGross, consFree,
 *   nonHead} otherwise. head === 0 is a REAL answer ("nobody in this slice"),
 *   not an absence.
 */
function wfAvailability_() {
  var w = workforceHealthFor_();
  if (!w) return null;
  var gross = 0, committed = 0, head = 0;
  var consHead = 0, consGross = 0, consFree = 0;
  w.cells.forEach(function (c) {
    gross += c.grossHrs; committed += c.committedHrs; head += c.head;
    if (c.cfg.consumes) {
      consHead += c.head; consGross += c.grossHrs;
      consFree += c.grossHrs - c.committedHrs;
    }
  });
  return {
    head: head,
    gross: gross,
    committed: committed,
    freeHrs: gross - committed,
    pct: wfDiv_(gross - committed, gross),
    consHead: consHead, consGross: consGross, consFree: consFree,
    nonHead: head - consHead,
  };
}

/**
 * ── AVAILABILITY, FOLDED PER PERSON so it can be BROKEN DOWN ────────────────
 *
 * wfAvailability_ reads the server's per-cell fold, which cannot scope: it ships
 * hours pre-aggregated per pool × band, so filtering to a region changes who is
 * counted and not the hours. That made an Availability COLUMN print the same org
 * figure in every row — a number repeated, not a comparison.
 *
 * This folds the SAME measure from the per-person weeks the payload already
 * carries, so every universal filter reaches it and one row per region falls out
 * of the existing machinery.
 *
 * IT IS THE SAME DEFINITION, NOT A SECOND ONE. The server builds those very
 * cells from these very fields:
 *     buildCapacity_    grossHrs     += w.cap        ← same field
 *     buildCommitment_  committedHrs += w.planned    ← same field
 * with the same two carves (attribOnly stubs and benched crew skipped).
 * WHOLE DEPARTMENT since 2026-08-28 (user decision, with wfAvailability_):
 * the consuming-pool filter is gone from both folds together — the server's
 * workforce.consumersOnly figure now describes a SUBSET of what this reports,
 * not its equal, so the old fold-parity claim is retired with the carve.
 *
 * ⚠ w.cap NOT w.avail, and w.planned NOT w.effPlanned. avail nets out time off
 * and effPlanned caps at capacity; the server's capacity pipeline does neither,
 * and the netted pair would report a different availability from the card.
 *
 * @param {string[]} isos weeks to fold
 * @returns {?Object} {head, gross, committed, freeHrs, pct}, or null with no
 *   workforce block in the payload.
 */
function availabilityFor_(isos) {
  if (!(MODEL && MODEL.workforce)) return null;
  var gross = 0, committed = 0, head = 0;
  filteredPeople_().forEach(function (p) {
    // attribOnly and onBench are ALREADY excluded by filteredPeople_ (the
    // "active working only" population gate). Repeated here anyway, because
    // this fold's contract is "the same carves the server applies" — if the
    // population gate ever changes, the parity must not silently change with
    // it. Belt-and-braces, and stated as such rather than left looking load-
    // bearing.
    if (p.attribOnly || p.onBench === true) return;
    var seen = false;
    (isos || []).forEach(function (iso) {
      var w = p.weeks && p.weeks[iso];
      if (!w) return;
      seen = true;
      gross += Number(w.cap) || 0;
      committed += Number(w.planned) || 0;
    });
    if (seen) head++;
  });
  return { head: head, gross: gross, committed: committed,
           freeHrs: gross - committed,
           pct: gross > 0 ? (gross - committed) / gross : null };
}

/**
 * ── SELLABLE HEADROOM, SPLIT BY LEVEL BAND ─────────────────────────────
 *
 * THE QUESTION THIS EXISTS TO ANSWER (user, 2026-08-18): "is that 19% from
 * people who have available time and CAN CONSUME BACKLOG based on role AND
 * LEVEL logic?"
 *
 * (2026-08-28 update: the ROLE half of that answer changed by user rule — the
 * whole department counts as available now, so nothing gates the population.
 * The LEVEL half is unchanged and is the reason this split exists:)
 *   · LEVEL — NO. The headline sums gross and committed across every cell
 *     and divides ONCE, so a junior's free hour and a principal's free
 *     hour are interchangeable in it. Backlog routes by POOL only
 *     (`backlog[pool]`), never by band, so nothing downstream re-imposes the
 *     distinction either.
 *
 * That matters because the two are not substitutes. ServiceRocket's own
 * Availability definition (Confluence, "ServiceRocket Definitions" v5) lists
 * "wrong-fit assignment — person scheduled, hours full, mismatched capability
 * generates scope creep and write-downs" as failure mode one, and says plainly:
 * "free up the smartest people; don't have seniors stuck on work juniors can
 * do". A single blended percentage cannot show either condition.
 *
 * So the split is REPORTED rather than folded into the headline. The headline
 * stays exactly as it was — it is published on two surfaces and changing its
 * arithmetic here would break the one-definition guarantee — and the bands sit
 * underneath it, where a reader asking "which people?" finds the answer.
 *
 * @returns {Array<Object>} band rows, richest band first — not WF_BAND_ORDER_,
 *   because the reading question here is "where IS the free time", and sorting
 *   by seniority buries the answer under whichever band happens to be junior.
 */
function wfHeadroomByBand_() {
  var w = workforceHealthFor_();
  if (!w) return [];
  var by = {};
  w.cells.forEach(function (c) {
    // Whole department since 2026-08-28 (user decision) — the band split the
    // user asked to keep ("validate the impact by levels in the sellable room
    // or sellable rate") now reads over the same population as the headline.
    var b = by[c.band] || (by[c.band] = { band: c.band, head: 0, gross: 0, committed: 0 });
    b.head += c.head; b.gross += c.grossHrs; b.committed += c.committedHrs;
  });
  return Object.keys(by).map(function (k) {
    var b = by[k];
    b.freeHrs = b.gross - b.committed;
    b.pct = wfDiv_(b.freeHrs, b.gross);
    return b;
  }).sort(function (a, b) { return b.freeHrs - a.freeHrs; });
}

/**
 * The band split as BAR ROWS (modern view, user 2026-08-18). Hours lead,
 * percentage follows — unchanged doctrine, new clothes: the same stacked-bar
 * language the per-rocketeer drill-down speaks, so the tab reads as one system
 * at three zoom levels (org hero → band → person).
 *
 * A band with three people can post a spectacular percentage on nine free
 * hours, and a percentage sorted first would rank it above a band with 600h
 * genuinely on the table. What Sales can sell is HOURS; the rate is context for
 * them, so the free hours are the bold figure and the rate is the qualifier.
 * Bar length ∝ each band's own scheduled hours against the largest band —
 * which is what makes the three-person band VISIBLY small.
 *
 * A band planned past its schedule wears the Over-allocated pill, never a
 * minus-rate — the same translation every other surface applies.
 */
function wfBandRowsHtml_(rows) {
  if (!rows.length) return "";
  var maxGross = rows.reduce(function (mx, b) { return Math.max(mx, b.gross); }, 0);
  var body = rows.map(function (b) {
    var over = b.freeHrs < 0;
    var w = maxGross > 0 ? Math.max(6, Math.round(b.gross / maxGross * 100)) : 100;
    var comPct = b.gross > 0 ? Math.min(100, Math.round(b.committed / b.gross * 100)) : 0;
    var freePct = Math.max(0, 100 - comPct);
    var tip = wfHrs_(b.committed) + " committed" +

      "other pools: doing so would worsen every pool's cover by an amount nobody chose and hide the " +
      "routing gap entirely." +
    "</div>";
}


/** Pool grid → CSV. One row per pool × band, every measure plus its verdict. */
function saveWorkforceCsv_() {
  var w = workforceHealthFor_();
  if (!w) return;
  var head = ["Pool", "Band", "Head", "CapacityHrs", "CommittedHrs", "HeadroomHrs", "HeadroomPct",
              "TrackedHrs", "TrackedCommittedHrs", "ExecutionGapHrs", "Fidelity",
              "ShadowHrs", "ShadowPct", "ShadowNoEpic", "ShadowNoSrso", "ShadowNotCommitted",
              "UnmeasuredHrs", "BacklogRawHrs", "BacklogAdjHrs", "EstimateCoverage",
              "CoverWeeks", "ConstraintIndex", "StructuralRisk", "ActionState", "Read"];
  // null → empty cell, never 0: a spreadsheet full of zeros for "not measured"
  // is the same lie as a dashboard full of them.
  var n = function (v, dp) { return v === null || v === undefined ? "" : Number(v).toFixed(dp === undefined ? 2 : dp); };
  var rows = w.cells.map(function (c) {
    return [c.pool, c.band, c.head, n(c.grossHrs, 1), n(c.committedHrs, 1), n(c.headroomHrs, 1),
            n(c.headroomPct, 4), n(c.trackedTotalHrs, 1), n(c.trackedCommittedHrs, 1),
            n(c.executionGapHrs, 1), n(c.commitmentFidelity, 4),
            n(c.trackedShadowHrs, 1), n(c.shadowRatio, 4),
            n(c.shadowReasons["no-epic"], 1), n(c.shadowReasons["no-srso"], 1),
            n(c.shadowReasons["not-committed"], 1), n(c.unmeasuredHrs, 1),
            n(c.backlogHrs, 1), n(c.backlogAdjHrs, 1), n(c.estimateCoverage, 4),
            n(c.coverWeeks, 2), n(c.constraintIndex, 3),
            csvCell_(c.structuralRisk), csvCell_(c.actionState), csvCell_(c.read)];
  });
  // CRLF + the .csv extension are this function's job — downloadCsv_ writes the
  // filename and content verbatim.
  var lines = [head.join(",")].concat(rows.map(function (r) { return r.join(","); }));
  downloadCsv_(lines.join("\r\n"), "delivery-workforce-health.csv");
}

/**
 * 🌊 Backlog health — two facing lists, healthy on the left, queues on the right.
 *
 * WHY TWO COLUMNS rather than one sorted table: they answer different questions
 * and are read by the same person in one glance. "Is what we carry workable?" is
 * the left column; "what do I go fix?" is the right. Interleaving them by size
 * would put a 70%-unestimated row above the readiness headline and bury the one
 * number that frames everything else.
 */
function renderBacklogHealth_() {
  var el = document.getElementById("backlogPanel");
  if (!el) return;
  var t = backlogHealthFor_();
  if (t === null) {
    el.innerHTML = '<h3>Backlog health</h3><div class="emptyState">' +
      'Not in this payload — ↻ Refresh to rebuild on the current schema.</div>';
    return;
  }
  if (!t.n) {
    el.innerHTML = '<h3>Backlog health' + scopeTag_("snap") + '</h3>' +
      '<div class="emptyState">No open work under the active filters.</div>';
    return;
  }
  var readyPct = Math.round((t.ready || 0) / t.n * 100);
  function col(kind) {
    return BACKLOG_ORDER_[kind].map(function (k) { return backlogRowHtml_(k, t); }).join("");
  }
  var headRow = '<tr><th class="tname">Signal</th><th class="tnum">Items</th>' +
                '<th class="tnum">Share</th><th class="tnum">Queue</th></tr>';
  el.innerHTML =
    '<div style="display:flex;align-items:center;gap:10px">' +
      '<h3 style="flex:1;margin:0">Backlog health' + scopeTag_("snap") + '</h3>' +
      '<button class="iconbtn" onclick="saveBacklogCsv_()" title="Download every backlog-health signal with its item counts as CSV">CSV</button>' +
    "</div>" +
    '<p class="cellSub">' + t.n + " open item" + (t.n === 1 ? "" : "s") +
      " across " + t.people + " people · <b>readiness " + readyPct + "%</b>. " +
      "A snapshot of what the team is carrying right now — it ignores the period picker " +
      "and follows every other filter. Ageing is measured against the model build time" +
      (t.asOf ? " (" + esc_(String(t.asOf).slice(0, 10)) + ")" : "") + ", not this moment." +
      // Two DIFFERENT populations, named separately — never summed into one
      // "excluded" count. `unassigned` has no assignee to join at all;
      // `unattributed` has an assignee the roster join could not resolve.
      // Collapsing them would report an absent assignee as a failed roster
      // join, contradicting the 🧬 matrix's attrN-denominated `attr` column.
      (t.unassigned ? " " + t.unassigned + " open item" + (t.unassigned === 1 ? "" : "s") +
        " " + (t.unassigned === 1 ? "has" : "have") + " no assignee and " +
        (t.unassigned === 1 ? "is" : "are") + " excluded." : "") +
      (t.unattributed ? " " + t.unattributed + " open item" + (t.unattributed === 1 ? "" : "s") +
        " " + (t.unattributed === 1 ? "has" : "have") + " an assignee the roster join could not match and " +
        (t.unattributed === 1 ? "is" : "are") + " excluded — the 🧬 matrix below carries that gap." : "") +
      // A THIRD excluded population, named like the two above and for the same
      // reason: a count that silently leaves a queue is how a shrinking number
      // gets read as progress. These are in the population (they are real load),
      // they are simply not a due-date gap anybody owns.
      (t.undatedIgnored ? " " + t.undatedIgnored + " " +
        (t.undatedIgnored === 1 ? "item is" : "items are") +
        " unstarted with no due date and " + (t.undatedIgnored === 1 ? "is" : "are") +
        " <b>not counted as a missing due date</b> — not a commitment yet (rule, 2026-08-10)." : "") +
      "</p>" +
    '<div class="bhCols">' +
      '<div><h4 style="margin:0 0 6px">Ready to be worked</h4>' +
        '<table class="hyg tmx"><thead>' + headRow + "</thead><tbody>" + col("good") + "</tbody></table></div>" +
      '<div><h4 style="margin:0 0 6px">Needs action <span class="cellSub">— fix these and next period moves</span></h4>' +
        '<table class="hyg tmx"><thead>' + headRow + "</thead><tbody>" + col("bad") + "</tbody></table></div>" +
    "</div>" +
    '<div class="cellSub" style="margin-top:6px">' +
      "Shares are of the whole open population, so the ⚠️ rows deliberately OVERLAP — " +
      "one ticket can be unestimated, undated and stale at once. Read each row as its own " +
      "queue, never as a slice of a pie. " +
      keySwatch_("var(--pos)", "ready / healthy") + " · " +
      keySwatch_("var(--warn)", "needs an action") +
      "</div>";
}

// ── 🚩 EPICS WITHOUT A DUE DATE (team agreement 2026-08-10) ───────────────────
//
// The only 100%-target field rule on this dashboard, so the only one rendered as a
// FLAG rather than a graded share. Three deliberate choices:
//
//   · ORG scope. No person filter, no roster join, unassigned epics included —
//     `epicDueAudit` is built server-side over the whole feed and this renderer
//     does not narrow it. An epic is a container; "nobody is assigned" is not a
//     reason to stop asking for its end date. The tag says ORG so nobody reads a
//     filtered number here.
//   · RED at all, which this file otherwise reserves for ratified targets. This
//     one is ratified: the team agreed every epic carries a date, even if it is
//     only the project end date.
//   · Keys, never names. Same rule as the gaps queue — a standing list of people
//     against failures reads as a blame board; an epic key is a thing to open.
/**
 * 🗓 PM-owned work. Two bars per PM, never averaged (spec §5.2): the epic
 * due-date fill the PM OWNS, and the backlog readiness their project CONTAINS.
 *
 * Work reaches a PM through its PROJECT, not through an assignee — which is why
 * this tab can exist at all while PMs remain structurally absent from the
 * delivery population (see Code.js, PM ATTRIBUTION).
 */
function renderPm_() {
  var el = document.getElementById("pmPanel");
  if (!el) return;
  var d = MODEL.pmOwned;
  // Absent ≠ clean — same rule as renderEpicDue_. A payload built before this
  // tab existed must say it did not look, or an empty tab reads as "no gaps".
  if (!d || !d.rows) {
    el.innerHTML = "<h3>Project Managers — owned work</h3><div class=\"emptyState\">" +
      "Not in this payload — ↻ Refresh to rebuild on the current schema.</div>";
    return;
  }
  if (!d.rows.length) {
    el.innerHTML = "<h3>Project Managers — owned work</h3><div class=\"emptyState\">" +
      "No open work in the current export.</div>";
    return;
  }
  var nowIso = currentIso_();
  // ⏩ The push window = the analysis window every other tab reads. Set before
  // any row is built so the pill, the Needs-action row and the epic rows agree.
  var pmHead = analysisHead_().head;
  PM_WINDOW_ = { isos: pmHead.isos || [], label: pmHead.label || "" };
  var totalIgnored = 0;
  // Epics carved out of the Owns bar as assigned backlog (To Do, no date).
  // Summed in the same pass as totalIgnored so the sentence below always
  // describes the slice on screen.
  var totalBacklogEpics = 0;
  // ── The universal filters, applied at epic grain ────────────────────────
  // Scoped by the people DOING the work (see pmEpicPasses_). Counted as we go,
  // because a filter that hides work without saying how much is indistinguishable
  // from a feed that never had it.
  var filtering = pmFiltersActive_();
  var hidden = 0, hiddenUnowned = 0;
  var visRows = d.rows.map(function (r) {
    totalIgnored += r.ignoredN || 0;
    totalBacklogEpics += r.epicBacklogN || 0;
    // A shallow copy ALWAYS (was: only when filtering): the ⏩ pushed count is
    // computed here per render, over the PM's FULL epic list like every other
    // pill, and must never be written back onto the payload row.
    var c = {};
    for (var k in r) c[k] = r[k];
    c.oppPushed = (r.epics || []).filter(function (e) { return pmPushedInWindow_(e) > 0; }).length;
    if (!filtering) return c;
    var keep = [];
    (r.epics || []).forEach(function (e) {
      if (pmEpicPasses_(e)) { keep.push(e); return; }
      hidden++;
      if (!(e.owners || []).length) hiddenUnowned++;
    });
    // STATE.pmOpen keys off r.pm, and the bars/gap counts are the PM's own
    // standing record, so only the epic LIST narrows. See the note rendered
    // under the heading.
    c.epics = keep;
    return c;
  }).filter(function (r) {
    // A PM whose every epic fell outside the slice leaves the page — but their
    // epics are in the `hidden` count, so the page still accounts for them.
    return !filtering || (r.epics && r.epics.length);
  });

  var body = visRows.map(function (r) {
    return pmGroupRowHtml_(r, d) +
      (STATE.pmOpen[r.pm] ? pmEpicRowsHtml_(r, nowIso) : "");
  }).join("");

  // An explicit <colgroup> is what actually fixes the widths. The shared .tmx
  // style is table-layout:fixed + white-space:nowrap, which sizes columns from
  // the first row — and this table's first row is a full-width PM group header,
  // so the algorithm had nothing to size from and every nowrap cell overflowed
  // into its neighbour (user 2026-08-11: the Gaps column painted on top of Due).
  // Widths are declared once, beside the labels they belong to.
  //
  // NO TABLE-LEVEL <thead> (user 2026-08-28, screenshot): those labels
  // describe the EPIC rows, but with every PM collapsed the table shows only
  // full-width group rows — a header floating over nothing, and metres away
  // from the epic list it actually names once a PM low on the page expands.
  // Each expanded section now opens with its OWN header row instead
  // (pmColsHeadRow_, first thing in pmEpicRowsHtml_).
  var cols = Object.keys(PM_COLS_).map(function (k) {
    return '<col style="width:' + PM_COLS_[k].w + '">';
  }).join("");
  var rows = '<div class="gwrap"><table class="hyg pmTable"><colgroup>' + cols +
             "</colgroup><tbody>" + body + "</tbody></table></div>";

  // What the filter hid, stated where the filter's effect is read. The unowned
  // share is called out separately: those epics are not "outside this slice",
  // they are attributable to NO slice, and they are exactly the work this tab
  // exists to surface.
  var filterNote = filtering
    ? '<p class="cellSub pmFilterNote">' +
      (hidden
        ? "<b>⚠ " + hidden + " epic" + (hidden === 1 ? "" : "s") + " hidden by the current " +
          "filter</b> — no child is assigned to anyone in this slice." +
          (hiddenUnowned
            ? " <b>" + hiddenUnowned + "</b> of them " + (hiddenUnowned === 1 ? "has" : "have") +
              " no roster-assigned child at all, so no filter can ever select " +
              (hiddenUnowned === 1 ? "it" : "them") + "."
            : "") +
          ' <a href="#" onclick="resetFilters_();return false">Clear filters</a> to see ' +
          "everything."
        : "Filters are active and nothing was hidden — every epic has a child in this slice.") +
      "</p>"
    : "";

  el.innerHTML =
    // 🎯 The Needs-action queue renders PER PM, inside each collapsible
    // section (user correction 2026-08-28) — see pmGroupRowHtml_. A tab-level
    // rollup made every PM read everyone's problems.
    "<h3>Project Managers — owned work" + (filtering ? scopeTag_("snap") : scopeTag_("org")) + "</h3>" +
    filterNote +
    pmPushNote_(d) +
    // ── METHODOLOGY OFF THE PAGE (director feedback 2026-08-17) ─────────────
    // Eight lines of attribution and windowing prose sat between the heading
    // and the first PM, and trained the reader to skip the top of the page.
    // The rules still matter — they are how a PM challenges a row — so they
    // collapsed into one line, not out of the product. <details>, not a modal:
    // it survives re-renders with its state intact and needs no script (the
    // keyGridHtml_ decision, for the same reason).
    pmMethodHtml_(d, totalBacklogEpics, totalIgnored) +
    rows;
}

/** The attribution and windowing rules, behind one line. Every sentence here
    used to be open-page prose above the table. */
function pmMethodHtml_(d, totalBacklogEpics, totalIgnored) {
  return '<details class="pmMethod"><summary>ⓘ How PM ownership is calculated</summary>' +
    '<p class="cellSub">An epic belongs to its <b>Jira assignee</b> — the ticket states ' +
      "who owns it. Where an epic has no assignee, it falls back to the <b>Tempo project " +
      "lead</b>, an inference from who logs hours where; the ⓘ beside each PM's Owns " +
      "figure says which rule placed their epics. Children follow the epic above them, " +
      "whoever they are assigned to. Work that satisfies neither rule is listed under " +
      "<b>(No PM)</b>: a coverage gap with a name, not an empty state. The two bars are " +
      "<b>never averaged</b> — the first is the PM's own field, the second is what their " +
      "project contains." +
      (d.supersededPms
        ? " <b>" + d.supersededPms + "</b> project" +
          (d.supersededPms === 1 ? " has" : "s have") +
          " changed PM inside the export window; the most recent owner is shown."
        : "") +
    "</p>" +
    '<p class="cellSub"><b>Epics shown are those in progress or due this month</b> ' +
      "(including anything already overdue). An epic that is neither started nor dated " +
      "is not listed — it is not work in flight — and since 2026-08-17 it is not graded " +
      "either: an undated epic sitting in <b>To Do</b> is <b>assigned backlog</b>, not a " +
      "commitment this PM has missed. Those epics leave the Owns bar, are counted beside " +
      "it, and are named under <b>○ In backlog</b> when a row is opened, so the exclusion " +
      "is visible rather than inferred. An epic joins the bar as soon as somebody starts " +
      "it or dates it." +
      (totalBacklogEpics
        ? " <b>" + totalBacklogEpics + "</b> epic" + (totalBacklogEpics === 1 ? "" : "s") +
          " " + (totalBacklogEpics === 1 ? "is" : "are") + " in that state right now."
        : "") +
      (totalIgnored
        ? " <b>" + totalIgnored + "</b> To Do ticket" + (totalIgnored === 1 ? "" : "s") +
          " with no due date " + (totalIgnored === 1 ? "is" : "are") + " counted but not " +
          "listed — not a commitment yet (managers' rule, 2026-08-10)."
        : "") +
      " <b>The bars are not windowed</b>: they measure every open item the PM owns, " +
      "because a denominator of only dated epics could never report a missing date.</p>" +
    // The 🚩 audit on Actions counts EVERY undated open epic, including the To Do
    // ones this tab excludes. Two different counts of what a reader will call
    // "the same epics" is how a dashboard gets distrusted, so the difference is
    // stated here rather than discovered over there.
    (totalBacklogEpics
      ? '<p class="cellSub">⚠ This is why the <b>🚩 Epics without a due date</b> audit on ' +
        "<b>Actions</b> shows a higher number: it is an org-wide ticket queue with nobody's " +
        "name on it, so it still counts the " + totalBacklogEpics + " backlog epic" +
        (totalBacklogEpics === 1 ? "" : "s") + " above. Both numbers are right — they answer " +
        "different questions: <i>what needs dating</i> versus <i>what has this PM committed " +
        "to</i>.</p>"
      : "") +
    "</details>";
}

/**
 * The countable gaps in a PM's work, biggest first — visible WITHOUT
 * expanding, because the question "what should this PM fix first" should not
 * require a click.
 *
 * Never summed into one score. Each is a different conversation: a missing date
 * is a commitment nobody made; a child past its epic is a plan that cannot land;
 * an epic nothing rolls up to cannot reach an engagement; a stale epic may not
 * be real work at all. A single "PM health %" would average four unrelated
 * problems and point at none of them.
 *
 * Ranked by SIZE, with the declaration order as the tie-break so equal counts
 * stay in a stable, severity-ordered sequence rather than shuffling per render.
 */
var PM_OPPS_ = [
  { k: "oppNoDue", icon: "🚩", cls: "sigBad", short: "no due date",
    tip: "Work started without a deadline. This bypasses On-Time Delivery tracking and requires immediate scoping. (Epics still in To Do are not counted — assigned backlog, not a missed commitment.)" },
  // Declared BEFORE the at-risk row so that on equal counts the tie-break (which
  // is declaration order) falls toward the worse state. Counted per EPIC: one
  // badly-planned epic is one decision a PM makes, not nine problems.
  { k: "oppEpicsBreached", icon: "✖", cls: "sigBad", short: "past due date",
    tip: "The committed week has passed with work still scheduled beyond it. Missed — this is a recovery conversation." },
  { k: "oppEpicsAtRisk", icon: "⚠", cls: "sigWarn", short: "at risk",
    tip: "Work is planned to finish after the epic's own date, which has not passed yet. Still fixable: move the children, or move the date." },
  // "Without tasks" (renamed from "unlinked", user 2026-09-09): the finding is
  // an epic with nothing under it, and that is what a PM hears in the words.
  { k: "oppNoChildren", icon: "🔗", cls: "sigWarn", short: "without tasks",
    tip: "No task of any status rolls up to this epic — nothing has been broken down under it, so its hours cannot reach an engagement or inform a quote." },
  // ⏩ PUSHED — the one WINDOWED pill (user 2026-09-09, from the jira-1-signal
  // dashboard's slip engine). Counted client-side over the analysis window
  // (renderPm_ sets PM_WINDOW_), because the export records every due-date
  // edit as a fact and the week it belongs to is the reader's choice.
  { k: "oppPushed", icon: "⏩", cls: "sigWarn", short: "pushed",
    shortOf: function () { return "pushed in " + pmWindowLabel_(); },
    tipOf: function () {
      return "The epic's due date was moved to a LATER date during " + pmWindowLabel_() +
        " — a live commitment that slipped. Counted per epic; the epic list says by how much. " +
        "Needs Jira Backlog.js ≥ 3.20.0 (Due Push Log).";
    },
    tip: "The epic's due date was moved to a later date during the selected window." },
  { k: "oppStale", icon: "🕒", cls: "sigWarn", short: "untouched 30d+",
    tip: "Untouched for 30+ days. Blocked, or not real work — either way it inflates this PM's load." },
];

function pmOppHtml_(r) {
  var live = PM_OPPS_.filter(function (o) { return (r[o.k] || 0) > 0; });
  if (!live.length) {
    // A clean PM says so. A row that renders nothing reads as "not measured",
    // and the whole point of this line is that its absence means something.
    return '<div class="pmOpp"><span class="pmPill sigGood" title="' + esc_("Every epic dated, " +
      "with tasks under it, current, its work inside its date, and no due date pushed in " +
      pmWindowLabel_() + ".") + '">✔ No open gaps</span></div>';
  }
  live.sort(function (a, b) {
    return (r[b.k] - r[a.k]) || (PM_OPPS_.indexOf(a) - PM_OPPS_.indexOf(b));
  });
  return '<div class="pmOpp">' + live.map(function (o) {
    var n = r[o.k];
    var body = o.icon + ' <b>' + n + "</b> " + (o.shortOf ? o.shortOf() : o.short);
    var tip = o.tipOf ? o.tipOf() : o.tip;
    // Every pill ACTS (director feedback 2026-08-17). The no-due pill opens its
    // keys in Jira — the payload names them (epicMissingKeys, the same list the
    // 🚩 row draws). The other signals ship as COUNTS over the PM's full epic
    // set — wider than the month window drawn below — so a key link could not
    // match the pill's own number; they open the epic list, where every flagged
    // epic is marked on its row. Routing to the evidence is the honest click.
    if (o.k === "oppNoDue" && jiraBase_() && (r.epicMissingKeys || []).length) {
      return '<a class="pmPill ' + o.cls + '" href="' + esc_(jiraKeysUrl_(r.epicMissingKeys)) +
        '" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="' +
        esc_(tip + " Click to open " + (n === 1 ? "it" : "these") + " in Jira.") + '">' +
        body + "</a>";
    }
    return '<span class="pmPill ' + o.cls + '" role="button" tabindex="0" ' +
      'onclick="pmPillOpen_(' + jsArg_(r.pm) + ')" ' +
      'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();' +
      'pmPillOpen_(' + jsArg_(r.pm) + ');}" title="' +
      esc_(tip + " Click to open this PM's epic list — every flagged epic is marked on its row.") +
      '">' + body + "</span>";
  }).join("") + "</div>";
}

/** Pill route for the counts-only signals: OPEN the PM's epic list, never
    toggle — a pill that closes the evidence it points at would punish the
    second click. */
function pmPillOpen_(pm) {
  if (!STATE.pmOpen[pm]) { STATE.pmOpen[pm] = true; renderPm_(); }
}

/** How this PM's epics were attributed — direct evidence vs inference. Plain
    text for the ⓘ tooltip beside the Owns figure (director feedback
    2026-08-17): off the page, one hover away when a PM disputes a row. */
function pmViaHtml_(r) {
  var a = r.viaAssignee || 0, p = r.viaProject || 0;
  if (!a && !p) return "";
  var parts = [];
  if (a) parts.push(a + " by Jira assignee (direct evidence — the ticket names its owner)");
  if (p) parts.push(p + " by Tempo project lead (an inference from who logs hours where, " +
                    "used only when the epic has no assignee)");
  return "How ownership was attributed: " + parts.join(" · ") + ".";
}

/**
 * The 🗓 PM table's columns — ONE definition driving the header and every row,
 * so a header can never drift from the cell beneath it (the failure that shifts
 * every value one column left and gets screenshotted).
 *
 * The table's unit is the EPIC. PM rows are full-width group headers, children
 * are detail rows under their epic — the same shape the Actions roster uses, so
 * a reader who can navigate one can navigate the other.
 *
 * `vs` carries a different reading per row level, on purpose: for an epic it is
 * the tally of its children, for a child it is that child's own verdict. Same
 * axis — "how does this sit against the epic's date" — at two grains.
 */
var PM_COLS_ = {
  work:   { label: "Epic / ticket", w: "30%",
            tip: "Epics in progress or due this month, with their children underneath. Click a row to expand it; click a key to open it in Jira." },
  status: { label: "Status", w: "10%" },
  due:    { label: "Due", w: "10%", num: true,
            tip: "The committed week. Red once that week has ended, amber during it — the current week is still in compliance (managers' rule, 2026-08-10)." },
  vs:     { label: "Against epic date", w: "16%", num: true,
            tip: "For an epic: how its children sit against its own committed week. For a child: whether it lands inside that week, past it, or carries no date of its own." },
  gaps:   { label: "Gaps", w: "20%",
            tip: "Countable problems on this row. Never summed into a score — each one is a different conversation." },
  owner:  { label: "Assignee", w: "14%",
            tip: "The Jira assignee an epic is attributed on. Blank where the row fell back to the Tempo project lead." },
};

/** How many undated-epic keys the PM group row DRAWS. The payload carries up to
    EPIC_DUE_MAX_KEYS_ (200) and "Open all in Jira" still covers every one of
    them — this only bounds what is painted, because 134 inline links ran across
    the page and buried the rest of the row. */
var PM_KEYS_SHOWN_ = 8;

/** Monday of a "YYYY.WN" ISO week key, as a UTC ms timestamp — or null on an
    unparseable key (an unknown shape must never silently rank as "earlier",
    the isoCmp_ rule). Jan 4 is always in ISO week 1. */
function weekKeyMonday_(key) {
  var m = /^(\d{4})\.W(\d{1,2})$/.exec(String(key || ""));
  if (!m) return null;
  var jan4 = Date.UTC(+m[1], 0, 4);
  var dow = new Date(jan4).getUTCDay() || 7;             // Mon=1 … Sun=7
  return jan4 - (dow - 1) * 864e5 + (+m[2] - 1) * 7 * 864e5;
}

/** Whole weeks the CURRENT ISO week sits past a due week key. 0 = due this
    week or later (still compliant); 1 = the committed week just ended; null =
    either key unparseable. Week precision on purpose — the managers' rule
    (2026-08-10) is weekly, and the PM payload carries week keys, not dates. */
function weeksPastDue_(dueKey) {
  var d = weekKeyMonday_(dueKey), n = weekKeyMonday_(currentIso_());
  if (d === null || n === null) return null;
  return Math.max(0, Math.round((n - d) / (7 * 864e5)));
}

/**
 * ── 🎯 NEEDS ACTION — each PM's own actionable queue (user 2026-08-28) ───────
 * The same reading the Actions tab's "Needs action — fix these and next period
 * moves" table gives the org, rebuilt PER PM: it renders INSIDE the PM's
 * collapsible section (user correction, same day — a tab-level rollup made
 * every PM read everyone's problems), counted over THAT PM's epics as the
 * current filters show them, each row a one-click Jira queue.
 *
 * The overdue bands translate the managers' weekly rule into days the way the
 * Actions panel does: a committed week must have ENDED to count. One week past
 * ≈ ≤7 days; two to four weeks ≈ 8–30 days; five or more ≈ >30 days.
 */
var PM_NEEDS_ = [
  { k: "noDue", label: "No due date", sev: "sigBad",
    tip: "Started work carrying no deadline — it bypasses On-Time Delivery tracking and needs immediate scoping. (To Do epics with no date are assigned backlog, not counted here.)",
    match: function (e) { return !e.due; } },
  { k: "over30", label: "● Overdue >30 days", sev: "sigBad",
    tip: "The committed week ended more than a month ago. Not a slip — an abandoned commitment; close it, or re-date it with a reason.",
    match: function (e) { var w = e.due ? weeksPastDue_(e.due) : null; return w !== null && w >= 5; } },
  { k: "over8", label: "● Overdue 8–30 days", sev: "sigBad",
    tip: "Past due by one to four weeks: recoverable with a re-plan. Counts only epics whose committed week has ended.",
    match: function (e) { var w = e.due ? weeksPastDue_(e.due) : null; return w !== null && w >= 2 && w <= 4; } },
  { k: "over7", label: "● Overdue ≤7 days", sev: "sigBad",
    tip: "The committed week has just ended. Usually a due date that needs moving, not work that needs rescuing — the current week is still in compliance.",
    match: function (e) { return e.due && weeksPastDue_(e.due) === 1; } },
  { k: "unlinked", label: "● Without tasks", sev: "sigWarn",
    tip: "No task of any status rolls up to this epic — nothing has been broken down under it, so its hours can never reach an engagement or inform the next quote.",
    match: function (e) { return !e.childrenAll; } },
  // ⏩ Pushed in the analysis window (user 2026-09-09). The label names the
  // window because the count changes with the picker — the only row here that
  // does — and a reader must not quote "3 pushed" without the week beside it.
  { k: "pushed", label: "● Pushed in window", sev: "sigWarn",
    labelOf: function () { return "● Pushed in " + pmWindowLabel_(); },
    tip: "The epic's due date was moved to a later date during the selected window while the epic was still open. Each one is a commitment that slipped — the epic row says from when to when.",

];

// ── ⏩ PUSH WINDOW — what "pushed in …" means on the PM tab ─────────────────
// Set once per renderPm_ from analysisHead_(), read by the pill, the
// Needs-action row and the epic row, so the three can never name different

function pmPushedInWindow_(e) {
  var ps = (e && e.pushes) || [];

  for (var i = 0; i < ps.length; i++) if (PM_WINDOW_.isos.indexOf(ps[i].wk) !== -1) n++;

function pmPushNote_(d) {

    ? '<p class="cellSub pmFilterNote">⏩ Pushes in <b>' + esc_(pmWindowLabel_()) + "</b> measured on " +
      c.measured + " of " + c.epics + " listed epics — an epic untouched for longer than the export's " +
      "changelog window carries no history, and no history is not a clean record.</p>"
    : "";
}

/**
 * ONE PM's Needs-action table, over their filtered epics.
 *
 * Focused on purpose (user 2026-08-28): only the signals that HAVE items
 * render, and a PM with nothing to fix gets no table at all — the ✔ pill on
 * their row already says they are clean, and this section exists so each PM
 * meets only their own areas of opportunity. That is a deliberate exception to
 * the house "a clean signal prints —, never vanishes" rule: the always-visible
 * gap pills on the PM row are the standing measurement; this table is the
 * work queue behind them.
 */
function pmNeedsActionHtml_(epics) {
  var live = PM_NEEDS_.map(function (s) {
    var hit = (epics || []).filter(s.match);
    return { s: s, keys: hit.map(function (e) { return e.key; }) };
  }).filter(function (row) { return row.keys.length > 0; });
  if (!live.length) return "";
  var body = live.map(function (row) {
    var s = row.s, keys = row.keys;
    var url = jiraKeysUrl_(keys);
    var capped = keys.length > JIRA_LINK_MAX_KEYS_;
    // ONE CLICK PER SIGNAL (user 2026-08-28): the PM working their own row
    // should not have to aim at a small "↗ open" — the WHOLE ROW opens the
    // queue, and the button says what happens in plain words. The key list
    // rides the button's tooltip for whoever wants to see before clicking.
    var btnTip = (capped
      ? "Opens the first " + JIRA_LINK_MAX_KEYS_ + " of " + keys.length
      : "Opens " + (keys.length === 1 ? "this epic" : "these " + keys.length)) +
      " in the Jira issue navigator, sorted by due date: " +
      keys.slice(0, 40).join(", ") + (keys.length > 40 ? ", …" : "");
    var btn = url
      ? '<a class="pmFixBtn" href="' + esc_(url) + '" target="_blank" rel="noopener" ' +
        'onclick="event.stopPropagation()" title="' + esc_(btnTip) + '">Fix in Jira ↗' +
        (capped ? ' <span class="cellSub">(first ' + JIRA_LINK_MAX_KEYS_ + ")</span>" : "") + "</a>"

        (keys.length === 1 ? " epic" : " epics") + " in Jira — the whole row is the button.") + '"' : "") + ">" +
      '<td class="tname"><span class="sigDot ' + s.sev + '">●</span> ' +
        '<span title="' + esc_(s.tip) + '">' + esc_((s.labelOf ? s.labelOf() : s.label).replace(/^● /, "")) + "</span></td>" +

  // inside the beige group row it inherited fixed-layout columns sized by
  // nothing and let the row's background bleed through — three columns
  // painting at three unrelated widths. The card carries its own surface,
  // border and colgroup, so the queue reads as one self-contained control.
  return '<div class="pmNeeds">' +
    '<div class="pmNeedsHead">Needs action ' +
      '<span class="cellSub">— fix these and next period moves. One click per signal opens ' +
      "your queue in Jira; rows overlap on purpose (one epic can be overdue AND without tasks).</span></div>" +
    '<table class="hyg pmNeedsTbl">' +
      '<colgroup><col style="width:52%"><col style="width:14%"><col style="width:34%"></colgroup>' +
      '<thead><tr><th class="tname">Signal</th>' +

/** Whole-row click → the row's own Fix-in-Jira anchor. A row that only reacts
    on a small link reads as broken to the person aiming at the signal name;
    stopPropagation on the anchor itself keeps a direct button click single. */
function pmNeedGo_(tr) {
  var a = tr && tr.querySelector && tr.querySelector("a.pmFixBtn");
  if (a) a.click();
}

/**
 * Does this epic belong to the slice the header filters select?
 *
 * The filters are universal in this project, but their vocabulary is a PERSON
 * (region, team, job family, population, search) and this tab's unit is an EPIC
 * whose owner — the PM — is not on the roster at all. So an epic is scoped by
 * the people DOING it: `owners` is the set of roster names its children are
 * assigned to, and the epic is in scope when any one of them passes.
 *
 * An epic with NO owners is unattributable, not passing: nobody on the roster is
 * assigned to any of its children. Those are counted and named on the page
 * rather than silently dropped, because they include exactly the unassigned work
 * this tab exists to surface — a filter that quietly swallows it would be worse
 * than no filter at all.
 */
function pmEpicPasses_(e) {
  if (!MODEL._pByName) {
    MODEL._pByName = {};

  }

  }

}

/** True when any header filter is narrowing the view. Used to decide whether the
    tab is showing everything (no note needed) or a slice (say what it hid). */
function pmFiltersActive_() {
  return !!(STATE.region || msActive_("team") || msActive_("pm") || msActive_("family") ||
            STATE.search || STATE.pop !== "fte" || STATE.role !== "all");
}

/** The PM's own row: a full-width group header carrying the two bars, the
    attribution split and the ranked gap line. Clicking it opens the group. */
function pmGroupRowHtml_(r, d) {
  var open = !!STATE.pmOpen[r.pm];
  var missing = r.epicN - r.epicDated;
  var ownPct = r.epicN ? Math.round(r.epicDated / r.epicN * 100) : null;
  var readyPct = r.readyDen ? Math.round(r.readyN / r.readyDen * 100) : null;
  var ownCls = missing === 0 ? "sigGood" : "sigBad";
  var span = Object.keys(PM_COLS_).length;
  // Attribution split (assignee vs Tempo-lead inference) rides in this ⓘ, off
  // the page (director feedback 2026-08-17): a director needs WHO owns the
  // work; HOW the system worked it out matters only when a row is disputed.
  var via = pmViaHtml_(r);
  var viaIcon = via ? '<span title="' + esc_(via) + '">ⓘ</span> ' : "";
