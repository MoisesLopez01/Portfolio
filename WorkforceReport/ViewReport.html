<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Company theme — same tokens as PS Dashboard.html (light surfaces,
       void headings, orbe CTAs). Status pairs reuse the PS bg/fg system. */
    :root {
      --void:    #0F1941;
      --orbe:    #058CDC;
      --ivory:   #DCCDBE;
      --cream:   #FFFAF5;
      --june:    #FF9B87;
      --success: #00A86B;
      --slate:   #64748b;
      --surface: #F8FAFC;
      --border:  #E2E8F0;
      --text:    #1E293B;
      --muted:   #94A3B8;

      --st-critical-bg: #FDECEA; --st-critical-fg: #B71C1C; /* RISK */
      --st-watch-bg:    #FFF8E1; --st-watch-fg:    #7B4800;
      --st-healthy-bg:  #F1F8F4; --st-healthy-fg:  #1B5E20; /* FACT */
      --st-champion-bg: #EEF4FF; --st-champion-fg: #0D3B8C; /* ASSUMPTION */

      --radius: 14px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
      --card-bg: #fff;
      --th-bg:   #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--surface); color: var(--text); font-size: 14px; line-height: 1.5; }
    h1, h2, .cover h1 { font-family: 'Roboto Condensed', 'Franklin Gothic Medium Cond', sans-serif; }
    a { color: var(--orbe); text-decoration: none; }

    /* ── HEADER (PS Dashboard idiom) ── */
    header { position: sticky; top: 0; z-index: 40;
             background: var(--card-bg); border-bottom: 1px solid var(--border);
             padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .hdr-title h1 { font-size: 17px; font-weight: 700; color: var(--void); line-height: 1.2; }
    .hdr-title p { font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--muted); font-weight: 600; }
    .hdr-right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .fy-badge { background: var(--orbe); color: #fff; border-radius: 99px;
                padding: 4px 12px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    button, select {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
      border-radius: 99px; font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1px solid var(--border); background: #fff; color: var(--slate);
      font-family: inherit; transition: background .15s, border-color .15s, color .15s;
    }
    button:hover { background: var(--surface); color: var(--void); }
    button:disabled { opacity: .5; cursor: default; }
    select { padding: 7px 10px; }
    .seg { display: inline-flex; gap: 2px; background: var(--surface);
           border: 1px solid var(--border); border-radius: 99px; padding: 2px; }
    .seg button { border: none; background: transparent; border-radius: 99px; padding: 4px 12px; font-size: 11px; }
    .seg button.on { background: var(--void); color: #fff; }
    .btn-cta { background: var(--orbe); border-color: var(--orbe); color: #fff; }
    .btn-cta:hover { background: #0479BE; color: #fff; }

    /* ── MAIN ── */
    main { padding: 18px 24px 60px; max-width: 1080px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: var(--shadow);
            padding: 18px 20px; margin-bottom: 14px; }
    .banner { background: #FFF4F0; border: 1px solid var(--june); color: #8a3b2b;
              border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
    .banner.err { background: var(--st-critical-bg); border-color: var(--st-critical-fg); color: var(--st-critical-fg); }
    .banner.info { background: var(--st-champion-bg); border-color: #B9CFF5; color: var(--st-champion-fg); }
    h2 { font-size: 15px; font-weight: 700; color: var(--void); margin: 0 0 10px; }
    h3 { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em;
         color: var(--muted); margin: 14px 0 4px; }
    .sub { color: var(--slate); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 6px; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
    th { background: var(--th-bg); color: var(--muted); font-weight: 700; font-size: 11px;
         text-transform: uppercase; letter-spacing: .05em; }
    tr:hover td { background: #FAFBFF; }
    .twrap { overflow-x: auto; }
    /* Section bar charts (tenure distribution etc.) */
    .bar-row { display: flex; align-items: center; gap: 10px; margin: 5px 0; }
    .bar-label { flex: 0 0 64px; font-size: 12px; color: var(--slate); text-align: right; }
    .bar-track { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; height: 16px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--orbe); border-radius: 5px 0 0 5px; min-width: 2px; }
    .bar-val { flex: 0 0 36px; font-size: 12px; font-weight: 700; color: var(--void); }
    body.dark-mode .bar-val { color: var(--text); }
    body.dark-mode .bar-track { background: var(--th-bg); }
    .chip { display: inline-block; background: var(--surface); border: 1px solid var(--border);
            color: var(--slate); border-radius: 999px; padding: 2px 10px; font-size: 12px;
            font-weight: 600; margin: 0 6px 6px 0; }

    /* FAR/N line badges — the evidence idiom of View A */
    .line { display: flex; gap: 10px; align-items: baseline; margin: 7px 0; }
    .badge { flex: 0 0 96px; text-align: center; font-size: 10px; font-weight: 800;
             letter-spacing: .06em; border-radius: 6px; padding: 2px 0; }
    .badge.FACT       { background: var(--st-healthy-bg);  color: var(--st-healthy-fg); }
    .badge.ASSUMPTION { background: var(--st-champion-bg); color: var(--st-champion-fg); }
    .badge.RISK       { background: var(--st-critical-bg); color: var(--st-critical-fg); }
    .badge.NOTE       { background: var(--surface); color: var(--slate); border: 1px solid var(--border); }

    .cover { text-align: center; padding: 44px 20px; }
    .cover h1 { font-size: 26px; color: var(--void); margin: 0 0 6px; }
    .cover .sub { font-size: 13px; }
    .ai-block { border: 1px dashed var(--orbe); border-radius: 10px; padding: 12px 14px;
                margin-top: 10px; background: var(--st-champion-bg); }
    .ai-tag { color: var(--orbe); font-size: 11px; font-weight: 800;
              text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
    .hidden { display: none !important; }
    #loading { position: fixed; inset: 0; background: rgba(248,250,252,.88);
               display: flex; align-items: center; justify-content: center; z-index: 50;
               font-size: 15px; color: var(--slate); font-weight: 600; }
    ul { margin: 6px 0; padding-left: 22px; }
    li { margin: 3px 0; }
    textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px;
               padding: 8px 10px; font: inherit; font-size: 13px; color: var(--text); }

    /* ── Dark mode (PS Dashboard body.dark-mode pattern) ── */
    body.dark-mode {
      --surface: #0B1230; --card-bg: #141C3D; --border: #2C3D78;
      --text: #E8ECF8; --muted: #8A97C0; --slate: #A8B3D6; --th-bg: #1A2450;
      --st-critical-bg: #3A2020; --st-critical-fg: #F2B8B8;
      --st-watch-bg:    #3A3220; --st-watch-fg:    #E8D9A0;
      --st-healthy-bg:  #1D3328; --st-healthy-fg:  #9FDCB4;
      --st-champion-bg: #1A2A52; --st-champion-fg: #9DB9F2;
      --shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    body.dark-mode .hdr-title h1, body.dark-mode h2, body.dark-mode .cover h1 { color: var(--text); }
    body.dark-mode button, body.dark-mode select { background: var(--card-bg); color: var(--slate); }
    body.dark-mode button:hover { background: var(--th-bg); color: var(--text); }
    body.dark-mode .seg { background: var(--th-bg); }
    body.dark-mode .seg button { background: transparent; }
    body.dark-mode .seg button.on { background: var(--orbe); color: #fff; }
    body.dark-mode .btn-cta { background: var(--orbe); color: #fff; }
    body.dark-mode tr:hover td { background: #1E295A; }
    body.dark-mode .banner { background: #3B2833; border-color: var(--june); color: #FFD8CC; }
    body.dark-mode #loading { background: rgba(11,18,48,.88); }
    body.dark-mode .ai-block { background: var(--st-champion-bg); }
    body.dark-mode .chip { background: var(--th-bg); }
    body.dark-mode textarea { background: var(--th-bg); color: var(--text); }

    /* Print — either view goes to PDF for board distribution (spec §7).
       Force the light tokens so a dark-mode session still prints clean. */
    @media print {
      body.dark-mode {
        --surface: #fff; --card-bg: #fff; --border: #E2E8F0;
        --text: #1E293B; --muted: #94A3B8; --slate: #64748b; --th-bg: #F8FAFC;
        --st-critical-bg: #FDECEA; --st-critical-fg: #B71C1C;
        --st-watch-bg:    #FFF8E1; --st-watch-fg:    #7B4800;
        --st-healthy-bg:  #F1F8F4; --st-healthy-fg:  #1B5E20;
        --st-champion-bg: #EEF4FF; --st-champion-fg: #0D3B8C;
      }
      body { background: #fff; }
      header, #loading, .noprint { display: none !important; }
      main { max-width: none; padding: 0; }
      .card { break-inside: avoid; box-shadow: none; }
      tr:hover td { background: transparent; }
      a { color: var(--text); }
    }
  </style>
</head>
<body>
<header class="noprint">
  <div class="hdr-title">
    <h1>Workforce &amp; Compensation Report</h1>
    <p id="subTitle">loading…</p>
  </div>
  <span class="fy-badge" id="fyBadge"></span>
  <div class="hdr-right">
    <div class="seg" id="viewSeg">
      <button data-view="report" class="on" onclick="switchView('report')">📄 Location report</button>
      <button data-view="brief" onclick="switchView('brief')">📊 Board brief</button>
    </div>
    <select id="scopeSel" onchange="setScope(this.value)"></select>
    <select id="fySel" onchange="setFyRange(this.value)" title="Fiscal-year comparison range">
      <option value="3">All 3 FYs</option>
      <option value="c2">Closed FYs</option>
      <option value="2">Prev + current FY</option>
      <option value="1">Current FY only</option>
    </select>
    <select id="quarterSel" onchange="setQuarter(this.value)" title="Quarterly performance view">
      <option value="0">All quarters</option>
      <option value="1">Q1 (Jul–Sep)</option>
      <option value="2">Q2 (Oct–Dec)</option>
      <option value="3">Q3 (Jan–Mar)</option>
      <option value="4">Q4 (Apr–Jun)</option>
    </select>
    <button id="exportBtn" onclick="exportDoc()" title="Export the current view to a formatted Google Doc">📄 Export Doc</button>
    <button id="confBtn" onclick="copyConfluence()" title="Copy the current view as rich text — paste straight into Confluence">📋 Copy for Confluence</button>
    <button id="themeBtn" onclick="toggleTheme()" title="Light / dark theme">🌙</button>
    <button id="refreshBtn" onclick="loadData(true)" title="Bypass cache for a live read">⟳ Refresh</button>
    <button id="accessBtn" class="hidden" onclick="toggleAccess()">🔒 Access</button>
  </div>
</header>
<main><div id="pane"></div></main>
<div id="loading">Loading workforce data…</div>

<script>
"use strict";
const USER_ROLE  = "<?= userRole ?>";
const USER_EMAIL = "<?= userEmail ?>";

const STATE = {
  data: null,          // payload for the CURRENT scope+quarter+fyCount
  scope: "company",
  quarter: 0,          // 0 = full FYs, 1–4 = fiscal-quarter view
  fyRange: "3",        // "3"/"2"/"1" trailing FYs; "c2" = the two closed FYs
  view: "report",      // "report" | "brief" | "access"
  narratives: {},      // "scope|fyCount" → validated AI narrative (View B)
  narrativeError: null,
  aiBusy: false,
  exportBusy: false,
  exportResult: null,  // {url, name} of the last Google Doc export
  cache: {},           // "scope|quarter|fyCount" → payload (client-side, per session)
};

// ── helpers ─────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtInt(n) { return (typeof n === "number" && isFinite(n)) ? Math.round(n).toLocaleString("en-US") : "—"; }
function fmtPct(x, dp) { return (typeof x === "number" && isFinite(x)) ? (x * 100).toFixed(dp == null ? 1 : dp) + "%" : "—"; }
function fmtMoney(n, code) { return (typeof n === "number" && isFinite(n)) ? Math.round(n).toLocaleString("en-US") + (code ? " " + code : "") : "—"; }
function cacheKey() { return STATE.scope + "|" + STATE.quarter + "|" + STATE.fyRange; }
function narrativeKey() { return STATE.scope + "|" + STATE.fyRange; }
function currentNarrative() { return STATE.narratives[narrativeKey()] || null; }

function lineHtml(l) {
  return '<div class="line"><span class="badge ' + esc(l.badge) + '">' + esc(l.badge) +
    '</span><span>' + esc(l.text) + '</span></div>';
}
function tableHtml(t) {
  return '<h3>' + esc(t.title) + '</h3><div class="twrap"><table><tr>' +
    t.headers.map(h => '<th>' + esc(h) + '</th>').join("") + '</tr>' +
    t.rows.map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join("") + '</tr>').join("") +
    '</table></div>';
}
function chartHtml(ch) {
  const max = Math.max.apply(null, ch.bars.map(b => b.value).concat([1]));
  return '<h3>' + esc(ch.title) + '</h3>' + ch.bars.map(b =>
    '<div class="bar-row"><span class="bar-label">' + esc(b.label) + '</span>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' +
    Math.round(b.value / max * 100) + '%"></div></div>' +
    '<span class="bar-val">' + b.value + '</span></div>').join("");
}
function sourceBanner() {
  const s = (STATE.data && STATE.data.meta.sources) || {};
  return Object.keys(s).filter(k => s[k] !== "ok").map(k =>
    '<div class="banner err">⚠️ ' + esc(k) + ' source unavailable — ' + esc(s[k]) + '</div>').join("");
}
function quarterBanner() {
  const m = STATE.data.meta;
  if (!m.quarter) return "";
  return '<div class="banner info">📅 <b>Quarterly performance view — Q' + m.quarter +
    ' of each fiscal year.</b> Applies to Workforce movement, Attrition detail and Growth by lever; ' +
    'composition, compensation structure and flag sections remain as-of snapshots.' +
    (m.quarterSkipped.length
      ? ' Not started yet: ' + m.quarterSkipped.map(esc).join(", ") + '.' : '') + '</div>';
}

// ── navigation ──────────────────────────────────────────────
function switchView(v) {
  // The Board brief works for the company OR a single country, but always in
  // FULL fiscal years — selecting it clears the quarterly filter only.
  STATE.view = v;
  if (v === "brief" && STATE.quarter !== 0) {
    STATE.quarter = 0;
    refetchOrRender();
    return;
  }
  syncHeader();
  render();
}
function setScope(scope) {
  STATE.scope = scope || "company";
  refetchOrRender();
}
function setQuarter(q) {
  STATE.quarter = parseInt(q, 10) || 0;
  if (STATE.view === "brief" && STATE.quarter !== 0) STATE.view = "report";
  refetchOrRender();
}
function setFyRange(v) {
  STATE.fyRange = String(v || "3");
  refetchOrRender();
}
function toggleTheme() {
  const dark = document.body.classList.toggle("dark-mode");
  document.getElementById("themeBtn").textContent = dark ? "☀️" : "🌙";
  try { localStorage.setItem("wr_theme", dark ? "dark" : "light"); } catch (e) { /* private mode */ }
}
function refetchOrRender() {
  const hit = STATE.cache[cacheKey()];
  if (hit) {
    STATE.data = hit;
    syncHeader();
    render();
  } else {
    loadData(false);
  }
}
function toggleAccess() {
  STATE.view = (STATE.view === "access") ? "report" : "access";
  syncHeader();
  render();
}
function syncHeader() {
  document.querySelectorAll("#viewSeg button").forEach(b =>
    b.classList.toggle("on", b.getAttribute("data-view") === STATE.view));
  const d = STATE.data;
  if (d) {
    const sel = document.getElementById("scopeSel");
    sel.innerHTML = '<option value="company">🌐 Company-wide</option>' +
      d.meta.scopes.map(s => '<option value="' + esc(s) + '"' +
        (s === STATE.scope ? " selected" : "") + '>' + esc(s) + '</option>').join("");
    sel.value = STATE.scope;
    document.getElementById("quarterSel").value = String(STATE.quarter);
    // Relabel the FY-range options with real FY labels ("FY26–FY27" beats
    // "Prev + current FY" once we know which years those are).
    // The newest FY in a "c2" payload is the last CLOSED year — anchor the
    // option labels on the true current FY either way.
    const lastFy = parseInt(d.meta.fys[d.meta.fys.length - 1].label.slice(2), 10);
    const curFy = STATE.fyRange === "c2" ? lastFy + 1 : lastFy;
    const label = v =>
      v === "1"  ? "FY" + curFy + " only" :
      v === "c2" ? "FY" + (curFy - 2) + "–FY" + (curFy - 1) + " (closed)" :
                   "FY" + (curFy - parseInt(v, 10) + 1) + "–FY" + curFy;
    const fySel = document.getElementById("fySel");
    [...fySel.options].forEach(o => { o.textContent = label(o.value); });
    fySel.value = STATE.fyRange;
    const fyRange = d.meta.fys.length === 1
      ? d.meta.fys[0].label
      : d.meta.fys[0].label + "–" + d.meta.fys[d.meta.fys.length - 1].label;
    document.getElementById("fyBadge").textContent =
      fyRange + (d.meta.quarter ? " · Q" + d.meta.quarter : "");
    document.getElementById("subTitle").textContent =
      "extracted " + d.meta.asOf + " · " + (d.meta.fromCache ? "cached" : "live") + " · " + USER_ROLE;
  }
  document.getElementById("accessBtn").classList.toggle("hidden", USER_ROLE !== "admin");
  document.getElementById("exportBtn").disabled = STATE.exportBusy;
  document.getElementById("exportBtn").textContent =
    STATE.exportBusy ? "📄 Exporting…" : "📄 Export Doc";
}

// ── data load ───────────────────────────────────────────────
function loadData(force) {
  document.getElementById("loading").classList.remove("hidden");
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onLoadError)
    .getWorkforceReportData(STATE.scope, !!force, STATE.quarter, STATE.fyRange);
}
function onData(raw) {
  let d = raw;
  if (typeof raw === "string") {
    try { d = JSON.parse(raw); } catch (e) { onLoadError(e); return; }
  }
  if (!d || !d.ok) { onLoadError(new Error((d && d.error) || "Unknown load failure")); return; }
  STATE.data = d;
  STATE.scope = d.meta.scope;     // server may degrade an unknown scope to company
  STATE.quarter = d.meta.quarter; // and echoes the applied quarter + FY range
  STATE.fyRange = d.meta.fyRange || String(d.meta.fyCount || 3);
  STATE.cache[cacheKey()] = d;
  document.getElementById("loading").classList.add("hidden");
  syncHeader();
  render();
}
function onLoadError(err) {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("pane").innerHTML =
    '<div class="banner err">❌ Could not load the report: ' + esc((err && err.message) || err) + '</div>';
}

function render() {
  const el = document.getElementById("pane");
  if (!STATE.data) return;
  if (STATE.view === "access") { renderAccess(el); return; }
  if (STATE.view === "brief")  { renderBrief(el);  return; }
  renderReport(el);
}

// ── View A — Location report (FAR/N evidence layer) ─────────
function renderReport(el) {
  const d = STATE.data, r = d.report;
  const scopeLabel = r.scope === "company" ? "Company-wide" : r.scope;
  el.innerHTML =
    sourceBanner() + exportBanner() + errorBanner() + quarterBanner() +
    '<div class="card cover"><h1>Workforce &amp; Compensation Report — ' + esc(scopeLabel) + '</h1>' +
    '<div class="sub">' + d.meta.fys.map(f => f.label).join(" · ") +
    (d.meta.quarter ? ' · Q' + d.meta.quarter + ' view' : '') +
    ' · data extracted on ' + esc(d.meta.asOf) + ' · figures in ' + esc(r.currency.code) + '</div></div>' +
    r.sections.map(s =>
      '<div class="card"><h2>' + esc(s.title) + '</h2>' +
      s.lines.map(lineHtml).join("") +
      (s.charts || []).map(chartHtml).join("") +
      (s.tables || []).map(tableHtml).join("") +
      '</div>').join("");
}

// ── View B — Board brief (synthesis layer) ──────────────────
function aiBlock(id, bodyHtml) {
  return '<div class="ai-block" id="' + id + '"><div class="ai-tag">✨ AI synthesis — generated text, ' +
    'figures come from the computed report</div>' + bodyHtml + '</div>';
}
function aiPlaceholder(what) {
  return '<span class="sub">' + (STATE.aiBusy
    ? "Generating…"
    : what + ' not generated yet — use the ✨ button above.') + '</span>';
}
function narrativeControls() {
  const has = !!currentNarrative();
  return '<div class="noprint" style="margin-bottom:14px">' +
    '<button class="btn-cta" onclick="generateNarrative(' + (has ? "true" : "false") + ')"' +
    (STATE.aiBusy ? " disabled" : "") + '>' +
    (STATE.aiBusy ? "✨ Generating…" : has ? "↻ Regenerate AI synthesis" : "✨ Generate AI synthesis") +
    '</button> <span class="sub">Gemini receives computed aggregates only — never names or individual compensation. ' +
    'The brief renders fully without it.</span></div>';
}
function generateNarrative(force) {
  if (STATE.aiBusy) return;
  STATE.aiBusy = true;
  const key = narrativeKey();
  render();
  google.script.run
    .withSuccessHandler(raw => {
      STATE.aiBusy = false;
      let d = raw;
      try { if (typeof raw === "string") d = JSON.parse(raw); } catch (e) { d = null; }
      if (d && d.ok) STATE.narratives[key] = d.narrative;
      else STATE.narrativeError = String((d && d.error) || "Narrative generation failed.");
      render();
    })
    .withFailureHandler(err => {
      STATE.aiBusy = false;
      STATE.narrativeError = String((err && err.message) || err);
      render();
    })
    .getBriefNarrative(!!force, STATE.scope, STATE.fyRange);
}

// ── Google Doc export (current view + filters) ──────────────
function exportDoc() {
  if (STATE.exportBusy) return;
  STATE.exportBusy = true;
  STATE.exportResult = null;
  syncHeader();
  const view = STATE.view === "brief" ? "brief" : "report";
  google.script.run
    .withSuccessHandler(raw => {
      STATE.exportBusy = false;
      let d = raw;
      try { if (typeof raw === "string") d = JSON.parse(raw); } catch (e) { d = null; }
      if (d && d.ok) STATE.exportResult = { url: d.url, name: d.name };
      else STATE.narrativeError = "Export failed: " + ((d && d.error) || "unknown error");
      syncHeader();
      render();
    })
    .withFailureHandler(err => {
      STATE.exportBusy = false;
      STATE.narrativeError = "Export failed: " + ((err && err.message) || err);
      syncHeader();
      render();
    })
    .exportReportToDoc(STATE.scope, STATE.quarter, STATE.fyRange, view);
}
function dismissExport() {
  STATE.exportResult = null;
  render();
}

// ── Copy for Confluence — rich HTML on the clipboard (PS_Post idiom) ────────
function copyConfluence() {
  if (STATE.confBusy) return;
  STATE.confBusy = true;
  const btn = document.getElementById("confBtn");
  btn.disabled = true;
  btn.textContent = "📋 Building…";
  const view = STATE.view === "brief" ? "brief" : "report";
  const done = (label) => {
    STATE.confBusy = false;
    btn.disabled = false;
    btn.textContent = label;
    setTimeout(() => { btn.textContent = "📋 Copy for Confluence"; }, 2500);
  };
  google.script.run
    .withSuccessHandler(raw => {
      let d = raw;
      try { if (typeof raw === "string") d = JSON.parse(raw); } catch (e) { d = null; }
      if (!d || !d.ok) {
        STATE.narrativeError = (d && d.error) || "Copy failed.";
        done("📋 Copy for Confluence");
        render();
        return;
      }
      done(copyHtmlToClipboard(d.html) ? "✅ Copied — paste in Confluence" : "❌ Copy blocked");
    })
    .withFailureHandler(err => {
      STATE.narrativeError = "Copy failed: " + ((err && err.message) || err);
      done("📋 Copy for Confluence");
      render();
    })
    .getConfluenceMarkup(STATE.scope, STATE.quarter, STATE.fyRange, view);
}

// Rich-text copy: a hidden contenteditable selection + execCommand keeps the
// text/html flavor on the clipboard, which the Confluence editor converts to
// native headings/tables on paste (works inside the GAS iframe sandbox).
function copyHtmlToClipboard(html) {
  const host = document.createElement("div");
  host.setAttribute("contenteditable", "true");
  host.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0;";
  host.innerHTML = html;
  document.body.appendChild(host);
  const range = document.createRange();
  range.selectNodeContents(host);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(host);
  return ok;
}
function exportBanner() {
  if (!STATE.exportResult) return "";
  return '<div class="banner info noprint">📄 <b>Google Doc created:</b> ' +
    '<a href="' + esc(STATE.exportResult.url) + '" target="_blank" rel="noopener">' +
    esc(STATE.exportResult.name) + ' ↗</a> ' +
    '<button style="float:right;padding:1px 8px" onclick="dismissExport()">✕</button></div>';
}
function errorBanner() {
  if (!STATE.narrativeError) return "";
  const html = '<div class="banner err noprint">⚠️ ' + esc(STATE.narrativeError) + '</div>';
  STATE.narrativeError = null;
  return html;
}

function renderBrief(el) {
  const d = STATE.data, b = d.brief;
  if (!b) {
    // Self-recover: the brief needs a full-FY payload. Clear the quarterly
    // filter and refetch ONCE; if the payload still has no brief (stale
    // server deployment), offer an explicit reload — never a dead end.
    if (!STATE.briefRetry) {
      STATE.briefRetry = true;
      STATE.quarter = 0;
      refetchOrRender();
      return;
    }
    el.innerHTML = '<div class="banner err">Board brief data missing from this payload. ' +
      '<button style="margin-left:8px" onclick="STATE.briefRetry=false;STATE.quarter=0;loadData(true)">' +
      '⟳ Load board brief</button></div>';
    return;
  }
  STATE.briefRetry = false;
  const n = currentNarrative();
  const fyNow = d.meta.fys[d.meta.fys.length - 1].label;
  const g = b.glance;
  const cur = b.currency.code;
  const dimLabel = b.dim.label;
  const isCompany = b.scope === "company";

  // 1 · Cover
  let html = sourceBanner() + exportBanner() + errorBanner() + narrativeControls() +
    '<div class="card cover"><h1>' + esc(isCompany ? "Global" : b.scope) +
    ' Workforce &amp; Compensation Review · ' + esc(fyNow) + '</h1>' +
    '<div class="sub">ServiceRocket · ' + d.meta.fys.map(f => f.label).join(" – ") +
    ' · data extracted on ' + esc(d.meta.asOf) + ' · figures in ' + esc(cur) + '</div></div>';

  // 2 · Executive summary (AI)
  html += '<div class="card"><h2>2 · Executive summary</h2>' +
    aiBlock("aiExec", n && n.execSummary.length
      ? '<ul>' + n.execSummary.map(s => '<li>' + esc(s) + '</li>').join("") + '</ul>'
      : aiPlaceholder("Executive summary")) + '</div>';

  // 3 · At a glance
  html += '<div class="card"><h2>3 · ' + esc(isCompany ? "Company" : b.scope) + ' at a glance</h2>' +
    '<span class="chip">' + fmtInt(g.headcount) + ' active regular employees</span>' +
    (g.interns ? '<span class="chip">' + fmtInt(g.interns) + ' interns (reported separately)</span>' : "") +
    '<span class="chip">TCC envelope ' + fmtMoney(g.tccEnvelope, cur) + '</span>' +
    (g.missingComp ? '<span class="chip">' + fmtInt(g.missingComp) + ' missing a comp value (headcount only)</span>' : "") +
    (g.byLocation.length > 1
      ? tableHtml({ title: "Headcount by location", headers: ["Key Location", "Headcount"],
          rows: g.byLocation.map(x => [x.key, x.count]) })
      : "") +
    tableHtml({ title: "Headcount by function", headers: ["Department", "Headcount"],
      rows: g.byDept.map(x => [x.key, x.count]) }) + '</div>';

  // 4 · Movement & attrition
  html += '<div class="card"><h2>4 · Movement &amp; attrition</h2>' +
    tableHtml({ title: "Movement by fiscal year",
      headers: ["FY", "Hires", "Exits", "Net", "Attrition rate"],
      rows: b.movement.scopeTotals.map(m => [m.label + (m.inProgress ? " (to date)" : ""),
        m.hires, m.exits, (m.net >= 0 ? "+" : "") + m.net, fmtPct(m.rate)]) }) +
    tableHtml({ title: "Regretted-attrition trend",
      headers: ["FY", "Regretted", "Exits", "Regretted share"],
      rows: b.movement.regrettedTrend.map(t => [t.label, t.regretted, t.exits, fmtPct(t.pct, 0)]) }) +
    tableHtml({ title: "Per-" + dimLabel.toLowerCase() + " matrix (" + esc(fyNow) + " column last)",
      headers: [dimLabel].concat(d.meta.fys.map(f => f.label + " exits (rate)")),
      rows: b.movement.byGroup.map(L => [L.key].concat(
        L.perFy.map(p => p.exits + " (" + fmtPct(p.rate) + ")"))) }) + '</div>';

  // 5 · The retention signal
  html += '<div class="card"><h2>5 · The retention signal</h2>' +
    '<div class="sub">Where regretted loss concentrates across ' +
    d.meta.fys.map(f => f.label).join("–") + ' — computed crosstab, largest first.</div>' +
    (b.retention.length
      ? tableHtml({ title: "Regretted leavers: level × tenure × reason",
          headers: ["Level", "Tenure", "Reason", "Count"],
          rows: b.retention.map(r => [r.level, r.tenureBucket, r.reason, r.count]) })
      : '<p class="sub">No regretted exits recorded in the window.</p>') + '</div>';

  // 6 · Compensation strategy
  html += '<div class="card"><h2>6 · Compensation strategy</h2>' +
    '<div class="sub">Promotions vs adjustments, FY-over-FY (company scope, growth is currency-free).</div>' +
    tableHtml({ title: "Growth by lever",
      headers: ["FY", "Promotions", "Promo growth", "Adjustments", "Adjustment growth"],
      rows: b.levers.map(v => [v.label + (v.inProgress ? " (to date)" : ""),
        v.promo.count, fmtPct(v.promo.growthPct), v.adjust.count, fmtPct(v.adjust.growthPct)]) }) + '</div>';

  // 7 · Structural risks (computed candidates only)
  html += '<div class="card"><h2>7 · Structural risks</h2>' +
    '<div class="sub">Computed candidates only — thresholds live in CONFIG_WR, echoed by the server.</div>' +
    (b.structuralRisks.length
      ? '<ul>' + b.structuralRisks.map(r =>
          '<li><b>' + esc(r.title) + '</b> — ' + esc(r.detail) + '</li>').join("") + '</ul>'
      : '<p class="sub">No structural-risk candidate fired at current thresholds.</p>') + '</div>';

  // 8 · Spotlights (locations company-wide; departments for a single country)
  html += '<div class="card"><h2>8 · ' + esc(dimLabel) + ' spotlights</h2>' +
    tableHtml({ title: "Comparison matrix (" + esc(fyNow) + ")",
      headers: [dimLabel, "Headcount", "Attrition", "Regretted", "Avg TCC (" + esc(cur) + ")", "Promo rate", "Flag"],
      rows: b.spotlights.map(s => [s.key, s.headcount, fmtPct(s.attritionRate),
        fmtPct(s.regrettedPct, 0), fmtInt(s.avgComp), fmtPct(s.promoRate),
        (n && n.spotlightFlags && n.spotlightFlags[s.key]) || s.candidates[0]]) }) +
    '<div class="sub">Flags are selected from each ' + esc(dimLabel.toLowerCase()) +
    '’s computed candidate list' +
    (n ? " (✨ AI-selected)" : " (first candidate shown until AI synthesis runs)") + '.</div></div>';

  // 9 · Decisions for the board (AI draft)
  html += '<div class="card"><h2>9 · Decisions for the board</h2>' +
    aiBlock("aiDecisions", n && n.decisions.length
      ? '<ul>' + n.decisions.map(dd =>
          '<li><b>' + esc(dd.title) + '</b>' + (dd.rationale ? ' — ' + esc(dd.rationale) : '') + '</li>').join("") + '</ul>' +
        '<div class="sub">Draft only — AI-generated for discussion, not a recommendation of record.</div>'
      : aiPlaceholder("Board-decision draft")) + '</div>';

  // 10 · Appendix — location reports (same app, scope switch)
  html += '<div class="card"><h2>10 · Appendix — location reports</h2>' +
    '<div class="sub">Each opens the FAR/N evidence report for that location.</div><p style="margin-top:8px">' +
    b.appendix.map(loc =>
      '<button class="noprint" style="margin:0 6px 6px 0" onclick="openLocation(\'' +
      esc(loc).replace(/'/g, "\\'") + '\')">' + esc(loc) + ' ↗</button>').join("") + '</p></div>';

  el.innerHTML = html;
}
function openLocation(loc) {
  STATE.view = "report";
  setScope(loc);
}

// ── 🔒 Access (admin only) ──────────────────────────────────
function renderAccess(el) {
  el.innerHTML = '<div class="card"><h2>🔒 Access control</h2><div class="sub">loading…</div></div>';
  google.script.run
    .withSuccessHandler(s => {
      el.innerHTML =
        '<div class="card"><h2>🔒 Access control</h2>' +
        '<div class="sub">One email per line. Bootstrap admin <b>' + esc(s.bootstrapAdmin) +
        '</b> is always an admin and cannot be removed here. Saving busts the report cache.</div>' +
        '<h3>Admins</h3><textarea id="accAdmins" rows="4">' +
        esc(s.admins.join("\n")) + '</textarea>' +
        '<h3>Viewers (board emails go here at share time)</h3>' +
        '<textarea id="accViewers" rows="6">' +
        esc(s.viewers.join("\n")) + '</textarea>' +
        '<p style="margin-top:10px"><button class="btn-cta" onclick="saveAccess()">💾 Save</button> ' +
        '<button onclick="toggleAccess()">← Back to the report</button></p>' +
        '<div id="accMsg" class="sub" style="margin-top:8px"></div></div>';
    })
    .withFailureHandler(err => {
      el.innerHTML = '<div class="banner err">❌ ' + esc((err && err.message) || err) + '</div>';
    })
    .getReportAccessSettings();
}
function saveAccess() {
  const lines = id => document.getElementById(id).value
    .split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  document.getElementById("accMsg").textContent = "Saving…";
  google.script.run
    .withSuccessHandler(() => { document.getElementById("accMsg").textContent = "✅ Saved — cache busted."; })
    .withFailureHandler(err => {
      document.getElementById("accMsg").textContent = "❌ " + ((err && err.message) || err);
    })
    .saveReportAccessSettings({ admins: lines("accAdmins"), viewers: lines("accViewers") });
}

// ── boot ────────────────────────────────────────────────────
try {
  if (localStorage.getItem("wr_theme") === "dark") {
    document.body.classList.add("dark-mode");
    document.getElementById("themeBtn").textContent = "☀️";
  }
} catch (e) { /* private mode — default light */ }
loadData(false);
</script>
